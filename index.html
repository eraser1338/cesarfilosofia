}
function save(){ try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){memOnly=true;} }
function today(){return new Date().toISOString().slice(0,10);}
function yesterday(){const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10);}

/* ---------------- utilidades ---------------- */
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isDark(){ const t=S.prefs.theme; if(t==='dark')return true; if(t==='light')return false; return matchMedia('(prefers-color-scheme: dark)').matches; }
function col(id){ const c=COLORS[id]||{l:'#898781',d:'#898781'}; return isDark()?c.d:c.l; }
function subj(id){ return DATA.find(s=>s.id===id); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),2500); }
function levelOf(xp){ let i=0; for(let k=0;k<LEVELS.length;k++) if(xp>=LEVELS[k][0]) i=k; return i; }

function gainXP(n){
  const before=levelOf(S.xp);
  S.xp+=n;
  const d=today();
  if(S.today.day!==d){S.today={day:d,xp:0};}
  S.today.xp+=n;
  if(S.streak.last!==d){
    S.streak.n = (S.streak.last===yesterday()) ? S.streak.n+1 : 1;
    S.streak.last=d;
    if(S.streak.n>1) toast('🔥 Racha: '+S.streak.n+' días');
  }
  const after=levelOf(S.xp);
  toast('✦ +'+n+' XP');
  if(after>before) setTimeout(()=>toast('🏛️ Nivel '+(after+1)+': '+LEVELS[after][1]),500);
  save(); renderHeader();
}

/* dominio: cards → box 0..3 ; preguntas → level 0..3 */
function cardBox(id){ return (S.cards[id]&&S.cards[id].b)||0; }
function qLevel(id){ return (S.qs[id]&&S.qs[id].l)||0; }
function masteryCards(ids){ let t=0,g=0; ids.forEach(sid=>{ subj(sid).cards.forEach(c=>{t+=3; g+=cardBox(c.id);}); }); return t? g/t : 0; }
function masteryQs(ids){ let t=0,g=0; ids.forEach(sid=>{ subj(sid).preguntas.forEach(p=>{t+=3; g+=qLevel(p.id);}); }); return t? g/t : 0; }
const pct=x=>Math.round(x*100)+'%';

/* ---------------- header / tema ---------------- */
function applyTheme(){ document.documentElement.setAttribute('data-theme', isDark()?'dark':'light'); }
function renderHeader(){
  $('#streakv').textContent=(S.streak.last===today()||S.streak.last===yesterday())?S.streak.n:0;
  $('#xpv').textContent=S.xp;
}

/* ---------------- navegación ---------------- */
let cur='inicio';
function show(s){
  cur=s;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.s===s));
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));
  $('#s-'+s).classList.add('on');
  if(s==='inicio') renderInicio();
  if(s==='cards') renderCards();
  if(s==='sim') renderSim();
  window.scrollTo({top:0});
}

/* ================= INICIO ================= */
function renderInicio(){
  const li=levelOf(S.xp);
  $('#lvln').textContent=li+1; $('#lvlt').textContent=LEVELS[li][1];
  const base=LEVELS[li][0], next=LEVELS[li+1]?LEVELS[li+1][0]:null;
  $('#xplbl').textContent=S.xp+' XP';
  $('#xpnext').textContent= next? (next-S.xp)+' XP para '+LEVELS[li+1][1] : 'Nivel máximo';
  $('#xpfill').style.width= next? Math.min(100,Math.round((S.xp-base)/(next-base)*100))+'%' : '100%';
  const q=QUOTES[new Date().getDate()%QUOTES.length];
  $('#quote').innerHTML='«'+esc(q[0])+'»<span class="who">— '+esc(q[1])+'</span>';
  $('#t-streak').textContent=(S.streak.last===today()||S.streak.last===yesterday())?S.streak.n:0;
  $('#t-today').textContent=(S.today.day===today())?S.today.xp:0;
  $('#t-cards').textContent=pct(masteryCards(DATA.map(s=>s.id)));
  $('#t-qs').textContent=pct(masteryQs(DATA.map(s=>s.id)));
  const nc=DATA.reduce((a,s)=>a+s.cards.length,0), nq=DATA.reduce((a,s)=>a+s.preguntas.length,0);
  $('#footinfo').textContent='Construida con tus guías y exámenes reales 2020–2026 · '+nc+' cards · '+nq+' preguntas de examen'+(memOnly?' · ⚠ sin almacenamiento: exporta tu progreso desde ⚙':'');
  $('#subjlist').innerHTML=DATA.map(s=>{
    const c=col(s.id), mc=masteryCards([s.id]), mq=masteryQs([s.id]);
    return `<div class="subj card-ui" style="--c:${c}">
      <div class="info">
        <div class="nm">${ICONS[s.id]||''} ${esc(s.nombre)}</div>
        <div class="fmt">${esc(s.formatoExamen)}</div>
        <div class="mrow"><span style="width:70px">Cards</span><div class="meter"><i style="--c:${c}; width:${mc*100}%"></i></div><span class="pc">${pct(mc)} · ${s.cards.length}</span></div>
        <div class="mrow"><span style="width:70px">Simulador</span><div class="meter"><i style="--c:${c}; width:${mq*100}%"></i></div><span class="pc">${pct(mq)} · ${s.preguntas.length}</span></div>
      </div>
      <div class="acts">
        <button class="sbtn" style="--c:${c}" onclick="goCards('${s.id}')">Cards</button>
        <button class="sbtn" style="--c:${c}" onclick="goSim('${s.id}')">Simulador</button>
      </div>
    </div>`;
  }).join('');
}
function goCards(id){ S.prefs.scope=[id]; save(); show('cards'); }
function goSim(id){ S.prefs.sim=id; S.prefs.tema=''; save(); show('sim'); }

/* ================= CARDS ================= */
let curCard=null, flipped=false, recentCards=[];
function renderCards(){
  const sb=$('#scopebar');
  const all=S.prefs.scope.length===DATA.length;
  sb.innerHTML='<button class="chip '+(all?'on':'')+'" id="chip-all">Todas</button>'+DATA.map(s=>{
    const on=S.prefs.scope.includes(s.id);
    return `<button class="chip ${on?'on':''}" data-id="${s.id}" style="--c:${col(s.id)}"><span class="dot"></span>${esc(s.nombreCorto)}</button>`;
  }).join('');
  $('#chip-all').onclick=()=>{ S.prefs.scope=DATA.map(s=>s.id); save(); renderCards(); };
  sb.querySelectorAll('.chip[data-id]').forEach(ch=>{
    ch.onclick=()=>{
      const id=ch.dataset.id;
      if(S.prefs.scope.includes(id)){ if(S.prefs.scope.length>1) S.prefs.scope=S.prefs.scope.filter(x=>x!==id); }
      else S.prefs.scope.push(id);
      save(); renderCards();
    };
  });
  nextCard(true);
}
function pool(){ let p=[]; S.prefs.scope.forEach(sid=>{ const s=subj(sid); s.cards.forEach(c=>p.push({...c, sid})); }); return p; }
function pickCard(){
  const p=pool(); if(!p.length) return null;
  const cand=p.filter(c=>!recentCards.includes(c.id));
  const list=cand.length?cand:p;
  const W=list.map(c=>{ const st=S.cards[c.id]; if(!st) return 6; return [8,4,2,1][st.b||0]; });
  let sum=W.reduce((a,b)=>a+b,0), r=Math.random()*sum;
  for(let i=0;i<list.length;i++){ r-=W[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
let sessCount=0;
function nextCard(reset){
  if(reset){sessCount=0;}
  curCard=pickCard(); flipped=false;
  const z=$('#cardzone');
  if(!curCard){ z.innerHTML='<div class="empty">No hay cards en esta selección.</div>'; return; }
  recentCards.push(curCard.id); if(recentCards.length>6) recentCards.shift();
  const c=col(curCard.sid), s=subj(curCard.sid), b=cardBox(curCard.id);
  const scopeM=masteryCards(S.prefs.scope);
  z.innerHTML=`
  <div class="stage">
    <div class="fcard" id="fcard" style="--c:${c}">
      <div class="face front">
        <div class="ftop"><span class="ftag" style="--c:${c}"><span class="dot"></span>${esc(s.nombreCorto)}</span><span class="ftema">${esc(curCard.tema||'')}</span></div>
        <div class="fmid">${esc(curCard.front)}</div>
        <div class="fhint">toca para voltear · [espacio]</div>
      </div>
      <div class="face back">
        <div class="ftop"><span class="ftag" style="--c:${c}"><span class="dot"></span>${esc(s.nombreCorto)}</span><span class="ftema">${esc(curCard.tema||'')}</span></div>
        <div class="fmid">${esc(curCard.back)}</div>
        <div class="fhint">¿La sabías?</div>
      </div>
    </div>
  </div>
  <div class="rate" id="rate" style="visibility:hidden">
    <button class="r0" onclick="rateCard(0)">No me la sé<span class="k">[1]</span></button>
    <button class="r1" onclick="rateCard(1)">Casi<span class="k">[2]</span></button>
    <button class="r2" onclick="rateCard(2)">La domino<span class="k">[3]</span></button>
  </div>
  <div class="sessrow">
    <span>${sessCount} repasadas en esta sesión</span>
    <span class="boxdots" title="Nivel de esta card" style="--c:${c}">${[1,2,3].map(i=>'<i class="'+(b>=i?'f':'')+'"></i>').join('')}</span>
    <span>dominio selección: ${pct(scopeM)}</span>
  </div>`;
  $('#fcard').onclick=flipCard;
}
function flipCard(){
  if(!curCard) return;
  flipped=!flipped;
  $('#fcard').classList.toggle('flip',flipped);
  $('#rate').style.visibility=flipped?'visible':'hidden';
}
function rateCard(r){
  if(!curCard||!flipped) return;
  const id=curCard.id;
  const st=S.cards[id]||{b:0,n:0};
  if(r===0) st.b=Math.max(0,(st.b||0)-1);
  if(r===1) st.b=Math.min(3,(st.b||0)+ (st.b>=2?0:1)); // "casi" nunca llega a 3
  if(r===2) st.b=Math.min(3,(st.b||0)+ ( (st.b||0)===0 ? 2 : 1));
  if(r===1&&st.b>2) st.b=2;
  st.n=(st.n||0)+1; st.t=Date.now();
  S.cards[id]=st; sessCount++;
  gainXP(r===0?1:r===1?3:5);
  nextCard(false);
}

/* ================= SIMULADOR ================= */
let curQ=null, recentQs=[];
function renderSim(){
  const z=$('#simzone');
  if(!S.prefs.sim){
    z.innerHTML='<h2 class="sec">Elige asignatura</h2><p class="small mut" style="margin-top:-4px">El simulador usa solo preguntas reales aparecidas en exámenes anteriores. Se practica por asignatura, porque cada una tiene su propio formato.</p><div class="simpick">'+DATA.map(s=>{
      const mq=masteryQs([s.id]);
      return `<button class="spick card-ui" style="--c:${col(s.id)}" onclick="goSim('${s.id}')"><div class="nm">${ICONS[s.id]||''} ${esc(s.nombre)}</div><div class="n2">${s.preguntas.length} preguntas reales · dominio ${pct(mq)}</div></button>`;
    }).join('')+'</div>';
    return;
  }
  const s=subj(S.prefs.sim), c=col(s.id);
  const temas=[...new Set(s.preguntas.map(p=>p.tema).filter(Boolean))];
  z.innerHTML=`
  <div class="simhead">
    <button class="chip" onclick="S.prefs.sim=null;save();renderSim()">‹ asignaturas</button>
    <span class="ftag" style="--c:${c}; font-weight:600"><span class="dot" style="background:${c};width:10px;height:10px;border-radius:50%;display:inline-block"></span> ${esc(s.nombre)}</span>
    <span style="flex:1"></span>
    <select id="temasel">${'<option value="">Todos los temas</option>'+temas.map(t=>`<option ${S.prefs.tema===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
    <button class="chip" id="fmtbtn">ⓘ formato</button>
  </div>
  <div class="fmtbox" id="fmtbox"><b>Formato real del examen:</b> ${esc(s.formatoExamen)}</div>
  <div id="qzone"></div>`;
  $('#temasel').onchange=e=>{ S.prefs.tema=e.target.value; save(); nextQ(); };
  $('#fmtbtn').onclick=()=>$('#fmtbox').classList.toggle('on');
  nextQ();
}
function qpool(){
  const s=subj(S.prefs.sim);
  let p=s.preguntas;
  if(S.prefs.tema) p=p.filter(q=>q.tema===S.prefs.tema);
  return p;
}
function pickQ(){
  const p=qpool(); if(!p.length) return null;
  const cand=p.filter(q=>!recentQs.includes(q.id));
  const list=cand.length?cand:p;
  const W=list.map(q=>{ const lv=qLevel(q.id); return (q.frecuencia+1)*[8,4,2,1][lv]; });
  let sum=W.reduce((a,b)=>a+b,0), r=Math.random()*sum;
  for(let i=0;i<list.length;i++){ r-=W[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
function nextQ(){
  curQ=pickQ();
  const z=$('#qzone');
  if(!curQ){ z.innerHTML='<div class="empty">No hay preguntas con este filtro.</div>'; return; }
  recentQs.push(curQ.id); if(recentQs.length>4) recentQs.shift();
  const s=subj(S.prefs.sim), c=col(s.id), q=curQ, lv=qLevel(q.id);
  const freqTxt = q.frecuencia===1? 'Ha caído 1 vez' : 'Ha caído '+q.frecuencia+' veces';
  let body='';
  if(q.tipo==='test'){
    body=`<div class="opts">${q.opciones.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answerTest(${i})">${esc(o)}</button>`).join('')}</div>
    <div class="expl" id="expl"></div>`;
  } else {
    body=`<button class="btn primary reveal" id="revealbtn" onclick="revealA()">Revelar respuesta &nbsp;[R]</button>
    <div class="answer" id="answer">
      <ul class="bullets">${(q.bullets||[]).map((b,i)=>`<li><div class="brow"><span class="bmark">•</span><span class="btxt">${esc(b.b)}${b.x?`<button class="bexp" onclick="toggleX(${i})" id="bexp${i}">ampliar +</button>`:''}</span></div>${b.x?`<div class="bx" id="bx${i}">${esc(b.x)}</div>`:''}</li>`).join('')}</ul>
      <div class="rate" style="margin-top:16px">
        <button class="r0" onclick="rateQ(0)">No la sabía<span class="k">[1]</span></button>
        <button class="r1" onclick="rateQ(1)">A medias<span class="k">[2]</span></button>
        <button class="r2" onclick="rateQ(2)">La tenía<span class="k">[3]</span></button>
      </div>
    </div>`;
  }
  z.innerHTML=`<div class="q card-ui" style="--c:${c}">
    <div class="qbadges">
      <span class="badge freq">🔁 ${freqTxt}</span>
      ${q.tema?`<span class="badge">${esc(q.tema)}</span>`:''}
      <span class="badge" title="Tu nivel en esta pregunta">${'●'.repeat(lv)||'○'}${'○'.repeat(3-lv)} dominio</span>
    </div>
    <div class="qtext">${esc(q.enunciado)}</div>
    ${q.variantes&&q.variantes.length?`<div class="qvars">También formulada como: ${q.variantes.map(esc).join(' · ')}</div>`:''}
    <div class="qapar">Convocatorias: ${q.apariciones.map(esc).join(' · ')}</div>
    ${body}
  </div>
  <div class="qnav"><button class="btn" onclick="nextQ()">Saltar →</button></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function revealA(){ $('#answer').classList.add('on'); $('#revealbtn').style.display='none'; }
function toggleX(i){ const el=$('#bx'+i); el.classList.toggle('on'); $('#bexp'+i).textContent=el.classList.contains('on')?'cerrar −':'ampliar +'; }
function answerTest(i){
  const q=curQ;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  const okBtn=document.querySelector('.opt[data-i="'+q.correcta+'"]');
  okBtn.classList.add('ok');
  const good=(i===q.correcta);
  if(!good) document.querySelector('.opt[data-i="'+i+'"]').classList.add('ko');
  const ex=$('#expl'); ex.innerHTML=(good?'✅ Correcta. ':'❌ Incorrecta — la buena es la marcada en verde. ')+esc(q.explicacion||''); ex.classList.add('on');
  bumpQ(good?2:0);
  gainXP(good?8:2);
  $('#qzone').insertAdjacentHTML('beforeend','');
  document.querySelector('.qnav .btn').textContent='Siguiente pregunta →';
}
function bumpQ(r){
  const id=curQ.id, st=S.qs[id]||{l:0,n:0};
  if(r===0) st.l=Math.max(0,(st.l||0)-1);
  if(r===1) st.l=Math.min(2,(st.l||0)+1);
  if(r===2) st.l=Math.min(3,(st.l||0)+1);
  st.n=(st.n||0)+1; st.t=Date.now();
  S.qs[id]=st; save();
}
function rateQ(r){
  bumpQ(r);
  gainXP(r===0?2:r===1?5:10);
  nextQ();
}

/* ================= ajustes ================= */
function openCfg(){
  $('#modal').innerHTML=`<h3>Ajustes</h3>
  <p>Tu progreso ${memOnly?'<b>no puede guardarse en este visor</b>: guarda tu código al terminar y restáuralo al volver.':'se guarda automáticamente en este dispositivo/navegador.'} Ojo: si abres la app como archivo local (sobre todo en móvil), el navegador puede borrar ese guardado — usa el <b>código de progreso</b> como respaldo.</p>
  <p class="small" style="margin-top:10px"><b>Código de progreso</b> — cópialo y guárdalo donde quieras (notas, un chat contigo mismo…). Para recuperar, pégalo aquí y pulsa Restaurar.</p>
  <textarea id="pcode" style="width:100%; height:74px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--ink); font-size:.72rem; padding:8px; resize:vertical" placeholder="Pulsa 'Copiar mi código' o pega aquí uno guardado"></textarea>
  <div class="mrowb">
    <button class="btn primary" onclick="copyCode()">⧉ Copiar mi código</button>
    <button class="btn" onclick="restoreCode()">↻ Restaurar</button>
  </div>
  <div class="mrowb">
    <button class="btn" onclick="exportP()">⬇ Exportar fichero</button>
    <button class="btn" onclick="$('#impfile').click()">⬆ Importar fichero</button>
    <button class="btn" style="color:var(--bad)" onclick="resetP()">Reiniciar todo</button>
  </div>
  <input type="file" id="impfile" accept=".json" style="display:none" onchange="importP(this)">
  <div class="mrowb"><button class="btn" onclick="closeCfg()">Cerrar</button></div>`;
  $('#modalbg').classList.add('on');
}
function encState(){ return 'CF1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function copyCode(){
  const code=encState(); const ta=$('#pcode'); ta.value=code;
  ta.select(); ta.setSelectionRange(0,code.length);
  const done=()=>toast('Código copiado — guárdalo en tus notas');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done).catch(()=>{ document.execCommand('copy'); done(); }); }
  else{ document.execCommand('copy'); done(); }
}
function restoreCode(){
  let v=($('#pcode').value||'').trim();
  if(!v){ toast('Pega primero un código'); return; }
  try{
    if(v.startsWith('CF1.')) v=v.slice(4);
    const st=JSON.parse(decodeURIComponent(escape(atob(v))));
    if(typeof st.xp!=='number') throw 0;
    S=Object.assign(freshState(),st); save(); toast('Progreso restaurado ✓'); closeCfg(); show('inicio');
  }catch(e){ toast('Código no válido'); }
}
function closeCfg(){ $('#modalbg').classList.remove('on'); }
function exportP(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='cesar-filosofo-progreso-'+today()+'.json'; a.click();
}
function importP(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ S=Object.assign(freshState(),JSON.parse(rd.result)); save(); toast('Progreso importado'); closeCfg(); show('inicio'); }catch(e){ toast('Fichero no válido'); } };
  rd.readAsText(f);
}
function resetP(){ if(confirm('¿Seguro? Se borra todo el progreso.')){ S=freshState(); save(); closeCfg(); show('inicio'); } }

/* ================= arranque ================= */
load(); applyTheme(); renderHeader();
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.s));
$('#go-mix').onclick=()=>{ S.prefs.scope=DATA.map(s=>s.id); save(); show('cards'); };
$('#themebtn').onclick=()=>{
  const seq=['auto','light','dark']; const i=seq.indexOf(S.prefs.theme||'auto');
  S.prefs.theme=seq[(i+1)%3]; save(); applyTheme();
  toast('Tema: '+({auto:'automático',light:'claro',dark:'oscuro'})[S.prefs.theme]);
  show(cur);
};
$('#cfgbtn').onclick=openCfg;
$('#modalbg').onclick=e=>{ if(e.target.id==='modalbg') closeCfg(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if((S.prefs.theme||'auto')==='auto'){ applyTheme(); show(cur); } });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(cur==='cards'){
    if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); flipCard(); }
    if(flipped){ if(e.key==='1')rateCard(0); if(e.key==='2')rateCard(1); if(e.key==='3')rateCard(2); }
  }
  if(cur==='sim'&&curQ){
    if(e.key==='r'||e.key==='R'){ const b=$('#revealbtn'); if(b&&b.style.display!=='none') revealA(); }
    const ans=$('#answer');
    if(ans&&ans.classList.contains('on')){ if(e.key==='1')rateQ(0); if(e.key==='2')rateQ(1); if(e.key==='3')rateQ(2); }
  }
});
show('inicio');

</script>
</body>
</html>
