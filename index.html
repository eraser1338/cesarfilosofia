all en 'El sonido del silencio'?","opciones":["La variación del habla según la clase y el género","Las clasificaciones nativas de la experiencia cotidiana","La comunicación no verbal: proxémica, gestos, miradas y silencios"],"correcta":2,"explicacion":"Gran parte de la comunicación es inconsciente y culturalmente pautada (culturas de contexto alto y bajo); los malentendidos interculturales nacen de esas gramáticas invisibles del espacio y el tiempo. (Ladrillo de: 'Tema IV: lenguaje, comunicación y cognición' y 'La burbuja personal según los Hall')"},{"id":"an1-u010","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p02","enunciado":"Según Díaz de Rada y Cruces, ¿mediante qué dos estructuras clasifican las culturas el mundo?","opciones":["Taxonomías (jerarquía de inclusión) y paradigmas (cruce de dimensiones)","Metáforas (por semejanza) y metonimias (por contigüidad)","Categorías emic (nativas) y categorías etic (analíticas)"],"correcta":0,"explicacion":"'El orden del sentido y el sentido del orden': clasificar es una actividad universal con contenidos culturales variables; las categorías nativas revelan la lógica cognitiva local. (Ladrillo de: 'Tema IV: lenguaje, comunicación y cognición')"},{"id":"an1-u011","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p02","enunciado":"¿Qué critica Pratt en '¿Por qué la Virgen de Zapopan fue a Los Ángeles?'?","opciones":["La pérdida de religiosidad de los migrantes mexicanos en EE.UU.","Los grandes relatos de una globalización homogénea y sin fronteras","El determinismo lingüístico de la hipótesis de Sapir-Whorf"],"correcta":1,"explicacion":"Frente al mito del flujo homogéneo, Pratt muestra movilidades concretas y desiguales: la Virgen viaja siguiendo a sus migrantes, que reconstruyen comunidad transnacional. (Ladrillo de: 'Tema IV: lenguaje, comunicación y cognición')"},{"id":"an1-u012","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p02","enunciado":"¿Por qué es relevante el tema IV para comprender los procesos culturales?","opciones":["Porque la lengua determina por completo el pensamiento humano","Porque la comunicación funciona igual en todas las culturas","Lenguaje, cuerpo y clasificación organizan culturalmente la experiencia"],"correcta":2,"explicacion":"Analizar la comunicación es analizar la cultura en acción; conviene aplicarlo a un fenómeno propio (WhatsApp, jerga juvenil, un mercado) integrando a los cuatro autores. (Ladrillo de: 'Tema IV: lenguaje, comunicación y cognición')"},{"id":"an1-u013","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p03","enunciado":"¿Qué estudia la sociolingüística según Kottak?","opciones":["La variación del habla en su contexto social","El origen evolutivo de la facultad del lenguaje","Las estructuras gramaticales universales innatas"],"correcta":0,"explicacion":"No hablamos igual según clase, situación o interlocutor: el habla se analiza en relación con la estructura social. (Ladrillo de: 'Estratificación social en el habla: Labov y Bourdieu')"},{"id":"an1-u014","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p03","enunciado":"En el estudio de Labov en grandes almacenes neoyorquinos, la pronunciación de la /r/ posvocálica...","opciones":["Disminuía con el estatus del establecimiento","Aumentaba con el estatus del establecimiento","Era idéntica en los tres establecimientos"],"correcta":1,"explicacion":"Comparó Saks (alto), Macy's (medio) y S. Klein (bajo) preguntando por la 'fourth floor': en las tiendas de más prestigio se pronunciaba más la /r/, variante entonces prestigiosa. (Ladrillo de: 'Estratificación social en el habla: Labov y Bourdieu')"},{"id":"an1-u015","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p03","enunciado":"Según Kottak, ¿por qué se prestigia el habla estándar?","opciones":["Porque es gramaticalmente superior a las demás","Porque resulta más clara y fácil de aprender","Porque la usan los grupos sociales dominantes"],"correcta":2,"explicacion":"Ninguna variante es intrínsecamente mejor: su valor es social, y juzgar el habla es juzgar socialmente al hablante. (Ladrillo de: 'Estratificación social en el habla: Labov y Bourdieu')"},{"id":"an1-u016","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p03","enunciado":"¿Qué hablantes tienden a la hipercorrección lingüística?","opciones":["Los de estatus intermedio, que imitan y exageran las formas de prestigio","Los de estatus más alto, para marcar distancia frente al resto","Los de estatus más bajo, presionados por la escuela obligatoria"],"correcta":0,"explicacion":"La hipercorrección consiste en copiar y llevar al extremo los rasgos del habla prestigiosa, típica de posiciones sociales intermedias e inseguras. (Ladrillo de: 'Estratificación social en el habla: Labov y Bourdieu')"},{"id":"an1-u017","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p03","enunciado":"Para Bourdieu, ¿qué es el capital simbólico?","opciones":["Dinero invertido en bienes culturales y educativos","Prestigio y reconocimiento acumulados que otorgan poder","El conjunto de símbolos sagrados de una comunidad"],"correcta":1,"explicacion":"El habla legítima es capital lingüístico que vale en 'mercados simbólicos' (escuela, empleo, administración); los desposeídos sufren violencia simbólica y naturalizan la jerarquía. (Ladrillo de: 'Estratificación social en el habla: Labov y Bourdieu')"},{"id":"an1-u018","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p03","enunciado":"¿Qué relación guarda la estratificación del habla con la estratificación social?","opciones":["Solo la refleja, sin influir en ella","Solo la produce, sin llegar a reflejarla","La refleja y contribuye a reproducirla"],"correcta":2,"explicacion":"La evaluación social de las variantes de habla expresa la jerarquía existente y, a la vez, la perpetúa en la escuela, el empleo y la vida cotidiana. (Ladrillo de: 'Estratificación social en el habla: Labov y Bourdieu')"},{"id":"an1-u019","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p04","enunciado":"Según Kottak, ¿en qué se basa la identificación étnica?","opciones":["Origen, lengua, religión o historia percibidos como compartidos","Rasgos biológicos heredados que separan subespecies humanas","La nacionalidad legal reconocida por cada Estado moderno"],"correcta":0,"explicacion":"Se apoya en similitudes percibidas con los miembros del grupo y diferencias frente a los demás; es situacional y flexible ('cambio de estatus'). (Ladrillo de: 'Etnicidad, raza y raza social según Kottak')"},{"id":"an1-u020","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p04","enunciado":"Para Kottak, la etnicidad es...","opciones":["Una esencia fija transmitida biológicamente entre generaciones","Procesual y relacional: puede reivindicarse, atribuirse o imponerse","Un rasgo exclusivo de las sociedades no industriales actuales"],"correcta":1,"explicacion":"Ejemplos de Kottak: hispanos/latinos y afroamericanos en EE.UU.; ejemplos cercanos: identidades gitana, vasca o catalana, activadas de forma distinta según la situación. (Ladrillo de: 'Etnicidad, raza y raza social según Kottak')"},{"id":"an1-u021","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p04","enunciado":"¿Por qué carece la 'raza' de validez biológica según Kottak?","opciones":["Los fenotipos humanos covarían en paquetes discretos, estables y hereditarios","Cada continente aloja una subespecie humana genéticamente bien diferenciada","La variación es clinal y hay más diversidad dentro de cada grupo que entre grupos"],"correcta":2,"explicacion":"Rasgos como el color de piel responden a adaptación por selección y no covarían en 'paquetes' raciales: no existen subespecies humanas discretas. (Ladrillo de: 'Etnicidad, raza y raza social según Kottak')"},{"id":"an1-u022","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p04","enunciado":"¿Qué es una 'raza social'?","opciones":["Una categoría racial construida culturalmente y asumida como natural","Una subespecie humana verificada por la genética de poblaciones","Una clase socioeconómica definida por el nivel de renta familiar"],"correcta":0,"explicacion":"Es una etnicidad a la que se atribuye erróneamente base biológica; prueba de su arbitrariedad: la misma persona se clasifica distinto en EE.UU., Brasil o Japón. (Ladrillo de: 'Etnicidad, raza y raza social según Kottak')"},{"id":"an1-u023","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p04","enunciado":"¿Qué ilustra la regla de la hipodescendencia ('una gota de sangre') en EE.UU.?","opciones":["Cada persona elige libremente su categoría racial en el censo","El hijo de pareja mixta se adscribe automáticamente al grupo minoritario","Los hermanos reciben siempre la misma clasificación fenotípica"],"correcta":1,"explicacion":"Contrasta con el continuo fenotípico brasileño (decenas de términos, variables incluso entre hermanos) y con los burakumin japoneses, fenotípicamente indistinguibles pero segregados. (Ladrillo de: 'Etnicidad, raza y raza social según Kottak')"},{"id":"an1-u024","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p04","enunciado":"Llamar 'inmigrante' a un vecino racializado nacido en España ejemplifica...","opciones":["Un uso jurídicamente exacto del término","La etnicidad como elección personal libre","Cómo la raza social etniza y excluye"],"correcta":2,"explicacion":"La categoría racial construida se impone sobre el hecho del nacimiento, mostrando el carácter cultural y excluyente de la clasificación. (Ladrillo de: 'Etnicidad, raza y raza social según Kottak')"},{"id":"an1-u025","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p05","enunciado":"¿A quién corresponde la definición clásica de cultura de 1871 como 'todo complejo que incluye conocimientos, creencias...'?","opciones":["Edward B. Tylor","Franz Boas","Bronislaw Malinowski"],"correcta":0,"explicacion":"Tylor definió la cultura como todo complejo que incluye conocimientos, creencias, arte, moral, derecho y costumbres adquiridos como miembro de la sociedad. (Ladrillo de: 'Dimensiones del concepto de cultura según Kottak')"},{"id":"an1-u026","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p05","enunciado":"¿Cómo se adquiere la cultura según Kottak?","opciones":["Por herencia genética compartida por toda la especie humana","Por enculturación, consciente e inconsciente, no por herencia genética","Solo mediante instrucción escolar formal, explícita y deliberada"],"correcta":1,"explicacion":"La capacidad de aprender cualquier cultura es biológica y universal; lo que varía es el contenido transmitido socialmente en cada grupo. (Ladrillo de: 'Dimensiones del concepto de cultura según Kottak')"},{"id":"an1-u027","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p05","enunciado":"Decir que la cultura es simbólica significa que...","opciones":["Se expresa únicamente mediante objetos religiosos, sagrados y ceremoniales","Sus significados derivan de forma natural de las propiedades de las cosas","Descansa en signos arbitrarios y convencionales, sin relación necesaria con lo representado"],"correcta":2,"explicacion":"El lenguaje es el ejemplo máximo; también banderas, agua bendita o marcas. White y Geertz sitúan en el símbolo la clave de lo humano. (Ladrillo de: 'Dimensiones del concepto de cultura según Kottak')"},{"id":"an1-u028","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p05","enunciado":"Que la cultura es compartida y 'todo lo abarca' implica, para Kottak, que...","opciones":["Cuentan también el fútbol, la comida o los memes, no solo la 'alta cultura'","Solo las bellas artes y la ciencia constituyen verdadera cultura","Cada individuo posee una cultura privada, propia e intransferible"],"correcta":0,"explicacion":"Es atributo de individuos como miembros de grupos y se apropia de la naturaleza: las necesidades biológicas se moldean culturalmente. (Ladrillo de: 'Dimensiones del concepto de cultura según Kottak')"},{"id":"an1-u029","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p05","enunciado":"¿Qué significa que la cultura está pautada e integrada?","opciones":["Sus rasgos son piezas sueltas sin relación estable entre sí","Sus elementos forman sistemas: si uno cambia, otros cambian también","Sus normas escritas se cumplen siempre de manera mecánica"],"correcta":1,"explicacion":"Existen además valores centrales que articulan el conjunto del sistema cultural. (Ladrillo de: 'Dimensiones del concepto de cultura según Kottak')"},{"id":"an1-u030","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p05","enunciado":"Kottak distingue cultura ideal y cultura real para subrayar que...","opciones":["Las normas declaradas coinciden siempre con la conducta observada","Solo las élites tienen capacidad real de innovación cultural","Las personas no siguen las reglas mecánicamente: las manipulan y transforman"],"correcta":2,"explicacion":"La cultura es adaptativa (a veces maladaptativa), opera en niveles internacional, nacional y de subculturas, y los individuos la usan creativamente (práctica). (Ladrillo de: 'Dimensiones del concepto de cultura según Kottak')"},{"id":"an1-u031","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p05","enunciado":"¿Se puede analizar el 'botellón' con el concepto antropológico de cultura?","opciones":["Sí: es práctica aprendida, compartida, simbólica y pautada de una subcultura juvenil","No: la antropología solo estudia prácticas tradicionales, rurales y exóticas","Solo si es declarado oficialmente patrimonio cultural inmaterial protegido"],"correcta":0,"explicacion":"Es un ritual de sociabilidad con reglas, espacios y significados propios (transgresión, pertenencia, edad): la cultura abarca también prácticas informales y polémicas. (Ladrillo de: 'Dimensiones del concepto de cultura según Kottak')"},{"id":"an1-u032","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p06","enunciado":"¿Cuál es la estrategia básica de producción de datos de la antropología?","opciones":["La encuesta estadística sobre muestras representativas","La observación participante en trabajo de campo prolongado","El análisis documental de fuentes históricas y archivos"],"correcta":1,"explicacion":"El etnógrafo convive con el grupo y produce datos desde dentro, combinando implicación y distancia; la etnografía es a la vez método y género de escritura. (Ladrillo de: 'Especificidad metodológica de la antropología')"},{"id":"an1-u033","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p06","enunciado":"¿Cuál de estas es una técnica etnográfica señalada por Kottak?","opciones":["El experimento de laboratorio","La regresión estadística múltiple","El método genealógico"],"correcta":2,"explicacion":"Junto a observación participante, entrevistas dirigidas y abiertas, informantes clave, historias de vida, encuestas y estudios longitudinales; combina además las perspectivas emic y etic. (Ladrillo de: 'Especificidad metodológica de la antropología')"},{"id":"an1-u034","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p06","enunciado":"Según Peacock, el método antropológico...","opciones":["Implica dilemas irresolubles y carece de recetario fijo","Sigue una fórmula fija y comprobada de trabajo de campo","Elimina la subjetividad mediante protocolos estandarizados"],"correcta":0,"explicacion":"Dilemas de implicación/distanciamiento, subjetividad/objetividad, particularización/generalización e inducción/deducción; metáfora de 'la luz y el arpón': el rigor está en gestionarlos reflexivamente. (Ladrillo de: 'Especificidad metodológica de la antropología')"},{"id":"an1-u035","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p06","enunciado":"¿Qué descubre Bohannan al contar Hamlet a los tiv en 'Shakespeare en la selva'?","opciones":["Que Hamlet posee un significado universal evidente para todos","Que la interpretación depende del marco cultural de cada audiencia","Que los tiv carecían de categorías para comprender relatos ajenos"],"correcta":1,"explicacion":"Los ancianos tiv reinterpretan la obra desde levirato, brujería y presagios: la traducción cultural exige conocer las categorías nativas y vigilar el etnocentrismo. (Ladrillo de: 'Especificidad metodológica de la antropología')"},{"id":"an1-u036","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p06","enunciado":"En el trabajo de campo, el relativismo metodológico de Brown funciona como...","opciones":["Compromiso ético de aprobar toda práctica local que se observe","Teoría que declara incomparables las racionalidades de las culturas","Herramienta central para comprender, sin implicar relativismo moral absoluto"],"correcta":2,"explicacion":"Suspender el juicio para comprender es la herramienta central del oficio: comprender no es justificar. (Ladrillo de: 'Especificidad metodológica de la antropología')"},{"id":"an1-u037","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p06","enunciado":"Según Keesing, ¿qué relación guardan teoría y método en antropología?","opciones":["Son inseparables: las teorías orientan qué se observa y cómo se explica","Son independientes: el campo produce datos teóricamente neutros","La teoría solo interviene después de concluir el trabajo de campo"],"correcta":0,"explicacion":"Las teorías de la cultura (adaptacionistas e ideacionales) determinan qué se mira y cómo se interpreta lo observado. (Ladrillo de: 'Especificidad metodológica de la antropología')"},{"id":"an1-u038","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p06","enunciado":"Según el código de la AAA, ¿cuál es la primera responsabilidad del antropólogo?","opciones":["Hacia la institución que financia la investigación","Hacia las personas y comunidades estudiadas","Hacia el avance del conocimiento científico"],"correcta":1,"explicacion":"Consentimiento informado, no dañar, reciprocidad y anonimato, con especial cuidado ante comunidades vulnerables: la deontología antepone a los sujetos estudiados. (Ladrillo de: 'Especificidad metodológica de la antropología')"},{"id":"an1-u039","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p07","enunciado":"¿Cómo define Wallace la religión, según Kottak?","opciones":["Sistema de normas morales sancionadas por la autoridad estatal","Conjunto de mitos compartidos sobre el origen del cosmos","Creencias y ritos referidos a seres y poderes sobrenaturales"],"correcta":2,"explicacion":"Junto a animismo (Tylor), mana y tabú; la religión cumple funciones explicativas, emocionales (ansiedad, Malinowski), sociales (cohesión, control) y ecológicas (vacas sagradas, Harris). (Ladrillo de: 'Tema V: antropología simbólica aplicada')"},{"id":"an1-u040","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p07","enunciado":"¿Qué fases tienen los ritos de paso según Van Gennep?","opciones":["Separación, margen (liminalidad) y agregación","Iniciación, sacrificio y comunión colectiva","Preparación, clímax y disolución festiva"],"correcta":0,"explicacion":"El ritual es conducta formal, estereotipada, repetitiva y performativa; Turner añade la communitas, comunión igualitaria e intensa entre los liminares. (Ladrillo de: 'Tema V: antropología simbólica aplicada')"},{"id":"an1-u041","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p07","enunciado":"Según Turner, ¿qué propiedades caracterizan a los símbolos dominantes del ritual ndembu?","opciones":["Univocidad, literalidad y transparencia referencial","Condensación, unificación de referentes y polarización de sentido","Arbitrariedad, desplazamiento y productividad combinatoria"],"correcta":1,"explicacion":"El árbol mudyi (savia lechosa) significa a la vez leche materna y matrilinaje: lo sensorial carga de emoción a la norma social. (Ladrillo de: 'Tema V: antropología simbólica aplicada' y 'Símbolos rituales según Turner')"},{"id":"an1-u042","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p07","enunciado":"¿Cómo propone Finnegan estudiar la música?","opciones":["Como obra abstracta analizable únicamente desde la partitura","Como lenguaje universal idéntico en todas las culturas humanas","Como práctica social situada: 'senderos' musicales cotidianos y amateurs"],"correcta":2,"explicacion":"Contra la visión de la música como obra abstracta, propone atender a bandas, coros y ensayos: el arte como acción social organizada colectivamente. (Ladrillo de: 'Tema V: antropología simbólica aplicada')"},{"id":"an1-u043","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p07","enunciado":"Para la antropología simbólica, ¿qué son el folklore y el patrimonio?","opciones":["Metadiscursos modernos que seleccionan y sacralizan expresiones como 'herencia'","Restos materiales de las culturas ya desaparecidas o en extinción","Sinónimos técnicos de la cultura popular espontánea y anónima"],"correcta":0,"explicacion":"Son operaciones modernas de selección que convierten ciertas expresiones culturales en herencia colectiva legitimada. (Ladrillo de: 'Tema V: antropología simbólica aplicada')"},{"id":"an1-u044","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p07","enunciado":"En unas fiestas patronales, la declaración de Interés Turístico ejemplifica...","opciones":["La fase de separación del rito","La patrimonialización de la fiesta","El polo sensorial del símbolo"],"correcta":1,"explicacion":"En el análisis tipo, el santo condensa identidad local (polo ideológico) y emoción festiva (polo sensorial), y la procesión funciona como rito de paso anual. (Ladrillo de: 'Tema V: antropología simbólica aplicada')"},{"id":"an1-u045","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p08","enunciado":"Según Kottak, las diferencias de habla entre hombres y mujeres son...","opciones":["Biológicas, derivadas de diferencias anatómicas del aparato fonador","Inexistentes, según demuestra la investigación sociolingüística reciente","Culturales y aprendidas, presentes en fonología, entonación, léxico y estilo"],"correcta":2,"explicacion":"La socialización diferencial de género produce estilos de habla distintos en varios niveles de la lengua. (Ladrillo de: 'Diferencias de género en el habla: Lakoff y Tannen')"},{"id":"an1-u046","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p08","enunciado":"¿Qué diferencia léxica de género recoge Kottak para EE.UU.?","opciones":["Las mujeres usan más términos de color; los hombres, más vocabulario deportivo y tacos","Las mujeres usan más tacos y jerga; los hombres, más diminutivos afectivos","Ambos géneros comparten exactamente el mismo repertorio de vocabulario"],"correcta":0,"explicacion":"El vocabulario refleja la socialización diferencial y los ámbitos de experiencia asignados a cada género en una cultura dada (malva, turquesa frente a léxico deportivo). (Ladrillo de: 'Diferencias de género en el habla: Lakoff y Tannen')"},{"id":"an1-u047","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p08","enunciado":"Para Lakoff, los atenuadores y las preguntas coletilla del 'habla femenina' reflejan...","opciones":["Una tendencia biológica femenina hacia la duda","La menor posición de poder social de las mujeres","Un dominio superior femenino de la cortesía verbal"],"correcta":1,"explicacion":"Expresiones como '¿no te parece?' o 'quizá' comunican inseguridad aprendida; el problema no es el habla de las mujeres sino la jerarquía que la produce y evalúa. (Ladrillo de: 'Diferencias de género en el habla: Lakoff y Tannen')"},{"id":"an1-u048","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p08","enunciado":"Según Tannen, los 'genderlects' oponen...","opciones":["Report (información) en mujeres y rapport (conexión) en hombres","Habla formal en las mujeres y habla vulgar en los hombres","Rapport (conexión) en mujeres y report (información, estatus) en hombres"],"correcta":2,"explicacion":"De ahí los malentendidos recurrentes: ellas buscan empatía al contar un problema y ellos responden dando soluciones; son estilos culturales, no rasgos naturales. (Ladrillo de: 'Diferencias de género en el habla: Lakoff y Tannen')"},{"id":"an1-u049","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p08","enunciado":"Dentro de una misma clase social, ¿quiénes tienden más al habla estándar de prestigio?","opciones":["Las mujeres, por su menor seguridad de estatus","Los hombres, por sus redes laborales más amplias","Los jóvenes, por la influencia de la escolarización"],"correcta":0,"explicacion":"Kottak lo vincula con la menor seguridad de estatus: cuidar el habla es una forma de reclamar respetabilidad social. (Ladrillo de: 'Diferencias de género en el habla: Lakoff y Tannen')"},{"id":"an1-u050","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p08","enunciado":"En relación con el género, el habla...","opciones":["Neutraliza las jerarquías sociales entre hombres y mujeres","Expresa y reproduce la estratificación de género, igual que la de clase","Varía por género solo en las sociedades no industriales"],"correcta":1,"explicacion":"Las diferencias de habla entre géneros funcionan como las de clase: reflejan la desigualdad y contribuyen a perpetuarla. (Ladrillo de: 'Diferencias de género en el habla: Lakoff y Tannen')"},{"id":"an1-u051","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p09","enunciado":"¿Qué son las 'gramáticas de la identidad/alteridad' de Baumann?","opciones":["Reglas sintácticas universales de las lenguas en contacto","Tipologías fijas de los caracteres étnicos nacionales","Estructuras clasificatorias del nosotros/ellos, selectivas y reversibles"],"correcta":2,"explicacion":"Son operaciones discursivas de 'selfing/othering' que pueden combinarse en un mismo contexto: no describen esencias sino esquemas de clasificación. (Ladrillo de: 'Tres gramáticas de la identidad/alteridad de Baumann' y 'Tema III: identidad/alteridad — Hall, Baumann y Lévi-Strauss')"},{"id":"an1-u052","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p09","enunciado":"¿Cómo opera la gramática orientalista según Baumann, a partir de Said?","opciones":["Como espejo invertido ('lo que ellos son, nosotros no somos'), con rechazo y deseo","Como jerarquía que subsume al otro como caso subordinado de lo propio","Como alianza u oposición según el nivel contextual de segmentación"],"correcta":0,"explicacion":"Oriente aparece irracional y despótico pero también sensual y espiritual: negación especular que a la vez fascina ('lo malo nuestro es lo bueno suyo'). (Ladrillo de: 'Tres gramáticas de la identidad/alteridad de Baumann')"},{"id":"an1-u053","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p09","enunciado":"¿Qué define a la gramática segmentaria, inspirada en Evans-Pritchard?","opciones":["Negación especular ambivalente del otro exótico y deseado","Aliado o enemigo según el nivel de segmentación: identidad contextual","Reconocimiento del otro subsumido como variante de lo propio"],"correcta":1,"explicacion":"Como entre los nuer: aldeas rivales entre sí se unen frente a la tribu vecina, y todas frente al extranjero; fusión y fisión contextuales. (Ladrillo de: 'Tres gramáticas de la identidad/alteridad de Baumann')"},{"id":"an1-u054","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p09","enunciado":"La gramática de englobamiento, tomada de Dumont, consiste en...","opciones":["Excluir al otro como enemigo absoluto, irreductible y permanente","Idealizar al otro como reserva exótica de autenticidad perdida","Reconocer al otro pero subsumirlo como caso subordinado de lo propio"],"correcta":2,"explicacion":"'En el fondo sois como nosotros': la jerarquía engloba a su contrario, negando autonomía a la diferencia. (Ladrillo de: 'Tres gramáticas de la identidad/alteridad de Baumann')"},{"id":"an1-u055","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p09","enunciado":"En el ámbito religioso, el ecumenismo ('todos adoramos al mismo Dios') ejemplifica según Baumann...","opciones":["La gramática de englobamiento","La gramática segmentaria","La gramática orientalista"],"correcta":0,"explicacion":"Las 'religiones del Libro' segmentan (unidas frente al secularismo) y el 'misticismo oriental' se orientaliza: las tres gramáticas operan en lo religioso. (Ladrillo de: 'Tres gramáticas de la identidad/alteridad de Baumann')"},{"id":"an1-u056","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p09","enunciado":"En el ámbito estético, ¿qué suele ocurrir con el arte 'primitivo' o la world music?","opciones":["Se segmentan en niveles anidados de alianza y oposición territorial","Se orientalizan como exotismo o se engloban como formas 'menores' del canon","Quedan completamente fuera del alcance de las tres gramáticas"],"correcta":1,"explicacion":"El exotismo admirado orientaliza; su inclusión como arte 'menor' dentro del canon occidental engloba. (Ladrillo de: 'Tres gramáticas de la identidad/alteridad de Baumann')"},{"id":"an1-u057","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p10","enunciado":"¿De qué modelo etnográfico procede la gramática segmentaria de Baumann?","opciones":["Del sistema jerárquico de castas analizado por Louis Dumont","Del orientalismo literario y pictórico descrito por Said","De los linajes segmentarios nuer estudiados por Evans-Pritchard"],"correcta":2,"explicacion":"El modelo de linajes segmentarios describe procesos de fisión y fusión de los grupos según el contexto. (Ladrillo de: 'Gramática segmentaria: Baumann y Evans-Pritchard')"},{"id":"an1-u058","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p10","enunciado":"¿Cuál es el principio básico de la gramática segmentaria?","opciones":["El enemigo en un nivel bajo es aliado en un nivel superior","El aliado de mi aliado es necesariamente mi enemigo","Los niveles superiores disuelven toda oposición interna"],"correcta":0,"explicacion":"Dos aldeas rivales se unen contra la sección vecina; dos secciones, contra otra tribu; todos los nuer, contra los dinka. La oposición estructura la solidaridad. (Ladrillo de: 'Gramática segmentaria: Baumann y Evans-Pritchard')"},{"id":"an1-u059","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p10","enunciado":"En la gramática segmentaria, la identidad resulta...","opciones":["Fija y esencial: cada grupo tiene un 'otro' permanente","Contextual y relativa: no hay 'otros' absolutos","Individual: cada persona elige su nivel de pertenencia"],"correcta":1,"explicacion":"Solo hay niveles cambiantes de nosotros/ellos, que se activan según el contexto de oposición. (Ladrillo de: 'Gramática segmentaria: Baumann y Evans-Pritchard')"},{"id":"an1-u060","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p10","enunciado":"¿Qué ejemplo político ilustra bien la gramática segmentaria?","opciones":["Un partido que veta cualquier pacto con las demás fuerzas","La exotización de un líder extranjero en la prensa nacional","Partidos rivales en autonómicas que se coaligan en las generales"],"correcta":2,"explicacion":"También valen las identidades anidadas (barrio, ciudad, país) o los países de la UE, que compiten entre sí pero se unen frente a amenazas externas. (Ladrillo de: 'Gramática segmentaria: Baumann y Evans-Pritchard')"},{"id":"an1-u061","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p10","enunciado":"¿Qué límite señala Baumann a la gramática segmentaria?","opciones":["Presupone niveles claros y solidaridad mecánica, raros en sociedades complejas","Solo resulta aplicable a los conflictos religiosos monoteístas","Carece de base etnográfica documentada en el continente africano"],"correcta":0,"explicacion":"En sociedades complejas la segmentación se combina con las otras gramáticas (orientalización y englobamiento). (Ladrillo de: 'Gramática segmentaria: Baumann y Evans-Pritchard')"},{"id":"an1-u062","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p11","enunciado":"Según Said en 'Orientalismo' (1978), el orientalismo es...","opciones":["Una corriente artística decorativa sin vínculo alguno con el poder político","Un aparato de saber-poder colonial que fabrica un 'Oriente' espejo de Occidente","Una disciplina filológica neutral dedicada a las lenguas clásicas de Asia"],"correcta":1,"explicacion":"Literatura, pintura y ciencia produjeron un Oriente irracional, sensual y estancado frente a un Occidente racional y moderno: Occidente se define por ese espejo invertido. (Ladrillo de: 'Gramática orientalista: Baumann y Said')"},{"id":"an1-u063","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p11","enunciado":"Baumann formaliza la gramática orientalista con la fórmula...","opciones":["'En el fondo, ellos son exactamente como nosotros'","'Mi enemigo de ayer puede ser mi aliado de hoy'","'Lo que ellos son, nosotros no lo somos, y viceversa'"],"correcta":2,"explicacion":"Es la gramática de la negación especular: el otro se construye como imagen invertida del nosotros. (Ladrillo de: 'Gramática orientalista: Baumann y Said')"},{"id":"an1-u064","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p11","enunciado":"¿Qué distingue al orientalismo del simple rechazo del otro?","opciones":["Su ambivalencia: el otro condensa lo temido y también lo deseado","Su fundamento científico en la biología de las poblaciones","Su carácter exclusivamente religioso, medieval y teológico"],"correcta":0,"explicacion":"Lo que reprimimos en nosotros lo proyectamos y admiramos en ellos: espiritualidad, sensualidad, autenticidad (exotismo, 'buen salvaje'). (Ladrillo de: 'Gramática orientalista: Baumann y Said')"},{"id":"an1-u065","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p11","enunciado":"El flamenco consumido como pasión 'primitiva' o la moda 'étnica' ejemplifican...","opciones":["El englobamiento del otro como caso menor y subordinado de lo propio","La orientalización estética: la diferencia consumida como autenticidad perdida","La segmentación de los públicos según sus niveles de renta disponible"],"correcta":1,"explicacion":"El mercado estético reproduce el binarismo nosotros-modernos / ellos-auténticos, aunque invierta la valoración; también tatuajes 'tribales' o decoración 'zen'. (Ladrillo de: 'Gramática orientalista: Baumann y Said')"},{"id":"an1-u066","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p11","enunciado":"'El retrato del otro es un autorretrato invertido' significa que...","opciones":["Toda descripción etnográfica del otro es empíricamente falsa","El otro decide siempre los términos de su propia representación","Identificarse y alterizar son un mismo acto ('selfing/othering')"],"correcta":2,"explicacion":"Al describir al otro nos definimos a nosotros mismos: identidad y alteridad se producen en la misma operación discursiva. (Ladrillo de: 'Gramática orientalista: Baumann y Said')"},{"id":"an1-u067","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p12","enunciado":"¿Qué es la etnografía según Kottak?","opciones":["Investigación de campo, de primera mano y prolongada, en grupos concretos","Comparación estadística transcultural de grandes bases de datos etnológicas","Reconstrucción documental de la historia de los pueblos sin escritura"],"correcta":0,"explicacion":"Es la estrategia de investigación distintiva de la antropología, desarrollada en sociedades o grupos concretos. (Ladrillo de: 'La etnografía y sus técnicas según Kottak')"},{"id":"an1-u068","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p12","enunciado":"¿Qué permite específicamente la observación participante?","opciones":["Obtener muestras estadísticamente representativas de la población","Acceder a lo que la gente hace, no solo a lo que dice que hace","Evitar todo contacto personal directo con los sujetos estudiados"],"correcta":1,"explicacion":"Convivir y tomar parte en la vida local mientras se observa y registra exige gestionar la tensión entre implicación y distancia. (Ladrillo de: 'La etnografía y sus técnicas según Kottak')"},{"id":"an1-u069","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p12","enunciado":"Dentro de la conversación etnográfica, Kottak distingue...","opciones":["Interrogatorios formales y encuestas censales exhaustivas","Diálogos socráticos y cuestionarios cerrados autoadministrados","Entrevistas dirigidas (con guion) y entrevistas no dirigidas"],"correcta":2,"explicacion":"Las técnicas conversacionales van desde la charla informal hasta el cuestionario. (Ladrillo de: 'La etnografía y sus técnicas según Kottak')"},{"id":"an1-u070","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p12","enunciado":"¿Para qué sirve el método genealógico?","opciones":["Registrar parentesco, filiación y matrimonio, esqueleto de las sociedades no industriales","Reconstruir la evolución biológica y genética de las poblaciones humanas","Datar los yacimientos arqueológicos mediante secuencias estratigráficas"],"correcta":0,"explicacion":"El parentesco organiza la vida social en las sociedades no industriales, de ahí la centralidad de esta técnica. (Ladrillo de: 'La etnografía y sus técnicas según Kottak')"},{"id":"an1-u071","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p12","enunciado":"¿Qué son los informantes clave o consultores culturales?","opciones":["Funcionarios que autorizan el acceso del investigador al terreno","Expertos locales que guían y enseñan al etnógrafo de forma continuada","Traductores profesionales contratados por el equipo de investigación"],"correcta":1,"explicacion":"Junto a las historias de vida, retratos biográficos en profundidad que muestran cómo se vive la cultura. (Ladrillo de: 'La etnografía y sus técnicas según Kottak')"},{"id":"an1-u072","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p12","enunciado":"¿Qué designan las perspectivas emic y etic?","opciones":["Las categorías del analista y el punto de vista nativo, respectivamente","Los datos cualitativos y los datos cuantitativos, respectivamente","El punto de vista nativo y las categorías del analista, respectivamente"],"correcta":2,"explicacion":"La etnografía se caracteriza por combinar ambas perspectivas en la producción de conocimiento. (Ladrillo de: 'La etnografía y sus técnicas según Kottak')"},{"id":"an1-u073","tema":"Tema 2: Método y teorías en antropología","fuente":"pregunta:an1-p12","enunciado":"¿Cómo se adapta la etnografía a las sociedades complejas según Kottak?","opciones":["Con investigación longitudinal, en equipo y multisituada, más encuestas complementarias","Sustituyendo el trabajo de campo por el análisis de encuestas nacionales","Limitándose al estudio de comunidades rurales pequeñas y bien aisladas"],"correcta":0,"explicacion":"La encuesta aporta el complemento cuantitativo al enfoque etnográfico en contextos complejos. (Ladrillo de: 'La etnografía y sus técnicas según Kottak')"},{"id":"an1-u074","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p13","enunciado":"¿Qué critica Pratt de los grandes relatos celebratorios de la globalización?","opciones":["Que exageran el papel de los Estados frente al mercado mundial","Que ocultan muros, inmovilidad y desigualdad tras el mito del flujo total","Que ignoran el crecimiento económico de los países emergentes"],"correcta":1,"explicacion":"Mundo sin fronteras, aldea global y movilidad total son mitos interesados: no todos circulan igual ni con los mismos derechos. (Ladrillo de: 'Pratt: la globalización y sus relatos')"},{"id":"an1-u075","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p13","enunciado":"¿Desde dónde propone Pratt entender la globalización?","opciones":["Desde los indicadores macroeconómicos de los flujos de capital","Desde la teoría de los sistemas-mundo y sus ciclos seculares","Desde los relatos y experiencias concretas de movilidad 'desde abajo'"],"correcta":2,"explicacion":"Frente a la abstracción del capital, importan las movilidades vividas y narradas por la gente concreta. (Ladrillo de: 'Pratt: la globalización y sus relatos')"},{"id":"an1-u076","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p13","enunciado":"Según Pratt, ¿por qué 'viaja' la Virgen de Zapopan a Los Ángeles?","opciones":["Sigue a sus fieles migrantes mexicanos, que reconstruyen comunidad transnacional","Fue trasladada por la jerarquía eclesiástica para evangelizar California","Es una réplica comercial sin ningún vínculo con la imagen original"],"correcta":0,"explicacion":"La religiosidad popular muestra la agencia de los migrantes: lo local no desaparece, se desterritorializa y reterritorializa. (Ladrillo de: 'Pratt: la globalización y sus relatos')"},{"id":"an1-u077","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p13","enunciado":"Frente al héroe neoliberal hipermóvil, ¿qué figura opone Pratt?","opciones":["El turista global que consume experiencias exóticas baratas","El migrante indocumentado, cuya movilidad es criminalizada","El ejecutivo transnacional que cruza fronteras sin visado"],"correcta":1,"explicacion":"La misma frontera que el capital cruza libremente se vuelve letal para las personas: la movilidad es un recurso distribuido desigualmente. (Ladrillo de: 'Pratt: la globalización y sus relatos')"},{"id":"an1-u078","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p13","enunciado":"Para Pratt, los relatos sobre la globalización...","opciones":["La describen de forma neutral, exacta y transparente","Carecen de interés analítico para la antropología","Son parte de ella y deben analizarse críticamente"],"correcta":2,"explicacion":"La antropología debe analizar críticamente esos relatos y recoger los relatos alternativos de quienes viven la movilidad. (Ladrillo de: 'Pratt: la globalización y sus relatos')"},{"id":"an1-u079","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p14","enunciado":"¿Qué es la 'burbuja personal' según Edward y Mildred Hall?","opciones":["Espacio invisible y portátil que regula la distancia aceptable con los otros","Zona fija del hogar reservada exclusivamente a la intimidad familiar","Metáfora del aislamiento comunicativo en las redes sociales digitales"],"correcta":0,"explicacion":"Funciona como un territorio móvil: su invasión produce incomodidad, retirada o agresividad, casi siempre de forma inconsciente. (Ladrillo de: 'La burbuja personal según los Hall')"},{"id":"an1-u080","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p14","enunciado":"¿Cómo varía culturalmente el tamaño de la burbuja personal?","opciones":["Amplia entre árabes, latinos y mediterráneos; reducida entre norteamericanos","Amplia entre norteamericanos y noreuropeos; reducida entre árabes, latinos o mediterráneos","Es idéntica en todas las culturas porque tiene una base biológica común"],"correcta":1,"explicacion":"De ahí los malentendidos interculturales: quien se acerca parece invasivo y quien retrocede, frío; cada cual sigue su norma cultural sin saberlo. (Ladrillo de: 'La burbuja personal según los Hall')"},{"id":"an1-u081","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p14","enunciado":"Además de la cultura, ¿de qué depende el tamaño de la burbuja personal?","opciones":["Solo de la personalidad introvertida o extrovertida","De la estatura y la complexión física de los hablantes","De la relación, el género, la situación y la densidad"],"correcta":2,"explicacion":"Los Hall distinguen además distancias íntima, personal, social y pública. (Ladrillo de: 'La burbuja personal según los Hall')"},{"id":"an1-u082","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p14","enunciado":"¿Por qué toleramos el contacto físico en un vagón de metro lleno?","opciones":["Suspendemos la burbuja personal, por ejemplo evitando la mirada","La burbuja personal desaparece en todos los espacios públicos","El contacto deja de percibirse por pura saturación sensorial"],"correcta":0,"explicacion":"En cambio, en un ascensor vacío alguien que se pega resulta amenazante: la norma proxémica depende de la situación. (Ladrillo de: 'La burbuja personal según los Hall')"},{"id":"an1-u083","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p15","enunciado":"¿De qué corriente procede la noción de 'taxonomía' que presentan Díaz de Rada y Cruces?","opciones":["Del estructural-funcionalismo","De la etnociencia","De la sociobiología"],"correcta":1,"explicacion":"Para la etnociencia, las culturas ordenan la experiencia mediante estructuras clasificatorias. (Ladrillo de: 'La taxonomía como estructura clasificatoria')"},{"id":"an1-u084","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p15","enunciado":"¿Qué es una taxonomía como estructura clasificatoria?","opciones":["Matriz que cruza simultáneamente dos o más dimensiones de contraste","Lista alfabética y exhaustiva de los términos de un dominio dado","Clasificación jerárquica por inclusión de clases: 'X es un tipo de Y'"],"correcta":2,"explicacion":"Cada término contrasta con los de su nivel y se incluye en el nivel superior: el dominio se organiza como un árbol, de lo general a lo específico. (Ladrillo de: 'La taxonomía como estructura clasificatoria')"},{"id":"an1-u085","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p15","enunciado":"¿Cuál de estos casos ejemplifica una taxonomía?","opciones":["'Bebidas' divididas en alcohólicas y no alcohólicas; aquellas, en vino, cerveza y licores","Los términos de parentesco definidos por el cruce de sexo y generación","La distinción metodológica entre perspectiva emic y perspectiva etic"],"correcta":0,"explicacion":"También valen la etnobotánica popular (árbol/arbusto/hierba), los tipos de música, la carta de un bar o la clasificación casera de la ropa. (Ladrillo de: 'La taxonomía como estructura clasificatoria')"},{"id":"an1-u086","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p15","enunciado":"Las taxonomías populares o 'folk'...","opciones":["Reproducen con fidelidad las clasificaciones de la biología académica","No coinciden con las científicas: responden al interés práctico y simbólico del grupo","Son idénticas en todas las culturas humanas conocidas hasta hoy"],"correcta":1,"explicacion":"La clasificación nativa obedece a los intereses y significados propios de cada grupo, no al criterio científico. (Ladrillo de: 'La taxonomía como estructura clasificatoria')"},{"id":"an1-u087","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p15","enunciado":"Según la etnociencia, ¿qué revela cada taxonomía particular?","opciones":["La superioridad cognitiva de las sociedades letradas y escolarizadas","Una estructura clasificatoria innata e idéntica del cerebro humano","'El orden del sentido' propio de una cultura, siendo clasificar universal"],"correcta":2,"explicacion":"Clasificar es una actividad universal; los contenidos y criterios de cada taxonomía son culturalmente variables. (Ladrillo de: 'La taxonomía como estructura clasificatoria')"},{"id":"an1-u088","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p16","enunciado":"¿Qué es un paradigma como estructura clasificatoria?","opciones":["Matriz cuyas categorías cruzan simultáneamente dos o más dimensiones de contraste","Jerarquía de inclusión de clases del tipo 'X es una clase de Y'","Modelo teórico dominante aceptado por una comunidad científica"],"correcta":0,"explicacion":"A diferencia de la taxonomía (jerarquía de inclusión), cada casilla del paradigma combina un valor de cada dimensión. (Ladrillo de: 'El paradigma como estructura clasificatoria')"},{"id":"an1-u089","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p16","enunciado":"En el paradigma clásico del parentesco, el término 'madre' resulta de cruzar...","opciones":["Sexo femenino y generación 0","Sexo femenino y generación +1","Filiación materna y residencia"],"correcta":1,"explicacion":"Dimensión 1: sexo (masculino/femenino); dimensión 2: generación (+1, 0, -1): padre/madre, hijo/hija, abuelo/abuela. (Ladrillo de: 'El paradigma como estructura clasificatoria')"},{"id":"an1-u090","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p16","enunciado":"¿Qué otro ejemplo de paradigma clasificatorio se propone?","opciones":["La carta de bebidas de un bar de barrio cualquiera","La escala de salvajismo, barbarie y civilización","Los pronombres, definidos por el cruce de persona y número"],"correcta":2,"explicacion":"También el cruce de edad y género: niño/niña, hombre/mujer, anciano/anciana. (Ladrillo de: 'El paradigma como estructura clasificatoria')"},{"id":"an1-u091","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p16","enunciado":"¿Cómo se representa gráficamente un paradigma?","opciones":["Con una tabla de doble entrada: dimensiones en filas y columnas, términos en las celdas","Con un árbol ramificado que va del término general a los específicos","Con un diagrama circular de porcentajes para cada categoría nativa"],"correcta":0,"explicacion":"El árbol corresponde a la taxonomía; el paradigma se dibuja como matriz o tabla de doble entrada. (Ladrillo de: 'El paradigma como estructura clasificatoria')"},{"id":"an1-u092","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p16","enunciado":"Según la etnociencia, ¿qué muestran conjuntamente taxonomías y paradigmas?","opciones":["Que todas las culturas clasifican con contenidos exactamente idénticos","Cómo cada cultura organiza cognitivamente sus dominios de experiencia","La evolución unilineal y progresiva del pensamiento clasificatorio"],"correcta":1,"explicacion":"Son las dos grandes estructuras clasificatorias con que las culturas ordenan el mundo. (Ladrillo de: 'El paradigma como estructura clasificatoria')"},{"id":"an1-u093","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p17","enunciado":"¿Qué analiza García Canclini con la imagen de las 'cuatro ciudades'?","opciones":["Cuatro capitales latinoamericanas comparadas según su nivel de desarrollo","Las etapas ya superadas y sucesivas del urbanismo moderno occidental","Ciudad de México como superposición de capas históricas que coexisten hoy"],"correcta":2,"explicacion":"No son etapas sucesivas sino estratos simultáneos: la megalópolis se caracteriza por esa heterogeneidad multitemporal. (Ladrillo de: 'Las cuatro ciudades de García Canclini')"},{"id":"an1-u094","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p17","enunciado":"¿Cuál es la primera 'ciudad' que distingue Canclini?","opciones":["La histórico-territorial: centro histórico, lo patrimonial y ceremonial","La industrial: fábricas y barrios obreros del siglo veinte","La globalizada: finanzas, franquicias y consumo transnacional"],"correcta":0,"explicacion":"Es la herencia prehispánica y colonial de la ciudad. (Ladrillo de: 'Las cuatro ciudades de García Canclini')"},{"id":"an1-u095","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p17","enunciado":"La 'ciudad industrial' de Canclini se caracteriza por...","opciones":["El trazado ceremonial y patrimonial de origen prehispánico y colonial","La expansión del siglo XX: fábricas, migración campo-ciudad y barrios obreros","Las redes mediáticas y los servicios que narran y organizan la urbe"],"correcta":1,"explicacion":"Es la segunda capa histórica de la megalópolis según Canclini. (Ladrillo de: 'Las cuatro ciudades de García Canclini')"},{"id":"an1-u096","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p17","enunciado":"¿Qué define a la ciudad comunicacional o informacional de Canclini?","opciones":["El territorio urbano se conoce solo por la experiencia directa del caminar","La desaparición progresiva de los medios de comunicación locales","La urbe se vive a través de medios, redes y servicios que la narran"],"correcta":2,"explicacion":"En la megaciudad ya no se conoce el territorio por experiencia directa: los medios 'cuentan' la ciudad y median su sentido, tema que conecta con Martín Barbero. (Ladrillo de: 'Las cuatro ciudades de García Canclini')"},{"id":"an1-u097","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p17","enunciado":"La 'ciudad globalizada' de Canclini es la que...","opciones":["Se conecta a circuitos transnacionales de finanzas, migración y consumo","Ha eliminado la economía informal gracias a la inversión extranjera","Se aísla de los flujos internacionales para proteger su patrimonio"],"correcta":0,"explicacion":"Sedes corporativas, franquicias y élites globales conviven con la informalidad: la globalización fragmenta y re-jerarquiza el espacio urbano con nuevas desigualdades. (Ladrillo de: 'Las cuatro ciudades de García Canclini')"},{"id":"an1-u098","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p17","enunciado":"¿Qué muestran, en conjunto, las cuatro ciudades superpuestas?","opciones":["La evolución lineal de toda ciudad hacia su fase globalizada","La hibridación urbana y la imposibilidad de una visión totalizadora","Que cada nueva capa histórica borra por completo la anterior"],"correcta":1,"explicacion":"Los imaginarios urbanos recomponen esa experiencia fragmentada de la megaciudad. (Ladrillo de: 'Las cuatro ciudades de García Canclini')"},{"id":"an1-u099","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p18","enunciado":"¿Qué defiende Chomsky sobre el lenguaje, según Kottak?","opciones":["Que cada lengua moldea un pensamiento propio e inconmensurable","Que el lenguaje se aprende únicamente por imitación del entorno","Una gramática universal innata compartida por todas las lenguas"],"correcta":2,"explicacion":"Los niños aprenden cualquier lengua con la misma facilidad gracias a un dispositivo innato de adquisición; las diferencias entre lenguas son superficiales frente a la estructura común. (Ladrillo de: 'Chomsky frente a Sapir-Whorf')"},{"id":"an1-u100","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p18","enunciado":"¿Qué sostiene la hipótesis de Sapir-Whorf?","opciones":["Cada lengua canaliza el pensamiento: hablantes de lenguas distintas piensan distinto","Todas las lenguas comparten una misma estructura profunda universal","El pensamiento humano es totalmente independiente de la lengua hablada"],"correcta":0,"explicacion":"Ejemplos clásicos: el tratamiento del tiempo en hopi o los géneros gramaticales; la lengua no sería solo vehículo sino molde de la experiencia. (Ladrillo de: 'Chomsky frente a Sapir-Whorf')"},{"id":"an1-u101","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p18","enunciado":"El contraste entre Chomsky y Sapir-Whorf opone...","opciones":["Materialismo cultural frente a idealismo simbólico","Universalismo biológico frente a relativismo lingüístico","Difusionismo cultural frente a evolucionismo unilineal"],"correcta":1,"explicacion":"Unidad psíquica y biología común (Chomsky) frente a particularismo de cada lengua (Sapir-Whorf). (Ladrillo de: 'Chomsky frente a Sapir-Whorf')"},{"id":"an1-u102","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p18","enunciado":"¿Cómo evalúa Kottak hoy el determinismo lingüístico whorfiano?","opciones":["Está plenamente confirmado por la psicolingüística experimental actual","Fue refutado y sustituido por un determinismo biológico absoluto","Su versión fuerte está descartada; se admite una influencia débil y mutua"],"correcta":2,"explicacion":"Podemos pensar lo que nuestra lengua no codifica y las lenguas cambian: la relación es de influencia mutua, no de determinación. (Ladrillo de: 'Chomsky frente a Sapir-Whorf')"},{"id":"an1-u103","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p18","enunciado":"¿Qué demuestra el vocabulario focal sobre la relación entre lengua y cultura?","opciones":["Que a menudo es la cultura la que moldea la lengua","Que la lengua determina qué cultura resulta posible","Que léxico y cultura evolucionan por vías separadas"],"correcta":0,"explicacion":"El léxico se elabora en las áreas de interés del grupo: la flecha causal se invierte, apoyando una lectura invertida y débil de Sapir-Whorf. (Ladrillo de: 'Chomsky frente a Sapir-Whorf' y 'El vocabulario focal')"},{"id":"an1-u104","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p19","enunciado":"¿Qué es el vocabulario focal según Kottak?","opciones":["Conjunto de palabras tabú que se evitan en los contextos rituales","Léxico especializado y elaborado en dominios de experiencia cruciales para un grupo","El vocabulario básico común compartido por todas las lenguas humanas"],"correcta":1,"explicacion":"El léxico es el nivel de la lengua que más directamente refleja la cultura: donde hay interés y práctica intensa proliferan las distinciones terminológicas. (Ladrillo de: 'El vocabulario focal')"},{"id":"an1-u105","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p19","enunciado":"¿Cuál es un ejemplo clásico de vocabulario focal?","opciones":["Las preguntas coletilla del habla femenina según Lakoff","La pronunciación de la /r/ en los almacenes neoyorquinos","Los numerosos términos para el ganado entre los nuer"],"correcta":2,"explicacion":"También los términos para la nieve entre los inuit (hoy matizado) o los tipos de arroz y de camellos en otras culturas. (Ladrillo de: 'El vocabulario focal')"},{"id":"an1-u106","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p19","enunciado":"¿Qué ejemplo cercano ilustra el vocabulario focal?","opciones":["El esquiador distingue 'nieve polvo, costra, primavera' donde el profano ve una sola cosa","El uso creciente de anglicismos de prestigio en el lenguaje publicitario","El habla estándar que la escuela obligatoria enseña a todos por igual"],"correcta":0,"explicacion":"Baristas ('ristretto, flat white') o gamers: subculturas con vocabularios focales propios en sus áreas de interés. (Ladrillo de: 'El vocabulario focal')"},{"id":"an1-u107","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p19","enunciado":"¿Qué ocurre con el vocabulario cuando cambian los intereses culturales?","opciones":["Permanece estable: el léxico es la parte más resistente de la lengua","Cambia con ellos: las nuevas tecnologías generan léxico nuevo ('tuitear', 'streaming')","Se empobrece: la tecnología reduce la variedad del vocabulario común"],"correcta":1,"explicacion":"El léxico acompaña a los intereses del grupo: aparecen términos nuevos con las nuevas prácticas. (Ladrillo de: 'El vocabulario focal')"},{"id":"an1-u108","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p20","enunciado":"¿Qué es el símbolo para Turner?","opciones":["El resumen verbal y narrativo del mito de origen del grupo","Un signo referencial que se limita a transmitir información","La unidad mínima del ritual, su 'molécula' de conducta ritual"],"correcta":2,"explicacion":"Turner lo estudia en los rituales de los ndembu de Zambia. (Ladrillo de: 'Símbolos rituales según Turner')"},{"id":"an1-u109","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p20","enunciado":"Para Turner, los símbolos rituales son de condensación porque...","opciones":["No solo denotan: cargan emoción y mueven a la acción","Resumen todo el ritual en una única palabra clave","Informan con precisión sobre referentes únicos y fijos"],"correcta":0,"explicacion":"Frente al signo referencial (que informa), el símbolo ritual condensa normas, deseos y afectos; por eso el ritual transforma a los participantes y no solo comunica. (Ladrillo de: 'Símbolos rituales según Turner')"},{"id":"an1-u110","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p20","enunciado":"¿Qué es la polarización de sentido en un símbolo dominante?","opciones":["La oposición binaria y excluyente entre símbolos puros y símbolos impuros","La tensión entre un polo ideológico (normas y valores) y un polo sensorial (fisiológico, emocional)","El enfrentamiento ritualizado entre las dos mitades exogámicas del grupo"],"correcta":1,"explicacion":"Cada símbolo dominante articula esos dos polos de significado. (Ladrillo de: 'Símbolos rituales según Turner')"},{"id":"an1-u111","tema":"Tema 5: Antropología simbólica","fuente":"pregunta:an1-p20","enunciado":"En la iniciación femenina ndembu, la savia blanca del árbol mudyi evoca...","opciones":["El matrilinaje (polo sensorial) y la leche materna (polo ideológico)","La pureza ritual (polo sensorial) y la exogamia (polo ideológico)","La leche materna (polo sensorial) y el matrilinaje (polo ideológico)"],"correcta":2,"explicacion":"Durante el ritual ambos polos intercambian cargas: lo obligatorio se vuelve deseable al impregnarse de emoción, y la emoción se ennoblece al unirse a la norma; ahí reside la eficacia ritual. (Ladrillo de: 'Símbolos rituales según Turner')"},{"id":"an1-u112","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p21","enunciado":"¿Cuál es la idea eje del tema III sobre raza, etnicidad, nación o pueblo?","opciones":["Son construcciones socioculturales, procesos dinámicos de identidad/alteridad, no esencias","Son realidades biológicas estables que la cultura se limita a reflejar","Son categorías puramente jurídicas creadas por los Estados modernos"],"correcta":0,"explicacion":"La diferencia se construye socialmente en procesos dinámicos de identificación y alterización. (Ladrillo de: 'Tema III: identidad/alteridad — Hall, Baumann y Lévi-Strauss')"},{"id":"an1-u113","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p21","enunciado":"Según Kottak, ¿qué prueba que la misma persona sea clasificada racialmente distinto en EE.UU., Brasil o Japón?","opciones":["Que existen criterios biológicos diferentes en cada continente","Que las razas sociales son construcciones culturales arbitrarias","Que la etnicidad es fija aunque la clasificación racial varíe"],"correcta":1,"explicacion":"La raza carece de base biológica (variación clinal), las razas sociales se construyen culturalmente (hipodescendencia, continuo brasileño, burakumin) y la etnicidad es situacional. (Ladrillo de: 'Tema III: identidad/alteridad — Hall, Baumann y Lévi-Strauss')"},{"id":"an1-u114","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p21","enunciado":"En 'Raza e Historia', Lévi-Strauss sostiene que...","opciones":["El progreso depende de la pureza y del aislamiento de cada cultura","Todas las culturas evolucionan por etapas idénticas y necesarias","La diversidad es motor del progreso: la civilización es una coalición de culturas"],"correcta":2,"explicacion":"'El bárbaro es quien cree en la barbarie': llamar salvaje al diferente es el gesto etnocéntrico por excelencia; ninguna cultura acumula progreso en solitario. (Ladrillo de: 'Tema III: identidad/alteridad — Hall, Baumann y Lévi-Strauss')"},{"id":"an1-u115","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p21","enunciado":"Según Stuart Hall, ¿dónde se produce la identidad?","opciones":["En la representación: los estereotipos fijan y naturalizan la diferencia","En la herencia genética compartida por cada población humana","En las instituciones jurídicas propias del Estado-nación moderno"],"correcta":0,"explicacion":"Los significados no están en las cosas sino en los sistemas de representación; el poder opera fijando significados: el cuerpo negro racializado en publicidad, deporte y medios ('el espectáculo del Otro'). (Ladrillo de: 'Tema III: identidad/alteridad — Hall, Baumann y Lévi-Strauss')"},{"id":"an1-u116","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p21","enunciado":"¿Qué conclusión resume el tema III sobre la identidad?","opciones":["Es un dato natural, previo e independiente de toda relación social","Es un hecho discursivo y relacional: se hace frente a un 'otro' y puede rehacerse","Solo existe allí donde estalla un conflicto étnico abiertamente violento"],"correcta":1,"explicacion":"Un buen cierre aplica Hall, Baumann y Lévi-Strauss a un caso actual (debates migratorios, nacionalismos, racismo cotidiano) mostrando su complementariedad. (Ladrillo de: 'Tema III: identidad/alteridad — Hall, Baumann y Lévi-Strauss')"},{"id":"an1-u117","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p22","enunciado":"¿Qué triple perspectiva define a la antropología, 'espejo para la humanidad'?","opciones":["Evolutiva, difusionista y funcional","Cuantitativa, cualitativa y mixta","Holista, relativista y comparativa"],"correcta":2,"explicacion":"La antropología estudia la diversidad humana en su totalidad (Kluckhohn/Kottak). (Ladrillo de: 'Holismo, relativismo y comparativismo')"},{"id":"an1-u118","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p22","enunciado":"¿Qué implica el holismo antropológico?","opciones":["Abordar al ser humano como totalidad biológica, social, lingüística y cultural","Estudiar cada institución social de forma aislada, autónoma y separada","Reducir toda la cultura a sus bases ecológicas y materiales últimas"],"correcta":0,"explicacion":"De ahí los cuatro campos de la disciplina; nada se entiende aislado: las vacas sagradas indias enlazan ecología, economía y religión. (Ladrillo de: 'Holismo, relativismo y comparativismo')"},{"id":"an1-u119","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p22","enunciado":"¿Cómo entiende la perspectiva antropológica el relativismo?","opciones":["Aceptar moralmente cualquier práctica cultural realmente existente","Comprender cada cultura en sus términos, en versión metodológica (Brown)","Negar que sea posible comparación alguna entre culturas distintas"],"correcta":1,"explicacion":"No es relativismo moral absoluto; casos: el Hamlet reinterpretado por los tiv (Bohannan) y el debate del relativismo frente a los derechos humanos. (Ladrillo de: 'Holismo, relativismo y comparativismo')"},{"id":"an1-u120","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p22","enunciado":"¿Para qué sirve el comparativismo transcultural según Kottak?","opciones":["Demostrar la superioridad adaptativa de determinadas culturas concretas","Ordenar todas las culturas en una escala única y lineal de progreso","Distinguir lo universal, lo generalizado y lo particular, y probar explicaciones"],"correcta":2,"explicacion":"Universales (tabú del incesto), generalidades (familia nuclear) y particularidades; Peacock subraya la tensión entre generalizar y particularizar. (Ladrillo de: 'Holismo, relativismo y comparativismo')"},{"id":"an1-u121","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p22","enunciado":"¿Qué método sostiene la triple perspectiva antropológica?","opciones":["La etnografía con observación participante, combinando emic y etic","La encuesta representativa con análisis estadístico multivariable","El experimento controlado de campo con grupos de contraste"],"correcta":0,"explicacion":"El trabajo de campo etnográfico es la base metodológica del holismo, el relativismo y el comparativismo. (Ladrillo de: 'Holismo, relativismo y comparativismo')"},{"id":"an1-u122","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p22","enunciado":"¿En qué convierte a la antropología su triple perspectiva?","opciones":["En una técnica auxiliar al servicio de la administración colonial","En crítica del etnocentrismo y ciencia reflexiva sobre la propia cultura","En una disciplina puramente descriptiva, sin dimensión crítica alguna"],"correcta":1,"explicacion":"Estudiar la diversidad permite mirar críticamente la cultura propia. (Ladrillo de: 'Holismo, relativismo y comparativismo')"},{"id":"an1-u123","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p23","enunciado":"¿Qué distingue la etnografía 'en' la ciudad de la etnografía 'de' la ciudad?","opciones":["El uso de encuestas frente al uso de entrevistas en profundidad","El estudio del centro urbano frente al estudio de la periferia","La ciudad como escenario frente a la ciudad como objeto de estudio"],"correcta":2,"explicacion":"Lo urbano se entiende además como forma de vida, no solo como lugar. (Ladrillo de: 'Tema VI: antropología urbana aplicada')"},{"id":"an1-u124","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p23","enunciado":"Según García Canclini, ¿qué son los imaginarios urbanos?","opciones":["Relatos, medios y trayectos con que los grupos recomponen la megaciudad fragmentada","Los planos oficiales que ordenan el crecimiento futuro de la ciudad","Las utopías arquitectónicas diseñadas por las vanguardias artísticas"],"correcta":0,"explicacion":"En la megalópolis de cuatro ciudades superpuestas nadie experimenta el todo: cada grupo construye ciudades imaginadas distintas dentro de la misma urbe. (Ladrillo de: 'Tema VI: antropología urbana aplicada')"},{"id":"an1-u125","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p23","enunciado":"¿Qué analiza Martín Barbero con 'la ciudad que median los miedos'?","opciones":["El pánico moral generado por las nuevas tecnologías digitales","Cómo el miedo reorganiza la vida urbana y los medios median su experiencia","La arquitectura defensiva y amurallada de las ciudades coloniales"],"correcta":1,"explicacion":"La inseguridad real y percibida empuja a privatizar el espacio (urbanizaciones cerradas, centros comerciales), vaciando la calle; la televisión sustituye a la plaza como lugar de encuentro. (Ladrillo de: 'Tema VI: antropología urbana aplicada')"},{"id":"an1-u126","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p23","enunciado":"¿Cuál de estos procesos aborda el tema de cultura urbana?","opciones":["La ruralización acelerada de las grandes megaciudades actuales","El fin de las desigualdades gracias a la conectividad digital","La desurbanización del espacio público y la hibridación cultural"],"correcta":2,"explicacion":"Junto a la ciudad informacional y las nuevas formas de ser urbanos. (Ladrillo de: 'Tema VI: antropología urbana aplicada')"},{"id":"an1-u127","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p23","enunciado":"Analizar la gentrificación de un barrio permite enlazar...","opciones":["La capa globalizada (turismo, plataformas) con imaginarios de miedo y distinción","El evolucionismo decimonónico con las teorías clásicas del progreso","La gramática segmentaria de Baumann con el vocabulario focal de Kottak"],"correcta":0,"explicacion":"La etnografía revela cómo lo viven vecinos y recién llegados; también valen como casos un centro comercial o las fiestas de tu ciudad. (Ladrillo de: 'Tema VI: antropología urbana aplicada')"},{"id":"an1-u128","tema":"Tema 6: Cultura urbana","fuente":"pregunta:an1-p23","enunciado":"¿Cuál es la aportación antropológica al estudio de la ciudad?","opciones":["Un modelo macroeconómico capaz de predecir el crecimiento urbano futuro","Una mirada micro, etnográfica y comparativa que recupera la voz de los habitantes","Un catálogo patrimonial exhaustivo de los edificios históricos protegidos"],"correcta":1,"explicacion":"Frente a las visiones macro, devuelve la agencia y la experiencia de quienes habitan la ciudad. (Ladrillo de: 'Tema VI: antropología urbana aplicada')"},{"id":"an1-u129","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p24","enunciado":"¿Cómo ordenaba las culturas el evolucionismo decimonónico de Morgan y Tylor?","opciones":["En áreas culturales difundidas desde varios centros independientes de invención","En tipos estructurales sincrónicos, sin ninguna jerarquía valorativa entre ellos","En una escala única: salvajismo, barbarie y civilización, con Occidente en la cima"],"correcta":2,"explicacion":"Esa escala unilineal es el blanco principal de la crítica de Lévi-Strauss. (Ladrillo de: 'Crítica al evolucionismo según Lévi-Strauss')"},{"id":"an1-u130","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p24","enunciado":"Para Lévi-Strauss, ¿qué relación existe entre raza y diversidad cultural?","opciones":["Ninguna: la diversidad se debe a circunstancias históricas, geográficas y sociológicas","Directa: cada raza produce un tipo propio y característico de cultura","Parcial: la raza explica la técnica, pero no el arte ni la religión"],"correcta":0,"explicacion":"Confundir raza y cultura es el pecado original del racismo; Kottak aporta además la demolición biológica del concepto de raza. (Ladrillo de: 'Crítica al evolucionismo según Lévi-Strauss')"},{"id":"an1-u131","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p24","enunciado":"¿En qué consiste el 'falso evolucionismo' que critica Lévi-Strauss?","opciones":["Negar que exista evolución biológica alguna dentro de la especie humana","Tratar culturas contemporáneas como etapas de una misma serie, negando su historia propia","Aplicar la selección natural darwiniana a las instituciones sociales modernas"],"correcta":1,"explicacion":"Toda sociedad tiene tanta historia como las demás: distinguir 'pueblos sin historia' es una ilusión de perspectiva. (Ladrillo de: 'Crítica al evolucionismo según Lévi-Strauss')"},{"id":"an1-u132","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p24","enunciado":"¿Por qué es etnocéntrica la noción habitual de 'progreso', según Lévi-Strauss?","opciones":["Porque niega los avances tecnológicos alcanzados por el propio Occidente","Porque presupone que el progreso humano es imposible de medir o comparar","Mide con criterios propios (energía, tecnología); con otros criterios, otras culturas 'ganan'"],"correcta":2,"explicacion":"Historia acumulativa o estacionaria dependen del punto de vista del observador: 'el bárbaro es, ante todo, el hombre que cree en la barbarie'. (Ladrillo de: 'Crítica al evolucionismo según Lévi-Strauss')"},{"id":"an1-u133","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p24","enunciado":"¿De dónde nace el progreso real según Lévi-Strauss?","opciones":["De la colaboración: toda civilización es una coalición de culturas","Del aislamiento que preserva intacta la pureza de cada cultura","De la competencia militar sostenida entre potencias vecinas"],"correcta":0,"explicacion":"El Neolítico o la modernidad europea son acumulaciones multiculturales (cero indio, pólvora china, agricultura americana); la diversidad es el recurso y su homogeneización, el riesgo. (Ladrillo de: 'Crítica al evolucionismo según Lévi-Strauss')"},{"id":"an1-u134","tema":"Tema 3: La construcción sociocultural de las diferencias","fuente":"pregunta:an1-p24","enunciado":"¿Qué lecturas del curso hacen eco de la crítica al etnocentrismo evolucionista?","opciones":["Labov, Tannen, Lakoff y Bourdieu","Bohannan, Brown, Stuart Hall y Baumann","Van Gennep, Turner, Wallace y Finnegan"],"correcta":1,"explicacion":"Bohannan (no hay interpretaciones universales evidentes), Brown (relativismo antietnocéntrico), Hall y Baumann (el 'primitivo' como construcción del otro). (Ladrillo de: 'Crítica al evolucionismo según Lévi-Strauss')"}]},{"id":"pensamiento","nombre":"Introducción al Pensamiento Científico","nombreCorto":"P. Científico","formatoExamen":"Dos partes de 5 puntos: (1) test de 10 preguntas con 3 opciones (acierto +0,5, error -0,15; se exige mínimo 2,5 en el test para poder aprobar; se responde en hoja de lectura óptica) y (2) comentario de un texto con 2 preguntas de desarrollo (2,5 puntos cada una, máximo una cara por pregunta). Duración: 120 minutos. Material permitido: ninguno. El examen pondera 85% (PEC 15%; sin PEC la nota máxima es 8,5 y se aprueba con 6 en el examen).","temas":["Tema 1: ¿Qué es la ciencia? (ciencia, hechos y evidencia; conocimiento empírico y observación; experimentación; el método científico)","Tema 2: Los límites de lo científico (los problemas de la inducción; probabilidad y estadística; modelos y aproximación; paradigmas y cambio científico)","Tema 3: La ciencia en sociedad (criterio de demarcación; ciencia vs no ciencia, pseudociencia y anticiencia; la ciencia como producto social; instituciones científicas)"],"preguntas":[{"id":"pc1-p01","tipo":"test","enunciado":"En un razonamiento deductivo inválido:","variantes":[],"apariciones":["2022 Sep","2023 Feb-1","2024 Feb-2","2025 Feb-1","2025 Feb-2","2026 Feb-1"],"frecuencia":6,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Necesariamente, si las premisas son verdaderas, las conclusiones serán falsas.","b) Necesariamente, si las premisas son falsas, las conclusiones serán falsas.","c) Puede que las premisas sean verdaderas y las conclusiones falsas."],"correcta":2,"explicacion":"La validez deductiva consiste precisamente en que la verdad de las premisas garantiza la de la conclusión. Si el razonamiento es inválido, esa garantía falta: es posible que las premisas sean verdaderas y la conclusión falsa. Las opciones a) y b) enuncian necesidades que no se dan: la invalidez no fuerza conclusiones falsas, solo deja abierta esa posibilidad."},{"id":"pc1-p02","tipo":"test","enunciado":"¿Qué son los modelos científicos?","variantes":["Los modelos científicos son","Los modelos científicos"],"apariciones":["2023 Feb-2","2024 Sep (x2, preguntas 6 y 8 del mismo examen)","2025 Feb-1","2026 Feb-2"],"frecuencia":4,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Representaciones de los fenómenos estudiados compatibles con toda la evidencia y observaciones disponibles.","b) Idealizaciones que sirven para aproximarse a las realidades abordadas.","c) Guías de actuación para los científicos."],"correcta":1,"explicacion":"Un modelo simplifica e idealiza deliberadamente (planos sin rozamiento, gases ideales, organismos modelo) para hacer manejable el fenómeno: no pretende ser copia fiel ni compatible con toda la evidencia (a), ni es una guía normativa de conducta (c). En las variantes de 2025 y 2026 la respuesta correcta es la opción equivalente 'son/involucran idealizaciones'."},{"id":"pc1-p03","tipo":"test","enunciado":"¿Qué es la evidencia?","variantes":[],"apariciones":["2022 Feb-1","2023 Feb-1","2024 Sep","2026 Feb-2"],"frecuencia":4,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Una creencia trivial o irrelevante.","b) Una verdad obvia.","c) Pruebas o indicios acerca de la verdad de una proposición."],"correcta":2,"explicacion":"En filosofía de la ciencia 'evidencia' no significa obviedad (falso amigo del inglés 'evidence'): son las pruebas o indicios que apoyan o socavan la verdad de una proposición. No es una creencia (a) ni tiene por qué ser obvia (b)."},{"id":"pc1-p04","tipo":"test","enunciado":"Las predicciones derivables de una hipótesis son:","variantes":[],"apariciones":["2022 Feb-1","202
