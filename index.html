4 Feb-1","2025 Feb-1","2025 Feb-2"],"frecuencia":4,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Aquellas proposiciones que tienen como consecuencia la verdad de la hipótesis.","b) Las consecuencias que se seguirían de la verdad de la hipótesis.","c) Aquellas proposiciones incompatibles con la verdad de la hipótesis."],"correcta":1,"explicacion":"En el método hipotético-deductivo las predicciones se deducen de la hipótesis: son lo que ocurriría si la hipótesis fuera verdadera. La opción a) invierte la dirección lógica (sería afirmación del consecuente) y la c) describe refutadores potenciales, no predicciones."},{"id":"pc1-p05","tipo":"test","enunciado":"¿Cuál es el problema de la inducción?","variantes":["El problema de la inducción se debe a que: c) La conclusión de un razonamiento inductivo puede ser falsa incluso si todas las premisas son verdaderas (2024 Feb-2)"],"apariciones":["2022 Feb-2","2023 Sep","2024 Feb-2","2026 Feb-2"],"frecuencia":4,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Un razonamiento inductivo correcto requiere realizar un gran número de observaciones, lo cual no es siempre fácil.","b) En principio, es una posibilidad abierta que las premisas de una inferencia inductiva sean verdaderas pero la generalización alcanzada en la conclusión sea falsa (porque haya excepciones todavía no observadas a tal generalización).","c) Nunca podremos saber con certeza si las premisas de un razonamiento inductivo son verdaderas."],"correcta":1,"explicacion":"El problema (Hume) es lógico, no práctico: la inducción no es deductivamente válida, pues la verdad de las premisas (casos observados) no garantiza la conclusión general: siempre pueden aparecer excepciones no observadas. No es una cuestión de cantidad de observaciones (a) ni de incertidumbre sobre las premisas (c). En la variante de 2024 Feb-2 la correcta es la opción equivalente c."},{"id":"pc1-p06","tipo":"test","enunciado":"Cuando dos variables están perfectamente correlacionadas:","variantes":[],"apariciones":["2023 Feb-2","2024 Sep","2026 Feb-1"],"frecuencia":3,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Existe necesariamente una relación causal entre ellas, ya que de otro modo no sería un resultado estadísticamente significativo.","b) No siempre puede concluirse que exista una relación causal entre ellas.","c) El resultado es nulo, ya que no resulta estadísticamente significativo."],"correcta":1,"explicacion":"Correlación no implica causalidad: la asociación puede deberse a un tercer factor o al azar, incluso siendo perfecta. La opción a) comete la falacia clásica y la c) confunde correlación perfecta con resultado nulo, que es lo contrario."},{"id":"pc1-p07","tipo":"test","enunciado":"La repetición y replicación de observaciones científicas:","variantes":[],"apariciones":["2022 Sep","2025 Feb-1","2026 Feb-1"],"frecuencia":3,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Carece de relevancia científica, al no ofrecer evidencia novedosa.","b) Tiene un papel esencial en la investigación, ya que permite descubrir posibles errores y garantiza que la evidencia observacional resultante sea utilizable por distintos investigadores.","c) Tiene un papel secundario en la investigación, aunque puede ser importante en el proceso de formación y educación de científicos inexpertos."],"correcta":1,"explicacion":"El carácter público y reproducible de la observación es un rasgo definitorio de la evidencia científica: replicar permite detectar errores, sesgos y fraudes, y convierte la observación en evidencia compartida. Por eso no es irrelevante (a) ni meramente pedagógica (c)."},{"id":"pc1-p08","tipo":"test","enunciado":"La estimación de que la temperatura en una habitación es de entre 25 y 27°C:","variantes":["La medición de que la temperatura en una habitación es de entre 25 y 27°C (2022 Feb-1)"],"apariciones":["2022 Feb-1","2024 Feb-1","2025 Feb-1"],"frecuencia":3,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Es incorrecta, ya que no da un valor máximamente preciso.","b) Es imprecisa, pero puede ser correcta.","c) No es informativa, ya que no elimina por completo la incertidumbre."],"correcta":1,"explicacion":"Precisión y corrección son cosas distintas: un intervalo es menos preciso que un valor puntual, pero será correcto si el valor real cae dentro de él. Además sí es informativo, pues reduce (aunque no elimine) la incertidumbre; por eso fallan a) y c)."},{"id":"pc1-p09","tipo":"test","enunciado":"Según el falsacionismo de Popper:","variantes":[],"apariciones":["2022 Feb-2","2023 Sep","2025 Feb-1"],"frecuencia":3,"tema":"Tema 2: Los límites de lo científico","opciones":["a) La función principal de la observación en la ciencia es refutar hipótesis, no confirmarlas.","b) La función principal de la observación en la ciencia es confirmar hipótesis, no refutarlas.","c) La observación de un número suficiente de casos que cumplan una generalización permite concluir que tal generalización está confirmada."],"correcta":0,"explicacion":"Popper rechaza la confirmación inductiva (por el problema de la inducción): ninguna cantidad de casos favorables prueba una hipótesis universal, pero un solo contraejemplo la refuta. La observación sirve, pues, para someter a prueba (intentar falsar) las conjeturas; b) y c) describen justamente el inductivismo que Popper combate."},{"id":"pc1-p10","tipo":"test","enunciado":"¿Según Kuhn, qué determina que un paradigma sustituya a otro?","variantes":[],"apariciones":["2023 Feb-2","2025 Feb-1","2025 Sep"],"frecuencia":3,"tema":"Tema 2: Los límites de lo científico","opciones":["a) El nuevo paradigma quedará verificado por la evidencia de manera más completa que el anterior.","b) El cambio de paradigma no siempre se debe exclusivamente a un mejor apoyo evidencial.","c) El nuevo paradigma será compatible con toda la evidencia disponible, mientras que el antiguo habrá quedado falsado por una anomalía."],"correcta":1,"explicacion":"Para Kuhn la elección entre paradigmas no queda fijada solo por la evidencia (inconmensurabilidad): intervienen valores, promesas de fecundidad y factores sociológicos de la comunidad. Ni hay verificación completa (a) ni el nuevo paradigma carece de anomalías o el viejo cae por una sola falsación (c). En 2025 Sep las opciones aparecen reordenadas y la correcta es la a."},{"id":"pc1-p11","tipo":"test","enunciado":"Una hipótesis que quede expuesta a ser refutada empíricamente...","variantes":[],"apariciones":["2022 Feb-2","2023 Sep","2026 Feb-2"],"frecuencia":3,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Es admisible como hipótesis científica, porque es falsable.","b) Es inadmisible como hipótesis científica, porque no es falsable.","c) Es inadmisible como hipótesis científica, porque es falsa."],"correcta":0,"explicacion":"Estar expuesta a refutación es precisamente ser falsable, y para Popper esa es la marca de la cientificidad: la hipótesis se juega algo ante la experiencia. Falsable no significa falsa (c), y la b) contradice la definición misma."},{"id":"pc1-p12","tipo":"test","enunciado":"En un razonamiento inductivo:","variantes":[],"apariciones":["2023 Feb-2","2025 Feb-2","2025 Sep"],"frecuencia":3,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Las conclusiones solo son verdaderas de manera aproximada.","b) La verdad de las premisas nunca está garantizada.","c) La verdad de las conclusiones no está garantizada por la verdad de las premisas."],"correcta":2,"explicacion":"Es la definición de inferencia ampliativa: las premisas apoyan la conclusión pero no la implican deductivamente. La conclusión puede ser exactamente verdadera (contra a), y el problema no está en las premisas (b) sino en el salto de premisas a conclusión."},{"id":"pc1-p13","tipo":"test","enunciado":"¿Qué es un estudio de replicación?","variantes":["¿Cómo se llaman las investigaciones que buscan reproducir resultados obtenidos en un experimento previo?"],"apariciones":["2022 Feb-1","2024 Feb-2","2025 Feb-2"],"frecuencia":3,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Un estudio en el que se plantean objeciones a un estudio previo.","b) Un estudio en el que se presenta un experimento que refuta una hipótesis teórica relevante.","c) Un estudio en el que se busca reproducir los resultados obtenidos en un experimento previo."],"correcta":2,"explicacion":"Replicar es repetir el experimento para comprobar si los resultados se reproducen, pieza clave del control de calidad de la ciencia (crisis de replicación). No consiste en objetar (a) ni necesariamente en refutar (b)."},{"id":"pc1-p14","tipo":"test","enunciado":"¿Cuál de estos enunciados es falsable según Popper?","variantes":["2020 Feb-1"],"apariciones":["2020 Feb-1","2022 Sep","2023 Feb-2"],"frecuencia":3,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) La fuerza neta aplicada sobre un cuerpo es proporcional a la aceleración que adquiere dicho cuerpo.","b) Nuestro destino está predeterminado por una providencia divina.","c) El motor de la historia es la lucha de clases."],"correcta":0,"explicacion":"Un enunciado es falsable si existe alguna observación posible que lo refutaría. Las leyes físicas (segunda ley de Newton, dilatación de metales) hacen predicciones precisas y arriesgadas; en cambio, la providencia divina, la astrología, el psicoanálisis o el marxismo (ejemplos clásicos de Popper) se acomodan a cualquier resultado y no se exponen a refutación."},{"id":"pc1-p15","tipo":"test","enunciado":"Según el verificacionismo...","variantes":["2020 Feb-1","2026 Feb-2: b) Los resultados obtenidos aplicando un método científico riguroso son siempre verdaderos"],"apariciones":["2020 Feb-1","2025 Feb-2","2026 Feb-2"],"frecuencia":3,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Las hipótesis científicas deben ser corroboradas por la experiencia.","b) Las hipótesis científicas son siempre verdaderas.","c) Las hipótesis científicas deben poder expresarse siempre de forma matemática."],"correcta":0,"explicacion":"El verificacionismo (Círculo de Viena) sostiene que un enunciado es científico/significativo si puede ser verificado (corroborado) por la experiencia. No afirma la verdad garantizada del conocimiento (b) ni exige formulación matemática (c)."},{"id":"pc1-p16","tipo":"test","enunciado":"¿Qué es un sesgo cognitivo?","variantes":[],"apariciones":["2022 Feb-1","2025 Feb-1"],"frecuencia":2,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Una distorsión sistemática en la evaluación e interpretación de la evidencia disponible.","b) Un método sistemático para evaluar la evidencia disponible.","c) Una creencia falsa pero con utilidad práctica."],"correcta":0,"explicacion":"Un sesgo cognitivo es una desviación sistemática (no aleatoria) en cómo procesamos la evidencia: p. ej., el sesgo de confirmación. No es un método (b) ni una creencia concreta (c), sino una tendencia distorsionadora."},{"id":"pc1-p17","tipo":"test","enunciado":"¿Es toda la ciencia empírica experimental?","variantes":[],"apariciones":["2020 Feb-1","2025 Sep"],"frecuencia":2,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Existen disciplinas científicas de carácter empírico en las que el papel de los experimentos es limitado, y en las que la evidencia empírica se obtiene fundamentalmente a través de observaciones no experimentales.","b) En la actualidad, toda la ciencia empírica es experimental.","c) La única ciencia no experimental son las matemáticas."],"correcta":0,"explicacion":"La astronomía, la geología o la epidemiología observacional son empíricas sin ser fundamentalmente experimentales: no siempre se puede manipular el objeto de estudio. Por eso b) es falsa; y c) confunde ciencia formal (matemáticas, no empírica) con ciencia empírica no experimental."},{"id":"pc1-p18","tipo":"test","enunciado":"¿En qué consisten los argumentos de autoridad?","variantes":[],"apariciones":["2024 Feb-1","2024 Feb-2"],"frecuencia":2,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Son argumentos a favor de una tesis que apelan exclusivamente al hecho de que una autoridad la ha defendido.","b) Son argumentos que ofrecen evidencia incuestionable a favor de una tesis.","c) Son argumentos que no pueden ser objeto de duda racional."],"correcta":0,"explicacion":"El argumento de autoridad apoya una tesis solo en que alguien con autoridad la sostiene. Puede tener algún valor (expertos fiables), pero nunca ofrece evidencia incuestionable ni está exento de duda racional, por lo que b) y c) son falsas."},{"id":"pc1-p19","tipo":"test","enunciado":"El holismo de la refutación empírica sostiene que:","variantes":[],"apariciones":["2023 Feb-1","2024 Feb-2"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) La evidencia empírica nunca permite descartar hipótesis científicas.","b) En general, la evidencia empírica permite refutar directamente hipótesis aisladas.","c) En general, la evidencia empírica no permite refutar directamente hipótesis aisladas, sino solo en combinación con otras hipótesis auxiliares y presuposiciones."],"correcta":2,"explicacion":"Es la tesis Duhem-Quine: las predicciones se derivan de la hipótesis junto con hipótesis auxiliares (instrumentos, condiciones iniciales), así que una predicción fallida solo refuta el conjunto, sin decirnos qué componente falla. No dice que nunca se descarten hipótesis (a), y b) es justo lo que niega."},{"id":"pc1-p20","tipo":"test","enunciado":"¿Cuándo se produce un cambio de paradigma, según Kuhn?","variantes":["¿Cuándo se produce un cambio de paradigma? (2020 Feb-1, sin mención explícita de Kuhn)"],"apariciones":["2020 Feb-1","2024 Feb-1"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Cuando un nuevo paradigma demuestra ser mejor que el anterior.","b) Cuando el paradigma antiguo se agota y no resulta ya productivo.","c) Cuando la mayoría de los miembros de la comunidad científica decide asumir un nuevo paradigma, independientemente de los motivos por los que lo haga."],"correcta":2,"explicacion":"En Kuhn el cambio de paradigma es un fenómeno de la comunidad científica: ocurre cuando esta lo adopta, sin que exista una demostración neutral de superioridad (inconmensurabilidad) ni baste el mero agotamiento del paradigma viejo. Por eso a) y b) fallan: describen criterios objetivos que Kuhn cuestiona."},{"id":"pc1-p21","tipo":"test","enunciado":"¿Qué es la pseudociencia?","variantes":[],"apariciones":["2020 Feb-2","2024 Feb-2"],"frecuencia":2,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) No-ciencia haciéndose pasar por ciencia.","b) Ciencia mal planteada y que no ofrece buenos resultados.","c) El tipo de conocimiento que no muestra las garantías suficientes para ser considerado científico."],"correcta":0,"explicacion":"Lo definitorio de la pseudociencia es la impostura: es no-ciencia que imita la apariencia de la ciencia para aprovechar su prestigio (astrología, homeopatía). No es ciencia defectuosa (b), y c) describe la no-ciencia en general, sin el elemento de hacerse pasar por ciencia."},{"id":"pc1-p22","tipo":"test","enunciado":"Según el falsacionismo, no podemos estar seguros de estar en lo cierto pero podemos saber...","variantes":[],"apariciones":["2020 Feb-2","2022 Feb-1"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Si estamos cerca de estarlo.","b) Si vamos a estarlo en algún momento, aunque sea muy lejano.","c) Si estamos equivocados."],"correcta":2,"explicacion":"Es la asimetría popperiana entre verificación y falsación: ningún número de éxitos prueba una teoría universal, pero un contraejemplo muestra que es falsa. No podemos medir la cercanía a la verdad de forma concluyente (a) ni predecir verificaciones futuras (b)."},{"id":"pc1-p23","tipo":"test","enunciado":"Según el falsacionismo sofisticado de Imre Lakatos...","variantes":[],"apariciones":["2022 Feb-1","2024 Feb-2"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Las teorías y postulados científicos no se pueden considerar aisladamente, pues forman parte de programas de investigación.","b) El progreso en ciencia es imposible dada la inconmensurabilidad de los paradigmas.","c) La ciencia no supone un tipo de conocimiento cualitativamente distinto del resto. El principio que debe regir es el 'todo vale'."],"correcta":0,"explicacion":"Lakatos evalúa programas de investigación (núcleo firme + cinturón protector de hipótesis auxiliares), progresivos o degenerativos, no teorías aisladas. La b) alude a una lectura extrema de Kuhn y la c) es el anarquismo de Feyerabend."},{"id":"pc1-p24","tipo":"test","enunciado":"Para que la observación ofrezca evidencia científica valiosa...","variantes":[],"apariciones":["2022 Feb-2","2023 Sep"],"frecuencia":2,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Es indispensable que se realice mediante procedimientos novedosos difícilmente reproducibles por otros grupos de investigación.","b) Es deseable que se realice mediante procesos protocolarizados que puedan ser reproducidos por otros grupos de investigación.","c) Ha de ser realizada sin ayuda de instrumentos."],"correcta":1,"explicacion":"La evidencia observacional vale en la medida en que es pública, protocolarizada y reproducible: así otros pueden comprobarla y usarla. La irreproducibilidad (a) es un defecto, no una virtud, y los instrumentos (c) son perfectamente legítimos y a menudo imprescindibles."},{"id":"pc1-p25","tipo":"test","enunciado":"El uso de instrumentos de observación...","variantes":[],"apariciones":["2022 Feb-2","2023 Sep"],"frecuencia":2,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Incrementa necesariamente la imprecisión de la observación.","b) Permite realizar observaciones infalibles.","c) Permite superar limitaciones de nuestras capacidades perceptivas."],"correcta":2,"explicacion":"Telescopios, microscopios o termómetros amplían y afinan lo que podemos observar (caso paradigmático: las lunas de Júpiter de Galileo). No garantizan infalibilidad (b) ni aumentan necesariamente la imprecisión (a): suelen reducirla."},{"id":"pc1-p26","tipo":"test","enunciado":"¿Qué son los sesgos estadísticos?","variantes":[],"apariciones":["2022 Feb-2","2023 Sep"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Métodos empleados para analizar estadísticamente grandes conjuntos de datos.","b) Métodos de análisis estadístico que garantizan la obtención de resultados imparciales y objetivos.","c) Distorsiones introducidas en el análisis estadístico, debido a deficiencias en los métodos de análisis o en la recolección de datos, a consecuencia de las cuales las conclusiones extraídas en el análisis no reflejan propiedades genuinas de la población o fenómeno estudiado."],"correcta":2,"explicacion":"Un sesgo estadístico es una distorsión sistemática (p. ej., muestra no representativa, sesgo de selección) que hace que las conclusiones no reflejen la población real. No es un método de análisis (a, b): es precisamente lo que los buenos métodos intentan evitar."},{"id":"pc1-p27","tipo":"test","enunciado":"¿Cuál es la relación entre el creacionismo y la teoría del diseño inteligente?","variantes":[],"apariciones":["2022 Feb-2","2023 Sep"],"frecuencia":2,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) La teoría del diseño inteligente asume el creacionismo.","b) Son la misma cosa.","c) El creacionismo ha sido reemplazado en la actualidad por la teoría del diseño inteligente."],"correcta":0,"explicacion":"El diseño inteligente es una reformulación con apariencia científica que presupone la tesis creacionista de un agente creador/diseñador. No son idénticos (el DI evita referencias religiosas explícitas) ni el creacionismo clásico ha desaparecido: ambos coexisten."},{"id":"pc1-p28","tipo":"test","enunciado":"Según los anticientificistas...","variantes":[],"apariciones":["2022 Feb-2","2023 Sep"],"frecuencia":2,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) La ciencia no es capaz de cumplir con ningún criterio de demarcación.","b) No importa cuál sea el criterio de demarcación científico porque la ciencia como tal es una actividad que se debe eliminar (o al menos reconsiderar profundamente).","c) Los científicos no son capaces de juzgar su propia actividad."],"correcta":1,"explicacion":"El anticientificismo no discute dónde poner la frontera de lo científico, sino que rechaza el valor mismo de la ciencia como institución o forma de conocimiento: aunque la demarcación funcionara, la ciencia debería eliminarse o reconsiderarse. Las otras opciones plantean tesis sobre demarcación o autocrítica que no definen la posición."},{"id":"pc1-p29","tipo":"test","enunciado":"Según los enfoques feministas de la ciencia:","variantes":[],"apariciones":["2022 Feb-2","2023 Sep"],"frecuencia":2,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Solo es válida la ciencia hecha por mujeres.","b) La ciencia está determinada por el androcentrismo de la sociedad.","c) La ciencia no es un conocimiento válido porque, dada su naturaleza como producto de una sociedad androcéntrica, solo puede ser ejercida por hombres."],"correcta":1,"explicacion":"La epistemología feminista (Harding, Longino, Keller) sostiene que la ciencia, como producto social, refleja el androcentrismo dominante en sus prioridades, métodos y sesgos; de ahí la necesidad de crítica y pluralidad de perspectivas. No afirma que solo valga la ciencia de mujeres (a) ni que la ciencia sea inválida o exclusiva de hombres (c)."},{"id":"pc1-p30","tipo":"test","enunciado":"¿Qué son los ensayos clínicos?","variantes":[],"apariciones":["2022 Feb-2","2023 Sep"],"frecuencia":2,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Pruebas que se llevan a cabo dentro de hospitales y otros centros de asistencia sanitaria, tales como análisis de sangre, radiografías, etc.","b) Literatura científica especializada en las áreas de la salud y la biomedicina.","c) Estudios experimentales en los que se investiga la efectividad y seguridad de un medicamento o tratamiento."],"correcta":2,"explicacion":"Un ensayo clínico es un experimento (idealmente aleatorizado y con grupo de control) que evalúa eficacia y seguridad de tratamientos. No son pruebas diagnósticas rutinarias (a) ni un género de publicaciones (b)."},{"id":"pc1-p31","tipo":"test","enunciado":"Si en un experimento se manipula la variable X y a continuación se observa un efecto Y:","variantes":[],"apariciones":["2022 Sep","2023 Feb-1"],"frecuencia":2,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) En general, siempre puede afirmarse que la manipulación en X ha causado el efecto Y.","b) No siempre puede concluirse directamente que la variación en X ha causado el efecto Y: antes hay que descartar la posible interferencia de otros factores.","c) Nunca puede concluirse con suficiente seguridad que un efecto Y tiene como causa la manipulación de una variable X."],"correcta":1,"explicacion":"La inferencia causal exige control: hay que descartar variables de confusión y coincidencias antes de atribuir Y a X. La a) ignora esos factores; la c) cae en un escepticismo excesivo, pues con experimentos bien controlados sí se justifican conclusiones causales."},{"id":"pc1-p32","tipo":"test","enunciado":"Un modelo es aceptable científicamente:","variantes":["¿Cuándo un modelo es aceptable científicamente?"],"apariciones":["2022 Sep","2025 Feb-2"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Si no se basa en asunciones erróneas.","b) Si refleja fielmente la realidad.","c) Si permite realizar inferencias útiles sobre la realidad."],"correcta":2,"explicacion":"Los modelos se valoran por su utilidad inferencial y predictiva, no por su fidelidad literal: todos idealizan y contienen asunciones estrictamente falsas (gases ideales, mapas). Por eso a) y b) impondrían un criterio que ningún modelo cumple."},{"id":"pc1-p33","tipo":"test","enunciado":"¿Qué es un experimento?","variantes":[],"apariciones":["2023 Feb-2","2026 Feb-1"],"frecuencia":2,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Un experimento es una observación cuyo resultado no se conoce de antemano.","b) Un experimento consiste en una serie sistemática de observaciones realizadas mediante el uso de instrumentos.","c) Un experimento consiste en la manipulación de un objeto de estudio para observar los efectos resultantes de dicha manipulación."],"correcta":2,"explicacion":"Lo distintivo del experimento frente a la mera observación es la intervención activa: se manipula el sistema para ver qué efectos produce. Ni la novedad del resultado (a) ni el uso de instrumentos (b) definen la experimentación."},{"id":"pc1-p34","tipo":"test","enunciado":"¿Puede un modelo falso ser válido?","variantes":[],"apariciones":["2024 Feb-2","2025 Sep"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Sí, si da lugar a resultados interesantes y pertinentes.","b) No, porque solo servirá a sumar confusión.","c) Sí, porque todos los modelos son, por definición, válidos para la ciencia."],"correcta":0,"explicacion":"Todos los modelos son estrictamente falsos en cuanto idealizaciones, pero muchos son válidos porque generan predicciones y explicaciones pertinentes ('todos los modelos son falsos, algunos son útiles'). La b) niega esa práctica científica habitual y la c) exagera: hay modelos inservibles."},{"id":"pc1-p35","tipo":"test","enunciado":"Una hipótesis:","variantes":[],"apariciones":["2024 Feb-1","2026 Feb-1"],"frecuencia":2,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Nunca es exactamente verdadera, aunque puede ser una buena aproximación.","b) Siempre es falsable empíricamente.","c) Puede ser infalsable empíricamente."],"correcta":2,"explicacion":"Hay hipótesis no falsables (p. ej., 'existe una providencia que guía el destino'): pueden formularse como hipótesis, aunque no sean científicas según Popper. Por eso b) es falsa; y a) también: una hipótesis puede ser exactamente verdadera."},{"id":"pc1-p36","tipo":"test","enunciado":"Según el escepticismo humeano sobre la inducción:","variantes":["Versión abreviada 2025 Feb-2"],"apariciones":["2024 Sep","2025 Feb-2"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) No existe justificación racional para realizar razonamientos inductivos: nuestra tendencia a aceptar generalizaciones a partir de la observación de casos particulares es un mero hábito psicológico, una inclinación mental fruto de la costumbre.","b) Solo estamos justificados a realizar razonamientos inductivos si partimos de observaciones hechas en condiciones ideales.","c) Nunca podremos estar seguros de si las premisas de un razonamiento inductivo son verdaderas."],"correcta":0,"explicacion":"Hume concluye que la inducción no puede justificarse ni deductivamente ni sin circularidad: la practicamos por hábito o costumbre, no por razón. No es una cuestión de condiciones ideales (b) ni de dudas sobre las premisas (c)."},{"id":"pc1-p37","tipo":"test","enunciado":"Las motivaciones de los científicos:","variantes":[],"apariciones":["2024 Sep","2025 Feb-1"],"frecuencia":2,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Son exclusivamente epistémicas (en concreto la búsqueda de conocimiento objetivo), ya que la ciencia aspira a la verdad.","b) Incluyen motivaciones prácticas, como la búsqueda de reconocimiento y la obtención de premios y financiación.","c) Cuando un científico está motivado por intereses prácticos, los resultados de su investigación son fraudulentos."],"correcta":1,"explicacion":"Los estudios sociales de la ciencia muestran que los científicos combinan motivaciones epistémicas con prestigio, carrera y financiación, sin que eso invalide por sí mismo sus resultados: el control lo ponen las instituciones (revisión por pares, replicación). Por eso a) es idealizada y c) confunde motivación con fraude."},{"id":"pc1-p38","tipo":"test","enunciado":"¿Qué quiere decir que dos paradigmas son inconmensurables?","variantes":[],"apariciones":["2023 Feb-1","2026 Feb-1"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Que son paradigmas incomparables, por usar marcos conceptuales y criterios de evaluación radicalmente diferentes.","b) Que uno de ellos ha sustituido al otro, mediante una revolución científica tras un periodo de ciencia normal.","c) Que son paradigmas defendidos por científicos de escuelas rivales, sin que uno de ellos haya acabado de imponerse."],"correcta":0,"explicacion":"Inconmensurabilidad (Kuhn/Feyerabend) significa que no hay una medida común: los paradigmas difieren en conceptos, problemas relevantes y criterios de evaluación, lo que impide una comparación punto por punto neutral. No alude a la sucesión histórica (b) ni a la mera rivalidad (c)."},{"id":"pc1-p39","tipo":"test","enunciado":"¿Cuáles son los tres criterios de demarcación que hemos abordado durante el curso?","variantes":["¿Cuáles son los tres criterios de demarcación principales en filosofía de la ciencia?"],"apariciones":["2023 Feb-1","2025 Feb-2"],"frecuencia":2,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Correspondencia con el paradigma, falsabilidad y verificabilidad.","b) Pseudociencia, no-ciencia y anti-ciencia.","c) Evidencia, observación y experimentación."],"correcta":0,"explicacion":"Los tres criterios de demarcación estudiados son el verificacionismo (Círculo de Viena), la falsabilidad (Popper) y la correspondencia con el paradigma vigente (enfoque kuhniano/social). La b) enumera tipos de discursos no científicos y la c) fuentes de evidencia, no criterios de demarcación."},{"id":"pc1-p40","tipo":"test","enunciado":"Una medida imprecisa:","variantes":["Un resultado impreciso"],"apariciones":["2022 Sep","2023 Feb-2"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Es necesariamente errónea, ya que no incluye el valor correcto.","b) No reduce completamente la incertidumbre acerca de la propiedad medida.","c) Carece por completo de utilidad práctica."],"correcta":1,"explicacion":"Imprecisión significa que queda un margen de incertidumbre (un intervalo, no un valor exacto), pero la medida puede ser correcta si el valor real está en ese margen, y puede ser muy útil. Por eso a) y c) son falsas."},{"id":"pc1-p41","tipo":"desarrollo","enunciado":"Texto de Kuhn (2002: 25) sobre los cambios revolucionarios: 'Los cambios revolucionarios son diferentes y bastante más problemáticos. Ponen en juego descubrimientos que no pueden acomodarse dentro de los conceptos que eran habituales antes de que se hicieran dichos descubrimientos...'. Pregunta 1: ¿Qué es, para Kuhn, un 'cambio revolucionario' en ciencia? Pregunta 2: Explica por qué Kuhn afirma que ciertos descubrimientos 'no pueden acomodarse dentro de los conceptos que eran habituales antes de que se hicieran dichos descubrimientos'.","variantes":[],"apariciones":["2022 Feb-2","2025 Feb-2"],"frecuencia":2,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Cambio revolucionario: sustitución de un paradigma por otro, frente a la acumulación gradual de la ciencia normal.","x":"En La estructura de las revoluciones científicas, Kuhn distingue ciencia normal (resolución de enigmas dentro del paradigma) y revoluciones, que reorganizan globalmente conceptos, métodos y problemas legítimos de un campo."},{"b":"Surge cuando se acumulan anomalías persistentes que el paradigma vigente no logra resolver, generando una crisis.","x":"Las anomalías aisladas no bastan; solo cuando resisten reiteradamente y afectan a cuestiones centrales, la comunidad entra en crisis y explora alternativas."},{"b":"No es mera adición de conocimiento: exige reaprender a ver el mundo, como un cambio de gestalt.","x":"Kuhn compara la conversión a un nuevo paradigma con un cambio perceptivo global: tras la revolución, los científicos 'viven en un mundo diferente'."},{"b":"Los conceptos están definidos por el paradigma: el descubrimiento revolucionario viola la taxonomía conceptual previa.","x":"Por eso ciertos descubrimientos no pueden 'acomodarse': términos como planeta, masa o combustión cambian de significado (de Ptolomeo a Copérnico, de Newton a Einstein, del flogisto al oxígeno). Asimilar el descubrimiento exige alterar la red de conceptos, no solo añadir un dato."},{"b":"Consecuencia: inconmensurabilidad parcial entre paradigmas, que no comparten completamente lenguaje ni criterios de evaluación.","x":"De ahí que la elección entre paradigmas no se decida por lógica y evidencia solamente, sino también por valores y persuasión dentro de la comunidad."},{"b":"Ejemplos: revolución copernicana, química de Lavoisier, relatividad; cada una redefine los fenómenos descritos."}]},{"id":"pc1-p42","tipo":"test","enunciado":"El hecho de que un campo de investigación tenga potenciales aplicaciones prácticas:","variantes":[],"apariciones":["2020 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Es evidencia a favor de ciertas hipótesis en ese campo.","b) Puede ser una motivación legítima para trabajar en ese campo de investigación.","c) No debería ser tenido en cuenta a la hora de decidir a qué campos de investigación se han de destinar recursos."],"correcta":1,"explicacion":"La utilidad práctica es una razón legítima para investigar y financiar un campo, pero no constituye evidencia de que sus hipótesis sean verdaderas (a confunde valor práctico con apoyo epistémico) y sí es pertinente al asignar recursos (contra c)."},{"id":"pc1-p43","tipo":"test","enunciado":"¿Cuándo queda refutada o falsada empíricamente una hipótesis?","variantes":[],"apariciones":["2020 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Una hipótesis quedará refutada empíricamente si alguna de sus predicciones resulta ser incompatible con la evidencia empírica disponible.","b) Una hipótesis quedará refutada empíricamente solo si todas sus predicciones resultan ser incompatibles con la evidencia empírica disponible.","c) Una hipótesis quedará refutada empíricamente si la evidencia disponible es compatible tanto con la falsedad como con la verdad de la hipótesis."],"correcta":0,"explicacion":"Basta que una predicción derivada falle para que la hipótesis (junto a sus auxiliares) quede refutada: por modus tollens, si H implica P y no-P, entonces no-H. Exigir que fallen todas (b) es absurdo, y c) describe evidencia neutral, no refutadora."},{"id":"pc1-p44","tipo":"test","enunciado":"¿Cuál es la conclusión de un razonamiento?","variantes":[],"apariciones":["2020 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) La conclusión de un razonamiento es la proposición que constituye el contenido de la creencia a la que se llega en dicho razonamiento.","b) La conclusión de un razonamiento es la creencia que se desea defender dentro de un debate.","c) La conclusión de un razonamiento es una creencia verdadera que esté apoyada por la evidencia."],"correcta":0,"explicacion":"Razonar es transitar de unas creencias (premisas) a otra: la conclusión es la proposición a la que se llega. No se define por su función retórica en un debate (b) ni tiene por qué ser verdadera (c): hay conclusiones falsas."},{"id":"pc1-p45","tipo":"test","enunciado":"¿Son falibles las generalizaciones inductivas?","variantes":[],"apariciones":["2020 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Siempre que una generalización inductiva esté apoyada por un número elevado de observaciones, estará garantizado que tal generalización se cumplirá en todo caso.","b) Las generalizaciones inductivas son infalibles si se basan en observaciones correctas.","c) Incluso si una inferencia inductiva está apoyada por un gran número de observaciones, en principio siempre es posible que aparezcan excepciones inesperadas."],"correcta":2,"explicacion":"Es el núcleo del problema de la inducción: ninguna cantidad de casos favorables garantiza la generalización (el cisne negro, el pavo de Russell). Las opciones a) y b) atribuyen a la inducción una infalibilidad que precisamente no tiene."},{"id":"pc1-p46","tipo":"test","enunciado":"¿Qué es la ciencia normal?","variantes":[],"apariciones":["2020 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) La ciencia que se hace en el marco de un paradigma.","b) La ciencia que no supone ninguna aportación relevante.","c) La ciencia que se hace siguiendo los criterios aceptados de rigurosidad y eficacia."],"correcta":0,"explicacion":"'Ciencia normal' es el término técnico de Kuhn para la investigación que resuelve enigmas dentro de un paradigma aceptado. No implica irrelevancia (b), y c) omite lo definitorio: el marco paradigmático compartido."},{"id":"pc1-p47","tipo":"test","enunciado":"¿Por qué hay discursos no-científicos que intentan pasarse por científicos?","variantes":[],"apariciones":["2020 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Para aprovechar el crédito social de la ciencia.","b) Por desconfianza hacia la ciencia.","c) Por rechazo al estatus privilegiado de la ciencia en nuestras sociedades."],"correcta":0,"explicacion":"La pseudociencia imita la apariencia científica precisamente porque la ciencia goza de prestigio y autoridad social: disfrazarse de ciencia da credibilidad y ventajas comerciales. La desconfianza o el rechazo (b, c) caracterizan a la anticiencia, que se enfrenta a la ciencia en lugar de imitarla."},{"id":"pc1-p48","tipo":"test","enunciado":"El método científico:","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) No se puede aplicar para poner a prueba hipótesis planteadas desde tradiciones no occidentales.","b) Es en principio aplicable a cualquier hipótesis empírica sobre cómo es el mundo.","c) Ofrece simplemente un tipo distinto de evidencia a la proporcionada por la tradición, sin que se pueda decir que una sea mejor o peor que la otra."],"correcta":1,"explicacion":"El método científico es universal en su ámbito: cualquier hipótesis empírica, venga de donde venga, puede someterse a contrastación. No discrimina por origen cultural (a), y la evidencia científica controlada es epistémicamente superior al mero peso de la tradición (contra el relativismo de c)."},{"id":"pc1-p49","tipo":"test","enunciado":"¿Cuáles son las reglas para formular hipótesis?","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) No hay reglas rígidas: en principio puede formularse cualquier hipótesis comprobable empíricamente, aunque es deseable que presente virtudes como simplicidad, generalidad, poder predictivo o capacidad explicativa.","b) Solo es permisible científicamente plantear hipótesis cuya verdad haya quedado probada por la evidencia.","c) Es deseable proponer hipótesis que sean altamente improbables."],"correcta":0,"explicacion":"En el contexto de descubrimiento no hay algoritmo: vale cualquier conjetura contrastable, valorándose virtudes teóricas (simplicidad, alcance, poder predictivo). Exigir verdad probada antes de formular (b) invertiría el proceso, y la improbabilidad por sí misma (c) no es el criterio general de una buena hipótesis."},{"id":"pc1-p50","tipo":"test","enunciado":"¿Son revisables hipótesis actualmente aceptadas por la comunidad científica?","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) En general, una hipótesis aceptada actualmente por la comunidad científica, y compatible con la evidencia ahora disponible, no será rechazada en el futuro.","b) Es frecuente que la aparición de nueva evidencia empírica lleve a rechazar hipótesis científicas que estaban ampliamente aceptadas y que se ajustaban a la evidencia disponible hasta el momento.","c) Una hipótesis compatible con la evidencia disponible será siempre verdadera, y por tanto no podrá aparecer nueva evidencia que la refute."],"correcta":1,"explicacion":"El conocimiento científico es falible y revisable: la historia de la ciencia (flogisto, éter, geocentrismo) muestra teorías bien apoyadas luego rechazadas por nueva evidencia. Las opciones a) y c) confunden compatibilidad con la evidencia actual con verdad definitiva."},{"id":"pc1-p51","tipo":"test","enunciado":"¿Qué es la estadística inferencial?","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) La estadística inferencial busca realizar inferencias (inductivas) cuyas conclusiones sean aplicables a una población en su conjunto, tomando como evidencia datos sobre parte de dicha población (muestra estadística).","b) La estadística inferencial busca ordenar los datos acerca de una población.","c) La estadística inferencial busca aplicar técnicas computacionales a la producción de datos experimentales."],"correcta":0,"explicacion":"La estadística inferencial generaliza de la muestra a la población mediante inferencias inductivas cuantificadas. Ordenar y resumir datos es la estadística descriptiva (b), y c) describe métodos computacionales, no la inferencia estadística."},{"id":"pc1-p52","tipo":"test","enunciado":"Si se observa una correlación clara y significativa entre lactancia materna y buenos resultados académicos:","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Se podrá concluir justificadamente que la lactancia materna contribuye a la mejora de resultados académicos, aunque sea levemente.","b) Esta correlación muestra que hay una relación causal entre lactancia y buenos resultados académicos (si no existiese tal relación causal, la correlación no sería significativa).","c) No se puede concluir directamente que la lactancia contribuya a la mejora de resultados académicos, si no se descartan otros factores que puedan explicar la correlación (por ejemplo, la asociación entre lactancia y nivel socio-económico)."],"correcta":2,"explicacion":"Es el caso clásico de variable de confusión: el nivel socioeconómico puede causar tanto la opción por la lactancia como los buenos resultados (sesgo de autoselección). Sin descartar terceros factores, inferir causalidad (a, b) es una falacia."},{"id":"pc1-p53","tipo":"test","enunciado":"¿En qué ciencias es más frecuente el uso del modelo nomológico-deductivo?","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Física y química.","b) Ciencias biológicas y sociales.","c) En todas ellas."],"correcta":0,"explicacion":"El modelo nomológico-deductivo (Hempel) explica subsumiendo el fenómeno bajo leyes generales, y son la física y la química las que disponen de leyes universales estrictas. Las ciencias biológicas y sociales carecen en gran medida de tales leyes y recurren más a explicaciones funcionales, estadísticas o mecanísmicas."},{"id":"pc1-p54","tipo":"test","enunciado":"¿Un ser vivo puede ser un modelo científico?","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) No.","b) Sí.","c) Solamente los animales de laboratorio."],"correcta":1,"explicacion":"Existen los organismos modelo (ratón, mosca Drosophila, E. coli): seres vivos usados como representación de otros sistemas biológicos, incluido el humano. No se limita a animales de laboratorio (también plantas, bacterias, levaduras), por lo que c) es demasiado restrictiva."},{"id":"pc1-p55","tipo":"test","enunciado":"¿Cómo se denomina a la postura filosófica que defiende Paul Feyerabend?","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Socialismo filosófico.","b) Anarquismo filosófico.","c) Democracia filosófica."],"correcta":1,"explicacion":"Feyerabend defendió en Contra el método el anarquismo epistemológico o filosófico: no hay un método científico universal y el único principio que no frena el progreso es 'todo vale'. Las otras denominaciones no corresponden a su posición."},{"id":"pc1-p56","tipo":"test","enunciado":"¿Puede justificarse el uso de razonamientos inductivos argumentando que en el pasado estos razonamientos han sido normalmente exitosos?","variantes":[],"apariciones":["2022 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Sí, esta es una justificación aceptable, ya que no presupone que el razonamiento inductivo sea razonable.","b) Esta justificación del razonamiento inductivo es problemática porque es circular, ya que se apoya ella misma en un razonamiento inductivo.","c) Esta justificación es problemática porque es falso que en el pasado nuestro uso de razonamientos inductivos haya sido normalmente exitoso."],"correcta":1,"explicacion":"Argumentar 'la inducción funcionó en el pasado, luego funcionará' es en sí una inducción: presupone lo que quiere justificar (circularidad señalada por Hume). El problema no es que la inducción no haya sido exitosa (c), sino la estructura circular de la justificación."},{"id":"pc1-p57","tipo":"test","enunciado":"¿Pueden ser aceptables en ciencia las aproximaciones?","variantes":[],"apariciones":["2022 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) No, porque por definición son falsas e introducen inexactitudes.","b) No, la ciencia busca un lenguaje claro y preciso, libre de vaguedades.","c) Sí, cuando son suficientemente cercanas a la respuesta correcta para los intereses de los investigadores."],"correcta":2,"explicacion":"La ciencia trabaja constantemente con aproximaciones (g = 9,8 m/s², órbitas idealizadas): son aceptables cuando el margen de error es tolerable para los fines de la investigación. Que sean estrictamente inexactas no las invalida (contra a y b)."},{"id":"pc1-p58","tipo":"test","enunciado":"El paso de la astronomía ptolemaica a la copernicana es, según Kuhn, un ejemplo de:","variantes":[],"apariciones":["2022 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Ciencia normal.","b) Progreso científico.","c) Revolución científica."],"correcta":2,"explicacion":"La revolución copernicana es el ejemplo paradigmático de Kuhn de cambio de paradigma: sustitución global del marco geocéntrico por el heliocéntrico. No es ciencia normal (resolución de enigmas dentro del paradigma), y Kuhn evita describir el cambio como simple 'progreso' acumulativo hacia la verdad."},{"id":"pc1-p59","tipo":"test","enunciado":"Una verdad es objetiva si:","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) No hay desacuerdo acerca de tal verdad.","b) Es evidente y no admite discusión.","c) El que sea verdad no depende de nuestras opiniones al respecto."],"correcta":2,"explicacion":"Objetividad significa independencia de las opiniones de los sujetos: la Tierra giraba alrededor del Sol aunque casi todos creyeran lo contrario. El consenso (a) o la evidencia intuitiva (b) no definen la objetividad: puede haber acuerdo sobre falsedades y desacuerdo sobre verdades objetivas."},{"id":"pc1-p60","tipo":"test","enunciado":"¿En qué consiste el sesgo de confirmación?","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) En una tendencia a prestar más atención y dar más peso a la evidencia que favorece tesis que estamos inclinados a aceptar, y a ignorar evidencia en contra.","b) En una tendencia a cuestionar nuestras creencias.","c) Es una tendencia a aceptar la opinión mayoritaria del grupo al que pertenecemos."],"correcta":0,"explicacion":"El sesgo de confirmación nos hace buscar, recordar e interpretar la evidencia de modo favorable a lo que ya creemos. Cuestionar las propias creencias (b) es lo contrario de un sesgo, y c) describe más bien el conformismo o sesgo de grupo."},{"id":"pc1-p61","tipo":"test","enunciado":"¿Cuáles son las premisas de un razonamiento?","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Las premisas de un razonamiento son los prejuicios y sesgos cognitivos del agente que realiza el razonamiento.","b) Las premisas de un razonamiento son las proposiciones que constituyen el contenido de las creencias de las que se parte en tal razonamiento.","c) Las premisas de un razonamiento son las finalidades prácticas que llevan al agente a realizar tal razonamiento."],"correcta":1,"explicacion":"Las premisas son las proposiciones de partida desde las que se infiere la conclusión. No son prejuicios (a) ni motivaciones prácticas (c), que pertenecen a la psicología del agente y no a la estructura lógica del razonamiento."},{"id":"pc1-p62","tipo":"test","enunciado":"¿Qué mide el factor de impacto de una revista?","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) El promedio de ventas de los números de la revista.","b) El promedio de citas de los artículos publicados en la revista.","c) El número de visitas o lectores que recibe la revista."],"correcta":1,"explicacion":"El factor de impacto es la media de citas recibidas por los artículos de la revista en un periodo determinado: mide influencia dentro de la comunidad científica, no ventas ni audiencia general."},{"id":"pc1-p63","tipo":"test","enunciado":"¿Cuál es el papel de la probabilidad en la ciencia?","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Los resultados probabilísticos no son admisibles en ciencia, porque no ofrecen conocimiento seguro.","b) Los resultados probabilísticos son admisibles en ciencia, porque eliminan completamente la incertidumbre y ofrecen conocimiento seguro.","c) Los resultados científicos se presentan frecuentemente de manera probabilística, y son aceptables en la medida en que reflejen el grado de apoyo ofrecido por la evidencia disponible."],"correcta":2,"explicacion":"Gran parte de la ciencia (medicina, mecánica cuántica, ciencias sociales) formula resultados probabilísticos que expresan honestamente la incertidumbre restante. No eliminan la incertidumbre (b) ni son por ello inadmisibles (a): la certeza absoluta no es requisito del conocimiento científico."},{"id":"pc1-p64","tipo":"test","enunciado":"¿Cuál es la relación entre correlación y causalidad?","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) La correlación implica causación: para que dos variables estén correlacionadas estadísticamente, debe existir alguna relación causal entre ellas.","b) Causación implica correlación, pero correlación no implica causación (aunque puede constituir evidencia de la existencia de relaciones causales entre las variables correlacionadas).","c) La existencia de correlaciones estadísticas entre dos variables es incompatible con que haya relaciones causales entre ellas."],"correcta":1,"explicacion":"Si X causa Y, esperamos correlación; pero una correlación puede deberse al azar o a una causa común, así que no implica causalidad, aunque sea un indicio que investigar. La a) comete la falacia clásica y la c) invierte absurdamente la relación."},{"id":"pc1-p65","tipo":"test","enunciado":"¿A qué se debe el sesgo a favor de la publicación de resultados positivos en revistas científicas?","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) A que estos estudios requieren normalmente menos recursos.","b) A que los resultados negativos no ofrecen evidencia fiable.","c) A que estos resultados suelen ser percibidos como más interesantes y tienen un mayor impacto."],"correcta":2,"explicacion":"El sesgo de publicación surge de los incentivos del sistema: los hallazgos positivos y novedosos atraen citas y prestigio, así que revistas y autores los priorizan. Los resultados negativos sí son evidencia fiable y valiosa (contra b); el coste (a) no es la causa."},{"id":"pc1-p66","tipo":"test","enunciado":"La anti-ciencia...","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Defiende que hay muchas formas diferentes de hacer ciencia.","b) Sostiene que la ciencia no tiene ningún impacto en la sociedad.","c) Es un discurso basado en la desconfianza hacia la ciencia."],"correcta":2,"explicacion":"La anticiencia se define por su hostilidad y desconfianza hacia la ciencia y sus instituciones (negacionismos, movimientos antivacunas). No es pluralismo metodológico (a) ni niega el impacto social de la ciencia (b): más bien lo teme o lo rechaza."},{"id":"pc1-p67","tipo":"test","enunciado":"Los estudios de replicación:","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Son más fáciles de publicar, ya que constituyen el tipo de investigación más importante en ciencia.","b) Son en general más difíciles de publicar que los resultados positivos, ya que estos suelen tener mayor impacto.","c) Son en general más fáciles de publicar que los resultados positivos, ya que constituyen la base del método científico falsacionista."],"correcta":1,"explicacion":"Pese a su importancia epistémica, las replicaciones sufren el sesgo de publicación: las revistas prefieren resultados novedosos y positivos, de mayor impacto. Esto contribuye a la crisis de replicación. Las opciones a) y c) invierten la situación real."},{"id":"pc1-p68","tipo":"test","enunciado":"¿Cuántas observaciones son necesarias para confirmar inductivamente, de manera definitiva, una hipótesis general empírica?","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Una única observación exitosa basta para confirmar una generalización empírica.","b) La observación de un solo contraejemplo es suficiente para confirmar de manera definitiva una generalización empírica.","c) Por muy alto que sea el número de observaciones acordes con una generalización empírica, nunca sería suficiente para considerarla confirmada de manera definitiva (ya que siempre existe la posibilidad de encontrar un contraejemplo)."],"correcta":2,"explicacion":"Ninguna cantidad finita de observaciones favorables confirma definitivamente una generalización universal: siempre puede aparecer un contraejemplo (problema de la inducción, asimetría popperiana). La b) es además contradictoria: un contraejemplo refuta, no confirma."},{"id":"pc1-p69","tipo":"test","enunciado":"El razonamiento desde las premisas 'Suiza tiene más población que China' y 'Francia tiene más población que Suiza' a la conclusión 'Francia tiene más población que China' es:","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Un razonamiento deductivo inválido, aunque sus premisas son verdaderas.","b) Un razonamiento deductivo inválido, puesto que algunas de sus premisas son falsas.","c) Un razonamiento deductivo válido, aunque algunas de sus premisas son falsas."],"correcta":2,"explicacion":"La validez depende de la forma, no de la verdad de las premisas: por transitividad de 'tener más población que', si las premisas fueran verdaderas la conclusión lo sería necesariamente. El argumento es válido pero no sólido, porque sus premisas son falsas."},{"id":"pc1-p70","tipo":"test","enunciado":"¿Qué es un hecho?","variantes":[],"apariciones":["2024 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Es un hecho que p si y solo si es verdad que p.","b) Un hecho es una creencia aceptada por la comunidad científica.","c) Un hecho es una creencia que el sujeto considera verdadera."],"correcta":0,"explicacion":"Los hechos son aquello que hace verdaderas a las proposiciones: que p sea un hecho equivale a que p sea verdad, con independencia de lo que crea nadie. Definir el hecho como creencia (b, c) lo relativizaría a los sujetos y borraría su objetividad."},{"id":"pc1-p71","tipo":"test","enunciado":"De acuerdo con el empirismo:","variantes":[],"apariciones":["2024 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) La principal fuente de evidencia científica son la razón y la reflexión.","b) La principal fuente de evidencia científica es la intuición.","c) La principal fuente de evidencia científica es la experiencia observacional."],"correcta":2,"explicacion":"El empirismo (Locke, Hume) sitúa la experiencia sensible/observacional como fuente principal del conocimiento sobre el mundo. La primacía de la razón (a) es el racionalismo, y la intuición (b) no es la base del conocimiento empírico científico."},{"id":"pc1-p72","tipo":"test","enunciado":"Si en un experimento en botánica se observa que ciertas plantas crecen más cuando se les añade fertilizante:","variantes":[],"apariciones":["2024 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Puede concluirse directamente que el fertilizante es la causa del mayor crecimiento de las plantas.","b) Para averiguar si la causa del mayor crecimiento es el fertilizante, hay que hacer una comparación con el crecimiento de plantas idénticas a las que no se ha suministrado fertilizante, manteniendo constante la iluminación, el tipo de suelo, la temperatura y el riego.","c) Nunca podrá concluirse con suficiente seguridad que el mayor crecimiento se debe al fertilizante."],"correcta":1,"explicacion":"Es la lógica del experimento controlado: comparar grupo tratado y grupo de control manteniendo constantes las demás variables permite aislar el efecto causal. Concluir directamente sin control (a) ignora factores de confusión, y el escepticismo absoluto (c) es injustificado."},{"id":"pc1-p73","tipo":"test","enunciado":"¿Qué es un razonamiento?","variantes":[],"apariciones":["2024 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Un razonamiento es una transición entre creencias (u otros estados mentales), cuya finalidad es adoptar creencias correctas o justificadas.","b) Un razonamiento es un intercambio verbal dentro de un debate.","c) Un razonamiento es una estrategia retórica para persuadir a una audiencia de una conclusión, independientemente de que esté realmente justificada."],"correcta":0,"explicacion":"Razonar es un proceso epistémico: pasar de unas creencias (premisas) a otras (conclusiones) buscando justificación. No requiere debate ni audiencia (b) y se distingue de la mera retórica persuasiva (c) por su orientación a la corrección."},{"id":"pc1-p74","tipo":"test","enunciado":"Los modelos científicos tienen valor explicativo...","variantes":[],"apariciones":["2024 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Cuando están bien planteados.","b) Cuando son modelos matemáticos, físicos o conceptuales.","c) Cuando no es posible abordar los fenómenos de ninguna otra manera."],"correcta":0,"explicacion":"Lo que da valor explicativo a un modelo es su buena construcción: captar los factores relevantes del fenómeno pese a idealizar. El tipo de modelo (b) es una mera clasificación que no garantiza nada, y c) impone una condición de exclusividad innecesaria."},{"id":"pc1-p75","tipo":"test","enunciado":"¿Cuál es la relación entre el verificacionismo y el problema de la inducción?","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) El verificacionismo logra solventar el problema de la inducción.","b) El verificacionismo es susceptible al problema de la inducción.","c) El verificacionismo, al rechazar el inductivismo, no tiene ninguna relación con el problema de la inducción."],"correcta":1,"explicacion":"Verificar hipótesis generales a partir de observaciones particulares es un procedimiento inductivo, y hereda por tanto el problema de Hume: ninguna acumulación de casos verifica concluyentemente una ley universal. Esta debilidad fue una de las razones de la propuesta falsacionista de Popper."},{"id":"pc1-p76","tipo":"test","enunciado":"Según el constructivismo social:","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Todo el conocimiento científico es fraudulento.","b) La ciencia no tiene una posición privilegiada frente a otros fenómenos como la magia o la mitología.","c) No es posible de ninguna manera explicar el funcionamiento de la ciencia."],"correcta":1,"explicacion":"El constructivismo social (programa fuerte, Bloor; Knorr Cetina; Latour) analiza la ciencia como un producto social más, con el principio de simetría: se explica igual que otras creencias (magia, mito), sin concederle privilegio epistémico a priori. No afirma que la ciencia sea fraude (a) ni renuncia a explicarla (c): precisamente la estudia sociológicamente."},{"id":"pc1-p77","tipo":"test","enunciado":"¿Cuál es la relación entre probabilidad e incertidumbre?","variantes":[],"apariciones":["2024 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Solo puede tomarse como probable un evento si se sabe con certeza que sucederá.","b) La probabilidad asignada a un evento refleja la incertidumbre acerca de si dicho evento ocurrirá.","c) La probabilidad asignada a un evento es 0 cuando existe incertidumbre acerca de si dicho evento ocurrirá."],"correcta":1,"explicacion":"La probabilidad es justamente la medida graduada de la incertidumbre: valores entre 0 y 1 expresan cuán probable consideramos el evento dada la evidencia. La a) es contradictoria (certeza y probabilidad intermedia) y la c) confunde incertidumbre con imposibilidad."},{"id":"pc1-p78","tipo":"test","enunciado":"¿En qué consiste el problema de la demarcación?","variantes":[],"apariciones":["2024 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Determinar cuáles son los límites éticos de la actividad científica.","b) Comprender adecuadamente las implicaciones filosóficas de la ciencia.","c) La búsqueda de criterios para distinguir lo científico de lo no científico."],"correcta":2,"explicacion":"Así lo bautizó Popper: encontrar un criterio que separe la ciencia empírica de la no-ciencia, la pseudociencia o la metafísica. No es una cuestión de ética de la investigación (a) ni un problema genérico de interpretación filosófica (b)."},{"id":"pc1-p79","tipo":"test","enunciado":"¿Qué es un argumento?","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Un argumento es una proposición que se usa como premisa en un razonamiento.","b) Un argumento es una secuencia de proposiciones, constituida por un conjunto de premisas de las que se siguen ciertas conclusiones.","c) Un argumento es una proposición verdadera."],"correcta":1,"explicacion":"Un argumento es una estructura completa premisas-conclusión, no una proposición suelta (a) ni una proposición verdadera (c): hay argumentos con premisas y conclusiones falsas."},{"id":"pc1-p80","tipo":"test","enunciado":"Según el giro social de la filosofía de la ciencia...","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) El criterio de demarcación será algo que dependa de los valores y de los aspectos contextuales que determinan el paradigma científico dominante.","b) No existe realmente ningún enunciado ni ninguna teoría que pueda ser considerada como científica, pues todo está determinado socialmente.","c) Decidir si algo es científico o no es una cuestión personal, pues dependerá de los criterios individuales e inconmensurables de cada uno de los científicos particulares."],"correcta":0,"explicacion":"Tras Kuhn, el giro social entiende que qué cuenta como científico depende del paradigma dominante y de valores y factores contextuales de la comunidad. No niega la existencia de ciencia (b) ni reduce la demarcación a una decisión individual (c): es una cuestión comunitaria."},{"id":"pc1-p81","tipo":"test","enunciado":"¿Cuándo los discursos no-científicos se enfrentan al discurso científico?","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Cuando los asumen los científicos.","b) Cuando son aceptados por un gran número de personas.","c) Cuando son pseudocientíficos o anticientíficos."],"correcta":2,"explicacion":"La no-ciencia (arte, religión no literalista) puede convivir con la ciencia sin conflicto; el enfrentamiento surge cuando compite con ella haciéndose pasar por ciencia (pseudociencia) o atacándola (anticiencia). La popularidad (b) o quién los asuma (a) no determinan el conflicto."},{"id":"pc1-p82","tipo":"test","enunciado":"Una hipótesis para la que no tenemos evidencia:","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) No puede plantearse como hipótesis científica, ya que carece de apoyo evidencial.","b) Es una hipótesis que ha quedado refutada empíricamente.","c) Puede ser una hipótesis verdadera."],"correcta":2,"explicacion":"Verdad y apoyo evidencial son independientes: una conjetura sin evidencia todavía puede ser verdadera (y contrastarse después). Carecer de evidencia no impide proponerla como hipótesis (a) ni equivale a haber sido refutada (b), que exige evidencia en contra."},{"id":"pc1-p83","tipo":"test","enunciado":"¿Cuándo queda refutada una hipótesis general universal?","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Una hipótesis general universal queda refutada por la observación de un solo contraejemplo.","b) Una hipótesis general universal queda refutada solo si no se cumple en ningún caso observado.","c) Para que una hipótesis general universal quede refutada, ha de cumplirse en todo caso observado."],"correcta":0,"explicacion":"'Todos los A son B' es incompatible con un solo A que no sea B: un contraejemplo basta lógicamente para refutarla (asimetría entre verificación y falsación). La b) exige demasiado y la c) describe la confirmación, no la refutación."},{"id":"pc1-p84","tipo":"test","enunciado":"¿Qué quiere decir que una hipótesis sea falsable o refutable empíricamente?","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Para que una hipótesis sea falsable empíricamente debe haber evidencia empírica disponible que muestre su falsedad.","b) Para que una hipótesis sea falsable empíricamente debe estar apoyada por la evidencia empírica disponible.","c) Para que una hipótesis sea falsable empíricamente debe existir la posibilidad de que surja evidencia empírica que la refute."],"correcta":2,"explicacion":"Falsabilidad es una propiedad modal: basta que sea posible una observación que refutara la hipótesis. No exige que ya exista evidencia en contra (a, eso sería estar falsada) ni tiene que ver con estar apoyada (b)."},{"id":"pc1-p85","tipo":"test","enunciado":"El conocimiento que se transmite dentro de un paradigma:","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Es siempre explícito.","b) Es frecuentemente tácito.","c) Es necesariamente verdadero."],"correcta":1,"explicacion":"Kuhn (siguiendo a Polanyi) subraya que buena parte del saber paradigmático se transmite tácitamente: mediante ejemplares, práctica y entrenamiento, no solo reglas explícitas. Y desde luego no es necesariamente verdadero: los paradigmas se abandonan."},{"id":"pc1-p86","tipo":"test","enunciado":"La cuantificación de la observación:","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Permite comparar con precisión observaciones realizadas por distintos observadores.","b) Elimina la posibilidad de error en la observación.","c) Imposibilita la reproducción de las observaciones científicas."],"correcta":0,"explicacion":"Expresar las observaciones en números (mediciones) las hace comparables y comunicables con precisión entre investigadores, favoreciendo la reproducibilidad (contra c). Pero no elimina el error (b): toda medición tiene margen de error."},{"id":"pc1-p87","tipo":"test","enunciado":"Los estudios de replicación y los resultados negativos:","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Tienen una función principalmente pedagógica, puesto que no aportan evidencia novedosa.","b) Son el tipo de estudio más frecuente en las publicaciones científicas, ya que requieren menos recursos que la obtención de resultados positivos.","c) Son esenciales para comprobar la fiabilidad de los resultados científicos."],"correcta":2,"explicacion":"Replicaciones y resultados negativos son el control de calidad de la ciencia: detectan falsos positivos, fraudes y sesgos. No son meramente pedagógicos (a) y, de hecho, están infrarrepresentados en las revistas por el sesgo de publicación (contra b)."},{"id":"pc1-p88","tipo":"test","enunciado":"¿Qué es una aproximación?","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Una hipótesis provisional que todavía no ha sido sometida a comprobación empírica.","b) Un resultado inexacto o incorrecto, pero suficientemente cercano a la respuesta correcta.","c) Un resultado impreciso expresado probabilísticamente, de forma que se refleje adecuadamente la incertidumbre del investigador."],"correcta":1,"explicacion":"Una aproximación es un valor o modelo estrictamente inexacto pero lo bastante cercano al correcto para los fines en juego (p. ej., g = 9,8). No es una hipótesis sin contrastar (a) ni se define por su expresión probabilística (c): imprecisión y aproximación son nociones distintas."},{"id":"pc1-p89","tipo":"test","enunciado":"¿Por qué es deseable tomar en consideración el conocimiento científico a la hora de tomar decisiones prácticas?","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) El conocimiento científico basado en evidencia ayuda a tomar decisiones informadas, ya que nos permite averiguar con rigor cuáles serán las consecuencias de nuestras decisiones y qué opciones ofrecen mayor probabilidad de alcanzar nuestros objetivos.","b) El conocimiento científico es irrelevante a la hora de tomar decisiones prácticas, porque no tiene en cuenta nuestros intereses y valores como agentes.","c) El conocimiento científico solo será útil a la hora de tomar decisiones para aquellos agentes que compartan los valores e intereses de la comunidad científica."],"correcta":0,"explicacion":"La ciencia informa sobre las consecuencias probables de nuestras opciones, sean cuales sean nuestros valores: por eso es útil a cualquier agente. Las opciones b) y c) confunden el papel instrumental del conocimiento (medios) con la elección de fines, que sí corresponde a los valores del agente."},{"id":"pc1-p90","tipo":"test","enunciado":"¿Qué es la revisión por pares?","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) La exigencia de que un artículo científico esté firmado por al menos dos autores.","b) El proceso editorial mediante el cual los artículos científicos enviados a una revista son revisados por otros investigadores antes de ser publicados.","c) El compromiso adquirido por los autores de un artículo científico de no publicar evidencia manipulada o ideas plagiadas a otros investigadores."],"correcta":1,"explicacion":"La revisión por pares (peer review) es el filtro editorial en que expertos independientes evalúan calidad, rigor y originalidad del manuscrito antes de su publicación. No tiene que ver con el número de autores (a) ni es un mero compromiso ético (c)."},{"id":"pc1-p91","tipo":"test","enunciado":"¿Qué es un experimento controlado?","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Un experimento cuyo resultado puede predecirse con suficiente certeza.","b) Un experimento realizado en el laboratorio con suficientes condiciones de seguridad, eliminando de este modo posibles riesgos para los experimentadores.","c) Un experimento en el que se examinan los efectos de manipular una variable del sistema estudiado, evitando posibles interferencias debidas a alteraciones en otras variables del sistema."],"correcta":2,"explicacion":"'Controlado' se refiere al control de variables: se manipula la variable de interés manteniendo constantes (o aleatorizando) las demás, para aislar su efecto causal. No alude a la predictibilidad del resultado (a) ni a la seguridad física (b)."},{"id":"pc1-p92","tipo":"test","enunciado":"Las generalizaciones inductivas:","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Presuponen que existe suficiente uniformidad entre casos observados y casos semejantes no observados, de modo que los casos no observados se comportarán como los ya observados.","b) Presuponen que no quedan casos particulares sin observar.","c) Presuponen que la verdad de la conclusión inductiva está garantizada necesariamente por la verdad de las premisas."],"correcta":0,"explicacion":"La inducción descansa en el principio de uniformidad de la naturaleza: lo no observado se comportará como lo observado (supuesto que Hume mostró injustificable sin circularidad). No presupone haber observado todo (b) ni garantía deductiva (c): eso negaría su carácter inductivo."},{"id":"pc1-p93","tipo":"test","enunciado":"¿Cuál es el papel de los expertos en ciencia?","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) En la ciencia no hay lugar para la idea de experto y autoridad, ya que toda opinión cuenta por igual.","b) Los expertos científicos son investigadores cuyas opiniones acerca de ciertas cuestiones científicas son generalmente fiables.","c) Las opiniones de los expertos científicos no pueden ser cuestionadas racionalmente, ya que constituyen el conocimiento aceptado dentro de un paradigma."],"correcta":1,"explicacion":"La pericia confiere fiabilidad general, no infalibilidad: es razonable confiar en los expertos dentro de su ámbito, pero sus opiniones siguen siendo cuestionables racionalmente (contra c). Y en ciencia no todas las opiniones pesan igual (contra a): cuenta la competencia y la evidencia."},{"id":"pc1-p94","tipo":"test","enunciado":"La observación científica:","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Tiene un carácter esencialmente privado e incomunicable.","b) Solo es una fuente de evidencia aceptable científicamente si es accesible a distintos científicos.","c) Nunca es reproducible, ya que se realiza en condiciones especiales no repetibles."],"correcta":1,"explicacion":"La evidencia científica ha de ser pública e intersubjetiva: accesible y comprobable por distintos investigadores (como logró Galileo con el telescopio). Las opciones a) y c) niegan la publicidad y reproducibilidad que definen la observación científica."},{"id":"pc1-p95","tipo":"test","enunciado":"¿Cuando proponemos una hipótesis, hemos de creer que es verdadera?","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Proponer p como una hipótesis implica considerar que p es una posibilidad abierta (las hipótesis son conjeturas).","b) Proponer p como una hipótesis implica creer que p es verdad.","c) Proponer p como una hipótesis implica creer que p es falsa."],"correcta":0,"explicacion":"Una hipótesis es una conjetura que se plantea para someterla a prueba: basta considerarla posible. No exige creerla verdadera (b) ni falsa (c); esa neutralidad es lo que permite contrastarla honestamente."},{"id":"pc1-p96","tipo":"test","enunciado":"¿Qué es la muestra estadística?","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Las conclusiones finales alcanzadas mediante análisis estadísticos.","b) El conjunto de casos de una población sobre los que se tiene datos, y a partir del cual se realizan inferencias estadísticas acerca de la población en su totalidad.","c) Un caso empleado como ejemplo en un razonamiento estadístico."],"correcta":1,"explicacion":"La muestra es el subconjunto observado de la población desde el que la estadística inferencial generaliza. No son las conclusiones (a) ni un ejemplo aislado (c); su representatividad es clave para evitar sesgos."},{"id":"pc1-p97","tipo":"test","enunciado":"¿Cuándo se dice que hay una correlación estadística entre dos variables (por ejemplo, altura y peso)?","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Cuando, analizando estadísticamente un conjunto de datos, se observa una relación entre los valores de las dos variables (por ejemplo, los valores de una de las variables aumentan cuando lo hacen los de la otra).","b) Cuando, analizando estadísticamente un conjunto de datos, no se observa ninguna relación entre los valores de las dos variables (los valores de una variable son independientes de los valores de la otra).","c) Cuando, analizando estadísticamente un conjunto de datos, se observa que ambas variables adoptan siempre el mismo valor constante."],"correcta":0,"explicacion":"Hay correlación cuando los valores de las variables covarían sistemáticamente (positiva o negativamente). La b) describe independencia (ausencia de correlación) y la c) valores constantes, que no definen correlación."},{"id":"pc1-p98","tipo":"desarrollo","enunciado":"Texto de Galileo (Carta a Cristina de Lorena) sobre la interpretación de las Escrituras y las 'conclusiones naturales'. Pregunta 1: ¿Cuál es el papel de la evidencia y la experiencia en la investigación científica sobre el mundo empírico (lo que Galileo llama cuestiones naturales)? Pregunta 2: Explica brevemente cómo entiende Galileo la relación entre ciencia y autoridad religiosa.","variantes":[],"apariciones":["2020 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"En cuestiones naturales, la autoridad última es la evidencia: 'la experiencia de los sentidos y las demostraciones necesarias'.","x":"Para Galileo, sobre el mundo empírico deciden la observación y la demostración, no los textos ni la tradición. Es un manifiesto temprano del empirismo científico moderno."},{"b":"La evidencia empírica es pública y contrastable; la interpretación de textos es discutible y variable.","x":"Galileo subraya que las Escrituras admiten interpretaciones divergentes y que no todos los intérpretes hablan por inspiración; la evidencia empírica, en cambio, obliga a cualquier observador."},{"b":"'Dos verdades no pueden contradecirse': si la ciencia demuestra algo, hay que reinterpretar la Escritura, no negar la ciencia.","x":"Galileo no rechaza la religión: sostiene que su fin es distinto ('cómo se va al cielo, no cómo va el cielo'), y que ante conflicto aparente, el pasaje bíblico debe leerse de modo compatible con lo demostrado."},{"b":"La autoridad religiosa no debe comprometer los textos sagrados fijando conclusiones empíricas refutables.","x":"Sería imprudente ligar la fe a afirmaciones sobre la naturaleza que la evidencia futura puede desmentir: eso dañaría a la propia religión."},{"b":"Anticipa la separación de dominios ciencia/religión, emparentada con el NOMA de Gould y con la autonomía de la ciencia."}]},{"id":"pc1-p99","tipo":"desarrollo","enunciado":"Texto de Stephen Jay Gould (Ciencia versus religión) sobre el principio de los 'magisterios que no se superponen' (NOMA). Pregunta 1: ¿Por qué considera Gould que ciencia
