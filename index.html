nes":["Un regreso al infinito en la relación entre cosas e Idea","La imposibilidad de que el no-ser sea pensado o dicho","La necesidad de un tercer género entre el ser y el no-ser"],"correcta":0,"explicacion":"Si las cosas grandes y la Idea de lo Grande se parecen, exigen una tercera Idea común, y así al infinito: aporía que motiva la revisión, no el abandono, de la teoría."},{"id":"fa1-t050","tema":"Tema III: Platón","fuente":"card:fa1-c50","enunciado":"¿En qué consiste el 'parricidio de Parménides' del Sofista?","opciones":["Abandonar la teoría de las Ideas por sus aporías","Admitir que el no-ser 'es' en cierto modo: como diferencia","Demostrar que el ser es múltiple porque hay átomos y vacío"],"correcta":1,"explicacion":"El no-ser como 'lo otro' explica la falsedad del discurso y la comunicación de los géneros supremos. Platón revisa su teoría, pero nunca la abandona; los átomos son de Demócrito."},{"id":"fa1-t051","tema":"Tema III: Platón","fuente":"card:fa1-c51","enunciado":"¿Qué enseña Diotima a Sócrates en el Banquete?","opciones":["La liberación del prisionero desde las sombras hasta el sol","La reminiscencia de las Ideas mediante el interrogatorio","El ascenso erótico de un cuerpo bello hasta lo Bello en sí"],"correcta":2,"explicacion":"La escala del amor sube de un cuerpo a todos, a las almas, leyes y ciencias, hasta lo Bello en sí; Eros, hijo de Poros y Penía, es filósofo. La caverna y el esclavo del Menón son otros caminos."},{"id":"fa1-t052","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c52","enunciado":"¿Quién editó el Corpus aristotélico y acuñó el título 'Metafísica'?","opciones":["Andrónico de Rodas, en el siglo I a.C.","Teofrasto, sucesor de Aristóteles en el Liceo","Porfirio, discípulo y editor de Plotino"],"correcta":0,"explicacion":"Se conservaron las obras acroamáticas (apuntes de escuela), no los diálogos exotéricos. Andrónico las ordenó y colocó ciertos libros 'después de los físicos': metá tà physiká."},{"id":"fa1-t053","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c53","enunciado":"Según Aristóteles, ¿cómo se dice el ser?","opciones":["De una sola manera: el ser es unívoco, uno e inmóvil","De muchas maneras, pero en referencia a la ousía (pròs hén)","De maneras irreductibles, sin ninguna unidad de referencia"],"correcta":1,"explicacion":"Vía media entre la univocidad parmenídea y la pura equivocidad: como 'sano' se dice de muchas cosas por referencia a la salud, todas las categorías remiten a la sustancia."},{"id":"fa1-t054","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c54","enunciado":"¿Qué es la 'ousía' aristotélica?","opciones":["La materia indeterminada común a todos los cambios","El género supremo que engloba a todas las categorías","La sustancia: sentido primero del ser y sujeto último de predicación"],"correcta":2,"explicacion":"En las Categorías, la sustancia primera es el individuo concreto; en Metafísica VII, el eîdos-esencia. El ser no es un género, y la materia indeterminada no es sustancia."},{"id":"fa1-t055","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c55","enunciado":"¿Qué afirma el hilemorfismo aristotélico?","opciones":["Todo ser natural es compuesto de materia (hýle) y forma (eîdos)","La forma existe separada como modelo del compuesto sensible","Todo se compone de átomos indivisibles que se mueven en el vacío"],"correcta":0,"explicacion":"La forma es acto y esencia; la materia, potencia y sustrato del cambio. La forma separada es la Idea platónica que Aristóteles critica; los átomos, tesis de Demócrito."},{"id":"fa1-t056","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c56","enunciado":"¿Qué es la 'dýnamis' (potencia) en Aristóteles?","opciones":["La realización plena y actual de un ser","La capacidad de ser o de llegar a ser algo","La privación de forma que acompaña al cambio"],"correcta":1,"explicacion":"La potencia es capacidad; el acto (enérgeia/entelécheia), su realización, y es anterior a ella. La privación (stéresis) es el tercer principio del devenir, junto a sustrato y forma."},{"id":"fa1-t057","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c57","enunciado":"¿Cuáles son las cuatro causas aristotélicas?","opciones":["Sustrato, forma, privación y azar","Acto, potencia, materia y esencia","Material, formal, eficiente y final"],"correcta":2,"explicacion":"Conocer científicamente es conocer por causas: de qué, qué es, de dónde el movimiento y para qué. Sustrato, forma y privación son los tres principios del devenir, no las causas."},{"id":"fa1-t058","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c58","enunciado":"¿Cómo define Aristóteles el movimiento (Física III)?","opciones":["Acto de lo que está en potencia en cuanto está en potencia","Paso del no-ser absoluto al ser","Ilusión de los sentidos refutada por la razón"],"correcta":0,"explicacion":"El movimiento es un acto imperfecto: la actualización de la potencia mientras dura el proceso. El paso del no-ser al ser es imposible según Parménides; la ilusión es la tesis eleática."},{"id":"fa1-t059","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c59","enunciado":"¿Cómo define Aristóteles el tiempo (Física IV)?","opciones":["Imagen móvil de la eternidad, creada junto con el cielo","Número del movimiento según lo anterior y lo posterior","Sucesión de instantes indivisibles y discontinuos"],"correcta":1,"explicacion":"El tiempo no es el movimiento, sino su aspecto numerable por el alma. La 'imagen móvil de la eternidad' es la definición platónica del Timeo; Aristóteles defiende el continuo, no instantes atómicos."},{"id":"fa1-t060","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c60","enunciado":"¿Cómo mueve el Primer Motor inmóvil aristotélico?","opciones":["Como causa eficiente que empuja la primera esfera","Ordenando la materia informe según los modelos ideales","Sin moverse, como causa final: 'como lo amado'"],"correcta":2,"explicacion":"Acto puro sin materia ni potencia, mueve como fin del deseo del cielo; su vida es pensamiento que se piensa (nóesis noéseos). No empuja ni fabrica: eso sería eficiencia o Demiurgo."},{"id":"fa1-t061","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c61","enunciado":"¿Qué es el alma para Aristóteles (De Anima)?","opciones":["Entelécheia primera de un cuerpo natural con vida en potencia","Sustancia inmortal encarcelada temporalmente en el cuerpo","Conjunto de átomos sutiles repartidos por todo el cuerpo"],"correcta":0,"explicacion":"El alma es forma y acto del cuerpo, no sustancia separada: alma y cuerpo son uno como la cera y su figura. La cárcel del alma es doctrina órfico-platónica; los átomos, de Demócrito."},{"id":"fa1-t062","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c62","enunciado":"¿Qué funciones corresponden al alma sensitiva según Aristóteles?","opciones":["Nutrición, crecimiento y reproducción","Sensación, deseo y movimiento local","Pensamiento discursivo y contemplación"],"correcta":1,"explicacion":"Es el alma propia de los animales; cada nivel superior integra las funciones del inferior. Nutrición y reproducción son de la vegetativa; el pensar, de la intelectiva."},{"id":"fa1-t063","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c63","enunciado":"¿Cómo describe Aristóteles el intelecto agente (De Anima III, 5)?","opciones":["Pasivo: recibe las formas inteligibles y perece con el cuerpo","Idéntico al Noûs cósmico que inicia el remolino de la mezcla","Separado, impasible, inmortal y eterno: actualiza como la luz"],"correcta":2,"explicacion":"El agente actualiza los inteligibles como la luz los colores: pasaje de máxima disputa entre comentaristas griegos, árabes y latinos. Recibir las formas es propio del intelecto paciente."},{"id":"fa1-t064","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c64","enunciado":"¿Por qué es el hombre 'animal político' (zôon politikón) según Aristóteles?","opciones":["Posee lógos para deliberar sobre lo justo y lo conveniente","Firmó un pacto que lo obliga a vivir en sociedad","Es el único animal gregario que existe en la naturaleza"],"correcta":0,"explicacion":"El lógos, que distingue lo justo de lo injusto, hace al hombre comunitario por naturaleza, más que cualquier animal gregario. La política no es contrato ni artificio."},{"id":"fa1-t065","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c65","enunciado":"Para Aristóteles, ¿qué distingue las constituciones rectas de las desviadas?","opciones":["El número de gobernantes: uno, pocos o muchos","Si gobiernan para el bien común o para el interés propio","Si el poder se transmite por herencia o por elección"],"correcta":1,"explicacion":"El criterio es el fin: monarquía, aristocracia y politeia buscan el bien común; tiranía, oligarquía y democracia, el interés particular. El número de gobernantes solo cruza la clasificación."},{"id":"fa1-t066","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c66","enunciado":"¿Cuáles son los tres sentidos de la verdad en Aristóteles?","opciones":["Sensible, matemática y dialéctica, según sus objetos","Material, formal y final, según sus causas","En las cosas, en el juicio y en el contacto con los indivisibles"],"correcta":2,"explicacion":"Verdad del ser, adecuación en la síntesis predicativa y captación intuitiva del noûs, que no admite falsedad. Los grados por objetos evocan la línea platónica; las causas son otra doctrina."},{"id":"fa1-t067","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c67","enunciado":"¿Cómo se defiende el principio de no contradicción (Metafísica IV)?","opciones":["Elencticamente: basta que el adversario diga algo con significado","Deduciéndolo de axiomas anteriores más evidentes","Por inducción a partir de los casos observados"],"correcta":0,"explicacion":"Es el principio más firme e indemostrable: no puede deducirse de nada anterior. Quien lo niega en serio queda reducido al silencio de la planta."},{"id":"fa1-t068","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c68","enunciado":"¿Qué caracteriza al mundo supralunar aristotélico?","opciones":["Cuatro elementos sometidos a generación y corrupción","Éter incorruptible y movimiento circular eterno","Átomos y vacío formando infinitos mundos"],"correcta":1,"explicacion":"El cosmos es finito, único, eterno y geocéntrico: el quinto elemento solo se mueve en círculo. Los cuatro elementos y la corrupción son propios del mundo sublunar; los infinitos mundos, de Demócrito."},{"id":"fa1-t069","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c69","enunciado":"¿Qué estudia la 'filosofía segunda' según Aristóteles?","opciones":["El ser en cuanto ser y la sustancia inmóvil","Las producciones del arte y del discurso","El ser en movimiento: es la física"],"correcta":2,"explicacion":"La física estudia el ente móvil en cuanto tal; la filosofía primera (metafísica), el ser en cuanto ser y la sustancia suprasensible. Poética y retórica se ocupan de las producciones."},{"id":"fa1-t070","tema":"Tema IV: Aristóteles","fuente":"card:fa1-c70","enunciado":"¿Qué reprocha Aristóteles a las Ideas platónicas?","opciones":["Separadas, duplican el mundo sin explicar movimiento ni conocimiento","Ser meros conceptos mentales sin realidad alguna","Confundir el acto con la potencia en el devenir"],"correcta":0,"explicacion":"La crítica incluye el argumento del tercer hombre: el universal no es sustancia y la forma es inmanente. Aristóteles no niega la realidad de las esencias, solo su separación."},{"id":"fa1-t071","tema":"Todos los bloques (a elección del estudiante)","fuente":"pregunta:fa1-p01","enunciado":"En el examen, la pregunta autoformulada de la parte 2...","opciones":["Debe pertenecer al mismo bloque para dar coherencia al examen","No puede pertenecer al mismo bloque que la elegida en la parte 1","Puede repetir bloque si se justifica ante el equipo docente"],"correcta":1,"explicacion":"La regla es tajante: bloques distintos. Por eso conviene llevar preparadas dos autoformuladas de bloques diferentes y decidir según las opciones de la parte 1."},{"id":"fa1-t072","tema":"Todos los bloques (a elección del estudiante)","fuente":"pregunta:fa1-p01","enunciado":"¿Qué título recomienda el equipo docente para la pregunta autoformulada?","opciones":["Uno general que abarque un bloque completo del temario","Uno que reproduzca literalmente un epígrafe del manual","Uno preciso que plantee un problema filosófico y una tesis"],"correcta":2,"explicacion":"Se valora abordar la historia de la filosofía filosóficamente, no filológicamente: el título debe anunciar un problema, sus interlocutores y una tesis (p. ej., 'El ser en Parménides y su herencia')."},{"id":"fa1-t073","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"¿Qué es la justicia (dikaiosýne) en la República de Platón?","opciones":["La armonía: cada parte del alma y de la ciudad hace lo suyo","Lo que conviene al más fuerte, que dicta las leyes","Un pacto para no cometer ni padecer injusticia"],"correcta":0,"explicacion":"Contra Trasímaco y el convencionalismo, la justicia es el orden interno que hace feliz al justo, tanto en el alma como en la ciudad."},{"id":"fa1-t074","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"¿Qué correspondencia establece Platón entre el alma y la ciudad?","opciones":["El alma imita a la ciudad, que es anterior por naturaleza","Tres partes del alma, tres clases: gobernantes, guardianes, productores","Cada régimen político educa un alma idéntica en todos"],"correcta":1,"explicacion":"La ciudad es el alma 'en grandes letras': a lo racional corresponden los filósofos-gobernantes; a lo irascible, los guardianes; a lo concupiscible, los productores."},{"id":"fa1-t075","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"¿Qué muestran los tres viajes de Platón a Siracusa (Carta VII)?","opciones":["Su renuncia a la política tras la condena de Sócrates","Su propósito de restaurar allí la comunidad pitagórica","Su empeño práctico por realizar el gobierno del filósofo"],"correcta":2,"explicacion":"Los intentos fracasados con Dionisio muestran que la tesis del filósofo-rey no era mera teoría: Platón intentó llevarla a la práctica."},{"id":"fa1-t076","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"¿Qué propone Platón en las Leyes como 'segundo mejor' Estado?","opciones":["El gobierno de la ley, no el de los hombres","El gobierno del filósofo que conoce la Idea del Bien","La politeia mixta sustentada en la clase media"],"correcta":0,"explicacion":"En su evolución final, Platón sustituye al filósofo-rey de la República por la soberanía de la ley. La politeia de la clase media es la propuesta de Aristóteles."},{"id":"fa1-t077","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p03","enunciado":"¿Cómo concibe Jenófanes la divinidad?","opciones":["Muchos dioses con figura y pasiones humanas","Un dios supremo no antropomórfico que todo lo mueve con su mente","Ninguna: la religión es invención de legisladores astutos"],"correcta":1,"explicacion":"Jenófanes purifica lo divino, no lo niega: Jaeger lo lee como teología racional. Los dioses antropomórficos son justo lo que critica en Homero y Hesíodo."},{"id":"fa1-t078","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p03","enunciado":"¿Qué estructura tiene el poema 'Sobre la naturaleza' de Parménides?","opciones":["Tres tesis: nada es, sería incognoscible, incomunicable","Aforismos oscuros sobre el fuego y los contrarios","Proemio y dos vías: la verdad (alétheia) y la opinión (dóxa)"],"correcta":2,"explicacion":"El proemio (viaje del koûros hacia la luz) conserva forma iniciática, pero el contenido es argumentación deductiva: el primer gran texto de la ontología. Las tres tesis son la réplica de Gorgias."},{"id":"fa1-t079","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p03","enunciado":"¿Cómo respondieron los físicos posteriores al reto de Parménides?","opciones":["Multiplicando principios eternos que se mezclan y separan","Negando la validez del principio de no contradicción","Aceptando que el devenir es pura ilusión inexplicable"],"correcta":0,"explicacion":"Pluralistas y atomistas aceptan que nada nace del no-ser, pero salvan los fenómenos: el 'nacimiento' es mezcla y la 'muerte', separación de principios eternos."},{"id":"fa1-t080","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p03","enunciado":"¿Por qué considera Aristóteles a Zenón 'inventor de la dialéctica'?","opciones":["Pregunta '¿qué es?' buscando definiciones universales","Refuta las tesis rivales deduciendo de ellas consecuencias absurdas","Divide y combina los géneros supremos de las Ideas"],"correcta":1,"explicacion":"El método de Zenón es la reducción al absurdo: concede la hipótesis contraria (hay pluralidad y movimiento) y extrae contradicciones. Las definiciones son de Sócrates; la división, de Platón."},{"id":"fa1-t081","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p04","enunciado":"¿Qué aceptan de Parménides los pluralistas y los atomistas?","opciones":["Que el ser es uno, inmóvil e indivisible","Que los sentidos son la única fuente fiable del saber","Que nada nace del no-ser ni perece absolutamente"],"correcta":2,"explicacion":"Aceptan la prohibición eleática del surgir absoluto, pero rechazan la unicidad e inmovilidad: varios principios eternos se mezclan y separan, salvando los fenómenos."},{"id":"fa1-t082","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p04","enunciado":"¿Cómo explica Empédocles la percepción?","opciones":["Por efluvios: lo semejante conoce lo semejante","Recibiendo la forma sensible sin la materia","Por convención: las cualidades no están en las cosas"],"correcta":0,"explicacion":"Los efluvios de las cosas encajan en los poros de los órganos afines. La recepción de la forma sin la materia es aristotélica; las cualidades por convención, de Demócrito."},{"id":"fa1-t083","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p04","enunciado":"¿Por qué fue procesado Anaxágoras en Atenas?","opciones":["Por corromper a los jóvenes y no creer en los dioses de la polis","Por impiedad: afirmó que el sol es una piedra incandescente","Por divulgar el secreto pitagórico de los inconmensurables"],"correcta":1,"explicacion":"Anaxágoras llevó la filosofía a Atenas y su naturalismo le costó un proceso por impiedad. La acusación de corromper a los jóvenes fue la de Sócrates; la divulgación del secreto se atribuye a Hipaso."},{"id":"fa1-t084","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p04","enunciado":"¿En qué difieren entre sí los átomos de Demócrito?","opciones":["En cualidades sensibles como el color y el sabor","En su grado de condensación y rarefacción","Solo en figura, orden y posición"],"correcta":2,"explicacion":"Las diferencias son puramente geométricas: las cualidades sensibles existen 'por convención'. La condensación y rarefacción son el mecanismo de Anaxímenes."},{"id":"fa1-t085","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p05","enunciado":"¿Qué es la 'physis' para Aristóteles?","opciones":["Principio interno de movimiento y de reposo del ser natural","El principio externo que el artesano impone al artefacto","La suma de los cuatro elementos del mundo sublunar"],"correcta":0,"explicacion":"A diferencia del artefacto, cuyo principio de cambio es externo (el artesano), el ser natural lleva en sí su principio de movimiento: eso estudia la física, 'filosofía segunda'."},{"id":"fa1-t086","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p05","enunciado":"¿Cómo salva Aristóteles la realidad del cambio frente a Parménides?","opciones":["El cambio es mezcla y separación de raíces eternas","El cambio va de ser-en-potencia a ser-en-acto, no del no-ser al ser","Negando el principio de no contradicción para el devenir"],"correcta":1,"explicacion":"La distinción acto/potencia permite pensar el devenir sin violar el principio de no contradicción: el ser se dice de muchas maneras. La mezcla de raíces fue la salida de Empédocles."},{"id":"fa1-t087","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p05","enunciado":"¿Cuáles son los tres principios del devenir según la Física de Aristóteles?","opciones":["Acto, potencia y movimiento","Átomos, vacío y necesidad","Sustrato, forma y privación"],"correcta":2,"explicacion":"En el cambio sustancial permanece la materia como sustrato; en el accidental, la sustancia. La privación (stéresis) es aquello desde lo cual se cambia. Átomos, vacío y necesidad son de Demócrito."},{"id":"fa1-t088","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p05","enunciado":"¿Qué sostiene Aristóteles sobre el vacío y el infinito?","opciones":["Niega el vacío; el infinito existe solo en potencia","Admite el vacío como condición del movimiento","Afirma un infinito en acto, divino e indestructible"],"correcta":0,"explicacion":"Contra los atomistas niega el vacío, y el infinito solo existe en potencia (divisibilidad, sucesión numérica). El infinito en acto divino recuerda al ápeiron de Anaximandro o a Meliso."},{"id":"fa1-t089","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p06","enunciado":"¿Qué distingue a Sócrates de los sofistas?","opciones":["Rechaza el giro antropológico y vuelve al estudio de la physis","No cobra y busca definiciones universales, no persuasión","Enseña a defender con éxito ambos lados de una causa"],"correcta":1,"explicacion":"Sócrates comparte con los sofistas el giro hacia el hombre y la polis, pero rechaza su relativismo: dialoga gratis en busca de la verdad. Los 'discursos dobles' son técnica sofística."},{"id":"fa1-t090","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p06","enunciado":"¿De qué fue acusado Sócrates en el juicio del 399 a.C.?","opciones":["De cobrar por enseñar retórica a los jóvenes ricos","De conspirar con los Treinta Tiranos contra la democracia","De impiedad y de corromper a los jóvenes"],"correcta":2,"explicacion":"Ánito, Meleto y Licón lo acusaron de impiedad y corrupción de los jóvenes. Cobrar por enseñar era lo propio de los sofistas, de quienes Sócrates se distinguía."},{"id":"fa1-t091","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p06","enunciado":"¿Qué sostiene la llamada 'paradoja socrática'?","opciones":["Es peor cometer injusticia que padecerla","Lo justo es ayudar a los amigos y dañar a los enemigos","La injusticia es provechosa cuando queda impune"],"correcta":0,"explicacion":"Consecuencia del intelectualismo moral: el injusto daña su propia alma, el bien más valioso. Ayudar a amigos y dañar a enemigos es la definición tradicional que Platón refuta en la República."},{"id":"fa1-t092","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p07","enunciado":"¿Cómo valora Aristóteles el estudio de los animales?","opciones":["Lo desprecia como saber de lo sensible y cambiante","'Hay algo maravilloso en todas las cosas naturales': funda la zoología","Lo reduce a choques mecánicos de átomos en el vacío"],"correcta":1,"explicacion":"Hijo de médico, Aristóteles dignifica la observación empírica de los vivientes frente al desprecio platónico de lo sensible; la biología ocupa gran parte del Corpus."},{"id":"fa1-t093","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p07","enunciado":"¿Cómo explica Aristóteles la sensación?","opciones":["Recuerda las formas contempladas por el alma antes de nacer","Recibe efluvios materiales de las cosas semejantes","Recibe la forma sin la materia, como la cera la figura del sello"],"correcta":2,"explicacion":"Empirismo moderado: 'nada hay en el intelecto que no haya estado antes en los sentidos'. El recuerdo prenatal es la anámnesis platónica; los efluvios, la teoría de Empédocles."},{"id":"fa1-t094","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p07","enunciado":"¿Cuál es la actividad más alta del hombre según Aristóteles?","opciones":["La contemplación (theoría), lo más divino que hay en él","La deliberación política en la asamblea y los tribunales","La purificación del alma para liberarla del cuerpo"],"correcta":0,"explicacion":"Aunque el hombre es animal político, su actividad suprema es la theoría, que lo acerca a la vida divina del pensamiento. La purificación del alma es ideal órfico-platónico."},{"id":"fa1-t095","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p08","enunciado":"¿Cómo surge la polis según Aristóteles?","opciones":["De un contrato entre individuos para evitar dañarse","Naturalmente, de la familia y la aldea; existe para vivir bien","De la fundación de un legislador que conoce el Bien"],"correcta":1,"explicacion":"La polis es anterior por naturaleza al individuo y autosuficiente: surge para vivir, pero existe para el vivir bien (eû zên). La política no es artificio ni contrato."},{"id":"fa1-t096","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p08","enunciado":"¿Qué critica Aristóteles al comunismo de la República platónica?","opciones":["Que conceda propiedad privada a los guardianes","Que excluya a las mujeres de la educación de la ciudad","La excesiva unidad destruye la polis; lo común de todos se descuida"],"correcta":2,"explicacion":"La polis es por naturaleza una pluralidad; Aristóteles defiende la propiedad privada de uso común y la familia. Platón, precisamente, negaba la propiedad a los guardianes e incluía a las mujeres."},{"id":"fa1-t097","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p08","enunciado":"¿Qué es la 'democracia' en la clasificación aristotélica de constituciones?","opciones":["La desviación que gobierna para el interés exclusivo de los pobres","El régimen recto en que gobiernan los muchos","El mejor régimen práctico, apoyado en la clase media"],"correcta":0,"explicacion":"Aristóteles cruza número de gobernantes y fin: el gobierno recto de los muchos es la politeia; su desviación es la 'democracia'. La politeia con clase media es su régimen preferible."},{"id":"fa1-t098","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p09","enunciado":"¿Por qué nace la filosofía precisamente en Mileto (s. VI a.C.)?","opciones":["Su aislamiento preservó intactas las tradiciones míticas","Ciudad comercial y abierta: razones públicas frente al mito","Allí se refugiaron los pitagóricos tras las revueltas"],"correcta":1,"explicacion":"La Jonia comercial y abierta favorece la crítica y el lógos frente a la autoridad dogmática de Homero y Hesíodo. Los pitagóricos florecieron en la Magna Grecia, no en Mileto."},{"id":"fa1-t099","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p09","enunciado":"¿Qué dice el primer fragmento conservado de la filosofía (Anaximandro)?","opciones":["Todo está lleno de dioses y el imán tiene alma","El ser es y no puede no ser; el no-ser no es","Las cosas se pagan pena y retribución por su injusticia según el tiempo"],"correcta":2,"explicacion":"El devenir queda pensado como justicia cósmica: las cosas retornan al ápeiron pagando su 'injusticia'. Los dioses en todo se atribuyen a Tales; el 'es' es de Parménides."},{"id":"fa1-t100","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p09","enunciado":"¿Cómo se sostiene la tierra según Anaximandro?","opciones":["En equilibrio en el centro, sin apoyo, por simetría","Flota sobre el agua como un madero","Cabalga plana sobre el aire comprimido"],"correcta":0,"explicacion":"Explicación por simetría y razón suficiente, sin soporte mítico: hito del pensamiento racional. Que flota sobre el agua es tesis de Tales; sobre el aire, de Anaxímenes."},{"id":"fa1-t101","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p10","enunciado":"¿Qué fundó Pitágoras al emigrar a Crotona?","opciones":["Una escuela de retórica para triunfar en la asamblea","Una comunidad religiosa, científica y política, con reglas y secreto","Un jardín filosófico apartado de la vida política"],"correcta":1,"explicacion":"El pitagorismo es un modo de vida (bíos) jerarquizado, con gran influencia política que provocó revueltas y la dispersión de la escuela. La retórica es sofística; el jardín apolítico, epicúreo."},{"id":"fa1-t102","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p10","enunciado":"¿Qué revelaron a los pitagóricos los intervalos musicales?","opciones":["Que la música imita y purga las pasiones del alma","Que la armonía nace del conflicto de los contrarios","Que la estructura de lo real es matemática: octava 2:1, quinta 3:2"],"correcta":2,"explicacion":"Las razones numéricas de los intervalos muestran que armonía y proporción constituyen el cosmos: primera matematización de la naturaleza. La armonía por el conflicto es de Heráclito."},{"id":"fa1-t103","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p10","enunciado":"¿Qué supuso el descubrimiento de los inconmensurables (√2)?","opciones":["Quebró el dogma de que todo es número entero o razón de enteros","Confirmó que todas las magnitudes son conmensurables","Demostró que la tierra gira en torno al Fuego central"],"correcta":0,"explicacion":"La diagonal del cuadrado no guarda razón con el lado: crisis que obligó a repensar aritmética y geometría. La leyenda atribuye a Hipaso su divulgación y castigo."},{"id":"fa1-t104","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p11","enunciado":"¿Qué contexto explica el auge de la sofística en el siglo V?","opciones":["La restauración oligárquica de los Treinta Tiranos","La democracia ateniense: la palabra decide en asamblea y tribunales","El mecenazgo de los tiranos, ávidos de elogios hábiles"],"correcta":1,"explicacion":"Tras las Guerras Médicas, el éxito cívico exige dominar la retórica; se suman el escepticismo ante las cosmologías contradictorias y el contacto con otras culturas."},{"id":"fa1-t105","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p11","enunciado":"¿Qué sostiene Protágoras acerca de los dioses?","opciones":["Ateísmo: son invención de un legislador astuto","Hay un dios supremo, no antropomórfico, que todo lo mueve","Agnosticismo: no puede saberse si existen; el asunto es oscuro"],"correcta":2,"explicacion":"'La vida es breve y el asunto oscuro': suspensión del juicio, no negación. El dios supremo no antropomórfico es la teología de Jenófanes."},{"id":"fa1-t106","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p11","enunciado":"¿Cómo valora la investigación actual a los sofistas?","opciones":["Los rehabilita como ilustrados griegos (Hegel, Grote)","Confirma la condena platónica: mercaderes de apariencias","Los considera meros continuadores de la física milesia"],"correcta":0,"explicacion":"La condena de Platón ('cazadores de jóvenes ricos') fijó el sentido peyorativo de 'sofista'; hoy se reconocen sus méritos: lenguaje, gramática, retórica y educación humanista."},{"id":"fa1-t107","tema":"Tema III: Platón","fuente":"pregunta:fa1-p12","enunciado":"¿Cómo sintetiza Platón a Heráclito y a Parménides?","opciones":["Ser inmóvil para lo sensible; flujo constante para las Ideas","Devenir para lo sensible (dóxa); ser inmutable para las Ideas (epistéme)","Rechaza a ambos: solo existen los átomos y el vacío"],"correcta":1,"explicacion":"Al ser pleno de las Ideas corresponde la ciencia; al devenir sensible, la opinión. Así salva Platón el conocimiento universal exigido por las definiciones socráticas."},{"id":"fa1-t108","tema":"Tema III: Platón","fuente":"pregunta:fa1-p12","enunciado":"¿Cuáles son los géneros supremos del Sofista de Platón?","opciones":["Límite, ilimitado, par e impar","Sustancia, cantidad, cualidad y relación","Ser, movimiento, reposo, lo mismo y lo otro"],"correcta":2,"explicacion":"La dialéctica tardía estudia la combinación (symploké) de estos géneros, que hace posible el discurso verdadero y falso. Límite-ilimitado son principios pitagóricos; las categorías, aristotélicas."},{"id":"fa1-t109","tema":"Tema III: Platón","fuente":"pregunta:fa1-p12","enunciado":"¿Cómo califica Platón la cosmología del Timeo?","opciones":["Un relato 'verosímil': lo sensible no admite ciencia exacta","Una ciencia exacta deducida de la Idea del Bien","Una opinión falsa, propia del engaño de los mortales"],"correcta":0,"explicacion":"Sobre el mundo del devenir solo cabe un discurso verosímil (eikós lógos); aun así, el cosmos queda dignificado como obra bella de la razón demiúrgica."},{"id":"fa1-t110","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p13","enunciado":"¿Qué estudia la 'ciencia buscada' de la Metafísica aristotélica?","opciones":["El ente móvil y sus causas naturales","El ser en cuanto ser y la sustancia suprasensible","Las reglas del razonamiento y de la demostración"],"correcta":1,"explicacion":"La doble caracterización, ontológica y teológica, genera el problema de la 'ontoteología'. El ente móvil es objeto de la física; las reglas del razonar, del Órganon."},{"id":"fa1-t111","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p13","enunciado":"¿Qué ilustra el ejemplo de lo 'sano' en la Metafísica?","opciones":["La univocidad del ser en todas las categorías","La pura equivocidad de la palabra 'ser'","La unidad referencial (pròs hén) de los sentidos del ser"],"correcta":2,"explicacion":"Como 'sano' se dice del clima, del síntoma y del cuerpo por referencia a la salud, las categorías se dicen ser por referencia a la ousía: vía media entre univocidad y equivocidad."},{"id":"fa1-t112","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p13","enunciado":"¿Qué discute hoy la hermenéutica sobre la teología de Metafísica XII?","opciones":["Si hay un dios trascendente o pluralidad de motores con unidad focal","Si Andrónico de Rodas falsificó el libro al editarlo","Si el Primer Motor crea el mundo de la nada"],"correcta":0,"explicacion":"Frente a la lectura ontoteológica medieval, interpretaciones inmanentistas y pluralistas (como la de Oñate) subrayan la unidad focal de los principios. La creación de la nada nunca fue tesis aristotélica."},{"id":"fa1-t113","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p14","enunciado":"¿Por qué se llaman 'menores' las escuelas socráticas?","opciones":["Porque sus fundadores no conocieron personalmente a Sócrates","Por contraste con la Academia: cada una radicaliza un solo rasgo de Sócrates","Porque abandonaron la ética para dedicarse a la física"],"correcta":1,"explicacion":"Megara, cínicos, cirenaicos y Elis-Eretria fueron fundadas por discípulos directos y combinan el legado socrático con influencias eleáticas o sofísticas, siempre en clave ética."},{"id":"fa1-t114","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p14","enunciado":"¿Qué proyección helenística tuvieron las escuelas socráticas menores?","opciones":["Del megarismo nace el epicureísmo; del cinismo, el escepticismo","Todas acabaron integrándose en la Academia platónica","Del cinismo nace el estoicismo; Cirene prepara a Epicuro; Megara, la lógica estoica"],"correcta":2,"explicacion":"Zenón de Citio fue discípulo del cínico Crates; el hedonismo cirenaico anticipa el debate epicúreo; los lógicos megáricos (Eubúlides, Diodoro Crono) alimentan la lógica estoica."},{"id":"fa1-t115","tema":"Tema III: Platón","fuente":"pregunta:fa1-p15","enunciado":"¿Por qué dice Platón que las matemáticas 'sueñan con el ser'?","opciones":["Usan hipótesis y figuras sin interrogar sus propios supuestos","Se ocupan solo de imágenes y de sombras sensibles","Alcanzan el principio no hipotético sin dar razón de él"],"correcta":0,"explicacion":"Son propedéutica necesaria pero insuficiente: solo la dialéctica asciende de hipótesis en hipótesis hasta el principio no hipotético y da razón (lógon didónai) de lo que sabe."},{"id":"fa1-t116","tema":"Tema III: Platón","fuente":"pregunta:fa1-p15","enunciado":"¿Qué caminos de ascenso del alma convergen en Platón?","opciones":["La retórica, la erística y la disputa sofística","El amor (Banquete), la purificación (Fedón) y la ciencia (República)","La física, la lógica y la ética helenísticas"],"correcta":1,"explicacion":"Los tres caminos —erótico, ascético-purificador y cognoscitivo— conducen al mismo ascenso 'hacia el Absoluto': el Ser y el Bien."},{"id":"fa1-t117","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p16","enunciado":"¿De quién toma Aristóteles su astronomía de esferas homocéntricas?","opciones":["De Ptolomeo y su sistema de epiciclos","De Filolao y su tierra girando en torno al Fuego central","De Eudoxo y Calipo, a quienes asume y corrige"],"correcta":2,"explicacion":"Aristóteles postula unas 47-55 esferas, cada movimiento eterno con su motor inmóvil (Metafísica XII, 8). Ptolomeo es muy posterior; el Fuego central es el sistema pitagórico de Filolao."},{"id":"fa1-t118","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p16","enunciado":"¿En qué se diferencia el Primer Motor del Demiurgo platónico?","opciones":["No es creador ni eficiente: el mundo eterno tiende a él como fin","Crea el cosmos de la nada, sin mirar modelo alguno","Ordena la chóra informe contemplando las Ideas"],"correcta":0,"explicacion":"El Primer Motor mueve 'como lo amado': causa final de un mundo eterno. Ordenar la chóra mirando las Ideas es justamente la tarea del Demiurgo del Timeo."},{"id":"fa1-t119","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"¿Qué hereda la ética platónica del intelectualismo socrático?","opciones":["La virtud es un término medio entre dos vicios extremos","La virtud es conocimiento del Bien y el mal nace de la ignorancia","El fin de la vida es el placer presente dominado por la razón"],"correcta":1,"explicacion":"Nadie obra mal a sabiendas: la vida buena exige el cuidado del alma (epiméleia tês psychês) y su purificación mediante el saber. (Ladrillo de: 'Platón: Ética y política')"},{"id":"fa1-t120","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"¿Qué ilustra el símil del carro alado del Fedro platónico?","opciones":["El alma tripartita: auriga racional y dos caballos, irascible y concupiscible","El ascenso erótico desde un cuerpo bello hasta lo Bello en sí","La educación como conversión del alma desde las sombras hacia el sol"],"correcta":0,"explicacion":"El auriga (razón) gobierna los dos caballos; a cada parte del alma corresponde su virtud propia. El ascenso erótico es del Banquete y la conversión, de la caverna. (Ladrillo de: 'Platón: Ética y política')"},{"id":"fa1-t121","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"¿Qué régimen de vida impone Platón a los guardianes de la República?","opciones":["Propiedad privada de uso común y defensa de la familia","Pobreza voluntaria, ascesis y desprecio de las convenciones","Comunidad de bienes y de familia, e igualdad de las mujeres"],"correcta":2,"explicacion":"La educación (paideía) selecciona a los mejores y culmina en la dialéctica; la propiedad privada de uso común es la réplica de Aristóteles. (Ladrillo de: 'Platón: Ética y política')"},{"id":"fa1-t122","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"Según República VIII-IX, ¿cómo es el alma del tirano?","opciones":["La más esclava e infeliz, dominada por sus deseos","La más libre, pues ninguna ley limita su voluntad","Dominada por el honor y la ambición militar"],"correcta":0,"explicacion":"Cada régimen degenerado corresponde a un tipo de alma; el tirano, esclavo de sus pasiones, es el hombre más desdichado. El honor domina al alma timocrática. (Ladrillo de: 'Platón: Ética y política')"},{"id":"fa1-t123","tema":"Tema III: Platón","fuente":"pregunta:fa1-p02","enunciado":"¿Qué propone Platón en el diálogo Político?","opciones":["La justicia como aquello que conviene al más fuerte","La ciencia regia: el saber propio del verdadero gobernante","El gobierno de la ley como régimen absolutamente óptimo"],"correcta":1,"explicacion":"En su evolución final, el Político define la ciencia regia; solo las Leyes aceptan como 'segundo mejor' Estado el gobierno de la ley, no de hombres. (Ladrillo de: 'Platón: Ética y política')"},{"id":"fa1-t124","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p04","enunciado":"¿Qué doctrina religiosa sostiene Empédocles en las 'Purificaciones'?","opciones":["El alma es un daímon caído que transmigra y debe purificarse","Los dioses son proyecciones antropomórficas de cada pueblo","Sobre los dioses nada puede saberse: el asunto es oscuro"],"correcta":0,"explicacion":"En Empédocles conviven física y religión órfica: su figura de mago-médico-poeta muestra que el primer pensamiento griego no separa ciencia y salvación. (Ladrillo de: 'Los filósofos pluralistas: Empédocles y Anaxágoras. Demócrito y Leucipo')"},{"id":"fa1-t125","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p04","enunciado":"¿Qué afirma Anaxágoras sobre la composición de las cosas?","opciones":["Todo se compone de cuatro raíces: fuego, aire, agua y tierra","Todo se compone de átomos indivisibles que se mueven en el vacío","'En todo hay parte de todo': infinitas semillas u homeomerías"],"correcta":2,"explicacion":"Cada cosa se denomina por lo que predomina en ella; nada surge de la nada. Las raíces son de Empédocles y los átomos, de Leucipo y Demócrito. (Ladrillo de: 'Los filósofos pluralistas: Empédocles y Anaxágoras. Demócrito y Leucipo')"},{"id":"fa1-t126","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p04","enunciado":"¿Cuál es el ideal ético de Demócrito?","opciones":["La autarquía y el desprecio ascético de las convenciones","La eutimía: buen ánimo y serenidad mediante la mesura","El placer presente y corporal como fin de la vida"],"correcta":1,"explicacion":"Su ética del buen ánimo anticipa los ideales helenísticos de serenidad; en su física, todo ocurre por necesidad (anánke). (Ladrillo de: 'Los filósofos pluralistas: Empédocles y Anaxágoras. Demócrito y Leucipo')"},{"id":"fa1-t127","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p05","enunciado":"¿Cuál es la causa principal en la naturaleza según Aristóteles?","opciones":["La material: todo se explica por los choques de los elementos","La eficiente: el azar y la necesidad lo producen todo","La final: la naturaleza obra por un fin, 'no hace nada en vano'"],"correcta":2,"explicacion":"La teleología natural es la base de su crítica al mecanicismo de Empédocles y Demócrito. (Ladrillo de: 'Aristóteles: Física')"},{"id":"fa1-t128","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p05","enunciado":"¿Cómo define Aristóteles el lugar (tópos) en la Física?","opciones":["El límite del cuerpo envolvente","El vacío donde se mueven los átomos","El número del movimiento según lo anterior"],"correcta":0,"explicacion":"Con su análisis del continuo (lugar, tiempo) responde a las aporías de Zenón y rechaza el vacío atomista y el infinito en acto. (Ladrillo de: 'Aristóteles: Física')"},{"id":"fa1-t129","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p06","enunciado":"¿Qué avala la misión filosófica de Sócrates según la Apología?","opciones":["El oráculo de Delfos, que declaró que nadie era más sabio","El daimonion, voz interior que le ordenaba enseñar doctrinas","El encargo de la asamblea ateniense de educar a los jóvenes"],"correcta":0,"explicacion":"'Una vida sin examen no merece ser vivida': la obediencia a esa vocación divina está por encima del miedo a la muerte; el daimonion solo disuade, nunca ordena. (Ladrillo de: 'Sócrates y los sofistas. El método socrático. Las doctrinas de Sócrates')"},{"id":"fa1-t130","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p06","enunciado":"¿Por qué rechaza Sócrates huir de la cárcel en el Critón?","opciones":["Porque su daimonion le ordenó expresamente aceptar la muerte","Porque esperaba que la asamblea revocara la sentencia","Por fidelidad a las leyes de Atenas, aun injustamente condenado"],"correcta":2,"explicacion":"Acusado por Ánito, Meleto y Licón, muere ejemplarmente (Fedón): su condena lo convierte en acontecimiento fundador de la filosofía platónica. (Ladrillo de: 'Sócrates y los sofistas. El método socrático. Las doctrinas de Sócrates')"},{"id":"fa1-t131","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p07","enunciado":"¿Qué funciones corresponden al alma vegetativa según Aristóteles?","opciones":["Sensación, deseo y movimiento local de los animales","Nutrición y reproducción, base común de todos los vivientes","Pensamiento y deliberación, exclusivos del ser humano"],"correcta":1,"explicacion":"Plantas, animales y hombre forman una escala continua (scala naturae): cada nivel de alma integra las funciones del anterior. (Ladrillo de: 'Aristóteles: Biología y antropología')"},{"id":"fa1-t132","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p07","enunciado":"¿Qué facultades median entre sensación y pensamiento según Aristóteles?","opciones":["Sentido común, imaginación (phantasía) y memoria","La anámnesis de las Ideas contempladas antes de encarnarse","Los efluvios: lo semejante conoce lo semejante"],"correcta":0,"explicacion":"'Nada hay en el intelecto que no haya estado antes en los sentidos': empirismo moderado frente a la anámnesis platónica; los efluvios son de Empédocles. (Ladrillo de: 'Aristóteles: Biología y antropología')"},{"id":"fa1-t133","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p08","enunciado":"¿Qué régimen considera Aristóteles preferible en la práctica?","opciones":["La monarquía del filósofo que conoce la Idea del Bien","La democracia radical: gobierno directo de los pobres libres","La politeia: mezcla de oligarquía y democracia con amplia clase media"],"correcta":2,"explicacion":"La clase media asegura estabilidad y virtud del término medio; los extremos de riqueza y pobreza engendran facción (stásis) y revoluciones. (Ladrillo de: 'Aristóteles: Política')"},{"id":"fa1-t134","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p08","enunciado":"¿Quién es ciudadano según la Política de Aristóteles?","opciones":["Quien participa en las funciones judicial y deliberativa","Todo el que reside y trabaja establemente en la ciudad","Solo quien asciende dialécticamente hasta la Idea del Bien"],"correcta":0,"explicacion":"La política es ciencia práctica y arquitectónica, y la educación debe ser pública y conforme al régimen. (Ladrillo de: 'Aristóteles: Política')"},{"id":"fa1-t135","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p09","enunciado":"¿De dónde surgen los primeros vivientes según Anaximandro?","opciones":["Del aire condensado en agua, tierra y piedra","De lo húmedo, pasando después a la tierra firme","De la mezcla de las cuatro raíces por el Amor"],"correcta":1,"explicacion":"Explicación racional sin soporte mítico; a Anaximandro se atribuyen también los mundos innumerables y el primer mapa. (Ladrillo de: 'Escuela de Mileto: Tales, Anaximandro, Anaxímenes')"},{"id":"fa1-t136","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p10","enunciado":"¿Qué pareja de principios encabeza la tabla pitagórica de opuestos?","opciones":["Amor (Philía) y Odio (Neîkos) en ciclo eterno","Ser inmóvil y devenir aparente de los mortales","Límite (péras) e ilimitado (ápeiron), impar y par"],"correcta":2,"explicacion":"El cosmos surge de la armonización de opuestos; la tabla pitagórica recoge diez pares. Amor y Odio son los principios de Empédocles. (Ladrillo de: 'La Filosofía en la Magna Grecia: Pitágoras')"},{"id":"fa1-t137","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p10","enunciado":"¿Qué sostiene la cosmología de Filolao el pitagórico?","opciones":["La tierra gira en torno a un Fuego central: sistema no geocéntrico","La tierra permanece inmóvil en el centro, en equilibrio","La tierra flota como un disco sobre el agua primordial"],"correcta":0,"explicacion":"Los pitagóricos, primeros en llamar 'kósmos' al universo, hablan de la armonía inaudible de las esferas; Filolao anticipa el descentramiento de la tierra. (Ladrillo de: 'La Filosofía en la Magna Grecia: Pitágoras')"},{"id":"fa1-t138","tema":"Tema I: Presocráticos","fuente":"pregunta:fa1-p10","enunciado":"¿Qué herencia pitagórica recibe Platón?","opciones":["El relativismo del homo mensura y el arte retórico","Matematización del saber, inmortalidad del alma y vida teorética","El mecanicismo de átomos y vacío regido por la necesidad"],"correcta":1,"explicacion":"Esa herencia se refleja en las Ideas-números, el Fedón y el Timeo, y pasa a la ciencia occidental. (Ladrillo de: 'La Filosofía en la Magna Grecia: Pitágoras')"},{"id":"fa1-t139","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p11","enunciado":"¿Cómo presenta Gorgias el lógos en el 'Encomio de Helena'?","opciones":["Como 'gran soberano' que persuade y arrastra como un fármaco","Como ley común que gobierna el devenir de los opuestos","Como examen público que alumbra definiciones universales"],"correcta":0,"explicacion":"Descubrimiento del poder autónomo del lenguaje: la retórica como poder del lógos. La ley del devenir es el lógos de Heráclito. (Ladrillo de: 'La sofística: causas, caracteres, méritos y representantes')"},{"id":"fa1-t140","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p11","enunciado":"¿Por qué destacó el sofista Pródico de Ceos?","opciones":["Por reducir la justicia a lo que conviene al más fuerte","Por sus estudios de sinonimia, distinguiendo términos afines","Por su agnosticismo sobre la existencia de los dioses"],"correcta":1,"explicacion":"Completan la nómina Hipias (polimatía, physis contra nómos), Calicles y Antifonte; el derecho del más fuerte es de Trasímaco y el agnosticismo, de Protágoras. (Ladrillo de: 'La sofística: causas, caracteres, méritos y representantes')"},{"id":"fa1-t141","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p11","enunciado":"¿Qué reprocha Platón a los sofistas?","opciones":["Buscar el arché de la physis en elementos materiales","Negar todo valor educativo a la palabra y al lenguaje","Vender apariencia de saber: 'cazadores de jóvenes ricos'"],"correcta":2,"explicacion":"Su condena fijó el sentido peyorativo de 'sofista', pese a los méritos sofísticos en gramática, retórica y educación humanista. (Ladrillo de: 'La sofística: causas, caracteres, méritos y representantes')"},{"id":"fa1-t142","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p13","enunciado":"Además de las categorías, ¿qué otros sentidos del ser distingue Aristóteles?","opciones":["Por sí y por accidente; según acto y potencia; verdadero y falso","Ingénito, imperecedero, uno, continuo, homogéneo e inmóvil","Ser en sí de las Ideas y ser participado de las cosas"],"correcta":0,"explicacion":"La filosofía modal del ente (acto/potencia) es la clave que unifica física y metafísica; los caracteres del ser uno e inmóvil son los sémata de Parménides. (Ladrillo de: 'Aristóteles: Filosofía primera')"},{"id":"fa1-t143","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p13","enunciado":"¿Qué es la sustancia primera según Metafísica VII?","opciones":["El universal abstracto común a muchos individuos","El eîdos como esencia y causa del ser del compuesto","El sustrato material indeterminado que permanece"],"correcta":1,"explicacion":"Ni el universal ni el sustrato indeterminado son sustancia: la forma inmanente es causa primera, frente a las Ideas separadas de Platón. (Ladrillo de: 'Aristóteles: Filosofía primera')"},{"id":"fa1-t144","tema":"Tema II: Período socrático","fuente":"pregunta:fa1-p14","enunciado":"¿Quién fundó la escuela socrática de Elis?","opciones":["Fedón, interlocutor del diálogo platónico sobre la inmortalidad","Euclides, que fusionó a Sócrates con la ontología eleática","Antístenes, defensor de la autarquía y la ascesis"],"correcta":0,"explicacion":"Menedemo trasladó después la escuela a Eretria; ambas continúan la dialéctica ética socrática, con escasa documentación. (Ladrillo de: 'Escuelas socráticas menores')"},{"id":"fa1-t145","tema":"Tema III: Platón","fuente":"pregunta:fa1-p15","enunciado":"En la línea dividida de la República, ¿qué grados componen la dóxa?","opciones":["Diánoia (matemáticas) y nóesis (Ideas)","Anámnesis (recuerdo) y aísthesis (sensación)","Eikasía (imágenes) y pístis (cosas sensibles)"],"correcta":2,"explicacion":"A imágenes y cosas sensibles corresponden conjetura y creencia; diánoia y nóesis son los grados de la epistéme. (Ladrillo de: 'Platón: Hacia el Absoluto (el camino de la ciencia)')"},{"id":"fa1-t146","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p16","enunciado":"¿Cómo argumenta Aristóteles la existencia del Primer Motor inmóvil?","opciones":["El orden del cosmos exige un artesano que mire las Ideas","La cadena de motores movidos no puede ser infinita","El consenso universal de los pueblos prueba lo divino"],"correcta":1,"explicacion":"Movimiento y tiempo son eternos, luego su principio también: acto puro sin materia ni potencia (Física VIII, Metafísica XII); el artesano divino es el Demiurgo platónico. (Ladrillo de: 'Aristóteles: Astronomía (astrología) y teología')"},{"id":"fa1-t147","tema":"Tema IV: Aristóteles","fuente":"pregunta:fa1-p16","enunciado":"¿En qué consiste la vida del dios aristotélico?","opciones":["Ordenar la chóra informe mirando los modelos eternos","Iniciar el remolino cósmico y ordenar la mezcla originaria","Pensamiento que se piensa a sí mismo (nóesis noéseos)"],"correcta":2,"explicacion":"Dios no puede pensar nada inferior a sí: actividad contemplativa perfecta y continua, de la que 'penden el cielo y la naturaleza'. Los distractores son el Demiurgo y el Noûs de Anaxágoras. (Ladrillo de: 'Aristóteles: Astronomía (astrología) y teología')"}]},{"id":"antropologia1","nombre":"Antropología Social I","nombreCorto":"Antropología","formatoExamen":"Examen presencial de desarrollo: 2 preguntas breves (2,5 puntos cada una) + 1 tema transversal (5 puntos). 120 minutos, sin material. Extensión máxima: 4 caras de folio en total. El tema puede ser también comentario de texto o análisis de un ejemplo etnográfico. PEC voluntaria: +1 punto.","temas":["Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","Tema 4: Lenguaje, comunicación y cognición","Tema 5: Antropología simbólica (religión, mito, ritual, arte)","Tema 6: Cultura urbana"],"preguntas":[{"id":"an1-p01","tipo":"desarrollo","enunciado":"¿Qué tipos de 'relativismo' diferencia M. Brown en su artículo sobre el alcance de éste en la antropología actual? Proporciona alguna definición para cada uno de ellos, comentando la diversa consideración que al autor le merecen las diferentes clases de relativismo.","variantes":["Siguiendo las distinciones de M. Brown, presenta, a partir de un ejemplo propio, la diferencia entre el relativismo cognitivo y el metodológico"],"apariciones":["2023 Feb-1","2024 Feb-1","2024 Sep","2025 Feb-2"],"frecuencia":4,"tema":"Tema 1: Definición y objeto de la antropología","bullets":[{"b":"Brown ('Relativismo 2.0') distingue tres relativismos: cognitivo (o epistemológico), moral (o ético) y metodológico.","x":"Su propósito es rescatar un relativismo moderado y útil frente a sus caricaturas: ni 'todo vale' ni existe un único patrón universal desde el que juzgar todas las culturas."},{"b":"Relativismo cognitivo: cada cultura tendría su propia racionalidad inconmensurable; Brown lo rechaza por insostenible.","x":"Si cada cultura tuviera una lógica radicalmente distinta, la traducción y la comparación serían imposibles; pero la práctica etnográfica demuestra que la comprensión intercultural funciona."},{"b":"Relativismo moral: los juicios éticos solo valen dentro de cada cultura; su versión fuerte impide condenar prácticas dañinas.","x":"Brown lo considera problemático frente a los derechos humanos: comprender la ablación o la violencia en su contexto no equivale a justificarlas. El antropólogo puede comprender sin aprobar."},{"b":"Relativismo metodológico: suspender temporalmente el juicio propio para entender cada práctica en su contexto; Brown lo defiende plenamente.","x":"Es una herramienta heurística del trabajo de campo, no una postura moral: primero comprender, después valorar. Constituye el núcleo sano y vigente del oficio antropológico."},{"b":"Ejemplo: analizar un sacrificio ritual suspendiendo el juicio (metodológico) sin sostener que su lógica sea intraducible (cognitivo).","x":"El etnógrafo describe qué significa el sacrificio para los participantes; ello no le obliga a afirmar que la racionalidad local sea incomparable con la ciencia, ni a aprobarlo moralmente."},{"b":"Conclusión: Brown propone un relativismo 'en dosis moderadas', antídoto del etnocentrismo y compatible con los derechos humanos."}]},{"id":"an1-p02","tipo":"desarrollo","enunciado":"TEMA: Explica los conceptos principales que hayas aprendido a lo largo del tema IV (Lenguaje, comunicación y cognición), señalando cuál es su relevancia para la comprensión de los procesos culturales. Utiliza las lecturas obligatorias sobre la comunicación no verbal, las categorías etnocientíficas y los relatos sobre globalidad y movilidad para mostrar tu apropiación productiva de las ideas de esos autores.","variantes":["TEMA: Aplica los conceptos principales que hayas aprendido a lo largo del tema IV ('Lenguaje, Comunicación y Cognición') a algún fenómeno cultural de tu entorno, especificando ("],"apariciones":["2023 Feb-2","2024 Feb-2","2025 Feb-2","2026 Feb-1"],"frecuencia":4,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Kottak: el lenguaje humano se distingue por productividad y desplazamiento; debate Sapir-Whorf (la lengua moldea el pensamiento) versus Chomsky (gramática universal innata).","x":"La versión fuerte del determinismo lingüístico está descartada; hoy se acepta una influencia mutua: la cultura también moldea la lengua, como muestra el vocabulario focal."},{"b":"Sociolingüística: el habla varía con clase y género; Labov (fonema /r/ en Nueva York) y Bourdieu (capital simbólico).","x":"Ninguna variante es lingüísticamente superior: su prestigio es social. La evaluación del habla reproduce la estratificación: hablar 'bien' funciona como capital en mercados simbólicos como escuela o empleo."},{"b":"Hall y Hall ('El sonido del silencio'): comunicación no verbal, proxémica y 'burbuja personal'; culturas de contexto alto y bajo.","x":"Gran parte de la comunicación es inconsciente y culturalmente pautada: distancias, gestos, silencios. Los malentendidos interculturales surgen de estas gramáticas invisibles del espacio y el tiempo."},{"b":"Díaz de Rada y Cruces (etnociencia): cada cultura ordena el mundo mediante clasificaciones; taxonomías (jerarquía de inclusión) y paradigmas (cruce de dimensiones).","x":"'El orden del sentido y el sentido del orden': las categorías nativas revelan la lógica cognitiva local; clasificar es una actividad universal con contenidos culturales variables."},{"b":"Pratt ('¿Por qué la Virgen de Zapopan fue a Los Ángeles?'): crítica de los grandes relatos de la globalización; movilidad vista desde abajo.","x":"Frente al mito del flujo homogéneo y sin fronteras, Pratt muestra movilidades concretas y desiguales: la Virgen viaja siguiendo a sus migrantes, que reconstruyen comunidad transnacional."},{"b":"Relevancia: lenguaje, cuerpo y clasificación organizan culturalmente la experiencia; analizar la comunicación es analizar la cultura en acción.","x":"Un buen cierre aplica estos conceptos a un fenómeno propio (por ejemplo, WhatsApp, jerga juvenil o un mercado) integrando a los cuatro autores citados."}]},{"id":"an1-p03","tipo":"desarrollo","enunciado":"Explica, siguiendo a Kottak, el concepto de estratificación social en el habla. Menciona investigaciones al respecto, como las de Labov en sociolingüística sobre la pronunciación neoyorquina del fonema 'r'. ¿A qué hace referencia el concepto de Bourdieu de 'capital simbólico'?","variantes":["Explica mediante ejemplos, siguiendo a Kottak, algunos de los hallazgos de los profesionales de la Sociolingüística (en particular, W. Labov y P. Bourdieu) sobre las relaciones entre el habla y la estratificación social"],"apariciones":["2022 Sep","2023 Feb-1","2025 Feb-2"],"frecuencia":3,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"La sociolingüística estudia la variación del habla en su contexto social: no hablamos igual según clase, situación o interlocutor."},{"b":"Labov (grandes almacenes de Nueva York): la pronunciación de la /r/ posvocálica aumenta con el estatus del establecimiento.","x":"Comparó Saks (alto), Macy's (medio) y S. Klein (bajo) preguntando por la 'fourth floor'. Los empleados de tiendas de más prestigio pronunciaban más la /r/, variante entonces prestigiosa."},{"b":"Ninguna variante lingüística es intrínsecamente mejor: su valor es social, atribuido por la posición de quienes la usan.","x":"Kottak insiste: el habla estándar no es superior gramaticalmente; se prestigia porque la usan los grupos dominantes. Juzgar el habla es juzgar socialmente al hablante."},{"b":"Los hablantes de estatus intermedio tienden a la hipercorrección, imitando y exagerando las formas de prestigio."},{"b":"Bourdieu: capital simbólico = prestigio y reconocimiento acumulados que otorgan poder; el habla legítima es capital lingüístico.","x":"Las prácticas lingüísticas valen en 'mercados simbólicos' (escuela, empleo, administración) donde domina la lengua legítima; los desposeídos de ella sufren violencia simbólica y aceptan como natural esa jerarquía."},{"b":"Conclusión: la estratificación del habla refleja y a la vez reproduce la estratificación social."}]},{"id":"an1-p04","tipo":"desarrollo","enunciado":"Explica, siguiendo a Kottak y por medio de ejemplos de tu entorno cotidiano, los conceptos de 'etnicidad', 'raza' y 'raza social'.","variantes":["¿En qué consiste según Kottak el fenómeno de la etnicidad? Menciona alguno de los ejemplos que ofrece en su texto"],"apariciones":["2022 Feb-1","2024 Feb-1","2025 Sep"],"frecuencia":3,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Etnicidad: identificación con un grupo étnico por origen, lengua, religión, historia o territorio compartidos, y exclusión de otros grupos.","x":"Se basa en similitudes percibidas entre los miembros y diferencias frente a los demás. Es situacional y flexible: se activa o se difumina según el contexto ('cambio de estatus')."},{"b":"La etnicidad es procesual y relacional, no una esencia: puede ser reivindicada, atribuida o impuesta (minorías, mayorías, discriminación).","x":"Ejemplos de Kottak: hispanos/latinos en EE.UU., afroamericanos; ejemplos cercanos: identidades gitana, vasca o catalana, activadas de forma distinta según la situación."},{"b":"Raza: carece de validez biológica; no existen razas humanas como subespecies discretas.","x":"La variación fenotípica es clinal (gradual) y hay más variación genética dentro de cada grupo que entre grupos. Rasgos como el color de piel responden a adaptación (selección) y no covarían en 'paquetes' raciales."},{"b":"Raza social: categoría racial construida culturalmente, asumida como natural; cada sociedad clasifica de forma distinta.","x":"Es una etnicidad a la que se atribuye erróneamente base biológica. Prueba de su arbitrariedad: la misma persona es clasificada de forma distinta en EE.UU., Brasil o Japón."},{"b":"Ejemplos de Kottak: hipodescendencia en EE.UU. (una gota de sangre), continuo fenotípico brasileño, burakumin en Japón.","x":"En EE.UU. el hijo de pareja mixta se adscribe automáticamente al grupo minoritario; en Brasil existen decenas de términos fenotípicos que pueden variar incluso entre hermanos; los burakumin son fenotípicamente indistinguibles pero segregados."},{"b":"Ejemplo cotidiano: llamar 'inmigrante' al vecino racializado nacido en España muestra cómo la raza social etniza y excluye."}]},{"id":"an1-p05","tipo":"desarrollo","enunciado":"Enumera y explica, siguiendo a Kottak, las dimensiones fundamentales del concepto de cultura.","variantes":["Enumera y explica, siguiendo a Kottak, las dimensiones fundamentales del concepto de cultura. A continuación, argumenta si la práctica conocida como 'botellón' se puede analizar o no a través de este concepto antropológico de cultura","Caracteriza, siguiendo a Kottak, las características fundamentales del concepto de cultura"],"apariciones":["2022 Feb-2","2023 Sep","2024 Feb-2"],"frecuencia":3,"tema":"Tema 1: Definición y objeto de la antropología","bullets":[{"b":"Punto de partida: definición de Tylor (1871): 'todo complejo que incluye conocimientos, creencias, arte, moral, derecho, costumbres... adquiridos como miembro de la sociedad'."},{"b":"La cultura es aprendida: se adquiere por enculturación, consciente e inconscientemente, no por herencia genética.","x":"Los humanos poseemos una capacidad biológica universal para aprender cualquier cultura; lo que varía es el contenido transmitido socialmente en cada grupo."},{"b":"Es simbólica: descansa en símbolos, signos arbitrarios y convencionales sin relación necesaria con aquello que representan.","x":"El lenguaje es el ejemplo máximo; también banderas, agua bendita o marcas. White y Geertz sitúan aquí la clave de lo humano."},{"b":"Es compartida: atributo de individuos como miembros de grupos, transmitida en sociedad; y todo lo abarca, incluida la vida cotidiana.","x":"No solo la 'alta cultura': para la antropología cuentan igualmente el fútbol, la comida o los memes. Además, se apropia de la naturaleza (necesidades biológicas moldeadas culturalmente)."},{"b":"Está pautada e integrada: sus elementos forman sistemas; si uno cambia, otros cambian; existen valores centrales que la articulan."},{"b":"Es adaptativa (y a veces maladaptativa) y está en todos los niveles: internacional, nacional y subculturas; los individuos la usan creativamente.","x":"Kottak distingue cultura ideal y real, y subraya la agencia: las personas no siguen las reglas mecánicamente, las manipulan y transforman (práctica)."},{"b":"Aplicación al botellón: práctica aprendida, compartida, simbólica y pautada de una subcultura juvenil; sí es analizable antropológicamente.","x":"Ritual de sociabilidad con reglas, espacios y significados propios (transgresión, pertenencia, edad); ejemplo de que la cultura abarca también prácticas informales y polémicas."}]},{"id":"an1-p06","tipo":"desarrollo","enunciado":"TEMA: Explica, siguiendo a los/as autores/as estudiados/as en los dos primeros temas de la asignatura (Kottak, Bohannan, Brown y Peacock) en qué consiste la especificidad metodológica de la antropología. ¿Cuál es su estrategia básica de producción de datos? ¿Qué técnicas incorpora? ¿Qué problemas éticos y metodológicos suscita?","variantes":["TEMA: Explica los conceptos fundamentales sobre el método y el trabajo de campo en antropología adquiridos en el conjunto de tus lecturas (Kottak, Keesing, Bohannan y Brown)","TEMA: Comenta el siguiente texto de J. L. Peacock ('Cada paso de la investigación antropológica implica dilemas... un recetario que exhibiera una fórmula fija para el trabajo de campo sería equívoco'), aplicando los conceptos fundamentales sobre el método y el trabajo de campo adquiridos en tus lecturas"],"apariciones":["2022 Feb-1","2022 Sep","2024 Feb-1"],"frecuencia":3,"tema":"Tema 2: Método y teorías en antropología","bullets":[{"b":"La especificidad antropológica es la etnografía: trabajo de campo prolongado y de primera mano, con observación participante como estrategia básica.","x":"El etnógrafo convive con el grupo, participa en su vida diaria y produce datos desde dentro, combinando implicación y distancia. Es a la vez método y género de escritura."},{"b":"Técnicas (Kottak): observación participante, entrevistas dirigidas y abiertas, genealogías, informantes clave, historias de vida, encuestas, estudios longitudinales.","x":"También la distinción emic (perspectiva del nativo) / etic (perspectiva del analista), cuya combinación caracteriza el conocimiento antropológico."},{"b":"Peacock: el método implica dilemas irresolubles —implicación/distanciamiento, subjetividad/objetividad, particularización/generalización, inducción/deducción—; no hay recetario fijo.","x":"La metáfora de 'la luz y el arpón': iluminar ampliamente el contexto y a la vez apresar significados concretos. El rigor está en gestionar reflexivamente los dilemas, no en eliminarlos."},{"b":"Bohannan ('Shakespeare en la selva'): al contar Hamlet a los tiv descubre que la interpretación depende del marco cultural.","x":"Los ancianos tiv reinterpretan la obra desde sus categorías (levirato, brujería, omens). Moraleja: no hay lecturas universales autoevidentes; la traducción cultural exige conocer las categorías nativas y vigilar el etnocentrismo."},{"b":"Brown: el relativismo metodológico —suspender el juicio para comprender— es la herramienta central; no implica relativismo moral absoluto."},{"b":"Keesing: las teorías de la cultura (adaptacionistas e ideacionales) orientan qué se observa y cómo se explica; método y teoría son inseparables."},{"b":"Ética (Kottak): consentimiento informado, no dañar a los sujetos, reciprocidad, anonimato; deontología ante comunidades vulnerables.","x":"El código de la AAA establece la responsabilidad primera hacia las personas estudiadas, por encima de los intereses de la investigación o de quien la financia."}]},{"id":"an1-p07","tipo":"desarrollo","enunciado":"TEMA: Aplica los conceptos principales que hayas aprendido a lo largo del tema V (Antropología Simbólica) a un caso etnográfico que te resulte familiar, especificando (a) de dónde surgen tales conceptos, (b) en qué sentido los utilizas y (c) cuál es su relevancia para la comprensión de ese fenómeno particular.","variantes":["TEMA: Desarrolla los tres conceptos que hayas aprendido que sean, a tu juicio, más fructíferos para el análisis de los fenómenos incluidos en el tema V, Antropología simbólica. Aplícalos productivamente a algún fenómeno que te sea familiar"],"apariciones":["2022 Feb-2","2023 Sep","2024 Sep"],"frecuencia":3,"tema":"Tema 5: Antropología simbólica","bullets":[{"b":"Conceptos base (Kottak, cap. Religión): religión como creencias y ritos sobre seres/poderes sobrenaturales (Wallace); animismo (Tylor), mana y tabú.","x":"La religión cumple funciones explicativas, emocionales (ansiedad-Malinowski), sociales (cohesión, control) y ecológicas (vacas sagradas-Harris)."},{"b":"Ritual: conducta formal, estereotipada, repetitiva y seria, ejecutada en lugares especiales; comunica y hace cosas (performativo).","x":"Van Gennep: ritos de paso con fases de separación, margen (liminalidad) y agregación. Turner añade la communitas: comunión igualitaria e intensa entre los liminares."},{"b":"Turner (ritual ndembu): símbolos dominantes con condensación, unificación de referentes y polarización de sentido (polo ideológico y polo sensorial).","x":"El árbol mudyi (savia lechosa) significa a la vez leche materna y matrilinaje: lo sensorial carga de emoción a la norma social."},{"b":"Finnegan: la música como práctica social situada; estudiarla revela cómo la gente crea, ejecuta y da sentido colectivamente ('senderos' musicales).","x":"Contra la visión de la música como obra abstracta, propone atender a la práctica amateur y cotidiana: bandas, coros, ensayos; el arte como acción social organizada."},{"b":"Folklore y patrimonio: metadiscursos modernos que seleccionan y sacralizan expresiones culturales como 'herencia' colectiva."},{"b":"Aplicación tipo (elige tu caso: Semana Santa, fiestas patronales, un festival, el fútbol): identifica símbolos dominantes, fases rituales, communitas y patrimonialización.","x":"Ejemplo: en unas fiestas patronales el santo condensa identidad local (polo ideológico) y emoción festiva (polo sensorial); la procesión es rito de paso anual; la declaración de Interés Turístico las patrimonializa."}]},{"id":"an1-p08","tipo":"desarrollo","enunciado":"Explica mediante ejemplos, siguiendo a Kottak, algunos de los hallazgos de los sociolingüistas (en particular, Lakoff y Tannen) sobre las diferencias de género en distintos niveles del habla.","variantes":["Explica mediante ejemplos, siguiendo a Kottak, algunos de los hallazgos de los sociolingüistas sobre las diferencias de género en distintos niveles del habla"],"apariciones":["2023 Feb-2","2026 Feb-2"],"frecuencia":2,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Hombres y mujeres difieren en fonología, entonación, léxico y estilo: diferencias culturales aprendidas, no biológicas."},{"b":"Ejemplos léxicos: las mujeres estadounidenses usan más términos de color (malva, turquesa); los hombres, más vocabulario deportivo y tacos.","x":"El vocabulario refleja la socialización diferencial y los ámbitos de experiencia asignados a cada género en una cultura dada."},{"b":"Lakoff: el 'habla femenina' usa atenuadores, preguntas coletilla y fórmulas de cortesía que reflejan menor poder social.","x":"Expresiones como '¿no te parece?' o 'quizá' comunican inseguridad aprendida; el problema no es el habla de las mujeres sino la jerarquía que la produce y la evalúa."},{"b":"Tannen: 'genderlects', estilos conversacionales distintos; mujeres orientadas al rapport (conexión), hombres al report (información y estatus).","x":"De ahí malentendidos recurrentes: ellas buscan empatía al contar un problema; ellos responden dando soluciones. Son estilos comunicativos culturales, no rasgos naturales."},{"b":"Las mujeres tienden más al habla estándar y de prestigio que los hombres de su misma clase.","x":"Kottak lo vincula con la menor seguridad de estatus: cuidar el habla es una forma de reclamar respetabilidad social."},{"b":"Conclusión: el habla expresa y reproduce la estratificación de género, igual que la de clase."}]},{"id":"an1-p09","tipo":"desarrollo","enunciado":"Gerd Baumann ha modelizado tres 'gramáticas de la identidad/alteridad'. Explica en qué consiste cada una de ellas y en qué medida se pueden aplicar al ámbito religioso de la cultura, según el propio autor.","variantes":["Gerd Baumann ha modelizado tres 'gramáticas de la identidad/alteridad'. Comenta los ejemplos que Baumann propone para el ámbito estético de la cultura, ilustrando de qué modo les son (o no) aplicables tales gramáticas"],"apariciones":["2023 Feb-2","2024 Feb-2"],"frecuencia":2,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Baumann: la identidad y la alteridad se construyen mediante tres 'gramáticas' o estructuras clasificatorias del nosotros/ellos.","x":"Son esquemas selectivos y reversibles ('selfing/othering'): no describen esencias sino operaciones discursivas que pueden combinarse en un mismo contexto."},{"b":"Gramática orientalista (Said): espejo invertido; 'lo que ellos son, nosotros no somos', con ambivalencia de rechazo y deseo.","x":"Oriente aparece como irracional y despótico pero también sensual y espiritual: negación especular que a la vez fascina ('lo malo nuestro es lo bueno suyo')."},{"b":"Gramática segmentaria (Evans-Pritchard): aliado o enemigo según el nivel de segmentación; la identidad depende del contexto.","x":"Como entre los nuer: aldeas rivales entre sí se unen frente a la tribu vecina, y todas frente al extranjero. Fusión y fisión contextuales."},{"b":"Gramática de englobamiento (Dumont): el otro es reconocido pero subsumido como caso subordinado de lo propio.","x":"'En el fondo sois como nosotros': la jerarquía engloba a su contrario, negando autonomía a la diferencia."},{"b":"Ámbito religioso: el ecumenismo suele englobar ('todos adoramos al mismo Dios'), las 'religiones del Libro' segmentan (unidas frente al secularismo), y el 'misticismo oriental' se orientaliza."},{"b":"Ámbito estético: el arte 'primitivo' o la world music se orientalizan (exotismo admirado) o se engloban en el canon occidental como formas 'menores'."}]},{"id":"an1-p10","tipo":"desarrollo","enunciado":"Explica brevemente en qué consiste la gramática segmentaria para identificarse y alterizar, siguiendo a Baumann y Evans-Pritchard. Aplícala a algún ejemplo del ámbito político.","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Origen: el modelo de linajes segmentarios de Evans-Pritchard entre los nuer (fisión y fusión según contexto)."},{"b":"Principio: quien es enemigo en un nivel bajo de segmentación es aliado en un nivel superior.","x":"Dos aldeas rivales se unen contra la sección vecina; dos secciones, contra otra tribu; todos los nuer, contra los dinka. La oposición estructura la solidaridad."},{"b":"La identidad resulta contextual y relativa: no hay 'otros' absolutos, sino niveles cambiantes de nosotros/ellos."},{"b":"Ejemplo político: partidos que rivalizan en unas autonómicas se coaligan en las generales; países de la UE compiten entre sí pero se unen frente a amenazas externas.","x":"También sirven las identidades territoriales anidadas: mi barrio contra el barrio vecino, mi ciudad contra la capital, mi país frente al extranjero."},{"b":"Límite señalado por Baumann: presupone niveles claros y solidaridad mecánica; en sociedades complejas se combina con las otras gramáticas."}]},{"id":"an1-p11","tipo":"desarrollo","enunciado":"Siguiendo a Gerd Baumann y Edward Said, explica en qué consiste una gramática orientalista para identificarse y alterizar. Aplícala a algún ejemplo del ámbito estético o artístico de tu propio entorno.","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Said (Orientalismo, 1978): Occidente construyó discursivamente un 'Oriente' que le sirve de espejo invertido para definirse.","x":"El orientalismo es un aparato de saber-poder ligado al colonialismo: literatura, pintura y ciencia produjeron un Oriente irracional, sensual y estancado frente a un Occidente racional y moderno."},{"b":"Baumann formaliza: gramática de la negación especular; 'lo que ellos son, nosotros no lo somos, y viceversa'."},{"b":"Es ambivalente: el otro condensa lo temido y lo deseado; se le desprecia y a la vez se le idealiza (exotismo, 'buen salvaje').","x":"Esta doble carga distingue el orientalismo del simple rechazo: lo que reprimimos en nosotros lo proyectamos y admiramos en ellos (espiritualidad, sensualidad, autenticidad)."},{"b":"Ejemplo estético: el flamenco exotizado como pasión 'primitiva'; la moda 'étnica' o boho; tatuajes 'tribales'; decoración 'zen'.","x":"Se consume la diferencia como autenticidad perdida: el mercado estético reproduce el binarismo nosotros-modernos / ellos-auténticos, aunque invierta la valoración."},{"b":"Conclusión: identificarse y alterizar son un mismo acto ('selfing/othering'); el retrato del otro es un autorretrato invertido."}]},{"id":"an1-p12","tipo":"desarrollo","enunciado":"Explica, siguiendo a Kottak, en qué consiste la etnografía como método, cuáles son sus principales técnicas y descríbelas brevemente.","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 2: Método y teorías en antropología","bullets":[{"b":"Etnografía: estrategia de investigación de campo, de primera mano y prolongada, en sociedades o grupos concretos; marca distintiva de la antropología."},{"b":"Observación participante: convivir y tomar parte en la vida local mientras se observa y registra sistemáticamente.","x":"Permite acceder a lo que la gente hace, no solo a lo que dice que hace; exige gestionar la tensión entre implicación y distancia."},{"b":"Conversación y entrevistas: desde la charla informal al cuestionario; entrevistas dirigidas (con guion) y no dirigidas."},{"b":"Método genealógico: registro de parentesco, filiación y matrimonio, esqueleto organizativo de las sociedades no industriales."},{"b":"Informantes clave (consultores culturales) e historias de vida: expertos locales y retratos biográficos en profundidad que muestran la cultura vivida."},{"b":"Perspectivas emic y etic: punto de vista nativo versus categorías del analista; la etnografía combina ambas."},{"b":"Investigación longitudinal, en equipo y multisituada; encuestas como complemento cuantitativo en sociedades complejas."}]},{"id":"an1-p13","tipo":"desarrollo","enunciado":"Resume los argumentos centrales de Mary Louise Pratt en relación con el proceso de globalización y los relatos que construimos en torno al mismo.","variantes":[],"apariciones":["2022 Feb-1"],"frecuencia":
