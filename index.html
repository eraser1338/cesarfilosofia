<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>César el filósofo</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface2:#f3f2ee;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --hairline:#e1e0d9; --border:rgba(11,11,11,.10);
  --good:#0ca30c; --warn:#c98500; --bad:#d03b3b;
  --goodbg:rgba(12,163,12,.10); --warnbg:rgba(250,178,25,.14); --badbg:rgba(208,59,59,.10);
  --accent:#2a78d6;
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.06);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,'Segoe UI',sans-serif;
}
[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface2:#232322;
  --ink:#f4f3ef; --ink2:#c3c2b7; --muted:#898781;
  --hairline:#2c2c2a; --border:rgba(255,255,255,.10);
  --good:#0ca30c; --warn:#fab219; --bad:#e66767;
  --goodbg:rgba(12,163,12,.16); --warnbg:rgba(250,178,25,.13); --badbg:rgba(230,103,103,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0; background:var(--page); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.45; transition:background .25s,color .25s}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit}
.wrap{max-width:780px; margin:0 auto; padding:0 16px 90px}

/* ---------- header ---------- */
header{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--hairline)}
.hrow{max-width:780px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
.brand{font-family:var(--serif); font-size:1.25rem; font-weight:600; letter-spacing:.2px; display:flex; align-items:center; gap:8px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand .laurel{font-size:1.1rem}
.hstat{display:flex; align-items:center; gap:6px; font-size:.85rem; color:var(--ink2); background:var(--surface); border:1px solid var(--border); padding:4px 10px; border-radius:999px; white-space:nowrap}
.hstat b{color:var(--ink); font-weight:600}
.iconbtn{width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:1rem; flex:none}
.iconbtn:hover{background:var(--surface2)}

/* ---------- tabs ---------- */
nav.tabs{max-width:780px; margin:14px auto 0; padding:0 16px; display:flex; gap:8px}
.tab{flex:1; padding:9px 0; text-align:center; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--ink2); font-weight:500; font-size:.95rem; transition:all .15s}
.tab.on{background:var(--ink); color:var(--page); border-color:var(--ink)}
.tab:not(.on):hover{background:var(--surface2)}

/* ---------- common ---------- */
.screen{display:none; animation:fadein .25s ease}
.screen.on{display:block}
@keyframes fadein{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
h2.sec{font-family:var(--serif); font-size:1.15rem; font-weight:600; margin:26px 0 10px}
.card-ui{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
.mut{color:var(--muted)} .small{font-size:.82rem}
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:.87rem; color:var(--ink2); transition:all .15s}
.chip .dot{width:9px; height:9px; border-radius:50%; background:var(--c,var(--muted)); flex:none}
.chip.on{background:color-mix(in srgb, var(--c,var(--ink)) 14%, var(--surface)); border-color:var(--c,var(--ink)); color:var(--ink); font-weight:500}
.meter{height:6px; border-radius:3px; background:var(--surface2); overflow:hidden}
.meter>i{display:block; height:100%; border-radius:3px; background:var(--c,var(--accent)); transition:width .5s ease}
.btn{padding:10px 18px; border-radius:12px; font-weight:500; border:1px solid var(--border); background:var(--surface); transition:all .15s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink); color:var(--page); border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.badge{display:inline-flex; align-items:center; gap:5px; font-size:.78rem; padding:3px 9px; border-radius:999px; background:var(--surface2); color:var(--ink2)}

/* ---------- inicio ---------- */
.hero{margin-top:22px; text-align:center}
.hero h1{font-family:var(--serif); font-size:1.9rem; margin:0 0 2px; font-weight:600}
.hero .lvl{font-size:.9rem; color:var(--ink2)}
.hero .lvl b{color:var(--ink)}
.quote{font-family:var(--serif); font-style:italic; color:var(--ink2); font-size:.95rem; max-width:520px; margin:10px auto 0}
.quote .who{font-style:normal; font-size:.8rem; color:var(--muted); display:block; margin-top:3px}
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:20px}
.tile{padding:12px 8px; text-align:center}
.tile .v{font-size:1.45rem; font-weight:600; line-height:1.1}
.tile .k{font-size:.75rem; color:var(--muted); margin-top:2px}
.xpbar{margin:16px 4px 0}
.xpbar .lbl{display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); margin-bottom:5px}
.subj{display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:10px; position:relative; overflow:hidden}
.subj::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c)}
.subj .info{flex:1; min-width:0}
.subj .nm{font-weight:600; font-family:var(--serif); font-size:1.02rem}
.subj .fmt{font-size:.78rem; color:var(--muted); margin:1px 0 8px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden}
.mrow{display:flex; align-items:center; gap:8px; font-size:.75rem; color:var(--ink2); margin-top:4px}
.mrow .meter{flex:1}
.mrow .pc{width:66px; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.subj .acts{display:flex; flex-direction:column; gap:6px}
.sbtn{font-size:.8rem; padding:6px 12px; border-radius:9px; border:1px solid var(--border); background:var(--surface2); white-space:nowrap}
.sbtn:hover{background:color-mix(in srgb, var(--c) 15%, var(--surface))}
.mixrow{display:flex; gap:10px; margin-top:4px}
.mixrow .btn{flex:1}

/* ---------- cards ---------- */
.scopebar{display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 6px}
.stage{perspective:1200px; margin-top:14px}
.fcard{position:relative; width:100%; min-height:300px; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,.1,.2,1); cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; padding:18px; border-radius:16px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.ftop{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.78rem; color:var(--ink2)}
.ftag{display:inline-flex; align-items:center; gap:6px; font-weight:500}
.ftag .dot{width:9px; height:9px; border-radius:50%; background:var(--c)}
.ftema{color:var(--muted); text-align:right; max-width:55%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.fmid{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:14px 6px}
.face.front .fmid{font-family:var(--serif); font-size:1.35rem; font-weight:600; line-height:1.3}
.face.back .fmid{font-size:1.02rem; line-height:1.55; color:var(--ink)}
.fhint{text-align:center; font-size:.78rem; color:var(--muted)}
.rate{display:flex; gap:10px; margin-top:14px}
.rate button{flex:1; padding:12px 6px; border-radius:12px; font-weight:600; font-size:.92rem; border:1px solid var(--border); transition:transform .1s}
.rate button:active{transform:scale(.97)}
.rate .r0{background:var(--badbg); color:var(--bad)}
.rate .r1{background:var(--warnbg); color:var(--warn)}
.rate .r2{background:var(--goodbg); color:var(--good)}
.rate button .k{display:block; font-size:.68rem; font-weight:400; color:var(--muted); margin-top:2px}
.sessrow{display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:.8rem; color:var(--muted)}
.boxdots{display:flex; gap:4px; align-items:center}
.boxdots i{width:7px; height:7px; border-radius:50%; background:var(--surface2); border:1px solid var(--hairline)}
.boxdots i.f{background:var(--c); border-color:var(--c)}

/* ---------- simulador ---------- */
.simpick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
.spick{padding:16px; text-align:left; position:relative; overflow:hidden}
.spick::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--c)}
.spick .nm{font-family:var(--serif); font-weight:600}
.spick .n2{font-size:.78rem; color:var(--muted); margin-top:2px}
.spick:hover{background:var(--surface2)}
.simhead{display:flex; align-items:center; gap:8px; margin:18px 0 10px; flex-wrap:wrap}
.simhead select{padding:7px 10px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--ink); font-size:.85rem; max-width:100%}
.fmtbox{font-size:.82rem; color:var(--ink2); padding:10px 14px; border-radius:12px; background:var(--surface2); margin-bottom:12px; display:none}
.fmtbox.on{display:block}
.q{padding:18px}
.qbadges{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.qbadges .freq{background:color-mix(in srgb, var(--c) 13%, var(--surface)); color:var(--ink)}
.qtext{font-family:var(--serif); font-size:1.2rem; font-weight:600; line-height:1.35}
.qvars{font-size:.8rem; color:var(--muted); margin-top:8px; font-style:italic}
.qapar{font-size:.76rem; color:var(--muted); margin-top:8px}
.reveal{margin:18px auto 4px; display:block; padding:12px 26px}
.answer{display:none; margin-top:16px; border-top:1px dashed var(--hairline); padding-top:14px}
.answer.on{display:block; animation:fadein .3s}
.bullets{list-style:none; margin:0; padding:0}
.bullets li{margin-bottom:10px; padding-left:2px}
.brow{display:flex; align-items:flex-start; gap:8px}
.brow .bmark{color:var(--c); font-weight:700; line-height:1.45; flex:none}
.brow .btxt{flex:1}
.bx{display:none; margin:6px 0 2px 22px; font-size:.88rem; color:var(--ink2); background:var(--surface2); border-left:2px solid var(--c); padding:8px 12px; border-radius:0 10px 10px 0}
.bx.on{display:block; animation:fadein .2s}
.bexp{font-size:.72rem; color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:1px 8px; margin-left:8px; white-space:nowrap; vertical-align:2px}
.bexp:hover{background:var(--surface2)}
.opts{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.opt{text-align:left; padding:11px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface2); line-height:1.4; transition:all .15s}
.opt:not(:disabled):hover{border-color:var(--ink2)}
.opt.ok{background:var(--goodbg); border-color:var(--good); color:var(--ink); font-weight:500}
.opt.ko{background:var(--badbg); border-color:var(--bad)}
.expl{display:none; margin-top:12px; font-size:.9rem; color:var(--ink2); background:var(--surface2); padding:10px 14px; border-radius:12px}
.expl.on{display:block; animation:fadein .3s}
.qnav{display:flex; gap:10px; margin-top:14px}
.qnav .btn{flex:1}

/* ---------- toast / modal ---------- */
#toasts{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{background:var(--ink); color:var(--page); padding:8px 18px; border-radius:999px; font-size:.86rem; font-weight:500; box-shadow:var(--shadow); animation:toastin 2.4s ease forwards}
@keyframes toastin{0%{opacity:0; transform:translateY(10px)} 10%,80%{opacity:1; transform:none} 100%{opacity:0; transform:translateY(-6px)}}
#modalbg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none; align-items:center; justify-content:center; padding:20px}
#modalbg.on{display:flex}
.modal{background:var(--surface); border-radius:18px; padding:22px; max-width:420px; width:100%; box-shadow:var(--shadow)}
.modal h3{font-family:var(--serif); margin:0 0 6px}
.modal p{font-size:.88rem; color:var(--ink2)}
.modal .mrowb{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.empty{text-align:center; padding:44px 20px; color:var(--muted)}
@media(max-width:560px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .subj{flex-direction:column; align-items:stretch; gap:8px}
  .subj .acts{flex-direction:row}
  .subj .acts .sbtn{flex:1; text-align:center}
  .simpick{grid-template-columns:1fr}
  .hstat.xp{display:none}
  .face.front .fmid{font-size:1.2rem}
}

/* ---------- test ---------- */
.modegrid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:14px}
.mode{display:flex; align-items:center; gap:14px; padding:16px; text-align:left}
.mode:hover{background:var(--surface2)}
.mode .ic{font-size:1.5rem}
.mode .t1{font-weight:600; font-family:var(--serif)}
.mode .t2{font-size:.8rem; color:var(--muted)}
.tprogwrap{display:flex; align-items:center; gap:10px; margin:14px 0 10px; font-size:.82rem; color:var(--ink2)}
.tprogwrap .meter{flex:1; height:8px}
.scorebar{display:flex; gap:10px; font-variant-numeric:tabular-nums; white-space:nowrap}
.scorebar .okc{color:var(--good); font-weight:600}
.scorebar .koc{color:var(--bad); font-weight:600}
.goal{margin-top:14px; font-size:.8rem; color:var(--ink2); background:var(--surface2); border-left:3px solid var(--c); padding:7px 12px; border-radius:0 10px 10px 0}
.res{padding:22px; text-align:center}
.res .nota{font-size:3rem; font-weight:700; font-family:var(--serif); line-height:1}
.res .apto{font-size:1rem; font-weight:600; margin-top:4px}
.res .detail{font-size:.85rem; color:var(--ink2); margin-top:8px}
.reslist{text-align:left; margin-top:16px}
.reslist .ko-item{padding:10px 12px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; font-size:.86rem}
.reslist .ko-item .en{font-weight:600}
.reslist .ko-item .ok-ans{color:var(--good); margin-top:3px}
.badge.realq{background:color-mix(in srgb, var(--c) 18%, var(--surface)); font-weight:600}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><span class="laurel">🏛️</span> César el filósofo</div>
    <div class="hstat" id="hstreak" title="Racha de días estudiando">🔥 <b id="streakv">0</b></div>
    <div class="hstat xp" title="Experiencia total">✦ <b id="xpv">0</b> XP</div>
    <button class="iconbtn" id="themebtn" title="Tema claro/oscuro">◐</button>
    <button class="iconbtn" id="cfgbtn" title="Ajustes">⚙</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab on" data-s="inicio">Inicio</button>
  <button class="tab" data-s="test">Test</button>
  <button class="tab" data-s="cards">Cards</button>
  <button class="tab" data-s="sim">Simulador</button>
</nav>

<div class="wrap">

<!-- ============ INICIO ============ -->
<section class="screen on" id="s-inicio">
  <div class="hero">
    <h1>Salve, César</h1>
    <div class="lvl">Nivel <b id="lvln">1</b> · <b id="lvlt">Aprendiz</b></div>
    <div class="quote" id="quote"></div>
  </div>
  <div class="xpbar">
    <div class="lbl"><span id="xplbl"></span><span id="xpnext"></span></div>
    <div class="meter"><i id="xpfill" style="--c:var(--ink); width:0%"></i></div>
  </div>
  <div class="tiles">
    <div class="tile card-ui"><div class="v" id="t-streak">0</div><div class="k">días de racha</div></div>
    <div class="tile card-ui"><div class="v" id="t-today">0</div><div class="k">XP hoy</div></div>
    <div class="tile card-ui"><div class="v" id="t-test">0%</div><div class="k">test dominado</div></div>
    <div class="tile card-ui"><div class="v" id="t-qs">0%</div><div class="k">simulador dominado</div></div>
  </div>
  <h2 class="sec">Tus asignaturas</h2>
  <div id="subjlist"></div>
  <div class="mixrow">
    <button class="btn primary" id="go-testmix">▶ Test · todas las asignaturas</button>
    <button class="btn" id="go-mix">Cards · todas</button>
  </div>
  <p class="small mut" style="text-align:center; margin-top:26px" id="footinfo"></p>
</section>

<!-- ============ TEST ============ -->
<section class="screen" id="s-test">
  <div class="scopebar" id="tscopebar"></div>
  <div id="testzone"></div>
</section>

<!-- ============ CARDS ============ -->
<section class="screen" id="s-cards">
  <div class="scopebar" id="scopebar"></div>
  <div id="cardzone"></div>
</section>

<!-- ============ SIMULADOR ============ -->
<section class="screen" id="s-sim">
  <div id="simzone"></div>
</section>

</div>

<div id="toasts"></div>
<div id="modalbg"><div class="modal" id="modal"></div></div>

<script>
const DATA = [{"id":"etica1","nombre":"Ética I","nombreCorto":"Ética I","formatoExamen":"Examen de desarrollo, 120 minutos, sin ningún material permitido. Dos partes obligatorias que hay que superar por separado: Parte 1, se proponen dos temas amplios del programa y se desarrolla SOLO UNO; Parte 2, comentario de un texto de las lecturas obligatorias (Fundamentación de la metafísica de las costumbres de Kant o Ética a Nicómaco de Aristóteles, libros I, II, III, VI y X). Se valoran conocimientos, claridad conceptual y capacidad organizativa y expositiva. PEC voluntaria (comentario de texto con el tutor, máximo 1 punto extra si se aprueba el examen).","temas":["Tema 1: El ámbito de la moralidad: Ética y Moral","Tema 2: La ética griega: Aristóteles","Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","Tema 4: Ética y Psicología","Tema 5: Ética y Sociología","Tema 6: Ética y Antropología","Tema 7: Ética y política","Tema 8: Ética y religión"],"preguntas":[{"id":"et1-p01","tipo":"desarrollo","enunciado":"Ética y Sociología","variantes":[],"apariciones":["2022 Feb-2","2022 Sep","2023 Sep","2024 Feb-2","2024 Sep","2025 Feb-2"],"frecuencia":6,"tema":"Tema 5: Ética y Sociología","bullets":[{"b":"La sociología estudia la moral como hecho social: describe las normas vigentes, no las justifica.","x":"La sociología de la moral es una disciplina descriptiva y explicativa. Analiza qué códigos morales rigen de hecho en una sociedad y por qué. La ética, en cambio, es normativa: pregunta qué normas deben regir y con qué razones."},{"b":"Durkheim: los hechos morales son hechos sociales; la sociedad es fuente y autoridad de la moral.","x":"Para Durkheim la moral es exterior al individuo y se le impone coercitivamente. La conciencia colectiva genera las normas y la anomia (ausencia de normas) es patología social. La educación moral consiste en socializar al individuo."},{"b":"Weber: distinción entre hechos y valores, neutralidad valorativa de la ciencia y politeísmo de los valores.","x":"Weber sostiene que la ciencia social debe abstenerse de juicios de valor. En la modernidad desencantada los valores últimos entran en conflicto irresoluble (politeísmo axiológico): la ciencia no puede decirnos qué dios servir."},{"b":"Explicar el origen social de una norma no equivale a fundamentarla ni refutarla: falacia genética.","x":"Que una norma haya surgido de intereses o estructuras sociales no decide su validez. Reducir la ética a sociología es un reduccionismo que confunde génesis con justificación."},{"b":"Aranguren: moral vivida frente a moral pensada; la ética reflexiona críticamente sobre el ethos social.","x":"La sociología accede a la moral vivida (los usos efectivos). La ética filosófica es moral pensada: examina críticamente ese ethos y puede corregirlo. Ambas perspectivas se necesitan sin confundirse."},{"b":"La pluralidad sociológica de códigos plantea el reto del relativismo; la ética busca criterios de validez universalizables.","x":"Constatar que las morales varían según sociedades y clases no implica que todas valgan igual. El paso del pluralismo descriptivo al relativismo normativo es un salto lógico que la ética debe examinar."}]},{"id":"et1-p02","tipo":"desarrollo","enunciado":"Kant y la ética de la Modernidad","variantes":["Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","El lugar de la ética en la filosofía kantiana"],"apariciones":["2022 Feb-2","2023 Feb-1","2023 Sep","2024 Feb-1","2025 Sep","2026 Feb-2"],"frecuencia":6,"tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","bullets":[{"b":"Giro moderno: de las éticas antiguas del bien y la felicidad a la ética del deber y la autonomía.","x":"Del Renacimiento a la Ilustración la moral se emancipa de la naturaleza y de la religión. Kant culmina este proceso: la razón práctica, no Dios ni la tradición, es la fuente de la ley moral. Ilustración: atreverse a pensar por uno mismo."},{"b":"Lo único bueno sin restricción es la buena voluntad; el valor moral está en la intención, no en los resultados.","x":"Talentos, temperamento y dones de fortuna son buenos solo condicionadamente. La buena voluntad vale por su puro querer conforme al deber, aunque no logre nada: brilla como una joya por sí misma."},{"b":"Solo obrar POR deber, no meramente conforme al deber, tiene valor moral; deber es respeto a la ley.","x":"El comerciante honrado por interés obra conforme al deber pero sin valor moral. El valor moral exige que el móvil sea el deber mismo: la necesidad de una acción por respeto a la ley práctica."},{"b":"Imperativo categórico: obra solo según una máxima que puedas querer al mismo tiempo como ley universal.","x":"A diferencia de los imperativos hipotéticos (condicionados a un fin), el categórico manda incondicionadamente. Es formal y a priori: no prescribe contenidos sino la forma universalizable de la máxima."},{"b":"Fórmula de la humanidad: trata la humanidad, en ti y en otros, siempre como fin, nunca solo como medio.","x":"Las personas tienen dignidad, no precio: son fines en sí mismos, insustituibles. Esta fórmula funda el respeto incondicionado a la persona, base de los derechos humanos modernos."},{"b":"Autonomía: la voluntad racional se da a sí misma la ley; toda moral heterónoma genera imperativos espurios.","x":"La autonomía es el principio supremo de la moralidad y fundamento de la dignidad. En el reino de los fines, cada ser racional es a la vez legislador y súbdito de la ley común."},{"b":"Libertad, inmortalidad y Dios como postulados de la razón práctica; primado de la razón práctica.","x":"La libertad no se demuestra teóricamente pero debe suponerse: es la ratio essendi de la moral. La ética kantiana es deontológica, universalista y formalista, y marca el paradigma moral de la Modernidad."}]},{"id":"et1-p03","tipo":"desarrollo","enunciado":"El ámbito de la moralidad: Ética y Moral","variantes":[],"apariciones":["2022 Feb-1","2023 Feb-1","2023 Feb-2","2025 Feb-1","2026 Feb-1"],"frecuencia":5,"tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","bullets":[{"b":"Moral: códigos concretos de normas y valores vividos por personas y grupos. Ética: filosofía moral, reflexión de segundo orden.","x":"La moral es un saber de primer orden que orienta directamente la acción. La ética es un saber de segundo orden: toma la moral como objeto, la analiza, la critica y busca fundamentarla."},{"b":"Etimología convergente: ethos griego (carácter, morada, hábito) y mos-moris latino (costumbre); remiten a hábitos y modo de ser.","x":"Ética viene de ethos, que significa tanto costumbre como carácter forjado por hábitos. Moral viene de mos, costumbre. La coincidencia etimológica no elimina la distinción funcional actual entre ambos términos."},{"b":"Aranguren: el ser humano es constitutivamente moral; moral como estructura frente a moral como contenido.","x":"Por su inconclusión biológica, el hombre debe justificar sus actos y elegir: no puede no ser moral (moral como estructura). Otra cosa son los contenidos concretos que adopte cada moral, e incluso ser inmoral presupone esa estructura."},{"b":"Rasgos de lo moral: libertad, responsabilidad, normatividad, universalizabilidad; distinto de lo legal, lo convencional y lo religioso.","x":"Solo hay moralidad donde hay libertad y posibilidad de imputar responsabilidad. Las normas morales obligan en conciencia y con pretensión de universalidad, a diferencia de usos sociales o leyes positivas."},{"b":"Funciones de la ética: aclarar qué es lo moral, fundamentar las normas y aplicar los principios a la vida.","x":"La ética no inventa la moral ni da recetas: parte de la experiencia moral existente y da razón (lógos) de ella. Incluye análisis conceptual, fundamentación y ética aplicada."},{"b":"Niveles del discurso: moral vivida, ética normativa y metaética (análisis del lenguaje moral).","x":"La metaética estudia el significado de términos como bueno o deber y la lógica del razonamiento moral. La ética normativa propone y fundamenta criterios del bien obrar."}]},{"id":"et1-p04","tipo":"desarrollo","enunciado":"Ética y religión","variantes":["Ética y Religión"],"apariciones":["2024 Feb-1","2025 Feb-1","2025 Sep","2026 Feb-1","2026 Feb-2"],"frecuencia":5,"tema":"Tema 8: Ética y religión","bullets":[{"b":"Vínculo histórico estrecho: las religiones han sido matrices de códigos morales, pero ética y religión son lógicamente distinguibles.","x":"En casi todas las culturas la moral nació entrelazada con la religión. La cuestión filosófica es si la moral necesita fundamento religioso o posee autonomía racional."},{"b":"Dilema de Eutifrón (Platón): ¿es bueno lo que Dios manda, o Dios lo manda porque es bueno?","x":"Si lo primero, la moral sería arbitraria (voluntarismo teológico). Si lo segundo, el bien es independiente de la voluntad divina y la moral no requiere fundamentación religiosa. Es el argumento clásico contra la ética heterónoma teológica."},{"b":"Kant: autonomía moral; la moral no deriva de la religión, sino que conduce a ella (postulados de Dios e inmortalidad).","x":"Para Kant la ley moral se funda en la razón, no en mandatos divinos. Pero la razón práctica postula a Dios y la inmortalidad para pensar el bien supremo, la unión de virtud y felicidad. Religión dentro de los límites de la mera razón: reconocer los deberes como mandatos divinos."},{"b":"Secularización moderna: emancipación de la moral respecto de la tutela religiosa; posibilidad de una ética laica universalista.","x":"La modernidad ilustrada construye una moral racional válida para creyentes y no creyentes, condición del pluralismo democrático. Ateísmo y moralidad no son incompatibles."},{"b":"Maestros de la sospecha: Feuerbach (proyección), Marx (opio del pueblo), Nietzsche (muerte de Dios), Freud (ilusión infantil).","x":"La crítica moderna de la religión la explica como proyección de deseos humanos (Feuerbach), consuelo ideológico (Marx), plataforma de la moral de esclavos (Nietzsche) o neurosis obsesiva universal e ilusión (Freud)."},{"b":"La religión sigue planteando preguntas límite que la ética deja abiertas: el mal, la muerte, el sentido, la esperanza.","x":"Horkheimer habla del anhelo de que el verdugo no triunfe sobre la víctima inocente: la justicia perfecta que la moral no puede garantizar. La religión opera aquí como horizonte de sentido y esperanza, no como fundamento de las normas."}]},{"id":"et1-p05","tipo":"desarrollo","enunciado":"Comentario de texto (Aristóteles, Ética a Nicómaco II): 'Pues bien, las acciones reciben el nombre de justas y templadas cuando son tales como podría realizarlas el hombre justo o el templado... tampoco aquellos van a estar bien de alma si filosofan de esta manera.'","variantes":[],"apariciones":["2022 Feb-2","2023 Sep","2024 Feb-1","2025 Feb-1","2025 Sep"],"frecuencia":5,"tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","bullets":[{"b":"Localización: Ética a Nicómaco, libro II; teoría de la adquisición de la virtud moral por el hábito.","x":"El libro II expone que las virtudes éticas no nacen con nosotros ni son enseñadas como la ciencia: se adquieren por ejercicio, igual que las artes. Somos capaces de virtud por naturaleza, pero nos hacemos virtuosos por costumbre."},{"b":"Tesis central: nos hacemos justos realizando acciones justas; la virtud es disposición estable (héxis) creada por repetición.","x":"Hay circularidad aparente: para hacer actos justos parece que hay que ser ya justo. Aristóteles la resuelve distinguiendo el acto conforme a virtud del acto hecho virtuosamente."},{"b":"No basta hacer lo justo: hay que hacerlo como lo hace el justo, con saber, elección por sí mismo y firmeza.","x":"Las condiciones del acto plenamente virtuoso son: saber lo que se hace, elegirlo por sí mismo (proaíresis) y obrar desde una disposición firme e inconmovible del carácter."},{"b":"Crítica a quienes se refugian en la teoría: el fin de la ética no es saber qué es la virtud, sino ser buenos.","x":"Aristóteles subraya el carácter práctico de la ética frente al intelectualismo socrático: conocer el bien no basta para obrar bien. La filosofía moral que no se practica es estéril."},{"b":"Símil médico: como el enfermo que escucha al médico pero no cumple el tratamiento, así el que filosofa sin practicar.","x":"El paralelismo cuerpo-alma refuerza la idea de la ética como terapéutica del alma: la salud moral exige práctica efectiva, no mera escucha de doctrinas."},{"b":"Conexión doctrinal: virtud ética como término medio determinado por la recta razón; papel de la educación y la pólis.","x":"Este pasaje se integra en la doctrina del mesotes y en el eudemonismo: la felicidad es actividad conforme a la virtud, y la legislación de la ciudad debe habituar a los ciudadanos al bien desde jóvenes."}]},{"id":"et1-p06","tipo":"desarrollo","enunciado":"La ética griega: Aristóteles","variantes":["La ética griega. Aristóteles"],"apariciones":["2022 Feb-1","2022 Sep","2023 Feb-2","2024 Feb-2"],"frecuencia":4,"tema":"Tema 2: La ética griega: Aristóteles","bullets":[{"b":"Ética teleológica y eudemonista: toda acción tiende a un fin; el fin último y autosuficiente es la felicidad (eudaimonía).","x":"La Ética a Nicómaco abre afirmando que todo arte y elección tienden a algún bien. El bien supremo se busca por sí mismo, es perfecto y autosuficiente: todos coinciden en llamarlo felicidad, aunque discrepan sobre su contenido."},{"b":"La felicidad no es placer, honor ni riqueza: es actividad del alma conforme a la virtud en una vida completa.","x":"Aristóteles descarta las vidas de placer, honores y negocio. La felicidad requiere además ciertos bienes exteriores y una vida entera: una golondrina no hace verano."},{"b":"Argumento del ergon: la función propia del hombre es la actividad racional del alma; vivir bien es ejercerla con excelencia.","x":"Como el flautista o el escultor, el hombre tiene una función propia: la vida activa de la parte racional. El bien humano es la actividad del alma según su virtud más perfecta."},{"b":"Virtud ética: disposición (héxis) adquirida por hábito, consistente en un término medio (mesótes) relativo a nosotros, determinado por la razón.","x":"El valor es medio entre cobardía y temeridad; la generosidad, entre avaricia y prodigalidad. El medio lo fija la recta razón, tal como lo decidiría el hombre prudente. Respecto del bien, la virtud es un extremo."},{"b":"Virtudes dianoéticas: sabiduría (sophía) y prudencia (phrónesis); la prudencia delibera rectamente sobre lo bueno para el hombre.","x":"Las virtudes intelectuales se adquieren por enseñanza. La phrónesis, tratada en el libro VI, es la recta razón en la acción sobre lo contingente: sin ella no hay virtud ética plena."},{"b":"Acción voluntaria, deliberación y elección (proaíresis): condiciones de la responsabilidad moral; análisis del libro III.","x":"Solo lo voluntario es alabable o censurable. La elección es deseo deliberado de cosas a nuestro alcance. Aristóteles funda así la primera teoría sistemática de la imputabilidad."},{"b":"Libro X: la vida contemplativa (theoría) es la felicidad suprema; la ética culmina en la política y la educación.","x":"La contemplación es la actividad más continua, autosuficiente y divina en nosotros. Con todo, el hombre feliz necesita también virtud ética, amigos y pólis: el bien humano se realiza en comunidad."}]},{"id":"et1-p07","tipo":"desarrollo","enunciado":"Comentario de texto (Kant, Fundamentación II): 'Cuando pienso en general un imperativo hipotético, no sé de antemano lo que contendrá... El imperativo categórico es, pues, único, y es como sigue: obra sólo según una máxima tal que puedas querer al mismo tiempo que se torne ley universal.'","variantes":[],"apariciones":["2022 Feb-1","2023 Feb-2","2025 Feb-2"],"frecuencia":3,"tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","bullets":[{"b":"Localización: Fundamentación de la metafísica de las costumbres, capítulo segundo; deducción de la fórmula del imperativo categórico.","x":"Kant pasa del conocimiento moral común a la filosofía moral. Tras clasificar los imperativos, muestra qué contiene el único imperativo propiamente moral."},{"b":"Del hipotético no sé a priori su contenido: depende de la condición (el fin) que me sea dada.","x":"Quien quiere el fin quiere los medios: los imperativos hipotéticos son analíticos respecto del querer del fin y valen solo condicionadamente."},{"b":"Del categórico sé inmediatamente lo que contiene: solo la necesidad de que la máxima se conforme a la ley universal.","x":"Como no está limitado por ninguna condición, no queda más que la universalidad de una ley en general. La moralidad es pura forma: universalizabilidad de la máxima."},{"b":"Máxima: principio subjetivo del obrar; ley: principio objetivo válido para todo ser racional.","x":"El test moral consiste en preguntar si puedo querer sin contradicción que mi máxima se convierta en ley universal. Ejemplos de Kant: la falsa promesa se autodestruye al universalizarse."},{"b":"El imperativo categórico es único, incondicionado, formal y a priori: no depende de fines empíricos ni de la felicidad.","x":"Frente a las éticas materiales, que fundan la moral en fines deseados, Kant funda la obligación en la mera forma legal del querer. Las demás fórmulas (humanidad, autonomía, reino de los fines) son expresiones del mismo principio."},{"b":"Consecuencia: autonomía de la voluntad; la razón práctica se da la ley a sí misma y funda la dignidad.","x":"Solo un imperativo incondicionado puede obligar moralmente. Su posibilidad remite a la libertad como autonomía, tema del capítulo tercero."}]},{"id":"et1-p08","tipo":"desarrollo","enunciado":"Comentario de texto (Kant, Fundamentación I): 'Ni en el mundo, ni, en general, tampoco fuera del mundo, es posible pensar nada que pueda considerarse como bueno sin restricción, a no ser tan sólo una buena voluntad... la buena voluntad la indispensable condición que nos hace dignos de ser felices.'","variantes":[],"apariciones":["2024 Feb-2","2024 Sep","2026 Feb-1"],"frecuencia":3,"tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","bullets":[{"b":"Localización: inicio del capítulo primero de la Fundamentación; tesis fundacional de la ética kantiana.","x":"Kant parte del conocimiento moral común: cualquier persona reconoce que solo la buena voluntad es incondicionadamente buena. De ahí extraerá los conceptos de deber e imperativo categórico."},{"b":"Talentos del espíritu, cualidades del temperamento y dones de la fortuna son buenos solo condicionadamente.","x":"Inteligencia, valor, perseverancia, poder, riqueza, honra y salud pueden volverse extraordinariamente malos y dañinos si la voluntad que los usa no es buena: la sangre fría de un malvado lo hace más abominable."},{"b":"La buena voluntad es buena por su querer mismo, no por lo que consiga: brillaría como joya aunque nada lograse.","x":"El valor moral es independiente de resultados y utilidad: antimonio radical del consecuencialismo. Aunque la fortuna le negase todo éxito, la buena voluntad conservaría íntegro su valor."},{"b":"El espectador razonable e imparcial no aprueba la felicidad de quien carece de voluntad buena.","x":"La felicidad sin virtud no complace: la buena voluntad es la condición indispensable que nos hace dignos de ser felices. Kant invierte el eudemonismo: la moral no busca la felicidad sino el merecerla."},{"b":"El carácter es la peculiar constitución de la voluntad que usa los dones de la naturaleza y la fortuna.","x":"Kant asume la primacía del carácter moral sobre las cualidades naturales, pero a diferencia de Aristóteles no lo funda en el hábito sino en la determinación de la voluntad por la ley."},{"b":"Proyección doctrinal: buena voluntad es la que obra por deber; anticipa el imperativo categórico y la autonomía.","x":"El pasaje prepara el análisis del deber: solo la acción hecha por deber, por respeto a la ley, expresa una buena voluntad. La moralidad se juega en la máxima, no en los efectos."}]},{"id":"et1-p09","tipo":"desarrollo","enunciado":"Ética y Política","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 7: Ética y política","bullets":[{"b":"Vínculo clásico: en Aristóteles la ética es parte de la política; el bien humano se realiza en la pólis.","x":"Para los griegos el hombre es animal político y la vida buena solo es posible en la comunidad. La política, como saber arquitectónico, ordena los demás saberes al bien común."},{"b":"Ruptura moderna: Maquiavelo autonomiza la política; lógica de la eficacia y razón de Estado frente a la moral.","x":"El príncipe debe aprender a poder no ser bueno según lo exija la necesidad. La política se rige por el éxito en conquistar y conservar el poder, no por la virtud moral cristiana."},{"b":"Weber: ética de la convicción frente a ética de la responsabilidad; el político debe responder por las consecuencias previsibles.","x":"Quien obra por pura convicción descarga en el mundo el resultado de sus actos. El político maduro pondera consecuencias y asume el uso de medios moralmente peligrosos, incluida la violencia legítima del Estado."},{"b":"Tensión permanente: problema de las manos sucias; ni moralismo ingenuo ni cinismo realista.","x":"La acción política parece exigir a veces transgredir normas morales por fines valiosos. La reflexión ética busca límites: no todo vale, ni siquiera por buenas causas."},{"b":"Recuperación normativa contemporánea: justicia como equidad (Rawls), ética discursiva (Apel, Habermas), derechos humanos y democracia deliberativa.","x":"Tras los totalitarismos, la filosofía política vuelve a fundamentar normativamente las instituciones: principios de justicia elegidos tras el velo de ignorancia, legitimidad por el diálogo de todos los afectados, derechos humanos como mínimos morales innegociables."},{"b":"Legalidad no equivale a justicia: la legitimidad política requiere criterios morales críticos frente al poder.","x":"Las leyes positivas pueden ser injustas; la moral funciona como instancia crítica (desobediencia civil, objeción de conciencia). A la vez, la ética necesita a la política para hacer efectivos sus ideales."}]},{"id":"et1-p10","tipo":"desarrollo","enunciado":"Ética y Psicología","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 4: Ética y Psicología","bullets":[{"b":"La psicología describe cómo se forma y funciona la conciencia moral; la ética pregunta por la validez de las normas.","x":"Son perspectivas complementarias: una empírico-descriptiva, otra filosófico-normativa. La psicología moral informa a la ética sobre motivación, desarrollo y límites reales del agente."},{"b":"Distinguir génesis y justificación: explicar psicológicamente un juicio moral no lo fundamenta ni lo refuta (falacia genética).","x":"Que la conciencia moral tenga origen en la interiorización de figuras de autoridad no decide si sus contenidos son válidos. El psicologismo reduce indebidamente la validez a los mecanismos psíquicos."},{"b":"Freud: el super-yo interioriza las normas parentales y sociales; explica la conciencia moral, la culpa y el malestar en la cultura.","x":"La instancia moral surge del complejo de Edipo por identificación con la autoridad. Una moral demasiado severa genera culpa neurótica: la crítica freudiana permite distinguir moral madura y moral patológica represiva."},{"b":"Piaget y Kohlberg: desarrollo del juicio moral por estadios, de la heteronomía a la autonomía.","x":"Piaget describe el paso del respeto unilateral a la cooperación. Kohlberg distingue seis estadios en tres niveles: preconvencional (castigo, interés), convencional (grupo, ley y orden) y posconvencional (contrato social, principios éticos universales de corte kantiano)."},{"b":"Crítica de Gilligan: la ética del cuidado, atenta a las relaciones concretas, frente al sesgo de la ética de la justicia.","x":"Gilligan objetó que la escala de Kohlberg privilegiaba la voz de la justicia y los principios abstractos, infravalorando la responsabilidad hacia los concretos otros, históricamente asociada a la experiencia moral femenina."},{"b":"Cuestiones fronterizas: motivación moral, debilidad de la voluntad (akrasía), emociones y racionalidad práctica.","x":"La psicología ilumina por qué sabemos el bien y hacemos el mal, el papel de las emociones morales (empatía, culpa, indignación) y las condiciones reales de la responsabilidad."}]},{"id":"et1-p11","tipo":"desarrollo","enunciado":"Comentario de texto (Kant, Fundamentación II): 'Pues bien, todos los imperativos mandan, ya hipotética, ya categóricamente... entonces es el imperativo categórico.'","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","bullets":[{"b":"Localización: Fundamentación, capítulo segundo; clasificación de los imperativos como fórmulas del mandato racional.","x":"Los imperativos expresan la relación entre las leyes objetivas de la razón y una voluntad no santa, que puede no seguirlas: son mandatos que constriñen (Nötigung) a seres racionales imperfectos."},{"b":"Imperativos hipotéticos: mandan una acción como medio para conseguir otra cosa que se quiere o puede quererse.","x":"Se subdividen en problemáticos o de habilidad (reglas técnicas para fines posibles) y asertóricos o de prudencia (consejos para la felicidad, fin que todos tienen de hecho)."},{"b":"Imperativo categórico: representa la acción como buena en sí misma, objetivamente necesaria, sin referencia a otro fin.","x":"Es apodíctico: manda incondicionadamente. Solo él es ley práctica moral, pues obliga a toda voluntad racional con independencia de sus deseos e inclinaciones."},{"b":"Toda ley práctica representa la acción como buena y necesaria para un sujeto determinable por la razón.","x":"Lo bueno como medio funda imperativos hipotéticos; lo bueno en sí, principio de una voluntad conforme a la razón, funda el categórico. La distinción medios-fines articula todo el pasaje."},{"b":"Proyección: solo el categórico expresa la moralidad; conduce a la fórmula de la ley universal y a la autonomía.","x":"Este texto prepara la formulación: obra solo según una máxima que puedas querer como ley universal. La moral no puede fundarse en la felicidad, concepto empírico e indeterminado."}]},{"id":"et1-p12","tipo":"desarrollo","enunciado":"Comentario de texto (Aristóteles, Ética a Nicómaco I): 'Puesto que todo conocimiento y toda elección tienden a algún bien... Pero sobre lo que es la felicidad discuten y no lo explican del mismo modo el vulgo que los sabios.'","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","bullets":[{"b":"Localización: Ética a Nicómaco, libro I; búsqueda del bien supremo realizable por el hombre.","x":"El tratado se abre con la tesis teleológica: todo arte, investigación, acción y elección tienden a algún bien. Debe haber un fin último querido por sí mismo, o el deseo sería vacío e infinito."},{"b":"El bien supremo es fin último, perfecto y autosuficiente: se elige siempre por sí mismo y nunca por otra cosa.","x":"Es objeto de la ciencia más arquitectónica, la política. Conocerlo tiene gran importancia para la vida: como arqueros, tendremos un blanco al que apuntar."},{"b":"Acuerdo nominal: casi todos, vulgo y cultos, llaman felicidad (eudaimonía) al bien supremo; vivir bien y obrar bien.","x":"Eudaimonía no es un estado subjetivo pasajero sino la vida lograda, el florecimiento humano completo. El acuerdo verbal encubre el desacuerdo real sobre su contenido."},{"b":"Desacuerdo real: el vulgo la identifica con placer o riqueza; otros con honores; los sabios, con la contemplación.","x":"Aristóteles examina los principales modos de vida: la vida de placer es propia de esclavos; los honores dependen de quien los otorga; la riqueza es solo medio. La respuesta final vendrá con el argumento del ergon."},{"b":"Método ético: partir de las opiniones acreditadas (éndoxa) y aceptar la precisión propia de la materia práctica.","x":"En ética no cabe la exactitud matemática: se argumenta sobre lo que es en general. Este pasaje ejemplifica el procedimiento dialéctico aristotélico: recoger, depurar y superar las opiniones comunes."},{"b":"Proyección doctrinal: felicidad como actividad del alma conforme a la virtud en una vida completa.","x":"El texto prepara la definición central del libro I y la posterior teoría de la virtud como término medio, culminando en la vida contemplativa del libro X."}]},{"id":"et1-p13","tipo":"desarrollo","enunciado":"Comentario de texto (Aristóteles, Ética a Nicómaco VI): 'Acerca de la Prudencia podríamos alcanzar una idea de esta manera: considerando a quienes solemos llamar prudentes... De manera que en general sería prudente el que es capaz de deliberar.'","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","bullets":[{"b":"Localización: Ética a Nicómaco, libro VI, dedicado a las virtudes dianoéticas; caracterización de la prudencia (phrónesis).","x":"Aristóteles procede empíricamente, según su método: para definir la prudencia observa a quienes de hecho llamamos prudentes, partiendo de las opiniones comunes (éndoxa)."},{"b":"El prudente delibera bien sobre lo bueno y conveniente para sí, no parcialmente sino para vivir bien en general.","x":"No se trata de calcular medios para fines particulares como la salud o el vigor, sino de saber qué conviene a la vida buena en su conjunto: la prudencia mira al fin total de la existencia humana."},{"b":"La prudencia versa sobre lo contingente y factible: no hay deliberación sobre lo necesario ni sobre lo imposible.","x":"Se distingue así de la ciencia (epistéme), que trata de lo universal y necesario, y de la sabiduría teórica (sophía). Su ámbito es la praxis: lo que puede ser de otra manera y depende de nosotros."},{"b":"La prudencia no es técnica (téchne): no produce objetos, sino que es recta razón práctica sobre el bien humano; el propio texto señala que hay prudencia donde no hay técnica.","x":"La poíesis tiene su fin fuera de sí (la obra); la praxis tiene el fin en el propio obrar bien (eupraxía). La prudencia es disposición racional verdadera y práctica respecto de lo bueno para el hombre."},{"b":"Función articuladora: la prudencia determina el término medio de las virtudes éticas; sin ella no hay virtud plena.","x":"La virtud ética hace recto el fin; la prudencia, los medios. Aristóteles unifica así carácter e intelecto: no cabe ser prudente sin ser bueno, ni plenamente bueno sin prudencia. Su modelo de prudente es Pericles."}]}],"cards":[{"id":"et1-c01","tema":"Tema 1","front":"Diferencia entre ética y moral","back":"Moral: códigos concretos de normas y valores que orientan la vida (primer orden). Ética: filosofía moral, reflexión crítica de segundo orden que analiza y fundamenta esas morales."},{"id":"et1-c02","tema":"Tema 1","front":"Etimología de ética y moral","back":"Ética: del griego ethos, carácter y costumbre-morada. Moral: del latín mos-moris, costumbre. Ambas remiten a hábitos y modo de ser adquirido."},{"id":"et1-c03","tema":"Tema 1","front":"Moral como estructura vs moral como contenido (Aranguren)","back":"Estructura: el hombre es constitutivamente moral, no puede no justificar sus actos. Contenido: las normas concretas de cada moral. Incluso el inmoral presupone la estructura."},{"id":"et1-c04","tema":"Tema 1","front":"Moral vivida vs moral pensada (Aranguren)","back":"Moral vivida: el ethos efectivo de personas y sociedades. Moral pensada: la reflexión filosófica sobre ese ethos, que lo examina y critica."},{"id":"et1-c05","tema":"Tema 1","front":"¿Qué es la metaética?","back":"Análisis del significado de los términos morales (bueno, deber) y de la lógica del razonamiento moral. No prescribe normas: estudia el lenguaje moral."},{"id":"et1-c06","tema":"Tema 1","front":"Funciones de la ética filosófica","back":"Aclarar qué es lo moral, fundamentar racionalmente las normas y aplicar los principios a los distintos ámbitos de la vida. Da razón de la moral, no la inventa."},{"id":"et1-c07","tema":"Tema 1","front":"Condiciones de la moralidad de un acto","back":"Libertad e imputabilidad: solo hay moralidad donde el agente puede elegir y responder de sus actos. Las normas morales obligan en conciencia con pretensión universalizable."},{"id":"et1-c08","tema":"Tema 2","front":"Eudaimonía","back":"Felicidad como vida lograda o florecimiento humano: fin último, perfecto y autosuficiente. Para Aristóteles, actividad del alma conforme a la virtud en una vida completa."},{"id":"et1-c09","tema":"Tema 2","front":"Argumento del ergon (función propia)","back":"La función propia del hombre es la actividad racional del alma. El bien humano consiste en ejercerla con excelencia (virtud), como el buen flautista ejerce bien la suya."},{"id":"et1-c10","tema":"Tema 2","front":"Virtud ética: definición aristotélica","back":"Disposición estable (héxis) adquirida por hábito, consistente en un término medio relativo a nosotros, determinado por la razón como lo decidiría el prudente."},{"id":"et1-c11","tema":"Tema 2","front":"Mesótes (término medio)","back":"La virtud es medio entre dos vicios, exceso y defecto: valor entre cobardía y temeridad. Respecto del bien es un extremo. No es mediocridad."},{"id":"et1-c12","tema":"Tema 2","front":"Virtudes éticas vs dianoéticas","back":"Éticas: del carácter, se adquieren por hábito (valor, templanza, justicia). Dianoéticas: intelectuales, por enseñanza (sabiduría, prudencia). Libro VI trata las segundas."},{"id":"et1-c13","tema":"Tema 2","front":"Phrónesis (prudencia)","back":"Virtud dianoética: recta razón práctica que delibera bien sobre lo bueno para el hombre en general. Versa sobre lo contingente; determina el término medio. Modelo: Pericles."},{"id":"et1-c14","tema":"Tema 2","front":"Héxis","back":"Disposición o hábito estable del carácter, adquirido por repetición de actos. Es el género de la virtud: ni pasión ni facultad, sino modo firme de ser."},{"id":"et1-c15","tema":"Tema 2","front":"Proaíresis (elección)","back":"Deseo deliberado de lo que está a nuestro alcance. Condición del acto plenamente virtuoso y de la responsabilidad; se analiza en el libro III."},{"id":"et1-c16","tema":"Tema 2","front":"Condiciones del acto plenamente virtuoso (EN II)","back":"Obrar sabiendo lo que se hace, eligiéndolo por sí mismo y desde una disposición firme e inconmovible. No basta hacer lo justo: hay que hacerlo como el justo."},{"id":"et1-c17","tema":"Tema 2","front":"¿Cómo se adquiere la virtud moral?","back":"Por hábito (éthos): nos hacemos justos practicando la justicia, como se aprende a tocar la cítara tocando. La naturaleza da la capacidad; la práctica, la virtud."},{"id":"et1-c18","tema":"Tema 2","front":"Fin de la ética según Aristóteles","back":"Práctico, no teórico: no investigamos para saber qué es la virtud, sino para ser buenos. Crítica al intelectualismo socrático y a refugiarse en la teoría."},{"id":"et1-c19","tema":"Tema 2","front":"Vida contemplativa (EN X)","back":"La theoría es la felicidad más alta: actividad de lo más divino en nosotros, la más continua, placentera y autosuficiente. Segunda felicidad: la vida según las virtudes éticas."},{"id":"et1-c20","tema":"Tema 2","front":"Praxis vs poíesis","back":"Poíesis: producción cuyo fin es la obra externa (regida por la téchne). Praxis: acción cuyo fin es el propio obrar bien (regida por la phrónesis)."},{"id":"et1-c21","tema":"Tema 2","front":"Akrasía","back":"Debilidad de la voluntad o incontinencia: saber qué es lo bueno y hacer lo contrario arrastrado por la pasión. Problema contra el intelectualismo socrático."},{"id":"et1-c22","tema":"Tema 2","front":"Método ético aristotélico","back":"Partir de las opiniones acreditadas (éndoxa), depurarlas dialécticamente y aceptar solo la precisión que admite la materia práctica: en ética no cabe exactitud matemática."},{"id":"et1-c23","tema":"Tema 2","front":"Ética y política en Aristóteles","back":"La ética es parte de la política, saber arquitectónico del bien común. El hombre es animal político: la vida buena solo se realiza plenamente en la pólis."},{"id":"et1-c24","tema":"Tema 3","front":"Buena voluntad (Kant)","back":"Lo único bueno sin restricción. Vale por su querer mismo, no por sus resultados: brillaría como una joya aunque nada lograse. Nos hace dignos de ser felices."},{"id":"et1-c25","tema":"Tema 3","front":"Conforme al deber vs por deber","back":"Conforme al deber: acción legal, coincide externamente con el deber (comerciante honrado por interés). Por deber: el móvil es el deber mismo; solo esta tiene valor moral."},{"id":"et1-c26","tema":"Tema 3","front":"Definición kantiana de deber","back":"Necesidad de una acción por respeto a la ley. El respeto es el único sentimiento moral: producido por la razón, no recibido de la sensibilidad."},{"id":"et1-c27","tema":"Tema 3","front":"Máxima vs ley práctica","back":"Máxima: principio subjetivo del querer, regla por la que de hecho obro. Ley: principio objetivo válido para toda voluntad racional. La moral exige máximas universalizables."},{"id":"et1-c28","tema":"Tema 3","front":"Imperativo hipotético","back":"Manda una acción como medio para un fin que se quiere: condicionado. Tipos: de habilidad (problemático, técnico) y de prudencia (asertórico, felicidad)."},{"id":"et1-c29","tema":"Tema 3","front":"Imperativo categórico: fórmula de la ley universal","back":"Obra sólo según una máxima tal que puedas querer al mismo tiempo que se torne ley universal. Único, incondicionado, formal, a priori, apodíctico."},{"id":"et1-c30","tema":"Tema 3","front":"Fórmula de la humanidad como fin en sí","back":"Obra tratando la humanidad, en tu persona y en la de cualquier otro, siempre como fin al mismo tiempo, nunca solamente como medio."},{"id":"et1-c31","tema":"Tema 3","front":"Dignidad vs precio (Kant)","back":"Lo que tiene precio admite equivalente e intercambio; lo que tiene dignidad es único e insustituible. Las personas tienen dignidad por su autonomía moral."},{"id":"et1-c32","tema":"Tema 3","front":"Autonomía vs heteronomía","back":"Autonomía: la voluntad racional se da la ley a sí misma; principio supremo de la moralidad. Heteronomía: la ley viene de fuera (deseos, sociedad, Dios); genera imperativos condicionados."},{"id":"et1-c33","tema":"Tema 3","front":"Reino de los fines","back":"Comunidad ideal de seres racionales bajo leyes comunes, donde cada uno es legislador y súbdito a la vez y todos son tratados como fines en sí."},{"id":"et1-c34","tema":"Tema 3","front":"Postulados de la razón práctica","back":"Libertad, inmortalidad del alma y existencia de Dios: no demostrables teóricamente, pero exigidos por la moralidad y por la posibilidad del bien supremo (virtud más felicidad)."},{"id":"et1-c35","tema":"Tema 3","front":"¿Por qué la ética kantiana es formal y deontológica?","back":"Formal: no prescribe fines ni contenidos, solo la forma universalizable de la máxima. Deontológica: el criterio es el deber, no las consecuencias ni la felicidad."},{"id":"et1-c36","tema":"Tema 3","front":"Test de universalización: ejemplo de la falsa promesa","back":"Universalizada, la máxima de prometer en falso se autodestruye: nadie creería promesa alguna. La contradicción al universalizar revela la inmoralidad de la máxima."},{"id":"et1-c37","tema":"Tema 3","front":"Estructura de la Fundamentación de la metafísica de las costumbres","back":"Cap. 1: del conocimiento moral común al filosófico (buena voluntad, deber). Cap. 2: metafísica de las costumbres (imperativos, fórmulas, autonomía). Cap. 3: crítica de la razón práctica (libertad)."},{"id":"et1-c38","tema":"Tema 3","front":"Ilustración según Kant","back":"Salida del hombre de su minoría de edad autoculpable. Sapere aude: atrévete a servirte de tu propio entendimiento sin la guía de otro."},{"id":"et1-c39","tema":"Tema 3","front":"Aristóteles vs Kant: la felicidad en la moral","back":"Aristóteles: la felicidad es el fin de la vida moral (eudemonismo teleológico). Kant: la moral no busca ser feliz sino ser digno de serlo (deontología)."},{"id":"et1-c40","tema":"Tema 4","front":"Super-yo (Freud)","back":"Instancia psíquica que interioriza las normas parentales y sociales tras el complejo de Edipo. Explica la conciencia moral, la culpa y el malestar en la cultura."},{"id":"et1-c41","tema":"Tema 4","front":"Niveles del desarrollo moral según Kohlberg","back":"Preconvencional (castigo e interés), convencional (expectativas del grupo, ley y orden) y posconvencional (contrato social y principios éticos universales). De la heteronomía a la autonomía."},{"id":"et1-c42","tema":"Tema 4","front":"Ética del cuidado (Gilligan)","back":"Crítica a Kohlberg: junto a la voz de la justicia y los principios abstractos existe la voz del cuidado, atenta a la responsabilidad hacia personas concretas."},{"id":"et1-c43","tema":"Tema 4","front":"Falacia genética","back":"Confundir el origen de una creencia o norma con su validez: explicar psicológica o sociológicamente la moral no la fundamenta ni la refuta."},{"id":"et1-c44","tema":"Tema 4","front":"Piaget: heteronomía y autonomía morales","back":"El niño pasa del respeto unilateral a la autoridad (moral heterónoma) a la cooperación entre iguales (moral autónoma), basada en reciprocidad y acuerdo."},{"id":"et1-c45","tema":"Tema 5","front":"Durkheim: la moral como hecho social","back":"Los hechos morales son hechos sociales: exteriores al individuo y coercitivos. La sociedad es fuente y autoridad de la moral; la anomia es ausencia patológica de normas."},{"id":"et1-c46","tema":"Tema 5","front":"Anomia","back":"Situación de falta o debilitamiento de normas sociales compartidas (Durkheim). Genera desorientación moral y patologías sociales, como cierto tipo de suicidio."},{"id":"et1-c47","tema":"Tema 5","front":"Neutralidad valorativa (Weber)","back":"La ciencia social debe distinguir hechos y valores y abstenerse de juicios de valor: explica lo que hay, pero no puede dictar qué debemos hacer."},{"id":"et1-c48","tema":"Tema 5","front":"Politeísmo de los valores (Weber)","back":"En la modernidad desencantada los valores últimos entran en conflicto irresoluble entre sí; elegir entre ellos es decisión personal que la ciencia no puede zanjar."},{"id":"et1-c49","tema":"Tema 6","front":"Relativismo cultural","back":"Tesis de que las normas morales solo valen dentro de cada cultura. La antropología constata diversidad (descriptivo); el salto al relativismo normativo es discutible."},{"id":"et1-c50","tema":"Tema 6","front":"Etnocentrismo","back":"Juzgar las demás culturas desde los patrones de la propia, tomada como superior o como medida universal. Vicio opuesto: relativismo indiscriminado que impide toda crítica."},{"id":"et1-c51","tema":"Tema 6","front":"Universalismo moral frente a relativismo","back":"Postura que defiende mínimos morales válidos transculturalmente (dignidad, derechos humanos), compatibles con el pluralismo de formas de vida y máximos de felicidad."},{"id":"et1-c52","tema":"Tema 7","front":"Maquiavelo y la autonomía de la política","back":"La política se rige por la eficacia y la conservación del poder, no por la moral: el príncipe debe poder no ser bueno según la necesidad. Razón de Estado."},{"id":"et1-c53","tema":"Tema 7","front":"Ética de la convicción vs ética de la responsabilidad (Weber)","back":"Convicción: obrar por principios sin atender a consecuencias. Responsabilidad: responder de las consecuencias previsibles de la acción; propia del político maduro."},{"id":"et1-c54","tema":"Tema 7","front":"Rawls: justicia como equidad","back":"Principios de justicia elegidos en la posición original tras el velo de ignorancia: iguales libertades básicas y desigualdades solo si benefician a los peor situados."},{"id":"et1-c55","tema":"Tema 7","front":"Ética discursiva (Apel y Habermas)","back":"Solo son válidas las normas que todos los afectados podrían aceptar como participantes en un diálogo racional en condiciones de simetría. Reformulación dialógica de Kant."},{"id":"et1-c56","tema":"Tema 8","front":"Dilema de Eutifrón","back":"¿Es bueno lo que Dios manda, o Dios lo manda porque es bueno? Si lo primero, la moral es arbitraria; si lo segundo, el bien no depende de la religión."},{"id":"et1-c57","tema":"Tema 8","front":"Relación moral-religión en Kant","back":"La moral es autónoma, no deriva de la religión; pero conduce a ella: la religión racional consiste en reconocer los deberes morales como mandatos divinos."},{"id":"et1-c58","tema":"Tema 8","front":"Crítica de la religión: Feuerbach y Marx","back":"Feuerbach: Dios es proyección de la esencia humana alienada. Marx: la religión es el opio del pueblo, consuelo ideológico que legitima la injusticia real."},{"id":"et1-c59","tema":"Tema 8","front":"Nietzsche: muerte de Dios y moral de esclavos","back":"La muerte de Dios exige transmutar todos los valores. La moral cristiana es moral de esclavos, nacida del resentimiento contra la vida y los fuertes."},{"id":"et1-c60","tema":"Tema 8","front":"Freud sobre la religión","back":"La religión es una ilusión: cumplimiento de deseos infantiles de protección paterna frente al desamparo; análoga a una neurosis obsesiva universal."},{"id":"et1-c61","tema":"Tema 8","front":"Horkheimer: el anhelo de justicia","back":"Anhelo de que el verdugo no triunfe sobre la víctima inocente: la religión mantiene abierta la esperanza de una justicia perfecta que la moral secular no garantiza."},{"id":"et1-c62","tema":"Tema 8","front":"Secularización","back":"Proceso moderno de emancipación de la vida social y la moral respecto de la tutela religiosa, que hace posible una ética laica y un espacio público pluralista."},{"id":"et1-c63","tema":"Lecturas obligatorias","front":"Lecturas obligatorias de Ética I","back":"Kant, Fundamentación de la metafísica de las costumbres (íntegra). Aristóteles, Ética a Nicómaco, libros I, II, III, VI y X. Manual: Gómez y Muguerza, La aventura de la moralidad."},{"id":"et1-c64","tema":"Tema 2","front":"Contenido de los libros obligatorios de la Ética a Nicómaco","back":"I: bien supremo y felicidad. II: virtud ética y término medio. III: voluntario, elección y virtudes concretas. VI: virtudes dianoéticas y prudencia. X: placer y vida contemplativa."},{"id":"et1-c65","tema":"Tema 3","front":"Nötigung (necesitación)","back":"Constricción que la ley objetiva ejerce sobre una voluntad no santa: por eso la ley moral se presenta al hombre como imperativo, mandato de deber."},{"id":"et1-c66","tema":"Tema 1","front":"Ética normativa vs ética aplicada","back":"Normativa: propone y fundamenta criterios generales del bien obrar (teorías éticas). Aplicada: lleva esos criterios a ámbitos concretos (bioética, ética profesional, ecológica)."},{"id":"et1-c67","tema":"Tema 2","front":"Papel de los bienes exteriores en la felicidad aristotélica","back":"La felicidad exige también bienes exteriores moderados (amigos, recursos, salud) y una vida completa: una golondrina no hace verano. La fortuna influye, pero la virtud es lo decisivo."},{"id":"et1-c68","tema":"Tema 3","front":"Tipos de imperativos según su necesidad","back":"Problemáticos (habilidad: fines posibles), asertóricos (prudencia: felicidad, fin real de todos) y apodícticos (categórico: moralidad, incondicionado). Solo el último es ley moral."}],"mcqs":[{"id":"et1-t001","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"card:et1-c01","enunciado":"¿Qué es la ética, frente a la moral?","opciones":["Reflexión filosófica de segundo orden sobre las morales","Conjunto de normas concretas que orientan la vida diaria","Código de valores compartido por un grupo social"],"correcta":0,"explicacion":"La moral es un saber de primer orden que orienta directamente la acción; la ética es filosofía moral: analiza, critica y fundamenta esas morales."},{"id":"et1-t002","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"card:et1-c02","enunciado":"¿De qué término griego procede la palabra 'ética'?","opciones":["De mos-moris: costumbre heredada de los mayores","De ethos: carácter, costumbre y morada","De nomos: ley establecida por la ciudad"],"correcta":1,"explicacion":"Ethos significa tanto carácter como costumbre-morada; mos-moris es el origen latino de 'moral'. Ambas etimologías remiten a hábitos y modo de ser."},{"id":"et1-t003","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"card:et1-c03","enunciado":"Para Aranguren, decir que el hombre es constitutivamente moral significa que...","opciones":["posee de nacimiento las normas correctas: moral como contenido","está determinado por la sociedad a obedecer sus códigos","no puede dejar de justificar sus actos: moral como estructura"],"correcta":2,"explicacion":"La moral como estructura es la necesidad ineludible de elegir y justificar los actos; los contenidos varían en cada moral concreta, e incluso el inmoral presupone la estructura."},{"id":"et1-t004","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"card:et1-c04","enunciado":"En Aranguren, ¿qué es la 'moral pensada'?","opciones":["La reflexión filosófica que examina y critica el ethos vivido","El conjunto de usos y costumbres efectivos de una sociedad","Las normas religiosas interiorizadas por cada creyente"],"correcta":0,"explicacion":"La moral vivida es el ethos efectivo de personas y sociedades; la moral pensada es la ética, que lo examina y critica."},{"id":"et1-t005","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"card:et1-c05","enunciado":"¿Qué estudia la metaética?","opciones":["Los criterios que deben regir el buen obrar de las personas","El significado de los términos morales y la lógica del razonamiento moral","Las costumbres morales efectivas de las distintas sociedades"],"correcta":1,"explicacion":"La metaética no prescribe normas: analiza el lenguaje moral ('bueno', 'deber'). Proponer criterios corresponde a la ética normativa."},{"id":"et1-t006","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"card:et1-c06","enunciado":"¿Cuáles son las funciones de la ética filosófica?","opciones":["Inventar nuevas morales y dar recetas para cada situación","Describir las normas vigentes sin valorarlas ni justificarlas","Aclarar lo moral, fundamentar las normas y aplicarlas a la vida"],"correcta":2,"explicacion":"La ética no inventa la moral ni da recetas: da razón (lógos) de la moral existente. Describir sin valorar es tarea de la sociología."},{"id":"et1-t007","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"card:et1-c07","enunciado":"¿Qué condición hace posible la moralidad de un acto?","opciones":["La libertad del agente y su imputabilidad","La aprobación mayoritaria del grupo social","Su conformidad con las leyes positivas vigentes"],"correcta":0,"explicacion":"Solo hay moralidad donde el agente puede elegir y responder de sus actos; las normas morales obligan en conciencia, a diferencia de leyes y usos."},{"id":"et1-t008","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c08","enunciado":"¿Qué es la eudaimonía aristotélica?","opciones":["Estado placentero y subjetivo de satisfacción momentánea","Vida lograda: actividad del alma conforme a la virtud","Recompensa divina otorgada tras una vida de sacrificios"],"correcta":1,"explicacion":"La felicidad es el fin último, perfecto y autosuficiente: no un estado pasajero, sino el florecimiento humano en una vida completa."},{"id":"et1-t009","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c09","enunciado":"Según el argumento del ergon, el bien humano consiste en...","opciones":["satisfacer los deseos naturales propios de cada individuo","cumplir la función que la ciudad asigna a cada uno","ejercer con excelencia la actividad racional del alma"],"correcta":2,"explicacion":"Como el flautista tiene su función propia, la del hombre es la vida activa de la parte racional, ejercida según su mejor virtud."},{"id":"et1-t010","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c10","enunciado":"¿Cómo define Aristóteles la virtud ética?","opciones":["Disposición adquirida por hábito, término medio fijado por la razón","Conocimiento innato del bien que basta para obrar bien","Pasión moderada que la naturaleza otorga a algunos hombres"],"correcta":0,"explicacion":"Es una héxis adquirida por repetición, consistente en un término medio relativo a nosotros, determinado como lo decidiría el prudente."},{"id":"et1-t011","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c11","enunciado":"En la doctrina del término medio, el valor es medio entre...","opciones":["avaricia y prodigalidad","cobardía y temeridad","modestia y arrogancia"],"correcta":1,"explicacion":"Cada virtud es medio entre un vicio por defecto y otro por exceso; avaricia y prodigalidad flanquean la generosidad. Respecto del bien, la virtud es un extremo."},{"id":"et1-t012","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c12","enunciado":"¿Cómo se adquieren las virtudes dianoéticas, según Aristóteles?","opciones":["Por hábito, como el valor y la templanza","Por naturaleza, desde el nacimiento del individuo","Por enseñanza, como la sabiduría y la prudencia"],"correcta":2,"explicacion":"Las dianoéticas o intelectuales se aprenden por instrucción (libro VI); las éticas, del carácter, se adquieren por hábito."},{"id":"et1-t013","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c13","enunciado":"¿Qué es la phrónesis aristotélica?","opciones":["Recta razón práctica que delibera sobre lo bueno para el hombre","Sabiduría teórica que contempla lo universal y necesario","Destreza técnica para producir bien objetos externos"],"correcta":0,"explicacion":"La prudencia versa sobre lo contingente y determina el término medio; su modelo es Pericles. La sophía es la sabiduría teórica; la téchne, la destreza productiva."},{"id":"et1-t014","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c14","enunciado":"En Aristóteles, ¿qué es una héxis?","opciones":["Pasión intensa que empuja al alma hacia el placer","Disposición estable del carácter adquirida por repetición de actos","Facultad natural común a todos los seres humanos"],"correcta":1,"explicacion":"La héxis es el género de la virtud: ni pasión ni facultad, sino modo firme de ser forjado por el hábito."},{"id":"et1-t015","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c15","enunciado":"¿Qué es la proaíresis o elección?","opciones":["Impulso espontáneo hacia lo placentero e inmediato","Opinión verdadera sobre lo universal y necesario","Deseo deliberado de lo que está a nuestro alcance"],"correcta":2,"explicacion":"Analizada en el libro III, la elección es condición del acto plenamente virtuoso y de la responsabilidad moral."},{"id":"et1-t016","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c16","enunciado":"Para Aristóteles, un acto es plenamente virtuoso cuando el agente...","opciones":["sabe lo que hace, lo elige por sí mismo y obra con firmeza","produce el resultado justo, sea cual sea su intención","sigue fielmente las instrucciones de un hombre prudente"],"correcta":0,"explicacion":"No basta hacer lo justo: hay que hacerlo como el justo, con saber, elección por sí mismo y disposición firme e inconmovible."},{"id":"et1-t017","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c17","enunciado":"¿Cómo llegamos a ser justos, según Aristóteles?","opciones":["Estudiando qué es la justicia hasta comprenderla del todo","Practicando la justicia, como se aprende a tocar la cítara","Recibiendo de la naturaleza el carácter justo ya formado"],"correcta":1,"explicacion":"La naturaleza da la capacidad; la práctica repetida da la virtud. El saber teórico no basta: crítica al intelectualismo socrático."},{"id":"et1-t018","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c18","enunciado":"Según Aristóteles, ¿para qué investigamos en ética?","opciones":["Para definir con exactitud matemática el concepto de bien","Para contemplar la idea del Bien separada de las cosas","Para ser buenos, no solo para saber qué es la virtud"],"correcta":2,"explicacion":"El fin de la ética es práctico, no teórico; refugiarse en la teoría sin practicar es estéril, como el enfermo que no cumple el tratamiento."},{"id":"et1-t019","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c19","enunciado":"En el libro X, la felicidad más alta es...","opciones":["la contemplación, actividad de lo más divino en nosotros","la vida política dedicada al honor y al bien común","el placer moderado acompañado de bienes exteriores"],"correcta":0,"explicacion":"La theoría es la actividad más continua, placentera y autosuficiente; la vida según las virtudes éticas es felicidad en segundo grado."},{"id":"et1-t020","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c20","enunciado":"¿Qué distingue la praxis de la poíesis?","opciones":["La praxis produce objetos externos; la poíesis es acción interior","La praxis tiene su fin en el propio obrar; la poíesis, en la obra","La praxis se rige por la téchne; la poíesis, por la prudencia"],"correcta":1,"explicacion":"La poíesis (producción) se rige por la téchne y su fin es la obra externa; la praxis (acción) se rige por la phrónesis y su fin es el obrar bien mismo (eupraxía)."},{"id":"et1-t021","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c21","enunciado":"¿Qué es la akrasía?","opciones":["Ignorar qué es lo bueno y obrar mal sin culpa alguna","Elegir el mal con plena deliberación y carácter perverso","Saber qué es lo bueno y hacer lo contrario, vencido por la pasión"],"correcta":2,"explicacion":"La incontinencia o debilidad de la voluntad muestra, contra el intelectualismo socrático, que conocer el bien no basta para hacerlo."},{"id":"et1-t022","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c22","enunciado":"¿Cuál es el método de la ética aristotélica?","opciones":["Partir de las opiniones acreditadas y depurarlas dialécticamente","Deducir las normas desde principios exactos y necesarios","Observar experimentalmente la conducta de los ciudadanos"],"correcta":0,"explicacion":"Se parte de las éndoxa y se acepta solo la precisión que admite la materia práctica: en ética no cabe exactitud matemática."},{"id":"et1-t023","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c23","enunciado":"Para Aristóteles, la relación entre ética y política es que...","opciones":["la política es independiente de la moral y se rige por la eficacia","la ética es parte de la política, saber arquitectónico del bien común","la ética individual precede a la comunidad y no la necesita"],"correcta":1,"explicacion":"El hombre es animal político: la vida buena solo se realiza plenamente en la pólis. La autonomía de la política es tesis moderna de Maquiavelo."},{"id":"et1-t024","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c24","enunciado":"Para Kant, ¿qué es lo único bueno sin restricción?","opciones":["La felicidad, fin natural de todo ser racional","La inteligencia unida al valor y la perseverancia","La buena voluntad, que vale por su puro querer"],"correcta":2,"explicacion":"Talentos, temperamento y dones de fortuna son buenos solo condicionadamente; la buena voluntad brillaría como una joya aunque nada lograse."},{"id":"et1-t025","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c25","enunciado":"El comerciante honrado por interés propio obra, según Kant...","opciones":["conforme al deber, pero sin valor moral","por deber, y por eso con pleno valor moral","contra el deber, pues busca su beneficio"],"correcta":0,"explicacion":"Su acción coincide externamente con el deber (legalidad), pero el móvil es el interés: solo la acción hecha por deber tiene valor moral."},{"id":"et1-t026","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c26","enunciado":"¿Cómo define Kant el deber?","opciones":["Obligación impuesta por la autoridad legítima del Estado","Necesidad de una acción por respeto a la ley","Inclinación natural a procurar el bien de los demás"],"correcta":1,"explicacion":"El respeto es el único sentimiento moral: lo produce la razón misma, no lo recibimos de la sensibilidad."},{"id":"et1-t027","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c27","enunciado":"En Kant, una máxima es...","opciones":["el principio objetivo válido para toda voluntad racional","el mandato condicionado que ordena medios para fines","el principio subjetivo por el que de hecho obro"],"correcta":2,"explicacion":"La ley práctica es el principio objetivo; la moral exige que mis máximas puedan valer al mismo tiempo como ley universal."},{"id":"et1-t028","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c28","enunciado":"¿Qué manda un imperativo hipotético?","opciones":["Una acción como medio para un fin que se quiere","Una acción buena en sí, sin referencia a otro fin","Una máxima universalizable para todo ser racional"],"correcta":0,"explicacion":"Es condicionado: de habilidad (fines posibles) o de prudencia (la felicidad). El categórico, en cambio, manda incondicionadamente."},{"id":"et1-t029","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c29","enunciado":"¿Cuál es la fórmula kantiana de la ley universal?","opciones":["Obra buscando la mayor felicidad para el mayor número","Obra según una máxima que puedas querer como ley universal","Obra como obraría el hombre prudente en tu situación"],"correcta":1,"explicacion":"El imperativo cat
