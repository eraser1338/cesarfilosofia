enes; Pitágoras y el pitagorismo; Heráclito; Escuela de Elea: Jenófanes, Parménides, Zenón; pluralistas: Empédocles y Anaxágoras; atomistas: Demócrito y Leucipo)","Tema II: Período socrático: la sofística, Sócrates y la herencia socrática (escuelas socráticas menores: Elis-Eretria, Megara, cínicos, Cirene)","Tema III: Platón: hacia la salvación del alma. Filosofía y dialéctica (vida y diálogos; camino de la ciencia; el Ser y el mundo de las Ideas; teología y el Bien; autocrítica en Parménides, Sofista y Político; Demiurgo y Timeo; ética y política)","Tema IV: Aristóteles: del concepto a la acción. Filosofía y hermenéutica (Corpus y transmisión; lógica; filosofía primera; física y astronomía; biología; antropología: alma y noûs; teología; política; poética; retórica). NOTA: las Éticas no entran en el programa"],"preguntas":[{"id":"fa1-p01","tipo":"desarrollo","enunciado":"Un tema libre para escoger de entre los contenidos del programa de la asignatura ('pregunta autoformulada'), teniendo en cuenta las indicaciones del equipo docente en la plataforma (aLF/Ágora)","variantes":[],"apariciones":["2022 Feb-1","2022 Feb-2","2022 Sep","2023 Feb-1","2023 Feb-2","2023 Sep","2024 Feb-1","2024 Feb-2","2024 Sep","2025 Feb-1","2025 Feb-2","2025 Sep","2026 Feb-1","2026 Feb-2"],"frecuencia":14,"tema":"Todos los bloques (a elección del estudiante)","bullets":[{"b":"Prepara de antemano un tema cerrado del programa, con guion memorizado y extensión calculada para unos 55-60 minutos.","x":"Es la mitad fija del examen: aparece en todas las convocatorias. No se permite ningún material, así que el desarrollo debe estar íntegramente memorizado y ensayado por escrito con tiempo cronometrado."},{"b":"Regla clave: no puede pertenecer al mismo bloque que la pregunta elegida en la parte 1; prepara temas de dos bloques distintos.","x":"Como no sabes qué tres opciones saldrán en la parte 1, lo seguro es llevar dos autoformuladas de bloques diferentes (p. ej., una de presocráticos y otra de Aristóteles) y decidir en el momento."},{"b":"Elige un título preciso y filosófico que plantee un problema, no una etiqueta vaga (p. ej., 'El ser en Parménides y su herencia').","x":"El equipo docente valora abordar la historia de la filosofía de manera filosófica y no meramente filológica: el título debe anunciar un problema, sus interlocutores y una tesis."},{"b":"Estructura recomendada: planteamiento del problema, contexto e interlocutores agonísticos, desarrollo con conceptos griegos precisos, conclusión crítica.","x":"Usar con propiedad los términos griegos (arché, lógos, ousía, eîdos...) y señalar con quién dialoga o disiente cada filósofo es criterio explícito de evaluación."},{"b":"Para profundizar se recomienda apoyarse en un libro de Oñate: 'El nacimiento de la filosofía en Grecia' o 'Para leer la Metafísica'.","x":"La guía indica expresamente que la autoformulada puede prepararse ampliando con uno de esos dos libros, aplicables a Platón, a Aristóteles y a su estudio comparado."},{"b":"Escribe con claridad, coherencia y corrección ortográfica y sintáctica: también se califica la expresión escrita."}]},{"id":"fa1-p02","tipo":"desarrollo","enunciado":"Platón: Ética y política","variantes":["Platón: Política","Platón: Ética"],"apariciones":["2022 Feb-1","2022 Feb-2","2023 Feb-1","2024 Feb-1","2024 Feb-2","2024 Sep","2026 Feb-2"],"frecuencia":7,"tema":"Tema III: Platón","bullets":[{"b":"Ética intelectualista heredada de Sócrates: la virtud es conocimiento del Bien; el mal nace de la ignorancia; salvación del alma.","x":"Nadie obra mal a sabiendas. La vida buena exige el cuidado del alma (epiméleia tês psychês) y su purificación mediante el saber, en clave órfico-pitagórica: el cuerpo como cárcel del alma."},{"b":"Alma tripartita (Fedro, República IV): racional, irascible, concupiscible; símil del carro alado; cada parte tiene su virtud.","x":"A la parte racional corresponde la prudencia o sabiduría (phrónesis/sophía), a la irascible el valor (andreía), a la concupiscible la templanza (sophrosýne)."},{"b":"La justicia (dikaiosýne) es armonía: cada parte del alma y cada clase de la ciudad hace lo suyo propio.","x":"Es la tesis central de la República: la justicia no es convención ni interés del fuerte (contra Trasímaco), sino el orden interno que hace feliz al justo."},{"b":"Paralelismo alma-ciudad: tres clases (gobernantes-filósofos, guardianes, productores); la educación (paideía) selecciona y forma a los mejores.","x":"La ciudad es el alma 'en grandes letras'. La educación culmina en la dialéctica y el conocimiento del Bien; para los guardianes, comunidad de bienes y de familia, e igualdad de las mujeres."},{"b":"Tesis del filósofo-rey: no cesarán los males hasta que los filósofos gobiernen o los gobernantes filosofen (República V).","x":"Solo quien conoce la Idea del Bien puede ordenar la ciudad según ese modelo. Los tres intentos fracasados en Siracusa (Carta VII) muestran el empeño práctico-político de Platón."},{"b":"Degeneración de los regímenes (República VIII-IX): aristocracia, timocracia, oligarquía, democracia, tiranía; el tirano, alma más esclava e infeliz.","x":"Cada régimen corresponde a un tipo de alma dominante. La crítica a la democracia refleja la condena de Sócrates por la Atenas restaurada."},{"b":"Evolución final: en el Político, la ciencia regia; en las Leyes, el 'segundo mejor' Estado, gobierno de la ley, no de hombres."}]},{"id":"fa1-p03","tipo":"desarrollo","enunciado":"La Escuela de Elea: Jenófanes, Parménides, Zenón y Meliso","variantes":["Escuela de Elea: Jenófanes, Parménides y Zenón"],"apariciones":["2022 Sep","2023 Feb-1","2024 Sep","2025 Feb-1","2026 Feb-2"],"frecuencia":5,"tema":"Tema I: Presocráticos","bullets":[{"b":"Jenófanes de Colofón: crítica racional del antropomorfismo de Homero y Hesíodo; un dios supremo, no antropomórfico, que todo lo mueve con su mente.","x":"Si los bueyes pudieran pintar, pintarían dioses con forma de buey. Jaeger lo lee como 'teología' racional de los primeros filósofos: purificación de lo divino, no ateísmo."},{"b":"Parménides: poema 'Sobre la naturaleza'; la diosa revela dos vías: la de la verdad (alétheia) y la de la opinión (dóxa).","x":"El proemio (viaje del koûros hacia la luz) conserva forma religiosa-iniciática, pero el contenido es pura argumentación deductiva: primer gran texto de la ontología occidental."},{"b":"Tesis central: 'el ser es y no puede no ser; el no-ser no es'; pensar y ser son lo mismo (noeîn-eînai).","x":"Solo puede pensarse y decirse lo que es; el no-ser es impensable e indecible. Con ello el lógos se independiza de los sentidos y funda el principio de no contradicción avant la lettre."},{"b":"Signos (sémata) del ser: ingénito, imperecedero, uno, continuo, homogéneo, inmóvil, completo y limitado como esfera perfecta.","x":"Del 'es' se deducen sus caracteres: no puede nacer (¿de qué no-ser?), ni perecer, ni moverse ni dividirse. El límite (péras) es aquí perfección, no defecto."},{"b":"Consecuencia: el devenir y la pluralidad sensibles quedan como dóxa; todos los físicos posteriores deben responder a Parménides.","x":"Pluralistas y atomistas aceptan que nada nace del no-ser, pero salvan los fenómenos multiplicando los principios eternos. Platón lo llamará 'padre' y cometerá contra él su 'parricidio' en el Sofista."},{"b":"Zenón de Elea: defensa indirecta del maestro; aporías contra el movimiento y la pluralidad (Aquiles, dicotomía, flecha, estadio).","x":"Método de reducción al absurdo: si hay pluralidad y movimiento se siguen consecuencias contradictorias. Aristóteles lo considera inventor de la dialéctica."},{"b":"Meliso de Samos: reformula el ser parmenídeo como ilimitado (ápeiron), eterno en el tiempo e incorpóreo.","x":"Frente a la esfera limitada de Parménides, Meliso sostiene que el ser no puede tener límites, pues limitaría con el no-ser. Aristóteles lo critica con dureza."}]},{"id":"fa1-p04","tipo":"desarrollo","enunciado":"Los filósofos pluralistas: Empédocles y Anaxágoras. Demócrito y Leucipo","variantes":[],"apariciones":["2022 Feb-1","2023 Feb-2","2024 Feb-2","2025 Feb-2"],"frecuencia":4,"tema":"Tema I: Presocráticos","bullets":[{"b":"Contexto común: responden a Parménides; nada nace del no-ser ni perece, pero varios principios eternos se mezclan y separan.","x":"Aceptan la prohibición eleática (ningún surgir absoluto) y salvan a la vez los fenómenos: el 'nacimiento' es mezcla y la 'muerte' separación de elementos eternos."},{"b":"Empédocles de Agrigento: cuatro raíces (fuego, aire, agua, tierra) combinadas por Amor (Philía) y separadas por Odio (Neîkos).","x":"El cosmos es un ciclo eterno entre el Esfero (unidad total bajo el Amor) y la dispersión bajo el Odio. Escribió 'Sobre la naturaleza' y las 'Purificaciones', de tono órfico."},{"b":"En Empédocles conviven física y religión: transmigración del alma (daímon caído) y purificación; teoría de la percepción por efluvios.","x":"Lo semejante conoce lo semejante. Su figura de mago-médico-poeta muestra que el primer pensamiento griego no separa ciencia y salvación."},{"b":"Anaxágoras de Clazómenas: 'en todo hay parte de todo'; infinitas semillas (spérmata) u homeomerías; nada surge de la nada.","x":"Cada cosa se denomina por lo que predomina en ella. Llevó la filosofía a Atenas y fue procesado por impiedad al afirmar que el sol es una piedra incandescente."},{"b":"El Noûs anaxagóreo: inteligencia infinita, pura y separada que inicia el remolino cósmico y ordena la mezcla originaria.","x":"Primera causa inteligente de la filosofía griega. Pero Sócrates, en el Fedón, y Aristóteles le reprochan usar el Noûs solo como mecanismo, sin explicación teleológica: 'deus ex machina'."},{"b":"Atomismo de Leucipo y Demócrito: átomos (ser) infinitos, indivisibles, eternos, que se mueven en el vacío (no-ser que 'es').","x":"Audacia ontológica: conceden realidad al vacío para hacer posible el movimiento. Los átomos difieren solo por figura, orden y posición; los mundos son infinitos."},{"b":"Demócrito: mecanicismo y necesidad (anánke); cualidades sensibles por convención; conocimiento 'oscuro' (sentidos) frente a 'legítimo' (razón); ética de la eutimía.","x":"'Por convención el color, por convención lo dulce...; en realidad, átomos y vacío'. Su ética del buen ánimo y la mesura anticipa los ideales helenísticos de serenidad."}]},{"id":"fa1-p05","tipo":"desarrollo","enunciado":"Aristóteles: Física","variantes":["Aristóteles: Física y biología"],"apariciones":["2022 Feb-1","2023 Feb-2","2024 Feb-1","2026 Feb-1"],"frecuencia":4,"tema":"Tema IV: Aristóteles","bullets":[{"b":"La física es 'filosofía segunda': ciencia teórica del ser en movimiento; la physis es principio interno de movimiento y reposo.","x":"Frente al artefacto, cuyo principio de cambio es externo (el artesano), el ser natural lleva en sí mismo su principio de movimiento. La física estudia el ente móvil en cuanto tal."},{"b":"Solución al problema eleático del cambio: distinción entre acto (enérgeia) y potencia (dýnamis); el ser se dice de muchas maneras.","x":"El cambio no es paso del no-ser al ser (imposible según Parménides), sino de ser-en-potencia a ser-en-acto. Así se salva la realidad del devenir sin violar el principio de no contradicción."},{"b":"Definición de movimiento: 'acto de lo que está en potencia en cuanto que está en potencia' (Física III).","x":"El movimiento es un acto imperfecto o inacabado: la actualización misma de la potencia mientras dura el proceso. Definición célebre por su rigor y su dificultad."},{"b":"Hilemorfismo: todo ser natural es compuesto de materia (hýle) y forma (morphé/eîdos); el cambio requiere además la privación (stéresis).","x":"En el cambio sustancial la materia prima permanece como sustrato; en el accidental permanece la sustancia. Tres principios del devenir: sustrato, forma y privación."},{"b":"Las cuatro causas: material, formal, eficiente y final; la naturaleza obra teleológicamente, 'no hace nada en vano'.","x":"Conocer científicamente es conocer por causas. La causa final es la principal en la naturaleza: crítica al mecanicismo de Empédocles y Demócrito."},{"b":"Análisis del continuo: lugar (límite del cuerpo envolvente), tiempo ('número del movimiento según lo anterior y lo posterior'), rechazo del vacío y del infinito en acto.","x":"Contra los atomistas niega el vacío; el infinito existe solo en potencia (divisibilidad, sucesión numérica). Con el continuo responde a las aporías de Zenón."},{"b":"Física celeste: cosmos finito, eterno, geocéntrico; el éter y el movimiento circular de los cielos remiten al Primer Motor inmóvil.","x":"La cadena de motores movidos no puede ser infinita: la física desemboca (Física VIII) en un primer principio inmóvil, puente hacia la filosofía primera."}]},{"id":"fa1-p06","tipo":"desarrollo","enunciado":"Sócrates y los sofistas. El método socrático. Las doctrinas de Sócrates","variantes":["Sócrates: método, fuentes, doctrinas socráticas"],"apariciones":["2023 Feb-2","2025 Feb-2","2026 Feb-2"],"frecuencia":3,"tema":"Tema II: Período socrático","bullets":[{"b":"Problema de las fuentes: Sócrates no escribió; lo conocemos por Platón, Jenofonte, Aristófanes (caricatura en 'Las Nubes') y Aristóteles.","x":"La 'cuestión socrática' obliga a contrastar testimonios: el Sócrates platónico de los primeros diálogos (Apología) se considera el más fiable filosóficamente; Aristófanes lo confunde interesadamente con los sofistas."},{"b":"Frente a los sofistas: no cobra, no enseña doctrinas, dialoga en busca de definiciones universales y verdad, no de persuasión.","x":"Comparte con ellos el giro antropológico (el hombre y la polis, no la physis), pero rechaza el relativismo: si la justicia es solo convención, la vida moral y política se disuelve."},{"b":"Método: ironía ('solo sé que no sé nada'), refutación (élenchos) que purga el falso saber, y mayéutica que 'da a luz' la verdad.","x":"Como su madre partera, Sócrates no transmite contenidos: mediante preguntas hace que el interlocutor descubra y examine sus propias creencias. La dialéctica es examen público del lógos."},{"b":"Aristóteles le atribuye dos aportes: los razonamientos inductivos y la definición universal en el ámbito moral (Metafísica XIII).","x":"Preguntas del tipo '¿qué es la virtud?', '¿qué es la justicia?' buscan la esencia (tí esti), germen de la teoría platónica de las Ideas."},{"b":"Intelectualismo moral: la virtud es conocimiento y puede enseñarse; nadie obra mal a sabiendas; el vicio es ignorancia.","x":"De ahí la unidad de las virtudes y la paradoja socrática: es peor cometer injusticia que padecerla. La tarea central es el cuidado del alma (epiméleia tês psychês)."},{"b":"'Una vida sin examen no merece ser vivida': misión divina avalada por el oráculo de Delfos y el daimon interior.","x":"El daimonion es una voz que solo disuade. La obediencia a esta vocación filosófica está por encima del miedo a la muerte, como muestra la Apología."},{"b":"Juicio y muerte (399 a.C.): acusado por Ánito, Meleto y Licón de impiedad y corromper a los jóvenes; fidelidad a las leyes (Critón) y muerte ejemplar (Fedón).","x":"Su condena por la democracia restaurada convierte a Sócrates en el 'hombre más justo de Atenas' y en el acontecimiento fundador de la filosofía platónica."}]},{"id":"fa1-p07","tipo":"desarrollo","enunciado":"Aristóteles: Biología y antropología","variantes":[],"apariciones":["2022 Sep","2023 Feb-1","2024 Sep"],"frecuencia":3,"tema":"Tema IV: Aristóteles","bullets":[{"b":"La biología ocupa gran parte del Corpus (Historia de los animales, Partes, Generación): observación empírica y clasificación de los vivientes.","x":"Aristóteles, hijo de médico, funda la zoología. 'En todas las cosas naturales hay algo maravilloso': dignifica el estudio de los animales frente al desprecio platónico de lo sensible."},{"b":"La vida se explica por el alma (psyché): forma, acto y 'entelécheia primera de un cuerpo natural que tiene la vida en potencia'.","x":"De Anima aplica el hilemorfismo al viviente: el alma no es una sustancia separada (contra el dualismo platónico) sino el principio de organización y actividad del cuerpo; alma y cuerpo son uno como la cera y su figura."},{"b":"Escala de almas: vegetativa (nutrición, reproducción), sensitiva (sensación, deseo, movimiento) e intelectiva; cada nivel integra el anterior.","x":"Plantas, animales y hombre forman una jerarquía continua de funciones vitales (scala naturae). El hombre posee las tres dimensiones."},{"b":"Teoría del conocimiento sensible: la sensación recibe la forma sin la materia; sentido común, imaginación (phantasía) y memoria median hacia el pensar.","x":"Como la cera recibe la figura del sello sin el hierro. 'Nada hay en el intelecto que no haya estado antes en los sentidos': empirismo moderado frente a la anámnesis platónica."},{"b":"El noûs: distinción entre intelecto paciente y agente; el agente es 'separado, impasible, inmortal y eterno' (De Anima III, 5).","x":"El intelecto agente actualiza los inteligibles como la luz los colores. Pasaje de enorme disputa hermenéutica: ¿es lo divino en el hombre, una función del alma o un principio trascendente? Base de las querellas entre comentaristas griegos, árabes y latinos."},{"b":"Antropología: el hombre es el animal que tiene lógos, racional y político; la contemplación (theoría) es su actividad más alta y divina."}]},{"id":"fa1-p08","tipo":"desarrollo","enunciado":"Aristóteles: Política","variantes":[],"apariciones":["2023 Sep","2025 Feb-2","2025 Sep"],"frecuencia":3,"tema":"Tema IV: Aristóteles","bullets":[{"b":"Tesis central: el hombre es por naturaleza animal político (zôon politikón); quien vive fuera de la polis es 'bestia o dios'.","x":"El lógos, que distingue lo justo de lo injusto y lo conveniente de lo dañino, hace al hombre comunitario por esencia, más que cualquier animal gregario. La política no es artificio ni contrato: es naturaleza."},{"b":"Génesis natural de la polis: familia, aldea, ciudad; la polis es anterior por naturaleza al individuo y autosuficiente (autárkeia).","x":"Surge para vivir, pero existe para vivir bien (eû zên). El todo es anterior a la parte: fuera de la comunidad el individuo no realiza su fin."},{"b":"Crítica al comunismo de la República platónica: defensa de la propiedad privada de uso común y de la familia (Política II).","x":"La excesiva unidad destruye la polis, que es por naturaleza una pluralidad; lo común de todos es lo menos cuidado. Método aristotélico: partir de las constituciones reales (recopiló 158)."},{"b":"Clasificación de constituciones: rectas (monarquía, aristocracia, politeia) y desviadas (tiranía, oligarquía, democracia); criterio: gobernar para el bien común.","x":"Cruza el número de gobernantes (uno, pocos, muchos) con el fin (común o particular). La 'democracia' aristotélica es la desviación que gobierna para el interés exclusivo de los pobres."},{"b":"Régimen preferible en la práctica: la politeia, mezcla de oligarquía y democracia sustentada en una amplia clase media.","x":"La clase media asegura estabilidad y virtud del término medio; los extremos de riqueza y pobreza engendran facción (stásis) y revoluciones, que Aristóteles analiza en Política V."},{"b":"Ciudadano es quien participa en las funciones judicial y deliberativa; la política, ciencia práctica y arquitectónica; educación pública conforme al régimen."}]},{"id":"fa1-p09","tipo":"desarrollo","enunciado":"Escuela de Mileto: Tales, Anaximandro, Anaxímenes","variantes":[],"apariciones":["2024 Feb-1","2026 Feb-1"],"frecuencia":2,"tema":"Tema I: Presocráticos","bullets":[{"b":"Mileto, Jonia, s. VI a.C.: ciudad comercial y abierta donde nace la filosofía como pregunta racional por la physis y su arché.","x":"Frente a las cosmogonías míticas (Homero, Hesíodo), los milesios buscan un principio natural, único y permanente de todas las cosas, ofreciendo razones públicas y discutibles: crítica y lógos frente a autoridad dogmática."},{"b":"Arché: principio del que todo procede, del que todo está constituido y al que todo retorna; origen, sustrato y gobierno de lo real.","x":"El término lo consagra Aristóteles al reconstruir a sus predecesores como 'físicos' que buscaron causas materiales; hay que leer esa reconstrucción con cautela hermenéutica."},{"b":"Tales: el agua como arché; 'todo está lleno de dioses'; predijo el eclipse de 585 a.C.; primero de los Siete Sabios.","x":"El agua, condición de toda vida, explica la unidad de lo real. Su saber matemático y astronómico (y la anécdota del pozo, o la de los molinos de aceite) lo convierten en figura inaugural del sabio."},{"b":"Anaximandro: el ápeiron, lo indeterminado e ilimitado, inmortal e indestructible, como arché; primer fragmento conservado de la filosofía.","x":"Ningún elemento determinado puede ser principio de sus contrarios. El fragmento dice que las cosas 'se pagan mutuamente pena y retribución por su injusticia según el orden del tiempo': el devenir pensado como justicia cósmica."},{"b":"Audacia cosmológica de Anaximandro: la tierra en equilibrio en el centro sin apoyo; mundos innumerables; origen de los vivientes desde lo húmedo.","x":"Explicación por simetría y razón suficiente, sin soporte mítico: hito del pensamiento racional. Se le atribuye también el primer mapa."},{"b":"Anaxímenes: el aire como arché; la condensación y rarefacción explican cuantitativamente las transformaciones cualitativas.","x":"El aire, divino e ilimitado como el ápeiron pero determinado como el agua de Tales, se hace fuego al rarificarse y viento, nube, agua, tierra y piedra al condensarse. Analogía alma-aliento: 'como nuestra alma, que es aire, nos mantiene unidos, así el soplo envuelve el cosmos'."},{"b":"Rasgos comunes: monismo dinámico e hilozoísmo; la physis es viva y divina; ciencia y teología racional aún no separadas.","x":"Jaeger subraya que estos 'físicos' son también teólogos: lo divino se desplaza del Olimpo antropomórfico al principio inmortal que todo lo gobierna."}]},{"id":"fa1-p10","tipo":"desarrollo","enunciado":"La Filosofía en la Magna Grecia: Pitágoras","variantes":[],"apariciones":["2023 Sep","2025 Sep"],"frecuencia":2,"tema":"Tema I: Presocráticos","bullets":[{"b":"Pitágoras de Samos emigra a Crotona (Magna Grecia): funda una comunidad a la vez religiosa, filosófica, científica y política.","x":"El pitagorismo es un modo de vida (bíos) con reglas, secreto y jerarquía: acusmáticos (oyentes de máximas) y matemáticos (iniciados en la doctrina). Su influencia política provocó revueltas y la dispersión de la escuela."},{"b":"Doctrina del alma: inmortal, de origen divino, encarcelada en el cuerpo (sôma-sêma); transmigración (metempsícosis) y purificación (kátharsis).","x":"De raíz órfica. La novedad pitagórica es que la purificación suprema se logra mediante el saber: la filosofía como forma de salvación, herencia decisiva para Platón (Fedón)."},{"b":"El número como arché: las cosas 'son' números o imitan a los números; proporción, medida y armonía constituyen lo real.","x":"El descubrimiento de las razones numéricas de los intervalos musicales (octava 2:1, quinta 3:2, cuarta 4:3) revela que la estructura de lo real es matemática: primera matematización de la naturaleza."},{"b":"Dualidad de principios: límite (péras) e ilimitado (ápeiron), impar y par; tabla pitagórica de los diez pares de opuestos.","x":"El cosmos surge de la armonización de opuestos. La tetraktýs (1+2+3+4=10), figura sagrada por la que juraban, condensa la generación del número y del cosmos."},{"b":"Cosmología: primeros en llamar 'kósmos' (orden bello) al universo; armonía de las esferas; en Filolao, la tierra gira en torno al Fuego central.","x":"Los astros producen al moverse una música inaudible por habitual. El sistema no geocéntrico de Filolao anticipa audazmente el descentramiento de la tierra."},{"b":"Crisis de los inconmensurables: el descubrimiento de magnitudes irracionales (diagonal del cuadrado, √2) quiebra el dogma de que todo es número entero o razón.","x":"La leyenda atribuye a Hipaso su divulgación y castigo. La crisis obliga a repensar la relación entre aritmética y geometría."},{"b":"Herencia inmensa: matematización del saber, inmortalidad del alma y vida teorética pasan a Platón (Ideas-números, Timeo) y a la ciencia occidental."}]},{"id":"fa1-p11","tipo":"desarrollo","enunciado":"La sofística: causas, caracteres, méritos y representantes","variantes":["La sofística"],"apariciones":["2022 Feb-2","2025 Feb-1"],"frecuencia":2,"tema":"Tema II: Período socrático","bullets":[{"b":"Causas: democracia ateniense tras las Guerras Médicas; la palabra pública decide en asamblea y tribunales; demanda de educación política.","x":"El éxito cívico exige dominar la retórica. Se suma el escepticismo ante las cosmologías contradictorias de los físicos y el conocimiento de otras culturas, que relativiza las costumbres propias."},{"b":"Caracteres: maestros itinerantes que cobran por enseñar la areté política; giro antropológico: del cosmos al hombre, la ciudad y el lenguaje.","x":"Profesionales de la paideía, hacen de la educación una técnica transmisible. La 'ilustración griega': examen crítico de tradición, religión y ley."},{"b":"Tesis de fondo: relativismo y convencionalismo; oposición nómos (ley, convención) / physis (naturaleza); escepticismo sobre la verdad única.","x":"Las leyes y valores no son por naturaleza sino por acuerdo humano, y varían según ciudades: puede enseñarse a defender ambos lados de una causa (discursos dobles)."},{"b":"Protágoras de Abdera: 'el hombre es la medida de todas las cosas' (homo mensura); agnosticismo sobre los dioses.","x":"Cada cosa es para cada cual como le aparece: relativismo que Platón discute en el Teeteto. Sobre los dioses, no puede saberse si existen: la vida es breve y el asunto oscuro."},{"b":"Gorgias de Leontinos: tres tesis del 'Sobre el no-ser' (nada es; si algo fuera, sería incognoscible; si se conociera, sería incomunicable); la retórica como poder del lógos.","x":"Antítesis nihilista de Parménides. En el 'Encomio de Helena' el discurso es 'gran soberano' que persuade y arrastra como un fármaco: descubrimiento del poder autónomo del lenguaje."},{"b":"Otros representantes: Trasímaco (la justicia, lo que conviene al más fuerte), Hipias (polimatía, physis contra nómos), Pródico (sinonimia), Calicles y Antifonte.","x":"En República I y en el Gorgias, Platón dramatiza las tesis del derecho del más fuerte como consecuencia extrema del convencionalismo sofístico."},{"b":"Méritos y crítica: fundan la centralidad del lenguaje, la gramática, la retórica y la educación humanista; Platón les reprocha vender apariencia de saber.","x":"La condena platónica ('cazadores de jóvenes ricos', mercaderes de alimentos del alma) fijó el sentido peyorativo de 'sofista'; la investigación actual (y Hegel, Grote) los rehabilita como ilustrados griegos."}]},{"id":"fa1-p12","tipo":"desarrollo","enunciado":"Platón: el Ser. El mundo de las Ideas","variantes":[],"apariciones":["2023 Sep","2025 Sep"],"frecuencia":2,"tema":"Tema III: Platón","bullets":[{"b":"Dos ámbitos de realidad: mundo inteligible de las Ideas (eterno, inmutable, en sí) y mundo sensible (devenir, copias); síntesis de Parménides y Heráclito.","x":"Al ser pleno de las Ideas corresponde la ciencia (epistéme); al devenir sensible, la opinión (dóxa). Platón salva así la posibilidad del conocimiento universal exigida por las definiciones socráticas."},{"b":"La Idea (eîdos) es esencia, unidad de lo múltiple, modelo (parádeigma), causa y fundamento ontológico de las cosas sensibles.","x":"No es un concepto mental sino la realidad misma en su máximo grado: lo Bello en sí, lo Justo en sí. Las cosas son lo que son por relación a su Idea."},{"b":"Relación entre los dos mundos: participación (méthexis), imitación (mímesis) y presencia (parousía) de las Ideas en las cosas.","x":"El sensible 'aspira' a su modelo sin alcanzarlo nunca (los iguales del Fedón). La dificultad de pensar esta relación alimenta la autocrítica platónica."},{"b":"Jerarquía del mundo inteligible: la Idea del Bien, 'más allá de la esencia' (epékeina tês ousías), sol del mundo inteligible (República VI).","x":"Como el sol da luz, vida y visibilidad, el Bien da ser y cognoscibilidad a las Ideas: principio ontológico y epistemológico supremo, fundamento también de la ética y la política."},{"b":"Autocrítica en el Parménides: aporías de la participación y argumento del 'tercer hombre'; revisión, no abandono, de la teoría.","x":"Si lo grande y las cosas grandes exigen una nueva Idea que los reúna, se abre un regreso al infinito. Los diálogos tardíos responden repensando la comunidad de las Ideas."},{"b":"Sofista: 'parricidio' de Parménides; el no-ser 'es' como diferencia (lo otro); los géneros supremos (ser, movimiento, reposo, mismo, otro) se comunican.","x":"La dialéctica deviene ciencia de la combinación (symploké) de las Ideas, que hace posible el discurso verdadero y falso: respuesta al desafío sofístico."},{"b":"Timeo: el Demiurgo, mirando las Ideas, ordena la chóra informe y engendra el cosmos, 'imagen móvil de la eternidad'.","x":"El mundo sensible queda dignificado como obra bella de una razón artesana: cosmología 'verosímil' que corona la ontología platónica con su cumbre estética."}]},{"id":"fa1-p13","tipo":"desarrollo","enunciado":"Aristóteles: Filosofía primera","variantes":[],"apariciones":["2022 Feb-2","2024 Feb-2"],"frecuencia":2,"tema":"Tema IV: Aristóteles","bullets":[{"b":"La 'ciencia buscada': ciencia del ser en cuanto ser y de sus atributos; a la vez ciencia de los primeros principios y de la sustancia suprasensible.","x":"El título 'Metafísica' es editorial (Andrónico de Rodas). La doble caracterización, ontológica y teológica, genera el problema clásico de la 'ontoteología', hoy discutido por las lecturas inmanentistas y pluralistas (cf. Oñate)."},{"b":"'El ser se dice de muchas maneras', pero en referencia a una unidad: estructura pròs hén hacia la ousía (entidad, sustancia).","x":"Como 'sano' se dice del clima, del síntoma y del cuerpo por referencia a la salud, todas las categorías (cantidad, cualidad, relación...) se dicen ser por referencia a la sustancia. Vía media entre univocidad parmenídea y pura equivocidad."},{"b":"Otros sentidos del ser: por sí y por accidente; según acto y potencia; como verdadero y falso.","x":"La filosofía modal del ente (acto/potencia) es la clave que unifica física y metafísica; la verdad tiene en Aristóteles tres sentidos: en las cosas, en el juicio (adecuación) y en la captación de los indivisibles (contacto del noûs)."},{"b":"Principio de no contradicción: el más firme de todos, indemostrable pero defendible elencticamente contra quien lo niegue (Metafísica IV).","x":"Basta que el adversario diga algo con significado para refutarlo: quien lo niega en serio queda reducido al silencio de la planta."},{"b":"Investigación de la ousía (Metafísica VII-IX): crítica a las Ideas separadas de Platón; ni el universal ni el sustrato indeterminado son sustancia; la sustancia primera es el eîdos como esencia y causa del compuesto.","x":"El eîdos-alma, forma inmanente, es causa primera del ser de cada compuesto e universal 'por ser primero', no por abstracción: los problemas 'esencia-universal' y 'esencia-individuo' están en el corazón de la Metafísica."},{"b":"Teología (Metafísica XII): sustancia eterna e inmóvil; el Primer Motor, acto puro sin materia, mueve como fin, 'como lo amado'.","x":"Su vida es la mejor: pensamiento que se piensa a sí mismo (nóesis noéseos). De él 'penden el cielo y la naturaleza'."},{"b":"Discusión hermenéutica actual: ¿un solo dios trascendente o pluralidad de motores y unidad solo focal? Lectura teológica frente a lectura inmanente pluralista.","x":"La guía de la asignatura subraya la 'crítica y reformulación de la lectura teológica' y la unidad de los principios: los 14 lógoi de la Metafísica como llave hermenéutica del Corpus."}]},{"id":"fa1-p14","tipo":"desarrollo","enunciado":"Escuelas socráticas menores","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema II: Período socrático","bullets":[{"b":"Tras la muerte de Sócrates (399 a.C.), varios discípulos fundan escuelas que radicalizan, cada una, un solo aspecto del maestro.","x":"Se llaman 'menores' frente a la Academia platónica. Todas combinan el legado socrático con influencias eleáticas o sofísticas, y preparan las grandes éticas helenísticas."},{"b":"Escuela de Megara (Euclides): fusiona a Sócrates con Elea; el Bien es Uno, con muchos nombres; dialéctica erística y paradojas.","x":"Solo el Ser-Bien es real. Sus lógicos (Eubúlides: el Mentiroso, el montón; Diodoro Crono: argumento dominador) hacen aportes decisivos a la lógica, luego recogidos por los estoicos."},{"b":"Escuela cínica (Antístenes; Diógenes de Sinope): la virtud basta para la felicidad; autarquía, ascesis y desvergüenza (anaídeia) contra las convenciones.","x":"Vivir 'conforme a la naturaleza' y 'falsificar la moneda' de los valores: cosmopolitismo ('soy ciudadano del mundo'), pobreza voluntaria y libertad de palabra (parresía). Antístenes niega además la predicación y las Ideas platónicas."},{"b":"Escuela cirenaica (Aristipo de Cirene): hedonismo; el placer presente, corporal y en movimiento, es el fin; sabiduría como dominio del placer.","x":"'Poseo, no soy poseído'. Solo conocemos nuestras afecciones (subjetivismo). Evolución interna: Teodoro el ateo, Hegesias ('persuasor de la muerte'), Anníceris."},{"b":"Escuelas de Elis (Fedón) y de Eretria (Menedemo): continúan la dialéctica ética socrática; escasa documentación.","x":"Fedón, el interlocutor del diálogo platónico sobre la inmortalidad del alma, fundó la escuela de Elis, después trasladada a Eretria por Menedemo."},{"b":"Proyección helenística: del cinismo nace el estoicismo (Zenón, discípulo de Crates); el hedonismo cirenaico prepara a Epicuro; Megara alimenta la lógica estoica."}]},{"id":"fa1-p15","tipo":"desarrollo","enunciado":"Platón: Hacia el Absoluto (el camino de la ciencia)","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema III: Platón","bullets":[{"b":"Pregunta rectora: cómo asciende el alma desde la opinión (dóxa) hasta la ciencia (epistéme) del Ser y del Bien: el camino de la ciencia.","x":"Junto al camino del amor (Banquete) y al del ascetismo purificador (Fedón), la vía cognoscitiva de la República conduce 'hacia el Absoluto': los tres caminos convergen en el mismo ascenso del alma."},{"b":"Símil de la línea (República VI): dos grados de dóxa (eikasía, pístis) y dos de epistéme (diánoia, nóesis), según sus objetos.","x":"A imágenes y cosas sensibles corresponden conjetura y creencia; a los entes matemáticos, el pensamiento discursivo que usa hipótesis y figuras; a las Ideas, la inteligencia pura."},{"b":"La dialéctica, ciencia suprema: asciende de hipótesis en hipótesis hasta el principio no hipotético, la Idea del Bien, y desciende sin apoyo sensible.","x":"Solo el dialéctico da razón (lógon didónai) de lo que sabe. Las matemáticas son propedéutica necesaria pero insuficiente: 'sueñan con el ser' porque no interrogan sus hipótesis."},{"b":"Alegoría de la caverna (República VII): la educación como liberación y conversión (periagogé) del alma entera desde las sombras hacia el sol-Bien.","x":"Síntesis dramática de ontología, epistemología, paideía y política: el liberado debe volver a la caverna a gobernar, aun con riesgo de muerte, alusión transparente a Sócrates."},{"b":"Conocer es recordar (anámnesis): el alma inmortal contempló las Ideas; el esclavo del Menón y los argumentos del Fedón.","x":"La reminiscencia explica el aprendizaje como reactivación de un saber latente mediante el interrogatorio: versión ontológica de la mayéutica socrática y prueba de la inmortalidad del alma."},{"b":"Culminación: el Bien, 'más allá de la esencia', principio del ser y del conocer; el saber supremo es a la vez fundamento ético-político."}]},{"id":"fa1-p16","tipo":"desarrollo","enunciado":"Aristóteles: Astronomía (astrología) y teología","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema IV: Aristóteles","bullets":[{"b":"Cosmos aristotélico: finito, único, eterno y geocéntrico; dos regiones: sublunar (cuatro elementos, generación y corrupción) y supralunar (éter incorruptible).","x":"En el cielo solo hay movimiento circular, perfecto y eterno, del quinto elemento (éter). La física terrestre y la celeste obedecen así a principios distintos, unificados por la doctrina del movimiento."},{"b":"Astronomía de esferas homocéntricas: asume y corrige a Eudoxo y Calipo; unas 47-55 esferas movidas por motores inmóviles (Metafísica XII, 8).","x":"Cada movimiento celeste eterno exige un motor inmóvil propio: de ahí el debate sobre la pluralidad de motores frente a la unicidad del Primero."},{"b":"Argumento teológico: la cadena de movimientos eternos exige un Primer Motor inmóvil, eterno, sin materia ni potencia: acto puro.","x":"Física VIII y Metafísica XII: si todo motor movido depende de otro, debe haber un primero no movido; el movimiento y el tiempo son eternos, luego su principio también."},{"b":"El Primer Motor mueve sin moverse, como causa final: 'mueve como lo amado' (hos erómenon); el cielo lo imita con su rotación eterna.","x":"No es creador ni eficiente al modo del Demiurgo platónico: el mundo es eterno y tiende hacia dios como hacia su fin y bien supremo."},{"b":"Vida divina: pensamiento que se piensa a sí mismo (nóesis noéseos); actividad contemplativa perfecta, felicísima y continua.","x":"Dios no puede pensar nada inferior a sí; su vida es la que nosotros solo alcanzamos por momentos en la theoría. 'De tal principio penden el cielo y la naturaleza'."},{"b":"Problema hermenéutico: ¿teología trascendente (lectura ontoteológica) o divinidad inmanente y plural de los principios? Debate actual sobre Metafísica XII.","x":"La lectura teologizante (tradición medieval) es discutida hoy por interpretaciones inmanentistas y pluralistas como la de Teresa Oñate, atenta a la unidad focal y a los límites del ser-acción."}]}],"cards":[{"id":"fa1-c01","tema":"Tema I","front":"¿Qué significa 'arché'?","back":"Principio originario: aquello de lo que todo procede, de lo que está constituido y a lo que retorna; origen, sustrato y gobierno de lo real. Término consagrado por Aristóteles."},{"id":"fa1-c02","tema":"Tema I","front":"¿Qué es la 'physis'?","back":"La naturaleza como brotar y desplegarse de lo real desde sí mismo; objeto de la pregunta de los primeros filósofos jonios ('Sobre la naturaleza')."},{"id":"fa1-c03","tema":"Tema I","front":"Arché de Tales","back":"El agua: condición de toda vida y unidad de lo real. Además: 'todo está lleno de dioses'; predijo el eclipse de 585 a.C."},{"id":"fa1-c04","tema":"Tema I","front":"El 'ápeiron' de Anaximandro","back":"Lo indeterminado-ilimitado, inmortal e indestructible, arché de todo: ningún elemento determinado puede originar sus contrarios. Suyo es el primer fragmento conservado (la 'injusticia' de las cosas)."},{"id":"fa1-c05","tema":"Tema I","front":"Arché y mecanismo de cambio en Anaxímenes","back":"El aire: por rarefacción se hace fuego; por condensación, viento, nube, agua, tierra y piedra. Primera explicación cuantitativa de las diferencias cualitativas."},{"id":"fa1-c06","tema":"Tema I","front":"¿Qué es el hilozoísmo milesio?","back":"La materia-physis es viva y divina por sí misma: no hay distinción entre materia inerte y fuerza vital. Rasgo común de los monistas jonios."},{"id":"fa1-c07","tema":"Tema I","front":"Arché pitagórico","back":"El número: las cosas son números o los imitan. Armonía, medida y proporción constituyen el cosmos, como muestran las razones numéricas de los intervalos musicales."},{"id":"fa1-c08","tema":"Tema I","front":"Metempsícosis","back":"Transmigración del alma inmortal por sucesivos cuerpos (doctrina órfico-pitagórica). El cuerpo es cárcel (sôma-sêma); la filosofía purifica (kátharsis) y libera."},{"id":"fa1-c09","tema":"Tema I","front":"Acusmáticos y matemáticos","back":"Dos grados de la comunidad pitagórica: oyentes que reciben máximas sin demostración, e iniciados que conocen las doctrinas y demostraciones."},{"id":"fa1-c10","tema":"Tema I","front":"La 'tetraktýs'","back":"Figura sagrada pitagórica: 1+2+3+4=10; condensa la generación del número y del cosmos. Por ella juraban los miembros de la comunidad."},{"id":"fa1-c11","tema":"Tema I","front":"El lógos de Heráclito","back":"Ley-razón común que gobierna el devenir: unidad de los opuestos en tensión ('pólemos, padre de todas las cosas'). Símbolo: el fuego, siempre vivo, que se enciende y apaga según medida."},{"id":"fa1-c12","tema":"Tema I","front":"¿Por qué Heráclito es 'monismo dinámico'?","back":"Lo Uno es la armonía tensa de los contrarios en devenir constante ('todo fluye'; el río). La unidad no excluye sino que exige el conflicto y el cambio."},{"id":"fa1-c13","tema":"Tema I","front":"Crítica religiosa de Jenófanes","back":"Contra el antropomorfismo de Homero y Hesíodo: cada pueblo pinta dioses a su imagen. Hay un dios supremo, no antropomórfico, que todo lo mueve con su mente."},{"id":"fa1-c14","tema":"Tema I","front":"Las dos vías de Parménides","back":"Vía de la verdad (alétheia): 'el ser es y no puede no ser'. Vía de la opinión (dóxa): mundo del devenir según los mortales. El no-ser es impensable e indecible."},{"id":"fa1-c15","tema":"Tema I","front":"Sémata (signos) del ser parmenídeo","back":"Ingénito, imperecedero, uno, continuo, homogéneo, inmóvil, completo y limitado como esfera perfecta. Se deducen del solo 'es'."},{"id":"fa1-c16","tema":"Tema I","front":"'Lo mismo es pensar y ser'","back":"Identidad parmenídea de noeîn y eînai: solo lo que es puede pensarse y decirse. El lógos, no los sentidos, decide sobre la realidad."},{"id":"fa1-c17","tema":"Tema I","front":"Aporías de Zenón","back":"Argumentos contra movimiento y pluralidad por reducción al absurdo: dicotomía, Aquiles y la tortuga, flecha, estadio. Defienden a Parménides; Aristóteles lo llama inventor de la dialéctica."},{"id":"fa1-c18","tema":"Tema I","front":"Aportación de Meliso de Samos","back":"Reformula el ser parmenídeo: ilimitado (no podría limitar con el no-ser), eterno en el tiempo e incorpóreo."},{"id":"fa1-c19","tema":"Tema I","front":"Principios de Empédocles","back":"Cuatro raíces eternas (fuego, aire, agua, tierra) mezcladas por Amor (Philía) y separadas por Odio (Neîkos), en ciclo cósmico entre el Esfero y la dispersión."},{"id":"fa1-c20","tema":"Tema I","front":"Homeomerías y Noûs de Anaxágoras","back":"'En todo hay parte de todo': infinitas semillas cualitativas. El Noûs, inteligencia pura y separada, inicia el remolino y ordena la mezcla. Sócrates le reprocha no usarlo teleológicamente."},{"id":"fa1-c21","tema":"Tema I","front":"Ontología atomista (Leucipo y Demócrito)","back":"Átomos: ser lleno, indivisible, eterno, infinito en número; difieren por figura, orden y posición. El vacío: no-ser que 'es', condición del movimiento. Todo por necesidad (anánke)."},{"id":"fa1-c22","tema":"Tema I","front":"Los dos conocimientos según Demócrito","back":"Conocimiento 'oscuro' (sentidos: cualidades por convención) y 'legítimo' (razón: átomos y vacío). Su ética: eutimía, buen ánimo por la mesura."},{"id":"fa1-c23","tema":"Tema II","front":"¿Qué fue la sofística?","back":"Ilustración griega del s. V: maestros itinerantes que cobraban por enseñar la areté política y la retórica. Giro antropológico, relativismo, convencionalismo, centralidad del lenguaje."},{"id":"fa1-c24","tema":"Tema II","front":"'Homo mensura' de Protágoras","back":"'El hombre es la medida de todas las cosas': cada cosa es para cada cual como le aparece. Relativismo discutido por Platón en el Teeteto. Además, agnosticismo religioso."},{"id":"fa1-c25","tema":"Tema II","front":"Oposición nómos / physis","back":"Ley-convención frente a naturaleza: para muchos sofistas, leyes y valores son acuerdos humanos variables, no realidades naturales. Eje del debate moral y político del s. V."},{"id":"fa1-c26","tema":"Tema II","front":"Las tres tesis de Gorgias","back":"Nada es; si algo fuera, sería incognoscible; si se conociera, sería incomunicable ('Sobre el no-ser'). El lógos, 'gran soberano': la retórica como poder de persuasión."},{"id":"fa1-c27","tema":"Tema II","front":"La justicia según Trasímaco","back":"'Lo que conviene al más fuerte': las leyes las dicta el poder en su propio interés (República I). Extremo del convencionalismo sofístico."},{"id":"fa1-c28","tema":"Tema II","front":"Ironía socrática","back":"Fingida ignorancia ('solo sé que no sé nada') con la que Sócrates interroga y desmonta el falso saber del interlocutor: primer momento, negativo, del método."},{"id":"fa1-c29","tema":"Tema II","front":"Mayéutica","back":"'Arte de partear' almas: mediante preguntas, el interlocutor da a luz por sí mismo la verdad que lleva dentro. Momento positivo del método socrático, tras la refutación (élenchos)."},{"id":"fa1-c30","tema":"Tema II","front":"Intelectualismo moral socrático","back":"La virtud es conocimiento y el vicio ignorancia: nadie obra mal a sabiendas. Por eso la virtud puede enseñarse y es una; tarea central: el cuidado del alma."},{"id":"fa1-c31","tema":"Tema II","front":"¿Qué atribuye Aristóteles a Sócrates?","back":"Dos cosas: los razonamientos inductivos y la definición universal (tí esti) en el ámbito moral. Germen de la teoría platónica de las Ideas."},{"id":"fa1-c32","tema":"Tema II","front":"Fuentes para conocer a Sócrates","back":"No escribió nada. Fuentes: Platón (la principal), Jenofonte, Aristófanes (caricatura en 'Las Nubes') y Aristóteles. Es la 'cuestión socrática'."},{"id":"fa1-c33","tema":"Tema II","front":"El 'daimonion' de Sócrates","back":"Voz o señal divina interior que solo disuade, nunca ordena. Vinculada a su misión, avalada por el oráculo de Delfos; base de la acusación de impiedad."},{"id":"fa1-c34","tema":"Tema II","front":"Escuela cínica: fundador y tesis","back":"Antístenes (y Diógenes de Sinope): la virtud basta para la felicidad; autarquía, ascesis, cosmopolitismo y desprecio de las convenciones. Precedente del estoicismo."},{"id":"fa1-c35","tema":"Tema II","front":"Escuela cirenaica: fundador y tesis","back":"Aristipo de Cirene: hedonismo; el fin es el placer presente y corporal, dominado por la sabiduría ('poseo, no soy poseído'). Prepara el debate con Epicuro."},{"id":"fa1-c36","tema":"Tema II","front":"Escuela de Megara","back":"Euclides de Megara: fusión de Sócrates y Elea; el Bien es Uno con muchos nombres. Dialéctica erística y paradojas lógicas (Eubúlides, Diodoro Crono)."},{"id":"fa1-c37","tema":"Tema III","front":"¿Qué es una Idea (eîdos) platónica?","back":"Realidad eterna, inmutable, inteligible y separada: esencia y modelo (parádeigma) de las cosas sensibles, que son por participación en ella. No es un concepto mental."},{"id":"fa1-c38","tema":"Tema III","front":"Participación y mímesis","back":"Modos de relación entre sensible e inteligible: las cosas participan (méthexis) de las Ideas o las imitan (mímesis) como copias de su modelo. Su dificultad motiva la autocrítica del Parménides."},{"id":"fa1-c39","tema":"Tema III","front":"La Idea del Bien","back":"Sol del mundo inteligible: da ser y cognoscibilidad a las Ideas, estando 'más allá de la esencia' (epékeina tês ousías). Principio supremo ontológico, epistemológico y político (República VI)."},{"id":"fa1-c40","tema":"Tema III","front":"Los cuatro grados de la línea dividida","back":"Dóxa: eikasía (imágenes) y pístis (cosas sensibles). Epistéme: diánoia (matemáticas, por hipótesis) y nóesis (Ideas, dialéctica). República VI."},{"id":"fa1-c41","tema":"Tema III","front":"Sentido de la alegoría de la caverna","back":"La educación como liberación y conversión (periagogé) del alma desde las sombras (dóxa) hasta el sol-Bien; y el deber político del filósofo de volver a la caverna."},{"id":"fa1-c42","tema":"Tema III","front":"Anámnesis","back":"Conocer es recordar: el alma inmortal contempló las Ideas antes de encarnarse; el aprendizaje reactiva ese saber mediante preguntas (esclavo del Menón, Fedón)."},{"id":"fa1-c43","tema":"Tema III","front":"La dialéctica platónica","back":"Ciencia suprema: asciende sin apoyo sensible de hipótesis en hipótesis hasta el principio no hipotético (el Bien); en los diálogos tardíos, arte de la combinación y división de las Ideas."},{"id":"fa1-c44","tema":"Tema III","front":"Las tres partes del alma en Platón","back":"Racional (sabiduría), irascible (valor), concupiscible (templanza); la justicia es su armonía. Símil del carro alado (Fedro); paralelo con las tres clases de la ciudad."},{"id":"fa1-c45","tema":"Tema III","front":"Tesis del filósofo-rey","back":"No cesarán los males de las ciudades hasta que gobiernen los filósofos o filosofen los gobernantes: solo quien conoce el Bien puede ordenar la polis (República V)."},{"id":"fa1-c46","tema":"Tema III","front":"Degeneración de los regímenes (República VIII)","back":"Aristocracia → timocracia → oligarquía → democracia → tiranía. Cada régimen corresponde a un tipo de alma; el tirano es el alma más esclava e infeliz."},{"id":"fa1-c47","tema":"Tema III","front":"El Demiurgo del Timeo","back":"Artesano divino que, mirando las Ideas, ordena la chóra (receptáculo informe) y engendra el cosmos, bello y viviente. No crea de la nada: ordena."},{"id":"fa1-c48","tema":"Tema III","front":"'Imagen móvil de la eternidad'","back":"Definición platónica del tiempo en el Timeo: el Demiurgo crea el tiempo con el cielo como imitación móvil, según el número, de la eternidad inmóvil."},{"id":"fa1-c49","tema":"Tema III","front":"Argumento del 'tercer hombre'","back":"Aporía del Parménides: si las cosas grandes y la Idea de lo Grande se parecen, exigen una tercera Idea común, y así al infinito. Motiva la revisión de la teoría de las Ideas."},{"id":"fa1-c50","tema":"Tema III","front":"El 'parricidio de Parménides' (Sofista)","back":"Platón admite que el no-ser 'es' en cierto modo: como diferencia (lo otro). Así explica la falsedad del discurso y la comunicación de los géneros supremos."},{"id":"fa1-c51","tema":"Tema III","front":"La escala del amor (Banquete)","back":"Ascenso erótico enseñado por Diotima: de un cuerpo bello a todos, a las almas, las leyes, las ciencias, hasta lo Bello en sí. Eros, hijo de Poros y Penía, es filósofo."},{"id":"fa1-c52","tema":"Tema IV","front":"El Corpus aristotelicum y su transmisión","back":"Obras exotéricas (diálogos, perdidas) y acroamáticas o esotéricas (apuntes de escuela, conservadas). Editadas por Andrónico de Rodas (s. I a.C.), que acuñó 'Metafísica'."},{"id":"fa1-c53","tema":"Tema IV","front":"'El ser se dice de muchas maneras'","back":"Tesis antiparmenídea: el ser no es unívoco ni equívoco, sino análogo, dicho en referencia a uno (pròs hén): todas las categorías remiten a la ousía."},{"id":"fa1-c54","tema":"Tema IV","front":"¿Qué es la ousía?","back":"La entidad o sustancia: sentido primero del ser, sujeto último de predicación y esencia. Sustancia primera: el individuo concreto (Categorías); como eîdos-esencia, causa primera del compuesto (Metafísica VII)."},{"id":"fa1-c55","tema":"Tema IV","front":"Hilemorfismo","back":"Todo ser natural es compuesto de materia (hýle) y forma (eîdos/morphé). La forma es acto y esencia; la materia, potencia y sustrato del cambio."},{"id":"fa1-c56","tema":"Tema IV","front":"Acto y potencia","back":"Dýnamis: capacidad de ser o llegar a ser; enérgeia/entelécheia: realización actual. Con esta distinción Aristóteles piensa el cambio sin violar a Parménides. El acto es anterior a la potencia."},{"id":"fa1-c57","tema":"Tema IV","front":"Las cuatro causas","back":"Material (de qué), formal (qué es), eficiente (de dónde el movimiento) y final (para qué). Conocer científicamente es conocer por causas; en la naturaleza prima el fin."},{"id":"fa1-c58","tema":"Tema IV","front":"Definición aristotélica de movimiento","back":"'Acto de lo que está en potencia en cuanto que está en potencia' (Física III): actualización imperfecta e inacabada de la potencia mientras dura el proceso."},{"id":"fa1-c59","tema":"Tema IV","front":"Definición aristotélica de tiempo","back":"'Número del movimiento según lo anterior y lo posterior' (Física IV): el tiempo no es el movimiento, sino su aspecto numerable por el alma."},{"id":"fa1-c60","tema":"Tema IV","front":"El Primer Motor inmóvil","back":"Sustancia eterna, inmaterial, acto puro sin potencia; mueve sin moverse como causa final, 'como lo amado'. Su vida: pensamiento que se piensa (nóesis noéseos). Metafísica XII."},{"id":"fa1-c61","tema":"Tema IV","front":"El alma según Aristóteles","back":"'Entelécheia primera de un cuerpo natural organizado que tiene la vida en potencia': forma y acto del cuerpo, no sustancia separada. Contra el dualismo platónico."},{"id":"fa1-c62","tema":"Tema IV","front":"Los tres tipos de alma","back":"Vegetativa (nutrición, reproducción), sensitiva (sensación, deseo, movimiento) e intelectiva (pensar). Cada nivel superior integra las funciones del inferior."},{"id":"fa1-c63","tema":"Tema IV","front":"Intelecto agente y paciente","back":"El paciente recibe las formas inteligibles; el agente las actualiza 'como la luz'. El agente es 'separado, impasible, inmortal y eterno' (De Anima III,5): pasaje de máxima disputa hermenéutica."},{"id":"fa1-c64","tema":"Tema IV","front":"'Zôon politikón'","back":"El hombre es por naturaleza animal político: el lógos le permite deliberar sobre lo justo y lo conveniente. La polis es anterior por naturaleza al individuo y busca el vivir bien."},{"id":"fa1-c65","tema":"Tema IV","front":"Constituciones rectas y desviadas","back":"Rectas (buscan el bien común): monarquía, aristocracia, politeia. Desviadas (interés propio): tiranía, oligarquía, democracia. Régimen preferible en la práctica: politeia con amplia clase media."},{"id":"fa1-c66","tema":"Tema IV","front":"Los tres sentidos de la verdad en Aristóteles","back":"Verdad de las cosas (ser como verdadero), verdad del juicio (adecuación en la síntesis predicativa) y verdad de los indivisibles (contacto intuitivo del noûs, sin falsedad posible)."},{"id":"fa1-c67","tema":"Tema IV","front":"Principio de no contradicción","back":"'Es imposible que lo mismo se dé y no se dé a la vez en lo mismo y según lo mismo': el principio más firme, indemostrable pero defendible por refutación (Metafísica IV)."},{"id":"fa1-c68","tema":"Tema IV","front":"Mundo sublunar y supralunar","back":"Sublunar: cuatro elementos, generación y corrupción, movimientos rectilíneos. Supralunar: éter incorruptible, movimiento circular eterno de las esferas. Cosmos finito, único, eterno y geocéntrico."},{"id":"fa1-c69","tema":"Tema IV","front":"Filosofía primera frente a filosofía segunda","back":"Filosofía primera (metafísica): ciencia del ser en cuanto ser y de la sustancia inmóvil. Filosofía segunda (física): ciencia del ser en movimiento. La biología estudia el viviente."},{"id":"fa1-c70","tema":"Tema IV","front":"Crítica aristotélica a las Ideas platónicas","back":"Las Ideas separadas duplican inútilmente el mundo, no explican movimiento ni conocimiento de lo sensible (argumento del tercer hombre). La forma es inmanente: el universal no es sustancia."}],"mcqs":[{"id":"fa1-t001","tema":"Tema I: Presocráticos","fuente":"card:fa1-c01","enunciado":"En la filosofía presocrática, ¿qué designa el término 'arché'?","opciones":["El principio del que todo procede, está constituido y al que retorna","El orden bello y armonioso del universo visible","El razonamiento que refuta al adversario mediante preguntas"],"correcta":0,"explicacion":"El arché es origen, sustrato y gobierno de lo real; el término lo consagra Aristóteles. 'Kósmos' es el orden bello y 'élenchos' la refutación."},{"id":"fa1-t002","tema":"Tema I: Presocráticos","fuente":"card:fa1-c02","enunciado":"¿Qué entendían los primeros filósofos jonios por 'physis'?","opciones":["La ley acordada por convención entre los ciudadanos","La naturaleza como brotar y desplegarse de lo real desde sí mismo","La opinión cambiante y engañosa de los mortales"],"correcta":1,"explicacion":"La physis es el objeto de la pregunta jonia ('Sobre la naturaleza'). La ley convencional es el nómos sofístico y la opinión es la dóxa."},{"id":"fa1-t003","tema":"Tema I: Presocráticos","fuente":"card:fa1-c03","enunciado":"¿Qué propuso Tales de Mileto como arché de todas las cosas?","opciones":["El aire, que se condensa y rarifica","El fuego, siempre vivo y en tensión","El agua, condición de toda vida"],"correcta":2,"explicacion":"Para Tales el arché es el agua, condición de la vida. El aire es el arché de Anaxímenes y el fuego, el símbolo de Heráclito."},{"id":"fa1-t004","tema":"Tema I: Presocráticos","fuente":"card:fa1-c04","enunciado":"¿Qué es el 'ápeiron' de Anaximandro?","opciones":["Lo indeterminado e ilimitado, inmortal e indestructible","El aire divino que todo lo envuelve como un soplo","El agua originaria de la que brota toda vida"],"correcta":0,"explicacion":"Ningún elemento determinado puede originar sus contrarios: el arché debe ser indeterminado. El aire es de Anaxímenes y el agua de Tales."},{"id":"fa1-t005","tema":"Tema I: Presocráticos","fuente":"card:fa1-c05","enunciado":"¿Mediante qué procesos explica Anaxímenes las transformaciones del aire, su arché?","opciones":["Mezcla y separación de cuatro raíces eternas","Condensación y rarefacción, que gradúan las diferencias cualitativas","Tensión de contrarios regida por el lógos común"],"correcta":1,"explicacion":"Es la primera explicación cuantitativa de lo cualitativo: el aire rarificado es fuego; condensado, viento, nube, agua, tierra y piedra. La mezcla de raíces es de Empédocles."},{"id":"fa1-t006","tema":"Tema I: Presocráticos","fuente":"card:fa1-c06","enunciado":"¿Qué es el hilozoísmo de los milesios?","opciones":["El alma inmortal transmigra por sucesivos cuerpos","Todo se compone de átomos inertes y vacío","La materia-physis es viva y divina por sí misma"],"correcta":2,"explicacion":"Los monistas jonios no distinguen materia inerte y fuerza vital: la physis está viva. La transmigración es doctrina órfico-pitagórica y los átomos, de Demócrito."},{"id":"fa1-t007","tema":"Tema I: Presocráticos","fuente":"card:fa1-c07","enunciado":"¿Cuál es el arché según los pitagóricos?","opciones":["El número: armonía, medida y proporción constituyen el cosmos","El ápeiron, lo indeterminado que carece de todo límite","El fuego, que se enciende y se apaga según medida"],"correcta":0,"explicacion":"Las cosas 'son' números o los imitan, como muestran las razones de los intervalos musicales. El ápeiron es de Anaximandro; el fuego, de Heráclito."},{"id":"fa1-t008","tema":"Tema I: Presocráticos","fuente":"card:fa1-c08","enunciado":"¿Qué es la metempsícosis pitagórica?","opciones":["El recuerdo de las Ideas contempladas antes de nacer","La transmigración del alma inmortal por sucesivos cuerpos","La disolución del alma en átomos al morir el cuerpo"],"correcta":1,"explicacion":"Doctrina de raíz órfica: el cuerpo es cárcel (sôma-sêma) y la filosofía purifica y libera. El recuerdo de las Ideas es la anámnesis platónica."},{"id":"fa1-t009","tema":"Tema I: Presocráticos","fuente":"card:fa1-c09","enunciado":"En la comunidad pitagórica, ¿quiénes eran los 'matemáticos'?","opciones":["Los oyentes que recibían máximas sin demostración","Los maestros itinerantes que cobraban por enseñar","Los iniciados que conocían las doctrinas y sus demostraciones"],"correcta":2,"explicacion":"Los matemáticos eran el grado superior de iniciación; los acusmáticos solo escuchaban máximas. Los maestros a sueldo fueron los sofistas, no los pitagóricos."},{"id":"fa1-t010","tema":"Tema I: Presocráticos","fuente":"card:fa1-c10","enunciado":"¿Qué es la 'tetraktýs' pitagórica?","opciones":["La figura sagrada 1+2+3+4=10, cifra de la generación del cosmos","La tabla de los diez pares de opuestos, como límite e ilimitado","La razón numérica de la octava musical, dos a uno"],"correcta":0,"explicacion":"Por la tetraktýs juraban los miembros de la comunidad: condensa la generación del número y del cosmos. La tabla de opuestos y las razones musicales son otras doctrinas pitagóricas."},{"id":"fa1-t011","tema":"Tema I: Presocráticos","fuente":"card:fa1-c11","enunciado":"¿Qué es el lógos en Heráclito?","opciones":["La inteligencia separada que inicia el remolino cósmico","La ley-razón común que gobierna el devenir y une los opuestos","El discurso persuasivo, 'gran soberano' que arrastra las almas"],"correcta":1,"explicacion":"El lógos heraclíteo rige la unidad tensa de los opuestos ('pólemos, padre de todas las cosas'). La inteligencia separada es el Noûs de Anaxágoras; el lógos soberano, de Gorgias."},{"id":"fa1-t012","tema":"Tema I: Presocráticos","fuente":"card:fa1-c12","enunciado":"¿Por qué se califica de 'monismo dinámico' la filosofía de Heráclito?","opciones":["El ser es uno, inmóvil y limitado como una esfera","Todo procede de la mezcla de infinitas semillas cualitativas","Lo Uno es armonía tensa de contrarios en devenir constante"],"correcta":2,"explicacion":"En Heráclito la unidad exige el conflicto y el cambio ('todo fluye'). El ser uno e inmóvil es el monismo estático de Parménides; las semillas, de Anaxágoras."},{"id":"fa1-t013","tema":"Tema I: Presocráticos","fuente":"card:fa1-c13","enunciado":"¿Qué reprocha Jenófanes a Homero y Hesíodo?","opciones":["El antropomorfismo: cada pueblo pinta dioses a su imagen","Haber divinizado el número, la medida y la armonía","Negar la existencia de los dioses de la ciudad"],"correcta":0,"explicacion":"Si los bueyes pintaran, pintarían dioses con forma de buey: crítica racional del antropomorfismo, no ateísmo. Jenófanes purifica lo divino en un dios supremo no antropomórfico."},{"id":"fa1-t014","tema":"Tema I: Presocráticos","fuente":"card:fa1-c14","enunciado":"Según Parménides, ¿qué revela la vía de la verdad (alétheia)?","opciones":["Que todo fluye y nada permanece idéntico a sí mismo","Que el ser es y no puede no ser; el no-ser no es","Que el hombre es la medida de todas las cosas"],"correcta":1,"explicacion":"La diosa revela la única vía transitable: el no-ser es impensable e indecible. El flujo universal es de Heráclito y el 'homo mensura', de Protágoras."},{"id":"fa1-t015","tema":"Tema I: Presocráticos","fuente":"card:fa1-c15","enunciado":"¿Cuáles son signos (sémata) del ser parmenídeo?","opciones":["Ilimitado, eterno en el tiempo e incorpóreo","Múltiple, divisible y en movimiento perpetuo","Ingénito, uno, inmóvil y limitado como esfera perfecta"],"correcta":2,"explicacion":"Del solo 'es' se deducen sus caracteres; el límite (péras) es aquí perfección. El ser ilimitado e incorpóreo es la reformulación de Meliso, no la de Parménides."},{"id":"fa1-t016","tema":"Tema I: Presocráticos","fuente":"card:fa1-c16","enunciado":"¿Qué significa la tesis parmenídea 'lo mismo es pensar y ser'?","opciones":["Solo lo que es puede pensarse y decirse","El pensamiento humano crea la realidad a su medida","Los sentidos deciden en último término qué es real"],"correcta":0,"explicacion":"La identidad de noeîn y eînai independiza el lógos de los sentidos: el no-ser no puede pensarse ni decirse. No es idealismo subjetivo ni empirismo."},{"id":"fa1-t017","tema":"Tema I: Presocráticos","fuente":"card:fa1-c17","enunciado":"¿Qué persiguen las aporías de Zenón (Aquiles, la flecha, el estadio)?","opciones":["Demostrar que el vacío existe y hace posible el movimiento","Defender a Parménides reduciendo al absurdo movimiento y pluralidad","Probar que todo fluye y nada permanece en reposo"],"correcta":1,"explicacion":"Zenón defiende indirectamente a su maestro: si hay pluralidad y movimiento, se siguen contradicciones. Aristóteles lo llama inventor de la dialéctica. El vacío es tesis atomista."},{"id":"fa1-t018","tema":"Tema I: Presocráticos","fuente":"card:fa1-c18","enunciado":"¿Qué aporta Meliso de Samos al eleatismo?","opciones":["Un ser esférico, completo y perfectamente limitado","Aporías contra el movimiento y contra la pluralidad","Un ser ilimitado, eterno en el tiempo e incorpóreo"],"correcta":2,"explicacion":"Meliso reformula el ser parmenídeo: no puede tener límites, pues limitaría con el no-ser. La esfera limitada es de Parménides y las aporías, de Zenón."},{"id":"fa1-t019","tema":"Tema I: Presocráticos","fuente":"card:fa1-c19","enunciado":"¿Cuáles son los principios de Empédocles?","opciones":["Cuatro raíces eternas mezcladas por Amor y separadas por Odio","Infinitas semillas cualitativas ordenadas por el Noûs","Átomos que se mueven por necesidad en el vacío"],"correcta":0,"explicacion":"Fuego, aire, agua y tierra se combinan por Philía y se separan por Neîkos en un ciclo cósmico. Las semillas y el Noûs son de Anaxágoras; los átomos, de Leucipo y Demócrito."},{"id":"fa1-t020","tema":"Tema I: Presocráticos","fuente":"card:fa1-c20","enunciado":"¿Qué papel cumple el Noûs de Anaxágoras?","opciones":["Fuerza amorosa que une las cuatro raíces en el Esfero","Inteligencia pura y separada que inicia el remolino y ordena la mezcla","Acto puro que mueve el cielo como causa final"],"correcta":1,"explicacion":"Es la primera causa inteligente de la filosofía griega, aunque Sócrates le reprocha usarla sin teleología. La fuerza unitiva es la Philía de Empédocles; el acto puro, el dios de Aristóteles."},{"id":"fa1-t021","tema":"Tema I: Presocráticos","fuente":"card:fa1-c21","enunciado":"Para los atomistas Leucipo y Demócrito, ¿qué es el vacío?","opciones":["Una ilusión: el ser lleno no admite hueco alguno","La materia indeterminada de la que todo brota","Un no-ser que 'es': condición del movimiento de los átomos"],"correcta":2,"explicacion":"Audacia ontológica contra Elea: conceden realidad al vacío para hacer posible el movimiento de los átomos. Lo indeterminado originario es el ápeiron de Anaximandro."},{"id":"fa1-t022","tema":"Tema I: Presocráticos","fuente":"card:fa1-c22","enunciado":"¿Qué dos conocimientos distingue Demócrito?","opciones":["Uno 'oscuro' (los sentidos) y otro 'legítimo' (la razón: átomos y vacío)","Conjetura, creencia, pensamiento discursivo e inteligencia pura","La opinión de los mortales y la verdad revelada por la diosa"],"correcta":0,"explicacion":"'Por convención el color, por convención lo dulce; en realidad, átomos y vacío'. Los cuatro grados son la línea de Platón; las dos vías, el poema de Parménides."},{"id":"fa1-t023","tema":"Tema II: Período socrático","fuente":"card:fa1-c23","enunciado":"¿Qué caracteriza a los sofistas del siglo V a.C.?","opciones":["Comunidad religiosa con reglas, secreto y jerarquía","Maestros itinerantes que cobraban por enseñar la areté política","Ascetas que despreciaban las convenciones y las riquezas"],"correcta":1,"explicacion":"Son la 'ilustración griega': giro antropológico, relativismo y centralidad del lenguaje. La comunidad con secreto es la pitagórica; el ascetismo, el de los cínicos."},{"id":"fa1-t024","tema":"Tema II: Período socrático","fuente":"card:fa1-c24","enunciado":"¿Qué significa el 'homo mensura' de Protágoras?","opciones":["El hombre es el único animal que posee lógos y polis","Nada es, y si algo fuera sería incognoscible","Cada cosa es para cada cual como le aparece: relativismo"],"correcta":2,"explicacion":"'El hombre es la medida de todas las cosas': relativismo que Platón discute en el Teeteto. El animal con lógos es tesis aristotélica y el 'nada es', de Gorgias."},{"id":"fa1-t025","tema":"Tema II: Período socrático","fuente":"card:fa1-c25","enunciado":"¿Qué opone el debate sofístico nómos/physis?","opciones":["La ley como convención humana variable frente a la naturaleza","La opinión sensible frente a la ciencia de las Ideas","El acto frente a la potencia en el cambio natural"],"correcta":0,"explicacion":"Para muchos sofistas, leyes y valores son acuerdos que varían según las ciudades, no realidades naturales. Dóxa/epistéme es distinción platónica y acto/potencia, aristotélica."},{"id":"fa1-t026","tema":"Tema II: Período socrático","fuente":"card:fa1-c26","enunciado":"¿Cuáles son las tres tesis de Gorgias en 'Sobre el no-ser'?","opciones":["El ser es, el no-ser no es, y pensar y ser son lo mismo","Nada es; si algo fuera, sería incognoscible; si se conociera, incomunicable","Todo fluye, los opuestos se unen y el fuego es la medida"],"correcta":1,"explicacion":"Es la antítesis nihilista de Parménides, cuyas tesis recoge la segunda opción. El lógos queda como 'gran soberano': puro poder de persuasión."},{"id":"fa1-t027","tema":"Tema II: Período socrático","fuente":"card:fa1-c27","enunciado":"¿Qué es la justicia según Trasímaco (República I)?","opciones":["La armonía en que cada parte hace lo que le es propio","Dar a cada uno aquello que se le debe","Lo que conviene al más fuerte, que dicta las leyes en su interés"],"correcta":2,"explicacion":"Trasímaco lleva el convencionalismo sofístico al extremo: la ley expresa el interés del poder. La armonía es la respuesta de Platón; 'dar lo debido' es la definición de Céfalo y Polemarco."},{"id":"fa1-t028","tema":"Tema II: Período socrático","fuente":"card:fa1-c28","enunciado":"¿Qué es la ironía socrática?","opciones":["Fingida ignorancia con la que desmonta el falso saber del interlocutor","El arte de ayudar a dar a luz la verdad mediante preguntas","La enseñanza remunerada del arte de persuadir"],"correcta":0,"explicacion":"'Solo sé que no sé nada': momento negativo del método, que purga el falso saber. El 'arte de partear' es la mayéutica, su momento positivo; cobrar por enseñar es propio de los sofistas."},{"id":"fa1-t029","tema":"Tema II: Período socrático","fuente":"card:fa1-c29","enunciado":"¿Qué es la mayéutica socrática?","opciones":["Refutar las tesis del adversario reduciéndolas al absurdo","Ayudar al interlocutor a dar a luz por sí mismo la verdad","Transmitir doctrinas cerradas a discípulos iniciados"],"correcta":1,"explicacion":"Como su madre partera, Sócrates no transmite contenidos: hace descubrir mediante preguntas. La reducción al absurdo es el método de Zenón y del élenchos, momento previo."},{"id":"fa1-t030","tema":"Tema II: Período socrático","fuente":"card:fa1-c30","enunciado":"¿Qué sostiene el intelectualismo moral socrático?","opciones":["La virtud es un hábito que se adquiere repitiendo actos","El fin de la vida buena es el placer presente","La virtud es conocimiento: nadie obra mal a sabiendas"],"correcta":2,"explicacion":"Si el mal nace de la ignorancia, la virtud puede enseñarse y es una; de ahí el cuidado del alma. La virtud como hábito es aristotélica y el hedonismo, cirenaico."},{"id":"fa1-t031","tema":"Tema II: Período socrático","fuente":"card:fa1-c31","enunciado":"Según Aristóteles, ¿qué aportó Sócrates a la filosofía?","opciones":["Los razonamientos inductivos y la definición universal","La teoría de las Ideas separadas del mundo sensible","La distinción entre el acto y la potencia"],"correcta":0,"explicacion":"Metafísica XIII: Sócrates buscó la esencia (tí esti) en el ámbito moral, pero no separó los universales; la separación es obra de Platón. Acto y potencia son del propio Aristóteles."},{"id":"fa1-t032","tema":"Tema II: Período socrático","fuente":"card:fa1-c32","enunciado":"¿Por qué existe una 'cuestión socrática'?","opciones":["Solo escribió apuntes escolares editados siglos después","Sócrates no escribió y las fuentes (Platón, Jenofonte, Aristófanes) divergen","Su única fuente contemporánea fiable es 'Las Nubes'"],"correcta":1,"explicacion":"Al no escribir nada, hay que contrastar testimonios: el Platón de los primeros diálogos se considera el más fiable. 'Las Nubes' es una caricatura que lo confunde con los sofistas; los apuntes editados tardíamente son de Aristóteles."},{"id":"fa1-t033","tema":"Tema II: Período socrático","fuente":"card:fa1-c33","enunciado":"¿Cómo actúa el 'daimonion' de Sócrates?","opciones":["Es un oráculo que le dicta las respuestas verdaderas","Es la parte irascible del alma, que lo impulsa al valor","Es una voz interior que solo disuade, nunca ordena"],"correcta":2,"explicacion":"El daimonion nunca prescribe: solo aparta de ciertas acciones. Vinculado a su misión avalada en Delfos, fue base de la acusación de impiedad. El alma tripartita es doctrina platónica."},{"id":"fa1-t034","tema":"Tema II: Período socrático","fuente":"card:fa1-c34","enunciado":"¿Qué defiende la escuela cínica (Antístenes, Diógenes)?","opciones":["La virtud basta para la felicidad: autarquía y ascesis","El placer presente y corporal como fin de la vida","Que el Bien es Uno, aunque con muchos nombres"],"correcta":0,"explicacion":"Los cínicos desprecian las convenciones (anaídeia), practican el cosmopolitismo y preceden al estoicismo. El hedonismo es cirenaico y el Bien-Uno, de la escuela de Megara."},{"id":"fa1-t035","tema":"Tema II: Período socrático","fuente":"card:fa1-c35","enunciado":"¿Qué sostiene Aristipo de Cirene?","opciones":["La felicidad exige renunciar a toda convención y posesión","El fin es el placer presente, dominado por la sabiduría","Solo la contemplación del Bien hace feliz al alma"],"correcta":1,"explicacion":"Hedonismo con dominio: 'poseo, no soy poseído'. La renuncia ascética es cínica y la contemplación del Bien, platónica. Los cirenaicos preparan el debate con Epicuro."},{"id":"fa1-t036","tema":"Tema II: Período socrático","fuente":"card:fa1-c36","enunciado":"¿Qué caracteriza a la escuela de Megara, fundada por Euclides?","opciones":["Hedonismo del placer presente y subjetivismo de las afecciones","Cosmopolitismo, pobreza voluntaria y libertad de palabra","Fusión de Sócrates y Elea: el Bien es Uno; paradojas lógicas"],"correcta":2,"explicacion":"Euclides identifica el Bien socrático con el Uno eleático; sus lógicos (Eubúlides, Diodoro Crono) alimentan la lógica estoica. El hedonismo es cirenaico y la pobreza voluntaria, cínica."},{"id":"fa1-t037","tema":"Tema III: Platón","fuente":"card:fa1-c37","enunciado":"¿Qué es una Idea (eîdos) para Platón?","opciones":["Realidad eterna y separada, modelo de las cosas sensibles","Un concepto que la mente abstrae a partir de los sentidos","La forma inmanente que organiza cada compuesto natural"],"correcta":0,"explicacion":"La Idea no es un concepto mental sino la realidad en su máximo grado: lo Bello en sí, lo Justo en sí. La forma inmanente y la abstracción corresponden a Aristóteles."},{"id":"fa1-t038","tema":"Tema III: Platón","fuente":"card:fa1-c38","enunciado":"¿Cómo se relacionan las cosas sensibles con las Ideas en Platón?","opciones":["Por anámnesis: las cosas recuerdan las Ideas de que proceden","Por participación (méthexis) e imitación (mímesis)","Por composición hilemórfica de materia y forma"],"correcta":1,"explicacion":"Las cosas participan de las Ideas o las imitan como copias de su modelo. La anámnesis es el recuerdo del alma, no de las cosas; el hilemorfismo es aristotélico."},{"id":"fa1-t039","tema":"Tema III: Platón","fuente":"card:fa1-c39","enunciado":"¿Qué papel tiene la Idea del Bien en la República?","opciones":["Es el acto puro que mueve el cielo como causa final","Es el artesano que fabrica el cosmos mirando las Ideas","Como el sol: da ser y cognoscibilidad a las Ideas"],"correcta":2,"explicacion":"El Bien está 'más allá de la esencia': principio ontológico, epistemológico y político supremo. El acto puro es el dios aristotélico y el artesano, el Demiurgo del Timeo."},{"id":"fa1-t040","tema":"Tema III: Platón","fuente":"card:fa1-c40","enunciado":"En la línea dividida (República VI), ¿qué grados componen la epistéme?","opciones":["Diánoia (matemáticas) y nóesis (Ideas)","Eikasía (imágenes) y pístis (cosas sensibles)","Dóxa (opinión) y aísthesis (sensación)"],"correcta":0,"explicacion":"El pensamiento discursivo usa hipótesis y figuras; la inteligencia pura capta las Ideas. Eikasía y pístis son los dos grados de la dóxa, no de la ciencia."},{"id":"fa1-t041","tema":"Tema III: Platón","fuente":"card:fa1-c41","enunciado":"¿Qué representa la salida del prisionero en la alegoría de la caverna?","opciones":["El ascenso erótico desde los cuerpos hasta lo Bello en sí","La educación como conversión (periagogé) del alma hacia el Bien","La purificación ritual del alma antes de transmigrar"],"correcta":1,"explicacion":"La paideía libera al alma entera de las sombras hacia el sol-Bien; el liberado debe volver a gobernar. El ascenso erótico es la escala del Banquete."},{"id":"fa1-t042","tema":"Tema III: Platón","fuente":"card:fa1-c42","enunciado":"¿Qué es la anámnesis platónica?","opciones":["Recibir la forma sensible sin la materia, como la cera el sello","Purgar el falso saber mediante la refutación","Conocer es recordar las Ideas contempladas antes de encarnarse"],"correcta":2,"explicacion":"El interrogatorio reactiva un saber latente (esclavo del Menón): versión ontológica de la mayéutica y prueba de la inmortalidad. La cera y el sello ilustran la sensación aristotélica."},{"id":"fa1-t043","tema":"Tema III: Platón","fuente":"card:fa1-c43","enunciado":"¿Qué distingue a la dialéctica, ciencia suprema para Platón?","opciones":["Asciende sin apoyo sensible hasta el principio no hipotético","Parte de hipótesis y figuras que nunca llega a cuestionar","Persuade a la asamblea sobre lo justo y lo conveniente"],"correcta":0,"explicacion":"Solo el dialéctico da razón de lo que sabe y alcanza el Bien. Partir de hipótesis sin cuestionarlas es lo propio de las matemáticas; persuadir, de la retórica."},{"id":"fa1-t044","tema":"Tema III: Platón","fuente":"card:fa1-c44","enunciado":"En el alma tripartita platónica, ¿qué virtud corresponde a la parte irascible?","opciones":["La templanza (sophrosýne)","El valor (andreía)","La prudencia (phrónesis)"],"correcta":1,"explicacion":"A la parte irascible corresponde el valor; la templanza es propia de la concupiscible y la prudencia o sabiduría, de la racional. La justicia es la armonía de las tres."},{"id":"fa1-t045","tema":"Tema III: Platón","fuente":"card:fa1-c45","enunciado":"¿Qué afirma la tesis del filósofo-rey (República V)?","opciones":["El mejor régimen práctico se apoya en una amplia clase media","Es preferible el gobierno de la ley al de los hombres","No cesarán los males hasta que los filósofos gobiernen"],"correcta":2,"explicacion":"Solo quien conoce la Idea del Bien puede ordenar la ciudad según ese modelo. La clase media es la politeia aristotélica; el gobierno de la ley es el 'segundo mejor' de las Leyes."},{"id":"fa1-t046","tema":"Tema III: Platón","fuente":"card:fa1-c46","enunciado":"¿Cuál es la secuencia de degeneración de los regímenes en República VIII?","opciones":["Aristocracia, timocracia, oligarquía, democracia, tiranía","Monarquía, aristocracia, politeia, democracia, tiranía","Aristocracia, oligarquía, timocracia, tiranía, democracia"],"correcta":0,"explicacion":"Cada régimen corresponde a un tipo de alma dominante; el tirano es el alma más esclava e infeliz. Monarquía-aristocracia-politeia es la clasificación de las constituciones rectas de Aristóteles."},{"id":"fa1-t047","tema":"Tema III: Platón","fuente":"card:fa1-c47","enunciado":"¿Qué hace el Demiurgo en el Timeo?","opciones":["Crea el mundo de la nada por un acto de su voluntad","Ordena la chóra informe mirando las Ideas; no crea de la nada","Mueve el cosmos como causa final, sin conocerlo"],"correcta":1,"explicacion":"El Demiurgo es un artesano divino que ordena un material preexistente según los modelos ideales: no es el Dios creador cristiano ni el Primer Motor aristotélico."},{"id":"fa1-t048","tema":"Tema III: Platón","fuente":"card:fa1-c48","enunciado":"¿Qué es el tiempo según el Timeo de Platón?","opciones":["El número del movimiento según lo anterior y lo posterior","Un flujo ilusorio propio de la opinión de los mortales","La imagen móvil de la eternidad, creada con el cielo"],"correcta":2,"explicacion":"El Demiurgo crea el tiempo como imitación móvil, según el número, de la eternidad inmóvil. La definición del tiempo como número del movimiento es de Aristóteles (Física IV)."},{"id":"fa1-t049","tema":"Tema III: Platón","fuente":"card:fa1-c49","enunciado":"¿Qué señala el argumento del 'tercer hombre' (Parménides)?","opcio
