edia","fuente":"card:tc1-c31","enunciado":"Según la iluminación agustiniana, conocemos las verdades eternas...","opciones":["Porque Dios ilumina la mente humana, mudable y finita","Porque el alma las recuerda de su existencia anterior","Porque el entendimiento agente las abstrae de lo sensible"],"correcta":0,"explicacion":"Las verdades eternas superan a la mente mudable, por lo que requieren la iluminación divina. Esta doctrina sustituye precisamente a la reminiscencia platónica; la abstracción es la vía aristotélica."},{"id":"tc1-t032","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"card:tc1-c32","enunciado":"¿Dónde sitúa Agustín de Hipona las Ideas platónicas?","opciones":["En un mundo inteligible subsistente, separado e independiente","En la mente de Dios, como ejemplares eternos de la creación","En la mente humana, como conceptos abstraídos de lo sensible"],"correcta":1,"explicacion":"Agustín cristianiza el platonismo: las Ideas son los ejemplares eternos según los cuales Dios crea. El mundo inteligible independiente es el Platón original; el concepto abstraído, la línea aristotélica."},{"id":"tc1-t033","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"card:tc1-c33","enunciado":"Para Tomás de Aquino, razón y fe...","opciones":["Se identifican: la verdadera filosofía es la verdadera religión","Pueden sostener verdades contradictorias entre sí","Son distintas pero no pueden contradecirse realmente"],"correcta":2,"explicacion":"Tomás distingue preámbulos demostrables (existencia de Dios) y misterios sobrenaturales, pero ambas fuentes proceden de Dios y no cabe contradicción real. La identificación es agustiniana; la contradicción, la 'doble verdad' averroísta."},{"id":"tc1-t034","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"card:tc1-c34","enunciado":"La tesis de la 'doble verdad' se atribuye a...","opciones":["Siger de Brabante y el averroísmo latino","Tomás de Aquino y la escuela dominicana","Guillermo de Ockham y el nominalismo tardío"],"correcta":0,"explicacion":"El averroísmo latino defendía conclusiones aristotélicas contrarias al dogma, admitiendo que lo verdadero en filosofía contradiga la teología; fue condenado por Tempier en 1277. Tomás sostiene la armonía y Ockham la separación."},{"id":"tc1-t035","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"card:tc1-c35","enunciado":"El orden correcto de las etapas medievales de la relación razón/fe es...","opciones":["Separación, doble verdad, armonía, identificación","Identificación, armonía, doble verdad, separación","Armonía, identificación, separación, doble verdad"],"correcta":1,"explicacion":"Primero la identificación agustiniana, luego la armonía con distinción de Tomás, después la doble verdad averroísta y finalmente la separación ockhamista, que emancipa la razón y prepara la modernidad."},{"id":"tc1-t036","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c36","enunciado":"El problema medieval de los universales surge históricamente de...","opciones":["Las Categorías de Aristóteles traducidas por Averroes","El diálogo Parménides de Platón comentado por Agustín","Las preguntas de la Isagoge de Porfirio comentada por Boecio"],"correcta":2,"explicacion":"Porfirio dejó abiertas las preguntas sobre si géneros y especies subsisten o son solo conceptos, si son corpóreos y si están separados; el comentario de Boecio las transmitió al medievo."},{"id":"tc1-t037","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c37","enunciado":"'Universalia in re' significa que el universal existe...","opciones":["Como forma en los individuos mismos","Antes de las cosas, como realidad subsistente","Después de las cosas, como concepto abstraído"],"correcta":0,"explicacion":"In re: la forma está en los individuos. Ante rem es el universal anterior a las cosas (realismo extremo, mente divina) y post rem el concepto abstraído por la mente."},{"id":"tc1-t038","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c38","enunciado":"El realismo extremo sostiene que los universales...","opciones":["Son meros nombres o soplos de voz sin realidad extramental","Son cosas subsistentes, anteriores e independientes de los individuos","Existen solo en la mente, aunque con fundamento en las cosas"],"correcta":1,"explicacion":"Es la herencia platónico-agustiniana de Escoto Eriúgena, Anselmo y Guillermo de Champeaux: universalia ante rem. Los soplos de voz definen el nominalismo y el fundamento in re, el realismo moderado."},{"id":"tc1-t039","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c39","enunciado":"Abelardo objeta a Guillermo de Champeaux que...","opciones":["El universal es un mero soplo de voz carente de todo significado","Solo el conocimiento intuitivo del individuo existente es evidente","Una esencia idéntica y entera en todos recibiría predicados contrarios"],"correcta":2,"explicacion":"Si la misma esencia estuviera toda entera en Sócrates y en Platón, la misma cosa estaría aquí y allí con predicados contrarios. Para Abelardo el universal es un 'sermo' fundado en el status común, no un flatus vocis."},{"id":"tc1-t040","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c40","enunciado":"Para Roscelino, el universal es...","opciones":["Un 'flatus vocis': mero soplo de voz sin realidad propia","Un 'sermo' con fundamento en el status común de los individuos","Una res idéntica que está toda entera en cada individuo"],"correcta":0,"explicacion":"Roscelino representa el nominalismo temprano: solo existen individuos y los nombres generales no designan esencias. El 'sermo' es la posición de Abelardo y la res idéntica, la de Champeaux."},{"id":"tc1-t041","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c41","enunciado":"La 'navaja de Ockham' prescribe...","opciones":["No asentir a representaciones que no sean comprensivas","No multiplicar los entes sin necesidad","No admitir como verdadero sino lo claro y distinto"],"correcta":1,"explicacion":"Es el principio de economía: elimina esencias universales, especies inteligibles y entidades explicativas superfluas. Las otras opciones son el criterio estoico y la regla cartesiana de evidencia."},{"id":"tc1-t042","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c42","enunciado":"En Ockham, la 'suppositio' es...","opciones":["La esencia común que el término universal designa en las cosas","La imagen sensible de la que el entendimiento abstrae el concepto","La función del término de estar en lugar de los individuos que significa"],"correcta":2,"explicacion":"En 'el hombre es mortal', 'hombre' no nombra una esencia: suple por cada hombre individual. Que el término designe una esencia común es justo la tesis realista que Ockham niega."},{"id":"tc1-t043","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c43","enunciado":"Para Ockham, el conocimiento intuitivo...","opciones":["Capta directamente al individuo existente y funda toda evidencia","Elabora conceptos generales sin garantizar la existencia de nada","Contempla las esencias universales que subsisten en la mente divina"],"correcta":0,"explicacion":"Lo primero y más cierto es la captación directa del singular existente; el conocimiento abstractivo elabora después los conceptos generales. Se invierte así el orden clásico que partía de la esencia universal."},{"id":"tc1-t044","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"card:tc1-c44","enunciado":"Una consecuencia histórica del nominalismo de Ockham fue...","opciones":["La síntesis definitiva entre platonismo y aristotelismo cristianos","La separación de fe y razón y el giro hacia lo singular y empírico","El fortalecimiento de la teología racional como ciencia demostrativa"],"correcta":1,"explicacion":"Sin esencias necesarias, las verdades de fe dejan de ser demostrables y entra en crisis la metafísica escolástica: antesala del empirismo y la ciencia moderna. La síntesis escolástica es más bien la obra tomista."},{"id":"tc1-t045","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c45","enunciado":"El racionalismo sostiene que el fundamento del conocimiento es...","opciones":["La experiencia sensible, que es origen y límite de todo saber","La cooperación de intuiciones sensibles y conceptos puros a priori","La razón, fuente de verdades a priori, con la matemática como modelo"],"correcta":2,"explicacion":"Para el racionalismo la razón basta, bien conducida, para alcanzar verdades independientes de la experiencia. La experiencia como origen y límite define al empirismo; la cooperación de ambas fuentes, a Kant."},{"id":"tc1-t046","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c46","enunciado":"Los tres niveles de la duda metódica cartesiana son...","opciones":["Engaños de los sentidos, confusión sueño/vigilia y genio maligno","Prejuicios de la infancia, precipitación y autoridad de la tradición","Ilusión sensible, error de memoria e imperfección del entendimiento"],"correcta":0,"explicacion":"La duda es universal, hiperbólica y provisional: los sentidos engañan, no distinguimos sueño y vigilia, y un genio maligno podría falsear incluso las matemáticas."},{"id":"tc1-t047","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c47","enunciado":"El 'cogito, ergo sum' cartesiano es...","opciones":["Un silogismo con la premisa 'todo lo que piensa existe'","Una intuición inmediata y evidente, no un silogismo","Una creencia vivaz fundada en el hábito y la costumbre"],"correcta":1,"explicacion":"Si fuera un razonamiento, necesitaría una premisa general más dudosa que la propia certeza inmediata del yo. Es evidencia directa que descubre el yo como res cogitans; la creencia por hábito es concepto humeano."},{"id":"tc1-t048","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c48","enunciado":"El criterio cartesiano de verdad es...","opciones":["La correspondencia con las impresiones sensibles vivaces","La evidencia irresistible de la representación comprensiva","La claridad y distinción de lo percibido por la razón"],"correcta":2,"explicacion":"Es verdadero cuanto se percibe tan clara y distintamente como el cogito, criterio que la veracidad divina garantiza. Las impresiones remiten a Hume y la representación comprensiva, al estoicismo."},{"id":"tc1-t049","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c49","enunciado":"Las tres clases de ideas que distingue Descartes son...","opciones":["Adventicias, facticias e innatas","Impresiones, ideas simples e ideas complejas","Sensaciones, imágenes y conceptos abstraídos"],"correcta":0,"explicacion":"Adventicias (venidas de fuera), facticias (construidas por la mente) e innatas (nacidas con la razón: yo, Dios, extensión, verdades matemáticas). La división en impresiones e ideas es de Hume."},{"id":"tc1-t050","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c50","enunciado":"Las dos operaciones básicas de la razón cartesiana son...","opciones":["Sensación externa y reflexión interna sobre las propias operaciones","Intuición de naturalezas simples y deducción que encadena evidencias","Análisis trascendental y síntesis de la imaginación productiva"],"correcta":1,"explicacion":"La intuición capta de modo inmediato y evidente; la deducción encadena ordenadamente intuiciones. Sensación y reflexión son las dos fuentes de la experiencia en Locke."},{"id":"tc1-t051","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c51","enunciado":"Las cuatro reglas del método cartesiano son...","opciones":["Duda, cogito, Dios y demostración del mundo","Observación, hipótesis, deducción y verificación","Evidencia, análisis, síntesis y enumeración"],"correcta":2,"explicacion":"No admitir sino lo claro y distinto, dividir las dificultades, ascender con orden de lo simple a lo complejo y revisar por completo. La segunda opción describe el itinerario de las Meditaciones, no las reglas."},{"id":"tc1-t052","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c52","enunciado":"En el sistema cartesiano, la veracidad divina...","opciones":["Garantiza el criterio de verdad y la realidad del mundo exterior","Se demuestra a partir de la existencia del mundo sensible externo","Ilumina directamente la mente con las verdades eternas e inmutables"],"correcta":0,"explicacion":"Dios se demuestra desde la idea innata de infinito y, siendo veraz, descarta el genio maligno y funda la ciencia estable y el mundo exterior. El orden inverso invertiría la fundamentación; la iluminación es agustiniana."},{"id":"tc1-t053","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"card:tc1-c53","enunciado":"La 'mathesis universalis' cartesiana designa...","opciones":["El conjunto de las matemáticas puras: aritmética y geometría","Una ciencia universal del orden y la medida con un método único","La lógica silogística heredada de la tradición escolástica"],"correcta":1,"explicacion":"Es el ideal de sabiduría universal: una sola razón aplicada con un solo método, de tipo matemático, a objetos diversos. No se reduce a las matemáticas particulares, y sustituye a la silogística escolástica."},{"id":"tc1-t054","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c54","enunciado":"El empirismo sostiene que...","opciones":["La razón posee verdades a priori independientes de la experiencia","El conocimiento une lo dado en la sensibilidad con formas a priori","Todo conocimiento procede de la experiencia y no hay ideas innatas"],"correcta":2,"explicacion":"Para Locke, Berkeley y Hume la experiencia es origen y límite del saber. Las verdades a priori de la razón definen al racionalismo; la síntesis de ambas fuentes, al planteamiento kantiano."},{"id":"tc1-t055","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c55","enunciado":"La 'tabula rasa' de Locke afirma que...","opciones":["La mente nace vacía y todo contenido proviene de la experiencia","La mente posee disposiciones innatas que la experiencia despierta","La mente solo conoce con plena certeza sus propias ideas innatas"],"correcta":0,"explicacion":"La mente es al nacer papel en blanco: los contenidos vienen de la sensación (experiencia externa) o de la reflexión (experiencia interna). Las disposiciones innatas son la tesis racionalista que Locke combate."},{"id":"tc1-t056","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c56","enunciado":"Para Hume, las ideas son...","opciones":["Percepciones vivaces y actuales, como las pasiones","Copias débiles de las impresiones en el pensamiento","Contenidos innatos de la mente anteriores a toda percepción"],"correcta":1,"explicacion":"Toda idea legítima deriva de una impresión (principio de copia); las percepciones vivaces y actuales son las impresiones, no las ideas. El innatismo es justo lo que Hume rechaza."},{"id":"tc1-t057","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c57","enunciado":"Según Hume, las relaciones de ideas son...","opciones":["Contingentes y a posteriori, fundadas en la causalidad","Necesarias y a posteriori, derivadas de la observación","Necesarias y a priori, pero no informan sobre el mundo"],"correcta":2,"explicacion":"Son las verdades matemáticas: su negación implica contradicción y se conocen por mera operación del pensamiento, sin informar de lo existente. Lo contingente fundado en la causalidad son las cuestiones de hecho."},{"id":"tc1-t058","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c58","enunciado":"Para Hume, el conocimiento demostrativo solo alcanza certeza en...","opciones":["Las relaciones de cantidad y número, es decir, las matemáticas","Las cuestiones de hecho verificadas por experiencia repetida","La existencia de Dios y la inmortalidad del alma humana"],"correcta":0,"explicacion":"La demostración encadena intuiciones y solo es cierta donde las relaciones dependen únicamente de las ideas comparadas: cantidad y número. Las cuestiones de hecho descansan en el hábito, no en demostración."},{"id":"tc1-t059","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c59","enunciado":"Según Hume, la 'conexión necesaria' entre causa y efecto...","opciones":["Se observa directamente en la conjunción de los objetos externos","No procede de impresión alguna de los objetos: nace del hábito","Se demuestra a priori mediante el principio de razón suficiente"],"correcta":1,"explicacion":"En la experiencia solo hay contigüidad, sucesión y conjunción constante; la necesidad es una determinación subjetiva de la mente proyectada sobre los objetos. Su conocimiento a priori es el supuesto racionalista criticado."},{"id":"tc1-t060","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c60","enunciado":"La creencia (belief) en Hume es...","opciones":["Un asentimiento racional a proposiciones demostradas","Una impresión debilitada que deriva de ideas complejas","Una idea avivada por una impresión presente"],"correcta":2,"explicacion":"La creencia sostiene las inferencias causales y la expectativa de futuro: es la base psicológica, no racional, de la vida cognoscitiva. La tercera opción invierte la relación entre impresiones e ideas."},{"id":"tc1-t061","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c61","enunciado":"Para Hume, el yo es...","opciones":["Un haz de percepciones en flujo y movimiento perpetuos","Una substancia pensante distinta e independiente del cuerpo","La unidad trascendental de la apercepción que acompaña al pensar"],"correcta":0,"explicacion":"No hay impresión constante de la que derive la idea de yo: la identidad personal es una ficción de la imaginación. La substancia pensante es la res cogitans cartesiana; la apercepción, noción kantiana."},{"id":"tc1-t062","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c62","enunciado":"Las tres leyes humeanas de asociación de ideas son...","opciones":["Evidencia, análisis y enumeración completa","Semejanza, contigüidad y causa-efecto","Sensación, reflexión y memoria retentiva"],"correcta":1,"explicacion":"Semejanza, contigüidad espacio-temporal y causalidad son la 'atracción' que ordena la vida mental. Las otras opciones mezclan reglas del método cartesiano y fuentes lockeanas de la experiencia."},{"id":"tc1-t063","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"card:tc1-c63","enunciado":"'Esse est percipi' (Berkeley) implica que...","opciones":["No existe substancia espiritual: el yo es solo un haz de percepciones","Los cuerpos existen en sí mismos pero resultan incognoscibles","No existe substancia material: solo ideas y espíritus que las perciben"],"correcta":2,"explicacion":"Ser es ser percibido: Berkeley niega la substancia material pero conserva los espíritus perceptores. La disolución del yo substancial la dará Hume, y la cosa en sí incognoscible es kantiana."},{"id":"tc1-t064","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c64","enunciado":"El 'giro copernicano' de Kant consiste en suponer que...","opciones":["Los objetos se rigen por nuestras estructuras cognoscitivas","Nuestro conocimiento debe regirse por los objetos en sí mismos","La razón debe limitarse a describir los hechos de la experiencia"],"correcta":0,"explicacion":"Kant invierte el supuesto tradicional: es el objeto el que se ajusta a las condiciones a priori del sujeto, lo que explica la posibilidad de juicios sintéticos a priori. La segunda opción es la postura invertida."},{"id":"tc1-t065","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c65","enunciado":"'Trascendental', en Kant, califica al conocimiento que...","opciones":["Versa sobre objetos situados más allá de toda experiencia posible","Versa sobre nuestro modo a priori de conocer los objetos","Versa sobre los datos empíricos que aportan los sentidos"],"correcta":1,"explicacion":"Trascendental es el estudio de las condiciones a priori de posibilidad del conocimiento, no de objetos. Lo que está más allá de toda experiencia es lo 'trascendente', confusión típica."},{"id":"tc1-t066","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c66","enunciado":"Un juicio sintético a priori se caracteriza por...","opciones":["Ampliar el conocimiento pero ser contingente y empírico","No ampliar el conocimiento aunque es universal y necesario","Ampliar el conocimiento y ser universal y necesario"],"correcta":2,"explicacion":"Combina las ventajas de ambos tipos: extiende el saber con validez estricta ('7+5=12', 'todo cambio tiene una causa'). Lo contingente define al sintético a posteriori y lo no ampliativo, al analítico."},{"id":"tc1-t067","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c67","enunciado":"Para Kant, el espacio y el tiempo son...","opciones":["Formas puras a priori de la sensibilidad","Propiedades reales de las cosas en sí mismas","Conceptos abstraídos de la experiencia de los cuerpos"],"correcta":0,"explicacion":"Según la Estética trascendental, son condiciones a priori de toda experiencia: espacio, forma del sentido externo; tiempo, del interno. No valen para cosas en sí ni derivan de la experiencia."},{"id":"tc1-t068","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c68","enunciado":"En Kant, el noúmeno es...","opciones":["Lo que aparece bajo las formas a priori del sujeto","La cosa en sí: pensable pero incognoscible","La ilusión que produce la razón al buscar lo incondicionado"],"correcta":1,"explicacion":"El noúmeno o cosa en sí puede pensarse pero no conocerse, pues ninguna intuición lo llena. Lo que aparece bajo las formas del sujeto es el fenómeno, único objeto de conocimiento."},{"id":"tc1-t069","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c69","enunciado":"Las categorías kantianas son...","opciones":["Diez géneros supremos del ser y de la predicación","Tres conceptos de lo incondicionado sin objeto empírico","Doce conceptos puros derivados de las formas del juicio"],"correcta":2,"explicacion":"Son conceptos puros del entendimiento, en cuatro grupos (cantidad, cualidad, relación, modalidad), válidos solo dentro de la experiencia. Los diez géneros del ser son las categorías aristotélicas; los tres incondicionados, las Ideas."},{"id":"tc1-t070","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c70","enunciado":"La deducción trascendental de las categorías demuestra...","opciones":["Su validez objetiva: sin ellas no habría experiencia de objetos","Su origen empírico en la observación repetida de los casos","Su aplicabilidad legítima a las cosas en sí, más allá de la experiencia"],"correcta":0,"explicacion":"Se fundamenta en la unidad trascendental de apercepción ('yo pienso'): todo objeto de experiencia debe someterse a las condiciones de unidad de la conciencia. El origen empírico sería la tesis humeana."},{"id":"tc1-t071","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c71","enunciado":"El esquematismo trascendental kantiano...","opciones":["Deriva las doce categorías a partir de las formas lógicas del juicio","Media entre categorías e intuiciones mediante determinaciones del tiempo","Refuta las tres pruebas tradicionales de la existencia de Dios"],"correcta":1,"explicacion":"Los esquemas, producidos por la imaginación trascendental, son determinaciones a priori del tiempo que permiten aplicar las categorías a los fenómenos. Derivarlas del juicio es la deducción metafísica."},{"id":"tc1-t072","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c72","enunciado":"Las tres Ideas de la razón en Kant son...","opciones":["Dios, libertad e inmortalidad, con uso constitutivo","Espacio, tiempo y causalidad, con uso regulativo","Alma, mundo y Dios, con uso solamente regulativo"],"correcta":2,"explicacion":"Alma, mundo y Dios son conceptos de lo incondicionado sin objeto en la experiencia: orientan la investigación pero no constituyen objetos. Dios, libertad e inmortalidad son los postulados de la razón práctica."},{"id":"tc1-t073","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c73","enunciado":"Las antinomias kantianas son...","opciones":["Contradicciones cosmológicas con tesis y antítesis igualmente demostrables","Falsas inferencias que concluyen un alma substancial e inmortal","Refutaciones de las tres pruebas de la existencia de Dios"],"correcta":0,"explicacion":"Surgen cuando la cosmología racional piensa el mundo como totalidad (finito/infinito, libertad/determinismo). Las falsas inferencias sobre el alma son los paralogismos; las pruebas de Dios se tratan en el Ideal."},{"id":"tc1-t074","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c74","enunciado":"La clave de la crítica kantiana al argumento ontológico es que...","opciones":["Todo lo contingente exige una causa primera necesaria","La existencia no es un predicado real extraíble del concepto","No hay impresión sensible de la que derive la idea de Dios"],"correcta":1,"explicacion":"Del concepto de ser perfectísimo no puede extraerse su existencia, porque existir no añade nada al concepto. La causa primera enuncia el argumento cosmológico, y la falta de impresión sería un argumento humeano."},{"id":"tc1-t075","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c75","enunciado":"¿Por qué la metafísica no es ciencia según Kant?","opciones":["Sus juicios son analíticos y no amplían nuestro conocimiento","Sus conceptos derivan únicamente del hábito y la costumbre","Sus objetos (alma, mundo, Dios) exceden toda experiencia posible"],"correcta":2,"explicacion":"Ninguna intuición sensible llena las categorías aplicadas a esos objetos: pensarlos es posible; conocerlos, no. Subsiste como disposición natural y como crítica. La reducción al hábito es humeana."},{"id":"tc1-t076","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c76","enunciado":"La Lógica trascendental de la Crítica de la razón pura comprende...","opciones":["La Analítica (entendimiento) y la Dialéctica (razón)","La Estética (sensibilidad) y la Analítica (entendimiento)","Los Paralogismos (alma) y las Antinomias (mundo)"],"correcta":0,"explicacion":"La Crítica se divide en Estética trascendental y Lógica trascendental; esta última comprende la Analítica (categorías, principios) y la Dialéctica (Ideas, ilusión trascendental)."},{"id":"tc1-t077","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"card:tc1-c77","enunciado":"'Las intuiciones sin conceptos son ciegas' significa que...","opciones":["El entendimiento puede conocer objetos sin datos de los sentidos","Sensibilidad y entendimiento deben cooperar para que haya conocimiento","Los sentidos bastan por sí solos para conocer, sin conceptos puros"],"correcta":1,"explicacion":"Los pensamientos sin contenido son vacíos y las intuiciones sin conceptos, ciegas: ninguna facultad conoce sola. Es la síntesis kantiana de racionalismo y empirismo; las otras opciones dan por buena una sola fuente."},{"id":"tc1-u001","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p01","enunciado":"¿Qué estudia la Dialéctica trascendental de Kant?","opciones":["La razón y sus inferencias: critica la metafísica como 'ilusión trascendental'","El entendimiento y sus conceptos puros: fundamenta la física","La sensibilidad y sus formas puras: fundamenta la matemática"],"correcta":0,"explicacion":"Es la segunda parte de la Lógica trascendental: la ilusión surge cuando la razón toma sus exigencias subjetivas de totalidad por conocimientos de objetos reales. (Ladrillo de: 'La Dialéctica transcendental en Kant')"},{"id":"tc1-u002","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p01","enunciado":"Según Kant, la razón busca lo incondicionado mediante tres Ideas. ¿Cuáles?","opciones":["Libertad, inmortalidad y bien supremo","Alma, mundo y Dios","Espacio, tiempo y apercepción"],"correcta":1,"explicacion":"A cada Idea corresponde una disciplina de la metafísica especial: psicología racional, cosmología racional y teología racional. (Ladrillo de: 'La Dialéctica transcendental en Kant')"},{"id":"tc1-u003","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p01","enunciado":"En los paralogismos, ¿qué error comete la psicología racional según Kant?","opciones":["Confunde el mundo fenoménico con una totalidad dada en sí","Deduce la existencia de Dios del concepto de ser perfectísimo","Confunde el 'yo pienso' lógico con un alma substancial e inmortal"],"correcta":2,"explicacion":"Del sujeto lógico de la apercepción no puede inferirse una substancia simple, idéntica e inmaterial: falta la intuición que llene el concepto. (Ladrillo de: 'La Dialéctica transcendental en Kant')"},{"id":"tc1-u004","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p01","enunciado":"¿Qué son las antinomias kantianas?","opciones":["Contradicciones cosmológicas: tesis y antítesis se demuestran con igual rigor","Falsas inferencias que substancializan el 'yo pienso' de la apercepción","Refutaciones de las tres pruebas de la existencia de Dios"],"correcta":0,"explicacion":"La cosmología racional cae en ellas (mundo finito/infinito, libertad/determinismo); Kant las resuelve distinguiendo fenómeno y cosa en sí. (Ladrillo de: 'La Dialéctica transcendental en Kant')"},{"id":"tc1-u005","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p01","enunciado":"¿Cuál es la clave de la refutación kantiana de las pruebas de la existencia de Dios?","opciones":["La idea de infinito no puede proceder de una mente finita","La existencia no es un predicado real extraíble de un concepto","El orden del mundo solo prueba un alma cósmica inmanente"],"correcta":1,"explicacion":"El Ideal de la razón refuta las pruebas ontológica, cosmológica y físico-teológica; la crítica al argumento ontológico es la clave de las tres. (Ladrillo de: 'La Dialéctica transcendental en Kant')"},{"id":"tc1-u006","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p01","enunciado":"¿Qué uso legítimo tienen las Ideas de la razón según Kant?","opciones":["Uso constitutivo: determinan objetos suprasensibles reales","Uso esquemático: median entre categorías y fenómenos","Uso regulativo: orientan la investigación hacia la unidad sistemática"],"correcta":2,"explicacion":"Las Ideas no constituyen objetos: solo regulan y orientan el trabajo del entendimiento hacia una unidad cada vez mayor. (Ladrillo de: 'La Dialéctica transcendental en Kant')"},{"id":"tc1-u007","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p01","enunciado":"Conclusión de la Dialéctica trascendental:","opciones":["La metafísica dogmática no es ciencia: conocer exige aplicar categorías a intuiciones sensibles","La metafísica puede ser ciencia si imita el método de la física matemática","La metafísica conoce lo incondicionado mediante las categorías puras sin intuición"],"correcta":0,"explicacion":"Sin intuición sensible que llene los conceptos no hay conocimiento: los objetos metafísicos quedan fuera del saber teórico. (Ladrillo de: 'La Dialéctica transcendental en Kant')"},{"id":"tc1-u008","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p02+tc1-p30","enunciado":"¿Qué es la anámnesis platónica?","opciones":["Conocer es abstraer la forma universal de las imágenes sensibles","Conocer es recordar: el alma contempló las Ideas antes de encarnarse","Conocer es recibir la iluminación divina de las verdades eternas"],"correcta":1,"explicacion":"El aprendizaje no introduce contenidos nuevos: actualiza un saber latente que el alma trae de su existencia anterior en el mundo inteligible. (Ladrillo de: 'La teoría platónica de la reminiscencia' y 'El conocimiento a priori en Platón')"},{"id":"tc1-u009","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p02","enunciado":"¿Qué presupone la teoría platónica de la reminiscencia?","opciones":["La unión substancial de alma y cuerpo, herencia aristotélica","La creación del alma en el tiempo, herencia del cristianismo","La inmortalidad y preexistencia del alma, herencia órfico-pitagórica"],"correcta":2,"explicacion":"Solo un alma inmortal que existió antes del cuerpo pudo contemplar las Ideas; Platón hereda esta doctrina del orfismo y el pitagorismo. (Ladrillo de: 'La teoría platónica de la reminiscencia')"},{"id":"tc1-u010","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p02","enunciado":"En el Menón, ¿cómo prueba Sócrates la reminiscencia?","opciones":["Un esclavo 'descubre' verdades geométricas solo interrogado, sin ser enseñado","Un esclavo repite de memoria un teorema que le fue enseñado","Un geómetra deduce el teorema desde axiomas evidentes por sí mismos"],"correcta":0,"explicacion":"Sócrates no le enseña: le hace preguntas. Si el esclavo llega por sí mismo al teorema, es que el saber ya estaba en su alma. (Ladrillo de: 'La teoría platónica de la reminiscencia')"},{"id":"tc1-u011","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p02","enunciado":"¿Qué paradoja del Menón resuelve la reminiscencia?","opciones":["No se puede enseñar la virtud porque no existen maestros de ella","No se puede buscar ni lo que se sabe ni lo que se ignora por completo","No se puede definir lo universal partiendo de casos particulares"],"correcta":1,"explicacion":"La reminiscencia disuelve la paradoja erística: buscar es posible porque en cierto modo ya sabemos lo que buscamos, aunque olvidado. (Ladrillo de: 'La teoría platónica de la reminiscencia')"},{"id":"tc1-u012","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p02+tc1-p30","enunciado":"Según el Fedón, ¿qué revela percibir cosas aproximadamente iguales?","opciones":["Que la igualdad se abstrae comparando muchos casos sensibles","Que la igualdad perfecta existe en las propias cosas sensibles","Que ya poseíamos la noción de lo Igual en sí, que ninguna experiencia da"],"correcta":2,"explicacion":"Las cosas sensibles imperfectas evocan las Ideas perfectas ya conocidas: la percepción es solo ocasión que despierta el recuerdo. (Ladrillo de: 'La teoría platónica de la reminiscencia' y 'El conocimiento a priori en Platón')"},{"id":"tc1-u013","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p02+tc1-p30","enunciado":"¿Qué papel tienen los sentidos en el conocimiento verdadero según Platón?","opciones":["Son solo ocasión del recuerdo, no su fundamento: el saber es a priori","Son el origen de todo contenido, que la razón ordena después","Fundan una opinión verdadera equiparable a la ciencia"],"correcta":0,"explicacion":"Lo sensible, mudable e imperfecto, no puede fundar el saber universal y necesario: el conocimiento verdadero es anterior e independiente de la experiencia. (Ladrillo de: 'La teoría platónica de la reminiscencia' y 'El conocimiento a priori en Platón')"},{"id":"tc1-u014","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p03","enunciado":"¿Qué son las categorías para Aristóteles?","opciones":["Conceptos puros del entendimiento que unifican lo dado en la intuición","Los géneros supremos del ser: los modos más generales de ser y predicarse","Determinaciones progresivas del mismo cuerpo individual"],"correcta":1,"explicacion":"Responden a las maneras irreductibles de decir 'es': toda predicación posible cae bajo alguna de ellas. (Ladrillo de: 'La teoría aristotélica de las categorías')"},{"id":"tc1-u015","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p03","enunciado":"'El ser se dice de muchas maneras' significa:","opciones":["Que el ser es un género único predicado de todo por igual","Que el ser es equívoco y sus sentidos no guardan relación alguna","Pluralismo ontológico frente a la univocidad eleática y la Idea platónica"],"correcta":2,"explicacion":"Frente a Parménides y Platón, Aristóteles multiplica los sentidos del ser, unificados por referencia a la substancia. (Ladrillo de: 'La teoría aristotélica de las categorías')"},{"id":"tc1-u016","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p03","enunciado":"¿Cuántas categorías distingue Aristóteles?","opciones":["Diez: la substancia y nueve accidentes","Doce, derivadas de las formas del juicio","Cuatro: substrato, cualidad, modo de ser y modo relativo"],"correcta":0,"explicacion":"Los nueve accidentes son cantidad, cualidad, relación, lugar, tiempo, posición, posesión, acción y pasión. (Ladrillo de: 'La teoría aristotélica de las categorías')"},{"id":"tc1-u017","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p03","enunciado":"¿Por qué la substancia (ousía) es la categoría primera?","opciones":["Es la única que se predica de todas las demás categorías","Existe en sí, mientras los accidentes solo existen en otro","Es la más universal y abarca los accidentes como especies suyas"],"correcta":1,"explicacion":"Los accidentes remiten a la substancia como su soporte: esa unidad de referencia (pros hen) evita la pura dispersión de sentidos del ser. (Ladrillo de: 'La teoría aristotélica de las categorías')"},{"id":"tc1-u018","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p03","enunciado":"En Aristóteles, ¿qué es la substancia primera?","opciones":["Las especies y los géneros, como hombre o animal","La esencia universal separada, como la Idea de Hombre","El individuo concreto, como este hombre"],"correcta":2,"explicacion":"La substancia segunda son las especies y géneros del individuo (hombre, animal); la primera es el individuo mismo. (Ladrillo de: 'La teoría aristotélica de las categorías')"},{"id":"tc1-u019","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p03","enunciado":"¿Qué doble valor tienen las categorías aristotélicas?","opciones":["Lógico (formas de predicación) y ontológico (modos reales de ser)","Empírico (datos sensibles) y trascendental (condiciones a priori)","Retórico (persuasión probable) y dialéctico (opinión común)"],"correcta":0,"explicacion":"Las estructuras del lenguaje y del pensamiento reflejan las de la realidad: por eso conocer mediante categorías es conocer el ser mismo; es la base del realismo aristotélico. (Ladrillo de: 'La teoría aristotélica de las categorías')"},{"id":"tc1-u020","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p04+tc1-p35","enunciado":"Tesis central del nominalismo medieval:","opciones":["Los universales existen en las cosas y se abstraen de ellas","Solo existen individuos; los universales son signos, no cosas","Los universales subsisten como realidades anteriores a los individuos"],"correcta":1,"explicacion":"Ni ante rem ni in re: fuera de la mente no hay nada universal; lo universal es solo un modo de significar muchos individuos. Lo defienden Roscelino y Ockham. (Ladrillo de: 'El nominalismo en la controversia medieval de los universales: Guillermo de Ockham' y 'El problema de los Universales en la Edad Media (planteamiento general y soluciones)')"},{"id":"tc1-u021","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p04","enunciado":"¿Qué sostuvo Roscelino sobre el universal?","opciones":["Es un 'sermo' fundado en el status común de los individuos","Es una esencia idéntica presente entera en cada individuo","Es 'flatus vocis': mero soplo de voz, un nombre"],"correcta":2,"explicacion":"Roscelino es el antecedente del nominalismo ockhamista: reduce el universal a la mera palabra proferida. (Ladrillo de: 'El nominalismo en la controversia medieval de los universales: Guillermo de Ockham')"},{"id":"tc1-u022","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p04","enunciado":"Para Ockham, el universal es:","opciones":["Un concepto mental, signo natural que suple por muchos individuos","Una palabra convencional sin ningún fundamento cognoscitivo","Una forma real común individualizada en cada cosa"],"correcta":0,"explicacion":"Es la doctrina de la suppositio: en 'el hombre es mortal', 'hombre' no nombra una esencia, sino que está en lugar de cada hombre individual. (Ladrillo de: 'El nominalismo en la controversia medieval de los universales: Guillermo de Ockham')"},{"id":"tc1-u023","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p04","enunciado":"¿Qué establece la 'navaja de Ockham'?","opciones":["Separar tajantemente el conocimiento intuitivo del abstractivo","No multiplicar los entes sin necesidad: las esencias universales sobran","Eliminar los individuos en favor de las especies y los géneros"],"correcta":1,"explicacion":"Es un principio de economía ontológica: las esencias universales son entidades explicativas superfluas. (Ladrillo de: 'El nominalismo en la controversia medieval de los universales: Guillermo de Ockham')"},{"id":"tc1-u024","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p04","enunciado":"En Ockham, ¿cuál es la base de todo conocimiento?","opciones":["El conocimiento abstractivo de la esencia; la intuición lo aplica después","La iluminación divina que garantiza las verdades eternas","El conocimiento intuitivo del individuo existente; el abstractivo viene después"],"correcta":2,"explicacion":"Se invierte el orden clásico: lo primero y más cierto es la captación directa del singular, no la esencia universal. (Ladrillo de: 'El nominalismo en la controversia medieval de los universales: Guillermo de Ockham')"},{"id":"tc1-u025","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p04","enunciado":"¿Qué consecuencias tuvo el nominalismo de Ockham?","opciones":["Separación de fe y razón y crisis de la metafísica esencialista","Síntesis definitiva de fe y razón en la escolástica madura","Subordinación de la filosofía a una teología racional demostrativa"],"correcta":0,"explicacion":"Si no hay esencias necesarias, las verdades teológicas no son demostrables racionalmente y la ciencia se reorienta hacia lo individual y empírico. (Ladrillo de: 'El nominalismo en la controversia medieval de los universales: Guillermo de Ockham')"},{"id":"tc1-u026","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p04","enunciado":"¿Qué anticipa el nominalismo ockhamista?","opciones":["El idealismo trascendental y el giro copernicano","La modernidad: empirismo y atención al hecho singular y experimental","El racionalismo innatista de las ideas claras y distintas"],"correcta":1,"explicacion":"La atención al individuo existente y la desconfianza hacia las esencias preparan la ciencia experimental y el empirismo modernos. (Ladrillo de: 'El nominalismo en la controversia medieval de los universales: Guillermo de Ockham')"},{"id":"tc1-u027","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p05","enunciado":"Según la doctrina tradicional de la causalidad que Hume critica:","opciones":["Causa y efecto solo se asocian por hábito en la mente","La causalidad es una categoría a priori del entendimiento","La causa produce necesariamente su efecto y la razón lo conoce a priori"],"correcta":2,"explicacion":"Es el supuesto del racionalismo y de la metafísica clásica: la causalidad como vínculo real, necesario y demostrable. (Ladrillo de: 'La reforma de Hume de la teoría tradicional de la causalidad')"},{"id":"tc1-u028","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p05+tc1-p37","enunciado":"¿Qué observamos realmente en la experiencia causal según Hume?","opciones":["Contigüidad, sucesión temporal y conjunción constante; nunca conexión necesaria","Contigüidad, semejanza y conexión necesaria entre los objetos","El poder productivo de la causa operando sobre su efecto"],"correcta":0,"explicacion":"La supuesta conexión necesaria no aparece jamás en lo observado: solo casos que se suceden y se repiten juntos. (Ladrillo de: 'La reforma de Hume de la teoría tradicional de la causalidad' y 'La crítica del empirismo al racionalismo')"},{"id":"tc1-u029","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p05","enunciado":"¿Qué muestra el principio de copia aplicado a la 'conexión necesaria'?","opciones":["Hay una impresión débil de ella en cada percepción aislada","No hay impresión de ella en los objetos: la idea no procede de fuera","Es una relación de ideas demostrable como las matemáticas"],"correcta":1,"explicacion":"Toda idea legítima deriva de una impresión; analizada la causalidad, la impresión correspondiente no está en lo observado sino en la mente. (Ladrillo de: 'La reforma de Hume de la teoría tradicional de la causalidad')"},{"id":"tc1-u030","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p05","enunciado":"¿Cuál es el origen real de la idea de conexión necesaria según Hume?","opciones":["La razón, que intuye a priori el vínculo entre causa y efecto","Una cualidad oculta de los cuerpos que la ciencia descubre","El hábito: tras la conjunción repetida, la mente pasa de la causa al efecto"],"correcta":2,"explicacion":"La necesidad causal es una determinación subjetiva de la mente proyectada sobre los objetos, no una propiedad del mundo. (Ladrillo de: 'La reforma de Hume de la teoría tradicional de la causalidad')"},{"id":"tc1-u031","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p05","enunciado":"Para Hume, la inferencia causal no es conocimiento demostrativo, sino:","opciones":["Creencia (belief): una idea avivada por la impresión presente","Intuición inmediata de relaciones entre ideas","Representación comprensiva que fuerza el asentimiento"],"correcta":0,"explicacion":"La creencia es un sentimiento de vivacidad, no una demostración: la base de nuestras inferencias fácticas es psicológica. (Ladrillo de: 'La reforma de Hume de la teoría tradicional de la causalidad')"},{"id":"tc1-u032","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p05","enunciado":"Consecuencia escéptica del análisis humeano de la causalidad:","opciones":["La ciencia empírica queda fundada en juicios sintéticos a priori","La ciencia empírica pierde su fundamento racional; su base es psicológica","Las matemáticas pierden también su certeza demostrativa"],"correcta":1,"explicacion":"No podemos justificar racionalmente que el futuro se parecerá al pasado; la naturaleza humana, no la razón, sostiene nuestra vida cognoscitiva. (Ladrillo de: 'La reforma de Hume de la teoría tradicional de la causalidad')"},{"id":"tc1-u033","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p06+tc1-p34","enunciado":"¿Cuál es el problema epistemológico central de la Edad Media?","opciones":["Conciliar el empirismo con el innatismo de las ideas","Fundar la ciencia natural sobre la observación experimental","Articular la razón griega (filosofía) con la revelación cristiana (fe)"],"correcta":2,"explicacion":"Ambas pretenden la verdad última sobre Dios, el mundo y el hombre; la teología medieval piensa la fe con los instrumentos conceptuales griegos, corregidos por el dogma. (Ladrillo de: 'Etapas de la relación entre razón y fe en la Edad Media' y 'Adaptaciones del platonismo y el aristotelismo en la teología medieval')"},{"id":"tc1-u034","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p06+tc1-p33","enunciado":"Primera etapa (agustiniana) de la relación razón/fe:","opciones":["'Creo para entender': la fe guía e ilumina a la razón, sin conflicto","Distintas pero concordes: la filosofía como preámbulo de la fe","Lo verdadero en filosofía puede contradecir la teología"],"correcta":0,"explicacion":"En la Patrística y San Agustín la filosofía es sierva y auxiliar de la fe: la verdadera filosofía coincide con la verdadera religión ('cree para entender, entiende para creer'). (Ladrillo de: 'Etapas de la relación entre razón y fe en la Edad Media' y 'La doctrina de la 'iluminación' en San Agustín')"},{"id":"tc1-u035","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p06","enunciado":"¿Cómo entiende Tomás de Aquino la relación entre razón y fe?","opciones":["Idénticas: la verdadera filosofía coincide con la verdadera religión","Distintas pero armónicas: no cabe contradicción real, ambas vienen de Dios","Independientes: las verdades de fe no son demostrables racionalmente"],"correcta":1,"explicacion":"Tomás distingue verdades naturales demostrables (existencia de Dios) y misterios sobrenaturales (Trinidad); la filosofía es preámbulo de la fe. (Ladrillo de: 'Etapas de la relación entre razón y fe en la Edad Media')"},{"id":"tc1-u036","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p06","enunciado":"¿Qué sostiene la 'doble verdad' del averroísmo latino?","opciones":["Toda verdad filosófica debe subordinarse al dogma revelado","Fe y razón afirman lo mismo con lenguajes distintos","Lo verdadero en filosofía puede contradecir la teología"],"correcta":2,"explicacion":"Siger de Brabante defiende conclusiones aristotélicas (eternidad del mundo, entendimiento único) contrarias al dogma; la posición fue condenada en 1277. (Ladrillo de: 'Etapas de la relación entre razón y fe en la Edad Media')"},{"id":"tc1-u037","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p06","enunciado":"Cuarta etapa de la relación razón/fe, la separación ockhamista:","opciones":["Las verdades de fe no son demostrables racionalmente: fe y razón se independizan","La razón demuestra por sí sola todos los artículos de la fe","La fe absorbe a la razón y elimina la filosofía como saber"],"correcta":0,"explicacion":"Con Ockham, teología y filosofía se separan: cada una sigue su propio camino sin interferencias. (Ladrillo de: 'Etapas de la relación entre razón y fe en la Edad Media')"},{"id":"tc1-u038","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p06","enunciado":"¿Qué resultado histórico tuvo la separación final de razón y fe?","opciones":["Provocó el retorno definitivo al agustinismo patrístico","Emancipó la razón y preparó la ciencia y la filosofía modernas autónomas","Consolidó la armonía escolástica entre teología y filosofía"],"correcta":1,"explicacion":"Liberada de la tutela teológica, la razón puede desarrollarse de forma autónoma: es la antesala de la modernidad. (Ladrillo de: 'Etapas de la relación entre razón y fe en la Edad Media')"},{"id":"tc1-u039","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p07+tc1-p37","enunciado":"¿Qué establece el 'principio de copia' de Hume?","opciones":["Toda impresión deriva de una idea innata que la precede","Las ideas simples son copias de otras ideas complejas","Toda idea legítima deriva de una impresión; sin impresión, término vacío"],"correcta":2,"explicacion":"Todas las percepciones son impresiones (vivaces) o ideas (copias débiles); el principio es el criterio empirista de significado, con el que Hume radicaliza a Locke. (Ladrillo de: 'Las dos clases de conocimiento en Hume (conocimiento intuitivo y demostrativo; relaciones de ideas y cuestiones de hecho)' y 'La crítica del empirismo al racionalismo')"},{"id":"tc1-u040","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p07","enunciado":"¿Cuáles son los dos objetos posibles del conocimiento según Hume?","opciones":["Relaciones de ideas y cuestiones de hecho","Impresiones de sensación e impresiones de reflexión","Substancias pensantes y substancias extensas"],"correcta":0,"explicacion":"Es el llamado 'tenedor de Hume': toda proposición cognoscitiva cae en uno de esos dos ámbitos. (Ladrillo de: 'Las dos clases de conocimiento en Hume (conocimiento intuitivo y demostrativo; relaciones de ideas y cuestiones de hecho)')"},{"id":"tc1-u041","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p07","enunciado":"Las 'relaciones de ideas' en Hume son:","opciones":["Verdades contingentes fundadas en la relación causa-efecto","Verdades necesarias y a priori (matemáticas) que no informan sobre el mundo","Verdades necesarias que describen la estructura del mundo real"],"correcta":1,"explicacion":"Su negación implica contradicción; se conocen por mera operación del pensamiento, sin depender de que exista nada en el universo. (Ladrillo de: 'Las dos clases de conocimiento en Hume (conocimiento intuitivo y demostrativo; relaciones de ideas y cuestiones de hecho)')"},{"id":"tc1-u042","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p07","enunciado":"Dentro de las relaciones de ideas, el conocimiento intuitivo capta:","opciones":["Cadenas de razonamientos sobre cantidad y número","La conjunción constante entre las causas y los efectos","Relaciones inmediatas, como semejanza o grados de cualidad"],"correcta":2,"explicacion":"El demostrativo, en cambio, procede por cadenas de intuiciones (cantidad y número): solo en matemáticas alcanza certeza la demostración. (Ladrillo de: 'Las dos clases de conocimiento en Hume (conocimiento intuitivo y demostrativo; relaciones de ideas y cuestiones de hecho)')"},{"id":"tc1-u043","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p07","enunciado":"Las 'cuestiones de hecho' en Hume:","opciones":["Son contingentes y a posteriori: su contrario siempre es posible","Son necesarias: su negación implica contradicción lógica","Se conocen por la mera operación del pensamiento puro"],"correcta":0,"explicacion":"Que el sol no salga mañana no es contradictorio; más allá de la percepción presente y la memoria, todo saber fáctico descansa en la causalidad, es decir, en el hábito. (Ladrillo de: 'Las dos clases de conocimiento en Hume (conocimiento intuitivo y demostrativo; relaciones de ideas y cuestiones de hecho)')"},{"id":"tc1-u044","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p07","enunciado":"¿Qué destino reserva Hume a los libros de metafísica?","opciones":["Conservarlos como ciencia legítima de lo suprasensible","'Arrojarlos a las llamas': no contienen razonamiento abstracto ni empírico","Reformarlos según el método geométrico de demostración"],"correcta":1,"explicacion":"Si un libro no contiene razonamientos sobre cantidad y número ni sobre cuestiones de hecho, solo contiene sofistería e ilusión. (Ladrillo de: 'Las dos clases de conocimiento en Hume (conocimiento intuitivo y demostrativo; relaciones de ideas y cuestiones de hecho)')"},{"id":"tc1-u045","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p08","enunciado":"¿Qué estudia la Estética trascendental de Kant?","opciones":["El entendimiento y sus conceptos puros o categorías","La belleza y las condiciones del juicio de gusto","La sensibilidad, facultad receptiva de intuiciones, y sus formas a priori"],"correcta":2,"explicacion":"'Estética' se toma en sentido etimológico (aísthesis, sensación), no artístico: busca los elementos a priori que la sensibilidad aporta al conocimiento. (Ladrillo de: 'La Estética transcendental en Kant')"},{"id":"tc1-u046","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p08","enunciado":"¿Qué son espacio y tiempo para Kant?","opciones":["Formas puras de la intuición: condiciones a priori de toda experiencia","Conceptos abstraídos de la experiencia de los cuerpos","Propiedades reales de las cosas consideradas en sí mismas"],"correcta":0,"explicacion":"No derivan de la experiencia sino que la hacen posible: nada puede aparecernos si no es ordenado espacio-temporalmente. (Ladrillo de: 'La Estética transcendental en Kant')"},{"id":"tc1-u047","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p08","enunciado":"¿Cuál de estas caracterizaciones del espacio y el tiempo RECHAZA Kant?","opciones":["Son intuiciones puras del sujeto, no conceptos","Son realidades en sí o relaciones entre las cosas mismas","Son condiciones de posibilidad de los fenómenos"],"correcta":1,"explicacion":"Para Kant no son conceptos, ni realidades en sí, ni relaciones entre cosas: son intuiciones puras que el sujeto aporta. (Ladrillo de: 'La Estética transcendental en Kant')"},{"id":"tc1-u048","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p08","enunciado":"En Kant, el espacio es forma del sentido externo; el tiempo es:","opciones":["Forma del sentido externo y de los cuerpos físicos","Categoría de la relación que ordena toda sucesión","Forma del sentido interno y, mediatamente, de todos los fenómenos"],"correcta":2,"explicacion":"Todo fenómeno, externo o interno, pasa por el sentido interno: por eso el tiempo es forma mediata de todos los fenómenos. (Ladrillo de: 'La Estética transcendental en Kant')"},{"id":"tc1-u049","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p08","enunciado":"¿Qué significa la 'idealidad trascendental' del espacio y el tiempo?","opciones":["No valen para las cosas en sí, aunque valen para todo fenómeno","Son ilusiones subjetivas que varían en cada individuo","Existen solo en Dios como marco eterno de la creación"],"correcta":0,"explicacion":"A la idealidad trascendental se une su realidad empírica: valen universal y necesariamente para todo lo que aparece. (Ladrillo de: 'La Estética transcendental en Kant')"},{"id":"tc1-u050","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p08","enunciado":"¿Qué ciencia fundan las formas puras de la sensibilidad?","opciones":["La física pura: sus leyes derivan del espacio y el tiempo","La matemática: geometría sobre el espacio, aritmética sobre el tiempo","La lógica formal: sus reglas derivan de la intuición pura"],"correcta":1,"explicacion":"Los juicios sintéticos a priori de la matemática son posibles porque se fundan en las intuiciones puras de espacio y tiempo. (Ladrillo de: 'La Estética transcendental en Kant')"},{"id":"tc1-u051","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p08","enunciado":"Consecuencia capital de la Estética trascendental:","opciones":["Conocemos las cosas en sí mediante la intuición intelectual","Conocemos fenómenos y, mediante la razón, también noúmenos","Conocemos fenómenos (lo que aparece bajo espacio y tiempo), no cosas en sí"],"correcta":2,"explicacion":"Si espacio y tiempo son formas del sujeto, solo conocemos lo que aparece bajo ellas, nunca la realidad tal como es en sí. (Ladrillo de: 'La Estética transcendental en Kant')"},{"id":"tc1-u052","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p09+tc1-p20","enunciado":"¿Qué caracteres tienen las Ideas platónicas?","opciones":["Únicas, eternas, inmutables, existentes en sí y separadas de lo sensible","Universales, mudables y dependientes de las cosas que las ejemplifican","Formas inmanentes que solo existen individualizadas en las cosas"],"correcta":0,"explicacion":"Son esencias universales y el verdadero ser: el objeto de la ciencia (episteme), mientras lo sensible cambiante solo permite opinión (doxa). (Ladrillo de: 'La doctrina platónica de las Ideas y sus dificultades (su dificultad central)' y '¿Qué es, en Platón, una 'Idea'? (la doctrina platónica de las Ideas)')"},{"id":"tc1-u053","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p09+tc1-p29","enunciado":"¿Cómo se relacionan las cosas sensibles con las Ideas en Platón?","opciones":["Por abstracción de la forma a partir de los individuos","Por participación (méthexis) o imitación (mímesis) de las Ideas","Por emanación necesaria de todas las cosas desde el Uno"],"correcta":1,"explicacion":"Las cosas son bellas por participar de la Belleza o por imitarla como copias de un modelo; Platón usa ambas metáforas, junto a la presencia (parusía). (Ladrillo de: 'La doctrina platónica de las Ideas y sus dificultades (su dificultad central)' y 'La relación entre las Ideas y el mundo sensible en Platón')"},{"id":"tc1-u054","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p09+tc1-p29","enunciado":"¿Cuál es la dificultad central de la teoría platónica de las Ideas?","opciones":["El olvido: por qué el alma olvida las Ideas al encarnarse","La jerarquía: cómo ordenar las Ideas bajo la Idea del Bien","El chorismós: cómo relacionar dos órdenes de realidad separados y heterogéneos"],"correcta":2,"explicacion":"Si las Ideas están separadas, no se ve cómo pueden ser causa y esencia de las cosas sensibles; el Parménides expone las aporías de esta relación. (Ladrillo de: 'La doctrina platónica de las Ideas y sus dificultades (su dificultad central)' y 'La relación entre las Ideas y el mundo sensible en Platón')"},{"id":"tc1-u055","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p09+tc1-p15","enunciado":"¿Qué concluye el argumento del 'tercer hombre'?","opciones":["La semejanza entre Idea y cosas exige otra Idea, en regreso al infinito","La Idea de Hombre es un tercer individuo más perfecto que los hombres","La Idea de Hombre se divide en partes al repartirse entre los individuos"],"correcta":0,"explicacion":"Si hombre e Idea de Hombre se parecen, necesitan un tercer término que funde su semejanza, y así indefinidamente; lo plantea el Parménides y lo explota Aristóteles contra Platón. (Ladrillo de: 'La doctrina platónica de las Ideas y sus dificultades (su dificultad central)' y 'La crítica de Aristóteles a Platón')"},{"id":"tc1-u056","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p09","enunciado":"Aporía de la participación en el Parménides:","opciones":["Las cosas participan de varias Ideas y pierden así su unidad","La Idea una no puede estar toda entera, ni por partes, en muchas cosas","La participación exigiría contacto físico entre la Idea y la cosa"],"correcta":1,"explicacion":"Si está entera en cada cosa se multiplica; si está por partes, deja de ser una: la participación resulta ininteligible. (Ladrillo de: 'La doctrina platónica de las Ideas y sus dificultades (su dificultad central)')"},{"id":"tc1-u057","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p09","enunciado":"Otro problema de la teoría platónica: ¿de qué hay Ideas?","opciones":["Es dudoso admitir Ideas de virtudes como la justicia","Es dudoso admitir Ideas de los entes matemáticos","Es dudoso admitir Ideas de cosas viles (barro, pelo) o de negaciones"],"correcta":2,"explicacion":"El propio Platón vacila sobre el alcance del mundo de las Ideas: extenderlo a lo vil o a lo negativo parece degradarlo. (Ladrillo de: 'La doctrina platónica de las Ideas y sus dificultades (su dificultad central)')"},{"id":"tc1-u058","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p09","enunciado":"¿Dónde autocritica Platón su propia teoría de las Ideas?","opciones":["En el Parménides; la revisa con la dialéctica de los géneros supremos","En la República, mediante el símil de la caverna","En el Menón, mediante la paradoja de la búsqueda"],"correcta":0,"explicacion":"Platón expone allí las aporías de la participación y el tercer hombre, y revisa la teoría mediante la comunicación de los géneros supremos. (Ladrillo de: 'La doctrina platónica de las Ideas y sus dificultades (su dificultad central)')"},{"id":"tc1-u059","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p10","enunciado":"¿Qué lugar ocupa la lógica en el estoicismo?","opciones":["Es un mero instrumento previo, exterior a la filosofía","Es una de las tres partes de la filosofía, junto a física y ética","Es la culminación del sistema, por encima de la ética"],"correcta":1,"explicacion":"Estudia el logos; en el helenismo el saber se instrumentaliza y la lógica sirve, en último término, al ideal de vida del sabio. (Ladrillo de: 'La lógica en el estoicismo')"},{"id":"tc1-u060","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p10","enunciado":"¿Qué comprende la lógica estoica?","opciones":["Categorías, juicio y silogismo, según el modelo del Órganon","Solo la teoría formal de la demostración científica","Retórica y dialéctica; esta incluye teoría del conocimiento y lógica formal"],"correcta":2,"explicacion":"La dialéctica estoica abarca mucho más que la lógica formal: incluye la teoría del conocimiento y del significado. (Ladrillo de: 'La lógica en el estoicismo')"},{"id":"tc1-u061","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p10+tc1-p32","enunciado":"¿Cuál es el criterio estoico de verdad?","opciones":["La representación comprensiva (phantasía katalēptikē), de evidencia irresistible","La suspensión del juicio ante toda representación","La percepción clara y distinta de las ideas innatas"],"correcta":0,"explicacion":"Se impone con evidencia irresistible y garantiza proceder del objeto real; junto con el asentimiento (synkatáthesis) produce la aprehensión verdadera. (Ladrillo de: 'La lógica en el estoicismo' y 'La teoría del juicio en el Estoicismo')"},{"id":"tc1-u062","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p10","enunciado":"¿Qué son los 'lektá' estoicos?","opciones":["Cuerpos sutiles que transmiten la representación al alma","Significados incorporales que median entre el signo y la cosa","Términos universales que designan esencias comunes reales"],"correcta":1,"explicacion":"Frente al corporeísmo general estoico, los significados no son cuerpos: son lo que entendemos cuando comprendemos un enunciado. (Ladrillo de: 'La lógica en el estoicismo')"},{"id":"tc1-u063","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p10","enunciado":"¿Qué innovación lógica aportaron los estoicos?","opciones":["La silogística de términos, clases y término medio","La lógica trascendental de las condiciones del conocimiento","La lógica proposicional: inferencias entre enunciados completos (axiómata)"],"correcta":2,"explicacion":"Frente a la silogística aristotélica de términos, la lógica estoica opera con proposiciones enteras. (Ladrillo de: 'La lógica en el estoicismo')"},{"id":"tc1-u064","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p10","enunciado":"¿Qué son los cinco 'argumentos indemostrables' estoicos?","opciones":["Esquemas básicos de inferencia válida, como modus ponens y modus tollens","Primeros principios captados por noûs, como la no contradicción","Las cinco vías para demostrar la existencia de Dios"],"correcta":0,"explicacion":"Son los esquemas elementales a los que se reducen las inferencias válidas: modus ponens, modus tollens, silogismos disyuntivos, etc. (Ladrillo de: 'La lógica en el estoicismo')"},{"id":"tc1-u065","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p11","enunciado":"¿Qué son las categorías en Kant?","opciones":["Los géneros supremos del ser y de la predicación","Conceptos puros del entendimiento: formas a priori que unifican lo intuido","Ideas de la razón que buscan lo incondicionado"],"correcta":1,"explicacion":"Se estudian en la Analítica trascendental; sin ellas lo sensible sería un caos sin objetos: 'las intuiciones sin conceptos son ciegas'. (Ladrillo de: 'La teoría kantiana de las categorías')"},{"id":"tc1-u066","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p11","enunciado":"¿De dónde obtiene Kant la tabla de las categorías (deducción metafísica)?","opciones":["De la observación de las regularidades de la experiencia","De las diez categorías de Aristóteles, depuradas y ampliadas","De las doce formas posibles del juicio de la lógica"],"correcta":2,"explicacion":"Si juzgar es la operación propia del entendimiento, cada forma de juicio revela un concepto puro correspondiente. (Ladrillo de: 'La teoría kantiana de las categorías')"},{"id":"tc1-u067","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p11","enunciado":"¿Cómo se organizan las doce categorías kantianas?","opciones":["En cuatro grupos de tres: cantidad, cualidad, relación y modalidad","En cuatro grupos de tres: substancia, cantidad, cualidad y relación","En tres grupos de cuatro: tesis, antítesis y síntesis"],"correcta":0,"explicacion":"El grupo de relación comprende substancia, causalidad y comunidad, decisivas para la física pura. (Ladrillo de: 'La teoría kantiana de las categorías')"},{"id":"tc1-u068","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p11+tc1-p38","enunciado":"¿Qué demuestra la 'deducción trascendental' de las categorías?","opciones":["Su origen en las formas lógicas del juicio","Su validez objetiva: sin ellas no habría experiencia unificada de objetos","Su aplicabilidad a las cosas en sí, más allá de la experiencia"],"correcta":1,"explicacion":"Todo objeto de experiencia debe someterse a las condiciones de unidad de la conciencia (el 'yo pienso'); por eso las categorías valen objetivamente. (Ladrillo de: 'La teoría kantiana de las categorías' y 'La Analítica transcendental en Kant')"},{"id":"tc1-u069","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p11","enunciado":"¿Qué papel cumple el esquematismo trascendental en Kant?","opciones":["El espacio media para aplicar las intuiciones a la razón","La imaginación crea las categorías a partir de imágenes sensibles","El tiempo media para aplicar las categorías a los fenómenos"],"correcta":2,"explicacion":"El tiempo, forma común a sensibilidad y entendimiento, permite que cada categoría se aplique a lo dado mediante su esquema. (Ladrillo de: 'La teoría kantiana de las categorías')"},{"id":"tc1-u070","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p11","enunciado":"¿Cuál es el límite de validez de las categorías kantianas?","opciones":["Solo valen dentro de la experiencia posible; más allá producen ilusión","Solo valen para las cosas en sí, no para los fenómenos","Valen sin restricción para todo objeto meramente pensable"],"correcta":0,"explicacion":"Aplicadas a cosas en sí engendran la ilusión dialéctica que critica la Dialéctica trascendental. (Ladrillo de: 'La teoría kantiana de las categorías')"},{"id":"tc1-u071","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p11","enunciado":"Frente a Aristóteles y Hume, las categorías kantianas:","opciones":["Son géneros del ser, y reducen la causalidad al hábito psicológico","No son géneros del ser, y devuelven a la causalidad su necesidad como condición a priori","Son géneros del ser, aunque solo valen para los fenómenos"],"correcta":1,"explicacion":"Contra Aristóteles, son formas del pensar y no del ser; contra Hume, la causalidad recobra necesidad como condición a priori de la experiencia. (Ladrillo de: 'La teoría kantiana de las categorías')"},{"id":"tc1-u072","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p12","enunciado":"¿Cuál es el punto de partida del conocimiento según Aristóteles?","opciones":["El recuerdo de las Ideas contempladas antes de nacer","Los primeros principios innatos de la razón pura","Los sentidos: no hay Ideas innatas ni reminiscencia"],"correcta":2,"explicacion":"Contra Platón: el alma es al nacer como una tablilla en la que nada está escrito; lo inteligible se extrae de lo sensible. (Ladrillo de: 'La doctrina aristotélica de la abstracción')"},{"id":"tc1-u073","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p12","enunciado":"Grados del conocer aristotélico, en orden ascendente:","opciones":["Sensación, imaginación, memoria y experiencia, hacia lo universal","Experiencia, memoria, imaginación y sensación, hacia lo particular","Eikasía, pístis, diánoia y nóesis, hacia las Ideas"],"correcta":0,"explicacion":"El conocimiento asciende de lo particular hacia lo universal, pasando por el phantasma y la experiencia acumulada. (Ladrillo de: 'La doctrina aristotélica de la abstracción')"},{"id":"tc1-u074","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p12","enunciado":"¿En qué consiste la abstracción aristotélica?","opciones":["El alma recuerda la forma universal contemplada antes de encarnarse","El entendimiento extrae la forma universal de las imágenes, sin la materia individual","La mente construye el universal por mera convención lingüística"],"correcta":1,"explicacion":"La esencia está realmente en la cosa individual; la mente la separa (abs-trahere) de las condiciones materiales que la individualizan. (Ladrillo de: 'La doctrina aristotélica de la abstracción')"},{"id":"tc1-u075","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p12","enunciado":"¿Qué función tiene el entendimiento agente en Aristóteles?","opciones":["Recibe el concepto y se hace todas las cosas","Asiente a las representaciones comprensivas evidentes","Ilumina el phantasma y actualiza lo inteligible en potencia"],"correcta":2,"explicacion":"Como la luz hace visibles los colores, el intelecto agente hace inteligible en acto lo que en la imagen sensible lo es solo en potencia; el paciente recibe el concepto. (Ladrillo de: 'La doctrina aristotélica de la abstracción')"},{"id":"tc1-u076","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p12+tc1-p15","enunciado":"¿Dónde existe el universal según Aristóteles?","opciones":["En las cosas como forma; solo es universal en la mente","Separado de las cosas, en el mundo inteligible","Solo en el lenguaje, como signo de muchos individuos"],"correcta":0,"explicacion":"Contra Platón, el universal no existe separado: se conoce por abstracción, no por reminiscencia. (Ladrillo de: 'La doctrina aristotélica de la abstracción' y 'La crítica de Aristóteles a Platón')"},{"id":"tc1-u077","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p12","enunciado":"¿En qué desemboca la abstracción aristotélica?","opciones":["En la creencia que sostiene las inferencias causales","En el concepto y la definición de la esencia, base de la ciencia demostrativa","En la opinión verdadera acompañada de explicación"],"correcta":1,"explicacion":"El concepto de la esencia funda el juicio y la demostración: sin definición no hay ciencia. (Ladrillo de: 'La doctrina aristotélica de la abstracción')"},{"id":"tc1-u078","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p13+tc1-p36+tc1-p35","enunciado":"Tesis del realismo moderado sobre los universales:","opciones":["Son cosas subsistentes anteriores e independientes de los individuos","Son meros nombres sin fundamento alguno en la realidad","Tienen fundamento real en las cosas, pero solo existen como universales en la mente"],"correcta":2,"explicacion":"Es la vía media entre el realismo extremo y el nominalismo, defendida por Abelardo y Tomás de Aquino: universal in re y post rem. (Ladrillo de: 'El realismo moderado en la controversia medieval de los universales', 'Variedades del realismo en la controversia de los universales' y 'El problema de los Universales en la Edad Media (planteamiento general y soluciones)')"},{"id":"tc1-u079","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p13","enunciado":"¿En qué se inspira la solución del realismo moderado?","opciones":["En Aristóteles: la esencia existe individualizada y se universaliza por abstracción","En Platón: las esencias subsisten separadas y el alma las recuerda","En los estoicos: el universal es un mero concepto (ennóēma)"],"correcta":0,"explicacion":"La esencia existe en cada cosa individual; el entendimiento la universaliza al abstraerla. (Ladrillo de: 'El realismo moderado en la controversia medieval de los universales')"},{"id":"tc1-u080","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p13","enunciado":"Para Abelardo, el universal es:","opciones":["Una 'res' idéntica presente toda entera en cada individuo","Un 'sermo' con significado fundado en el 'status' común de los individuos","Un 'flatus vocis' sin fundamento alguno en las cosas"],"correcta":1,"explicacion":"Contra su maestro Guillermo de Champeaux: no hay esencia idéntica en todos, pero el nombre universal no es arbitrario, se apoya en la condición común. (Ladrillo de: 'El realismo moderado en la controversia medieval de los universales')"},{"id":"tc1-u081","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p13","enunciado":"¿Cuál es el triple estado del universal según Tomás de Aquino?","opciones":["Ante rem (en los individuos), in re (mente divina), post rem (en el lenguaje)","In voce (en la palabra), in re (en la cosa), in intellectu (en el concepto)","Ante rem (mente divina), in re (en los individuos), post rem (concepto abstraído)"],"correcta":2,"explicacion":"Integra platonismo cristiano (ejemplares divinos) y aristotelismo (formas inmanentes, abstr
