egórico es único, incondicionado, formal, a priori y apodíctico; las otras opciones evocan el utilitarismo y a Aristóteles."},{"id":"et1-t030","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c30","enunciado":"La fórmula de la humanidad ordena tratar a las personas...","opciones":["siempre como medio necesario para el bien común","como fines solo cuando cumplen con sus deberes","siempre como fin, nunca solamente como medio"],"correcta":2,"explicacion":"La humanidad, en uno mismo y en cualquier otro, es fin en sí; cabe servirse de alguien como medio, pero nunca solo como medio."},{"id":"et1-t031","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c31","enunciado":"Para Kant, ¿qué tiene dignidad y no precio?","opciones":["La persona, única e insustituible por su autonomía","Todo lo que admite equivalente en el intercambio","Las habilidades y talentos útiles a la sociedad"],"correcta":0,"explicacion":"Lo que tiene precio admite equivalente e intercambio; lo que tiene dignidad es insustituible. La autonomía moral funda la dignidad."},{"id":"et1-t032","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c32","enunciado":"¿Qué es la autonomía de la voluntad en Kant?","opciones":["La voluntad recibe la ley de Dios o de la sociedad","La voluntad racional se da la ley a sí misma","La voluntad sigue sus deseos sin restricción alguna"],"correcta":1,"explicacion":"Es el principio supremo de la moralidad; cuando la ley viene de fuera (heteronomía) surgen imperativos condicionados, espurios."},{"id":"et1-t033","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c33","enunciado":"¿Qué es el reino de los fines?","opciones":["Estado histórico gobernado por los más sabios y virtuosos","Conjunto de los fines empíricos que la felicidad unifica","Comunidad ideal donde cada ser racional es legislador y súbdito"],"correcta":2,"explicacion":"Es el enlace sistemático de seres racionales bajo leyes comunes, donde todos son tratados como fines en sí."},{"id":"et1-t034","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c34","enunciado":"¿Cuáles son los postulados de la razón práctica kantiana?","opciones":["Libertad, inmortalidad del alma y existencia de Dios","Felicidad, virtud y placer como fines del hombre","Deber, imperativo categórico y buena voluntad"],"correcta":0,"explicacion":"No son demostrables teóricamente, pero la moralidad y la posibilidad del bien supremo (virtud más felicidad) exigen suponerlos."},{"id":"et1-t035","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c35","enunciado":"¿Por qué se dice que la ética kantiana es formal?","opciones":["Se ocupa únicamente de las formalidades legales externas","No prescribe contenidos, solo la forma universalizable de la máxima","Ordena fines materiales concretos deducidos de la razón"],"correcta":1,"explicacion":"Y es deontológica porque su criterio es el deber, no las consecuencias ni la felicidad, frente a las éticas materiales."},{"id":"et1-t036","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c36","enunciado":"¿Por qué es inmoral la máxima de prometer en falso?","opciones":["Sus consecuencias dañan la felicidad general del grupo","Contradice el mandato divino de decir siempre la verdad","Universalizada se autodestruye: nadie creería promesa alguna"],"correcta":2,"explicacion":"El test kantiano es la contradicción al universalizar la máxima, no el cálculo de consecuencias ni un mandato religioso."},{"id":"et1-t037","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c37","enunciado":"¿Qué desarrolla el capítulo segundo de la Fundamentación?","opciones":["La metafísica de las costumbres: imperativos, fórmulas y autonomía","El tránsito del conocimiento moral común al filosófico","La crítica de la razón práctica y el problema de la libertad"],"correcta":0,"explicacion":"El capítulo primero parte del conocimiento moral común (buena voluntad, deber); el tercero aborda la libertad."},{"id":"et1-t038","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c38","enunciado":"¿Cómo define Kant la Ilustración?","opciones":["Triunfo de la ciencia experimental sobre la religión","Salida del hombre de su minoría de edad autoculpable","Sustitución de la moral del deber por la de la felicidad"],"correcta":1,"explicacion":"Sapere aude: atrévete a servirte de tu propio entendimiento sin la guía de otro."},{"id":"et1-t039","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c39","enunciado":"Frente a Aristóteles, Kant sostiene que la moral busca...","opciones":["alcanzar la felicidad como fin último de la vida","el placer estable que acompaña a la virtud","ser digno de la felicidad, no ser feliz"],"correcta":2,"explicacion":"Aristóteles es eudemonista y teleológico; Kant, deontológico: la buena voluntad es la condición que nos hace dignos de ser felices."},{"id":"et1-t040","tema":"Tema 4: Ética y Psicología","fuente":"card:et1-c40","enunciado":"¿Qué es el super-yo freudiano?","opciones":["Instancia que interioriza las normas parentales y sociales","Conjunto de pulsiones inconscientes que buscan placer","Facultad racional que delibera sobre medios y fines"],"correcta":0,"explicacion":"Surge tras el complejo de Edipo por identificación con la autoridad; explica la conciencia moral, la culpa y el malestar en la cultura."},{"id":"et1-t041","tema":"Tema 4: Ética y Psicología","fuente":"card:et1-c41","enunciado":"¿Cuáles son los niveles del desarrollo moral según Kohlberg?","opciones":["Respeto unilateral, cooperación y reciprocidad","Preconvencional, convencional y posconvencional","Sensoriomotor, operacional concreto y formal"],"correcta":1,"explicacion":"Van del castigo y el interés a los principios éticos universales: de la heteronomía a la autonomía. Las otras opciones remiten a Piaget."},{"id":"et1-t042","tema":"Tema 4: Ética y Psicología","fuente":"card:et1-c42","enunciado":"¿Qué defiende la ética del cuidado de Gilligan?","opciones":["Aplicar principios abstractos de justicia a todos por igual","Someter el juicio moral a las expectativas del propio grupo","Atender la responsabilidad hacia personas concretas y sus relaciones"],"correcta":2,"explicacion":"Gilligan critica que la escala de Kohlberg privilegia la voz de la justicia e infravalora la voz del cuidado."},{"id":"et1-t043","tema":"Tema 4: Ética y Psicología","fuente":"card:et1-c43","enunciado":"¿En qué consiste la falacia genética?","opciones":["Confundir el origen de una norma con su validez","Deducir un deber a partir de meros hechos naturales","Generalizar a todos desde unos pocos casos particulares"],"correcta":0,"explicacion":"Explicar psicológica o sociológicamente una moral no la fundamenta ni la refuta: génesis y justificación son cuestiones distintas."},{"id":"et1-t044","tema":"Tema 4: Ética y Psicología","fuente":"card:et1-c44","enunciado":"Según Piaget, el niño avanza moralmente desde...","opciones":["la cooperación entre iguales al respeto a la autoridad","el respeto unilateral a la cooperación entre iguales","el egoísmo natural a la obediencia a la ley estatal"],"correcta":1,"explicacion":"Es el paso de la moral heterónoma a la autónoma, basada en reciprocidad y acuerdo."},{"id":"et1-t045","tema":"Tema 5: Ética y Sociología","fuente":"card:et1-c45","enunciado":"Para Durkheim, los hechos morales son...","opciones":["decisiones autónomas de la conciencia individual","mandatos divinos recibidos a través de la tradición","hechos sociales: exteriores al individuo y coercitivos"],"correcta":2,"explicacion":"La sociedad es fuente y autoridad de la moral; la educación moral consiste en socializar al individuo."},{"id":"et1-t046","tema":"Tema 5: Ética y Sociología","fuente":"card:et1-c46","enunciado":"¿Qué es la anomia según Durkheim?","opciones":["Falta o debilitamiento de normas sociales compartidas","Exceso de reglamentación que ahoga al individuo","Rechazo consciente y crítico de la moral vigente"],"correcta":0,"explicacion":"La anomia es patología social: genera desorientación moral y fenómenos como cierto tipo de suicidio."},{"id":"et1-t047","tema":"Tema 5: Ética y Sociología","fuente":"card:et1-c47","enunciado":"La neutralidad valorativa weberiana exige que la ciencia social...","opciones":["fundamente racionalmente los valores de cada época","distinga hechos y valores y se abstenga de juicios de valor","elija entre los valores en conflicto según la evidencia"],"correcta":1,"explicacion":"La ciencia explica lo que hay, pero no puede dictar qué debemos hacer ni qué dios servir."},{"id":"et1-t048","tema":"Tema 5: Ética y Sociología","fuente":"card:et1-c48","enunciado":"¿Qué significa el politeísmo de los valores de Weber?","opciones":["Toda sociedad moderna venera múltiples dioses y ritos","La ciencia puede jerarquizar racionalmente los valores","Los valores últimos entran en conflicto irresoluble entre sí"],"correcta":2,"explicacion":"En la modernidad desencantada, elegir entre valores últimos es una decisión personal que la ciencia no puede zanjar."},{"id":"et1-t049","tema":"Tema 6: Ética y Antropología","fuente":"card:et1-c49","enunciado":"¿Qué sostiene el relativismo cultural en su versión normativa?","opciones":["Las normas morales solo valen dentro de cada cultura","Todas las culturas comparten unos mínimos morales universales","Hay que juzgar las demás culturas desde la cultura propia"],"correcta":0,"explicacion":"La antropología constata diversidad (plano descriptivo); el salto al relativismo normativo es discutible. La tercera opción define el etnocentrismo."},{"id":"et1-t050","tema":"Tema 6: Ética y Antropología","fuente":"card:et1-c50","enunciado":"¿Qué es el etnocentrismo?","opciones":["Negar que pueda criticarse práctica alguna de otra cultura","Juzgar las demás culturas desde los patrones de la propia","Defender mínimos morales válidos para todas las culturas"],"correcta":1,"explicacion":"Toma la propia cultura como superior o medida universal; su vicio opuesto es el relativismo indiscriminado, que impide toda crítica."},{"id":"et1-t051","tema":"Tema 6: Ética y Antropología","fuente":"card:et1-c51","enunciado":"El universalismo moral defiende...","opciones":["un único modelo de vida feliz válido para todos","que cada cultura decide sin límites qué es lo justo","mínimos morales transculturales compatibles con el pluralismo"],"correcta":2,"explicacion":"Mínimos como la dignidad y los derechos humanos valen transculturalmente, sin imponer máximos de felicidad ni formas de vida."},{"id":"et1-t052","tema":"Tema 7: Ética y política","fuente":"card:et1-c52","enunciado":"¿Qué aporta Maquiavelo a la relación entre ética y política?","opciones":["Autonomiza la política: se rige por la eficacia, no por la moral","Subordina toda política a la virtud moral cristiana","Funda la legitimidad en el diálogo de los afectados"],"correcta":0,"explicacion":"El príncipe debe poder no ser bueno según la necesidad: razón de Estado y lógica de conquistar y conservar el poder."},{"id":"et1-t053","tema":"Tema 7: Ética y política","fuente":"card:et1-c53","enunciado":"En Weber, la ética de la responsabilidad exige...","opciones":["obrar por principios puros sin atender a resultados","responder de las consecuencias previsibles de la acción","obedecer en todo caso la legalidad vigente del Estado"],"correcta":1,"explicacion":"La ética de la convicción obra por principios descargando en el mundo los resultados; la de responsabilidad es propia del político maduro."},{"id":"et1-t054","tema":"Tema 7: Ética y política","fuente":"card:et1-c54","enunciado":"¿Cómo se eligen los principios de justicia según Rawls?","opciones":["Mediante el diálogo real de todos los afectados","Por el cálculo de la mayor utilidad agregada","En la posición original, tras el velo de ignorancia"],"correcta":2,"explicacion":"Resultado: iguales libertades básicas y desigualdades solo si benefician a los peor situados (justicia como equidad). El diálogo real es propio de la ética discursiva."},{"id":"et1-t055","tema":"Tema 7: Ética y política","fuente":"card:et1-c55","enunciado":"Según la ética discursiva de Apel y Habermas, una norma es válida si...","opciones":["todos los afectados podrían aceptarla en un diálogo simétrico","la elegirían sujetos que ignoran su posición social","maximiza el bienestar del mayor número de personas"],"correcta":0,"explicacion":"Es una reformulación dialógica de Kant: la universalización se decide en el discurso racional, no en el monólogo. El velo de ignorancia es de Rawls."},{"id":"et1-t056","tema":"Tema 8: Ética y religión","fuente":"card:et1-c56","enunciado":"¿Qué plantea el dilema de Eutifrón?","opciones":["Si la felicidad consiste en el placer o en la virtud","Si lo bueno lo es por mandato divino o Dios lo manda por bueno","Si la ley humana debe someterse a la ley natural"],"correcta":1,"explicacion":"Si lo primero, la moral sería arbitraria; si lo segundo, el bien no depende de la religión. Argumento clásico contra la ética heterónoma teológica."},{"id":"et1-t057","tema":"Tema 8: Ética y religión","fuente":"card:et1-c57","enunciado":"Para Kant, la relación entre moral y religión es que...","opciones":["la religión funda la moral mediante mandatos revelados","moral y religión son idénticas en contenido y origen","la moral no deriva de la religión, pero conduce a ella"],"correcta":2,"explicacion":"La religión racional consiste en reconocer los deberes morales como mandatos divinos, no en derivar la moral de la religión."},{"id":"et1-t058","tema":"Tema 8: Ética y religión","fuente":"card:et1-c58","enunciado":"¿Qué es la religión para Feuerbach?","opciones":["Proyección de la esencia humana alienada","El opio del pueblo que legitima la injusticia","Una neurosis obsesiva universal de la humanidad"],"correcta":0,"explicacion":"El opio del pueblo es la fórmula de Marx y la neurosis universal, la de Freud: cada crítica de la religión tiene su autor propio."},{"id":"et1-t059","tema":"Tema 8: Ética y religión","fuente":"card:et1-c59","enunciado":"Para Nietzsche, la moral cristiana es...","opciones":["moral de señores que afirma la vida y la fuerza","moral de esclavos nacida del resentimiento","proyección de deseos infantiles de protección paterna"],"correcta":1,"explicacion":"La muerte de Dios exige transmutar todos los valores; la moral cristiana surge del resentimiento contra la vida y los fuertes. La proyección infantil es tesis de Freud."},{"id":"et1-t060","tema":"Tema 8: Ética y religión","fuente":"card:et1-c60","enunciado":"¿Cómo entiende Freud la religión?","opciones":["Consuelo ideológico que encubre la explotación económica","Horizonte de esperanza en una justicia perfecta futura","Ilusión que cumple deseos infantiles de protección paterna"],"correcta":2,"explicacion":"Freud la compara con una neurosis obsesiva universal frente al desamparo. El consuelo ideológico es de Marx; el horizonte de esperanza, de Horkheimer."},{"id":"et1-t061","tema":"Tema 8: Ética y religión","fuente":"card:et1-c61","enunciado":"¿Qué expresa el anhelo de Horkheimer respecto a la religión?","opciones":["Que el verdugo no triunfe sobre la víctima inocente","Que la ciencia sustituya definitivamente a la fe","Que la moral garantice por sí sola la justicia total"],"correcta":0,"explicacion":"La religión mantiene abierta la esperanza de una justicia perfecta que la moral secular no puede garantizar."},{"id":"et1-t062","tema":"Tema 8: Ética y religión","fuente":"card:et1-c62","enunciado":"¿Qué es la secularización?","opciones":["Prohibición estatal de toda práctica religiosa pública","Emancipación moderna de la moral respecto de la tutela religiosa","Retorno de lo sagrado a las sociedades modernas"],"correcta":1,"explicacion":"Hace posible una ética laica y un espacio público pluralista, válido para creyentes y no creyentes."},{"id":"et1-t063","tema":"Lecturas obligatorias","fuente":"card:et1-c63","enunciado":"¿Cuáles son las lecturas obligatorias de Ética I?","opciones":["Crítica de la razón práctica y Ética a Nicómaco completa","Fundamentación de Kant y la Política de Aristóteles","Fundamentación de Kant y Ética a Nicómaco I, II, III, VI y X"],"correcta":2,"explicacion":"La Fundamentación de la metafísica de las costumbres se lee íntegra; de la Ética a Nicómaco, los libros I, II, III, VI y X. Manual: La aventura de la moralidad."},{"id":"et1-t064","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c64","enunciado":"¿De qué trata el libro VI de la Ética a Nicómaco?","opciones":["De las virtudes dianoéticas y la prudencia","Del bien supremo y de la felicidad","Del placer y de la vida contemplativa"],"correcta":0,"explicacion":"Libro I: bien supremo; II: virtud ética y término medio; III: voluntario y elección; VI: virtudes dianoéticas; X: placer y contemplación."},{"id":"et1-t065","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c65","enunciado":"¿Por qué la ley moral se presenta al hombre como imperativo?","opciones":["Porque toda ley moral requiere sanción externa del Estado","Porque constriñe (Nötigung) a una voluntad no santa","Porque la voluntad humana sigue la ley sin resistencia"],"correcta":1,"explicacion":"Una voluntad santa cumpliría la ley sin sentirla como mandato; en el hombre, la ley objetiva necesita y constriñe: por eso aparece como deber."},{"id":"et1-t066","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"card:et1-c66","enunciado":"¿Qué hace la ética aplicada?","opciones":["Propone y fundamenta criterios generales del bien obrar","Analiza el significado de los términos del lenguaje moral","Lleva los criterios éticos a ámbitos concretos como la bioética"],"correcta":2,"explicacion":"La ética normativa fundamenta criterios generales; la aplicada los traslada a la bioética, la ética profesional o la ecológica. Analizar el lenguaje es metaética."},{"id":"et1-t067","tema":"Tema 2: La ética griega: Aristóteles","fuente":"card:et1-c67","enunciado":"En Aristóteles, ¿qué papel tienen los bienes exteriores en la felicidad?","opciones":["Son necesarios con moderación, pero la virtud es lo decisivo","Son irrelevantes: la virtud basta por sí sola para ser feliz","Son el componente principal de una vida verdaderamente lograda"],"correcta":0,"explicacion":"La felicidad exige amigos, recursos y una vida completa: una golondrina no hace verano; pero lo decisivo es la actividad conforme a la virtud."},{"id":"et1-t068","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"card:et1-c68","enunciado":"¿Qué imperativos llama Kant asertóricos?","opciones":["Los de habilidad, referidos a fines meramente posibles","Los de prudencia, referidos a la felicidad, fin real de todos","Los categóricos, que mandan de manera incondicionada"],"correcta":1,"explicacion":"Problemáticos: de habilidad; asertóricos: de prudencia; apodíctico: el categórico, único que es ley moral."},{"id":"et1-t069","tema":"Tema 5: Ética y Sociología","fuente":"pregunta:et1-p01","enunciado":"¿Qué hace la sociología de la moral, frente a la ética?","opciones":["Fundamenta qué normas deben regir y con qué razones","Prescribe los valores que cada sociedad debe adoptar","Describe y explica las normas vigentes, sin justificarlas"],"correcta":2,"explicacion":"La sociología es descriptivo-explicativa; la ética es normativa: pregunta qué normas deben regir y por qué. (Ladrillo de: 'Ética y Sociología')"},{"id":"et1-t070","tema":"Tema 5: Ética y Sociología","fuente":"pregunta:et1-p01","enunciado":"Para Durkheim, ¿de dónde recibe la moral su autoridad?","opciones":["De la sociedad, cuya conciencia colectiva genera las normas","De la razón autónoma de cada individuo particular","De la voluntad divina transmitida por la tradición"],"correcta":0,"explicacion":"Los hechos morales son hechos sociales, exteriores y coercitivos; la anomia es patología social y educar moralmente es socializar. (Ladrillo de: 'Ética y Sociología')"},{"id":"et1-t071","tema":"Tema 5: Ética y Sociología","fuente":"pregunta:et1-p01","enunciado":"Según Weber, ante los valores últimos en conflicto, la ciencia...","opciones":["determina racionalmente cuál debe prevalecer","no puede decirnos qué dios servir","demuestra que todos son igualmente falsos"],"correcta":1,"explicacion":"Neutralidad valorativa y politeísmo axiológico: la ciencia distingue hechos y valores y se abstiene de juicios de valor. (Ladrillo de: 'Ética y Sociología')"},{"id":"et1-t072","tema":"Tema 5: Ética y Sociología","fuente":"pregunta:et1-p01","enunciado":"Explicar el origen social de una norma...","opciones":["demuestra que la norma carece de toda validez","basta para justificarla como norma obligatoria","no la fundamenta ni la refuta: sería falacia genética"],"correcta":2,"explicacion":"Reducir la ética a sociología confunde génesis con justificación: la validez de una norma no la decide su origen. (Ladrillo de: 'Ética y Sociología')"},{"id":"et1-t073","tema":"Tema 5: Ética y Sociología","fuente":"pregunta:et1-p01","enunciado":"Según la distinción de Aranguren, ¿a qué accede la sociología?","opciones":["A la moral vivida: los usos morales efectivos","A la moral pensada: la reflexión crítica del ethos","A la moral como estructura constitutiva del hombre"],"correcta":0,"explicacion":"La ética filosófica es moral pensada: examina críticamente el ethos social y puede corregirlo; ambas perspectivas se necesitan sin confundirse. (Ladrillo de: 'Ética y Sociología')"},{"id":"et1-t074","tema":"Tema 5: Ética y Sociología","fuente":"pregunta:et1-p01","enunciado":"¿Qué se sigue de que las morales varíen según sociedades y clases?","opciones":["Que todas las morales valen exactamente lo mismo","Nada normativo: pasar al relativismo es un salto lógico","Que no existen criterios de validez universalizables"],"correcta":1,"explicacion":"El pluralismo descriptivo no implica relativismo normativo; la ética busca criterios de validez universalizables. (Ladrillo de: 'Ética y Sociología')"},{"id":"et1-t075","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"pregunta:et1-p02","enunciado":"¿Qué giro culmina Kant en la ética moderna?","opciones":["De la ética del deber a la ética de la virtud y el carácter","De la razón práctica a la autoridad de la tradición religiosa","De las éticas del bien y la felicidad a la del deber y la autonomía"],"correcta":2,"explicacion":"Del Renacimiento a la Ilustración la moral se emancipa de la naturaleza y la religión: la razón práctica es la fuente de la ley moral. (Ladrillo de: 'Kant y la ética de la Modernidad')"},{"id":"et1-t076","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"pregunta:et1-p02","enunciado":"Para Kant, ¿dónde reside el valor moral de una acción?","opciones":["En la intención de la buena voluntad, no en los resultados","En los resultados beneficiosos que efectivamente produce","En los talentos y el temperamento de quien la realiza"],"correcta":0,"explicacion":"La buena voluntad vale por su puro querer conforme al deber: brilla como una joya aunque no logre nada. (Ladrillo de: 'Kant y la ética de la Modernidad')"},{"id":"et1-t077","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"pregunta:et1-p02","enunciado":"¿Qué acciones tienen valor moral para Kant?","opciones":["Todas las que coinciden externamente con el deber","Solo las hechas por deber, por respeto a la ley","Las que nacen de la inclinación a ayudar al prójimo"],"correcta":1,"explicacion":"Obrar meramente conforme al deber, como el comerciante honrado por interés, carece de valor moral: el móvil debe ser el deber mismo. (Ladrillo de: 'Kant y la ética de la Modernidad')"},{"id":"et1-t078","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"pregunta:et1-p02","enunciado":"¿Qué caracteriza al imperativo categórico frente al hipotético?","opciones":["Manda una acción como medio para un fin deseado","Prescribe contenidos concretos extraídos de la experiencia","Manda incondicionadamente, sin depender de ningún fin"],"correcta":2,"explicacion":"Es formal y a priori: exige solo que la máxima pueda quererse como ley universal. (Ladrillo de: 'Kant y la ética de la Modernidad')"},{"id":"et1-t079","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"pregunta:et1-p02","enunciado":"Según la fórmula de la humanidad, las personas...","opciones":["tienen dignidad, no precio: son fines en sí mismas","tienen un precio proporcional a su utilidad social","son medios legítimos cuando el fin es muy valioso"],"correcta":0,"explicacion":"Trata la humanidad, en ti y en otros, siempre como fin y nunca solo como medio: base del respeto incondicionado y de los derechos humanos. (Ladrillo de: 'Kant y la ética de la Modernidad')"},{"id":"et1-t080","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"pregunta:et1-p02","enunciado":"¿Por qué es la autonomía el principio supremo de la moralidad?","opciones":["Porque cada uno decide sus normas según sus deseos","Porque la voluntad racional se da a sí misma la ley","Porque la ley moral procede de una autoridad externa"],"correcta":1,"explicacion":"Toda moral heterónoma genera imperativos espurios; en el reino de los fines cada ser racional es a la vez legislador y súbdito. (Ladrillo de: 'Kant y la ética de la Modernidad')"},{"id":"et1-t081","tema":"Tema 3: Del Renacimiento a la Ilustración: Kant y la ética de la Modernidad","fuente":"pregunta:et1-p02","enunciado":"En Kant, la libertad, la inmortalidad y Dios son...","opciones":["verdades demostradas por la razón teórica especulativa","ilusiones que la crítica de la razón debe eliminar","postulados de la razón práctica, no demostrables teóricamente"],"correcta":2,"explicacion":"La libertad debe suponerse: es la ratio essendi de la moral; hay primado de la razón práctica en una ética deontológica, universalista y formalista. (Ladrillo de: 'Kant y la ética de la Modernidad')"},{"id":"et1-t082","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"pregunta:et1-p03","enunciado":"¿Qué tipo de saber es la ética frente a la moral?","opciones":["De segundo orden: reflexiona sobre las morales concretas","De primer orden: orienta directamente la acción","Empírico: describe las costumbres de cada sociedad"],"correcta":0,"explicacion":"La moral (códigos de normas y valores vividos) orienta la acción; la ética la toma como objeto, la analiza, la critica y busca fundamentarla. (Ladrillo de: 'El ámbito de la moralidad: Ética y Moral')"},{"id":"et1-t083","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"pregunta:et1-p03","enunciado":"¿Qué comparten etimológicamente 'ética' y 'moral'?","opciones":["Ambas proceden del mismo término griego, ethos","Ambas remiten a costumbre, hábito y modo de ser","Nada: por eso designan hoy saberes distintos"],"correcta":1,"explicacion":"Ethos (griego: carácter, morada, hábito) y mos-moris (latín: costumbre) convergen, pero la coincidencia etimológica no borra la distinción funcional actual. (Ladrillo de: 'El ámbito de la moralidad: Ética y Moral')"},{"id":"et1-t084","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"pregunta:et1-p03","enunciado":"¿Por qué el hombre no puede no ser moral, según Aranguren?","opciones":["Porque nace con los contenidos morales correctos grabados","Porque la sociedad le impone coercitivamente sus normas","Por su inconclusión biológica debe elegir y justificar sus actos"],"correcta":2,"explicacion":"Es la moral como estructura, distinta de la moral como contenido; incluso ser inmoral presupone esa estructura. (Ladrillo de: 'El ámbito de la moralidad: Ética y Moral')"},{"id":"et1-t085","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"pregunta:et1-p03","enunciado":"¿Qué distingue una norma moral de un uso social o una ley?","opciones":["Obliga en conciencia y con pretensión de universalidad","Está respaldada por sanciones externas del grupo","Ha sido promulgada por una autoridad legítima"],"correcta":0,"explicacion":"Los rasgos de lo moral son libertad, responsabilidad, normatividad y universalizabilidad: solo hay moralidad donde cabe imputar responsabilidad. (Ladrillo de: 'El ámbito de la moralidad: Ética y Moral')"},{"id":"et1-t086","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"pregunta:et1-p03","enunciado":"¿De dónde parte la ética para cumplir sus funciones?","opciones":["De cero: inventa la moral y da recetas concretas","De la experiencia moral existente, de la que da razón","De los datos estadísticos sobre conductas sociales"],"correcta":1,"explicacion":"Sus funciones son aclarar qué es lo moral, fundamentar las normas y aplicar los principios a la vida: análisis, fundamentación y ética aplicada. (Ladrillo de: 'El ámbito de la moralidad: Ética y Moral')"},{"id":"et1-t087","tema":"Tema 1: El ámbito de la moralidad: Ética y Moral","fuente":"pregunta:et1-p03","enunciado":"¿Qué nivel del discurso moral estudia el significado de 'bueno' o 'deber'?","opciones":["La ética normativa, que propone criterios","La moral vivida de cada grupo social","La metaética, análisis del lenguaje moral"],"correcta":2,"explicacion":"La metaética estudia el lenguaje y la lógica del razonamiento moral; la ética normativa propone y fundamenta criterios del bien obrar. (Ladrillo de: 'El ámbito de la moralidad: Ética y Moral')"},{"id":"et1-t088","tema":"Tema 8: Ética y religión","fuente":"pregunta:et1-p04","enunciado":"¿Cuál es la cuestión filosófica central sobre ética y religión?","opciones":["Si la moral necesita fundamento religioso o es racionalmente autónoma","Si las religiones han generado históricamente códigos morales","Si los creyentes se comportan mejor que los no creyentes"],"correcta":0,"explicacion":"El vínculo histórico es estrecho: las religiones fueron matrices de códigos morales; pero ética y religión son lógicamente distinguibles. (Ladrillo de: 'Ética y religión')"},{"id":"et1-t089","tema":"Tema 8: Ética y religión","fuente":"pregunta:et1-p04","enunciado":"En el dilema de Eutifrón, si lo bueno lo es solo porque Dios lo manda...","opciones":["el bien queda probado como independiente de Dios","la moral resulta arbitraria: voluntarismo teológico","la ética recibe su fundamentación definitiva"],"correcta":1,"explicacion":"Si, en cambio, Dios lo manda porque es bueno, el bien no depende de la voluntad divina: argumento clásico contra la ética heterónoma teológica. (Ladrillo de: 'Ética y religión')"},{"id":"et1-t090","tema":"Tema 8: Ética y religión","fuente":"pregunta:et1-p04","enunciado":"Para Kant, ¿qué relación guarda la moral con la religión?","opciones":["Deriva de los mandatos divinos revelados en la Escritura","Excluye toda referencia a Dios y a la inmortalidad del alma","Se funda en la razón, pero postula a Dios para pensar el bien supremo"],"correcta":2,"explicacion":"Religión dentro de los límites de la mera razón: reconocer los deberes como mandatos divinos; el bien supremo une virtud y felicidad. (Ladrillo de: 'Ética y religión')"},{"id":"et1-t091","tema":"Tema 8: Ética y religión","fuente":"pregunta:et1-p04","enunciado":"¿Qué hizo posible la secularización moderna en el terreno moral?","opciones":["Una moral racional válida para creyentes y no creyentes","La sustitución completa de la moral por la ciencia","La prohibición de la religión en el espacio público"],"correcta":0,"explicacion":"La emancipación de la tutela religiosa funda una ética laica universalista, condición del pluralismo democrático: ateísmo y moralidad no son incompatibles. (Ladrillo de: 'Ética y religión')"},{"id":"et1-t092","tema":"Tema 8: Ética y religión","fuente":"pregunta:et1-p04","enunciado":"Entre los maestros de la sospecha, ¿quién llamó a la religión 'opio del pueblo'?","opciones":["Feuerbach, como proyección de la esencia humana","Marx, como consuelo ideológico de la injusticia","Freud, como ilusión infantil y neurosis universal"],"correcta":1,"explicacion":"Cada crítica tiene su autor: Feuerbach (proyección), Marx (opio del pueblo), Nietzsche (muerte de Dios, moral de esclavos), Freud (ilusión). (Ladrillo de: 'Ética y religión')"},{"id":"et1-t093","tema":"Tema 8: Ética y religión","fuente":"pregunta:et1-p04","enunciado":"Según Horkheimer, ¿qué papel conserva la religión frente a la ética?","opciones":["Fundamento último y necesario de todas las normas morales","Obstáculo que impide plantear las preguntas por el sentido","Horizonte de esperanza en una justicia que la moral no garantiza"],"correcta":2,"explicacion":"Anhelo de que el verdugo no triunfe sobre la víctima inocente: la religión responde a preguntas límite (mal, muerte, sentido), no funda las normas. (Ladrillo de: 'Ética y religión')"},{"id":"et1-t094","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p05","enunciado":"El texto sobre acciones justas hechas 'como las haría el justo' pertenece a...","opciones":["Ética a Nicómaco, libro II: adquisición de la virtud por hábito","Ética a Nicómaco, libro X: la vida contemplativa","Ética a Nicómaco, libro VI: las virtudes dianoéticas"],"correcta":0,"explicacion":"El libro II expone que las virtudes éticas se adquieren por ejercicio, como las artes: somos capaces por naturaleza, virtuosos por costumbre. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco II')"},{"id":"et1-t095","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p05","enunciado":"¿Cómo resuelve Aristóteles la circularidad de que para obrar justamente haya que ser ya justo?","opciones":["Negando que la virtud se adquiera mediante la práctica","Distingue el acto conforme a virtud del acto hecho virtuosamente","Afirmando que la justicia es un don natural de algunos"],"correcta":1,"explicacion":"Nos hacemos justos realizando acciones justas: la virtud es una disposición estable (héxis) creada por repetición. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco II')"},{"id":"et1-t096","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p05","enunciado":"Además de hacer lo justo, el acto plenamente virtuoso exige...","opciones":["éxito en el resultado y aprobación de la ciudad","conocer la definición universal de la justicia","saber, elección por sí mismo y firmeza de carácter"],"correcta":2,"explicacion":"Las condiciones son saber lo que se hace, elegirlo por sí mismo (proaíresis) y obrar desde una disposición firme e inconmovible. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco II')"},{"id":"et1-t097","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p05","enunciado":"¿A quiénes critica Aristóteles en este pasaje del libro II?","opciones":["A los que se refugian en la teoría sin practicar la virtud","A los que practican la virtud sin saber definirla bien","A los sofistas que cobran por enseñar la excelencia"],"correcta":0,"explicacion":"El fin de la ética no es saber qué es la virtud, sino ser buenos: crítica al intelectualismo, pues conocer el bien no basta para obrar bien. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco II')"},{"id":"et1-t098","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p05","enunciado":"¿Con quién compara Aristóteles al que filosofa sin practicar?","opciones":["Con el arquero que dispara sin blanco al que apuntar","Con el enfermo que escucha al médico y no cumple el tratamiento","Con el flautista que ignora cuál es su función propia"],"correcta":1,"explicacion":"El paralelismo cuerpo-alma presenta la ética como terapéutica del alma: la salud moral exige práctica efectiva, no mera escucha de doctrinas. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco II')"},{"id":"et1-t099","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p05","enunciado":"¿En qué doctrinas aristotélicas se integra este pasaje del libro II?","opciones":["Teoría de las ideas y reminiscencia del alma","Imperativo categórico y autonomía de la voluntad","Término medio fijado por la recta razón y eudemonismo"],"correcta":2,"explicacion":"La felicidad es actividad conforme a la virtud, y la legislación de la pólis debe habituar a los ciudadanos al bien desde jóvenes. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco II')"},{"id":"et1-t100","tema":"Tema 2: La ética griega: Aristóteles","fuente":"pregunta:et1-p06","enunciado":"¿Por qué la ética aristotélica es teleológica y eudemonista?","opciones":["Toda acción tiende a un fin, y el fin último es la felicidad","El criterio moral es el deber incondicionado de la razón","El bien se define por el mandato de la ley de la ciudad"],"correcta":0,"explicacion":"El bien supremo se busca por sí mismo, es perfecto y autosuficiente: todos lo llaman felicidad, aunque discrepan sobre su contenido. (Ladrillo de: 'La ética griega: Aristóteles')"},{"id":"et1-t101","tema":"Tema 2: La ética griega: Aristóteles","fuente":"pregunta:et1-p06","enunciado":"Para Aristóteles, la felicidad es...","opciones":["el placer estable que acompaña a la buena fortuna","actividad del alma conforme a la virtud en una vida completa","el honor que reconocen los mejores ciudadanos"],"correcta":1,"explicacion":"Descarta placer, honores y riqueza; requiere además bienes exteriores y una vida entera: una golondrina no hace verano. (Ladrillo de: 'La ética griega: Aristóteles')"},{"id":"et1-t102","tema":"Tema 2: La ética griega: Aristóteles","fuente":"pregunta:et1-p06","enunciado":"¿Cuál es la función propia (ergon) del hombre?","opciones":["La producción de obras útiles para la comunidad","La conservación de la vida y de la propia especie","La actividad racional del alma, ejercida con excelencia"],"correcta":2,"explicacion":"Como el flautista o el escultor, el hombre tiene una función propia: el bien humano es la actividad del alma según su virtud más perfecta. (Ladrillo de: 'La ética griega: Aristóteles')"},{"id":"et1-t103","tema":"Tema 2: La ética griega: Aristóteles","fuente":"pregunta:et1-p06","enunciado":"¿Quién fija el término medio en que consiste la virtud ética?","opciones":["La recta razón, tal como lo decidiría el hombre prudente","La costumbre mayoritaria vigente en cada ciudad","El punto matemático equidistante de los dos extremos"],"correcta":0,"explicacion":"La virtud es una héxis adquirida por hábito, término medio relativo a nosotros; respecto del bien, la virtud es un extremo. (Ladrillo de: 'La ética griega: Aristóteles')"},{"id":"et1-t104","tema":"Tema 2: La ética griega: Aristóteles","fuente":"pregunta:et1-p06","enunciado":"Entre las virtudes dianoéticas, ¿qué hace la phrónesis?","opciones":["Contempla los primeros principios universales y necesarios","Delibera rectamente sobre lo bueno para el hombre","Calcula los medios técnicos para producir objetos"],"correcta":1,"explicacion":"Las dianoéticas (sophía, phrónesis) se adquieren por enseñanza; sin la prudencia, tratada en el libro VI, no hay virtud ética plena. (Ladrillo de: 'La ética griega: Aristóteles')"},{"id":"et1-t105","tema":"Tema 2: La ética griega: Aristóteles","fuente":"pregunta:et1-p06","enunciado":"Según el libro III, ¿qué funda la responsabilidad moral?","opciones":["La conformidad del acto con la ley de la ciudad","El resultado beneficioso o dañino de la acción","El carácter voluntario del acto y la elección deliberada"],"correcta":2,"explicacion":"Solo lo voluntario es alabable o censurable; la elección es deseo deliberado de lo que está a nuestro alcance: primera teoría de la imputabilidad. (Ladrillo de: 'La ética griega: Aristóteles')"},{"id":"et1-t106","tema":"Tema 2: La ética griega: Aristóteles","fuente":"pregunta:et1-p06","enunciado":"Según el libro X, la contemplación es la felicidad suprema porque...","opciones":["es la actividad más continua, autosuficiente y divina en nosotros","prescinde por completo de amigos, virtud ética y pólis","procura los mayores placeres corporales y honores públicos"],"correcta":0,"explicacion":"Aun así, el hombre feliz necesita también virtud ética, amigos y pólis: la ética culmina en la política y la educación. (Ladrillo de: 'La ética griega: Aristóteles')"},{"id":"et1-t107","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p07","enunciado":"La deducción de la fórmula de la ley universal se encuentra en...","opciones":["el capítulo primero de la Fundamentación","el capítulo segundo de la Fundamentación","la analítica de la Crítica de la razón práctica"],"correcta":1,"explicacion":"Kant pasa del conocimiento moral común a la filosofía moral y, tras clasificar los imperativos, muestra qué contiene el único imperativo propiamente moral. (Ladrillo de: 'Comentario de Kant, Fundamentación II — imperativo categórico')"},{"id":"et1-t108","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p07","enunciado":"¿Por qué no sé a priori qué contiene un imperativo hipotético?","opciones":["Porque su contenido es la mera forma de la ley universal","Porque manda incondicionadamente a toda voluntad racional","Su contenido depende de la condición: el fin que me sea dado"],"correcta":2,"explicacion":"Quien quiere el fin quiere los medios: los hipotéticos son analíticos respecto del querer del fin y valen solo condicionadamente. (Ladrillo de: 'Comentario de Kant, Fundamentación II — imperativo categórico')"},{"id":"et1-t109","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p07","enunciado":"¿Qué sé inmediatamente que contiene el imperativo categórico?","opciones":["Solo la necesidad de que la máxima se conforme a la ley universal","Los fines empíricos que toda voluntad desea de hecho","Los medios más adecuados para alcanzar la felicidad"],"correcta":0,"explicacion":"Al no estar limitado por condición alguna, solo queda la universalidad de una ley en general: la moralidad es pura forma universalizable. (Ladrillo de: 'Comentario de Kant, Fundamentación II — imperativo categórico')"},{"id":"et1-t110","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p07","enunciado":"¿En qué consiste el test moral kantiano de una máxima?","opciones":["Comprobar si sus consecuencias aumentan la felicidad general","Preguntar si puedo quererla como ley universal sin contradicción","Ver si coincide con lo que haría el hombre prudente"],"correcta":1,"explicacion":"Máxima: principio subjetivo del obrar; ley: principio objetivo para todo ser racional. La falsa promesa se autodestruye al universalizarse. (Ladrillo de: 'Comentario de Kant, Fundamentación II — imperativo categórico')"},{"id":"et1-t111","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p07","enunciado":"Frente a las éticas materiales, Kant funda la obligación moral en...","opciones":["los fines deseados por la naturaleza humana","la felicidad como fin real de todos los hombres","la mera forma legal universalizable del querer"],"correcta":2,"explicacion":"El imperativo categórico es único, incondicionado, formal y a priori; las demás fórmulas (humanidad, autonomía, reino de los fines) expresan el mismo principio. (Ladrillo de: 'Comentario de Kant, Fundamentación II — imperativo categórico')"},{"id":"et1-t112","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p07","enunciado":"¿A qué remite la posibilidad de un imperativo incondicionado?","opciones":["A la libertad como autonomía de la voluntad","A la existencia demostrada de Dios legislador","Al deseo universal de felicidad de los hombres"],"correcta":0,"explicacion":"Solo un imperativo incondicionado puede obligar moralmente; la razón práctica se da la ley a sí misma y funda la dignidad (capítulo tercero). (Ladrillo de: 'Comentario de Kant, Fundamentación II — imperativo categórico')"},{"id":"et1-t113","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p08","enunciado":"El pasaje sobre lo único que es 'bueno sin restricción' abre...","opciones":["el capítulo tercero de la Fundamentación","el capítulo primero de la Fundamentación","el prólogo de la Crítica de la razón pura"],"correcta":1,"explicacion":"Kant parte del conocimiento moral común: cualquiera reconoce que solo la buena voluntad es incondicionadamente buena; de ahí extraerá deber e imperativo. (Ladrillo de: 'Comentario de Kant, Fundamentación I — buena voluntad')"},{"id":"et1-t114","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p08","enunciado":"Para Kant, inteligencia, valor, poder o riqueza son...","opciones":["buenos sin restricción cuando producen felicidad efectiva","moralmente indiferentes en cualquier tipo de circunstancia","buenos solo condicionadamente: dependen de la voluntad que los usa"],"correcta":2,"explicacion":"Pueden volverse extraordinariamente malos y dañinos: la sangre fría de un malvado lo hace aún más abominable. (Ladrillo de: 'Comentario de Kant, Fundamentación I — buena voluntad')"},{"id":"et1-t115","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p08","enunciado":"¿Por qué la buena voluntad brillaría como una joya aunque nada lograse?","opciones":["Su valor está en el querer mismo, no en los resultados","Porque la fortuna acaba premiando siempre a la virtud","Porque sus efectos útiles la hacen digna de admiración"],"correcta":0,"explicacion":"El valor moral es independiente de resultados y utilidad: antípoda radical del consecuencialismo. (Ladrillo de: 'Comentario de Kant, Fundamentación I — buena voluntad')"},{"id":"et1-t116","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p08","enunciado":"Según Kant, el espectador razonable e imparcial no aprueba...","opciones":["la virtud de quien nunca alcanza la felicidad","la felicidad de quien carece de buena voluntad","el deber cumplido sin inclinación ni agrado"],"correcta":1,"explicacion":"La buena voluntad es la condición indispensable que nos hace dignos de ser felices: Kant invierte el eudemonismo. (Ladrillo de: 'Comentario de Kant, Fundamentación I — buena voluntad')"},{"id":"et1-t117","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p08","enunciado":"A diferencia de Aristóteles, Kant funda el carácter moral en...","opciones":["el hábito adquirido por la repetición de actos","el temperamento natural bien equilibrado","la determinación de la voluntad por la ley"],"correcta":2,"explicacion":"El carácter es la peculiar constitución de la voluntad que usa los dones de la naturaleza y la fortuna; ambos autores le dan primacía sobre las cualidades naturales. (Ladrillo de: 'Comentario de Kant, Fundamentación I — buena voluntad')"},{"id":"et1-t118","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p08","enunciado":"¿Qué prepara doctrinalmente este pasaje sobre la buena voluntad?","opciones":["El análisis del deber y el imperativo categórico","La clasificación de las virtudes dianoéticas","La demostración teórica de la existencia de Dios"],"correcta":0,"explicacion":"Buena voluntad es la que obra por deber, por respeto a la ley: la moralidad se juega en la máxima, no en los efectos. (Ladrillo de: 'Comentario de Kant, Fundamentación I — buena voluntad')"},{"id":"et1-t119","tema":"Tema 7: Ética y política","fuente":"pregunta:et1-p09","enunciado":"En Aristóteles, ¿qué relación guardan ética y política?","opciones":["La política es autónoma y se rige solo por la eficacia","La ética es parte de la política; el bien se realiza en la pólis","La ética individual basta sin referencia a la comunidad"],"correcta":1,"explicacion":"El hombre es animal político; la política, como saber arquitectónico, ordena los demás saberes al bien común. (Ladrillo de: 'Ética y Política')"},{"id":"et1-t120","tema":"Tema 7: Ética y política","fuente":"pregunta:et1-p09","enunciado":"¿Qué debe aprender el príncipe según Maquiavelo?","opciones":["A someter siempre el poder a la virtud cristiana","A deliberar con todos los afectados por sus leyes","A poder no ser bueno según lo exija la necesidad"],"correcta":2,"explicacion":"Maquiavelo autonomiza la política: razón de Estado y lógica del éxito en conquistar y conservar el poder, no la virtud moral. (Ladrillo de: 'Ética y Política')"},{"id":"et1-t121","tema":"Tema 7: Ética y política","fuente":"pregunta:et1-p09","enunciado":"Para Weber, el político maduro se guía por la ética de...","opciones":["la responsabilidad: pondera las consecuencias previsibles","la convicción: obra por principios, pase lo que pase","la legalidad: cumple las normas del ordenamiento"],"correcta":0,"explicacion":"Quien obra por pura convicción descarga en el mundo los resultados; el político asume medios moralmente peligrosos, incluida la violencia legítima del Estado. (Ladrillo de: 'Ética y Política')"},{"id":"et1-t122","tema":"Tema 7: Ética y política","fuente":"pregunta:et1-p09","enunciado":"¿Qué plantea el problema de las 'manos sucias'?","opciones":["Si los gobernantes corruptos deben quedar inhabilitados de por vida","Si la política exige a veces transgredir normas morales por fines valiosos","Si la moral debe desentenderse por completo de la vida política"],"correcta":1,"explicacion":"La reflexión ética busca límites entre el moralismo ingenuo y el cinismo realista: no todo vale, ni siquiera por buenas causas. (Ladrillo de: 'Ética y Política')"},{"id":"et1-t123","tema":"Tema 7: Ética y política","fuente":"pregunta:et1-p09","enunciado":"¿Qué corrientes refundamentan normativamente la política tras los totalitarismos?","opciones":["La razón de Estado y el realismo político clásico","El positivismo jurídico y la neutralidad valorativa","La justicia como equidad de Rawls y la ética discursiva"],"correcta":2,"explicacion":"Principios elegidos tras el velo de ignorancia, legitimidad por el diálogo de los afectados, derechos humanos como mínimos innegociables y democracia deliberativa. (Ladrillo de: 'Ética y Política')"},{"id":"et1-t124","tema":"Tema 7: Ética y política","fuente":"pregunta:et1-p09","enunciado":"¿Por qué legalidad no equivale a justicia?","opciones":["Las leyes positivas pueden ser injustas y exigir crítica moral","Las leyes justas nunca necesitan reforma ni revisión","La justicia se reduce a lo que las leyes establecen"],"correcta":0,"explicacion":"La moral es instancia crítica frente al poder (desobediencia civil, objeción de conciencia); a la vez, la ética necesita a la política para hacerse efectiva. (Ladrillo de: 'Ética y Política')"},{"id":"et1-t125","tema":"Tema 4: Ética y Psicología","fuente":"pregunta:et1-p10","enunciado":"¿Qué pregunta la ética que no responde la psicología moral?","opciones":["Por el desarrollo infantil de la conciencia moral","Por la validez de las normas, no solo por su funcionamiento","Por los mecanismos de la motivación y de la culpa"],"correcta":1,"explicacion":"Son perspectivas complementarias: una empírico-descriptiva, otra filosófico-normativa; la psicología informa sobre motivación, desarrollo y límites del agente. (Ladrillo de: 'Ética y Psicología')"},{"id":"et1-t126","tema":"Tema 4: Ética y Psicología","fuente":"pregunta:et1-p10","enunciado":"Explicar psicológicamente el origen de un juicio moral...","opciones":["demuestra que sus contenidos carecen de validez","basta para justificar racionalmente su validez","no lo fundamenta ni lo refuta: sería falacia genética"],"correcta":2,"explicacion":"El psicologismo reduce indebidamente la validez a los mecanismos psíquicos: génesis y justificación son cuestiones distintas. (Ladrillo de: 'Ética y Psicología')"},{"id":"et1-t127","tema":"Tema 4: Ética y Psicología","fuente":"pregunta:et1-p10","enunciado":"¿Cómo surge la instancia moral (super-yo) según Freud?","opciones":["Por identificación con la autoridad tras el complejo de Edipo","Por la maduración espontánea de la razón práctica","Por el acuerdo cooperativo entre iguales en el juego"],"correcta":0,"explicacion":"El super-yo interioriza las normas parentales y sociales; una moral demasiado severa genera culpa neurótica: cabe distinguir moral madura y moral patológica. (Ladrillo de: 'Ética y Psicología')"},{"id":"et1-t128","tema":"Tema 4: Ética y Psicología","fuente":"pregunta:et1-p10","enunciado":"¿Qué caracteriza al nivel posconvencional de Kohlberg?","opciones":["Obediencia por miedo al castigo y por interés","Contrato social y principios éticos universales","Conformidad con el grupo y con la ley y el orden"],"correcta":1,"explicacion":"Piaget y Kohlberg describen el desarrollo del juicio moral por estadios, de la heteronomía a la autonomía; el nivel superior es de corte kantiano. (Ladrillo de: 'Ética y Psicología')"},{"id":"et1-t129","tema":"Tema 4: Ética y Psicología","fuente":"pregunta:et1-p10","enunciado":"¿Qué objetó Gilligan a la escala de Kohlberg?","opciones":["Ignora la obediencia a la autoridad y al castigo","Sobrevalora las emociones frente a los principios","Privilegia la justicia abstracta e infravalora el cuidado"],"correcta":2,"explicacion":"La ética del cuidado atiende a la responsabilidad hacia los otros concretos, históricamente asociada a la experiencia moral femenina. (Ladrillo de: 'Ética y Psicología')"},{"id":"et1-t130","tema":"Tema 4: Ética y Psicología","fuente":"pregunta:et1-p10","enunciado":"¿Qué cuestiones fronterizas ilumina la psicología para la ética?","opciones":["Motivación, akrasía, emociones y condiciones de la responsabilidad","La fundamentación a priori del imperativo categórico","La clasificación sociológica de los códigos vigentes"],"correcta":0,"explicacion":"Explica por qué sabemos el bien y hacemos el mal, y el papel de emociones morales como la empatía, la culpa o la indignación. (Ladrillo de: 'Ética y Psicología')"},{"id":"et1-t131","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p11","enunciado":"¿Por qué las leyes de la razón se presentan al hombre como imperativos?","opciones":["Toda ley moral requiere la sanción social externa del grupo","Constriñen (Nötigung) a una voluntad no santa que puede no seguirlas","La voluntad humana es perfectamente racional y santa"],"correcta":1,"explicacion":"En la Fundamentación, capítulo segundo, los imperativos expresan la relación entre las leyes objetivas de la razón y una voluntad imperfecta. (Ladrillo de: 'Comentario de Kant, Fundamentación II — clasificación de los imperativos')"},{"id":"et1-t132","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p11","enunciado":"¿Cómo se subdividen los imperativos hipotéticos?","opciones":["Apodícticos (moralidad) y asertóricos (felicidad)","Formales (a priori) y materiales (empíricos)","Problemáticos (habilidad) y asertóricos (prudencia)"],"correcta":2,"explicacion":"Los de habilidad son reglas técnicas para fines posibles; los de prudencia, consejos para la felicidad, fin que todos tienen de hecho. (Ladrillo de: 'Comentario de Kant, Fundamentación II — clasificación de los imperativos')"},{"id":"et1-t133","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p11","enunciado":"El imperativo categórico representa la acción como...","opciones":["buena en sí misma, sin referencia a otro fin","medio necesario para lograr la propia felicidad","útil para fines que quizá queramos alcanzar"],"correcta":0,"explicacion":"Es apodíctico: manda incondicionadamente y obliga a toda voluntad racional con independencia de sus deseos e inclinaciones. (Ladrillo de: 'Comentario de Kant, Fundamentación II — clasificación de los imperativos')"},{"id":"et1-t134","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p11","enunciado":"En este pasaje, ¿qué funda los imperativos hipotéticos y qué el categórico?","opciones":["Lo bueno en sí, los primeros; lo meramente útil, el segundo","Lo bueno como medio, los primeros; lo bueno en sí, el segundo","La felicidad, los primeros; el placer sensible, el segundo"],"correcta":1,"explicacion":"Toda ley práctica representa la acción como buena y necesaria para un sujeto determinable por la razón: la distinción medios-fines articula el pasaje. (Ladrillo de: 'Comentario de Kant, Fundamentación II — clasificación de los imperativos')"},{"id":"et1-t135","tema":"Tema 3: Kant y la ética de la Modernidad (lectura obligatoria: Fundamentación)","fuente":"pregunta:et1-p11","enunciado":"¿Por qué no puede fundarse la moral en la felicidad, según Kant?","opciones":["Es un ideal exclusivo de los sabios","Se opone siempre al deseo natural humano","Es un concepto empírico e indeterminado"],"correcta":2,"explicacion":"Solo el categórico expresa la moralidad; el texto prepara la fórmula de la ley universal y la autonomía. (Ladrillo de: 'Comentario de Kant, Fundamentación II — clasificación de los imperativos')"},{"id":"et1-t136","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p12","enunciado":"El texto 'todo conocimiento y toda elección tienden a algún bien' pertenece a...","opciones":["Ética a Nicómaco, libro I: búsqueda del bien supremo","Ética a Nicómaco, libro II: la virtud como hábito","Ética a Nicómaco, libro VI: la prudencia"],"correcta":0,"explicacion":"El tratado se abre con la tesis teleológica: debe haber un fin último querido por sí mismo, o el deseo sería vacío e infinito. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco I')"},{"id":"et1-t137","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p12","enunciado":"¿Qué caracteriza al bien supremo aristotélico?","opciones":["Es un medio valioso para conseguir otros bienes mayores","Es fin último, perfecto y autosuficiente, querido por sí mismo","Es inalcanzable para el hombre y propio solo de los dioses"],"correcta":1,"explicacion":"Es objeto de la ciencia más arquitectónica, la política; conocerlo nos da, como a arqueros, un blanco al que apuntar. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco I')"},{"id":"et1-t138","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p12","enunciado":"¿En qué coinciden el vulgo y los sabios sobre el bien supremo?","opciones":["En identificarlo con el placer y con la riqueza","En que consiste en la contemplación teórica","En llamarlo felicidad: vivir bien y obrar bien"],"correcta":2,"explicacion":"El acuerdo verbal encubre el desacuerdo real sobre su contenido; la eudaimonía es la vida lograda, no un estado subjetivo pasajero. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco I')"},{"id":"et1-t139","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p12","enunciado":"¿Por qué descarta Aristóteles la vida de placer como felicidad?","opciones":["Es propia de esclavos; honores y riqueza también resultan insuficientes","Porque el placer es siempre malo y contrario a la virtud","Porque solo los dioses pueden gozar del placer verdadero"],"correcta":0,"explicacion":"Los honores dependen de quien los otorga y la riqueza es solo un medio; la respuesta final vendrá con el argumento del ergon. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco I')"},{"id":"et1-t140","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p12","enunciado":"¿Qué precisión cabe esperar en ética, según Aristóteles?","opciones":["La misma exactitud demostrativa que en la geometría","Solo la que admite la materia práctica, no la matemática","Ninguna: la ética es cuestión de mera opinión subjetiva"],"correcta":1,"explicacion":"El método parte de las opiniones acreditadas (éndoxa): recogerlas, depurarlas y superarlas dialécticamente. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco I')"},{"id":"et1-t141","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p12","enunciado":"¿Qué definición prepara este pasaje inicial del libro I?","opciones":["Virtud como conocimiento que basta para obrar bien","Placer como criterio último de toda elección humana","Felicidad como actividad del alma conforme a la virtud"],"correcta":2,"explicacion":"El texto anticipa la definición central del libro I y la teoría del término medio, y culmina en la vida contemplativa del libro X. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco I')"},{"id":"et1-t142","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p13","enunciado":"¿Cómo procede Aristóteles para caracterizar la prudencia en el libro VI?","opciones":["Observa a quienes de hecho llamamos prudentes","Deduce su definición desde principios necesarios","Analiza el significado del término en los poetas"],"correcta":0,"explicacion":"Procede empíricamente, partiendo de las opiniones comunes (éndoxa), en el libro dedicado a las virtudes dianoéticas. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco VI')"},{"id":"et1-t143","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p13","enunciado":"¿Sobre qué delibera bien el hombre prudente?","opciones":["Sobre medios parciales como la salud o el vigor físico","Sobre lo bueno y conveniente para vivir bien en general","Sobre lo universal, necesario e inmutable del cosmos"],"correcta":1,"explicacion":"No calcula medios para fines particulares: la prudencia mira al fin total de la existencia humana, la vida buena en su conjunto. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco VI')"},{"id":"et1-t144","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p13","enunciado":"¿Sobre qué versa la prudencia, a diferencia de la ciencia (epistéme)?","opciones":["Sobre lo universal y necesario, que no puede ser de otro modo","Sobre lo imposible, para excluirlo de toda deliberación","Sobre lo contingente y factible, lo que depende de nosotros"],"correcta":2,"explicacion":"No hay deliberación sobre lo necesario ni sobre lo imposible; su ámbito es la praxis, y se distingue también de la sophía teórica. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco VI')"},{"id":"et1-t145","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p13","enunciado":"¿Por qué la prudencia no es una técnica (téchne)?","opciones":["No produce objetos: es recta razón práctica sobre el bien humano","Porque produce obras externas más valiosas que la acción","Porque carece por completo de método y de reglas propias"],"correcta":0,"explicacion":"La poíesis tiene su fin fuera de sí (la obra); la praxis lo tiene en el propio obrar bien (eupraxía): hay prudencia donde no hay técnica. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco VI')"},{"id":"et1-t146","tema":"Tema 2: La ética griega: Aristóteles (lectura obligatoria: Ética a Nicómaco)","fuente":"pregunta:et1-p13","enunciado":"¿Qué función cumple la prudencia respecto de las virtudes éticas?","opciones":["Fija el fin de la virtud, mientras el hábito fija los medios","Determina su término medio; sin ella no hay virtud plena","Las contempla teóricamente sin intervenir en la acción"],"correcta":1,"explicacion":"La virtud ética hace recto el fin y la prudencia los medios: no cabe ser prudente sin ser bueno, ni plenamente bueno sin prudencia. Modelo: Pericles. (Ladrillo de: 'Comentario de Aristóteles, Ética a Nicómaco VI')"}]},{"id":"conocimiento1","nombre":"Teoría del Conocimiento I","nombreCorto":"T. Conocimiento","formatoExamen":"Examen presencial de desarrollo: se proponen 8 preguntas y el estudiante elige y responde 5. Duración: 120 minutos. Ningún material permitido. Criterios: exposición bien informada, clara, rigurosa, precisa y ajustada a lo preguntado; se valora no limitarse a la reproducción memorística. El examen aporta el 99% de la nota (nota mínima 5); la PEC optativa (comentarios de texto) suma hasta un 10% ponderado.","temas":["Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","Tema 6: El racionalismo: la razón como fuente de conocimiento","Tema 7: El empirismo: la experiencia como origen del conocimiento","Tema 8: El planteamiento trascendental de Kant"],"preguntas":[{"id":"tc1-p01","tipo":"desarrollo","enunciado":"La Dialéctica transcendental en Kant","variantes":["La 'Dialéctica transcendental' en Kant","Kant: la Dialéctica transcendental"],"apariciones":["2020 Feb-1","2022 Sep","2023 Feb-2","2023 Sep","2024 Feb-1","2024 Sep","2025 Feb-2","2025 Sep","2026 Feb-2"],"frecuencia":9,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Estudia la razón y sus inferencias: crítica de la metafísica tradicional como 'ilusión trascendental' inevitable.","x":"Es la segunda parte de la Lógica trascendental de la Crítica de la razón pura. La ilusión surge cuando la razón toma sus exigencias subjetivas de totalidad por conocimientos de objetos reales."},{"b":"La razón busca lo incondicionado más allá de la experiencia mediante tres Ideas: alma, mundo y Dios.","x":"A cada Idea corresponde una disciplina de la metafísica especial: psicología racional, cosmología racional y teología racional."},{"b":"Paralogismos: la psicología racional confunde el 'yo pienso' lógico con un alma substancial e inmortal.","x":"Del sujeto lógico de la apercepción no puede inferirse una substancia simple, idéntica e inmaterial: falta la intuición que llene el concepto."},{"b":"Antinomias: la cosmología racional cae en contradicciones (mundo finito/infinito, libertad/determinismo, etc.).","x":"Tesis y antítesis se demuestran con igual rigor. Kant las resuelve distinguiendo fenómeno y cosa en sí: por ejemplo, determinismo fenoménico compatible con libertad nouménica."},{"b":"Ideal de la razón: refuta las tres pruebas de la existencia de Dios (ontológica, cosmológica, físico-teológica).","x":"La clave es la crítica al argumento ontológico: la existencia no es un predicado real que pueda extraerse del concepto de ser perfectísimo."},{"b":"Las Ideas no constituyen objetos: tienen solo uso regulativo, orientan la investigación hacia la unidad sistemática."},{"b":"Conclusión: la metafísica dogmática no es ciencia; conocer exige aplicar las categorías a intuiciones sensibles."}]},{"id":"tc1-p02","tipo":"desarrollo","enunciado":"La teoría platónica de la reminiscencia","variantes":["La teoría de la reminiscencia en Platón","La doctrina platónica de la reminiscencia","La teoría platónica de la 'reminiscencia'"],"apariciones":["2020 Feb-1","2022 Feb-2","2023 Feb-1","2023 Sep","2024 Feb-2","2024 Sep","2026 Feb-1"],"frecuencia":7,"tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","bullets":[{"b":"Conocer es recordar (anámnesis): el alma contempló las Ideas antes de encarnarse en el cuerpo.","x":"El aprendizaje no introduce contenidos nuevos: actualiza un saber latente que el alma trae de su existencia anterior en el mundo inteligible."},{"b":"Presupone la inmortalidad y preexistencia del alma, herencia del orfismo y el pitagorismo."},{"b":"Menón: el esclavo 'descubre' verdades geométricas sin haberlas aprendido, solo interrogado; prueba del recuerdo.","x":"Sócrates no le enseña: le hace preguntas. Si el esclavo llega por sí mismo al teorema, es que el saber ya estaba en su alma."},{"b":"Responde a la paradoja de Menón: no se puede buscar ni lo que se sabe ni lo que se ignora por completo.","x":"La reminiscencia disuelve la paradoja erística: buscar es posible porque en cierto modo ya sabemos lo que buscamos, aunque olvidado."},{"b":"Fedón: las cosas sensibles imperfectas (iguales) evocan las Ideas perfectas (lo Igual en sí) ya conocidas.","x":"Percibir cosas aproximadamente iguales exige poseer previamente la noción de igualdad perfecta, que ninguna experiencia proporciona."},{"b":"Consecuencia: el conocimiento verdadero es a priori; los sentidos solo son ocasión del recuerdo, no su fundamento."}]},{"id":"tc1-p03","tipo":"desarrollo","enunciado":"La teoría aristotélica de las categorías","variantes":["La teoría de las categorías en Aristóteles","Las categorías en Aristóteles","La doctrina aristotélica de las categorías"],"apariciones":["2020 Feb-1","2022 Feb-2","2022 Sep","2023 Sep","2024 Feb-1","2025 Feb-1","2025 Sep"],"frecuencia":7,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"Las categorías son los géneros supremos del ser: los modos más generales en que algo es y se predica.","x":"Responden a la pregunta por las maneras irreductibles de decir 'es'. Toda predicación posible cae bajo alguna de ellas."},{"b":"'El ser se dice de muchas maneras': pluralismo ontológico frente a la univocidad eleática y la Idea platónica."},{"b":"Son diez: substancia y nueve accidentes (cantidad, cualidad, relación, lugar, tiempo, posición, posesión, acción, pasión)."},{"b":"La substancia (ousía) es la categoría primera: existe en sí; los accidentes solo existen en otro.","x":"Los accidentes remiten a la substancia como su soporte: hay unidad de referencia (pros hen) que evita la pura dispersión de sentidos del ser."},{"b":"Substancia primera: el individuo concreto (este hombre); substancia segunda: sus especies y géneros (hombre, animal)."},{"b":"Doble valor, lógico (formas de predicación) y ontológico (modos reales de ser): base del realismo aristotélico.","x":"Las estructuras del lenguaje y del pensamiento reflejan las estructuras de la realidad: por eso conocer mediante categorías es conocer el ser mismo."}]},{"id":"tc1-p04","tipo":"desarrollo","enunciado":"El nominalismo en la controversia medieval de los universales: Guillermo de Ockham","variantes":["El nominalismo de Guillermo de Ockham","El nominalismo en la controversia medieval sobre los universales","La controversia medieval de los universales: el nominalismo","La controversia de los universales: el nominalismo","El nominalismo en el problema medieval de los universales"],"apariciones":["2020 Feb-2","2022 Feb-2","2022 Sep","2023 Feb-1","2024 Feb-2","2025 Feb-2","2026 Feb-2"],"frecuencia":7,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Tesis: solo existen individuos; los universales no son cosas ni están en las cosas, son signos.","x":"Ni ante rem ni in re: fuera de la mente no hay nada universal. Lo universal es solo un modo de significar muchos individuos."},{"b":"Antecedente: Roscelino, el universal como 'flatus vocis' (mero soplo de voz, nombre)."},{"b":"Ockham: el universal es un concepto o término mental, signo natural que suple por muchos individuos (suppositio).","x":"En la proposición 'el hombre es mortal', 'hombre' no nombra una esencia: está en lugar de (supone por) cada hombre individual."},{"b":"Navaja de Ockham: no multiplicar los entes sin necesidad; las esencias universales son entidades superfluas."},{"b":"Conocimiento intuitivo del individuo existente como base; el conocimiento abstractivo elabora después conceptos generales.","x":"Se invierte el orden clásico: lo primero y más cierto es la captación directa del singular, no la esencia universal."},{"b":"Consecuencias: separación de fe y razón, crisis de la metafísica esencialista y de la escolástica.","x":"Si no hay esencias necesarias, las verdades teológicas no son demostrables racionalmente y la ciencia se reorienta hacia lo individual y empírico."},{"b":"Anticipa la modernidad: empirismo, atención al hecho singular y a la ciencia experimental."}]},{"id":"tc1-p05","tipo":"desarrollo","enunciado":"La reforma de Hume de la teoría tradicional de la causalidad","variantes":["La teoría de la causalidad en Hume","La teoría de la causalidad de Hume","La reforma de Hume de la doctrina tradicional de la causalidad","La reforma de la teoría tradicional de la causalidad en Hume","El conocimiento causal en Hume","La reforma humeana del concepto de 'causalidad'"],"apariciones":["2020 Feb-2","2022 Feb-2","2022 Sep","2023 Feb-2","2024 Feb-2","2025 Feb-2","2026 Feb-2"],"frecuencia":7,"tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","bullets":[{"b":"Doctrina tradicional: la causa produce necesariamente su efecto; la razón conoce a priori esa conexión.","x":"Es el supuesto del racionalismo y de la metafísica clásica: la causalidad como vínculo real, necesario y demostrable."},{"b":"Crítica: en la experiencia solo observamos contigüidad, sucesión temporal y conjunción constante; nunca la conexión necesaria."},{"b":"Aplicación del principio de copia: no hay impresión de la 'conexión necesaria'; la idea no procede de los objetos.","x":"Toda idea legítima deriva de una impresión. Analizada la causalidad, la impresión correspondiente no está en lo observado sino en la mente."},{"b":"Origen real: el hábito o costumbre; tras repetirse la conjunción, la mente pasa esperadamente de la causa al efecto.","x":"La necesidad causal es una determinación subjetiva de la mente proyectada sobre los objetos, no una propiedad del mundo."},{"b":"La inferencia causal no es conocimiento demostrativo sino creencia (belief): idea avivada por la impresión presente."},{"b":"Consecuencia escéptica: las cuestiones de hecho y la ciencia empírica pierden fundamento racional; su base es psicológica.","x":"No podemos justificar racionalmente que el futuro se parecerá al pasado; la naturaleza humana, no la razón, sostiene nuestra vida cognoscitiva."}]},{"id":"tc1-p06","tipo":"desarrollo","enunciado":"Etapas de la relación entre razón y fe en la Edad Media","variantes":["Las cuatro etapas del conflicto razón/fe","Fe y razón en la Edad Media","Razón y fe en la Edad Media","El conflicto de 'razón' y 'fe' en la Edad Media","Etapas de la relación razón y fe en la Edad Media"],"apariciones":["2020 Feb-2","2023 Feb-1","2023 Sep","2024 Feb-2","2024 Sep","2025 Feb-1"],"frecuencia":6,"tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","bullets":[{"b":"Problema central medieval: articular la herencia racional griega (filosofía) con la revelación cristiana (fe).","x":"Ambas pretenden la verdad última sobre Dios, el mundo y el hombre; la Edad Media ensaya sucesivos modos de compatibilizarlas."},{"b":"Primera etapa, identificación agustiniana: 'creo para entender'; la fe guía e ilumina a la razón, sin conflicto.","x":"En la Patrística y San Agustín la filosofía es sierva y auxiliar de la fe: la verdadera filosofía coincide con la verdadera religión."},{"b":"Segunda etapa, armonía tomista: razón y fe son distintas pero concordes; la filosofía, preámbulo de la fe.","x":"Tomás distingue verdades naturales demostrables (existencia de Dios) y misterios sobrenaturales (Trinidad); no puede haber contradicción real porque ambas vienen de Dios."},{"b":"Tercera etapa, averroísmo latino y 'doble verdad': lo verdadero en filosofía puede contradecir la teología.","x":"Siger de Brabante defiende conclusiones aristotélicas (eternidad del mundo, entendimiento único) contrarias al dogma; condena de 1277."},{"b":"Cuarta etapa, separación ockhamista: las verdades de fe no son racionalmente demostrables; fe y razón se independizan."},{"b":"Resultado: la separación final emancipa la razón y prepara la ciencia y la filosofía modernas autónomas."}]},{"id":"tc1-p07","tipo":"desarrollo","enunciado":"Las dos clases de conocimiento en Hume (conocimiento intuitivo y demostrativo; relaciones de ideas y cuestiones de hecho)","variantes":["Conocimiento intuitivo y conocimiento demostrativo en Hume","Las clases de conocimiento en Hume","Las dos clases de conocimiento en Hume"],"apariciones":["2022 Feb-1","2023 Feb-1","2024 Feb-1","2024 Sep","2025 Sep","2026 Feb-1"],"frecuencia":6,"tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","bullets":[{"b":"Base: todas las percepciones son impresiones (vivaces) o ideas (copias débiles); toda idea deriva de impresiones.","x":"Es el principio de copia, criterio empirista de significado: una supuesta idea sin impresión de origen es un término vacío."},{"b":"Dos objetos posibles del conocimiento: relaciones de ideas y cuestiones de hecho ('tenedor de Hume')."},{"b":"Relaciones de ideas: matemáticas; verdades necesarias y a priori, ciertas pero que no informan sobre el mundo.","x":"Su negación implica contradicción. Se conocen por mera operación del pensamiento, sin depender de que exista nada en el universo."},{"b":"Dentro de ellas: conocimiento intuitivo (relaciones captadas de inmediato: semejanza, grados de cualidad) y demostrativo (cadenas de intuiciones: cantidad y número).","x":"La demostración solo alcanza certeza en matemáticas, donde las relaciones dependen únicamente de las ideas comparadas."},{"b":"Cuestiones de hecho: contingentes y a posteriori; su contrario siempre es posible; se fundan en la relación causa-efecto.","x":"Que el sol no salga mañana no es contradictorio. Más allá de la percepción presente y la memoria, todo conocimiento fáctico descansa en la causalidad, es decir, en el hábito."},{"b":"Conclusión crítica: la metafísica, que no contiene razonamiento abstracto ni empírico, debe 'arrojarse a las llamas'."}]},{"id":"tc1-p08","tipo":"desarrollo","enunciado":"La Estética transcendental en Kant","variantes":[],"apariciones":["2020 Feb-1","2022 Feb-1","2023 Feb-1","2023 Sep","2024 Sep","2025 Feb-1"],"frecuencia":6,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Primera parte de la Crítica: estudia la sensibilidad, facultad receptiva de intuiciones, y sus formas a priori.","x":"'Estética' en sentido etimológico (aísthesis, sensación), no artístico. Busca los elementos a priori que la sensibilidad aporta al conocimiento."},{"b":"Espacio y tiempo son formas puras de la intuición: condiciones a priori de posibilidad de toda experiencia.","x":"No derivan de la experiencia sino que la hacen posible: nada puede aparecernos si no es ordenado espacio-temporalmente."},{"b":"No son conceptos ni realidades en sí ni relaciones entre cosas: son intuiciones puras del sujeto."},{"b":"Espacio: forma del sentido externo; tiempo: forma del sentido interno y, mediatamente, de todos los fenómenos."},{"b":"Idealidad trascendental y realidad empírica: no valen para cosas en sí, valen universalmente para todo fenómeno."},{"b":"Fundan los juicios sintéticos a priori de la matemática: geometría sobre el espacio, aritmética sobre el tiempo."},{"b":"Consecuencia capital: conocemos fenómenos (lo que aparece bajo espacio y tiempo), no cosas en sí."}]},{"id":"tc1-p09","tipo":"de
