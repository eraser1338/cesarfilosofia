suadir a una audiencia de una conclusión, independientemente de que esté realmente justificada."],"correcta":0,"explicacion":"Razonar es un proceso epistémico: pasar de unas creencias (premisas) a otras (conclusiones) buscando justificación. No requiere debate ni audiencia (b) y se distingue de la mera retórica persuasiva (c) por su orientación a la corrección."},{"id":"pc1-p74","tipo":"test","enunciado":"Los modelos científicos tienen valor explicativo...","variantes":[],"apariciones":["2024 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Cuando están bien planteados.","b) Cuando son modelos matemáticos, físicos o conceptuales.","c) Cuando no es posible abordar los fenómenos de ninguna otra manera."],"correcta":0,"explicacion":"Lo que da valor explicativo a un modelo es su buena construcción: captar los factores relevantes del fenómeno pese a idealizar. El tipo de modelo (b) es una mera clasificación que no garantiza nada, y c) impone una condición de exclusividad innecesaria."},{"id":"pc1-p75","tipo":"test","enunciado":"¿Cuál es la relación entre el verificacionismo y el problema de la inducción?","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) El verificacionismo logra solventar el problema de la inducción.","b) El verificacionismo es susceptible al problema de la inducción.","c) El verificacionismo, al rechazar el inductivismo, no tiene ninguna relación con el problema de la inducción."],"correcta":1,"explicacion":"Verificar hipótesis generales a partir de observaciones particulares es un procedimiento inductivo, y hereda por tanto el problema de Hume: ninguna acumulación de casos verifica concluyentemente una ley universal. Esta debilidad fue una de las razones de la propuesta falsacionista de Popper."},{"id":"pc1-p76","tipo":"test","enunciado":"Según el constructivismo social:","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Todo el conocimiento científico es fraudulento.","b) La ciencia no tiene una posición privilegiada frente a otros fenómenos como la magia o la mitología.","c) No es posible de ninguna manera explicar el funcionamiento de la ciencia."],"correcta":1,"explicacion":"El constructivismo social (programa fuerte, Bloor; Knorr Cetina; Latour) analiza la ciencia como un producto social más, con el principio de simetría: se explica igual que otras creencias (magia, mito), sin concederle privilegio epistémico a priori. No afirma que la ciencia sea fraude (a) ni renuncia a explicarla (c): precisamente la estudia sociológicamente."},{"id":"pc1-p77","tipo":"test","enunciado":"¿Cuál es la relación entre probabilidad e incertidumbre?","variantes":[],"apariciones":["2024 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Solo puede tomarse como probable un evento si se sabe con certeza que sucederá.","b) La probabilidad asignada a un evento refleja la incertidumbre acerca de si dicho evento ocurrirá.","c) La probabilidad asignada a un evento es 0 cuando existe incertidumbre acerca de si dicho evento ocurrirá."],"correcta":1,"explicacion":"La probabilidad es justamente la medida graduada de la incertidumbre: valores entre 0 y 1 expresan cuán probable consideramos el evento dada la evidencia. La a) es contradictoria (certeza y probabilidad intermedia) y la c) confunde incertidumbre con imposibilidad."},{"id":"pc1-p78","tipo":"test","enunciado":"¿En qué consiste el problema de la demarcación?","variantes":[],"apariciones":["2024 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Determinar cuáles son los límites éticos de la actividad científica.","b) Comprender adecuadamente las implicaciones filosóficas de la ciencia.","c) La búsqueda de criterios para distinguir lo científico de lo no científico."],"correcta":2,"explicacion":"Así lo bautizó Popper: encontrar un criterio que separe la ciencia empírica de la no-ciencia, la pseudociencia o la metafísica. No es una cuestión de ética de la investigación (a) ni un problema genérico de interpretación filosófica (b)."},{"id":"pc1-p79","tipo":"test","enunciado":"¿Qué es un argumento?","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Un argumento es una proposición que se usa como premisa en un razonamiento.","b) Un argumento es una secuencia de proposiciones, constituida por un conjunto de premisas de las que se siguen ciertas conclusiones.","c) Un argumento es una proposición verdadera."],"correcta":1,"explicacion":"Un argumento es una estructura completa premisas-conclusión, no una proposición suelta (a) ni una proposición verdadera (c): hay argumentos con premisas y conclusiones falsas."},{"id":"pc1-p80","tipo":"test","enunciado":"Según el giro social de la filosofía de la ciencia...","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) El criterio de demarcación será algo que dependa de los valores y de los aspectos contextuales que determinan el paradigma científico dominante.","b) No existe realmente ningún enunciado ni ninguna teoría que pueda ser considerada como científica, pues todo está determinado socialmente.","c) Decidir si algo es científico o no es una cuestión personal, pues dependerá de los criterios individuales e inconmensurables de cada uno de los científicos particulares."],"correcta":0,"explicacion":"Tras Kuhn, el giro social entiende que qué cuenta como científico depende del paradigma dominante y de valores y factores contextuales de la comunidad. No niega la existencia de ciencia (b) ni reduce la demarcación a una decisión individual (c): es una cuestión comunitaria."},{"id":"pc1-p81","tipo":"test","enunciado":"¿Cuándo los discursos no-científicos se enfrentan al discurso científico?","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Cuando los asumen los científicos.","b) Cuando son aceptados por un gran número de personas.","c) Cuando son pseudocientíficos o anticientíficos."],"correcta":2,"explicacion":"La no-ciencia (arte, religión no literalista) puede convivir con la ciencia sin conflicto; el enfrentamiento surge cuando compite con ella haciéndose pasar por ciencia (pseudociencia) o atacándola (anticiencia). La popularidad (b) o quién los asuma (a) no determinan el conflicto."},{"id":"pc1-p82","tipo":"test","enunciado":"Una hipótesis para la que no tenemos evidencia:","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) No puede plantearse como hipótesis científica, ya que carece de apoyo evidencial.","b) Es una hipótesis que ha quedado refutada empíricamente.","c) Puede ser una hipótesis verdadera."],"correcta":2,"explicacion":"Verdad y apoyo evidencial son independientes: una conjetura sin evidencia todavía puede ser verdadera (y contrastarse después). Carecer de evidencia no impide proponerla como hipótesis (a) ni equivale a haber sido refutada (b), que exige evidencia en contra."},{"id":"pc1-p83","tipo":"test","enunciado":"¿Cuándo queda refutada una hipótesis general universal?","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Una hipótesis general universal queda refutada por la observación de un solo contraejemplo.","b) Una hipótesis general universal queda refutada solo si no se cumple en ningún caso observado.","c) Para que una hipótesis general universal quede refutada, ha de cumplirse en todo caso observado."],"correcta":0,"explicacion":"'Todos los A son B' es incompatible con un solo A que no sea B: un contraejemplo basta lógicamente para refutarla (asimetría entre verificación y falsación). La b) exige demasiado y la c) describe la confirmación, no la refutación."},{"id":"pc1-p84","tipo":"test","enunciado":"¿Qué quiere decir que una hipótesis sea falsable o refutable empíricamente?","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Para que una hipótesis sea falsable empíricamente debe haber evidencia empírica disponible que muestre su falsedad.","b) Para que una hipótesis sea falsable empíricamente debe estar apoyada por la evidencia empírica disponible.","c) Para que una hipótesis sea falsable empíricamente debe existir la posibilidad de que surja evidencia empírica que la refute."],"correcta":2,"explicacion":"Falsabilidad es una propiedad modal: basta que sea posible una observación que refutara la hipótesis. No exige que ya exista evidencia en contra (a, eso sería estar falsada) ni tiene que ver con estar apoyada (b)."},{"id":"pc1-p85","tipo":"test","enunciado":"El conocimiento que se transmite dentro de un paradigma:","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Es siempre explícito.","b) Es frecuentemente tácito.","c) Es necesariamente verdadero."],"correcta":1,"explicacion":"Kuhn (siguiendo a Polanyi) subraya que buena parte del saber paradigmático se transmite tácitamente: mediante ejemplares, práctica y entrenamiento, no solo reglas explícitas. Y desde luego no es necesariamente verdadero: los paradigmas se abandonan."},{"id":"pc1-p86","tipo":"test","enunciado":"La cuantificación de la observación:","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Permite comparar con precisión observaciones realizadas por distintos observadores.","b) Elimina la posibilidad de error en la observación.","c) Imposibilita la reproducción de las observaciones científicas."],"correcta":0,"explicacion":"Expresar las observaciones en números (mediciones) las hace comparables y comunicables con precisión entre investigadores, favoreciendo la reproducibilidad (contra c). Pero no elimina el error (b): toda medición tiene margen de error."},{"id":"pc1-p87","tipo":"test","enunciado":"Los estudios de replicación y los resultados negativos:","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) Tienen una función principalmente pedagógica, puesto que no aportan evidencia novedosa.","b) Son el tipo de estudio más frecuente en las publicaciones científicas, ya que requieren menos recursos que la obtención de resultados positivos.","c) Son esenciales para comprobar la fiabilidad de los resultados científicos."],"correcta":2,"explicacion":"Replicaciones y resultados negativos son el control de calidad de la ciencia: detectan falsos positivos, fraudes y sesgos. No son meramente pedagógicos (a) y, de hecho, están infrarrepresentados en las revistas por el sesgo de publicación (contra b)."},{"id":"pc1-p88","tipo":"test","enunciado":"¿Qué es una aproximación?","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Una hipótesis provisional que todavía no ha sido sometida a comprobación empírica.","b) Un resultado inexacto o incorrecto, pero suficientemente cercano a la respuesta correcta.","c) Un resultado impreciso expresado probabilísticamente, de forma que se refleje adecuadamente la incertidumbre del investigador."],"correcta":1,"explicacion":"Una aproximación es un valor o modelo estrictamente inexacto pero lo bastante cercano al correcto para los fines en juego (p. ej., g = 9,8). No es una hipótesis sin contrastar (a) ni se define por su expresión probabilística (c): imprecisión y aproximación son nociones distintas."},{"id":"pc1-p89","tipo":"test","enunciado":"¿Por qué es deseable tomar en consideración el conocimiento científico a la hora de tomar decisiones prácticas?","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) El conocimiento científico basado en evidencia ayuda a tomar decisiones informadas, ya que nos permite averiguar con rigor cuáles serán las consecuencias de nuestras decisiones y qué opciones ofrecen mayor probabilidad de alcanzar nuestros objetivos.","b) El conocimiento científico es irrelevante a la hora de tomar decisiones prácticas, porque no tiene en cuenta nuestros intereses y valores como agentes.","c) El conocimiento científico solo será útil a la hora de tomar decisiones para aquellos agentes que compartan los valores e intereses de la comunidad científica."],"correcta":0,"explicacion":"La ciencia informa sobre las consecuencias probables de nuestras opciones, sean cuales sean nuestros valores: por eso es útil a cualquier agente. Las opciones b) y c) confunden el papel instrumental del conocimiento (medios) con la elección de fines, que sí corresponde a los valores del agente."},{"id":"pc1-p90","tipo":"test","enunciado":"¿Qué es la revisión por pares?","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) La exigencia de que un artículo científico esté firmado por al menos dos autores.","b) El proceso editorial mediante el cual los artículos científicos enviados a una revista son revisados por otros investigadores antes de ser publicados.","c) El compromiso adquirido por los autores de un artículo científico de no publicar evidencia manipulada o ideas plagiadas a otros investigadores."],"correcta":1,"explicacion":"La revisión por pares (peer review) es el filtro editorial en que expertos independientes evalúan calidad, rigor y originalidad del manuscrito antes de su publicación. No tiene que ver con el número de autores (a) ni es un mero compromiso ético (c)."},{"id":"pc1-p91","tipo":"test","enunciado":"¿Qué es un experimento controlado?","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Un experimento cuyo resultado puede predecirse con suficiente certeza.","b) Un experimento realizado en el laboratorio con suficientes condiciones de seguridad, eliminando de este modo posibles riesgos para los experimentadores.","c) Un experimento en el que se examinan los efectos de manipular una variable del sistema estudiado, evitando posibles interferencias debidas a alteraciones en otras variables del sistema."],"correcta":2,"explicacion":"'Controlado' se refiere al control de variables: se manipula la variable de interés manteniendo constantes (o aleatorizando) las demás, para aislar su efecto causal. No alude a la predictibilidad del resultado (a) ni a la seguridad física (b)."},{"id":"pc1-p92","tipo":"test","enunciado":"Las generalizaciones inductivas:","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Presuponen que existe suficiente uniformidad entre casos observados y casos semejantes no observados, de modo que los casos no observados se comportarán como los ya observados.","b) Presuponen que no quedan casos particulares sin observar.","c) Presuponen que la verdad de la conclusión inductiva está garantizada necesariamente por la verdad de las premisas."],"correcta":0,"explicacion":"La inducción descansa en el principio de uniformidad de la naturaleza: lo no observado se comportará como lo observado (supuesto que Hume mostró injustificable sin circularidad). No presupone haber observado todo (b) ni garantía deductiva (c): eso negaría su carácter inductivo."},{"id":"pc1-p93","tipo":"test","enunciado":"¿Cuál es el papel de los expertos en ciencia?","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","opciones":["a) En la ciencia no hay lugar para la idea de experto y autoridad, ya que toda opinión cuenta por igual.","b) Los expertos científicos son investigadores cuyas opiniones acerca de ciertas cuestiones científicas son generalmente fiables.","c) Las opiniones de los expertos científicos no pueden ser cuestionadas racionalmente, ya que constituyen el conocimiento aceptado dentro de un paradigma."],"correcta":1,"explicacion":"La pericia confiere fiabilidad general, no infalibilidad: es razonable confiar en los expertos dentro de su ámbito, pero sus opiniones siguen siendo cuestionables racionalmente (contra c). Y en ciencia no todas las opiniones pesan igual (contra a): cuenta la competencia y la evidencia."},{"id":"pc1-p94","tipo":"test","enunciado":"La observación científica:","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Tiene un carácter esencialmente privado e incomunicable.","b) Solo es una fuente de evidencia aceptable científicamente si es accesible a distintos científicos.","c) Nunca es reproducible, ya que se realiza en condiciones especiales no repetibles."],"correcta":1,"explicacion":"La evidencia científica ha de ser pública e intersubjetiva: accesible y comprobable por distintos investigadores (como logró Galileo con el telescopio). Las opciones a) y c) niegan la publicidad y reproducibilidad que definen la observación científica."},{"id":"pc1-p95","tipo":"test","enunciado":"¿Cuando proponemos una hipótesis, hemos de creer que es verdadera?","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","opciones":["a) Proponer p como una hipótesis implica considerar que p es una posibilidad abierta (las hipótesis son conjeturas).","b) Proponer p como una hipótesis implica creer que p es verdad.","c) Proponer p como una hipótesis implica creer que p es falsa."],"correcta":0,"explicacion":"Una hipótesis es una conjetura que se plantea para someterla a prueba: basta considerarla posible. No exige creerla verdadera (b) ni falsa (c); esa neutralidad es lo que permite contrastarla honestamente."},{"id":"pc1-p96","tipo":"test","enunciado":"¿Qué es la muestra estadística?","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Las conclusiones finales alcanzadas mediante análisis estadísticos.","b) El conjunto de casos de una población sobre los que se tiene datos, y a partir del cual se realizan inferencias estadísticas acerca de la población en su totalidad.","c) Un caso empleado como ejemplo en un razonamiento estadístico."],"correcta":1,"explicacion":"La muestra es el subconjunto observado de la población desde el que la estadística inferencial generaliza. No son las conclusiones (a) ni un ejemplo aislado (c); su representatividad es clave para evitar sesgos."},{"id":"pc1-p97","tipo":"test","enunciado":"¿Cuándo se dice que hay una correlación estadística entre dos variables (por ejemplo, altura y peso)?","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","opciones":["a) Cuando, analizando estadísticamente un conjunto de datos, se observa una relación entre los valores de las dos variables (por ejemplo, los valores de una de las variables aumentan cuando lo hacen los de la otra).","b) Cuando, analizando estadísticamente un conjunto de datos, no se observa ninguna relación entre los valores de las dos variables (los valores de una variable son independientes de los valores de la otra).","c) Cuando, analizando estadísticamente un conjunto de datos, se observa que ambas variables adoptan siempre el mismo valor constante."],"correcta":0,"explicacion":"Hay correlación cuando los valores de las variables covarían sistemáticamente (positiva o negativamente). La b) describe independencia (ausencia de correlación) y la c) valores constantes, que no definen correlación."},{"id":"pc1-p98","tipo":"desarrollo","enunciado":"Texto de Galileo (Carta a Cristina de Lorena) sobre la interpretación de las Escrituras y las 'conclusiones naturales'. Pregunta 1: ¿Cuál es el papel de la evidencia y la experiencia en la investigación científica sobre el mundo empírico (lo que Galileo llama cuestiones naturales)? Pregunta 2: Explica brevemente cómo entiende Galileo la relación entre ciencia y autoridad religiosa.","variantes":[],"apariciones":["2020 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"En cuestiones naturales, la autoridad última es la evidencia: 'la experiencia de los sentidos y las demostraciones necesarias'.","x":"Para Galileo, sobre el mundo empírico deciden la observación y la demostración, no los textos ni la tradición. Es un manifiesto temprano del empirismo científico moderno."},{"b":"La evidencia empírica es pública y contrastable; la interpretación de textos es discutible y variable.","x":"Galileo subraya que las Escrituras admiten interpretaciones divergentes y que no todos los intérpretes hablan por inspiración; la evidencia empírica, en cambio, obliga a cualquier observador."},{"b":"'Dos verdades no pueden contradecirse': si la ciencia demuestra algo, hay que reinterpretar la Escritura, no negar la ciencia.","x":"Galileo no rechaza la religión: sostiene que su fin es distinto ('cómo se va al cielo, no cómo va el cielo'), y que ante conflicto aparente, el pasaje bíblico debe leerse de modo compatible con lo demostrado."},{"b":"La autoridad religiosa no debe comprometer los textos sagrados fijando conclusiones empíricas refutables.","x":"Sería imprudente ligar la fe a afirmaciones sobre la naturaleza que la evidencia futura puede desmentir: eso dañaría a la propia religión."},{"b":"Anticipa la separación de dominios ciencia/religión, emparentada con el NOMA de Gould y con la autonomía de la ciencia."}]},{"id":"pc1-p99","tipo":"desarrollo","enunciado":"Texto de Stephen Jay Gould (Ciencia versus religión) sobre el principio de los 'magisterios que no se superponen' (NOMA). Pregunta 1: ¿Por qué considera Gould que ciencia y religión no pueden unificarse? ¿Cómo propone que se aborde la relación entre ambos discursos? Pregunta 2: Explica cómo se podría aplicar este principio para el caso del Creacionismo.","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"Ciencia y religión tienen objetos distintos: hechos y teorías sobre el mundo natural vs fines, significados y valores.","x":"Por eso no pueden unificarse bajo un plan común de explicación: responden a preguntas de tipo diferente, con métodos y criterios diferentes."},{"b":"Propuesta NOMA: magisterios que no se superponen; no interferencia respetuosa acompañada de diálogo entre ambos dominios.","x":"Cada magisterio es un dominio legítimo de autoridad docente. Ninguno debe dictar conclusiones en el terreno del otro: la ciencia no resuelve cuestiones de valor y la religión no fija hechos empíricos."},{"b":"No hay conflicto necesario: ambos cubren facetas fundamentales y complementarias de la existencia humana."},{"b":"El creacionismo viola el NOMA: usa la autoridad religiosa para afirmar tesis empíricas (origen de las especies, edad de la Tierra).","x":"Al invadir el magisterio de la ciencia, entra en conflicto con la evidencia (evolución, geología). Desde el NOMA, la religión puede hablar del sentido de la creación, pero no negar hechos científicos."},{"b":"Aplicación: la evolución pertenece a la ciencia; la religión conserva su ámbito de valores; el creacionismo 'científico' es ilegítimo.","x":"El NOMA permite ser religioso y aceptar la evolución; lo que excluye es presentar el relato religioso como teoría científica alternativa, como hace el creacionismo y el diseño inteligente."}]},{"id":"pc1-p100","tipo":"desarrollo","enunciado":"Texto de Rowbotham sobre el experimento (legendario) de Galileo en la torre de Pisa contra el axioma aristotélico de la caída de los cuerpos. Pregunta 1: Explica la actitud científica ante la tradición, a la luz del ejemplo de Galileo. Pregunta 2: ¿Por qué es importante que el experimento de Galileo fuese público y pudiese ser repetido por otros?","variantes":[],"apariciones":["2022 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","bullets":[{"b":"La ciencia no acepta creencias por su antigüedad o por la autoridad que las respalda: exige contrastación empírica.","x":"El axioma de Aristóteles se aceptó durante siglos sin ponerse a prueba. La actitud científica de Galileo consiste en tratar toda creencia heredada como hipótesis revisable frente a la evidencia."},{"b":"La tradición no es evidencia: los argumentos de autoridad tienen un valor epistémico muy limitado.","x":"Que 'siempre se haya creído' algo no es prueba de su verdad. La evidencia observacional y experimental prevalece sobre la tradición cuando entran en conflicto."},{"b":"Galileo diseña un experimento: manipula la situación (dos pesos distintos, misma caída) para someter la hipótesis a prueba.","x":"En lugar de discutir textos, produce una observación decisiva: si Aristóteles tuviera razón, la bola pesada llegaría antes; ambas llegan a la vez, refutando la hipótesis tradicional."},{"b":"El carácter público permite el control intersubjetivo: los testigos no dependen de la palabra de Galileo.","x":"La evidencia científica ha de ser accesible a cualquier observador competente; así se evita el fraude, el error individual y la ilusión."},{"b":"La repetibilidad permite detectar errores y sesgos, y convierte el resultado en evidencia utilizable por toda la comunidad.","x":"Un resultado irrepetible carece de valor probatorio: la replicación es la garantía de fiabilidad de la observación científica."}]},{"id":"pc1-p101","tipo":"desarrollo","enunciado":"Texto de Popper (Lógica de la investigación científica, p. 33) sobre la contrastación deductiva de teorías. Pregunta 1: ¿Cuál es la diferencia entre 'verificar' y 'falsar' un enunciado, según Popper? Pregunta 2: ¿Por qué dice Popper que 'una decisión positiva puede apoyar a la teoría examinada solo temporalmente'?","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"Verificar sería establecer concluyentemente la verdad de un enunciado; falsar es mostrar su falsedad mediante un contraejemplo.","x":"De la teoría se deducen predicciones contrastables; si fallan, la teoría queda falsada por modus tollens. Si aciertan, solo queda corroborada provisionalmente."},{"b":"Asimetría lógica: ningún número de casos favorables verifica una ley universal, pero un contraejemplo la refuta.","x":"'Todos los cisnes son blancos' no se prueba con miles de cisnes blancos, pero un cisne negro la falsa. Por eso Popper sustituye la verificación por la falsabilidad como criterio."},{"b":"El apoyo es temporal porque la teoría sigue expuesta a futuras contrastaciones que podrían falsarla.","x":"Superar un test solo significa 'no hemos encontrado razones para desecharla por esta vez'. La corroboración no aumenta la probabilidad de verdad definitiva de la teoría."},{"b":"El conocimiento científico es conjetural y falible: conjeturas y refutaciones, nunca certeza definitiva.","x":"La ciencia progresa eliminando errores: proponiendo hipótesis audaces y sometiéndolas a tests severos, no acumulando verificaciones."},{"b":"Trasfondo: el problema de la inducción de Hume hace imposible la verificación concluyente de leyes generales."}]},{"id":"pc1-p102","tipo":"desarrollo","enunciado":"Viñeta humorística: 'No des por seguro que voy a calentarte la cena solo porque lo hice ayer. Jamás debí comprar una cocina de inducción'. Pregunta a: ¿En qué consiste la inducción y en qué se diferencia de otros tipos de razonamiento? Pregunta b: Explique el chiste. ¿Qué es 'el problema de la inducción' y cómo se ha abordado desde la filosofía de la ciencia?","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Inducción: inferir una conclusión general (o sobre casos no observados) a partir de casos particulares observados.","x":"Ejemplo: 'el sol ha salido cada día, luego saldrá mañana'. Es un razonamiento ampliativo: la conclusión dice más que las premisas."},{"b":"Diferencia con la deducción: en la deducción válida la verdad de las premisas garantiza la conclusión; en la inducción no.","x":"La inducción solo hace probable la conclusión; siempre cabe una excepción no observada. La abducción (inferencia a la mejor explicación) es otro razonamiento no deductivo."},{"b":"El chiste: la cocina 'de inducción' razona inductivamente ('calenté ayer, calentaré hoy') y se niega a dar por segura esa inferencia.","x":"Juega con el doble sentido de 'inducción' (electromagnética/lógica) y escenifica que la regularidad pasada no garantiza el comportamiento futuro."},{"b":"Problema de la inducción (Hume): no hay justificación racional no circular de la inducción; descansa en el hábito.","x":"Justificarla por su éxito pasado es usar inducción para defender la inducción. Presupone la uniformidad de la naturaleza, que no puede probarse ni a priori ni empíricamente sin circularidad."},{"b":"Respuestas: Popper elimina la inducción (falsacionismo: conjeturas y refutaciones); otros la asumen como práctica falible.","x":"Popper propone que la ciencia no confirma sino que intenta refutar. Enfoques probabilísticos (bayesianos) y pragmáticos aceptan la inducción como razonable aunque falible, refinándola con estadística y control de sesgos."}]},{"id":"pc1-p103","tipo":"desarrollo","enunciado":"Texto de Chalmers (¿Qué es esa cosa llamada ciencia?) sobre la hierba que crece entre las huellas del estiércol y la necesidad de intervenir prácticamente. Pregunta a: ¿Qué es un experimento? Pon algún ejemplo. Pregunta b: Explica cómo la realización de experimentos permite discriminar entre explicaciones alternativas de un fenómeno, eliminando la influencia de posibles factores perturbadores.","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","bullets":[{"b":"Un experimento es una intervención activa: manipular el objeto de estudio para observar los efectos de esa manipulación.","x":"Se diferencia de la observación pasiva en que el investigador altera deliberadamente el sistema. Ejemplos: los planos inclinados de Galileo, añadir fertilizante a unas plantas y no a otras, un ensayo clínico."},{"b":"En la naturaleza los procesos se superponen: la mera observación no separa las causas (hoja que cae: gravedad, aire, viento).","x":"Chalmers subraya que observar los fenómenos 'tal como ocurren' no revela las leyes: la observación de hojas cayendo nunca daría la ley de caída de Galileo."},{"b":"En el ejemplo hay tres hipótesis rivales (fertilizante, humedad, vacas que no comen junto al estiércol) empíricamente indistinguibles sin intervenir.","x":"Las tres explican la misma observación. Solo manipulando (sacar las vacas una estación, desmenuzar el estiércol conservando el efecto fertilizante) se puede estimar el peso de cada factor."},{"b":"El experimento discrimina aislando variables: se modifica un factor manteniendo constantes los demás y se compara el resultado.","x":"Cada manipulación elimina o neutraliza un factor perturbador; si el efecto persiste o desaparece, se identifica qué proceso es responsable. Es la lógica del experimento controlado con grupo de control."},{"b":"Conclusión: la experimentación permite poner a prueba explicaciones alternativas y establecer relaciones causales, no meras correlaciones."}]},{"id":"pc1-p104","tipo":"desarrollo","enunciado":"Texto de Karin Knorr Cetina (La fabricación del conocimiento) sobre el laboratorio: los científicos buscan que las cosas 'funcionen' más que la verdad. Pregunta 1: Explica la diferencia entre los principios de éxito y de verdad y su relación con la ciencia. Pregunta 2: Describe en qué consiste el verificacionismo ingenuo del que habla el texto y expón la crítica al mismo por parte de los estudios sociales de la ciencia y el constructivismo.","variantes":[],"apariciones":["2023 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"Principio de verdad: la ciencia como búsqueda desinteresada de conocimiento verdadero; ideal epistemológico clásico.","x":"Es la imagen tradicional: el científico contrasta teorías con la realidad para acercarse a la verdad."},{"b":"Principio de éxito: en la práctica del laboratorio lo que rige es que las cosas 'funcionen', producir resultados publicables.","x":"Knorr Cetina, desde la etnografía del laboratorio, observa que el objetivo operativo es mundano: obtener resultados que se conviertan en créditos (publicaciones, financiación), no un ideal inalcanzable de verdad."},{"b":"La ciencia aparece así como manufactura o fabricación de conocimiento, condicionada por fines pragmáticos y sociales.","x":"Esto no implica que la ciencia sea fraudulenta, sino que sus productos se construyen en contextos concretos con intereses y negociaciones."},{"b":"Verificacionismo ingenuo: creer que la ciencia consiste simplemente en verificar teorías comparándolas directamente con los hechos.","x":"Supone hechos puros, observación neutral y un método que garantiza verdad. Ignora la carga teórica de la observación y las mediaciones prácticas del trabajo científico."},{"b":"Crítica constructivista: los hechos científicos se construyen socialmente en el laboratorio; no hay contraste directo con la realidad desnuda.","x":"Los estudios sociales de la ciencia (Kuhn, programa fuerte, Latour, Knorr Cetina) muestran que aceptar un resultado depende de instrumentos, negociaciones, anticipación de críticas y prestigio, no de una verificación pura."},{"b":"Balance: reconocer los factores sociales no obliga al relativismo total, pero desmonta la imagen ingenua de la ciencia."}]},{"id":"pc1-p105","tipo":"desarrollo","enunciado":"Texto de Popper (La lógica de la investigación científica) sobre el problema de la demarcación y la falsabilidad ('lloverá o no lloverá mañana' vs 'lloverá aquí mañana'). Pregunta 1: ¿En qué se diferencia el criterio de demarcación propuesto por Popper del del verificacionismo? Pregunta 2: ¿Cómo crees que Popper abordaría los casos del creacionismo, la pseudomedicina y el terraplanismo?","variantes":[],"apariciones":["2024 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"Verificacionismo: es científico lo que puede ser verificado (confirmado) por la experiencia; criterio positivo.","x":"Propio del Círculo de Viena. Tropieza con el problema de la inducción: las leyes universales nunca quedan verificadas concluyentemente por casos particulares."},{"b":"Popper: es científico lo que puede ser refutado por la experiencia; criterio negativo de falsabilidad.","x":"No exige selección positiva definitiva, sino exposición al riesgo: un sistema empírico ha de poder chocar con la experiencia. 'Lloverá o no lloverá' no es empírico porque nada puede refutarlo."},{"b":"Ventaja: aprovecha la asimetría lógica entre verificación (imposible para leyes) y falsación (posible con un contraejemplo)."},{"b":"Creacionismo: infalsable en el fondo; cualquier evidencia se reinterpreta como obra del creador, luego no es ciencia.","x":"Popper lo clasificaría como metafísica: puede tener sentido para el creyente, pero al no arriesgar predicciones refutables no es ciencia; presentarlo como tal es pseudociencia."},{"b":"Pseudomedicina: o evita la contrastación (infalsable) o sus afirmaciones ya han sido falsadas y se mantienen con hipótesis ad hoc.","x":"La homeopatía, por ejemplo, se protege de la refutación reinterpretando cada fracaso; esa estrategia inmunizadora es para Popper la marca de la pseudociencia."},{"b":"Terraplanismo: hace afirmaciones falsables que la evidencia ha refutado abundantemente; mantenerlas es irracionalidad anticientífica.","x":"Sería un caso de teoría empírica falsada cuyos defensores rechazan sistemáticamente los tests y sus resultados, recurriendo a conspiraciones ad hoc."}]},{"id":"pc1-p106","tipo":"desarrollo","enunciado":"Texto de Chalmers sobre la teoría de Adler (el hombre en la orilla del río): la teoría explica tanto que el hombre se tire como que no se tire. Pregunta 1: ¿Por qué no es falsable la teoría de Adler (tal como está presentada en el texto)? Pon un ejemplo de una hipótesis falsable y otro de una hipótesis no falsable. Pregunta 2: Explica por qué es importante según el falsacionismo formular las hipótesis de manera clara y precisa.","variantes":[],"apariciones":["2024 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"La teoría de Adler es compatible con cualquier conducta posible: ambas acciones opuestas 'confirman' el sentimiento de inferioridad.","x":"Si tanto tirarse como no tirarse apoyan la teoría, ninguna observación concebible podría refutarla: no prohíbe nada, luego no es falsable ni informativa sobre el mundo."},{"b":"Falsable: 'todos los metales se dilatan al calentarse' o la ley fuerza-aceleración de Newton; prohíben resultados concretos.","x":"Basta un metal que no se dilate para refutarla: la hipótesis se arriesga."},{"b":"No falsable: 'nuestro destino está regido por la providencia' o 'la posición de los astros influye en nuestra fortuna'.","x":"Cualquier suceso puede reinterpretarse como compatible; no hay observación posible que las refute."},{"b":"Cuanto más clara y precisa es una hipótesis, más falsable es: especifica exactamente qué observaciones la refutarían.","x":"Una predicción vaga ('mañana puede que llueva') se salva siempre; una precisa ('lloverá aquí mañana') se expone. Para Popper, la ciencia valora hipótesis audaces, precisas y de alto contenido informativo."},{"b":"La vaguedad es una estrategia inmunizadora típica de la pseudociencia (horóscopos, videncia): permite acomodar cualquier resultado.","x":"Formular con precisión evita las reinterpretaciones ad hoc que vacían de contenido empírico a una teoría."}]},{"id":"pc1-p107","tipo":"desarrollo","enunciado":"Texto de Cebolla, Jiménez Buedo y Salazar (Politikon, 2016) sobre el sesgo de selección en la asociación entre lactancia materna y salud/desarrollo infantil. Pregunta 1: ¿El hecho de que exista una asociación entre X e Y implica automáticamente que X sea la causa de Y? ¿Por qué? Pregunta 2: ¿Qué explicación proponen los autores para la correlación entre lactancia materna y beneficios en salud y desarrollo infantil? ¿Se te ocurre alguna forma de comprobar si esta explicación es correcta?","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"No: correlación no implica causalidad; la asociación puede deberse al azar, a causalidad inversa o a un tercer factor.","x":"Causación implica correlación, pero no a la inversa. Una asociación X-Y solo es evidencia causal si se descartan explicaciones alternativas."},{"b":"Sesgo de selección: un tercer factor Z hace a los individuos más proclives tanto a X como a Y.","x":"En el texto, Z son las características familiares (recursos, información): las familias que optan por la lactancia tienden también a proporcionar mejores condiciones de salud y desarrollo."},{"b":"Explicación de los autores: serían esas características familiares, y no la leche en sí, las que causan la mejor salud infantil."},{"b":"Comprobación ideal: experimento controlado aleatorizado; imposible aquí por razones éticas y prácticas.","x":"No se puede asignar aleatoriamente bebés a lactancia materna o de fórmula. La aleatorización neutralizaría las diferencias entre familias."},{"b":"Alternativas: controlar estadísticamente el nivel socioeconómico, comparar hermanos, estudios como PROBIT con promoción aleatorizada de lactancia.","x":"Si al controlar Z la asociación desaparece o se reduce mucho, se apoya la explicación del sesgo de selección; si persiste, habría efecto causal genuino de la lactancia."}]},{"id":"pc1-p108","tipo":"desarrollo","enunciado":"Texto de Chalmers (cap. 7) sobre la revolución copernicana: en 1543 los argumentos contra Copérnico eran sólidos y solo tras siglo y medio (nueva física) pudo defenderse la teoría. Pregunta 1: ¿Por qué la historia del desarrollo de la astronomía copernicana parece suponer un problema para el falsacionismo? ¿Cómo podría responder un falsacionista? Pregunta 2: ¿Cómo se explicaría desde la perspectiva de Kuhn la transición desde las teorías tradicionales a la nueva astronomía copernicana?","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Problema: según el falsacionismo, el copernicanismo debió abandonarse en 1543, pues chocaba con la evidencia disponible.","x":"Había objeciones mecánicas y astronómicas sólidas (ausencia de paralaje, física del movimiento). Si los científicos hubieran sido falsacionistas estrictos, la teoría habría muerto antes de desarrollarse."},{"b":"La historia muestra que fue racional mantener la teoría 'falsada' hasta que la nueva física (Galileo, Newton) la respaldó.","x":"El progreso exigió tenacidad frente a aparentes refutaciones: las metodologías inductivista y falsacionista ingenuas no describen este proceso."},{"b":"Respuesta falsacionista: las falsaciones afectaban a hipótesis auxiliares (física aristotélica, óptica), no al núcleo copernicano (holismo).","x":"Un falsacionista sofisticado (Lakatos) diría que el copernicanismo era un programa de investigación progresivo: sus modificaciones predijeron hechos nuevos, lo que justificaba protegerlo temporalmente."},{"b":"Kuhn: fue una revolución científica, el paso de un paradigma (geocéntrico-aristotélico) a otro (heliocéntrico) a través de una crisis.","x":"Las anomalías acumuladas en la astronomía ptolemaica, más virtudes como la simplicidad matemática, atrajeron a conversos; no hubo refutación concluyente ni verificación, sino cambio de lealtades en la comunidad."},{"b":"El cambio no se debió solo al apoyo evidencial: intervinieron valores estéticos, promesas de fecundidad y factores sociológicos (inconmensurabilidad).","x":"Solo tras generaciones y con la física newtoniana el nuevo paradigma pudo enfrentarse en detalle a la observación, consolidando la revolución."}]},{"id":"pc1-p109","tipo":"desarrollo","enunciado":"Texto de Duhem (La Teoría Física, 1906): 'el físico jamás puede someter a prueba experimental una hipótesis aislada, sino sólo todo un conjunto de hipótesis...'. Pregunta 1: ¿Por qué no se pueden someter a comprobación experimental hipótesis aisladas? Pregunta 2: ¿Supone la tesis de Duhem un desafío para el falsacionismo? ¿Cómo puede responderse al problema planteado por Duhem?","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Las predicciones no se deducen de la hipótesis sola, sino de esta junto a hipótesis auxiliares y supuestos de fondo.","x":"Intervienen teorías sobre los instrumentos, condiciones iniciales y supuestos idealizadores. Sin ese conjunto no hay predicción contrastable: es el holismo de la contrastación (tesis Duhem-Quine)."},{"b":"Si la predicción falla, la lógica solo dice que algo del conjunto es falso, no qué componente debe modificarse.","x":"El modus tollens refuta la conjunción, no la hipótesis principal aisladamente: el experimento 'no indica cuál debe ser modificada'."},{"b":"Desafío al falsacionismo: no hay falsaciones concluyentes de hipótesis individuales; siempre cabe culpar a una auxiliar.","x":"La refutación limpia que exige el falsacionismo ingenuo de Popper no existe: toda teoría puede salvarse ajustando el cinturón de hipótesis auxiliares."},{"b":"Respuesta popperiana: prohibir estratagemas ad hoc; las modificaciones deben ser contrastables independientemente y aumentar el contenido empírico.","x":"Es legítimo revisar auxiliares si la nueva versión hace predicciones nuevas comprobables (como Neptuno frente a las anomalías de Urano); es ilegítimo si solo inmuniza la teoría."},{"b":"Lakatos sistematiza la solución: programas de investigación con núcleo firme y cinturón protector, progresivos o degenerativos.","x":"La racionalidad no está en falsaciones puntuales sino en la evolución del programa: es científico mantener el núcleo mientras el programa predice hechos nuevos."}]},{"id":"pc1-p110","tipo":"desarrollo","enunciado":"Texto de Chalmers sobre las observaciones telescópicas de Galileo (lunas de Júpiter) y cómo convenció a los escépticos. Pregunta a: ¿Por qué es importante que las observaciones científicas sean públicas y repetibles por distintos investigadores? Pregunta b: Explica brevemente el papel de los instrumentos de observación en ciencia. ¿Cómo consiguió Galileo mostrar la fiabilidad de sus observaciones con el telescopio?","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","bullets":[{"b":"La evidencia científica debe ser intersubjetiva: pública y repetible, para que no dependa del testimonio de un solo observador.","x":"La repetición por observadores independientes permite descartar errores, ilusiones y fraudes, y convierte la observación en evidencia utilizable por toda la comunidad."},{"b":"La replicación independiente fue decisiva: hasta observadores contrarios a Copérnico (Collegio Romano) confirmaron los datos de Galileo.","x":"Que adversarios teóricos reproduzcan el resultado es especialmente valiosa evidencia de fiabilidad, pues elimina la sospecha de sesgo de confirmación."},{"b":"Los instrumentos amplían nuestras capacidades perceptivas y permiten observaciones más precisas y cuantitativas.","x":"El telescopio hizo visibles fenómenos inaccesibles a simple vista. Los instrumentos no son infalibles: su fiabilidad debe establecerse a su vez."},{"b":"Galileo defendió la fiabilidad del telescopio con argumentos: las lunas aparecían solo junto a Júpiter, no eran artefacto del aparato.","x":"Si fueran ilusiones producidas por el instrumento, deberían aparecer en cualquier lugar del cielo."},{"b":"Apeló a la consistencia y repetitividad de las mediciones y a predicciones exitosas (posiciones, fases, eclipses) confirmadas independientemente.","x":"La capacidad predictiva contrastable y la verificación por terceros mostraron que el telescopio producía datos fiables, no ilusiones."},{"b":"Relevancia teórica: las lunas de Júpiter desmontaban la objeción de que la Tierra 'perdería' a la Luna si se moviera."}]},{"id":"pc1-p111","tipo":"desarrollo","enunciado":"Texto de Cebolla, Jiménez-Buedo y Salazar ('Lactancia materna: ¿es la leche?', Politikon 2016) sobre la imposibilidad de experimentos controlados en lactancia y el sesgo de autoselección. Pregunta 1: ¿En qué consiste un experimento controlado? ¿Por qué no suele ser posible realizarlos en estudios sobre bienestar infantil? Pregunta 2: ¿Podemos inferir directamente una conexión causal a partir de una correlación entre variables identificada en un estudio observacional? Ilustra la respuesta con el ejemplo de la lactancia materna.","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Experimento controlado: se manipula una variable manteniendo las demás constantes, comparando grupo tratado y grupo de control.","x":"La asignación aleatoria a los grupos neutraliza los factores de confusión, permitiendo aislar el efecto causal de la variable manipulada."},{"b":"En bienestar infantil no es posible por razones éticas y prácticas: no cabe asignar aleatoriamente bebés a lactancia materna o fórmula.","x":"Obligar o impedir la lactancia sería inaceptable; además la adherencia depende de las familias. Por eso se recurre a datos observacionales."},{"b":"De una correlación observacional no se infiere directamente causalidad: puede haber terceros factores o autoselección.","x":"La correlación es evidencia a investigar, no prueba causal: hay que descartar explicaciones alternativas antes de concluir que X causa Y."},{"b":"Ejemplo: madres con más recursos e información se 'autoseleccionan' hacia la lactancia; esas características explican parte de la ventaja infantil.","x":"En EE. UU. la lactancia está estratificada por clase y raza: la asociación lactancia-salud refleja en buena medida las circunstancias familiares, no (solo) la leche."},{"b":"Soluciones parciales: controles estadísticos, comparaciones entre hermanos o diseños cuasi-experimentales que aproximen el control experimental."}]}],"cards":[{"id":"pc1-c01","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es la evidencia?","back":"Pruebas o indicios acerca de la verdad de una proposición. No significa 'verdad obvia': es lo que apoya o socava racionalmente una afirmación."},{"id":"pc1-c02","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es un hecho?","back":"Es un hecho que p si y solo si es verdad que p. Los hechos son objetivos: no dependen de creencias ni opiniones."},{"id":"pc1-c03","tema":"Tema 1: ¿Qué es la ciencia?","front":"Verdad objetiva","back":"Aquella cuya verdad no depende de nuestras opiniones. Puede haber desacuerdo sobre verdades objetivas y consenso sobre falsedades."},{"id":"pc1-c04","tema":"Tema 1: ¿Qué es la ciencia?","front":"Empirismo","back":"Posición según la cual la principal fuente de evidencia científica es la experiencia observacional, no la razón pura ni la intuición."},{"id":"pc1-c05","tema":"Tema 1: ¿Qué es la ciencia?","front":"Sesgo cognitivo","back":"Distorsión sistemática en la evaluación e interpretación de la evidencia disponible. No es un método ni una creencia concreta."},{"id":"pc1-c06","tema":"Tema 1: ¿Qué es la ciencia?","front":"Sesgo de confirmación","back":"Tendencia a dar más peso a la evidencia que favorece lo que ya creemos y a ignorar la evidencia en contra."},{"id":"pc1-c07","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es un argumento?","back":"Secuencia de proposiciones: un conjunto de premisas de las que se siguen ciertas conclusiones."},{"id":"pc1-c08","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es un razonamiento?","back":"Transición entre creencias (u otros estados mentales) cuya finalidad es adoptar creencias correctas o justificadas."},{"id":"pc1-c09","tema":"Tema 1: ¿Qué es la ciencia?","front":"Premisas y conclusión","back":"Premisas: proposiciones de las que se parte. Conclusión: proposición a la que se llega. Ninguna tiene que ser verdadera por definición."},{"id":"pc1-c10","tema":"Tema 1: ¿Qué es la ciencia?","front":"Validez deductiva","back":"Si las premisas son verdaderas, la conclusión lo es necesariamente. Un argumento válido puede tener premisas falsas (Suiza/China). Inválido: premisas verdaderas y conclusión falsa posible."},{"id":"pc1-c11","tema":"Tema 2: Los límites de lo científico","front":"Razonamiento inductivo","back":"De casos observados a una generalización o casos nuevos. Es ampliativo: la verdad de las premisas no garantiza la conclusión."},{"id":"pc1-c12","tema":"Tema 2: Los límites de lo científico","front":"Problema de la inducción (Hume)","back":"Las premisas verdaderas no garantizan la generalización: siempre puede haber excepciones no observadas. Justificar la inducción por su éxito pasado es circular; descansa en el hábito."},{"id":"pc1-c13","tema":"Tema 2: Los límites de lo científico","front":"Principio de uniformidad de la naturaleza","back":"Supuesto de la inducción: los casos no observados se comportarán como los observados. No puede probarse sin circularidad."},{"id":"pc1-c14","tema":"Tema 1: ¿Qué es la ciencia?","front":"Argumento de autoridad","back":"Apoya una tesis apelando exclusivamente a que una autoridad la defiende. No es evidencia incuestionable ni inmune a la duda racional."},{"id":"pc1-c15","tema":"Tema 1: ¿Qué es la ciencia?","front":"Requisitos de la observación científica","back":"Pública, protocolarizada, repetible y accesible a distintos investigadores. La replicación detecta errores y hace la evidencia utilizable por la comunidad."},{"id":"pc1-c16","tema":"Tema 1: ¿Qué es la ciencia?","front":"Instrumentos de observación","back":"Superan las limitaciones de nuestras capacidades perceptivas (telescopio de Galileo). No garantizan infalibilidad: su fiabilidad debe demostrarse (consistencia, predicciones, verificación independiente)."},{"id":"pc1-c17","tema":"Tema 1: ¿Qué es la ciencia?","front":"Cuantificación de la observación","back":"Expresar observaciones en números permite compararlas con precisión entre observadores y favorece la reproducibilidad. No elimina el error."},{"id":"pc1-c18","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es un experimento?","back":"Manipulación del objeto de estudio para observar los efectos de dicha manipulación. Se distingue de la observación pasiva por la intervención activa."},{"id":"pc1-c19","tema":"Tema 1: ¿Qué es la ciencia?","front":"Experimento controlado","back":"Se manipula una variable evitando interferencias de las demás (constantes o aleatorizadas), comparando grupo tratado y grupo de control para aislar el efecto causal."},{"id":"pc1-c20","tema":"Tema 3: La ciencia en sociedad","front":"Ensayo clínico","back":"Estudio experimental que investiga la efectividad y seguridad de un medicamento o tratamiento, idealmente aleatorizado y con grupo de control."},{"id":"pc1-c21","tema":"Tema 2: Los límites de lo científico","front":"Correlación vs causalidad","back":"Causación implica correlación; correlación NO implica causación (puede ser azar o tercer factor), aunque es evidencia que investigar."},{"id":"pc1-c22","tema":"Tema 2: Los límites de lo científico","front":"Sesgo de selección / autoselección","back":"Un tercer factor Z hace a los individuos proclives a X y a Y, creando asociación sin causalidad. Ejemplo: lactancia materna y salud infantil (recursos familiares)."},{"id":"pc1-c23","tema":"Tema 2: Los límites de lo científico","front":"Estadística inferencial","back":"Realiza inferencias inductivas sobre una población completa a partir de datos de una parte (muestra). La descriptiva solo ordena y resume datos."},{"id":"pc1-c24","tema":"Tema 2: Los límites de lo científico","front":"Muestra estadística","back":"Conjunto de casos de una población sobre los que se tienen datos, base de las inferencias sobre la población total. Debe ser representativa."},{"id":"pc1-c25","tema":"Tema 2: Los límites de lo científico","front":"Sesgo estadístico","back":"Distorsión por deficiencias en el análisis o la recolección de datos: las conclusiones no reflejan propiedades genuinas de la población estudiada."},{"id":"pc1-c26","tema":"Tema 2: Los límites de lo científico","front":"Probabilidad e incertidumbre","back":"La probabilidad asignada a un evento refleja la incertidumbre sobre si ocurrirá. Los resultados probabilísticos son científicamente aceptables si reflejan el apoyo evidencial."},{"id":"pc1-c27","tema":"Tema 2: Los límites de lo científico","front":"Imprecisión vs error","back":"Una medida imprecisa (intervalo: 25-27°C) no elimina toda la incertidumbre, pero puede ser correcta e informativa. Precisión y corrección son distintas."},{"id":"pc1-c28","tema":"Tema 2: Los límites de lo científico","front":"Aproximación","back":"Resultado inexacto pero suficientemente cercano a la respuesta correcta para los intereses de los investigadores. Aceptable y omnipresente en ciencia."},{"id":"pc1-c29","tema":"Tema 2: Los límites de lo científico","front":"Modelo científico","back":"Idealización que sirve para aproximarse a la realidad. Es aceptable si permite inferencias útiles, no por reflejarla fielmente. Un modelo falso puede ser válido."},{"id":"pc1-c30","tema":"Tema 2: Los límites de lo científico","front":"¿Un ser vivo puede ser modelo científico?","back":"Sí: organismos modelo como el ratón, Drosophila o E. coli representan otros sistemas biológicos en la investigación."},{"id":"pc1-c31","tema":"Tema 2: Los límites de lo científico","front":"Modelo nomológico-deductivo","back":"Explicación por subsunción bajo leyes generales (Hempel). Más frecuente en física y química, que disponen de leyes universales estrictas."},{"id":"pc1-c32","tema":"Tema 1: ¿Qué es la ciencia?","front":"Hipótesis","back":"Conjetura que se propone como posibilidad abierta (sin creerla verdadera ni falsa). Puede ser infalsable, carecer aún de evidencia y aun así ser verdadera."},{"id":"pc1-c33","tema":"Tema 1: ¿Qué es la ciencia?","front":"Predicciones de una hipótesis","back":"Consecuencias que se seguirían de la verdad de la hipótesis; se deducen de ella (más auxiliares) y permiten contrastarla empíricamente."},{"id":"pc1-c34","tema":"Tema 1: ¿Qué es la ciencia?","front":"Refutación empírica","back":"Una hipótesis queda refutada si alguna de sus predicciones es incompatible con la evidencia. Una generalización universal cae con un solo contraejemplo."},{"id":"pc1-c35","tema":"Tema 1: ¿Qué es la ciencia?","front":"Método científico: ¿reglas para hipótesis?","back":"No hay reglas rígidas: vale cualquier hipótesis contrastable. Virtudes deseables: simplicidad, generalidad, poder predictivo, capacidad explicativa. Aplicable a cualquier hipótesis empírica."},{"id":"pc1-c36","tema":"Tema 3: La ciencia en sociedad","front":"Verificacionismo","back":"Criterio del Círculo de Viena: las hipótesis científicas deben ser corroboradas (verificadas) por la experiencia. Hereda el problema de la inducción: las leyes universales nunca quedan verificadas."},{"id":"pc1-c37","tema":"Tema 3: La ciencia en sociedad","front":"Falsabilidad (Popper)","back":"Una hipótesis es falsable si es posible que surja evidencia que la refute. Es el criterio popperiano de cientificidad. Falsable no significa falsa."},{"id":"pc1-c38","tema":"Tema 2: Los límites de lo científico","front":"Asimetría verificación/falsación","back":"Ningún número de casos favorables verifica una ley universal, pero un contraejemplo la refuta. Por eso no sabemos si estamos en lo cierto, pero sí si estamos equivocados."},{"id":"pc1-c39","tema":"Tema 2: Los límites de lo científico","front":"Corroboración (Popper)","back":"Superar contrastaciones apoya la teoría solo temporalmente: sigue expuesta a tests futuros. La ciencia avanza por conjeturas y refutaciones."},{"id":"pc1-c40","tema":"Tema 2: Los límites de lo científico","front":"Enunciados falsables: ejemplos de examen","back":"Falsables: 'la fuerza neta es proporcional a la aceleración', 'los metales se dilatan al calentarse'. No falsables: providencia divina, astrología, inconsciente, lucha de clases como motor de la historia."},{"id":"pc1-c41","tema":"Tema 2: Los límites de lo científico","front":"Holismo de la contrastación (Duhem-Quine)","back":"La evidencia no refuta hipótesis aisladas, solo conjuntos de hipótesis más auxiliares y presuposiciones. El experimento no dice qué componente falla."},{"id":"pc1-c42","tema":"Tema 2: Los límites de lo científico","front":"Lakatos: falsacionismo sofisticado","back":"Las teorías forman programas de investigación (núcleo firme + cinturón protector). Son progresivos si predicen hechos nuevos; degenerativos si solo se protegen ad hoc."},{"id":"pc1-c43","tema":"Tema 2: Los límites de lo científico","front":"Paradigma (Kuhn)","back":"Marco compartido de supuestos, conceptos, métodos y ejemplares que define los problemas y soluciones legítimos de una comunidad científica."},{"id":"pc1-c44","tema":"Tema 2: Los límites de lo científico","front":"Ciencia normal","back":"La ciencia que se hace en el marco de un paradigma: resolución de enigmas sin cuestionar los fundamentos."},{"id":"pc1-c45","tema":"Tema 2: Los límites de lo científico","front":"Anomalía y crisis (Kuhn)","back":"Anomalía: resultado que el paradigma no logra acomodar. Su acumulación persistente genera crisis y abre paso a paradigmas rivales."},{"id":"pc1-c46","tema":"Tema 2: Los límites de lo científico","front":"Revolución científica","back":"Sustitución de un paradigma por otro que reorganiza conceptos y métodos. Ejemplo canónico: de la astronomía ptolemaica a la copernicana."},{"id":"pc1-c47","tema":"Tema 2: Los límites de lo científico","front":"Inconmensurabilidad","back":"Dos paradigmas son inconmensurables cuando resultan incomparables punto por punto: usan marcos conceptuales y criterios de evaluación radicalmente diferentes."},{"id":"pc1-c48","tema":"Tema 2: Los límites de lo científico","front":"Cambio de paradigma: ¿qué lo determina?","back":"Ocurre cuando la comunidad científica decide asumir el nuevo paradigma, sea cual sea el motivo. No se debe exclusivamente a un mejor apoyo evidencial."},{"id":"pc1-c49","tema":"Tema 2: Los límites de lo científico","front":"Conocimiento tácito en el paradigma","back":"Buena parte del saber paradigmático se transmite tácitamente: mediante ejemplares, práctica y entrenamiento, no solo reglas explícitas (Kuhn, Polanyi)."},{"id":"pc1-c50","tema":"Tema 3: La ciencia en sociedad","front":"Feyerabend","back":"Anarquismo filosófico/epistemológico: no hay método científico universal; el único principio que no frena el progreso es 'todo vale' (Contra el método)."},{"id":"pc1-c51","tema":"Tema 3: La ciencia en sociedad","front":"Problema de la demarcación","back":"La búsqueda de criterios para distinguir lo científico de lo no científico (Popper). Los tres criterios del curso: verificabilidad, falsabilidad y correspondencia con el paradigma."},{"id":"pc1-c52","tema":"Tema 3: La ciencia en sociedad","front":"Pseudociencia","back":"No-ciencia haciéndose pasar por ciencia para aprovechar su crédito social. Ejemplos: astrología, homeopatía, diseño inteligente."},{"id":"pc1-c53","tema":"Tema 3: La ciencia en sociedad","front":"Anticiencia","back":"Discurso basado en la desconfianza hacia la ciencia; los anticientificistas sostienen que la ciencia debe eliminarse o reconsiderarse profundamente, sea cual sea el criterio de demarcación."},{"id":"pc1-c54","tema":"Tema 3: La ciencia en sociedad","front":"¿Cuándo chocan los discursos no científicos con la ciencia?","back":"Cuando son pseudocientíficos (la suplantan) o anticientíficos (la atacan). La no-ciencia como tal puede convivir con la ciencia sin conflicto."},{"id":"pc1-c55","tema":"Tema 3: La ciencia en sociedad","front":"Creacionismo y diseño inteligente","back":"El diseño inteligente asume el creacionismo: es su reformulación con apariencia científica. No son idénticos ni el segundo ha reemplazado al primero."},{"id":"pc1-c56","tema":"Tema 3: La ciencia en sociedad","front":"NOMA (Gould)","back":"Magisterios que no se superponen: la ciencia trata hechos del mundo natural; la religión, fines, significados y valores. No interferencia respetuosa con diálogo."},{"id":"pc1-c57","tema":"Tema 3: La ciencia en sociedad","front":"Giro social de la filosofía de la ciencia","back":"Tras Kuhn: la demarcación depende de valores y aspectos contextuales que determinan el paradigma dominante. La ciencia se estudia como producto social."},{"id":"pc1-c58","tema":"Tema 3: La ciencia en sociedad","front":"Constructivismo social","back":"La ciencia no tiene posición epistémica privilegiada frente a la magia o la mitología: se explica simétricamente como fenómeno social (programa fuerte, Knorr Cetina)."},{"id":"pc1-c59","tema":"Tema 3: La ciencia en sociedad","front":"Knorr Cetina: éxito vs verdad","back":"En el laboratorio rige el principio de éxito (que las cosas 'funcionen' y produzcan resultados publicables), no el ideal epistemológico de verdad: fabricación del conocimiento."},{"id":"pc1-c60","tema":"Tema 3: La ciencia en sociedad","front":"Enfoques feministas de la ciencia","back":"La ciencia, como producto social, está determinada por el androcentrismo de la sociedad: sesgos en prioridades, métodos y teorías. No dicen que solo valga la ciencia de mujeres."},{"id":"pc1-c61","tema":"Tema 3: La ciencia en sociedad","front":"Revisión por pares","back":"Proceso editorial por el que investigadores independientes evalúan los artículos enviados a una revista antes de su publicación."},{"id":"pc1-c62","tema":"Tema 3: La ciencia en sociedad","front":"Factor de impacto","back":"Promedio de citas de los artículos publicados en una revista: mide su influencia en la comunidad científica."},{"id":"pc1-c63","tema":"Tema 3: La ciencia en sociedad","front":"Sesgo de publicación","back":"Los resultados positivos se publican más porque se perciben como más interesantes y de mayor impacto; replicaciones y resultados negativos quedan infrarrepresentados."},{"id":"pc1-c64","tema":"Tema 3: La ciencia en sociedad","front":"Estudios de replicación","back":"Buscan reproducir los resultados de un experimento previo. Esenciales para comprobar la fiabilidad de la ciencia, pero difíciles de publicar (crisis de replicación)."},{"id":"pc1-c65","tema":"Tema 3: La ciencia en sociedad","front":"Motivaciones de los científicos","back":"No solo epistémicas: incluyen reconocimiento, premios y financiación. Ello no convierte sus resultados en fraudulentos; el control es institucional."},{"id":"pc1-c66","tema":"Tema 3: La ciencia en sociedad","front":"Expertos científicos","back":"Investigadores cuyas opiniones sobre ciertas cuestiones científicas son generalmente fiables. No infalibles ni incuestionables: la pericia no elimina la crítica racional."},{"id":"pc1-c67","tema":"Tema 1: ¿Qué es la ciencia?","front":"Ciencia y tradición","back":"Las creencias tradicionales no respaldadas por la evidencia no son aceptables científicamente. Ejemplo: Galileo contra el axioma aristotélico de la caída de los cuerpos."},{"id":"pc1-c68","tema":"Tema 1: ¿Qué es la ciencia?","front":"Falibilismo: ¿es revisable lo aceptado?","back":"Sí: es frecuente que nueva evidencia lleve a rechazar hipótesis ampliamente aceptadas que se ajustaban a la evidencia anterior (flogisto, éter, geocentrismo)."},{"id":"pc1-c69","tema":"Tema 1: ¿Qué es la ciencia?","front":"Galileo, Carta a Cristina de Lorena","back":"En cuestiones naturales mandan los sentidos y las demostraciones necesarias; la Escritura, que enseña 'cómo se va al cielo', debe reinterpretarse si choca con lo demostrado."},{"id":"pc1-c70","tema":"Tema 2: Los límites de lo científico","front":"Escepticismo humeano sobre la inducción","back":"No existe justificación racional de la inducción: aceptar generalizaciones desde casos particulares es un hábito psicológico, fruto de la costumbre."},{"id":"pc1-c71","tema":"Tema 3: La ciencia en sociedad","front":"Ciencia y decisiones prácticas","back":"El conocimiento científico informa las decisiones: permite anticipar consecuencias y estimar qué opciones logran mejor nuestros objetivos, sean cuales sean nuestros valores."},{"id":"pc1-c72","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Aplicaciones prácticas = evidencia?","back":"No: que un campo tenga aplicaciones es motivación legítima para investigarlo y financiarlo, pero no es evidencia a favor de sus hipótesis."}]}];
</script>
