sarrollo","enunciado":"La doctrina platónica de las Ideas y sus dificultades (su dificultad central)","variantes":["Dificultades en la teoría platónica de las Ideas","La doctrina platónica de las Ideas y su dificultad central","Las dificultades de la teoría platónica de las Ideas","Las dificultades de la doctrina platónica de las Ideas"],"apariciones":["2023 Feb-2","2024 Feb-1","2025 Feb-1","2025 Sep","2026 Feb-2"],"frecuencia":5,"tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","bullets":[{"b":"Las Ideas: esencias universales, eternas, inmutables, existentes en sí y separadas del mundo sensible.","x":"Son el verdadero ser y el objeto de la ciencia (episteme); lo sensible, cambiante, solo permite opinión (doxa)."},{"b":"Las cosas sensibles son lo que son por participación (méthexis) o imitación (mímesis) de las Ideas."},{"b":"Dificultad central: el chorismós o separación; cómo relacionar dos órdenes de realidad heterogéneos.","x":"Si las Ideas están separadas, no se ve cómo pueden ser causa y esencia de las cosas sensibles ni cómo las explicarían."},{"b":"Parménides: argumento del 'tercer hombre'; la semejanza entre Idea y cosas exige otra Idea, regreso al infinito.","x":"Si hombre e Idea de Hombre se parecen, necesitan un tercer término que funde su semejanza, y así indefinidamente."},{"b":"Aporías de la participación: la Idea una no puede estar toda entera, ni por partes, en muchas cosas."},{"b":"¿De qué hay Ideas? Problema de las Ideas de cosas viles (barro, pelo) o de negaciones."},{"b":"El propio Platón autocritica la teoría en el Parménides y la revisa mediante la dialéctica de los géneros supremos."}]},{"id":"tc1-p10","tipo":"desarrollo","enunciado":"La lógica en el estoicismo","variantes":["La Lógica en el estoicismo","La lógica en el Estoicismo"],"apariciones":["2022 Feb-1","2022 Sep","2024 Feb-1","2025 Feb-2","2025 Sep"],"frecuencia":5,"tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","bullets":[{"b":"La lógica es una de las tres partes de la filosofía, junto a física y ética; estudia el logos.","x":"En el helenismo el saber se instrumentaliza: la lógica sirve, en último término, a la ética, al ideal de vida del sabio."},{"b":"Comprende retórica y dialéctica; la dialéctica incluye la teoría del conocimiento y la lógica formal."},{"b":"Teoría del conocimiento: la representación comprensiva (phantasía katalēptikē) más el asentimiento (synkatáthesis) dan la aprehensión verdadera.","x":"La representación comprensiva se impone con evidencia irresistible y garantiza proceder del objeto real: es el criterio estoico de verdad."},{"b":"Doctrina de los lektá (significados, 'expresables'): incorporales que median entre el signo y la cosa.","x":"Frente al corporeísmo general estoico, los significados no son cuerpos: son lo que entendemos cuando comprendemos un enunciado."},{"b":"Crean la lógica proposicional: inferencias entre enunciados completos (axiómata), frente a la silogística aristotélica de términos."},{"b":"Cinco argumentos indemostrables como esquemas básicos válidos: modus ponens, modus tollens, silogismos disyuntivos, etc."}]},{"id":"tc1-p11","tipo":"desarrollo","enunciado":"La teoría kantiana de las categorías","variantes":[],"apariciones":["2020 Feb-2","2022 Sep","2024 Feb-2","2025 Feb-1","2026 Feb-1"],"frecuencia":5,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Categorías: conceptos puros del entendimiento, formas a priori con que pensamos y unificamos lo dado en la intuición.","x":"Se estudian en la Analítica trascendental. Sin ellas lo sensible sería un caos sin objetos: 'las intuiciones sin conceptos son ciegas'."},{"b":"Deducción metafísica: las doce categorías se obtienen de las doce formas posibles del juicio de la lógica.","x":"Si juzgar es la operación propia del entendimiento, cada forma de juicio revela un concepto puro correspondiente."},{"b":"Cuatro grupos de tres: cantidad, cualidad, relación (substancia, causalidad, comunidad) y modalidad."},{"b":"Deducción trascendental: legitima aplicar categorías a fenómenos; la unidad de apercepción ('yo pienso') las fundamenta.","x":"Todo objeto de experiencia debe someterse a las condiciones de unidad de la conciencia; por eso las categorías valen objetivamente."},{"b":"Esquematismo: el tiempo, forma común a sensibilidad y entendimiento, media para aplicar cada categoría a los fenómenos."},{"b":"Límite: solo valen dentro de la experiencia posible; aplicadas a cosas en sí producen ilusión dialéctica."},{"b":"Frente a Aristóteles, no son géneros del ser; frente a Hume, la causalidad recobra necesidad como condición a priori."}]},{"id":"tc1-p12","tipo":"desarrollo","enunciado":"La doctrina aristotélica de la abstracción","variantes":["La teoría aristotélica de la abstracción","Abstracción y concepto en Aristóteles"],"apariciones":["2022 Feb-1","2023 Feb-1","2024 Feb-2","2024 Sep"],"frecuencia":4,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"Punto de partida empirista: todo conocimiento comienza en los sentidos; no hay Ideas innatas ni reminiscencia.","x":"Contra Platón: el alma es al nacer como una tablilla en la que nada está escrito; lo inteligible se extrae de lo sensible."},{"b":"Grados del conocer: sensación, imaginación (phantasma), memoria y experiencia; de lo particular hacia lo universal."},{"b":"Abstracción: el entendimiento extrae la forma universal de las imágenes sensibles, prescindiendo de la materia individual.","x":"La esencia está realmente en la cosa individual; la mente la separa (abs-trahere) de las condiciones materiales que la individualizan."},{"b":"Entendimiento agente: ilumina el phantasma y actualiza lo inteligible en potencia; el entendimiento paciente recibe el concepto.","x":"Como la luz hace visibles los colores, el intelecto agente hace inteligible en acto lo que en la imagen sensible es inteligible solo en potencia."},{"b":"El universal no existe separado (contra Platón): existe en las cosas y solo es universal en la mente."},{"b":"Resultado: el concepto y la definición de la esencia, base del juicio y de la ciencia demostrativa."}]},{"id":"tc1-p13","tipo":"desarrollo","enunciado":"El realismo moderado en la controversia medieval de los universales","variantes":["El realismo moderado en la Edad Media","La controversia medieval de los universales: el realismo moderado","El realismo moderado en el problema medieval de los universales"],"apariciones":["2020 Feb-1","2022 Feb-1","2023 Feb-2","2026 Feb-1"],"frecuencia":4,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Tesis: los universales tienen fundamento real en las cosas, pero solo existen como universales en la mente.","x":"Vía media entre el realismo extremo (universales subsistentes) y el nominalismo (universales como meros nombres)."},{"b":"Solución de inspiración aristotélica: la esencia existe individualizada en cada cosa y se universaliza por abstracción."},{"b":"Abelardo prepara la vía: el universal no es una res sino un sermo con significado fundado en el 'status' común.","x":"Contra su maestro Guillermo de Champeaux: no hay esencia idéntica en todos los individuos, pero el nombre universal no es arbitrario, se apoya en su condición común."},{"b":"Tomás de Aquino, formulación clásica: triple estado del universal, ante rem (mente divina), in re (en los individuos), post rem (concepto abstraído).","x":"Integra platonismo cristiano (ejemplares divinos) y aristotelismo (formas inmanentes, abstracción): es la síntesis escolástica madura."},{"b":"Es un concepto 'cum fundamento in re': la predicación universal es verdadera de los individuos reales."},{"b":"Garantiza la ciencia y evita tanto la duplicación platónica del mundo como el vaciamiento nominalista del concepto."}]},{"id":"tc1-p14","tipo":"desarrollo","enunciado":"El fundamento del conocimiento en Descartes","variantes":["Descartes y el fundamento del conocimiento"],"apariciones":["2022 Feb-2","2023 Feb-2","2025 Feb-2","2026 Feb-2"],"frecuencia":4,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"Proyecto: fundamentar todo el saber sobre una certeza absoluta, al modo matemático; contra el escepticismo.","x":"Descartes busca un punto arquimédico inconmovible del que deducir ordenadamente el edificio entero de la ciencia."},{"b":"Instrumento: la duda metódica, universal e hiperbólica; se rechaza cuanto admita la mínima incertidumbre."},{"b":"Tres niveles de duda: engaños de los sentidos, indistinción sueño/vigilia, hipótesis del genio maligno."},{"b":"Primera certeza: 'cogito, ergo sum'; dudar es pensar, y pensar exige existir; verdad indudable e inmediata.","x":"Ni el engañador más poderoso puede hacer que yo no exista mientras pienso: la duda misma se convierte en prueba."},{"b":"El cogito da el criterio de verdad: es verdadero cuanto se percibe con igual claridad y distinción."},{"b":"Dios veraz, demostrado desde la idea innata de infinito, garantiza la validez del criterio y del mundo exterior.","x":"Sin la veracidad divina, la certeza quedaría encerrada en el instante del cogito; Dios funda la ciencia estable y la realidad extramental."},{"b":"Resultado: el fundamento se traslada al sujeto pensante; giro moderno hacia la filosofía de la conciencia."}]},{"id":"tc1-p15","tipo":"desarrollo","enunciado":"La crítica de Aristóteles a Platón","variantes":["La crítica aristotélica a Platón","Aspectos de la crítica de Aristóteles a Platón"],"apariciones":["2022 Feb-2","2023 Feb-2","2026 Feb-1"],"frecuencia":3,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"Blanco central: la separación (chorismós); la esencia no puede existir fuera de aquello de lo que es esencia.","x":"Es contradictorio que la substancia de una cosa exista separada de la cosa misma: la forma es inmanente al individuo."},{"b":"Las Ideas duplican inútilmente el mundo sensible sin explicarlo: son 'un doblarlo todo'."},{"b":"'Participación' e 'imitación' son metáforas poéticas vacías, sin auténtico valor explicativo."},{"b":"Argumento del tercer hombre: la semejanza entre individuo e Idea exige un tercer término, regreso al infinito."},{"b":"Las Ideas, inmóviles y eternas, no pueden explicar el movimiento, la generación ni la corrupción sensibles.","x":"Aristóteles explicará el devenir con sus propios principios: materia y forma, potencia y acto, las cuatro causas."},{"b":"Alternativa aristotélica: el universal existe en las cosas como forma y se conoce por abstracción, no por reminiscencia."}]},{"id":"tc1-p16","tipo":"desarrollo","enunciado":"El realismo extremo en la controversia medieval de los universales","variantes":["El realismo extremo en la controversia de los universales","La controversia medieval de los universales: el realismo extremo"],"apariciones":["2024 Feb-1","2024 Sep","2025 Feb-1"],"frecuencia":3,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Tesis: los universales son cosas (res) que existen realmente antes e independientemente de los individuos: universalia ante rem.","x":"Cuanto más universal, más real: los géneros y especies poseen mayor entidad que los individuos que los ejemplifican."},{"b":"Herencia platónico-agustiniana: las esencias subsisten como ejemplares, señaladamente en la mente divina."},{"b":"Representantes: Escoto Eriúgena, Anselmo de Canterbury, Guillermo de Champeaux."},{"b":"Champeaux: la misma esencia está toda entera e idéntica en cada individuo; estos solo difieren por accidentes."},{"b":"Crítica de Abelardo: si la esencia fuese idéntica en todos, la misma cosa recibiría predicados contrarios (Sócrates y Platón, aquí y allí).","x":"Ante la objeción, Champeaux se retractó hacia la tesis más débil de la mera indiferencia entre individuos."},{"b":"Servía a la teología (pecado original, Trinidad como esencia común) pero rozaba el panteísmo; por eso fue abandonado."}]},{"id":"tc1-p17","tipo":"desarrollo","enunciado":"La primera verdad en la metafísica de Descartes (el cogito)","variantes":["La primera verdad en la Metafísica de Descartes","El primer conocimiento verdadero en Descartes"],"apariciones":["2020 Feb-1","2024 Feb-2","2026 Feb-1"],"frecuencia":3,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"Tras la duda universal, emerge la primera verdad: 'pienso, luego existo' (cogito, ergo sum).","x":"Aparece en el Discurso del método y en la Segunda Meditación como el primer principio de la filosofía buscada."},{"b":"Es absolutamente indudable: incluso el genio maligno, para engañarme, necesita que yo exista mientras pienso."},{"b":"No es un silogismo sino una intuición inmediata: evidencia directa de la razón, no deducción desde premisas.","x":"Si fuera un razonamiento necesitaría la premisa 'todo lo que piensa existe', más dudosa que la propia certeza inmediata del yo."},{"b":"Descubre la naturaleza del yo: res cogitans, substancia pensante, distinta e independiente del cuerpo."},{"b":"Su forma de evidencia (claridad y distinción) se erige en criterio general de toda verdad."},{"b":"Función arquitectónica: es el cimiento desde el cual se reconstruye el saber (Dios, mundo, ciencia)."}]},{"id":"tc1-p18","tipo":"desarrollo","enunciado":"El método de la ciencia en Descartes (razón y método)","variantes":["El método de la ciencia en Descartes","Razón y método en Descartes"],"apariciones":["2020 Feb-2","2022 Sep","2025 Feb-1"],"frecuencia":3,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"La razón es única e igual en todos; por eso hay una sola ciencia y debe haber un solo método.","x":"Frente a la dispersión escolástica de saberes, Descartes concibe la sabiduría universal como una única razón aplicada a objetos diversos (mathesis universalis)."},{"b":"Modelo: las matemáticas, únicas ciencias que han alcanzado certeza mediante cadenas de razones evidentes."},{"b":"Dos operaciones básicas de la mente: intuición (captación inmediata y evidente) y deducción (encadenamiento de intuiciones)."},{"b":"Regla 1, evidencia: no admitir como verdadero sino lo que se presente claro y distinto."},{"b":"Regla 2, análisis: dividir cada dificultad en cuantas partes simples sea posible."},{"b":"Regla 3, síntesis: ascender con orden de lo más simple a lo más complejo; Regla 4, enumeración: revisiones completas que aseguren no omitir nada."},{"b":"El método sustituye a la silogística escolástica, que solo expone lo sabido y no descubre verdades nuevas."}]},{"id":"tc1-p19","tipo":"desarrollo","enunciado":"Los juicios sintéticos a priori en Kant","variantes":["La doctrina kantiana de los juicios sintéticos a priori"],"apariciones":["2022 Feb-1","2023 Feb-1","2026 Feb-2"],"frecuencia":3,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Juicios analíticos: el predicado está contenido en el sujeto; a priori, necesarios, pero no amplían el conocimiento.","x":"Ejemplo: 'todos los cuerpos son extensos'. Solo explicitan lo ya pensado en el concepto; su verdad se funda en el principio de no contradicción."},{"b":"Juicios sintéticos a posteriori: amplían el conocimiento, pero son contingentes, sin universalidad ni necesidad."},{"b":"Juicios sintéticos a priori: amplían el conocimiento y son universales y necesarios; en ellos se funda la ciencia.","x":"Combinan las ventajas de ambos tipos: extienden el saber (síntesis) con validez estricta (a priori), independiente de la experiencia."},{"b":"Ejemplos kantianos: '7+5=12', 'la recta es la distancia más corta entre dos puntos', 'todo cambio tiene una causa'."},{"b":"Pregunta central de la Crítica: ¿cómo son posibles los juicios sintéticos a priori?"},{"b":"Respuesta: por las formas a priori del sujeto; espacio y tiempo (matemática), categorías (física pura); imposibles en la metafísica trascendente."}]},{"id":"tc1-p20","tipo":"desarrollo","enunciado":"¿Qué es, en Platón, una 'Idea'? (la doctrina platónica de las Ideas)","variantes":["La doctrina platónica de las Ideas"],"apariciones":["2020 Feb-2","2022 Feb-1"],"frecuencia":2,"tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","bullets":[{"b":"La Idea es la esencia universal y objetiva de las cosas: lo que algo verdaderamente es.","x":"El eîdos responde a la pregunta socrática '¿qué es X?': lo justo en sí, lo bello en sí, más allá de casos particulares."},{"b":"Caracteres: única, eterna, inmutable, inteligible, existente en sí y separada del mundo sensible."},{"b":"No es un contenido mental ni un concepto: es una realidad subsistente, el verdadero ser."},{"b":"Origen doble: las definiciones universales de Sócrates y el ser inmutable de Parménides frente al flujo de Heráclito.","x":"Platón salva la ciencia situando lo estable exigido por el saber fuera del mundo sensible en devenir."},{"b":"Las Ideas se jerarquizan y culminan en la Idea del Bien, fundamento del ser y del conocer (símil del Sol)."},{"b":"Correlación ontológico-epistemológica: solo de las Ideas hay ciencia (episteme); de lo sensible, opinión (doxa)."}]},{"id":"tc1-p21","tipo":"desarrollo","enunciado":"Principios y causas del ente en Aristóteles","variantes":[],"apariciones":["2025 Feb-2","2026 Feb-2"],"frecuencia":2,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"La filosofía primera estudia el ente en cuanto ente y sus principios y causas primeras.","x":"Conocer científicamente es, para Aristóteles, conocer por causas: saber por qué algo es y no puede ser de otra manera."},{"b":"La substancia, sentido primero del ser, es compuesto hilemórfico: materia (indeterminada) y forma (esencia determinante)."},{"b":"Acto y potencia explican el devenir: el cambio es el paso de la potencia al acto.","x":"Así se responde a Parménides: el ser en potencia permite que algo llegue a ser sin surgir de la nada."},{"b":"Cuatro causas: material (de qué), formal (qué es), eficiente (por qué agente), final (para qué)."},{"b":"La serie causal culmina en el Primer Motor inmóvil: acto puro que mueve como causa final."},{"b":"Estos principios fundan la ciencia: demostración necesaria de las propiedades desde la esencia y sus causas."}]},{"id":"tc1-p22","tipo":"desarrollo","enunciado":"La teoría de las categorías en el Estoicismo","variantes":["Las categorías en el estoicismo"],"apariciones":["2020 Feb-1","2026 Feb-1"],"frecuencia":2,"tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","bullets":[{"b":"Frente a las diez categorías aristotélicas, los estoicos las reducen a cuatro.","x":"La simplificación responde a su ontología corporeísta y nominalista: no hay géneros del ser separados ni esencias universales reales."},{"b":"Son: substrato (hypokeímenon), cualidad (poión), modo de ser (pōs échon) y modo de ser relativo (prós ti pōs échon)."},{"b":"No clasifican géneros distintos del ser: son aspectos progresivamente determinados del mismo cuerpo individual."},{"b":"Estructura anidada: cada categoría incluye y determina la anterior, del sustrato indeterminado a la relación.","x":"A diferencia de la tabla aristotélica, coordinada, la estoica es una serie de determinaciones crecientes del individuo concreto."},{"b":"Corporeísmo: solo los cuerpos existen y actúan; las categorías describen lo real individual, no esencias."},{"b":"Nominalismo estoico: lo universal es solo concepto (ennóēma), sin realidad propia; anticipa debates medievales."}]},{"id":"tc1-p23","tipo":"desarrollo","enunciado":"El concepto de 'razón' en la metafísica de Descartes","variantes":["El concepto de 'razón' de Descartes"],"apariciones":["2023 Feb-1","2023 Sep"],"frecuencia":2,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"La razón o 'buen sentido' es única e igual en todos los hombres; solo difiere su uso.","x":"Así comienza el Discurso del método: la diversidad de opiniones no prueba desigualdad de razón, sino diferencia de método."},{"b":"Es la facultad de distinguir lo verdadero de lo falso: la 'luz natural'."},{"b":"Opera de dos modos: intuición de naturalezas simples y deducción que encadena evidencias."},{"b":"Es autónoma: no depende de los sentidos, la tradición ni la autoridad; fuente de conocimiento a priori.","x":"Este es el núcleo del racionalismo: la razón basta, por sí sola y bien conducida, para alcanzar la verdad."},{"b":"Contiene ideas innatas (pensamiento, Dios, extensión, verdades matemáticas) sobre las que se funda la ciencia."},{"b":"De su unidad se sigue la unidad del saber: todas las ciencias son la misma razón aplicada a objetos distintos."}]},{"id":"tc1-p24","tipo":"desarrollo","enunciado":"Las ideas innatas en el racionalismo de Descartes (el innatismo)","variantes":["El innatismo de Descartes"],"apariciones":["2022 Feb-1","2024 Sep"],"frecuencia":2,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"Tres clases de ideas: adventicias (venidas de fuera), facticias (construidas por mí) e innatas (nacidas con la mente).","x":"Las adventicias y facticias son dudosas o arbitrarias; solo las innatas ofrecen la evidencia requerida por la ciencia."},{"b":"Las innatas no proceden de la experiencia: la razón las contiene en sí, como disposiciones naturales."},{"b":"Ejemplos: el yo pensante, Dios (lo infinito y perfecto), la extensión, las verdades matemáticas y lógicas."},{"b":"La idea de infinito no puede proceder de un yo finito: prueba de Dios, 'marca del artífice' en la criatura.","x":"Es el argumento de la Tercera Meditación: la causa de una idea debe tener tanta realidad como lo representado en ella."},{"b":"Sobre las ideas innatas claras y distintas se levanta deductivamente el edificio del saber: núcleo del racionalismo."},{"b":"Blanco de la crítica empirista: Locke negará todo innatismo; la mente como 'papel en blanco'."}]},{"id":"tc1-p25","tipo":"desarrollo","enunciado":"Duda y certeza en Descartes","variantes":[],"apariciones":["2024 Feb-1","2025 Sep"],"frecuencia":2,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"La duda cartesiana es metódica y provisional, no escéptica: es un instrumento para hallar lo indudable.","x":"El escéptico duda para instalarse en la duda; Descartes duda para superarla y fundar la certeza."},{"b":"Es universal e hiperbólica: basta la mínima posibilidad de error para suspender el asentimiento."},{"b":"Tres momentos: falacias de los sentidos, indistinción entre sueño y vigilia, hipótesis del genio maligno.","x":"El genio maligno extiende la duda incluso a las matemáticas: un poder engañador podría falsear hasta las evidencias más simples."},{"b":"En el límite de la duda surge la certeza primera: 'cogito, ergo sum'; dudar es pensar y pensar es existir."},{"b":"Del cogito se extrae el criterio de certeza: es verdadero todo lo percibido con claridad y distinción."},{"b":"La veracidad de Dios, demostrada después, elimina el genio maligno y estabiliza la certeza de la ciencia."}]},{"id":"tc1-p26","tipo":"desarrollo","enunciado":"Hume y la crítica del Yo substancial","variantes":[],"apariciones":["2020 Feb-1","2023 Sep"],"frecuencia":2,"tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","bullets":[{"b":"Aplicación del principio de copia: no existe impresión constante e invariable de la que derive la idea de 'yo'.","x":"Si el yo fuera una substancia idéntica y continua, debería haber una impresión igualmente idéntica y continua; no la hay."},{"b":"La introspección solo encuentra percepciones particulares y sucesivas: calor o frío, amor u odio, dolor o placer."},{"b":"El yo es 'un haz o colección de percepciones' en flujo y movimiento perpetuos."},{"b":"La mente es como un teatro sin escenario: solo hay percepciones que se suceden, sin soporte substancial."},{"b":"La identidad personal es una ficción de la imaginación: memoria, semejanza y causalidad enlazan las percepciones.","x":"Atribuimos identidad a lo que solo es sucesión relacionada, igual que hacemos con las cosas: es una propensión natural, no un conocimiento."},{"b":"Culmina la disolución empirista de la substancia: tras la material (Berkeley), cae la espiritual cartesiana."}]},{"id":"tc1-p27","tipo":"desarrollo","enunciado":"El problema de la 'cientificidad' de la metafísica en Kant","variantes":[],"apariciones":["2022 Feb-2","2024 Feb-2"],"frecuencia":2,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Pregunta crítica: ¿puede la metafísica ser ciencia, como lo son la matemática y la física?","x":"Mientras las ciencias avanzan con paso seguro, la metafísica es un 'campo de batalla' de disputas interminables; Kant investiga por qué."},{"b":"Condición de toda ciencia: juicios sintéticos a priori aplicables a la experiencia posible."},{"b":"Los objetos metafísicos (alma, mundo como totalidad, Dios) trascienden toda experiencia: ninguna intuición los llena.","x":"Las categorías sin intuición sensible quedan vacías: pensar esos objetos es posible; conocerlos, no."},{"b":"La Dialéctica trascendental documenta el fracaso: paralogismos, antinomias y refutación de las pruebas de Dios."},{"b":"Conclusión: la metafísica dogmática es imposible como ciencia, pero subsiste como disposición natural inevitable de la razón."},{"b":"Queda un uso legítimo: la crítica del conocimiento, el uso regulativo de las Ideas y su valor práctico-moral.","x":"Kant 'suprime el saber para dejar sitio a la fe': Dios, libertad e inmortalidad reaparecen como postulados de la razón práctica."}]},{"id":"tc1-p28","tipo":"desarrollo","enunciado":"La teoría kantiana de los juicios cognoscitivos","variantes":[],"apariciones":["2024 Feb-1","2025 Sep"],"frecuencia":2,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"El conocimiento se expresa en juicios: síntesis de conceptos con pretensión de validez objetiva.","x":"Por eso la pregunta por el conocimiento científico se convierte en la pregunta por la clase de juicios que lo componen."},{"b":"División por el origen: a priori (universales y necesarios, independientes de la experiencia) y a posteriori (empíricos, contingentes)."},{"b":"División por el contenido: analíticos (el predicado está en el sujeto, explicativos) y sintéticos (añaden algo, extensivos)."},{"b":"Los analíticos a priori no amplían el saber; los sintéticos a posteriori lo amplían sin necesidad."},{"b":"La ciencia se funda en los juicios sintéticos a priori: ampliativos y a la vez universales y necesarios."},{"b":"El problema crítico: cómo son posibles; la Estética responde por la matemática, la Analítica por la física pura."}]},{"id":"tc1-p29","tipo":"desarrollo","enunciado":"La relación entre las Ideas y el mundo sensible en Platón","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","bullets":[{"b":"Dualismo ontológico: mundo inteligible de las Ideas (verdadero ser) frente a mundo sensible (devenir, copia)."},{"b":"Formas de relación: participación (méthexis), imitación (mímesis) y presencia (parusía) de las Ideas en las cosas.","x":"Las cosas son bellas por participar de la Belleza o por imitarla como copias de un modelo; Platón usa ambas metáforas."},{"b":"En el Timeo, el Demiurgo ordena el mundo tomando las Ideas como modelos eternos sobre la materia."},{"b":"Símil de la línea: grados de realidad y conocimiento correlativos; eikasía, pístis (doxa), diánoia, nóesis (episteme).","x":"A imágenes y cosas sensibles corresponde opinión; a entes matemáticos e Ideas, ciencia: el conocer copia la estructura del ser."},{"b":"El mundo sensible, intermedio entre ser y no-ser, solo admite opinión, nunca ciencia estricta."},{"b":"La relación es problemática (chorismós): el Parménides expone las aporías de la participación (tercer hombre)."}]},{"id":"tc1-p30","tipo":"desarrollo","enunciado":"El conocimiento a priori en Platón","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","bullets":[{"b":"El conocimiento verdadero no procede de los sentidos: es anterior e independiente de toda experiencia.","x":"Lo sensible, mudable e imperfecto, no puede fundar el saber universal y necesario que exige la ciencia."},{"b":"Su fundamento es la reminiscencia: el alma recuerda las Ideas contempladas antes de nacer."},{"b":"La percepción es solo ocasión que despierta el recuerdo (Fedón: las cosas iguales evocan lo Igual en sí)."},{"b":"Objetos del a priori: las Ideas y las verdades matemáticas, necesarias e inmutables."},{"b":"Su método es la dialéctica: ascenso puramente racional hasta el principio anhipotético, sin apoyo sensible.","x":"A diferencia de la diánoia matemática, que parte de hipótesis y usa figuras, la nóesis dialéctica se mueve solo entre Ideas."},{"b":"Platón inaugura la tradición racionalista e innatista que reaparecerá en Agustín, Descartes y Leibniz."}]},{"id":"tc1-p31","tipo":"desarrollo","enunciado":"La Lógica en Aristóteles","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"La lógica es el Órganon: instrumento previo de toda ciencia; estudia las formas válidas del pensar.","x":"No es una ciencia más sino la herramienta común: analiza el discurso demostrativo con independencia de su contenido."},{"b":"Elementos: concepto o término (tratado en Categorías), juicio o proposición (De interpretatione), razonamiento (Analíticos)."},{"b":"Centro: el silogismo; de dos premisas con un término medio se sigue necesariamente la conclusión.","x":"Ejemplo canónico: todo hombre es mortal, Sócrates es hombre, luego Sócrates es mortal. La necesidad es formal: depende de la estructura."},{"b":"La ciencia es silogismo demostrativo: parte de premisas verdaderas, primeras, inmediatas y causales (Analíticos segundos)."},{"b":"Los primeros principios (no contradicción, tercero excluido) no se demuestran: se captan por inducción y noûs.","x":"Toda demostración acabaría en regreso infinito si no hubiera principios evidentes captados intelectualmente a partir de la experiencia."},{"b":"Es lógica de términos y clases; los estoicos la complementarán con la lógica de proposiciones."}]},{"id":"tc1-p32","tipo":"desarrollo","enunciado":"La teoría del juicio en el Estoicismo","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","bullets":[{"b":"El juicio es el asentimiento (synkatáthesis) que la razón otorga a una representación (phantasía).","x":"Conocer no es solo recibir representaciones sino aprobarlas: el juicio añade el acto voluntario del asentimiento."},{"b":"Criterio de verdad: la representación comprensiva (phantasía katalēptikē), que se impone con evidencia y garantiza su origen real."},{"b":"El asentimiento es libre y voluntario: el error consiste en asentir a representaciones no comprensivas.","x":"De ahí la dimensión moral del conocimiento estoico: el sabio disciplina su asentimiento y no opina jamás."},{"b":"El contenido del juicio es un lektón completo: el axíoma o proposición, portador de verdad o falsedad."},{"b":"La ciencia es un sistema de aprehensiones (katálēpsis) firmes e inconmovibles ante la razón: propia del sabio."},{"b":"Frente a ellos, el escepticismo académico niega que exista representación comprensiva y recomienda suspender el juicio (epoché)."}]},{"id":"tc1-p33","tipo":"desarrollo","enunciado":"La doctrina de la 'iluminación' en San Agustín","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","bullets":[{"b":"Problema: cómo una mente mudable y finita conoce verdades eternas, necesarias e inmutables (matemáticas, morales).","x":"Ni los sentidos ni la mente cambiante pueden ser su origen: las verdades eternas superan a su poseedor."},{"b":"Solución: Dios ilumina la mente humana; vemos las verdades eternas en la luz divina, como el ojo ve en la luz del sol."},{"b":"Transformación cristiana del platonismo: las Ideas son ejemplares eternos en la mente de Dios.","x":"Agustín acoge la teoría de las Ideas pero les niega subsistencia autónoma: son los pensamientos creadores divinos."},{"b":"Sustituye la reminiscencia platónica: no hay preexistencia del alma; hay iluminación presente del Maestro interior."},{"b":"Camino de interiorización: 'no salgas fuera, vuelve a ti; en el interior del hombre habita la verdad'."},{"b":"Marco de fe y razón unidas: 'cree para entender, entiende para creer'; conocer es ascender hacia Dios."}]},{"id":"tc1-p34","tipo":"desarrollo","enunciado":"Adaptaciones del platonismo y el aristotelismo en la teología medieval","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","bullets":[{"b":"La teología medieval piensa la fe con los instrumentos conceptuales griegos, adaptados al dogma cristiano.","x":"La filosofía griega proporciona el vocabulario y las estructuras; la revelación impone correcciones decisivas en su contenido."},{"b":"Vía platónico-agustiniana (Patrística, alta Edad Media): las Ideas pasan a ser ejemplares en la mente divina; iluminación en lugar de reminiscencia."},{"b":"El neoplatonismo aporta el esquema de emanación y retorno, reinterpretado como creación y salvación (Eriúgena, Anselmo)."},{"b":"Siglo XIII: recepción de Aristóteles vía árabes (Avicena, Averroes); Tomás adapta hilemorfismo, acto/potencia y motor inmóvil.","x":"El motor inmóvil se convierte en Dios creador y providente; las cinco vías tomistas reelaboran argumentos aristotélicos."},{"b":"Correcciones cristianas obligadas: creación desde la nada, mundo no eterno, providencia, alma individual inmortal."},{"b":"El aristotelismo radical (averroísmo latino: eternidad del mundo, entendimiento único) es condenado en 1277."},{"b":"Resultado: dos grandes síntesis rivales, agustinismo franciscano y aristotelismo dominico, que estructuran la escolástica."}]},{"id":"tc1-p35","tipo":"desarrollo","enunciado":"El problema de los Universales en la Edad Media (planteamiento general y soluciones)","variantes":[],"apariciones":["2023 Sep"],"frecuencia":1,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Origen: la Isagoge de Porfirio, transmitida y comentada por Boecio, plantea el estatuto de géneros y especies.","x":"Porfirio formula las preguntas y las deja sin responder; Boecio las lega a la Edad Media como problema abierto."},{"b":"Tres preguntas: ¿subsisten o son solo conceptos?; si subsisten, ¿corpóreos o incorpóreos?; ¿separados o en lo sensible?"},{"b":"Trasfondo: la herencia platónico-aristotélica según la cual la ciencia versa sobre esencias universales y necesarias."},{"b":"Realismo extremo (Eriúgena, Anselmo, Champeaux): los universales son cosas reales anteriores a los individuos (ante rem)."},{"b":"Realismo moderado (Abelardo, Tomás de Aquino): universal fundado en las cosas (in re), universalizado por abstracción (post rem)."},{"b":"Nominalismo (Roscelino, Ockham): solo existen individuos; el universal es nombre o signo mental."},{"b":"Alcance: en juego están el valor de la ciencia y dogmas teológicos; el triunfo nominalista final anuncia la modernidad.","x":"Si no hay esencias universales reales, la ciencia de lo universal pierde su objeto clásico y el saber se reorienta hacia lo empírico-singular."}]},{"id":"tc1-p36","tipo":"desarrollo","enunciado":"Variedades del realismo en la controversia de los universales","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Todo realismo sostiene que los universales tienen realidad extramental: no son meros nombres o conceptos vacíos."},{"b":"Realismo extremo: el universal es cosa subsistente, anterior a los individuos (ante rem); herencia platónico-agustiniana.","x":"Representantes: Escoto Eriúgena, Anselmo, Guillermo de Champeaux. Cuanto más universal, más real."},{"b":"Champeaux: la esencia idéntica está toda entera en cada individuo; los individuos difieren solo por accidentes."},{"b":"Crítica de Abelardo al realismo extremo: la esencia común idéntica cargaría con predicados contrarios simultáneos."},{"b":"Realismo moderado: el universal existe en las cosas como forma individualizada; como universal, solo en la mente (post rem).","x":"Es la posición aristotélica asumida por Tomás de Aquino: abstracción con fundamento real, triple estado del universal."},{"b":"Diferencia clave entre variedades: subsistencia separada del universal frente a fundamento real más abstracción intelectual."}]},{"id":"tc1-p37","tipo":"desarrollo","enunciado":"La crítica del empirismo al racionalismo","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","bullets":[{"b":"Contra el innatismo cartesiano, Locke: la mente es 'papel en blanco'; todo procede de la experiencia (sensación y reflexión).","x":"Si hubiera ideas innatas serían universalmente conocidas, y no lo son (niños, pueblos sin tales nociones): la génesis del conocimiento es empírica."},{"b":"Hume radicaliza con el principio de copia: toda idea deriva de una impresión; sin impresión, término vacío."},{"b":"Crítica de la substancia: Locke la reduce a 'un no sé qué' supuesto; Berkeley niega la material; Hume, también la espiritual (yo)."},{"b":"Crítica de la causalidad: no hay conexión necesaria conocible a priori, solo conjunción constante y hábito."},{"b":"Resultado: la razón no puede conocer a priori el mundo; las tesis metafísicas racionalistas (Dios, alma, mundo) quedan injustificadas."},{"b":"Desemboca en el escepticismo mitigado de Hume y prepara la síntesis crítica de Kant.","x":"Kant reconocerá que Hume lo despertó del 'sueño dogmático': ni todo viene de la experiencia (racionalismo refutado) ni el a priori es eliminable."}]},{"id":"tc1-p38","tipo":"desarrollo","enunciado":"La Analítica transcendental en Kant","variantes":[],"apariciones":["2022 Feb-2"],"frecuencia":1,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Parte de la Lógica trascendental que estudia el entendimiento y sus conceptos puros: las categorías.","x":"Es la 'lógica de la verdad': establece las condiciones a priori bajo las cuales el pensar se refiere legítimamente a objetos."},{"b":"Analítica de los conceptos: deducción metafísica (tabla de categorías desde las formas del juicio) y deducción trascendental.","x":"La deducción trascendental legitima la validez objetiva de las categorías: sin ellas no habría experiencia unificada de objetos."},{"b":"Fundamento supremo: la unidad trascendental de apercepción, el 'yo pienso' que acompaña toda representación."},{"b":"Analítica de los principios: el esquematismo (mediación temporal) y los principios puros del entendimiento.","x":"Axiomas de la intuición, anticipaciones de la percepción, analogías de la experiencia (substancia, causalidad, comunidad) y postulados del pensar empírico."},{"b":"El entendimiento es espontaneidad que unifica lo dado por la sensibilidad: 'intuiciones sin conceptos son ciegas'."},{"b":"Fundamenta la física pura (substancia, causalidad como leyes a priori) y concluye distinguiendo fenómeno y noúmeno."}]},{"id":"tc1-p39","tipo":"desarrollo","enunciado":"La Lógica transcendental en Kant","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Estudia el origen, alcance y validez objetiva de los conocimientos a priori del entendimiento y la razón."},{"b":"A diferencia de la lógica formal, no prescinde de todo contenido: atiende a la referencia a priori a objetos.","x":"La lógica general abstrae de la relación con el objeto; la trascendental examina cómo conceptos puros pueden referirse a priori a objetos."},{"b":"Se divide en Analítica trascendental (lógica de la verdad) y Dialéctica trascendental (lógica de la ilusión)."},{"b":"La Analítica expone categorías y principios del entendimiento como condiciones de posibilidad de la experiencia."},{"b":"La Dialéctica critica a la razón cuando traspasa la experiencia: Ideas de alma, mundo y Dios."},{"b":"Complementa la Estética trascendental: sensibilidad y entendimiento son las dos fuentes cooperantes del conocimiento.","x":"Del primer tronco vienen las intuiciones, del segundo los conceptos; solo su unión produce conocimiento objetivo."}]},{"id":"tc1-p40","tipo":"desarrollo","enunciado":"La relación sujeto/objeto en Kant","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Giro copernicano: no es el conocimiento el que se rige por los objetos; los objetos se rigen por nuestro conocimiento.","x":"Como Copérnico invirtió la relación sol-tierra, Kant invierte la relación sujeto-objeto para explicar el a priori de la ciencia."},{"b":"El objeto de conocimiento es en parte construido: la materia la da la sensación; la forma la pone el sujeto."},{"b":"El sujeto es trascendental: estructura universal y necesaria (espacio, tiempo, categorías, apercepción), no el yo psicológico individual."},{"b":"Conocemos fenómenos, no cosas en sí: el objeto solo es objeto dentro de las condiciones de la experiencia."},{"b":"Idealismo trascendental compatible con realismo empírico: los fenómenos son plenamente objetivos para todo sujeto.","x":"La objetividad no desaparece: se redefine como validez universal fundada en estructuras idénticas en todos los sujetos."},{"b":"Supera racionalismo y empirismo: 'los conceptos sin intuiciones son vacíos, las intuiciones sin conceptos son ciegas'."}]},{"id":"tc1-p41","tipo":"desarrollo","enunciado":"El fundamento del conocimiento en Kant","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"El fundamento último del conocimiento no está en el objeto sino en el sujeto trascendental y sus formas a priori.","x":"Es la primera teoría idealista del conocimiento: las condiciones del saber son estructuras del sujeto racional humano."},{"b":"Revolución copernicana: los objetos deben conformarse a nuestras estructuras cognoscitivas, no a la inversa."},{"b":"Dos fuentes cooperantes: sensibilidad (intuiciones bajo espacio y tiempo) y entendimiento (conceptos, categorías)."},{"b":"Fundamento supremo: la unidad trascendental de apercepción, el 'yo pienso' que unifica toda representación."},{"b":"El conocimiento legítimo consiste en juicios sintéticos a priori aplicados a la experiencia posible."},{"b":"Límite constitutivo del fundamento: solo conocemos fenómenos; la cosa en sí resulta incognoscible.","x":"El mismo fundamento que hace posible la ciencia prohíbe la metafísica trascendente: fundamentación y limitación van unidas."}]}],"cards":[{"id":"tc1-c01","tema":"Tema 1: Platón","front":"¿Qué es una Idea platónica?","back":"Esencia universal, eterna, inmutable e inteligible, que existe en sí, separada de lo sensible. Es el verdadero ser y el único objeto de ciencia (episteme)."},{"id":"tc1-c02","tema":"Tema 1: Platón","front":"Anámnesis (reminiscencia)","back":"Conocer es recordar: el alma contempló las Ideas antes de encarnarse. Pruebas: esclavo del Menón, argumento de lo Igual en el Fedón."},{"id":"tc1-c03","tema":"Tema 1: Platón","front":"Episteme vs. doxa","back":"Episteme: ciencia, saber necesario sobre las Ideas. Doxa: opinión, creencia mudable sobre el mundo sensible intermedio entre ser y no-ser."},{"id":"tc1-c04","tema":"Tema 1: Platón","front":"Símil de la línea: cuatro grados","back":"Eikasía (imágenes), pístis (cosas sensibles) = doxa; diánoia (matemáticas), nóesis (Ideas, dialéctica) = episteme. Grados de conocimiento correlativos a grados de ser."},{"id":"tc1-c05","tema":"Tema 1: Platón","front":"Chorismós","back":"La 'separación' entre mundo inteligible y sensible: dificultad central de la teoría de las Ideas. ¿Cómo relacionar dos órdenes heterogéneos de realidad?"},{"id":"tc1-c06","tema":"Tema 1: Platón","front":"Argumento del 'tercer hombre'","back":"Objeción del Parménides: la semejanza entre los hombres y la Idea de Hombre exige una tercera Idea que la funde, y así al infinito."},{"id":"tc1-c07","tema":"Tema 1: Platón","front":"Méthexis y mímesis","back":"Los dos modos de relación cosas-Ideas: participación (las cosas participan de la Idea) e imitación (las cosas copian la Idea como modelo)."},{"id":"tc1-c08","tema":"Tema 1: Platón","front":"Paradoja de Menón","back":"No se puede buscar ni lo que se sabe (ya se tiene) ni lo que se ignora (no se reconocería). Platón la resuelve con la reminiscencia."},{"id":"tc1-c09","tema":"Tema 1: Platón","front":"Idea del Bien","back":"Cúspide del mundo inteligible: como el sol, da ser y cognoscibilidad a las demás Ideas. Fundamento último ontológico y epistemológico (República)."},{"id":"tc1-c10","tema":"Tema 1: Platón","front":"Dialéctica platónica","back":"Método supremo de conocimiento: ascenso racional de Idea en Idea hasta el principio anhipotético (el Bien), sin apoyarse en lo sensible."},{"id":"tc1-c11","tema":"Tema 2: Aristóteles","front":"Categorías aristotélicas: definición y número","back":"Géneros supremos del ser, modos generales de ser y predicarse: diez. Substancia más nueve accidentes (cantidad, cualidad, relación, lugar, tiempo, posición, posesión, acción, pasión)."},{"id":"tc1-c12","tema":"Tema 2: Aristóteles","front":"Substancia primera vs. substancia segunda","back":"Primera: el individuo concreto, que existe en sí (este hombre). Segunda: especies y géneros que se predican de él (hombre, animal)."},{"id":"tc1-c13","tema":"Tema 2: Aristóteles","front":"'El ser se dice de muchas maneras'","back":"Tesis antiunivocista: hay una pluralidad de sentidos del ser (las categorías), unificados por referencia a la substancia (pros hen)."},{"id":"tc1-c14","tema":"Tema 2: Aristóteles","front":"Abstracción","back":"Operación por la que el entendimiento extrae la forma universal de las imágenes sensibles (phantasmata), prescindiendo de la materia individual. Origen empírico del concepto."},{"id":"tc1-c15","tema":"Tema 2: Aristóteles","front":"Entendimiento agente y paciente","back":"El agente ilumina el phantasma y actualiza lo inteligible en potencia; el paciente recibe la forma y se hace todas las cosas."},{"id":"tc1-c16","tema":"Tema 2: Aristóteles","front":"Hilemorfismo","back":"La substancia sensible es compuesto de materia (sustrato indeterminado) y forma (esencia que determina). La forma es inmanente, no separada."},{"id":"tc1-c17","tema":"Tema 2: Aristóteles","front":"Acto y potencia","back":"Principios que explican el cambio: devenir es paso de potencia (capacidad de ser) a acto (realización). Respuesta al inmovilismo de Parménides."},{"id":"tc1-c18","tema":"Tema 2: Aristóteles","front":"Las cuatro causas","back":"Material (de qué), formal (qué es), eficiente (agente que produce) y final (para qué). Conocer científicamente es conocer por causas."},{"id":"tc1-c19","tema":"Tema 2: Aristóteles","front":"Silogismo demostrativo (ciencia)","back":"Razonamiento desde premisas verdaderas, primeras e inmediatas que concluye necesariamente. La ciencia demuestra propiedades desde esencias y causas (Analíticos segundos)."},{"id":"tc1-c20","tema":"Tema 2: Aristóteles","front":"¿Cómo se conocen los primeros principios?","back":"No se demuestran (habría regreso infinito): se captan por inducción desde la experiencia y por intuición intelectual (noûs)."},{"id":"tc1-c21","tema":"Tema 2: Aristóteles","front":"Núcleo de la crítica de Aristóteles a Platón","back":"La esencia no existe separada de la cosa: las Ideas duplican el mundo sin explicarlo; participación e imitación son metáforas vacías; tercer hombre."},{"id":"tc1-c22","tema":"Tema 3: Helenismo","front":"Phantasía katalēptikē","back":"Representación comprensiva estoica: se impone con evidencia irresistible y garantiza proceder del objeto real. Es el criterio de verdad del estoicismo."},{"id":"tc1-c23","tema":"Tema 3: Helenismo","front":"Synkatáthesis","back":"Asentimiento: acto voluntario por el que la razón aprueba una representación. El error es asentir a representaciones no comprensivas."},{"id":"tc1-c24","tema":"Tema 3: Helenismo","front":"Lektón","back":"Lo 'expresable' o significado: entidad incorporal que media entre el signo lingüístico y la cosa. El lektón completo es la proposición (axíoma)."},{"id":"tc1-c25","tema":"Tema 3: Helenismo","front":"Las cuatro categorías estoicas","back":"Substrato, cualidad, modo de ser y modo de ser relativo. Determinaciones anidadas del cuerpo individual, no géneros del ser separados."},{"id":"tc1-c26","tema":"Tema 3: Helenismo","front":"Lógica estoica vs. lógica aristotélica","back":"Estoica: lógica de proposiciones (inferencias entre enunciados, cinco indemostrables). Aristotélica: lógica de términos y clases (silogística)."},{"id":"tc1-c27","tema":"Tema 3: Helenismo","front":"Las tres partes de la filosofía estoica","back":"Lógica, física y ética. La lógica (retórica y dialéctica) es instrumental: el saber se subordina al ideal de vida del sabio."},{"id":"tc1-c28","tema":"Tema 3: Helenismo","front":"Epoché escéptica","back":"Suspensión del juicio: al no haber representación que garantice la verdad, el escéptico no asiente a nada y alcanza la ataraxia."},{"id":"tc1-c29","tema":"Tema 3: Helenismo","front":"Instrumentalización helenística del conocimiento","back":"En estoicismo, epicureísmo y escepticismo el conocer deja de ser fin en sí: sirve a la ética, a la vida feliz e imperturbable."},{"id":"tc1-c30","tema":"Tema 4: Edad Media","front":"'Credo ut intelligam'","back":"Lema agustiniano-anselmiano: creo para entender. La fe orienta y precede a la razón; entender es profundizar lo creído."},{"id":"tc1-c31","tema":"Tema 4: Edad Media","front":"Iluminación agustiniana","back":"Dios ilumina la mente para que conozca las verdades eternas e inmutables, que superan a la mente mudable. Sustituye a la reminiscencia platónica."},{"id":"tc1-c32","tema":"Tema 4: Edad Media","front":"¿Dónde sitúa Agustín las Ideas platónicas?","back":"En la mente de Dios: son los ejemplares eternos según los cuales Dios crea. Adaptación cristiana del platonismo."},{"id":"tc1-c33","tema":"Tema 4: Edad Media","front":"Razón y fe en Tomás de Aquino","back":"Distintas pero armónicas: hay preámbulos demostrables (existencia de Dios) y misterios sobrenaturales. No cabe contradicción real: ambas proceden de Dios."},{"id":"tc1-c34","tema":"Tema 4: Edad Media","front":"Doble verdad (averroísmo latino)","back":"Tesis atribuida a Siger de Brabante: lo verdadero en filosofía puede contradecir la teología. Condenada por Tempier en 1277."},{"id":"tc1-c35","tema":"Tema 4: Edad Media","front":"Las cuatro etapas de la relación razón/fe","back":"1) Identificación agustiniana; 2) armonía y distinción tomista; 3) doble verdad averroísta; 4) separación ockhamista, que emancipa la razón."},{"id":"tc1-c36","tema":"Tema 5: Universales","front":"Origen del problema de los universales","back":"La Isagoge de Porfirio, comentada por Boecio: ¿géneros y especies subsisten o son solo conceptos?; ¿corpóreos?; ¿separados o en lo sensible?"},{"id":"tc1-c37","tema":"Tema 5: Universales","front":"Universalia ante rem / in re / post rem","back":"Ante rem: universal anterior a las cosas (realismo extremo; en Dios). In re: forma en los individuos. Post rem: concepto abstraído (realismo moderado)."},{"id":"tc1-c38","tema":"Tema 5: Universales","front":"Realismo extremo: tesis y autores","back":"Los universales son cosas subsistentes anteriores a los individuos. Escoto Eriúgena, Anselmo, Guillermo de Champeaux. Herencia platónico-agustiniana."},{"id":"tc1-c39","tema":"Tema 5: Universales","front":"Crítica de Abelardo a Champeaux","back":"Si la esencia fuese idéntica y entera en todos los individuos, la misma cosa recibiría predicados contrarios a la vez. El universal es 'sermo' con fundamento en el status común."},{"id":"tc1-c40","tema":"Tema 5: Universales","front":"Roscelino","back":"Nominalismo temprano: el universal es 'flatus vocis', mero soplo de voz. Solo existen individuos; los nombres generales no designan esencias."},{"id":"tc1-c41","tema":"Tema 5: Universales","front":"Navaja de Ockham","back":"Principio de economía: no multiplicar los entes sin necesidad. Elimina esencias universales, especies inteligibles y entidades explicativas superfluas."},{"id":"tc1-c42","tema":"Tema 5: Universales","front":"Suppositio (Ockham)","back":"Función del término en la proposición de 'estar en lugar de' los individuos que significa. El universal es signo mental que suple por muchos."},{"id":"tc1-c43","tema":"Tema 5: Universales","front":"Conocimiento intuitivo y abstractivo en Ockham","back":"Intuitivo: captación directa del individuo existente, base de toda evidencia. Abstractivo: conceptos generales elaborados después, sin garantizar existencia."},{"id":"tc1-c44","tema":"Tema 5: Universales","front":"Consecuencias del nominalismo de Ockham","back":"Separación de fe y razón, crisis de la metafísica esencialista y de la escolástica, giro hacia lo singular y empírico: antesala de la modernidad."},{"id":"tc1-c45","tema":"Tema 6: Racionalismo","front":"Tesis central del racionalismo","back":"El fundamento del conocimiento es la razón, fuente de verdades a priori independientes de la experiencia sensible. Modelo: la certeza matemática."},{"id":"tc1-c46","tema":"Tema 6: Racionalismo","front":"Duda metódica: tres niveles","back":"1) Engaños de los sentidos; 2) indistinción sueño/vigilia; 3) genio maligno, que alcanza incluso a las matemáticas. Universal, hiperbólica y provisional."},{"id":"tc1-c47","tema":"Tema 6: Racionalismo","front":"Cogito, ergo sum","back":"Primera verdad indudable: dudar es pensar y pensar exige existir. No es silogismo sino intuición inmediata. Descubre el yo como res cogitans."},{"id":"tc1-c48","tema":"Tema 6: Racionalismo","front":"Criterio cartesiano de verdad","back":"Claridad y distinción: es verdadero todo lo que se percibe tan clara y distintamente como el cogito. Garantizado por la veracidad divina."},{"id":"tc1-c49","tema":"Tema 6: Racionalismo","front":"Las tres clases de ideas en Descartes","back":"Adventicias (vienen de fuera), facticias (las construye la mente) e innatas (nacen con la razón: yo, Dios, extensión, verdades matemáticas)."},{"id":"tc1-c50","tema":"Tema 6: Racionalismo","front":"Intuición y deducción","back":"Las dos operaciones de la razón cartesiana: captación inmediata y evidente de naturalezas simples, y encadenamiento ordenado de intuiciones."},{"id":"tc1-c51","tema":"Tema 6: Racionalismo","front":"Las cuatro reglas del método cartesiano","back":"Evidencia (solo lo claro y distinto), análisis (dividir), síntesis (orden de simple a complejo) y enumeración (revisiones completas)."},{"id":"tc1-c52","tema":"Tema 6: Racionalismo","front":"Papel de Dios en el sistema cartesiano","back":"Demostrado desde la idea innata de infinito, su veracidad descarta el genio maligno y garantiza el criterio de verdad y el mundo exterior."},{"id":"tc1-c53","tema":"Tema 6: Racionalismo","front":"Mathesis universalis","back":"Ideal cartesiano de ciencia universal del orden y la medida: una sola razón, un solo método de tipo matemático para todo el saber."},{"id":"tc1-c54","tema":"Tema 7: Empirismo","front":"Tesis central del empirismo","back":"Todo conocimiento procede de la experiencia sensible; no hay ideas innatas. La experiencia es origen y límite del saber (Locke, Berkeley, Hume)."},{"id":"tc1-c55","tema":"Tema 7: Empirismo","front":"Tabula rasa (Locke)","back":"La mente al nacer es papel en blanco: todos los contenidos provienen de la experiencia, externa (sensación) o interna (reflexión)."},{"id":"tc1-c56","tema":"Tema 7: Empirismo","front":"Impresiones e ideas (Hume)","back":"Impresiones: percepciones vivaces actuales (sensaciones, pasiones). Ideas: sus copias débiles en el pensar. Toda idea legítima deriva de impresiones (principio de copia)."},{"id":"tc1-c57","tema":"Tema 7: Empirismo","front":"Relaciones de ideas vs. cuestiones de hecho","back":"Relaciones de ideas: necesarias, a priori (matemáticas), no informan del mundo. Cuestiones de hecho: contingentes, a posteriori, fundadas en la causalidad."},{"id":"tc1-c58","tema":"Tema 7: Empirismo","front":"Conocimiento intuitivo y demostrativo en Hume","back":"Intuitivo: relaciones captadas de inmediato (semejanza, grados). Demostrativo: cadenas de intuiciones, solo en cantidad y número (matemáticas)."},{"id":"tc1-c59","tema":"Tema 7: Empirismo","front":"Análisis humeano de la causalidad","back":"Solo observamos contigüidad, sucesión y conjunción constante; la 'conexión necesaria' no tiene impresión: nace del hábito y se proyecta sobre los objetos."},{"id":"tc1-c60","tema":"Tema 7: Empirismo","front":"Creencia (belief) en Hume","back":"Idea vivaz asociada a una impresión presente: sostiene las inferencias causales y la expectativa de futuro. Base psicológica, no racional, de la vida cognoscitiva."},{"id":"tc1-c61","tema":"Tema 7: Empirismo","front":"El yo según Hume","back":"No hay impresión del yo: es un haz de percepciones en flujo perpetuo. La identidad personal es ficción de la imaginación (memoria, causalidad)."},{"id":"tc1-c62","tema":"Tema 7: Empirismo","front":"Asociación de ideas (Hume)","back":"Tres leyes que enlazan ideas: semejanza, contigüidad espacio-temporal y causa-efecto. Son la 'atracción' que ordena la vida mental."},{"id":"tc1-c63","tema":"Tema 7: Empirismo","front":"Esse est percipi (Berkeley)","back":"Ser es ser percibido: no existe substancia material; solo existen ideas y los espíritus que las perciben. Inmaterialismo empirista."},{"id":"tc1-c64","tema":"Tema 8: Kant","front":"Giro copernicano","back":"Inversión kantiana: los objetos se rigen por nuestras estructuras cognoscitivas, no a la inversa. Explica la posibilidad de juicios sintéticos a priori."},{"id":"tc1-c65","tema":"Tema 8: Kant","front":"'Trascendental' en Kant","back":"Conocimiento que no versa sobre objetos sino sobre nuestro modo a priori de conocerlos: sus condiciones de posibilidad."},{"id":"tc1-c66","tema":"Tema 8: Kant","front":"Juicio sintético a priori","back":"Juicio que amplía el conocimiento (sintético) y es universal y necesario (a priori). Funda la ciencia. Ejemplos: 7+5=12; todo cambio tiene causa."},{"id":"tc1-c67","tema":"Tema 8: Kant","front":"Espacio y tiempo en Kant","back":"Formas puras a priori de la sensibilidad (Estética trascendental): espacio, sentido externo; tiempo, sentido interno. Fundan la matemática; solo valen para fenómenos."},{"id":"tc1-c68","tema":"Tema 8: Kant","front":"Fenómeno vs. noúmeno (cosa en sí)","back":"Fenómeno: lo que aparece bajo las formas a priori del sujeto; único objeto de conocimiento. Noúmeno: la cosa en sí, pensable pero incognoscible."},{"id":"tc1-c69","tema":"Tema 8: Kant","front":"Las categorías kantianas","back":"Doce conceptos puros del entendimiento, derivados de las formas del juicio, en cuatro grupos: cantidad, cualidad, relación y modalidad. Solo valen en la experiencia."},{"id":"tc1-c70","tema":"Tema 8: Kant","front":"Deducción trascendental de las categorías","back":"Justifica su validez objetiva: sin categorías no habría experiencia unificada de objetos. Fundamento: la unidad trascendental de apercepción ('yo pienso')."},{"id":"tc1-c71","tema":"Tema 8: Kant","front":"Esquematismo trascendental","back":"Mediación entre categorías e intuiciones mediante esquemas: determinaciones a priori del tiempo producidas por la imaginación trascendental."},{"id":"tc1-c72","tema":"Tema 8: Kant","front":"Las tres Ideas de la razón","back":"Alma, mundo y Dios: conceptos de lo incondicionado, sin objeto en la experiencia. Sin uso constitutivo; solo uso regulativo que orienta la investigación."},{"id":"tc1-c73","tema":"Tema 8: Kant","front":"Paralogismos y antinomias","back":"Paralogismos: falsas inferencias sobre el alma substancial. Antinomias: contradicciones cosmológicas (tesis/antítesis igualmente demostrables). Ambos, ilusiones de la Dialéctica."},{"id":"tc1-c74","tema":"Tema 8: Kant","front":"Crítica kantiana a las pruebas de Dios","back":"Refuta las pruebas ontológica, cosmológica y físico-teológica. Clave: la existencia no es un predicado real; no cabe teología racional teórica."},{"id":"tc1-c75","tema":"Tema 8: Kant","front":"¿Es la metafísica ciencia según Kant?","back":"No: sus objetos exceden toda experiencia posible y carece de juicios sintéticos a priori verificables. Subsiste como disposición natural y como crítica."},{"id":"tc1-c76","tema":"Tema 8: Kant","front":"Estructura de la Crítica de la razón pura","back":"Estética trascendental (sensibilidad: espacio y tiempo); Lógica trascendental: Analítica (entendimiento: categorías, principios) y Dialéctica (razón: Ideas, ilusión)."},{"id":"tc1-c77","tema":"Tema 8: Kant","front":"'Intuiciones sin conceptos, conceptos sin intuiciones'","back":"'Los pensamientos sin contenido son vacíos; las intuiciones sin conceptos, ciegas': sensibilidad y entendimiento deben cooperar; síntesis de empirismo y racionalismo."}],"mcqs":[{"id":"tc1-t001","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c01","enunciado":"Según Platón, una Idea es...","opciones":["Una esencia universal, eterna e inmutable que existe separada del mundo sensible","Un concepto abstraído de la experiencia que solo existe en la mente humana","Una representación mental formada por asociación de percepciones sensibles"],"correcta":0,"explicacion":"La Idea platónica no es un contenido mental sino una realidad subsistente: el verdadero ser y el único objeto de ciencia (episteme). La abstracción desde lo sensible es la tesis aristotélica."},{"id":"tc1-t002","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c02","enunciado":"¿Qué sostiene la teoría platónica de la reminiscencia (anámnesis)?","opciones":["Conocer es abstraer formas universales a partir de las imágenes sensibles","Conocer es recordar las Ideas que el alma contempló antes de encarnarse","Conocer es recibir contenidos de la experiencia sobre una mente en blanco"],"correcta":1,"explicacion":"Para Platón, aprender es actualizar un saber latente que el alma trae de su existencia anterior (esclavo del Menón, argumento de lo Igual del Fedón). La abstracción es de Aristóteles y la mente en blanco, de Locke."},{"id":"tc1-t003","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c03","enunciado":"En Platón, la episteme se distingue de la doxa porque...","opciones":["Versa sobre el mundo sensible y sus objetos cambiantes","Es una creencia probable basada en la percepción y la costumbre","Versa sobre las Ideas y es un saber necesario e inmutable"],"correcta":2,"explicacion":"La episteme es ciencia de las Ideas; la doxa es opinión mudable sobre lo sensible, intermedio entre ser y no-ser. Las otras opciones describen justamente la doxa."},{"id":"tc1-t004","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c04","enunciado":"En el símil de la línea, los grados que componen la episteme son...","opciones":["Diánoia (matemáticas) y nóesis (dialéctica de las Ideas)","Eikasía (imágenes) y pístis (cosas sensibles)","Pístis (cosas sensibles) y diánoia (matemáticas)"],"correcta":0,"explicacion":"Eikasía y pístis forman la doxa (mundo sensible); diánoia y nóesis forman la episteme (mundo inteligible). Los grados de conocimiento son correlativos a los grados de ser."},{"id":"tc1-t005","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c05","enunciado":"¿Qué designa el 'chorismós' en la teoría platónica de las Ideas?","opciones":["La participación de las cosas sensibles en las Ideas","La separación entre el mundo inteligible y el mundo sensible","El ascenso dialéctico del alma hasta la Idea del Bien"],"correcta":1,"explicacion":"El chorismós es la separación entre los dos órdenes de realidad, dificultad central de la teoría: no se ve cómo relacionar dos ámbitos heterogéneos. La participación es la méthexis."},{"id":"tc1-t006","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c06","enunciado":"El argumento del 'tercer hombre' objeta a Platón que...","opciones":["No puede haber Ideas de cosas viles como el barro o el pelo","La Idea, siendo una, no puede estar entera en muchas cosas a la vez","La semejanza entre las cosas y su Idea exige otra Idea, en regreso infinito"],"correcta":2,"explicacion":"Formulado en el Parménides: si los hombres y la Idea de Hombre se parecen, hace falta una tercera Idea que funde esa semejanza, y así al infinito. Las otras son aporías distintas de la misma teoría."},{"id":"tc1-t007","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c07","enunciado":"Méthexis y mímesis designan, en Platón...","opciones":["La participación y la imitación de las cosas respecto de las Ideas","El recuerdo y el olvido de las Ideas contempladas por el alma","La opinión y la ciencia como grados del conocimiento humano"],"correcta":0,"explicacion":"Son los dos modos de relación entre cosas e Ideas: las cosas participan de la Idea (méthexis) o la copian como modelo (mímesis). Opinión y ciencia son doxa y episteme."},{"id":"tc1-t008","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c08","enunciado":"La paradoja de Menón afirma que...","opciones":["El esclavo no puede aprender geometría sin un maestro que le enseñe","No se puede buscar ni lo que se sabe ni lo que se ignora","Solo se puede conocer lo que antes ha pasado por los sentidos"],"correcta":1,"explicacion":"Lo sabido no necesita buscarse y lo totalmente ignorado no se reconocería al hallarlo. Platón la resuelve con la reminiscencia: buscar es posible porque en cierto modo ya sabemos, aunque olvidado."},{"id":"tc1-t009","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c09","enunciado":"En la República, la Idea del Bien...","opciones":["Es el primer motor inmóvil que mueve el cosmos como causa final","Es un concepto regulativo de la razón sin realidad fuera de la mente","Da ser y cognoscibilidad a las demás Ideas, como el sol a lo visible"],"correcta":2,"explicacion":"Según el símil del Sol, el Bien es la cúspide del mundo inteligible: fundamento ontológico y epistemológico de las demás Ideas. El primer motor es de Aristóteles; el uso regulativo, de Kant."},{"id":"tc1-t010","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"card:tc1-c10","enunciado":"La dialéctica platónica es...","opciones":["El ascenso racional de Idea en Idea hasta el principio anhipotético","El arte de inferir entre proposiciones según esquemas indemostrables","La demostración silogística a partir de premisas primeras y necesarias"],"correcta":0,"explicacion":"Es el método supremo de conocimiento: asciende de Idea en Idea hasta el Bien sin apoyarse en lo sensible. La lógica proposicional es estoica y la silogística demostrativa, aristotélica."},{"id":"tc1-t011","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c11","enunciado":"¿Cuántas categorías distingue Aristóteles y cuál es la primera?","opciones":["Cuatro, con el substrato como determinación básica","Diez, con la substancia como categoría primera","Doce, agrupadas en cantidad, cualidad, relación y modalidad"],"correcta":1,"explicacion":"Aristóteles distingue diez: substancia y nueve accidentes. Las cuatro con substrato son las categorías estoicas; las doce en cuatro grupos, las kantianas."},{"id":"tc1-t012","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c12","enunciado":"Para Aristóteles, la substancia primera es...","opciones":["La especie o el género que se predican del individuo","La esencia universal que existe en sí, separada de las cosas","El individuo concreto que existe en sí, como este hombre"],"correcta":2,"explicacion":"Substancia primera es el individuo concreto; especies y géneros (hombre, animal) son substancias segundas. La esencia separada es la Idea platónica, que Aristóteles rechaza."},{"id":"tc1-t013","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c13","enunciado":"'El ser se dice de muchas maneras' significa, en Aristóteles, que...","opciones":["Hay pluralidad de sentidos del ser, unificados por referencia a la substancia","El ser es unívoco e inmutable, tal como había sostenido Parménides","Cada lengua expresa el ser según convenciones puramente gramaticales"],"correcta":0,"explicacion":"Es la tesis antiunivocista: los sentidos del ser son las categorías, y todos remiten a la substancia (pros hen), lo que evita la pura dispersión. La univocidad es justo la posición eleática criticada."},{"id":"tc1-t014","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c14","enunciado":"En Aristóteles, la abstracción consiste en...","opciones":["Recordar las esencias que el alma conoció antes de encarnarse en el cuerpo","Extraer la forma universal de las imágenes sensibles, sin la materia individual","Aplicar conceptos puros a priori a lo dado en la intuición sensible"],"correcta":1,"explicacion":"El entendimiento separa la forma universal de los phantasmata, prescindiendo de las condiciones materiales individuales: origen empírico del concepto. El recuerdo es la reminiscencia platónica; los conceptos a priori, Kant."},{"id":"tc1-t015","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c15","enunciado":"¿Qué función cumple el entendimiento agente según Aristóteles?","opciones":["Recibe la forma inteligible y se hace de algún modo todas las cosas","Ilumina la mente humana con las verdades eternas infundidas por Dios","Ilumina el phantasma y actualiza lo inteligible que está en potencia"],"correcta":2,"explicacion":"Como la luz hace visibles los colores, el intelecto agente hace inteligible en acto lo que en la imagen es inteligible en potencia. Recibir la forma corresponde al entendimiento paciente; la iluminación divina es de Agustín."},{"id":"tc1-t016","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c16","enunciado":"El hilemorfismo aristotélico sostiene que...","opciones":["La substancia sensible es un compuesto de materia y forma inmanente","La forma existe separada de las cosas como su modelo eterno","Solo existen cuerpos individuales, sin forma ni esencia alguna"],"correcta":0,"explicacion":"Toda substancia sensible se compone de materia (sustrato indeterminado) y forma (esencia determinante), y la forma es inmanente, no separada. La forma como modelo separado es la Idea platónica."},{"id":"tc1-t017","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c17","enunciado":"Con los principios de acto y potencia, Aristóteles explica...","opciones":["La inmutabilidad del ser frente a las meras apariencias del devenir","El cambio como paso de la capacidad de ser a su realización efectiva","El conocimiento como recuerdo de lo contemplado antes por el alma"],"correcta":1,"explicacion":"El devenir es el paso de la potencia al acto: así algo llega a ser sin surgir de la nada. Es la respuesta al inmovilismo de Parménides, no su aceptación."},{"id":"tc1-t018","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c18","enunciado":"Las cuatro causas aristotélicas son...","opciones":["Substrato, cualidad, modo de ser y modo de ser relativo","Cantidad, cualidad, relación y modalidad","Material, formal, eficiente y final"],"correcta":2,"explicacion":"De qué está hecho (material), qué es (formal), qué agente lo produce (eficiente) y para qué (final): conocer científicamente es conocer por causas. Las otras listas son las categorías estoicas y los grupos categoriales kantianos."},{"id":"tc1-t019","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c19","enunciado":"Para Aristóteles, la ciencia demuestra mediante...","opciones":["Silogismos desde premisas verdaderas, primeras e inmediatas","Inferencias entre proposiciones según cinco esquemas indemostrables","Intuiciones encadenadas conforme a un método de tipo matemático"],"correcta":0,"explicacion":"El silogismo demostrativo de los Analíticos segundos concluye necesariamente propiedades desde esencias y causas. Los cinco indemostrables son estoicos; la cadena de intuiciones, cartesiana."},{"id":"tc1-t020","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c20","enunciado":"¿Cómo se conocen los primeros principios según Aristóteles?","opciones":["Por demostración silogística a partir de otros principios previos","Por inducción desde la experiencia e intuición intelectual (noûs)","Por reminiscencia de lo contemplado en el mundo inteligible"],"correcta":1,"explicacion":"Los principios no se demuestran (habría regreso infinito): se alcanzan por inducción y se captan por el noûs. Demostrarlos desde otros principios reabriría el regreso; la reminiscencia es platónica."},{"id":"tc1-t021","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"card:tc1-c21","enunciado":"El núcleo de la crítica de Aristóteles a Platón es que...","opciones":["Las Ideas cambian constantemente y por eso no fundan la ciencia","El conocimiento verdadero no puede comenzar en los sentidos","La esencia no puede existir separada de aquello de lo que es esencia"],"correcta":2,"explicacion":"El blanco es el chorismós: las Ideas separadas duplican el mundo sin explicarlo, y participación e imitación son metáforas vacías. Las Ideas platónicas son precisamente inmutables, y Aristóteles sí parte de los sentidos."},{"id":"tc1-t022","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"card:tc1-c22","enunciado":"La phantasía katalēptikē estoica es...","opciones":["La representación evidente que garantiza proceder del objeto real","La suspensión del juicio que conduce a la imperturbabilidad","El significado incorporal que media entre el signo y la cosa"],"correcta":0,"explicacion":"La representación comprensiva se impone con evidencia irresistible y es el criterio estoico de verdad. La suspensión del juicio es la epoché escéptica; el significado incorporal, el lektón."},{"id":"tc1-t023","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"card:tc1-c23","enunciado":"En el estoicismo, la synkatáthesis designa...","opciones":["La captación sensorial pasiva e involuntaria del objeto externo","El asentimiento voluntario de la razón a una representación","La suspensión escéptica del juicio ante toda representación"],"correcta":1,"explicacion":"Es el acto voluntario por el que la razón aprueba una representación; el error consiste en asentir a representaciones no comprensivas. Por ser voluntario, no es mera recepción pasiva."},{"id":"tc1-t024","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"card:tc1-c24","enunciado":"¿Qué es el lektón para los estoicos?","opciones":["Un cuerpo sutil que transmite la imagen del objeto a la mente","Un género supremo del ser que se predica de todas las cosas","Un significado incorporal que media entre el signo y la cosa"],"correcta":2,"explicacion":"El lektón o 'expresable' es una excepción incorporal en el corporeísmo estoico: lo que entendemos al comprender un enunciado. El lektón completo es la proposición (axíoma)."},{"id":"tc1-t025","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"card:tc1-c25","enunciado":"Las categorías estoicas se caracterizan por ser...","opciones":["Cuatro determinaciones anidadas del cuerpo individual","Diez géneros supremos del ser coordinados entre sí","Doce conceptos puros derivados de las formas del juicio"],"correcta":0,"explicacion":"Substrato, cualidad, modo de ser y modo de ser relativo: cada una incluye y determina la anterior, describiendo lo real individual. Diez géneros del ser son las aristotélicas; doce conceptos puros, las kantianas."},{"id":"tc1-t026","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"card:tc1-c26","enunciado":"Frente a la silogística aristotélica de términos, la lógica estoica es...","opciones":["Una lógica de clases fundada en géneros y especies","Una lógica de proposiciones con cinco esquemas indemostrables","Una lógica trascendental de las condiciones del conocimiento"],"correcta":1,"explicacion":"Los estoicos crean la lógica proposicional: inferencias entre enunciados completos (modus ponens, modus tollens, etc.). La lógica de términos y clases es la aristotélica."},{"id":"tc1-t027","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"card:tc1-c27","enunciado":"Las tres partes de la filosofía estoica son...","opciones":["Estética, analítica y dialéctica, como partes de la crítica","Metafísica, matemáticas y física, según su grado de abstracción","Lógica, física y ética, con primacía práctica de la ética"],"correcta":2,"explicacion":"La filosofía estoica comprende lógica, física y ética; la lógica es instrumental y el saber se subordina al ideal de vida del sabio. La división estética/analítica/dialéctica corresponde a la Crítica kantiana."},{"id":"tc1-t028","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"card:tc1-c28","enunciado":"La epoché escéptica consiste en...","opciones":["Suspender el juicio para alcanzar la imperturbabilidad (ataraxia)","Asentir únicamente a las representaciones comprensivas evidentes","Dudar de forma metódica para hallar una certeza indudable"],"correcta":0,"explicacion":"Al no haber representación que garantice la verdad, el escéptico no asiente a nada y así logra la ataraxia. Asentir a lo comprensivo es la vía estoica; la duda metódica, la cartesiana."},{"id":"tc1-t029","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"card:tc1-c29","enunciado":"En las filosofías helenísticas, el conocimiento...","opciones":["Es fin en sí mismo y culminación contemplativa del hombre","Se subordina a la ética como medio para la vida feliz","Se subordina a la fe como preparación para la teología"],"correcta":1,"explicacion":"En estoicismo, epicureísmo y escepticismo el conocer se instrumentaliza: sirve a la vida feliz e imperturbable del sabio. La contemplación como fin es el ideal aristotélico clásico."},{"id":"tc1-t030","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"card:tc1-c30","enunciado":"El lema 'credo ut intelligam' expresa que...","opciones":["La razón demuestra primero lo que la fe acepta después","Fe y razón son fuentes independientes y separadas del saber","La fe precede y orienta a la razón en el conocimiento"],"correcta":2,"explicacion":"Es el lema agustiniano-anselmiano: creo para entender; entender es profundizar lo creído. La separación de fe y razón corresponde a la etapa ockhamista, no a esta."},{"id":"tc1-t031","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad M
