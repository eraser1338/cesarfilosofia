1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Pratt critica los grandes relatos celebratorios de la globalización: mundo sin fronteras, flujos, aldea global, movilidad total.","x":"Son mitos interesados que ocultan que la globalización también levanta muros, produce inmovilidad y desigualdad: no todos circulan igual ni con los mismos derechos."},{"b":"La globalización debe entenderse desde los relatos y experiencias concretas de movilidad 'desde abajo', no desde la abstracción del capital."},{"b":"Caso central: la Virgen de Zapopan 'viaja' a Los Ángeles siguiendo a sus fieles migrantes mexicanos.","x":"La religiosidad popular muestra la agencia de los migrantes: reconstruyen comunidad transnacional y obligan a lo sagrado a moverse con ellos. Lo local no desaparece: se desterritorializa y reterritorializa."},{"b":"Frente al héroe neoliberal hipermóvil, Pratt opone otras figuras: el migrante indocumentado, cuya movilidad es criminalizada.","x":"La misma frontera que el capital cruza libremente se vuelve letal para las personas; la movilidad es un recurso distribuido desigualmente."},{"b":"Conclusión: los relatos sobre la globalización son parte de ella; la antropología debe analizarlos críticamente y recoger los relatos alternativos."}]},{"id":"an1-p14","tipo":"desarrollo","enunciado":"¿En qué consiste la 'burbuja personal' según Edward y Mildred Hall? Aplica el concepto al análisis de alguna situación concreta que hayas vivido personalmente.","variantes":[],"apariciones":["2022 Feb-2"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"En 'El sonido del silencio', los Hall estudian la comunicación no verbal: gestos, miradas, silencios y manejo del espacio (proxémica)."},{"b":"Burbuja personal: espacio invisible y portátil que rodea a cada individuo y regula la distancia aceptable con otros.","x":"Funciona como un territorio móvil: su invasión produce incomodidad, retirada o agresividad, casi siempre de forma inconsciente."},{"b":"Su tamaño varía culturalmente: amplia entre norteamericanos y noreuropeos; reducida entre árabes, latinos o mediterráneos.","x":"De ahí los malentendidos interculturales: el que se acerca parece invasivo; el que retrocede, frío y distante. Cada cual sigue su norma cultural sin saberlo."},{"b":"También varía según relación, género, situación y densidad: distancias íntima, personal, social y pública."},{"b":"Ejemplo aplicable: en el metro lleno toleramos contacto suspendiendo la burbuja (evitando la mirada); en un ascensor vacío alguien que se pega resulta amenazante."}]},{"id":"an1-p15","tipo":"desarrollo","enunciado":"Explica mediante algún caso —que no sea el de los juegos olímpicos— la noción de 'taxonomía' como estructura clasificatoria.","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Concepto de la etnociencia (Díaz de Rada y Cruces): las culturas ordenan la experiencia mediante estructuras clasificatorias."},{"b":"Taxonomía: clasificación jerárquica por inclusión de clases; relación 'X es un tipo de Y' en niveles de contraste.","x":"Cada término contrasta con los de su nivel y se incluye en el nivel superior: los dominios se organizan como un árbol, del término más general a los más específicos."},{"b":"Ejemplo: 'bebidas' se divide en alcohólicas y no alcohólicas; las alcohólicas en vino, cerveza y licores; el vino en tinto, blanco y rosado.","x":"Otros casos válidos: etnobotánica popular (árbol/arbusto/hierba), tipos de música, la carta de un bar o la clasificación casera de la ropa."},{"b":"Las taxonomías populares (folk) no coinciden con las científicas: responden al interés práctico y simbólico del grupo."},{"b":"Relevancia: clasificar es universal, pero cada taxonomía revela 'el orden del sentido' propio de una cultura."}]},{"id":"an1-p16","tipo":"desarrollo","enunciado":"Explica mediante algún ejemplo la noción de 'paradigma' como estructura clasificatoria. Elabora como apoyo un pequeño gráfico ilustrativo.","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Paradigma: estructura clasificatoria donde las categorías resultan del cruce simultáneo de dos o más dimensiones de contraste.","x":"A diferencia de la taxonomía (jerarquía de inclusión), el paradigma es una matriz: cada casilla combina un valor de cada dimensión."},{"b":"Ejemplo clásico: términos de parentesco definidos por sexo × generación (padre/madre, hijo/hija, abuelo/abuela).","x":"Dimensión 1: sexo (masculino/femenino); dimensión 2: generación (+1, 0, -1). 'Madre' = femenino y generación +1. El gráfico es una tabla de doble entrada con esas casillas."},{"b":"Otro ejemplo: pronombres (persona × número) o el semáforo social edad × género (niño/niña, hombre/mujer, anciano/anciana)."},{"b":"Gráfico: dibujar una tabla con las dimensiones en filas y columnas y los términos en las celdas."},{"b":"Relevancia etnocientífica: taxonomías y paradigmas muestran cómo cada cultura organiza cognitivamente sus dominios de experiencia."}]},{"id":"an1-p17","tipo":"desarrollo","enunciado":"¿A qué 'cuatro ciudades' se refería García Canclini en su texto obligatorio en el tema VI? Razona tu respuesta.","variantes":[],"apariciones":["2023 Sep"],"frecuencia":1,"tema":"Tema 6: Cultura urbana","bullets":[{"b":"Canclini analiza Ciudad de México como superposición de cuatro ciudades, cuatro capas históricas que coexisten hoy.","x":"No son etapas sucesivas ya superadas sino estratos simultáneos: la megalópolis se caracteriza por esa heterogeneidad multitemporal."},{"b":"1) La ciudad histórico-territorial: el centro histórico, lo patrimonial y ceremonial, herencia prehispánica y colonial."},{"b":"2) La ciudad industrial: la expansión del siglo XX, fábricas, migración campo-ciudad y barrios obreros."},{"b":"3) La ciudad comunicacional o informacional: organizada por medios, redes y servicios; la urbe vivida a través de radio, televisión y tecnologías.","x":"En la megaciudad ya no se conoce el territorio por experiencia directa: los medios 'cuentan' la ciudad y median su sentido, tema que conecta con Martín Barbero."},{"b":"4) La ciudad globalizada: conectada a los circuitos transnacionales de finanzas, migración y consumo, con nuevas desigualdades.","x":"Sedes corporativas, franquicias y élites globales conviven con la informalidad: la globalización fragmenta y re-jerarquiza el espacio urbano."},{"b":"Razonamiento: las cuatro ciudades muestran la hibridación y la imposibilidad de una visión totalizadora; los imaginarios urbanos recomponen esa experiencia fragmentada."}]},{"id":"an1-p18","tipo":"desarrollo","enunciado":"Contrasta, siguiendo a Kottak, las posiciones de Chomsky y Sapir-Whorf en cuanto a las relaciones entre lenguaje, pensamiento y cultura.","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Chomsky: universalismo; todas las lenguas comparten una gramática universal, capacidad innata del cerebro humano.","x":"Los niños aprenden cualquier lengua con la misma facilidad porque poseen un dispositivo innato de adquisición; las diferencias entre lenguas son superficiales frente a la estructura común."},{"b":"Sapir-Whorf: particularismo; cada lengua canaliza el pensamiento; hablantes de lenguas distintas piensan de forma distinta.","x":"Ejemplos clásicos: el tratamiento del tiempo en hopi o los géneros gramaticales. La lengua no sería solo vehículo sino molde de la experiencia."},{"b":"Son posiciones opuestas: unidad psíquica y biología común (Chomsky) frente a relativismo lingüístico (Sapir-Whorf)."},{"b":"Evaluación actual (Kottak): la versión fuerte del determinismo whorfiano está descartada; se admite una influencia débil.","x":"Podemos pensar lo que nuestra lengua no codifica y las lenguas cambian; la relación es de influencia mutua, no de determinación."},{"b":"Inversión de la flecha: a menudo es la cultura la que moldea la lengua, como muestra el vocabulario focal (léxico elaborado en áreas de interés)."}]},{"id":"an1-p19","tipo":"desarrollo","enunciado":"Explica, siguiendo a Kottak, algunos de los hallazgos de los sociolingüistas sobre el vocabulario focal. Pon un ejemplo.","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Vocabulario focal: conjunto léxico especializado y elaborado en torno a dominios de experiencia cruciales para un grupo.","x":"El léxico es el nivel de la lengua que más directamente refleja la cultura: donde hay interés y práctica intensa, proliferan las distinciones terminológicas."},{"b":"Ejemplos clásicos: términos para nieve entre los inuit (matizado hoy), el ganado entre los nuer, tipos de arroz o de camellos."},{"b":"Ejemplo cercano: esquiadores, baristas o gamers distinguen decenas de términos donde el profano ve una sola cosa.","x":"'Nieve polvo, costra, primavera' para el esquiador; 'ristretto, flat white' para el barista: subculturas con vocabularios focales propios."},{"b":"El vocabulario cambia con los intereses culturales: nuevas tecnologías generan léxico nuevo (tuitear, streaming)."},{"b":"Implicación teórica: apoya una lectura invertida y débil de Sapir-Whorf; aquí es la cultura la que moldea la lengua."}]},{"id":"an1-p20","tipo":"desarrollo","enunciado":"Explica, siguiendo a Turner, las características de los símbolos rituales. ¿Son dichos símbolos referenciales o de condensación? Pon un ejemplo del proceso que él denomina 'polarización de sentido' durante el transcurso del ritual.","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 5: Antropología simbólica","bullets":[{"b":"Turner estudia los símbolos del ritual ndembu (Zambia); el símbolo es la unidad mínima del ritual, 'molécula' de conducta ritual."},{"b":"Propiedades: condensación (muchos significados en un solo vehículo), unificación de referentes dispares y polarización de sentido."},{"b":"Son símbolos de condensación, no meramente referenciales: no solo denotan, sino que cargan emoción y mueven a la acción.","x":"Frente al signo referencial (que informa), el símbolo ritual condensa normas, deseos y afectos; por eso el ritual transforma a los participantes y no solo comunica."},{"b":"Polarización de sentido: cada símbolo dominante tiene un polo ideológico (normas, valores sociales) y un polo sensorial (fisiológico, emocional)."},{"b":"Ejemplo: el árbol mudyi ('árbol de la leche') en la iniciación femenina; su savia blanca evoca leche materna (polo sensorial) y matrilinaje y costumbre ndembu (polo ideológico).","x":"Durante el ritual ambos polos se intercambian cargas: lo obligatorio se vuelve deseable al impregnarse de emoción, y la emoción se ennoblece al unirse a la norma. Ahí reside la eficacia ritual."}]},{"id":"an1-p21","tipo":"desarrollo","enunciado":"TEMA: Explica los conceptos principales aprendidos en el tema III (La construcción social de las diferencias) y su relevancia para la comprensión de los procesos de identidad/alteridad. Usa el desarrollo del tema como pretexto para mostrar la productividad de tu lectura de los textos de Stuart Hall, Gerd Baumann y Lévi-Strauss.","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Idea eje: raza, etnicidad, nación o pueblo no son esencias sino construcciones socioculturales, procesos dinámicos de identidad/alteridad."},{"b":"Kottak: la raza carece de base biológica (variación clinal); las razas sociales se construyen culturalmente (hipodescendencia, Brasil, Japón); etnicidad situacional."},{"b":"Lévi-Strauss ('Raza e Historia'): crítica del evolucionismo y el etnocentrismo; la diversidad es motor del progreso humano; civilización = coalición de culturas.","x":"El bárbaro es quien cree en la barbarie: llamar 'salvaje' al diferente es el gesto etnocéntrico por excelencia. Ninguna cultura acumula progreso en solitario."},{"b":"Stuart Hall: la identidad se produce en la representación; los estereotipos fijan y naturalizan la diferencia ('el espectáculo del Otro').","x":"Los significados no están en las cosas sino en los sistemas de representación; el poder opera fijando significados: el cuerpo negro racializado en publicidad, deporte y medios."},{"b":"Baumann: tres gramáticas de identidad/alteridad (orientalización, segmentación, englobamiento) como estructuras discursivas del nosotros/ellos."},{"b":"Conclusión: la identidad es un hecho discursivo y relacional; se hace frente a un 'otro' y puede deshacerse y rehacerse.","x":"Cierre redondo: aplicar las tres lecturas a un caso actual (debates migratorios, nacionalismos, racismo cotidiano) mostrando su complementariedad."}]},{"id":"an1-p22","tipo":"desarrollo","enunciado":"TEMA: Caracteriza, siguiendo el conjunto de las lecturas realizadas, y en especial las de los temas I y II, cuál es la perspectiva disciplinar propia de la antropología, explicando las dimensiones del holismo, el relativismo y el comparativismo. Menciona autores, argumentos y casos que hayas aprendido a lo largo de la asignatura.","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 1: Definición y objeto de la antropología","bullets":[{"b":"La antropología estudia la diversidad humana en su totalidad: 'espejo para la humanidad' (Kluckhohn/Kottak); su perspectiva es holista, relativista y comparativa."},{"b":"Holismo: aborda al ser humano como totalidad biológica, social, lingüística y cultural; de ahí los cuatro campos de la disciplina.","x":"Ningún fenómeno se entiende aislado: economía, parentesco, religión y política se interconectan. Ejemplo: las vacas sagradas indias enlazan ecología, economía y religión."},{"b":"Relativismo: comprender cada cultura en sus propios términos, suspendiendo el juicio etnocéntrico; en su versión metodológica (Brown), no moral absoluta.","x":"Casos: Bohannan y el Hamlet reinterpretado por los tiv; el debate del relativismo frente a los derechos humanos."},{"b":"Comparativismo: la comparación transcultural permite distinguir lo universal, lo generalizado y lo particular, y poner a prueba explicaciones.","x":"Kottak distingue universales (exogamia-tabú del incesto), generalidades (familia nuclear) y particularidades. Peacock subraya la tensión entre generalizar y particularizar."},{"b":"El método que sostiene todo ello es la etnografía con observación participante, combinando emic y etic."},{"b":"Cierre: esa triple perspectiva convierte la antropología en crítica del etnocentrismo y en ciencia reflexiva sobre la propia cultura."}]},{"id":"an1-p23","tipo":"desarrollo","enunciado":"TEMA: Aplica los conceptos principales aprendidos en el tema 6 (Antropología urbana) a algún fenómeno cultural que te resulte familiar, especificando cuál es la aportación de la antropología a la comprensión de ese fenómeno en particular.","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 6: Cultura urbana","bullets":[{"b":"Conceptos base: etnografía en la ciudad (la ciudad como escenario) y de la ciudad (la ciudad como objeto); lo urbano como forma de vida."},{"b":"García Canclini: cuatro ciudades superpuestas (histórico-territorial, industrial, comunicacional, globalizada); imaginarios urbanos que recomponen la megaciudad fragmentada.","x":"En la megalópolis nadie experimenta el todo: los relatos, medios y trayectos de cada grupo construyen ciudades imaginadas distintas dentro de la misma urbe."},{"b":"Martín Barbero: 'la ciudad que median los miedos'; el miedo reorganiza la vida urbana y los medios median la experiencia de la ciudad.","x":"Inseguridad real y percibida empujan a privatizar el espacio (urbanizaciones cerradas, centros comerciales), vaciando la calle; la televisión sustituye a la plaza como lugar de encuentro."},{"b":"Procesos ligados: desurbanización del espacio público, ciudad informacional, hibridación cultural, nuevas formas de ser urbanos."},{"b":"Aplicación tipo: analizar un barrio gentrificado, un centro comercial o las fiestas de tu ciudad con esos conceptos.","x":"Ejemplo: la gentrificación enlaza la capa globalizada (turismo, plataformas) con imaginarios de miedo y distinción; la etnografía revela cómo lo viven vecinos y recién llegados."},{"b":"Aportación antropológica: mirada micro, etnográfica y comparativa que devuelve la voz y la agencia de los habitantes frente a visiones macro."}]},{"id":"an1-p24","tipo":"desarrollo","enunciado":"TEMA: Resume y comenta los principales argumentos de crítica al evolucionismo decimonónico presentes en las lecturas estudiadas. En particular, siguiendo a Lévi-Strauss: (1) las relaciones entre los conceptos de raza, historia y cultura, (2) la crítica a una noción eurocéntrica de 'progreso', (3) la naturaleza del diálogo y la colaboración entre culturas.","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"El evolucionismo decimonónico (Morgan, Tylor) ordenaba las culturas en una escala única: salvajismo, barbarie, civilización, con Occidente en la cima."},{"b":"Lévi-Strauss ('Raza e Historia'): la diversidad cultural no debe nada a la raza; confundir raza y cultura es el pecado original del racismo.","x":"Las diferencias entre culturas se deben a circunstancias históricas, geográficas y sociológicas, no a aptitudes biológicas desiguales. Kottak aporta la demolición biológica del concepto de raza."},{"b":"Crítica al 'falso evolucionismo': tratar las culturas contemporáneas como etapas de una misma serie niega su historia propia.","x":"Toda sociedad tiene tanta historia como las demás; distinguir 'pueblos sin historia' es una ilusión de perspectiva."},{"b":"El 'progreso' es eurocéntrico: medimos con nuestro criterio (energía, tecnología); con otros criterios (adaptación al medio, parentesco, cuerpo) otras culturas 'ganan'.","x":"Distinción entre historia acumulativa e historia estacionaria: no es una propiedad de las culturas, sino del punto de vista del observador; el etnocentrismo consiste en llamar bárbaro a quien clasifica distinto. 'El bárbaro es, ante todo, el hombre que cree en la barbarie'."},{"b":"El progreso real nace de la colaboración: toda civilización es una coalición de culturas que ponen en común sus diferencias.","x":"Ejemplo: el Neolítico o la modernidad europea como acumulaciones multiculturales (cero indio, pólvora china, agricultura americana). La diversidad es el recurso; su homogeneización, el riesgo."},{"b":"Ecos en otras lecturas: Bohannan (no hay interpretaciones universales evidentes), Brown (relativismo antietnocéntrico), Hall y Baumann (el 'primitivo' como construcción del otro)."}]}],"cards":[{"id":"an1-c01","tema":"Tema 1","front":"Antropología (definición)","back":"Estudio holístico y comparativo de la diversidad humana en tiempo y espacio; abarca biología, sociedad, lengua y cultura. Kottak: 'espejo para la humanidad'."},{"id":"an1-c02","tema":"Tema 1","front":"Cuatro campos de la antropología","back":"Arqueología, antropología biológica (física), antropología lingüística y antropología cultural. Expresión del holismo de la disciplina (tradición norteamericana, Boas)."},{"id":"an1-c03","tema":"Tema 1","front":"Cultura (Tylor, 1871)","back":"'Todo complejo que incluye conocimientos, creencias, arte, moral, derecho, costumbre y cualquier otra capacidad adquirida por el hombre como miembro de la sociedad'."},{"id":"an1-c04","tema":"Tema 1","front":"Características de la cultura (Kottak)","back":"Aprendida, simbólica, compartida, pautada/integrada, lo abarca todo, se apropia de la naturaleza, adaptativa (a veces maladaptativa), usada creativamente."},{"id":"an1-c05","tema":"Tema 1","front":"Enculturación","back":"Proceso por el que el individuo aprende e interioriza su cultura, consciente e inconscientemente, mediante la interacción social."},{"id":"an1-c06","tema":"Tema 1","front":"Etnocentrismo","back":"Juzgar otras culturas con los valores y categorías de la propia, considerada superior o 'natural'. La antropología nace como su crítica."},{"id":"an1-c07","tema":"Tema 1","front":"Relativismo cultural","back":"Principio de comprender cada cultura en sus propios términos, sin juzgarla desde patrones ajenos. En versión metodológica es herramienta; en versión moral extrema, problemática."},{"id":"an1-c08","tema":"Tema 1","front":"Relativismo metodológico (Brown)","back":"Suspensión temporal del juicio propio para comprender una práctica en su contexto. Brown lo defiende: comprender no es justificar."},{"id":"an1-c09","tema":"Tema 1","front":"Relativismo cognitivo (Brown)","back":"Tesis de que cada cultura tiene una racionalidad inconmensurable. Brown lo rechaza: haría imposibles la traducción y la comparación etnográficas."},{"id":"an1-c10","tema":"Tema 1","front":"Relativismo moral (Brown)","back":"Los juicios éticos solo valdrían dentro de cada cultura. En versión fuerte choca con los derechos humanos; Brown pide dosis moderadas."},{"id":"an1-c11","tema":"Tema 1","front":"Universal, generalidad, particularidad (Kottak)","back":"Universal: en todas las culturas (tabú del incesto). Generalidad: en muchas (familia nuclear). Particularidad: rasgo exclusivo de una cultura."},{"id":"an1-c12","tema":"Tema 1","front":"Ética antropológica (código AAA)","back":"Consentimiento informado, no dañar a los estudiados, anonimato, reciprocidad. Responsabilidad primera hacia las personas y comunidades investigadas."},{"id":"an1-c13","tema":"Tema 1","front":"'Shakespeare en la selva' (Bohannan): lección","back":"Los tiv reinterpretan Hamlet desde sus categorías (levirato, brujería): no hay interpretaciones universales autoevidentes; la traducción cultural exige conocer las categorías nativas."},{"id":"an1-c14","tema":"Tema 1","front":"Holismo","back":"Perspectiva que estudia los fenómenos humanos como totalidades interconectadas (biología, economía, parentesco, religión), no como piezas aisladas."},{"id":"an1-c15","tema":"Tema 2","front":"Etnografía","back":"Estrategia de investigación de campo, prolongada y de primera mano, propia de la antropología; también el texto que resulta de ella."},{"id":"an1-c16","tema":"Tema 2","front":"Observación participante","back":"Técnica central etnográfica: convivir y participar en la vida del grupo mientras se observa y registra, equilibrando implicación y distancia."},{"id":"an1-c17","tema":"Tema 2","front":"Emic / etic","back":"Emic: perspectiva y categorías del nativo. Etic: categorías analíticas del investigador. La etnografía combina ambas."},{"id":"an1-c18","tema":"Tema 2","front":"Informante clave (consultor cultural)","back":"Miembro del grupo especialmente conocedor de su cultura que guía y enseña al etnógrafo de forma continuada."},{"id":"an1-c19","tema":"Tema 2","front":"Método genealógico","back":"Registro sistemático de parentesco, filiación y matrimonio; esencial donde el parentesco organiza la vida social (sociedades no industriales)."},{"id":"an1-c20","tema":"Tema 2","front":"Choque cultural","back":"Desorientación y malestar del investigador (o migrante) al sumergirse en una cultura ajena; fase habitual del trabajo de campo."},{"id":"an1-c21","tema":"Tema 2","front":"Peacock: dilemas del método","back":"Implicación/distanciamiento, subjetividad/objetividad, particularización/generalización, inducción/deducción. No hay recetario fijo: el rigor es gestionarlos reflexivamente ('la luz y el arpón')."},{"id":"an1-c22","tema":"Tema 2","front":"Keesing: dos familias de teorías de la cultura","back":"Adaptacionistas: cultura como sistema de adaptación ecológico-material. Ideacionales: cultura como sistema de ideas (cognitivo, estructural o simbólico)."},{"id":"an1-c23","tema":"Tema 2","front":"Cultura como sistema simbólico (Geertz, en Keesing)","back":"Significados públicos y compartidos que se interpretan ('descripción densa'), no estructuras mentales privadas ni conductas sin sentido."},{"id":"an1-c24","tema":"Tema 2","front":"Encuesta vs etnografía","back":"Encuesta: muestra amplia, datos cuantificables, impersonal. Etnografía: comunidad concreta, primera mano, holística y cualitativa. Kottak las presenta complementarias."},{"id":"an1-c25","tema":"Tema 3","front":"Etnicidad","back":"Identificación con un grupo por origen, lengua, religión o historia compartidos y diferenciación frente a otros. Situacional, flexible y relacional."},{"id":"an1-c26","tema":"Tema 3","front":"¿Por qué la raza no es biológica?","back":"La variación humana es clinal y hay más diversidad genética dentro de cada grupo que entre grupos; los fenotipos no covarían en 'razas' discretas."},{"id":"an1-c27","tema":"Tema 3","front":"Raza social","back":"Categoría racial construida culturalmente y asumida como natural; etnicidad con supuesta base biológica. Varía según sociedad: EE.UU., Brasil, Japón."},{"id":"an1-c28","tema":"Tema 3","front":"Hipodescendencia","back":"Regla estadounidense que adscribe automáticamente al hijo de unión mixta al grupo minoritario ('una gota de sangre'). Muestra la arbitrariedad de la clasificación racial."},{"id":"an1-c29","tema":"Tema 3","front":"Raza social en Brasil y Japón","back":"Brasil: continuo de decenas de términos fenotípicos, variables incluso entre hermanos. Japón: burakumin, fenotípicamente iguales pero segregados como 'raza' invisible."},{"id":"an1-c30","tema":"Tema 3","front":"Nación y nacionalidad (Anderson, en Kottak)","back":"La nación es una 'comunidad imaginada': sus miembros no se conocen pero se sienten camaradas mediante símbolos, medios y escolarización."},{"id":"an1-c31","tema":"Tema 3","front":"Asimilación vs multiculturalismo","back":"Asimilación: la minoría se disuelve en la cultura dominante. Multiculturalismo: valoración de la diversidad y mantenimiento de las diferencias. Sociedad plural: grupos que coexisten interdependientes."},{"id":"an1-c32","tema":"Tema 3","front":"Lévi-Strauss: falso evolucionismo","back":"Tratar culturas contemporáneas como etapas de una escala única. Niega la historia propia de cada cultura y encubre etnocentrismo."},{"id":"an1-c33","tema":"Tema 3","front":"'El bárbaro es quien cree en la barbarie'","back":"Lévi-Strauss: el gesto etnocéntrico por excelencia es expulsar de la humanidad al culturalmente diferente; el rechazo de la diversidad es lo verdaderamente bárbaro."},{"id":"an1-c34","tema":"Tema 3","front":"Coalición de culturas (Lévi-Strauss)","back":"El progreso surge de la colaboración e intercambio entre culturas diversas, nunca de una cultura aislada; la diversidad es el recurso de la humanidad."},{"id":"an1-c35","tema":"Tema 3","front":"Historia acumulativa vs estacionaria","back":"Lévi-Strauss: no son tipos de cultura sino efectos del punto de vista del observador; llamamos 'estacionaria' a la historia que no medimos con nuestro criterio."},{"id":"an1-c36","tema":"Tema 3","front":"Stuart Hall: representación","back":"El significado no está en las cosas: se produce en sistemas de representación (lenguaje, imágenes) compartidos. La identidad se construye discursivamente."},{"id":"an1-c37","tema":"Tema 3","front":"'El espectáculo del Otro' (Hall)","back":"Análisis de la estereotipación racial: el estereotipo reduce, esencializa y naturaliza la diferencia, fija fronteras y funciona ligado al poder."},{"id":"an1-c38","tema":"Tema 3","front":"Baumann: gramática orientalista","back":"Negación especular (Said): 'lo que ellos son, nosotros no somos', con ambivalencia de desprecio y deseo (exotismo)."},{"id":"an1-c39","tema":"Tema 3","front":"Baumann: gramática segmentaria","back":"De Evans-Pritchard (nuer): enemigo en un nivel, aliado en el superior; identidad y alteridad dependen del contexto de segmentación."},{"id":"an1-c40","tema":"Tema 3","front":"Baumann: gramática de englobamiento","back":"De Dumont: reconocer al otro subsumiéndolo como caso subordinado de lo propio ('en el fondo sois como nosotros'); jerarquía que engloba a su contrario."},{"id":"an1-c41","tema":"Tema 3","front":"Orientalismo (Said)","back":"Discurso occidental que construye 'Oriente' como espejo invertido (irracional, sensual, estancado) para definirse a sí mismo; saber ligado al poder colonial."},{"id":"an1-c42","tema":"Tema 4","front":"Productividad y desplazamiento (lenguaje)","back":"Productividad: crear mensajes nuevos infinitos con reglas finitas. Desplazamiento: hablar de lo ausente, pasado o hipotético. Distinguen el lenguaje humano de los sistemas de llamadas."},{"id":"an1-c43","tema":"Tema 4","front":"Hipótesis Sapir-Whorf","back":"La lengua canaliza el pensamiento: hablantes de lenguas distintas percibirían el mundo de modos distintos. Versión fuerte descartada; se admite influencia débil."},{"id":"an1-c44","tema":"Tema 4","front":"Chomsky: gramática universal","back":"Capacidad lingüística innata común a la especie; todas las lenguas comparten estructuras profundas. Posición universalista opuesta al relativismo whorfiano."},{"id":"an1-c45","tema":"Tema 4","front":"Vocabulario focal","back":"Léxico especializado en dominios centrales para un grupo (nieve, ganado nuer, jerga gamer). Muestra que la cultura moldea la lengua."},{"id":"an1-c46","tema":"Tema 4","front":"Labov: la /r/ neoyorquina","back":"Estudio en grandes almacenes: la pronunciación de /r/ posvocálica crece con el prestigio del establecimiento. El habla está socialmente estratificada."},{"id":"an1-c47","tema":"Tema 4","front":"Bourdieu: capital simbólico y lingüístico","back":"Prestigio acumulado que otorga poder; el habla legítima vale en mercados simbólicos (escuela, empleo). Imponer una lengua legítima es violencia simbólica."},{"id":"an1-c48","tema":"Tema 4","front":"Genderlects (Tannen) y Lakoff","back":"Estilos conversacionales de género: rapport (conexión) vs report (estatus). Lakoff: atenuadores y coletillas del 'habla femenina' reflejan desigualdad de poder."},{"id":"an1-c49","tema":"Tema 4","front":"Kinésica y proxémica","back":"Kinésica: estudio de gestos, posturas y expresiones. Proxémica (Hall): uso cultural del espacio y las distancias en la comunicación."},{"id":"an1-c50","tema":"Tema 4","front":"Burbuja personal (Hall y Hall)","back":"Espacio invisible portátil que regula la distancia aceptable con otros; su tamaño varía por cultura, relación y situación; su invasión incomoda."},{"id":"an1-c51","tema":"Tema 4","front":"Culturas de contexto alto / bajo (Hall)","back":"Contexto alto: mucho significado implícito en la situación y la relación (Japón, mundo árabe). Contexto bajo: mensaje explícito y verbal (EE.UU., norte de Europa)."},{"id":"an1-c52","tema":"Tema 4","front":"Etnociencia","back":"Estudio de los sistemas de clasificación nativos (etnobotánica, parentesco, colores): cómo cada cultura ordena cognitivamente su mundo. Lectura: Díaz de Rada y Cruces."},{"id":"an1-c53","tema":"Tema 4","front":"Taxonomía vs paradigma","back":"Taxonomía: jerarquía por inclusión de clases ('es un tipo de'). Paradigma: matriz por cruce de dimensiones de contraste (sexo × generación en parentesco)."},{"id":"an1-c54","tema":"Tema 4","front":"Pratt: la Virgen de Zapopan en Los Ángeles","back":"Crítica de los mitos de la globalización (flujo, mundo sin fronteras): la movilidad real es desigual; los migrantes reterritorializan lo local (la Virgen viaja con ellos)."},{"id":"an1-c55","tema":"Tema 5","front":"Religión (definición de Wallace)","back":"Creencias y ritos relacionados con seres, poderes y fuerzas sobrenaturales. Funciones: explicar, aliviar ansiedad, cohesionar y controlar socialmente."},{"id":"an1-c56","tema":"Tema 5","front":"Animismo, mana y tabú","back":"Animismo (Tylor): creencia en almas y espíritus, 'religión mínima'. Mana: fuerza sobrenatural impersonal. Tabú: prohibición sagrada de contacto."},{"id":"an1-c57","tema":"Tema 5","front":"Ritual","back":"Conducta formal, estereotipada, repetitiva, seria y socialmente pautada, en lugares y tiempos especiales; comunica y transforma (performativa), traduce creencias en acción."},{"id":"an1-c58","tema":"Tema 5","front":"Ritos de paso (Van Gennep)","back":"Rituales que marcan cambios de estatus en tres fases: separación, margen (liminalidad) y agregación o reincorporación."},{"id":"an1-c59","tema":"Tema 5","front":"Liminalidad y communitas (Turner)","back":"Liminalidad: fase intermedia, fuera de las clasificaciones sociales. Communitas: comunión intensa e igualitaria entre los liminares; lo contrario de la estructura."},{"id":"an1-c60","tema":"Tema 5","front":"Propiedades del símbolo ritual (Turner)","back":"Condensación de significados, unificación de referentes dispares y polarización de sentido. Símbolos de condensación, no meramente referenciales."},{"id":"an1-c61","tema":"Tema 5","front":"Polarización de sentido (Turner)","back":"Todo símbolo dominante une un polo ideológico (normas, valores) y un polo sensorial (emociones, fisiología); el ritual intercambia sus cargas: la norma se hace deseable."},{"id":"an1-c62","tema":"Tema 5","front":"Árbol mudyi (ndembu)","back":"Símbolo dominante de la iniciación femenina: su savia blanca condensa leche materna, vínculo madre-hija, matrilinaje y costumbre ndembu."},{"id":"an1-c63","tema":"Tema 5","front":"Finnegan: ¿para qué estudiar la música?","back":"La música como práctica social situada ('senderos' amateurs urbanos): revela cómo la gente organiza, ejecuta y da sentido colectivo al arte cotidiano."},{"id":"an1-c64","tema":"Tema 5","front":"Folklore y patrimonio cultural","back":"Metadiscursos modernos que seleccionan expresiones culturales y las consagran como herencia colectiva; implican políticas de autenticidad e identidad."},{"id":"an1-c65","tema":"Tema 6","front":"Etnografía en la ciudad / de la ciudad","back":"En la ciudad: la urbe como escenario de estudios concretos. De la ciudad: lo urbano mismo como objeto teórico. Distinción clave de la antropología urbana."},{"id":"an1-c66","tema":"Tema 6","front":"Las cuatro ciudades de México (Canclini)","back":"Capas superpuestas: histórico-territorial, industrial, comunicacional/informacional y globalizada. Coexisten: heterogeneidad multitemporal de la megaciudad."},{"id":"an1-c67","tema":"Tema 6","front":"Imaginarios urbanos (Canclini)","back":"Representaciones y relatos con que los habitantes recomponen la megaciudad que ya no pueden experimentar entera; median trayectos, miedos y pertenencias."},{"id":"an1-c68","tema":"Tema 6","front":"'La ciudad que median los miedos' (Martín Barbero)","back":"El miedo (a la violencia, al otro) reorganiza la vida urbana: privatización del espacio, repliegue doméstico; los medios median la experiencia de ciudad."},{"id":"an1-c69","tema":"Tema 6","front":"Ciudad informacional","back":"Urbe organizada por flujos de información, comunicación y servicios (Castells, eco en Canclini): la experiencia urbana pasa por redes y pantallas más que por el territorio."}],"mcqs":[{"id":"an1-t001","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c01","enunciado":"¿Cómo define Kottak la antropología?","opciones":["Estudio cuantitativo de la conducta social mediante encuestas representativas","Estudio exclusivo de las sociedades primitivas actuales y sus costumbres exóticas","Estudio holístico y comparativo de la diversidad humana en tiempo y espacio"],"correcta":2,"explicacion":"La antropología abarca biología, sociedad, lengua y cultura de toda la humanidad. Kottak la llama 'espejo para la humanidad'."},{"id":"an1-t002","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c02","enunciado":"¿Cuáles son los cuatro campos de la antropología en la tradición norteamericana?","opciones":["Etnografía, etnología, demografía y economía política","Arqueología, antropología biológica, lingüística y cultural","Sociología, psicología, historia y geografía humana"],"correcta":1,"explicacion":"Los cuatro campos (tradición de Boas) expresan el holismo de la disciplina: pasado y presente, biología y cultura, lengua y sociedad."},{"id":"an1-t003","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c03","enunciado":"La definición clásica de cultura como 'todo complejo' adquirido como miembro de la sociedad (1871) pertenece a...","opciones":["Conrad P. Kottak","Clifford Geertz","Edward B. Tylor"],"correcta":2,"explicacion":"Tylor formuló en 1871 la definición fundacional: conocimientos, creencias, arte, moral, derecho y costumbres adquiridos como miembro de la sociedad."},{"id":"an1-t004","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c04","enunciado":"Según Kottak, la cultura se caracteriza por ser...","opciones":["Aprendida, simbólica, compartida y pautada","Exclusiva de las élites y de las bellas artes","Heredada genéticamente, individual y estática"],"correcta":0,"explicacion":"Para Kottak la cultura se aprende por enculturación, descansa en símbolos, se comparte en grupos y forma sistemas integrados; además lo abarca todo."},{"id":"an1-t005","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c05","enunciado":"¿Qué es la enculturación?","opciones":["La imposición de la cultura dominante sobre los grupos minoritarios","El proceso por el que el individuo aprende e interioriza su propia cultura","El intercambio de rasgos entre dos culturas que están en contacto"],"correcta":1,"explicacion":"La enculturación es el aprendizaje, consciente e inconsciente, de la propia cultura mediante la interacción social. No confundir con difusión o aculturación (contacto entre culturas)."},{"id":"an1-t006","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c06","enunciado":"¿En qué consiste el etnocentrismo?","opciones":["Adoptar los valores de otra cultura abandonando los propios","Juzgar otras culturas con los valores y categorías de la propia","Comprender cada cultura en sus propios términos, sin juzgarla"],"correcta":1,"explicacion":"El etnocéntrico toma su cultura como superior o 'natural' y mide con ella a las demás. Lo contrario es el relativismo cultural, no la adopción de otra cultura."},{"id":"an1-t007","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c07","enunciado":"El relativismo cultural propone...","opciones":["Evaluar las demás culturas desde los valores de la cultura propia del observador","Aceptar que toda práctica cultural es moralmente correcta y no puede criticarse","Comprender cada cultura en sus propios términos, sin juzgarla desde patrones ajenos"],"correcta":2,"explicacion":"Es el principio antietnocéntrico básico. En versión metodológica es una herramienta de comprensión; solo su versión moral extrema implica que 'todo vale'."},{"id":"an1-t008","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c08","enunciado":"Para Brown, el relativismo metodológico consiste en...","opciones":["Suspender temporalmente el juicio propio para comprender cada práctica en su contexto","Justificar moralmente cualquier práctica una vez comprendida en su contexto","Asumir que cada cultura posee una racionalidad intraducible e incomparable"],"correcta":0,"explicacion":"Brown lo defiende plenamente: es una herramienta heurística del trabajo de campo. Comprender no es justificar; primero comprender, después valorar."},{"id":"an1-t009","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c09","enunciado":"¿Qué relativismo rechaza Brown por hacer imposibles la traducción y la comparación?","opciones":["El relativismo metodológico","El relativismo moral moderado","El relativismo cognitivo"],"correcta":2,"explicacion":"El relativismo cognitivo afirma racionalidades inconmensurables entre culturas; Brown lo rechaza porque la práctica etnográfica demuestra que la comprensión intercultural funciona."},{"id":"an1-t010","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c10","enunciado":"Según Brown, la versión fuerte del relativismo moral es problemática porque...","opciones":["Obliga al etnógrafo a renunciar a la observación participante","Impide condenar prácticas dañinas y choca con los derechos humanos","Hace imposible traducir y comparar las culturas entre sí"],"correcta":1,"explicacion":"Si los juicios éticos solo valieran dentro de cada cultura, no cabría condenar prácticas dañinas. Brown propone relativismo 'en dosis moderadas': comprender sin aprobar."},{"id":"an1-t011","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c11","enunciado":"Según Kottak, el tabú del incesto es un ejemplo de...","opciones":["Generalidad cultural","Universal cultural","Particularidad cultural"],"correcta":1,"explicacion":"Los universales existen en todas las culturas (tabú del incesto); las generalidades en muchas (familia nuclear); las particularidades son rasgos exclusivos de una cultura."},{"id":"an1-t012","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c12","enunciado":"Según el código ético de la AAA, la responsabilidad primera del antropólogo es hacia...","opciones":["La institución que financia la investigación","Las personas y comunidades estudiadas","El avance teórico de la propia disciplina"],"correcta":1,"explicacion":"El código de la AAA sitúa a las personas estudiadas por encima de la investigación o de quien la financia: consentimiento informado, no dañar, anonimato y reciprocidad."},{"id":"an1-t013","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c13","enunciado":"¿Qué muestra Bohannan al contar Hamlet a los tiv en 'Shakespeare en la selva'?","opciones":["Que los grandes relatos literarios se comprenden igual en todas las culturas humanas","Que no hay interpretaciones universales autoevidentes: cada cultura lee desde sus categorías","Que los tiv carecían de categorías propias para entender narraciones complejas"],"correcta":1,"explicacion":"Los ancianos tiv reinterpretan Hamlet desde el levirato y la brujería. La traducción cultural exige conocer las categorías nativas y vigilar el etnocentrismo."},{"id":"an1-t014","tema":"Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","fuente":"card:an1-c14","enunciado":"El holismo antropológico consiste en...","opciones":["Analizar cada institución social por separado y de forma aislada","Estudiar los fenómenos humanos como totalidades interconectadas","Comparar sistemáticamente rasgos entre muchas culturas distintas"],"correcta":1,"explicacion":"El holismo conecta biología, economía, parentesco y religión: ningún fenómeno se entiende aislado. La comparación transcultural es otra dimensión: el comparativismo."},{"id":"an1-t015","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c15","enunciado":"¿Qué es la etnografía?","opciones":["Investigación de campo prolongada y de primera mano en un grupo concreto","Encuesta a muestras amplias con datos cuantificables e impersonales","Comparación estadística de rasgos culturales entre muchas sociedades"],"correcta":0,"explicacion":"La etnografía es la marca metodológica de la antropología; designa también el texto resultante. La encuesta y la comparación transcultural son estrategias distintas."},{"id":"an1-t016","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c16","enunciado":"La observación participante consiste en...","opciones":["Aplicar a los informantes un cuestionario cerrado y estandarizado","Observar al grupo desde la distancia sin intervenir en sus actividades","Convivir y participar en la vida del grupo mientras se observa y registra"],"correcta":2,"explicacion":"Es la técnica central de la etnografía: permite acceder a lo que la gente hace, no solo a lo que dice, equilibrando implicación y distancia."},{"id":"an1-t017","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c17","enunciado":"La perspectiva emic corresponde a...","opciones":["Las categorías analíticas del investigador","Los datos cuantitativos de las encuestas","Las categorías y el punto de vista del nativo"],"correcta":2,"explicacion":"Emic es la perspectiva del nativo; etic, la del analista. El conocimiento antropológico se caracteriza por combinar ambas, no por elegir una."},{"id":"an1-t018","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c18","enunciado":"¿Qué es un informante clave o consultor cultural?","opciones":["Un investigador local contratado para aplicar encuestas a la población","Un miembro del grupo, buen conocedor de su cultura, que guía al etnógrafo","Cualquier persona entrevistada una sola vez durante el trabajo de campo"],"correcta":1,"explicacion":"El informante clave es un experto local que enseña al etnógrafo de forma continuada, no un encuestador ni un entrevistado ocasional."},{"id":"an1-t019","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c19","enunciado":"¿Para qué sirve el método genealógico?","opciones":["Registrar parentesco, filiación y matrimonio, claves en sociedades no industriales","Reconstruir la evolución biológica de las poblaciones humanas del pasado","Medir la estratificación social del habla en las ciudades modernas"],"correcta":0,"explicacion":"El parentesco es el esqueleto organizativo de las sociedades no industriales; por eso el etnógrafo lo registra sistemáticamente. Lo segundo es tarea de la antropología biológica."},{"id":"an1-t020","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c20","enunciado":"El 'choque cultural' designa...","opciones":["El conflicto violento entre dos grupos étnicos que compiten por recursos","El rechazo abierto de los nativos hacia la presencia del etnógrafo","La desorientación del investigador al sumergirse en una cultura ajena"],"correcta":2,"explicacion":"Es una fase habitual del trabajo de campo (también de la migración): malestar y extrañeza ante una cultura ajena, no un conflicto entre grupos."},{"id":"an1-t021","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c21","enunciado":"¿Qué sostiene Peacock sobre el método antropológico?","opciones":["Implica dilemas sin recetario fijo; el rigor está en gestionarlos reflexivamente","Debe sustituir la observación participante por experimentos controlados","Debe seguir un protocolo estandarizado que elimine toda subjetividad"],"correcta":0,"explicacion":"Peacock señala dilemas irresolubles (implicación/distancia, subjetividad/objetividad, particularizar/generalizar). Su metáfora de 'la luz y el arpón': iluminar el contexto y apresar significados."},{"id":"an1-t022","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c22","enunciado":"¿Qué dos familias de teorías de la cultura distingue Keesing?","opciones":["Evolucionistas y difusionistas","Funcionalistas y estructuralistas","Adaptacionistas e ideacionales"],"correcta":2,"explicacion":"Las adaptacionistas ven la cultura como sistema de adaptación ecológico-material; las ideacionales, como sistema de ideas (cognitivo, estructural o simbólico)."},{"id":"an1-t023","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c23","enunciado":"Para Geertz, la cultura es...","opciones":["Un conjunto de estructuras mentales privadas e innatas del individuo","Un sistema de significados públicos y compartidos que se interpretan","Un sistema de adaptación ecológica al medio material circundante"],"correcta":1,"explicacion":"Geertz representa la teoría simbólica: los significados son públicos y se interpretan mediante 'descripción densa', no estructuras privadas ni adaptación material."},{"id":"an1-t024","tema":"Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","fuente":"card:an1-c24","enunciado":"Frente a la encuesta, la etnografía se caracteriza por...","opciones":["Muestras amplias, datos cuantificables y trato impersonal con los sujetos","Trabajo de primera mano, holístico y cualitativo en una comunidad concreta","Experimentos de laboratorio con grupos de control y variables aisladas"],"correcta":1,"explicacion":"Kottak presenta ambas como complementarias: la encuesta aporta amplitud cuantitativa; la etnografía, profundidad cualitativa y de primera mano."},{"id":"an1-t025","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c25","enunciado":"Según Kottak, la etnicidad es...","opciones":["Una esencia biológica heredada que fija para siempre la identidad del grupo","Una categoría administrativa aplicable solo a las minorías de origen inmigrante","Una identificación situacional y flexible basada en origen, lengua o historia compartidos"],"correcta":2,"explicacion":"La etnicidad es procesual y relacional: se activa o difumina según el contexto, y afecta también a las mayorías, no solo a las minorías."},{"id":"an1-t026","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c26","enunciado":"¿Por qué carece la raza de validez biológica?","opciones":["Porque todos los seres humanos son genéticamente idénticos entre sí","Porque los rasgos fenotípicos covarían en paquetes raciales discretos","La variación es clinal y hay más diversidad dentro de cada grupo que entre grupos"],"correcta":2,"explicacion":"No existen subespecies humanas: los fenotipos varían gradualmente (clinas) y no covarían en 'paquetes'. Hay variación genética, pero mayor dentro de cada grupo que entre grupos."},{"id":"an1-t027","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c27","enunciado":"¿Qué es una 'raza social'?","opciones":["Una subespecie humana identificada por la genética de poblaciones","Un sinónimo de etnicidad reconocido oficialmente por la biología","Una categoría racial construida culturalmente pero asumida como natural"],"correcta":2,"explicacion":"Es una etnicidad a la que se atribuye erróneamente base biológica. Su arbitrariedad se prueba en que EE.UU., Brasil y Japón clasifican de formas distintas."},{"id":"an1-t028","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c28","enunciado":"¿Qué es la hipodescendencia?","opciones":["Clasificar a las personas mediante decenas de términos de un continuo fenotípico","Adscribir automáticamente al hijo de una unión mixta al grupo minoritario","Segregar a un grupo fenotípicamente indistinguible del resto de la población"],"correcta":1,"explicacion":"Es la regla estadounidense de la 'una gota de sangre'. El continuo fenotípico corresponde a Brasil y la segregación sin diferencias visibles, a los burakumin de Japón."},{"id":"an1-t029","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c29","enunciado":"Los burakumin de Japón ilustran que...","opciones":["En Japón rige la regla de adscripción de la 'una gota de sangre'","La clasificación racial japonesa usa decenas de términos fenotípicos","Una 'raza' social puede segregarse sin diferencias fenotípicas visibles"],"correcta":2,"explicacion":"Los burakumin son fenotípicamente indistinguibles del resto de japoneses pero sufren segregación: la raza social es construcción cultural, no biología. Los otros rasgos describen Brasil y EE.UU."},{"id":"an1-t030","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c30","enunciado":"¿Quién definió la nación como 'comunidad imaginada'?","opciones":["Stuart Hall","Gerd Baumann","Benedict Anderson"],"correcta":2,"explicacion":"Anderson: los miembros de una nación no se conocen entre sí, pero se sienten camaradas gracias a símbolos, medios de comunicación y escolarización."},{"id":"an1-t031","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c31","enunciado":"El multiculturalismo, frente a la asimilación, defiende...","opciones":["Disolver a las minorías dentro de la cultura dominante","Valorar la diversidad y mantener las diferencias culturales","Separar por completo a los grupos sin interdependencia alguna"],"correcta":1,"explicacion":"La asimilación disuelve a la minoría en la cultura dominante; el multiculturalismo valora las diferencias. La sociedad plural implica grupos que coexisten interdependientes."},{"id":"an1-t032","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c32","enunciado":"Para Lévi-Strauss, el 'falso evolucionismo' consiste en...","opciones":["Tratar las culturas contemporáneas como etapas de una escala única","Negar que las especies biológicas evolucionen por selección natural","Comparar culturas para distinguir universales y particularidades"],"correcta":0,"explicacion":"Ordenar las culturas actuales como fases de una misma serie niega su historia propia y encubre etnocentrismo; la comparación antropológica legítima es otra cosa."},{"id":"an1-t033","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c33","enunciado":"'El bárbaro es, ante todo, el hombre que cree en la barbarie'. ¿De quién es la frase?","opciones":["De Conrad P. Kottak","De Clifford Geertz","De Claude Lévi-Strauss"],"correcta":2,"explicacion":"Lévi-Strauss ('Raza e Historia'): el gesto etnocéntrico por excelencia es expulsar de la humanidad al culturalmente diferente; rechazar la diversidad es lo verdaderamente bárbaro."},{"id":"an1-t034","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c34","enunciado":"Según Lévi-Strauss, el progreso humano surge de...","opciones":["La expansión de la civilización occidental sobre las demás","La colaboración y el intercambio entre culturas diversas","El desarrollo interno y autónomo de cada cultura aislada"],"correcta":1,"explicacion":"Toda civilización es una 'coalición de culturas' que ponen en común sus diferencias; ninguna cultura progresa en solitario. La diversidad es el recurso de la humanidad."},{"id":"an1-t035","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c35","enunciado":"Para Lévi-Strauss, la 'historia estacionaria' de una cultura es...","opciones":["Una propiedad objetiva de las culturas técnicamente atrasadas","Una etapa previa a la historia acumulativa propia de Occidente","Un efecto del punto de vista del observador, no una propiedad real"],"correcta":2,"explicacion":"Llamamos 'estacionaria' a la historia que no medimos con nuestro criterio (energía, tecnología); con otros criterios, otras culturas 'ganan'. Toda sociedad tiene tanta historia como las demás."},{"id":"an1-t036","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c36","enunciado":"Según Stuart Hall, el significado...","opciones":["Es privado: cada individuo lo crea al margen de su cultura","Reside en las cosas mismas y el lenguaje se limita a reflejarlo","Se produce en sistemas compartidos de representación, no está en las cosas"],"correcta":2,"explicacion":"Para Hall el significado se construye discursivamente en sistemas de representación (lenguaje, imágenes); por eso la identidad es un hecho discursivo y relacional."},{"id":"an1-t037","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c37","enunciado":"Según Stuart Hall en 'El espectáculo del Otro', el estereotipo racial...","opciones":["Reduce, esencializa y naturaliza la diferencia, y funciona ligado al poder","Describe con exactitud los rasgos objetivos de los distintos grupos humanos","Desaparece de forma espontánea en cuanto hay contacto entre las culturas"],"correcta":0,"explicacion":"El estereotipo fija fronteras simbólicas reduciendo al otro a unos pocos rasgos 'naturales'. Hall lo analiza como práctica de representación vinculada al poder."},{"id":"an1-t038","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c38","enunciado":"La gramática orientalista de Baumann, inspirada en Said, opera mediante...","opciones":["Subsunción del otro como caso subordinado de lo propio","Negación especular con ambivalencia de desprecio y deseo","Alianzas y rivalidades según el nivel de segmentación"],"correcta":1,"explicacion":"'Lo que ellos son, nosotros no somos': espejo invertido que a la vez fascina (exotismo). Las otras opciones describen las gramáticas segmentaria y de englobamiento."},{"id":"an1-t039","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c39","enunciado":"En la gramática segmentaria, tomada de Evans-Pritchard...","opciones":["El otro es un espejo invertido que repele y fascina","El enemigo en un nivel es aliado en el nivel superior","El otro queda englobado como versión menor de nosotros"],"correcta":1,"explicacion":"Como entre los nuer: aldeas rivales se unen frente a la tribu vecina, y todas frente al extranjero. La identidad depende del contexto de segmentación (fusión y fisión)."},{"id":"an1-t040","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c40","enunciado":"La gramática de englobamiento, tomada de Dumont, consiste en...","opciones":["Proyectar sobre el otro lo que negamos y deseamos de nosotros mismos","Reconocer al otro subsumiéndolo como caso subordinado de lo propio","Unirse con el rival de un nivel inferior frente a un enemigo mayor"],"correcta":1,"explicacion":"'En el fondo sois como nosotros': la jerarquía engloba a su contrario y niega autonomía a la diferencia. Las otras opciones son las gramáticas segmentaria y orientalista."},{"id":"an1-t041","tema":"Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","fuente":"card:an1-c41","enunciado":"Para Said, el orientalismo es...","opciones":["El estudio objetivo y desinteresado de las civilizaciones asiáticas por parte de Europa","La admiración de las sociedades orientales por la ciencia y la técnica de Occidente","Un discurso occidental que construye 'Oriente' como espejo invertido, ligado al poder colonial"],"correcta":2,"explicacion":"Literatura, pintura y ciencia produjeron un Oriente irracional, sensual y estancado frente al que Occidente se define: un aparato de saber-poder colonial."},{"id":"an1-t042","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c42","enunciado":"El 'desplazamiento' del lenguaje humano es la capacidad de...","opciones":["Hablar de cosas ausentes, pasadas o hipotéticas","Variar la pronunciación según la clase social del hablante","Crear infinitos mensajes nuevos con reglas finitas"],"correcta":0,"explicacion":"El desplazamiento permite referirse a lo no presente; la creación de mensajes nuevos es la productividad. Ambas distinguen el lenguaje humano de los sistemas de llamadas."},{"id":"an1-t043","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c43","enunciado":"La hipótesis Sapir-Whorf sostiene que...","opciones":["La lengua que hablamos canaliza nuestra forma de pensar","La cultura moldea la lengua a través del vocabulario focal","Todas las lenguas comparten una gramática universal innata"],"correcta":0,"explicacion":"Es la tesis del relativismo lingüístico: hablantes de lenguas distintas percibirían el mundo de modos distintos. La gramática universal es de Chomsky; el vocabulario focal invierte la flecha."},{"id":"an1-t044","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c44","enunciado":"¿Qué defiende Chomsky sobre el lenguaje?","opciones":["Una capacidad innata con estructuras profundas comunes a todas las lenguas","Que cada lengua impone a sus hablantes una visión intraducible del mundo","Que el habla de prestigio funciona como capital en mercados simbólicos"],"correcta":0,"explicacion":"Chomsky es universalista: los niños aprenden cualquier lengua gracias a un dispositivo innato. La visión intraducible es Sapir-Whorf; el capital simbólico, Bourdieu."},{"id":"an1-t045","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c45","enunciado":"El vocabulario focal (léxico elaborado en dominios de interés del grupo) muestra que...","opciones":["La gramática es idéntica en toda lengua","La lengua determina todo el pensamiento","La cultura también moldea la lengua"],"correcta":2,"explicacion":"Donde hay interés y práctica intensa proliferan las distinciones léxicas (nieve, ganado nuer, jerga gamer): aquí la flecha va de la cultura a la lengua, lectura invertida y débil de Sapir-Whorf."},{"id":"an1-t046","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c46","enunciado":"¿Quién estudió la pronunciación de la /r/ en los grandes almacenes de Nueva York?","opciones":["Pierre Bourdieu","Noam Chomsky","William Labov"],"correcta":2,"explicacion":"Labov comparó Saks, Macy's y S. Klein: la /r/ posvocálica, variante entonces prestigiosa, se pronunciaba más cuanto mayor era el prestigio del establecimiento. El habla está socialmente estratificada."},{"id":"an1-t047","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c47","enunciado":"El concepto de 'capital simbólico' pertenece a...","opciones":["Pierre Bourdieu","William Labov","Victor Turner"],"correcta":0,"explicacion":"Bourdieu: prestigio y reconocimiento acumulados que otorgan poder. El habla legítima vale como capital lingüístico en mercados simbólicos (escuela, empleo); imponerla es violencia simbólica."},{"id":"an1-t048","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c48","enunciado":"Según Tannen, los 'genderlects' orientan la conversación...","opciones":["Al rapport (conexión) en las mujeres y al report (estatus) en los hombres","Al report (información) en las mujeres y al rapport (empatía) en los hombres","A un estilo único y universal determinado por la biología de cada sexo"],"correcta":0,"explicacion":"Mujeres orientadas a la conexión y hombres al estatus e información: estilos comunicativos culturales, no rasgos naturales. De ahí malentendidos recurrentes entre géneros."},{"id":"an1-t049","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c49","enunciado":"La proxémica estudia...","opciones":["El uso cultural del espacio y las distancias en la comunicación","La variación del habla según la clase social de los hablantes","Los gestos, las posturas y las expresiones faciales del cuerpo"],"correcta":0,"explicacion":"La proxémica (Hall) analiza cómo cada cultura pauta el espacio y las distancias; los gestos y posturas son objeto de la kinésica, y el habla y la clase, de la sociolingüística."},{"id":"an1-t050","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c50","enunciado":"Según Edward y Mildred Hall, la 'burbuja personal'...","opciones":["Es un espacio invisible cuyo tamaño varía según cultura, relación y situación","Existe únicamente en las culturas urbanas de los países industrializados","Tiene un tamaño biológico fijo e idéntico en todos los seres humanos"],"correcta":0,"explicacion":"Es un territorio móvil e inconsciente: amplia entre norteamericanos y noreuropeos, reducida entre árabes o latinos. Su invasión produce incomodidad y explica malentendidos interculturales."},{"id":"an1-t051","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c51","enunciado":"En una cultura de 'contexto alto' (Hall)...","opciones":["El mensaje se expresa sobre todo de forma explícita y verbal","Gran parte del significado va implícito en la situación y la relación","La comunicación no verbal apenas tiene relevancia en la interacción"],"correcta":1,"explicacion":"En contextos altos (Japón, mundo árabe) el significado descansa en lo implícito; en contextos bajos (EE.UU., norte de Europa) domina el mensaje explícito y verbal."},{"id":"an1-t052","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c52","enunciado":"¿Qué estudia la etnociencia?","opciones":["La difusión de la ciencia moderna entre los pueblos indígenas","Los sistemas de clasificación con que cada cultura ordena su mundo","Las técnicas científicas occidentales aplicadas al trabajo de campo"],"correcta":1,"explicacion":"La etnociencia (lectura de Díaz de Rada y Cruces) analiza clasificaciones nativas —etnobotánica, parentesco, colores—: 'el orden del sentido y el sentido del orden' de cada cultura."},{"id":"an1-t053","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c53","enunciado":"¿Qué distingue al paradigma de la taxonomía como estructura clasificatoria?","opciones":["Clasifica solo dominios científicos y nunca dominios populares","Ordena las clases por inclusión jerárquica ('es un tipo de')","Cruza dos o más dimensiones de contraste en una matriz"],"correcta":2,"explicacion":"El paradigma es una tabla de doble entrada (sexo × generación en el parentesco); la taxonomía es un árbol jerárquico por inclusión de clases."},{"id":"an1-t054","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"card:an1-c54","enunciado":"¿Qué critica Pratt con el caso de la Virgen de Zapopan en Los Ángeles?","opciones":["Los mitos del flujo global sin fronteras: la movilidad real es desigual","La pérdida total de la religiosidad popular entre los migrantes mexicanos","La homogeneización completa de las culturas locales por el mercado global"],"correcta":0,"explicacion":"Pratt desmonta los grandes relatos celebratorios de la globalización: la Virgen viaja siguiendo a sus fieles migrantes, que reterritorializan lo local y reconstruyen comunidad transnacional."},{"id":"an1-t055","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c55","enunciado":"¿Cómo define Wallace la religión?","opciones":["El conjunto de normas morales que toda sociedad impone a sus miembros","Creencias y ritos relativos a seres, poderes y fuerzas sobrenaturales","Un sistema de significados públicos que se interpretan densamente"],"correcta":1,"explicacion":"La definición de Wallace subraya lo sobrenatural. Sus funciones: explicar, aliviar la ansiedad (Malinowski), cohesionar y controlar socialmente."},{"id":"an1-t056","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c56","enunciado":"Para Tylor, el animismo es...","opciones":["Una prohibición sagrada de contacto con determinadas cosas","Una fuerza sobrenatural impersonal que impregna ciertos objetos","La creencia en almas y espíritus, forma mínima de religión"],"correcta":2,"explicacion":"El animismo es la 'religión mínima' según Tylor. La fuerza impersonal es el mana y la prohibición sagrada, el tabú."},{"id":"an1-t057","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c57","enunciado":"¿Qué caracteriza al ritual?","opciones":["Conducta espontánea e improvisada, sin pauta social establecida","Conducta formal, repetitiva y seria que comunica y transforma","Creencia interior privada que no requiere expresión en la acción"],"correcta":1,"explicacion":"El ritual es estereotipado y socialmente pautado, se ejecuta en lugares y tiempos especiales, y es performativo: traduce creencias en acción y transforma a los participantes."},{"id":"an1-t058","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c58","enunciado":"Las tres fases de los ritos de paso, según Van Gennep, son...","opciones":["Separación, margen (liminalidad) y agregación","Nacimiento, matrimonio ceremonial y muerte ritual","Condensación, unificación y polarización de sentido"],"correcta":0,"explicacion":"Van Gennep describe separación, margen y reincorporación. La condensación, unificación y polarización son propiedades de los símbolos rituales según Turner."},{"id":"an1-t059","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c59","enunciado":"Según Turner, la communitas es...","opciones":["La fase final de reincorporación del iniciado al orden social","La estructura jerárquica de estatus propia de la vida social ordinaria","La comunión intensa e igualitaria entre quienes atraviesan la fase liminal"],"correcta":2,"explicacion":"La communitas surge entre los liminares, fuera de las clasificaciones sociales; es lo contrario de la estructura, no la fase de agregación."},{"id":"an1-t060","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c60","enunciado":"Según Turner, los símbolos rituales dominantes se caracterizan por...","opciones":["Condensación, unificación de referentes y polarización de sentido","Ser meramente referenciales: informan sin cargar emoción alguna","Separación, liminalidad y agregación en tres fases sucesivas"],"correcta":0,"explicacion":"Son símbolos de condensación, no meramente referenciales: cargan normas, deseos y afectos, y por eso el ritual transforma. Las tres fases corresponden a Van Gennep."},{"id":"an1-t061","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c61","enunciado":"La 'polarización de sentido' de Turner une en el símbolo dominante...","opciones":["Un polo ideológico (normas y valores) y un polo sensorial (emociones)","Un polo emic (categorías nativas) y un polo etic (categorías analíticas)","Un polo sagrado (mito y creencia) y un polo profano (técnica y trabajo)"],"correcta":0,"explicacion":"Durante el ritual ambos polos intercambian cargas: la norma se vuelve deseable al impregnarse de emoción, y la emoción se ennoblece al unirse a la norma."},{"id":"an1-t062","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c62","enunciado":"¿Qué condensa el árbol mudyi en la iniciación femenina ndembu?","opciones":["Leche materna, vínculo madre-hija y matrilinaje","Sangre de caza, virilidad y linaje paterno","Lluvia, fertilidad agrícola y culto a los antepasados"],"correcta":0,"explicacion":"La savia blanca del mudyi ('árbol de la leche') une el polo sensorial (leche materna) y el ideológico (matrilinaje y costumbre ndembu): ejemplo clásico de símbolo dominante en Turner."},{"id":"an1-t063","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c63","enunciado":"¿Cómo propone Finnegan estudiar la música?","opciones":["Como práctica social situada: 'senderos' amateurs y cotidianos","Como obra abstracta creada por los grandes genios individuales","Como reflejo directo de la estructura económica de cada clase"],"correcta":0,"explicacion":"Finnegan atiende a bandas, coros y ensayos: la música revela cómo la gente organiza, ejecuta y da sentido colectivo al arte cotidiano, frente a la visión de la obra abstracta."},{"id":"an1-t064","tema":"Tema 5: Antropología simbólica (religión, mito, ritual, arte)","fuente":"card:an1-c64","enunciado":"Según lo estudiado, el folklore y el patrimonio cultural son...","opciones":["Metadiscursos modernos que seleccionan y consagran expresiones como herencia","Categorías neutras sin implicaciones políticas ni efectos identitarios","Restos intactos y espontáneos del pasado premoderno de cada pueblo"],"correcta":0,"explicacion":"Folklore y patrimonio no son supervivencias puras: son selecciones modernas que sacralizan ciertas expresiones e implican políticas de autenticidad e identidad."},{"id":"an1-t065","tema":"Tema 6: Cultura urbana","fuente":"card:an1-c65","enunciado":"La etnografía 'de la ciudad', frente a la etnografía 'en la ciudad'...","opciones":["Sustituye el trabajo de campo por estadísticas municipales","Usa la urbe solo como escenario de estudios concretos","Toma lo urbano mismo como objeto teórico de estudio"],"correcta":2,"explicacion":"En la ciudad: la urbe como escenario. De la ciudad: lo urbano como objeto teórico. Es la distinción clave de la antropología urbana."},{"id":"an1-t066","tema":"Tema 6: Cultura urbana","fuente":"card:an1-c66","enunciado":"¿Cuáles son las 'cuatro ciudades' superpuestas de Ciudad de México según Canclini?","opciones":["Sagrada, comercial, obrera y turística o patrimonial","Colonial, moderna, posmoderna y virtual o digitalizada","Histórico-territorial, industrial, comunicacional y globalizada"],"correcta":2,"explicacion":"No son etapas superadas sino estratos simultáneos: la heterogeneidad multitemporal caracteriza a la megaciudad."},{"id":"an1-t067","tema":"Tema 6: Cultura urbana","fuente":"card:an1-c67","enunciado":"Para Canclini, los imaginarios urbanos son...","opciones":["Recuerdos puramente individuales sin dimensión colectiva ni cultural","Planes urbanísticos oficiales que ordenan el crecimiento de la urbe","Relatos con que los habitantes recomponen la megaciudad inabarcable"],"correcta":2,"explicacion":"En la megalópolis nadie experimenta el todo: representaciones y relatos median trayectos, miedos y pertenencias, construyendo ciudades imaginadas distintas dentro de la misma urbe."},{"id":"an1-t068","tema":"Tema 6: Cultura urbana","fuente":"card:an1-c68","enunciado":"Según Martín Barbero, el miedo urbano...","opciones":["Es independiente de los medios de comunicación y de sus relatos sobre la urbe","Reorganiza la vida en la ciudad: privatiza el espacio y repliega hacia lo doméstico","Ha desaparecido en las grandes ciudades gracias a la videovigilancia moderna"],"correcta":1,"explicacion":"'La ciudad que median los miedos': la inseguridad real y percibida vacía la calle (urbanizaciones cerradas, centros comerciales) y los medios median la experiencia de ciudad."},{"id":"an1-t069","tema":"Tema 6: Cultura urbana","fuente":"card:an1-c69","enunciado":"La 'ciudad informacional' se caracteriza porque...","opciones":["La experiencia urbana pasa por redes y pantallas más que por el territorio","El territorio se conoce sobre todo mediante la experiencia directa a pie","La industria fabril organiza los barrios y los ritmos de la vida diaria"],"correcta":0,"explicacion":"Concepto de Castells con eco en Canclini: flujos de información, comunicación y servicios organizan la urbe; los medios 'cuentan' la ciudad y median su sentido."},{"id":"an1-u001","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p01","enunciado":"Según M. Brown en 'Relativismo 2.0', ¿qué tres tipos de relativismo cabe distinguir?","opciones":["Cognitivo, moral y metodológico","Cultural, lingüístico y jurídico","Ontológico, estético y político"],"correcta":0,"explicacion":"Brown diferencia relativismo cognitivo (o epistemológico), moral (o ético) y metodológico, para rescatar un relativismo moderado frente a sus caricaturas. (Ladrillo de: 'Tipos de relativismo según M. Brown')"},{"id":"an1-u002","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p01","enunciado":"¿Qué sostiene el relativismo cognitivo y qué valoración le merece a Brown?","opciones":["Los juicios morales solo valen en cada cultura; Brown lo matiza","Cada cultura tiene una racionalidad inconmensurable; Brown lo rechaza","Hay que suspender el juicio propio; Brown lo defiende plenamente"],"correcta":1,"explicacion":"Si cada cultura tuviera una lógica radicalmente distinta, traducción y comparación serían imposibles; la práctica etnográfica demuestra que la comprensión intercultural funciona. (Ladrillo de: 'Tipos de relativismo según M. Brown')"},{"id":"an1-u003","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p01","enunciado":"Para Brown, ¿por qué es problemático el relativismo moral en su versión fuerte?","opciones":["Hace imposible traducir y comparar entre culturas diferentes","Obliga al etnógrafo a abandonar el trabajo de campo prolongado","Impide condenar prácticas dañinas y choca con los derechos humanos"],"correcta":2,"explicacion":"Comprender la ablación o la violencia en su contexto no equivale a justificarlas: el antropólogo puede comprender sin aprobar. (Ladrillo de: 'Tipos de relativismo según M. Brown')"},{"id":"an1-u004","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p01","enunciado":"¿En qué consiste el relativismo metodológico, que Brown defiende plenamente?","opciones":["Suspender temporalmente el juicio propio para entender cada práctica en contexto","Sostener que toda moral es válida solo dentro de su propia cultura","Afirmar que cada cultura posee una lógica intraducible e incomparable"],"correcta":0,"explicacion":"Es una herramienta heurística del trabajo de campo, no una postura moral: primero comprender, después valorar; núcleo sano del oficio antropológico. (Ladrillo de: 'Tipos de relativismo según M. Brown')"},{"id":"an1-u005","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p01","enunciado":"Analizar un sacrificio ritual suspendiendo el juicio, sin declarar su lógica intraducible, ilustra...","opciones":["Relativismo cognitivo sin relativismo moral","Relativismo metodológico sin relativismo cognitivo","Relativismo moral sin relativismo metodológico"],"correcta":1,"explicacion":"El etnógrafo describe qué significa el sacrificio para los participantes sin afirmar que la racionalidad local sea incomparable con la ciencia ni aprobarlo moralmente. (Ladrillo de: 'Tipos de relativismo según M. Brown')"},{"id":"an1-u006","tema":"Tema 1: Definición y objeto de la antropología","fuente":"pregunta:an1-p01","enunciado":"¿Cuál es la propuesta final de Brown sobre el relativismo?","opciones":["Abandonar todo relativismo en nombre de los derechos humanos","Un relativismo integral que abarque moral, lógica y método","Un relativismo 'en dosis moderadas', antídoto del etnocentrismo"],"correcta":2,"explicacion":"Brown propone un relativismo moderado, compatible con los derechos humanos y opuesto al etnocentrismo. (Ladrillo de: 'Tipos de relativismo según M. Brown')"},{"id":"an1-u007","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p02","enunciado":"Según Kottak, ¿qué rasgos distinguen al lenguaje humano del de otros primates?","opciones":["Productividad y desplazamiento","Entonación y proxémica","Arbitrariedad y bipedismo"],"correcta":0,"explicacion":"Crear mensajes nuevos (productividad) y hablar de lo ausente (desplazamiento); sobre su relación con el pensamiento debaten Sapir-Whorf y Chomsky. (Ladrillo de: 'Tema IV: lenguaje, comunicación y cognición')"},{"id":"an1-u008","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p02","enunciado":"Para la sociolingüística, el prestigio de una variante de habla se explica por...","opciones":["Su mayor corrección gramatical interna","La posición social de quienes la usan","Su antigüedad histórica documentada"],"correcta":1,"explicacion":"Ninguna variante es lingüísticamente superior: hablar 'bien' funciona como capital simbólico (Bourdieu) en mercados como escuela o empleo, como mostró Labov con la /r/ neoyorquina. (Ladrillo de: 'Tema IV: lenguaje, comunicación y cognición')"},{"id":"an1-u009","tema":"Tema 4: Lenguaje, comunicación y cognición","fuente":"pregunta:an1-p02","enunciado":"¿Qué estudian Edward y Mildred H
