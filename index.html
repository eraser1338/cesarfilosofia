y religión no pueden unificarse? ¿Cómo propone que se aborde la relación entre ambos discursos? Pregunta 2: Explica cómo se podría aplicar este principio para el caso del Creacionismo.","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"Ciencia y religión tienen objetos distintos: hechos y teorías sobre el mundo natural vs fines, significados y valores.","x":"Por eso no pueden unificarse bajo un plan común de explicación: responden a preguntas de tipo diferente, con métodos y criterios diferentes."},{"b":"Propuesta NOMA: magisterios que no se superponen; no interferencia respetuosa acompañada de diálogo entre ambos dominios.","x":"Cada magisterio es un dominio legítimo de autoridad docente. Ninguno debe dictar conclusiones en el terreno del otro: la ciencia no resuelve cuestiones de valor y la religión no fija hechos empíricos."},{"b":"No hay conflicto necesario: ambos cubren facetas fundamentales y complementarias de la existencia humana."},{"b":"El creacionismo viola el NOMA: usa la autoridad religiosa para afirmar tesis empíricas (origen de las especies, edad de la Tierra).","x":"Al invadir el magisterio de la ciencia, entra en conflicto con la evidencia (evolución, geología). Desde el NOMA, la religión puede hablar del sentido de la creación, pero no negar hechos científicos."},{"b":"Aplicación: la evolución pertenece a la ciencia; la religión conserva su ámbito de valores; el creacionismo 'científico' es ilegítimo.","x":"El NOMA permite ser religioso y aceptar la evolución; lo que excluye es presentar el relato religioso como teoría científica alternativa, como hace el creacionismo y el diseño inteligente."}]},{"id":"pc1-p100","tipo":"desarrollo","enunciado":"Texto de Rowbotham sobre el experimento (legendario) de Galileo en la torre de Pisa contra el axioma aristotélico de la caída de los cuerpos. Pregunta 1: Explica la actitud científica ante la tradición, a la luz del ejemplo de Galileo. Pregunta 2: ¿Por qué es importante que el experimento de Galileo fuese público y pudiese ser repetido por otros?","variantes":[],"apariciones":["2022 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","bullets":[{"b":"La ciencia no acepta creencias por su antigüedad o por la autoridad que las respalda: exige contrastación empírica.","x":"El axioma de Aristóteles se aceptó durante siglos sin ponerse a prueba. La actitud científica de Galileo consiste en tratar toda creencia heredada como hipótesis revisable frente a la evidencia."},{"b":"La tradición no es evidencia: los argumentos de autoridad tienen un valor epistémico muy limitado.","x":"Que 'siempre se haya creído' algo no es prueba de su verdad. La evidencia observacional y experimental prevalece sobre la tradición cuando entran en conflicto."},{"b":"Galileo diseña un experimento: manipula la situación (dos pesos distintos, misma caída) para someter la hipótesis a prueba.","x":"En lugar de discutir textos, produce una observación decisiva: si Aristóteles tuviera razón, la bola pesada llegaría antes; ambas llegan a la vez, refutando la hipótesis tradicional."},{"b":"El carácter público permite el control intersubjetivo: los testigos no dependen de la palabra de Galileo.","x":"La evidencia científica ha de ser accesible a cualquier observador competente; así se evita el fraude, el error individual y la ilusión."},{"b":"La repetibilidad permite detectar errores y sesgos, y convierte el resultado en evidencia utilizable por toda la comunidad.","x":"Un resultado irrepetible carece de valor probatorio: la replicación es la garantía de fiabilidad de la observación científica."}]},{"id":"pc1-p101","tipo":"desarrollo","enunciado":"Texto de Popper (Lógica de la investigación científica, p. 33) sobre la contrastación deductiva de teorías. Pregunta 1: ¿Cuál es la diferencia entre 'verificar' y 'falsar' un enunciado, según Popper? Pregunta 2: ¿Por qué dice Popper que 'una decisión positiva puede apoyar a la teoría examinada solo temporalmente'?","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"Verificar sería establecer concluyentemente la verdad de un enunciado; falsar es mostrar su falsedad mediante un contraejemplo.","x":"De la teoría se deducen predicciones contrastables; si fallan, la teoría queda falsada por modus tollens. Si aciertan, solo queda corroborada provisionalmente."},{"b":"Asimetría lógica: ningún número de casos favorables verifica una ley universal, pero un contraejemplo la refuta.","x":"'Todos los cisnes son blancos' no se prueba con miles de cisnes blancos, pero un cisne negro la falsa. Por eso Popper sustituye la verificación por la falsabilidad como criterio."},{"b":"El apoyo es temporal porque la teoría sigue expuesta a futuras contrastaciones que podrían falsarla.","x":"Superar un test solo significa 'no hemos encontrado razones para desecharla por esta vez'. La corroboración no aumenta la probabilidad de verdad definitiva de la teoría."},{"b":"El conocimiento científico es conjetural y falible: conjeturas y refutaciones, nunca certeza definitiva.","x":"La ciencia progresa eliminando errores: proponiendo hipótesis audaces y sometiéndolas a tests severos, no acumulando verificaciones."},{"b":"Trasfondo: el problema de la inducción de Hume hace imposible la verificación concluyente de leyes generales."}]},{"id":"pc1-p102","tipo":"desarrollo","enunciado":"Viñeta humorística: 'No des por seguro que voy a calentarte la cena solo porque lo hice ayer. Jamás debí comprar una cocina de inducción'. Pregunta a: ¿En qué consiste la inducción y en qué se diferencia de otros tipos de razonamiento? Pregunta b: Explique el chiste. ¿Qué es 'el problema de la inducción' y cómo se ha abordado desde la filosofía de la ciencia?","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Inducción: inferir una conclusión general (o sobre casos no observados) a partir de casos particulares observados.","x":"Ejemplo: 'el sol ha salido cada día, luego saldrá mañana'. Es un razonamiento ampliativo: la conclusión dice más que las premisas."},{"b":"Diferencia con la deducción: en la deducción válida la verdad de las premisas garantiza la conclusión; en la inducción no.","x":"La inducción solo hace probable la conclusión; siempre cabe una excepción no observada. La abducción (inferencia a la mejor explicación) es otro razonamiento no deductivo."},{"b":"El chiste: la cocina 'de inducción' razona inductivamente ('calenté ayer, calentaré hoy') y se niega a dar por segura esa inferencia.","x":"Juega con el doble sentido de 'inducción' (electromagnética/lógica) y escenifica que la regularidad pasada no garantiza el comportamiento futuro."},{"b":"Problema de la inducción (Hume): no hay justificación racional no circular de la inducción; descansa en el hábito.","x":"Justificarla por su éxito pasado es usar inducción para defender la inducción. Presupone la uniformidad de la naturaleza, que no puede probarse ni a priori ni empíricamente sin circularidad."},{"b":"Respuestas: Popper elimina la inducción (falsacionismo: conjeturas y refutaciones); otros la asumen como práctica falible.","x":"Popper propone que la ciencia no confirma sino que intenta refutar. Enfoques probabilísticos (bayesianos) y pragmáticos aceptan la inducción como razonable aunque falible, refinándola con estadística y control de sesgos."}]},{"id":"pc1-p103","tipo":"desarrollo","enunciado":"Texto de Chalmers (¿Qué es esa cosa llamada ciencia?) sobre la hierba que crece entre las huellas del estiércol y la necesidad de intervenir prácticamente. Pregunta a: ¿Qué es un experimento? Pon algún ejemplo. Pregunta b: Explica cómo la realización de experimentos permite discriminar entre explicaciones alternativas de un fenómeno, eliminando la influencia de posibles factores perturbadores.","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","bullets":[{"b":"Un experimento es una intervención activa: manipular el objeto de estudio para observar los efectos de esa manipulación.","x":"Se diferencia de la observación pasiva en que el investigador altera deliberadamente el sistema. Ejemplos: los planos inclinados de Galileo, añadir fertilizante a unas plantas y no a otras, un ensayo clínico."},{"b":"En la naturaleza los procesos se superponen: la mera observación no separa las causas (hoja que cae: gravedad, aire, viento).","x":"Chalmers subraya que observar los fenómenos 'tal como ocurren' no revela las leyes: la observación de hojas cayendo nunca daría la ley de caída de Galileo."},{"b":"En el ejemplo hay tres hipótesis rivales (fertilizante, humedad, vacas que no comen junto al estiércol) empíricamente indistinguibles sin intervenir.","x":"Las tres explican la misma observación. Solo manipulando (sacar las vacas una estación, desmenuzar el estiércol conservando el efecto fertilizante) se puede estimar el peso de cada factor."},{"b":"El experimento discrimina aislando variables: se modifica un factor manteniendo constantes los demás y se compara el resultado.","x":"Cada manipulación elimina o neutraliza un factor perturbador; si el efecto persiste o desaparece, se identifica qué proceso es responsable. Es la lógica del experimento controlado con grupo de control."},{"b":"Conclusión: la experimentación permite poner a prueba explicaciones alternativas y establecer relaciones causales, no meras correlaciones."}]},{"id":"pc1-p104","tipo":"desarrollo","enunciado":"Texto de Karin Knorr Cetina (La fabricación del conocimiento) sobre el laboratorio: los científicos buscan que las cosas 'funcionen' más que la verdad. Pregunta 1: Explica la diferencia entre los principios de éxito y de verdad y su relación con la ciencia. Pregunta 2: Describe en qué consiste el verificacionismo ingenuo del que habla el texto y expón la crítica al mismo por parte de los estudios sociales de la ciencia y el constructivismo.","variantes":[],"apariciones":["2023 Sep"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"Principio de verdad: la ciencia como búsqueda desinteresada de conocimiento verdadero; ideal epistemológico clásico.","x":"Es la imagen tradicional: el científico contrasta teorías con la realidad para acercarse a la verdad."},{"b":"Principio de éxito: en la práctica del laboratorio lo que rige es que las cosas 'funcionen', producir resultados publicables.","x":"Knorr Cetina, desde la etnografía del laboratorio, observa que el objetivo operativo es mundano: obtener resultados que se conviertan en créditos (publicaciones, financiación), no un ideal inalcanzable de verdad."},{"b":"La ciencia aparece así como manufactura o fabricación de conocimiento, condicionada por fines pragmáticos y sociales.","x":"Esto no implica que la ciencia sea fraudulenta, sino que sus productos se construyen en contextos concretos con intereses y negociaciones."},{"b":"Verificacionismo ingenuo: creer que la ciencia consiste simplemente en verificar teorías comparándolas directamente con los hechos.","x":"Supone hechos puros, observación neutral y un método que garantiza verdad. Ignora la carga teórica de la observación y las mediaciones prácticas del trabajo científico."},{"b":"Crítica constructivista: los hechos científicos se construyen socialmente en el laboratorio; no hay contraste directo con la realidad desnuda.","x":"Los estudios sociales de la ciencia (Kuhn, programa fuerte, Latour, Knorr Cetina) muestran que aceptar un resultado depende de instrumentos, negociaciones, anticipación de críticas y prestigio, no de una verificación pura."},{"b":"Balance: reconocer los factores sociales no obliga al relativismo total, pero desmonta la imagen ingenua de la ciencia."}]},{"id":"pc1-p105","tipo":"desarrollo","enunciado":"Texto de Popper (La lógica de la investigación científica) sobre el problema de la demarcación y la falsabilidad ('lloverá o no lloverá mañana' vs 'lloverá aquí mañana'). Pregunta 1: ¿En qué se diferencia el criterio de demarcación propuesto por Popper del del verificacionismo? Pregunta 2: ¿Cómo crees que Popper abordaría los casos del creacionismo, la pseudomedicina y el terraplanismo?","variantes":[],"apariciones":["2024 Feb-1"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"Verificacionismo: es científico lo que puede ser verificado (confirmado) por la experiencia; criterio positivo.","x":"Propio del Círculo de Viena. Tropieza con el problema de la inducción: las leyes universales nunca quedan verificadas concluyentemente por casos particulares."},{"b":"Popper: es científico lo que puede ser refutado por la experiencia; criterio negativo de falsabilidad.","x":"No exige selección positiva definitiva, sino exposición al riesgo: un sistema empírico ha de poder chocar con la experiencia. 'Lloverá o no lloverá' no es empírico porque nada puede refutarlo."},{"b":"Ventaja: aprovecha la asimetría lógica entre verificación (imposible para leyes) y falsación (posible con un contraejemplo)."},{"b":"Creacionismo: infalsable en el fondo; cualquier evidencia se reinterpreta como obra del creador, luego no es ciencia.","x":"Popper lo clasificaría como metafísica: puede tener sentido para el creyente, pero al no arriesgar predicciones refutables no es ciencia; presentarlo como tal es pseudociencia."},{"b":"Pseudomedicina: o evita la contrastación (infalsable) o sus afirmaciones ya han sido falsadas y se mantienen con hipótesis ad hoc.","x":"La homeopatía, por ejemplo, se protege de la refutación reinterpretando cada fracaso; esa estrategia inmunizadora es para Popper la marca de la pseudociencia."},{"b":"Terraplanismo: hace afirmaciones falsables que la evidencia ha refutado abundantemente; mantenerlas es irracionalidad anticientífica.","x":"Sería un caso de teoría empírica falsada cuyos defensores rechazan sistemáticamente los tests y sus resultados, recurriendo a conspiraciones ad hoc."}]},{"id":"pc1-p106","tipo":"desarrollo","enunciado":"Texto de Chalmers sobre la teoría de Adler (el hombre en la orilla del río): la teoría explica tanto que el hombre se tire como que no se tire. Pregunta 1: ¿Por qué no es falsable la teoría de Adler (tal como está presentada en el texto)? Pon un ejemplo de una hipótesis falsable y otro de una hipótesis no falsable. Pregunta 2: Explica por qué es importante según el falsacionismo formular las hipótesis de manera clara y precisa.","variantes":[],"apariciones":["2024 Feb-2"],"frecuencia":1,"tema":"Tema 3: La ciencia en sociedad","bullets":[{"b":"La teoría de Adler es compatible con cualquier conducta posible: ambas acciones opuestas 'confirman' el sentimiento de inferioridad.","x":"Si tanto tirarse como no tirarse apoyan la teoría, ninguna observación concebible podría refutarla: no prohíbe nada, luego no es falsable ni informativa sobre el mundo."},{"b":"Falsable: 'todos los metales se dilatan al calentarse' o la ley fuerza-aceleración de Newton; prohíben resultados concretos.","x":"Basta un metal que no se dilate para refutarla: la hipótesis se arriesga."},{"b":"No falsable: 'nuestro destino está regido por la providencia' o 'la posición de los astros influye en nuestra fortuna'.","x":"Cualquier suceso puede reinterpretarse como compatible; no hay observación posible que las refute."},{"b":"Cuanto más clara y precisa es una hipótesis, más falsable es: especifica exactamente qué observaciones la refutarían.","x":"Una predicción vaga ('mañana puede que llueva') se salva siempre; una precisa ('lloverá aquí mañana') se expone. Para Popper, la ciencia valora hipótesis audaces, precisas y de alto contenido informativo."},{"b":"La vaguedad es una estrategia inmunizadora típica de la pseudociencia (horóscopos, videncia): permite acomodar cualquier resultado.","x":"Formular con precisión evita las reinterpretaciones ad hoc que vacían de contenido empírico a una teoría."}]},{"id":"pc1-p107","tipo":"desarrollo","enunciado":"Texto de Cebolla, Jiménez Buedo y Salazar (Politikon, 2016) sobre el sesgo de selección en la asociación entre lactancia materna y salud/desarrollo infantil. Pregunta 1: ¿El hecho de que exista una asociación entre X e Y implica automáticamente que X sea la causa de Y? ¿Por qué? Pregunta 2: ¿Qué explicación proponen los autores para la correlación entre lactancia materna y beneficios en salud y desarrollo infantil? ¿Se te ocurre alguna forma de comprobar si esta explicación es correcta?","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"No: correlación no implica causalidad; la asociación puede deberse al azar, a causalidad inversa o a un tercer factor.","x":"Causación implica correlación, pero no a la inversa. Una asociación X-Y solo es evidencia causal si se descartan explicaciones alternativas."},{"b":"Sesgo de selección: un tercer factor Z hace a los individuos más proclives tanto a X como a Y.","x":"En el texto, Z son las características familiares (recursos, información): las familias que optan por la lactancia tienden también a proporcionar mejores condiciones de salud y desarrollo."},{"b":"Explicación de los autores: serían esas características familiares, y no la leche en sí, las que causan la mejor salud infantil."},{"b":"Comprobación ideal: experimento controlado aleatorizado; imposible aquí por razones éticas y prácticas.","x":"No se puede asignar aleatoriamente bebés a lactancia materna o de fórmula. La aleatorización neutralizaría las diferencias entre familias."},{"b":"Alternativas: controlar estadísticamente el nivel socioeconómico, comparar hermanos, estudios como PROBIT con promoción aleatorizada de lactancia.","x":"Si al controlar Z la asociación desaparece o se reduce mucho, se apoya la explicación del sesgo de selección; si persiste, habría efecto causal genuino de la lactancia."}]},{"id":"pc1-p108","tipo":"desarrollo","enunciado":"Texto de Chalmers (cap. 7) sobre la revolución copernicana: en 1543 los argumentos contra Copérnico eran sólidos y solo tras siglo y medio (nueva física) pudo defenderse la teoría. Pregunta 1: ¿Por qué la historia del desarrollo de la astronomía copernicana parece suponer un problema para el falsacionismo? ¿Cómo podría responder un falsacionista? Pregunta 2: ¿Cómo se explicaría desde la perspectiva de Kuhn la transición desde las teorías tradicionales a la nueva astronomía copernicana?","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Problema: según el falsacionismo, el copernicanismo debió abandonarse en 1543, pues chocaba con la evidencia disponible.","x":"Había objeciones mecánicas y astronómicas sólidas (ausencia de paralaje, física del movimiento). Si los científicos hubieran sido falsacionistas estrictos, la teoría habría muerto antes de desarrollarse."},{"b":"La historia muestra que fue racional mantener la teoría 'falsada' hasta que la nueva física (Galileo, Newton) la respaldó.","x":"El progreso exigió tenacidad frente a aparentes refutaciones: las metodologías inductivista y falsacionista ingenuas no describen este proceso."},{"b":"Respuesta falsacionista: las falsaciones afectaban a hipótesis auxiliares (física aristotélica, óptica), no al núcleo copernicano (holismo).","x":"Un falsacionista sofisticado (Lakatos) diría que el copernicanismo era un programa de investigación progresivo: sus modificaciones predijeron hechos nuevos, lo que justificaba protegerlo temporalmente."},{"b":"Kuhn: fue una revolución científica, el paso de un paradigma (geocéntrico-aristotélico) a otro (heliocéntrico) a través de una crisis.","x":"Las anomalías acumuladas en la astronomía ptolemaica, más virtudes como la simplicidad matemática, atrajeron a conversos; no hubo refutación concluyente ni verificación, sino cambio de lealtades en la comunidad."},{"b":"El cambio no se debió solo al apoyo evidencial: intervinieron valores estéticos, promesas de fecundidad y factores sociológicos (inconmensurabilidad).","x":"Solo tras generaciones y con la física newtoniana el nuevo paradigma pudo enfrentarse en detalle a la observación, consolidando la revolución."}]},{"id":"pc1-p109","tipo":"desarrollo","enunciado":"Texto de Duhem (La Teoría Física, 1906): 'el físico jamás puede someter a prueba experimental una hipótesis aislada, sino sólo todo un conjunto de hipótesis...'. Pregunta 1: ¿Por qué no se pueden someter a comprobación experimental hipótesis aisladas? Pregunta 2: ¿Supone la tesis de Duhem un desafío para el falsacionismo? ¿Cómo puede responderse al problema planteado por Duhem?","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Las predicciones no se deducen de la hipótesis sola, sino de esta junto a hipótesis auxiliares y supuestos de fondo.","x":"Intervienen teorías sobre los instrumentos, condiciones iniciales y supuestos idealizadores. Sin ese conjunto no hay predicción contrastable: es el holismo de la contrastación (tesis Duhem-Quine)."},{"b":"Si la predicción falla, la lógica solo dice que algo del conjunto es falso, no qué componente debe modificarse.","x":"El modus tollens refuta la conjunción, no la hipótesis principal aisladamente: el experimento 'no indica cuál debe ser modificada'."},{"b":"Desafío al falsacionismo: no hay falsaciones concluyentes de hipótesis individuales; siempre cabe culpar a una auxiliar.","x":"La refutación limpia que exige el falsacionismo ingenuo de Popper no existe: toda teoría puede salvarse ajustando el cinturón de hipótesis auxiliares."},{"b":"Respuesta popperiana: prohibir estratagemas ad hoc; las modificaciones deben ser contrastables independientemente y aumentar el contenido empírico.","x":"Es legítimo revisar auxiliares si la nueva versión hace predicciones nuevas comprobables (como Neptuno frente a las anomalías de Urano); es ilegítimo si solo inmuniza la teoría."},{"b":"Lakatos sistematiza la solución: programas de investigación con núcleo firme y cinturón protector, progresivos o degenerativos.","x":"La racionalidad no está en falsaciones puntuales sino en la evolución del programa: es científico mantener el núcleo mientras el programa predice hechos nuevos."}]},{"id":"pc1-p110","tipo":"desarrollo","enunciado":"Texto de Chalmers sobre las observaciones telescópicas de Galileo (lunas de Júpiter) y cómo convenció a los escépticos. Pregunta a: ¿Por qué es importante que las observaciones científicas sean públicas y repetibles por distintos investigadores? Pregunta b: Explica brevemente el papel de los instrumentos de observación en ciencia. ¿Cómo consiguió Galileo mostrar la fiabilidad de sus observaciones con el telescopio?","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 1: ¿Qué es la ciencia?","bullets":[{"b":"La evidencia científica debe ser intersubjetiva: pública y repetible, para que no dependa del testimonio de un solo observador.","x":"La repetición por observadores independientes permite descartar errores, ilusiones y fraudes, y convierte la observación en evidencia utilizable por toda la comunidad."},{"b":"La replicación independiente fue decisiva: hasta observadores contrarios a Copérnico (Collegio Romano) confirmaron los datos de Galileo.","x":"Que adversarios teóricos reproduzcan el resultado es especialmente valiosa evidencia de fiabilidad, pues elimina la sospecha de sesgo de confirmación."},{"b":"Los instrumentos amplían nuestras capacidades perceptivas y permiten observaciones más precisas y cuantitativas.","x":"El telescopio hizo visibles fenómenos inaccesibles a simple vista. Los instrumentos no son infalibles: su fiabilidad debe establecerse a su vez."},{"b":"Galileo defendió la fiabilidad del telescopio con argumentos: las lunas aparecían solo junto a Júpiter, no eran artefacto del aparato.","x":"Si fueran ilusiones producidas por el instrumento, deberían aparecer en cualquier lugar del cielo."},{"b":"Apeló a la consistencia y repetitividad de las mediciones y a predicciones exitosas (posiciones, fases, eclipses) confirmadas independientemente.","x":"La capacidad predictiva contrastable y la verificación por terceros mostraron que el telescopio producía datos fiables, no ilusiones."},{"b":"Relevancia teórica: las lunas de Júpiter desmontaban la objeción de que la Tierra 'perdería' a la Luna si se moviera."}]},{"id":"pc1-p111","tipo":"desarrollo","enunciado":"Texto de Cebolla, Jiménez-Buedo y Salazar ('Lactancia materna: ¿es la leche?', Politikon 2016) sobre la imposibilidad de experimentos controlados en lactancia y el sesgo de autoselección. Pregunta 1: ¿En qué consiste un experimento controlado? ¿Por qué no suele ser posible realizarlos en estudios sobre bienestar infantil? Pregunta 2: ¿Podemos inferir directamente una conexión causal a partir de una correlación entre variables identificada en un estudio observacional? Ilustra la respuesta con el ejemplo de la lactancia materna.","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 2: Los límites de lo científico","bullets":[{"b":"Experimento controlado: se manipula una variable manteniendo las demás constantes, comparando grupo tratado y grupo de control.","x":"La asignación aleatoria a los grupos neutraliza los factores de confusión, permitiendo aislar el efecto causal de la variable manipulada."},{"b":"En bienestar infantil no es posible por razones éticas y prácticas: no cabe asignar aleatoriamente bebés a lactancia materna o fórmula.","x":"Obligar o impedir la lactancia sería inaceptable; además la adherencia depende de las familias. Por eso se recurre a datos observacionales."},{"b":"De una correlación observacional no se infiere directamente causalidad: puede haber terceros factores o autoselección.","x":"La correlación es evidencia a investigar, no prueba causal: hay que descartar explicaciones alternativas antes de concluir que X causa Y."},{"b":"Ejemplo: madres con más recursos e información se 'autoseleccionan' hacia la lactancia; esas características explican parte de la ventaja infantil.","x":"En EE. UU. la lactancia está estratificada por clase y raza: la asociación lactancia-salud refleja en buena medida las circunstancias familiares, no (solo) la leche."},{"b":"Soluciones parciales: controles estadísticos, comparaciones entre hermanos o diseños cuasi-experimentales que aproximen el control experimental."}]}],"cards":[{"id":"pc1-c01","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es la evidencia?","back":"Pruebas o indicios acerca de la verdad de una proposición. No significa 'verdad obvia': es lo que apoya o socava racionalmente una afirmación."},{"id":"pc1-c02","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es un hecho?","back":"Es un hecho que p si y solo si es verdad que p. Los hechos son objetivos: no dependen de creencias ni opiniones."},{"id":"pc1-c03","tema":"Tema 1: ¿Qué es la ciencia?","front":"Verdad objetiva","back":"Aquella cuya verdad no depende de nuestras opiniones. Puede haber desacuerdo sobre verdades objetivas y consenso sobre falsedades."},{"id":"pc1-c04","tema":"Tema 1: ¿Qué es la ciencia?","front":"Empirismo","back":"Posición según la cual la principal fuente de evidencia científica es la experiencia observacional, no la razón pura ni la intuición."},{"id":"pc1-c05","tema":"Tema 1: ¿Qué es la ciencia?","front":"Sesgo cognitivo","back":"Distorsión sistemática en la evaluación e interpretación de la evidencia disponible. No es un método ni una creencia concreta."},{"id":"pc1-c06","tema":"Tema 1: ¿Qué es la ciencia?","front":"Sesgo de confirmación","back":"Tendencia a dar más peso a la evidencia que favorece lo que ya creemos y a ignorar la evidencia en contra."},{"id":"pc1-c07","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es un argumento?","back":"Secuencia de proposiciones: un conjunto de premisas de las que se siguen ciertas conclusiones."},{"id":"pc1-c08","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es un razonamiento?","back":"Transición entre creencias (u otros estados mentales) cuya finalidad es adoptar creencias correctas o justificadas."},{"id":"pc1-c09","tema":"Tema 1: ¿Qué es la ciencia?","front":"Premisas y conclusión","back":"Premisas: proposiciones de las que se parte. Conclusión: proposición a la que se llega. Ninguna tiene que ser verdadera por definición."},{"id":"pc1-c10","tema":"Tema 1: ¿Qué es la ciencia?","front":"Validez deductiva","back":"Si las premisas son verdaderas, la conclusión lo es necesariamente. Un argumento válido puede tener premisas falsas (Suiza/China). Inválido: premisas verdaderas y conclusión falsa posible."},{"id":"pc1-c11","tema":"Tema 2: Los límites de lo científico","front":"Razonamiento inductivo","back":"De casos observados a una generalización o casos nuevos. Es ampliativo: la verdad de las premisas no garantiza la conclusión."},{"id":"pc1-c12","tema":"Tema 2: Los límites de lo científico","front":"Problema de la inducción (Hume)","back":"Las premisas verdaderas no garantizan la generalización: siempre puede haber excepciones no observadas. Justificar la inducción por su éxito pasado es circular; descansa en el hábito."},{"id":"pc1-c13","tema":"Tema 2: Los límites de lo científico","front":"Principio de uniformidad de la naturaleza","back":"Supuesto de la inducción: los casos no observados se comportarán como los observados. No puede probarse sin circularidad."},{"id":"pc1-c14","tema":"Tema 1: ¿Qué es la ciencia?","front":"Argumento de autoridad","back":"Apoya una tesis apelando exclusivamente a que una autoridad la defiende. No es evidencia incuestionable ni inmune a la duda racional."},{"id":"pc1-c15","tema":"Tema 1: ¿Qué es la ciencia?","front":"Requisitos de la observación científica","back":"Pública, protocolarizada, repetible y accesible a distintos investigadores. La replicación detecta errores y hace la evidencia utilizable por la comunidad."},{"id":"pc1-c16","tema":"Tema 1: ¿Qué es la ciencia?","front":"Instrumentos de observación","back":"Superan las limitaciones de nuestras capacidades perceptivas (telescopio de Galileo). No garantizan infalibilidad: su fiabilidad debe demostrarse (consistencia, predicciones, verificación independiente)."},{"id":"pc1-c17","tema":"Tema 1: ¿Qué es la ciencia?","front":"Cuantificación de la observación","back":"Expresar observaciones en números permite compararlas con precisión entre observadores y favorece la reproducibilidad. No elimina el error."},{"id":"pc1-c18","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Qué es un experimento?","back":"Manipulación del objeto de estudio para observar los efectos de dicha manipulación. Se distingue de la observación pasiva por la intervención activa."},{"id":"pc1-c19","tema":"Tema 1: ¿Qué es la ciencia?","front":"Experimento controlado","back":"Se manipula una variable evitando interferencias de las demás (constantes o aleatorizadas), comparando grupo tratado y grupo de control para aislar el efecto causal."},{"id":"pc1-c20","tema":"Tema 3: La ciencia en sociedad","front":"Ensayo clínico","back":"Estudio experimental que investiga la efectividad y seguridad de un medicamento o tratamiento, idealmente aleatorizado y con grupo de control."},{"id":"pc1-c21","tema":"Tema 2: Los límites de lo científico","front":"Correlación vs causalidad","back":"Causación implica correlación; correlación NO implica causación (puede ser azar o tercer factor), aunque es evidencia que investigar."},{"id":"pc1-c22","tema":"Tema 2: Los límites de lo científico","front":"Sesgo de selección / autoselección","back":"Un tercer factor Z hace a los individuos proclives a X y a Y, creando asociación sin causalidad. Ejemplo: lactancia materna y salud infantil (recursos familiares)."},{"id":"pc1-c23","tema":"Tema 2: Los límites de lo científico","front":"Estadística inferencial","back":"Realiza inferencias inductivas sobre una población completa a partir de datos de una parte (muestra). La descriptiva solo ordena y resume datos."},{"id":"pc1-c24","tema":"Tema 2: Los límites de lo científico","front":"Muestra estadística","back":"Conjunto de casos de una población sobre los que se tienen datos, base de las inferencias sobre la población total. Debe ser representativa."},{"id":"pc1-c25","tema":"Tema 2: Los límites de lo científico","front":"Sesgo estadístico","back":"Distorsión por deficiencias en el análisis o la recolección de datos: las conclusiones no reflejan propiedades genuinas de la población estudiada."},{"id":"pc1-c26","tema":"Tema 2: Los límites de lo científico","front":"Probabilidad e incertidumbre","back":"La probabilidad asignada a un evento refleja la incertidumbre sobre si ocurrirá. Los resultados probabilísticos son científicamente aceptables si reflejan el apoyo evidencial."},{"id":"pc1-c27","tema":"Tema 2: Los límites de lo científico","front":"Imprecisión vs error","back":"Una medida imprecisa (intervalo: 25-27°C) no elimina toda la incertidumbre, pero puede ser correcta e informativa. Precisión y corrección son distintas."},{"id":"pc1-c28","tema":"Tema 2: Los límites de lo científico","front":"Aproximación","back":"Resultado inexacto pero suficientemente cercano a la respuesta correcta para los intereses de los investigadores. Aceptable y omnipresente en ciencia."},{"id":"pc1-c29","tema":"Tema 2: Los límites de lo científico","front":"Modelo científico","back":"Idealización que sirve para aproximarse a la realidad. Es aceptable si permite inferencias útiles, no por reflejarla fielmente. Un modelo falso puede ser válido."},{"id":"pc1-c30","tema":"Tema 2: Los límites de lo científico","front":"¿Un ser vivo puede ser modelo científico?","back":"Sí: organismos modelo como el ratón, Drosophila o E. coli representan otros sistemas biológicos en la investigación."},{"id":"pc1-c31","tema":"Tema 2: Los límites de lo científico","front":"Modelo nomológico-deductivo","back":"Explicación por subsunción bajo leyes generales (Hempel). Más frecuente en física y química, que disponen de leyes universales estrictas."},{"id":"pc1-c32","tema":"Tema 1: ¿Qué es la ciencia?","front":"Hipótesis","back":"Conjetura que se propone como posibilidad abierta (sin creerla verdadera ni falsa). Puede ser infalsable, carecer aún de evidencia y aun así ser verdadera."},{"id":"pc1-c33","tema":"Tema 1: ¿Qué es la ciencia?","front":"Predicciones de una hipótesis","back":"Consecuencias que se seguirían de la verdad de la hipótesis; se deducen de ella (más auxiliares) y permiten contrastarla empíricamente."},{"id":"pc1-c34","tema":"Tema 1: ¿Qué es la ciencia?","front":"Refutación empírica","back":"Una hipótesis queda refutada si alguna de sus predicciones es incompatible con la evidencia. Una generalización universal cae con un solo contraejemplo."},{"id":"pc1-c35","tema":"Tema 1: ¿Qué es la ciencia?","front":"Método científico: ¿reglas para hipótesis?","back":"No hay reglas rígidas: vale cualquier hipótesis contrastable. Virtudes deseables: simplicidad, generalidad, poder predictivo, capacidad explicativa. Aplicable a cualquier hipótesis empírica."},{"id":"pc1-c36","tema":"Tema 3: La ciencia en sociedad","front":"Verificacionismo","back":"Criterio del Círculo de Viena: las hipótesis científicas deben ser corroboradas (verificadas) por la experiencia. Hereda el problema de la inducción: las leyes universales nunca quedan verificadas."},{"id":"pc1-c37","tema":"Tema 3: La ciencia en sociedad","front":"Falsabilidad (Popper)","back":"Una hipótesis es falsable si es posible que surja evidencia que la refute. Es el criterio popperiano de cientificidad. Falsable no significa falsa."},{"id":"pc1-c38","tema":"Tema 2: Los límites de lo científico","front":"Asimetría verificación/falsación","back":"Ningún número de casos favorables verifica una ley universal, pero un contraejemplo la refuta. Por eso no sabemos si estamos en lo cierto, pero sí si estamos equivocados."},{"id":"pc1-c39","tema":"Tema 2: Los límites de lo científico","front":"Corroboración (Popper)","back":"Superar contrastaciones apoya la teoría solo temporalmente: sigue expuesta a tests futuros. La ciencia avanza por conjeturas y refutaciones."},{"id":"pc1-c40","tema":"Tema 2: Los límites de lo científico","front":"Enunciados falsables: ejemplos de examen","back":"Falsables: 'la fuerza neta es proporcional a la aceleración', 'los metales se dilatan al calentarse'. No falsables: providencia divina, astrología, inconsciente, lucha de clases como motor de la historia."},{"id":"pc1-c41","tema":"Tema 2: Los límites de lo científico","front":"Holismo de la contrastación (Duhem-Quine)","back":"La evidencia no refuta hipótesis aisladas, solo conjuntos de hipótesis más auxiliares y presuposiciones. El experimento no dice qué componente falla."},{"id":"pc1-c42","tema":"Tema 2: Los límites de lo científico","front":"Lakatos: falsacionismo sofisticado","back":"Las teorías forman programas de investigación (núcleo firme + cinturón protector). Son progresivos si predicen hechos nuevos; degenerativos si solo se protegen ad hoc."},{"id":"pc1-c43","tema":"Tema 2: Los límites de lo científico","front":"Paradigma (Kuhn)","back":"Marco compartido de supuestos, conceptos, métodos y ejemplares que define los problemas y soluciones legítimos de una comunidad científica."},{"id":"pc1-c44","tema":"Tema 2: Los límites de lo científico","front":"Ciencia normal","back":"La ciencia que se hace en el marco de un paradigma: resolución de enigmas sin cuestionar los fundamentos."},{"id":"pc1-c45","tema":"Tema 2: Los límites de lo científico","front":"Anomalía y crisis (Kuhn)","back":"Anomalía: resultado que el paradigma no logra acomodar. Su acumulación persistente genera crisis y abre paso a paradigmas rivales."},{"id":"pc1-c46","tema":"Tema 2: Los límites de lo científico","front":"Revolución científica","back":"Sustitución de un paradigma por otro que reorganiza conceptos y métodos. Ejemplo canónico: de la astronomía ptolemaica a la copernicana."},{"id":"pc1-c47","tema":"Tema 2: Los límites de lo científico","front":"Inconmensurabilidad","back":"Dos paradigmas son inconmensurables cuando resultan incomparables punto por punto: usan marcos conceptuales y criterios de evaluación radicalmente diferentes."},{"id":"pc1-c48","tema":"Tema 2: Los límites de lo científico","front":"Cambio de paradigma: ¿qué lo determina?","back":"Ocurre cuando la comunidad científica decide asumir el nuevo paradigma, sea cual sea el motivo. No se debe exclusivamente a un mejor apoyo evidencial."},{"id":"pc1-c49","tema":"Tema 2: Los límites de lo científico","front":"Conocimiento tácito en el paradigma","back":"Buena parte del saber paradigmático se transmite tácitamente: mediante ejemplares, práctica y entrenamiento, no solo reglas explícitas (Kuhn, Polanyi)."},{"id":"pc1-c50","tema":"Tema 3: La ciencia en sociedad","front":"Feyerabend","back":"Anarquismo filosófico/epistemológico: no hay método científico universal; el único principio que no frena el progreso es 'todo vale' (Contra el método)."},{"id":"pc1-c51","tema":"Tema 3: La ciencia en sociedad","front":"Problema de la demarcación","back":"La búsqueda de criterios para distinguir lo científico de lo no científico (Popper). Los tres criterios del curso: verificabilidad, falsabilidad y correspondencia con el paradigma."},{"id":"pc1-c52","tema":"Tema 3: La ciencia en sociedad","front":"Pseudociencia","back":"No-ciencia haciéndose pasar por ciencia para aprovechar su crédito social. Ejemplos: astrología, homeopatía, diseño inteligente."},{"id":"pc1-c53","tema":"Tema 3: La ciencia en sociedad","front":"Anticiencia","back":"Discurso basado en la desconfianza hacia la ciencia; los anticientificistas sostienen que la ciencia debe eliminarse o reconsiderarse profundamente, sea cual sea el criterio de demarcación."},{"id":"pc1-c54","tema":"Tema 3: La ciencia en sociedad","front":"¿Cuándo chocan los discursos no científicos con la ciencia?","back":"Cuando son pseudocientíficos (la suplantan) o anticientíficos (la atacan). La no-ciencia como tal puede convivir con la ciencia sin conflicto."},{"id":"pc1-c55","tema":"Tema 3: La ciencia en sociedad","front":"Creacionismo y diseño inteligente","back":"El diseño inteligente asume el creacionismo: es su reformulación con apariencia científica. No son idénticos ni el segundo ha reemplazado al primero."},{"id":"pc1-c56","tema":"Tema 3: La ciencia en sociedad","front":"NOMA (Gould)","back":"Magisterios que no se superponen: la ciencia trata hechos del mundo natural; la religión, fines, significados y valores. No interferencia respetuosa con diálogo."},{"id":"pc1-c57","tema":"Tema 3: La ciencia en sociedad","front":"Giro social de la filosofía de la ciencia","back":"Tras Kuhn: la demarcación depende de valores y aspectos contextuales que determinan el paradigma dominante. La ciencia se estudia como producto social."},{"id":"pc1-c58","tema":"Tema 3: La ciencia en sociedad","front":"Constructivismo social","back":"La ciencia no tiene posición epistémica privilegiada frente a la magia o la mitología: se explica simétricamente como fenómeno social (programa fuerte, Knorr Cetina)."},{"id":"pc1-c59","tema":"Tema 3: La ciencia en sociedad","front":"Knorr Cetina: éxito vs verdad","back":"En el laboratorio rige el principio de éxito (que las cosas 'funcionen' y produzcan resultados publicables), no el ideal epistemológico de verdad: fabricación del conocimiento."},{"id":"pc1-c60","tema":"Tema 3: La ciencia en sociedad","front":"Enfoques feministas de la ciencia","back":"La ciencia, como producto social, está determinada por el androcentrismo de la sociedad: sesgos en prioridades, métodos y teorías. No dicen que solo valga la ciencia de mujeres."},{"id":"pc1-c61","tema":"Tema 3: La ciencia en sociedad","front":"Revisión por pares","back":"Proceso editorial por el que investigadores independientes evalúan los artículos enviados a una revista antes de su publicación."},{"id":"pc1-c62","tema":"Tema 3: La ciencia en sociedad","front":"Factor de impacto","back":"Promedio de citas de los artículos publicados en una revista: mide su influencia en la comunidad científica."},{"id":"pc1-c63","tema":"Tema 3: La ciencia en sociedad","front":"Sesgo de publicación","back":"Los resultados positivos se publican más porque se perciben como más interesantes y de mayor impacto; replicaciones y resultados negativos quedan infrarrepresentados."},{"id":"pc1-c64","tema":"Tema 3: La ciencia en sociedad","front":"Estudios de replicación","back":"Buscan reproducir los resultados de un experimento previo. Esenciales para comprobar la fiabilidad de la ciencia, pero difíciles de publicar (crisis de replicación)."},{"id":"pc1-c65","tema":"Tema 3: La ciencia en sociedad","front":"Motivaciones de los científicos","back":"No solo epistémicas: incluyen reconocimiento, premios y financiación. Ello no convierte sus resultados en fraudulentos; el control es institucional."},{"id":"pc1-c66","tema":"Tema 3: La ciencia en sociedad","front":"Expertos científicos","back":"Investigadores cuyas opiniones sobre ciertas cuestiones científicas son generalmente fiables. No infalibles ni incuestionables: la pericia no elimina la crítica racional."},{"id":"pc1-c67","tema":"Tema 1: ¿Qué es la ciencia?","front":"Ciencia y tradición","back":"Las creencias tradicionales no respaldadas por la evidencia no son aceptables científicamente. Ejemplo: Galileo contra el axioma aristotélico de la caída de los cuerpos."},{"id":"pc1-c68","tema":"Tema 1: ¿Qué es la ciencia?","front":"Falibilismo: ¿es revisable lo aceptado?","back":"Sí: es frecuente que nueva evidencia lleve a rechazar hipótesis ampliamente aceptadas que se ajustaban a la evidencia anterior (flogisto, éter, geocentrismo)."},{"id":"pc1-c69","tema":"Tema 1: ¿Qué es la ciencia?","front":"Galileo, Carta a Cristina de Lorena","back":"En cuestiones naturales mandan los sentidos y las demostraciones necesarias; la Escritura, que enseña 'cómo se va al cielo', debe reinterpretarse si choca con lo demostrado."},{"id":"pc1-c70","tema":"Tema 2: Los límites de lo científico","front":"Escepticismo humeano sobre la inducción","back":"No existe justificación racional de la inducción: aceptar generalizaciones desde casos particulares es un hábito psicológico, fruto de la costumbre."},{"id":"pc1-c71","tema":"Tema 3: La ciencia en sociedad","front":"Ciencia y decisiones prácticas","back":"El conocimiento científico informa las decisiones: permite anticipar consecuencias y estimar qué opciones logran mejor nuestros objetivos, sean cuales sean nuestros valores."},{"id":"pc1-c72","tema":"Tema 1: ¿Qué es la ciencia?","front":"¿Aplicaciones prácticas = evidencia?","back":"No: que un campo tenga aplicaciones es motivación legítima para investigarlo y financiarlo, pero no es evidencia a favor de sus hipótesis."}],"mcqs":[{"id":"pc1-t001","tema":"Tema 2: Los límites de lo científico","fuente":"card:pc1-c22","enunciado":"¿En qué consiste el sesgo de selección o autoselección en un estudio observacional?","opciones":["Un tercer factor hace a los individuos proclives a la vez a la exposición y al resultado, generando asociación no causal.","Los investigadores escogen conscientemente solo los datos que confirman la hipótesis que ya deseaban defender de antemano.","El tamaño reducido de la muestra impide, por puro azar, detectar correlaciones que sí existen en la población."],"correcta":0,"explicacion":"Ejemplo del curso: las familias con más recursos se autoseleccionan hacia la lactancia materna, y son esos recursos, no la leche, los que explican la mejor salud infantil. No es manipulación deliberada ni un problema de tamaño muestral."},{"id":"pc1-t002","tema":"Tema 2: Los límites de lo científico","fuente":"card:pc1-c31","enunciado":"Según el modelo nomológico-deductivo (Hempel), explicar científicamente un fenómeno consiste en:","opciones":["Deducirlo de leyes generales junto con las condiciones iniciales pertinentes.","Identificar la causa que lo produjo mediante experimentos bien controlados.","Construir una idealización simplificada que permita hacer inferencias útiles."],"correcta":0,"explicacion":"Para Hempel explicar es subsumir el fenómeno bajo leyes universales, de ahí que este modelo sea más frecuente en física y química. La tercera opción describe los modelos científicos, no este tipo de explicación."},{"id":"pc1-t003","tema":"Tema 2: Los límites de lo científico","fuente":"card:pc1-c39","enunciado":"Para Popper, que una teoría haya superado contrastaciones exigentes significa que está corroborada, es decir:","opciones":["Apoyada solo provisionalmente: sigue expuesta a contrastaciones futuras que podrían refutarla.","Verificada: las predicciones arriesgadas cumplidas demuestran ya su verdad definitiva.","Confirmada inductivamente: cada éxito aumenta la probabilidad de que sea verdadera."],"correcta":0,"explicacion":"La corroboración popperiana nunca es definitiva: la ciencia avanza por conjeturas y refutaciones. Popper rechaza tanto la verificación concluyente como la confirmación inductiva, por el problema de la inducción."},{"id":"pc1-t004","tema":"Tema 2: Los límites de lo científico","fuente":"card:pc1-c43","enunciado":"¿Qué es un paradigma, según Kuhn?","opciones":["Marco compartido de supuestos, conceptos, métodos y ejemplares que define los problemas legítimos de una comunidad.","Conjunto de leyes universales verdaderas que una disciplina ha logrado verificar de manera definitiva.","Programa de investigación formado por un núcleo firme y un cinturón protector de hipótesis auxiliares."],"correcta":0,"explicacion":"El paradigma kuhniano es el marco que hace posible la ciencia normal: fija qué problemas y soluciones cuentan como legítimos. La tercera opción describe la propuesta de Lakatos, no la de Kuhn."},{"id":"pc1-t005","tema":"Tema 2: Los límites de lo científico","fuente":"card:pc1-c45","enunciado":"Para Kuhn, una anomalía desemboca en crisis del paradigma cuando:","opciones":["Persiste reiteradamente y afecta a cuestiones centrales que el paradigma no logra resolver.","Aparece por primera vez, pues una sola falsación obliga a abandonar el paradigma vigente.","Es difundida por científicos de una escuela rival con mayor prestigio institucional."],"correcta":0,"explicacion":"Las anomalías aisladas son normales y no bastan: solo su acumulación persistente en cuestiones centrales genera crisis y abre paso a paradigmas rivales. La segunda opción confunde a Kuhn con un falsacionismo ingenuo."},{"id":"pc1-t006","tema":"Tema 3: La ciencia en sociedad","fuente":"card:pc1-c56","enunciado":"Según el principio NOMA de Stephen Jay Gould, ciencia y religión:","opciones":["Tienen magisterios separados: hechos del mundo natural frente a fines, significados y valores.","Mantienen un conflicto inevitable, pues ambas hacen afirmaciones rivales sobre la naturaleza.","Deben fundirse en un único discurso que integre los hechos empíricos y los valores morales."],"correcta":0,"explicacion":"NOMA significa 'magisterios que no se superponen': cada dominio tiene su ámbito propio y no hay conflicto necesario. Gould propone no interferencia respetuosa con diálogo, no unificación ni guerra."},{"id":"pc1-t007","tema":"Tema 3: La ciencia en sociedad","fuente":"card:pc1-c59","enunciado":"Según Knorr Cetina, en la práctica del laboratorio los científicos se guían sobre todo por:","opciones":["El principio de éxito: que las cosas funcionen y produzcan resultados publicables.","El principio de verdad: la búsqueda desinteresada de conocimiento objetivo del mundo.","El principio de falsabilidad: formular conjeturas arriesgadas e intentar refutarlas."],"correcta":0,"explicacion":"Sus estudios de laboratorio describen la ciencia como 'fabricación' de conocimiento regida por fines pragmáticos. El principio de verdad es justamente el ideal epistemológico clásico que su análisis cuestiona."},{"id":"pc1-t008","tema":"Tema 1: ¿Qué es la ciencia?","fuente":"card:pc1-c67","enunciado":"Para la actitud científica, las creencias respaldadas únicamente por la tradición:","opciones":["Deben someterse a contrastación empírica, pues su antigüedad no constituye evidencia.","Merecen aceptarse provisionalmente, pues han superado la larga prueba del tiempo.","Deben rechazarse de entrada, pues toda creencia tradicional acaba resultando falsa."],"correcta":0,"explicacion":"Es el caso de Galileo frente al axioma aristotélico de la caída de los cuerpos: la tradición no es evidencia, pero tampoco garantiza falsedad; lo que exige la ciencia es ponerla a prueba."},{"id":"pc1-t009","tema":"Tema 1: ¿Qué es la ciencia?","fuente":"card:pc1-c69","enunciado":"En la Carta a Cristina de Lorena, Galileo sostiene que en las cuestiones naturales la autoridad última es:","opciones":["La experiencia de los sentidos y las demostraciones necesarias.","La interpretación literal de las Sagradas Escrituras reveladas.","El consenso de los filósofos de la tradición aristotélica."],"correcta":0,"explicacion":"Para Galileo, en lo empírico mandan la evidencia y la demostración; como 'dos verdades no pueden contradecirse', si la ciencia demuestra algo, es la Escritura la que debe reinterpretarse."},{"id":"pc1-t010","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p41","enunciado":"Según Kuhn, ¿por qué ciertos descubrimientos no pueden acomodarse a los conceptos habituales previos?","opciones":["Porque violan la taxonomía conceptual del paradigma: asimilarlos exige alterar la red de conceptos.","Porque contradicen observaciones anteriores que ya habían quedado verificadas concluyentemente.","Porque los científicos del paradigma antiguo carecen de la formación matemática para entenderlos."],"correcta":0,"explicacion":"Los conceptos están definidos por el paradigma: términos como planeta, masa o combustión cambian de significado tras la revolución. Asimilar el descubrimiento no es añadir un dato, sino reorganizar la red conceptual."},{"id":"pc1-t011","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p41","enunciado":"Para Kuhn, el cambio revolucionario se diferencia de la ciencia normal en que:","opciones":["Reorganiza globalmente conceptos y métodos, como un cambio de gestalt, en vez de acumular conocimiento.","Acumula conocimiento más deprisa gracias al esfuerzo coordinado de toda la comunidad científica.","Resuelve los enigmas pendientes aplicando con más rigor las reglas del paradigma vigente."],"correcta":0,"explicacion":"La revolución no es mera adición: exige reaprender a ver el mundo, y tras ella los científicos 'viven en un mundo diferente'. La tercera opción describe precisamente la ciencia normal."},{"id":"pc1-t012","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p98","enunciado":"Para Galileo, si una demostración científica choca con un pasaje de la Escritura:","opciones":["Hay que reinterpretar el pasaje, pues dos verdades no pueden contradecirse.","Hay que rechazar la demostración, pues la Escritura es la autoridad suprema.","Hay que suspender el juicio hasta que la autoridad religiosa se pronuncie."],"correcta":0,"explicacion":"Galileo sostiene que la autoridad religiosa no debe comprometer los textos sagrados fijando conclusiones empíricas refutables: lo demostrado sobre la naturaleza obliga a reinterpretar la Escritura, no a negar la ciencia."},{"id":"pc1-t013","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p98","enunciado":"Según Galileo, la evidencia empírica se diferencia de la interpretación de textos en que:","opciones":["Es pública y contrastable, mientras que la interpretación es discutible y variable.","Es infalible y definitiva, mientras que la interpretación puede contener errores.","Es accesible solo a los expertos, mientras que la interpretación está al alcance de todos."],"correcta":0,"explicacion":"La fuerza de la 'experiencia de los sentidos y las demostraciones necesarias' está en su carácter público y contrastable, no en una supuesta infalibilidad: la observación también puede corregirse."},{"id":"pc1-t014","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p99","enunciado":"Según Gould, el creacionismo viola el principio NOMA porque:","opciones":["Usa la autoridad religiosa para afirmar tesis empíricas, como la edad de la Tierra.","Niega que la religión tenga un magisterio propio en el terreno de los valores.","Propone un diálogo entre ciencia y religión que Gould considera del todo imposible."],"correcta":0,"explicacion":"El creacionismo invade el magisterio de la ciencia al pronunciarse sobre hechos naturales (origen de las especies, edad de la Tierra) desde la autoridad religiosa. La evolución pertenece al ámbito científico."},{"id":"pc1-t015","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p99","enunciado":"¿Cómo propone Gould abordar la relación entre los discursos científico y religioso?","opciones":["Con no interferencia respetuosa entre magisterios, acompañada de diálogo entre ambos dominios.","Con la subordinación de la religión a la ciencia, única fuente legítima de conocimiento.","Con su integración progresiva en una disciplina unificada sobre hechos y significados."],"correcta":0,"explicacion":"Para Gould no hay conflicto necesario: ciencia y religión cubren facetas complementarias de la existencia (hechos frente a fines y valores), por lo que caben respeto mutuo y diálogo, no fusión ni jerarquía."},{"id":"pc1-t016","tema":"Tema 1: ¿Qué es la ciencia?","fuente":"pregunta:pc1-p100","enunciado":"¿Por qué importaba que el experimento de Galileo en la torre de Pisa fuese público?","opciones":["Porque permitía el control intersubjetivo: los testigos no dependían de la palabra de Galileo.","Porque un experimento realizado en privado carece de validez lógica, aunque esté bien diseñado.","Porque la asistencia de las autoridades académicas verificaba definitivamente el resultado."],"correcta":0,"explicacion":"El carácter público y la repetibilidad convierten un resultado en evidencia utilizable por toda la comunidad y permiten detectar errores y sesgos. No se trata de validez lógica ni de verificación por autoridades."},{"id":"pc1-t017","tema":"Tema 1: ¿Qué es la ciencia?","fuente":"pregunta:pc1-p100","enunciado":"Frente al axioma aristotélico de la caída de los cuerpos, Galileo optó por:","opciones":["Diseñar un experimento que sometiera la hipótesis tradicional a prueba empírica.","Deducir la falsedad del axioma a partir de principios matemáticos autoevidentes.","Apelar a la autoridad de otros filósofos que ya habían discutido a Aristóteles."],"correcta":0,"explicacion":"La actitud científica no acepta creencias por su antigüedad o por la autoridad que las respalda: Galileo manipuló la situación (dos pesos distintos, misma caída) para contrastar empíricamente la hipótesis."},{"id":"pc1-t018","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p101","enunciado":"Según Popper, ¿qué diferencia hay entre verificar y falsar un enunciado?","opciones":["Verificar sería establecer concluyentemente su verdad; falsar es mostrar su falsedad con un contraejemplo.","Verificar es apoyarlo con casos favorables; falsar es mostrar que carece de sentido empírico.","Verificar es confirmarlo de modo provisional; falsar es probar que nunca podrá contrastarse."],"correcta":0,"explicacion":"Hay una asimetría lógica: ningún número de casos favorables verifica una ley universal, pero un solo contraejemplo basta para refutarla. Falsar no tiene que ver con el sentido ni con la imposibilidad de contrastar."},{"id":"pc1-t019","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p101","enunciado":"¿Por qué dice Popper que una decisión positiva apoya a la teoría examinada 'solo temporalmente'?","opciones":["Porque la teoría sigue expuesta a contrastaciones futuras que podrían llegar a falsarla.","Porque los resultados favorables suelen deberse a errores de medición aún no detectados.","Porque toda teoría científica caduca cuando la comunidad cambia de paradigma dominante."],"correcta":0,"explicacion":"El conocimiento científico es conjetural y falible: superar tests corrobora la teoría, pero nunca la verifica, pues el problema de la inducción impide establecer concluyentemente leyes generales."},{"id":"pc1-t020","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p102","enunciado":"¿Qué diferencia fundamental hay entre deducción e inducción?","opciones":["En la deducción válida las premisas garantizan la conclusión; en la inducción no.","La deducción parte de casos particulares; la inducción parte de leyes generales.","La deducción se emplea en las ciencias empíricas; la inducción, solo en matemáticas."],"correcta":0,"explicacion":"La inducción es ampliativa: va de casos observados a conclusiones generales o sobre casos nuevos, sin garantía lógica. La segunda opción invierte los papeles, error típico de examen."},{"id":"pc1-t021","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p102","enunciado":"¿Cómo responde Popper al problema de la inducción planteado por Hume?","opciones":["Prescindiendo de la inducción: la ciencia avanza por conjeturas y refutaciones deductivas.","Justificando la inducción por el gran éxito que ha tenido en la práctica científica pasada.","Demostrando el principio de uniformidad de la naturaleza a partir de la experiencia acumulada."],"correcta":0,"explicacion":"Popper elimina la inducción del método científico: se proponen conjeturas y se intenta refutarlas deductivamente. Las otras dos vías son circulares, pues usan la inducción para justificar la inducción."},{"id":"pc1-t022","tema":"Tema 1: ¿Qué es la ciencia?","fuente":"pregunta:pc1-p103","enunciado":"Según Chalmers, ¿por qué la mera observación no basta para separar las causas de un fenómeno?","opciones":["Porque en la naturaleza los procesos se superponen y varios factores actúan a la vez.","Porque nuestros sentidos son engañosos y solo los instrumentos ofrecen datos fiables.","Porque sin cuantificación numérica ninguna observación posee valor como evidencia."],"correcta":0,"explicacion":"En una hoja que cae intervienen a la vez gravedad, resistencia del aire y viento: observando pasivamente no se distinguen las contribuciones. De ahí la necesidad de intervenir prácticamente."},{"id":"pc1-t023","tema":"Tema 1: ¿Qué es la ciencia?","fuente":"pregunta:pc1-p103","enunciado":"¿Cómo permite un experimento discriminar entre explicaciones alternativas de un fenómeno?","opciones":["Modificando un factor mientras se mantienen constantes los demás, y comparando los resultados.","Acumulando muchas observaciones del fenómeno tal y como ocurre espontáneamente.","Eligiendo la explicación más simple de entre las que resultan compatibles con los datos."],"correcta":0,"explicacion":"En el ejemplo de la hierba y el estiércol hay tres hipótesis rivales indistinguibles sin intervenir: el experimento aísla variables y elimina factores perturbadores, estableciendo causas y no meras correlaciones."},{"id":"pc1-t024","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p104","enunciado":"¿Qué es el 'verificacionismo ingenuo' que critican los estudios de laboratorio de Knorr Cetina?","opciones":["Creer que la ciencia consiste en verificar teorías comparándolas directamente con los hechos.","Creer que ninguna teoría puede verificarse y que únicamente cabe intentar refutarlas.","Creer que los hechos científicos son construcciones sociales carentes de base empírica."],"correcta":0,"explicacion":"La crítica constructivista sostiene que los hechos se construyen socialmente en el laboratorio: no hay contraste directo con la 'realidad desnuda'. La segunda opción describe el falsacionismo, no el verificacionismo."},{"id":"pc1-t025","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p104","enunciado":"Para los estudios constructivistas del laboratorio, reconocer los factores sociales de la ciencia:","opciones":["Desmonta la imagen ingenua de la ciencia sin obligar necesariamente al relativismo total.","Demuestra que el conocimiento científico es tan arbitrario como cualquier mitología.","Confirma que la verdad sigue siendo el único principio que rige el trabajo científico."],"correcta":0,"explicacion":"Que en el laboratorio rija el principio de éxito (producir resultados que funcionen y sean publicables) desmiente el ideal puramente desinteresado, pero de ahí no se sigue sin más que todo valga igual."},{"id":"pc1-t026","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p105","enunciado":"¿En qué se diferencia el criterio de demarcación de Popper del criterio verificacionista?","opciones":["Es negativo: exige que la hipótesis pueda ser refutada por la experiencia, no confirmada.","Es positivo: exige que la hipótesis haya sido confirmada por numerosos casos favorables.","Es social: exige que la hipótesis encaje en el paradigma aceptado por la comunidad."],"correcta":0,"explicacion":"Popper aprovecha la asimetría lógica: verificar leyes universales es imposible, pero falsarlas es posible con un contraejemplo. El verificacionismo es el criterio positivo del Círculo de Viena; el tercero, el enfoque kuhniano."},{"id":"pc1-t027","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p105","enunciado":"Desde el falsacionismo, ¿qué distingue al terraplanismo del creacionismo?","opciones":["El terraplanismo hace afirmaciones falsables ya refutadas; el creacionismo es infalsable de fondo.","El terraplanismo es infalsable por su vaguedad; el creacionismo formula predicciones arriesgadas.","Ambos son igualmente falsables, aunque solo el creacionismo ha sido refutado por la evidencia."],"correcta":0,"explicacion":"El creacionismo reinterpreta cualquier evidencia como obra del creador, así que no se expone a refutación; el terraplanismo sí hace afirmaciones contrastables, abundantemente refutadas, y mantenerlas es irracionalidad anticientífica."},{"id":"pc1-t028","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p106","enunciado":"¿Por qué no es falsable la teoría de Adler, según el ejemplo de Chalmers?","opciones":["Porque es compatible con cualquier conducta posible: acciones opuestas la 'confirman' por igual.","Porque sus predicciones son tan precisas que ningún experimento logra ponerlas a prueba.","Porque ya quedó refutada por la observación de un contraejemplo claro e indiscutible."],"correcta":0,"explicacion":"Que el hombre se tire al río o que no se tire: ambas conductas se explican por el sentimiento de inferioridad. Una teoría que no prohíbe ningún resultado posible no se expone a refutación."},{"id":"pc1-t029","tema":"Tema 3: La ciencia en sociedad","fuente":"pregunta:pc1-p106","enunciado":"Según el falsacionismo, ¿por qué conviene formular las hipótesis de manera clara y precisa?","opciones":["Porque cuanto más precisa es una hipótesis, más falsable: especifica qué observaciones la refutarían.","Porque la precisión garantiza que la hipótesis resultará verdadera al ser contrastada.","Porque las hipótesis vagas no pueden comunicarse bien entre los distintos investigadores."],"correcta":0,"explicacion":"La vaguedad es una estrategia inmunizadora típica de la pseudociencia (horóscopos, videncia): permite acomodar cualquier resultado. La precisión no garantiza verdad, sino contrastabilidad."},{"id":"pc1-t030","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p107","enunciado":"¿Qué explicación proponen Cebolla, Jiménez Buedo y Salazar para la correlación entre lactancia y desarrollo infantil?","opciones":["Características familiares asociadas a la lactancia, y no la leche en sí, causarían la ventaja.","La leche materna contiene nutrientes cuyo efecto causal directo ya está demostrado experimentalmente.","La correlación observada es fruto del azar y desaparece al ampliar el tamaño de la muestra."],"correcta":0,"explicacion":"Es un caso de sesgo de selección: un tercer factor (recursos e información de la familia) hace a los individuos proclives tanto a la lactancia como a la mejor salud, generando asociación sin causalidad directa."},{"id":"pc1-t031","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p107","enunciado":"Ante la imposibilidad de aleatorizar la lactancia, ¿qué alternativas metodológicas proponen los autores?","opciones":["Controlar estadísticamente el nivel socioeconómico o comparar hermanos de una misma familia.","Renunciar a toda conclusión, pues sin experimento no existe evidencia científica posible.","Aceptar la correlación como prueba causal suficiente cuando es fuerte y significativa."],"correcta":0,"explicacion":"También cabe apoyarse en estudios como PROBIT, que aleatorizó la promoción de la lactancia. Son aproximaciones al control experimental que permiten evidencia causal parcial sin caer en la falacia correlación-causalidad."},{"id":"pc1-t032","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p108","enunciado":"¿Por qué la historia del copernicanismo plantea un problema al falsacionismo?","opciones":["Porque fue racional mantener la teoría aunque chocaba con la evidencia disponible en 1543.","Porque Copérnico logró verificar su teoría de manera concluyente ya en el año 1543.","Porque el copernicanismo jamás formuló predicciones que pudieran contrastarse empíricamente."],"correcta":0,"explicacion":"Según un falsacionismo estricto, la teoría debió abandonarse al chocar con la evidencia; sin embargo, mantenerla resultó fructífero hasta que la nueva física de Galileo y Newton la respaldó siglo y medio después."},{"id":"pc1-t033","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p108","enunciado":"¿Cómo puede responder un falsacionista al caso de la astronomía copernicana?","opciones":["Las falsaciones afectaban a hipótesis auxiliares, como la física aristotélica, no al núcleo copernicano.","Los astrónomos de la época carecían de todo dato, por lo que no hubo verdadera falsación.","El copernicanismo era en realidad infalsable, y por eso nunca pudo quedar refutado."],"correcta":0,"explicacion":"Por el holismo de la contrastación, la evidencia adversa refutaba el conjunto de teoría más auxiliares (física y óptica de la época), no la hipótesis heliocéntrica aislada. Kuhn, en cambio, lo describe como revolución entre paradigmas."},{"id":"pc1-t034","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p109","enunciado":"Según Duhem, ¿por qué no puede someterse a prueba experimental una hipótesis aislada?","opciones":["Porque las predicciones se deducen de la hipótesis junto con auxiliares y supuestos de fondo.","Porque toda hipótesis aislada carece de contenido empírico hasta integrarse en una teoría verificada.","Porque los instrumentos de medición introducen errores que impiden cualquier contrastación fiable."],"correcta":0,"explicacion":"Si la predicción falla, la lógica solo dice que algo del conjunto es falso, sin señalar qué componente debe modificarse. No es un problema de falta de contenido empírico ni de error instrumental."},{"id":"pc1-t035","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p109","enunciado":"Frente al desafío de Duhem, la respuesta popperiana consiste en:","opciones":["Prohibir las estratagemas ad hoc: los ajustes deben ser contrastables independientemente.","Aceptar que ninguna hipótesis puede quedar refutada y abandonar el proyecto falsacionista.","Negar que en la contrastación de las teorías físicas intervengan hipótesis auxiliares."],"correcta":0,"explicacion":"Las modificaciones del sistema deben aumentar el contenido empírico y poder contrastarse por separado. Lakatos sistematiza esta salida con sus programas de investigación (núcleo firme y cinturón protector)."},{"id":"pc1-t036","tema":"Tema 1: ¿Qué es la ciencia?","fuente":"pregunta:pc1-p110","enunciado":"¿Cómo defendió Galileo la fiabilidad de sus observaciones telescópicas de las lunas de Júpiter?","opciones":["Mostrando su consistencia y repetibilidad, y con predicciones exitosas confirmadas independientemente.","Apelando a su prestigio personal como matemático de la corte de los Médici en Florencia.","Demostrando matemáticamente que un telescopio no puede producir ninguna imagen ilusoria."],"correcta":0,"explicacion":"Argumentó que las lunas aparecían solo junto a Júpiter (no eran artefacto del aparato) y predijo con éxito sus posiciones y eclipses; incluso observadores contrarios a Copérnico, como los del Collegio Romano, confirmaron los datos."},{"id":"pc1-t037","tema":"Tema 1: ¿Qué es la ciencia?","fuente":"pregunta:pc1-p110","enunciado":"¿Qué relevancia teórica tenían las lunas de Júpiter en el debate copernicano?","opciones":["Desmontaban la objeción de que la Tierra, si se moviera, tendría que 'perder' a la Luna.","Demostraban de manera concluyente que la Tierra gira en órbita alrededor del Sol.","Probaban que todos los planetas del sistema solar poseen sus propios satélites."],"correcta":0,"explicacion":"Júpiter se mueve arrastrando consigo a sus lunas, lo que neutraliza esa objeción antigua contra el movimiento terrestre. Era evidencia favorable al copernicanismo, no una verificación concluyente del heliocentrismo."},{"id":"pc1-t038","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p111","enunciado":"¿Por qué no suelen ser posibles los experimentos controlados en estudios sobre bienestar infantil?","opciones":["Por razones éticas y prácticas: no cabe asignar aleatoriamente a los bebés a cada condición.","Porque los efectos sobre el bienestar infantil son demasiado pequeños para poder medirse.","Porque las familias participantes falsean de forma sistemática los datos que proporcionan."],"correcta":0,"explicacion":"No es éticamente aceptable imponer al azar lactancia materna o de fórmula. Por eso se recurre a diseños observacionales, con el consiguiente riesgo de sesgos de autoselección."},{"id":"pc1-t039","tema":"Tema 2: Los límites de lo científico","fuente":"pregunta:pc1-p111","enunciado":"En los estudios sobre lactancia, ¿qué significa que las madres se 'autoseleccionan'?","opciones":["Que quienes optan por la lactancia difieren ya en recursos e información, lo que explica parte de la ventaja.","Que las madres deciden libremente si participan o no en el ensayo clínico aleatorizado propuesto.","Que los investigadores seleccionan deliberadamente a las madres que confirman su hipótesis inicial."],"correcta":0,"explicacion":"Al no haber asignación aleatoria, los grupos comparados difieren de partida: esas características previas, y no solo la leche, explican parte de la asociación observada. No es fraude del investigador ni cuestión de consentimiento."}]}];
</script>
<script>
'use strict';
/* ================= César el filósofo — lógica ================= */

/* ---- colores por asignatura (validados light/dark) ---- */
const COLORS = {
  etica1:        {l:'#eb6834', d:'#d95926'},
  conocimiento1: {l:'#2a78d6', d:'#3987e5'},
  antigua1:      {l:'#1baf7a', d:'#199e70'},
  antropologia1: {l:'#e87ba4', d:'#d55181'},
  pensamiento:   {l:'#4a3aa7', d:'#9085e9'}
};
const ICONS = {etica1:'⚖️', conocimiento1:'🧠', antigua1:'🏺', antropologia1:'🌍', pensamiento:'🔬'};

const QUOTES = [
  ['Una vida sin examen no merece ser vivida.','Sócrates'],
  ['Somos lo que hacemos repetidamente. La excelencia no es un acto, es un hábito.','Aristóteles'],
  ['Conócete a ti mismo.','Oráculo de Delfos'],
  ['El sabio no dice todo lo que piensa, pero siempre piensa todo lo que dice.','Aristóteles'],
  ['No hay viento favorable para el que no sabe a qué puerto va.','Séneca'],
  ['La paciencia es amarga, pero su fruto es dulce.','Rousseau'],
  ['Actúa solo según aquella máxima por la cual puedas querer que se convierta en ley universal.','Kant'],
  ['El asombro es el origen de la filosofía.','Platón'],
  ['Nada es suficiente para quien lo suficiente es poco.','Epicuro'],
  ['Ten el valor de servirte de tu propio entendimiento.','Kant'],
  ['El carácter del hombre es su destino.','Heráclito'],
  ['Aprender sin reflexionar es malgastar la energía.','Confucio'],
  ['La duda es uno de los nombres de la inteligencia.','Borges'],
  ['Lo que no se recuerda, no se sabe.','César el filósofo'],
  ['Poco a poco se llega lejos: la constancia vence al talento.','Proverbio estoico']
];

const LEVELS = [
  [0,'Aprendiz'],[120,'Discípulo'],[300,'Sofista'],[600,'Dialéctico'],
  [1000,'Peripatético'],[1600,'Académico'],[2400,'Estoico'],[3400,'Maestro'],
  [4800,'Sabio'],[6500,'César el filósofo']
];

/* ---------------- estado + persistencia ---------------- */
const SKEY='cesarFilosofo.v1';
let memOnly=false;
function freshState(){return {xp:0, streak:{n:0,last:''}, cards:{}, qs:{}, mcq:{}, prefs:{theme:'auto', scope:DATA.map(s=>s.id), testScope:DATA.map(s=>s.id), sim:null, tema:''}, today:{day:'',xp:0}};}
let S=freshState();
function load(){
  try{const r=localStorage.getItem(SKEY); if(r){const p=JSON.parse(r); S=Object.assign(freshState(),p); S.prefs=Object.assign(freshState().prefs,p.prefs||{});}}
  catch(e){memOnly=true;}
}
function save(){ try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){memOnly=true;} }
function today(){return new Date().toISOString().slice(0,10);}
function yesterday(){const d=new Date(); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10);}

/* ---------------- utilidades ---------------- */
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isDark(){ const t=S.prefs.theme; if(t==='dark')return true; if(t==='light')return false; return matchMedia('(prefers-color-scheme: dark)').matches; }
function col(id){ const c=COLORS[id]||{l:'#898781',d:'#898781'}; return isDark()?c.d:c.l; }
function subj(id){ return DATA.find(s=>s.id===id); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),2500); }
function levelOf(xp){ let i=0; for(let k=0;k<LEVELS.length;k++) if(xp>=LEVELS[k][0]) i=k; return i; }

function gainXP(n,quiet){
  const before=levelOf(S.xp);
  S.xp+=n;
  const d=today();
  if(S.today.day!==d){S.today={day:d,xp:0};}
  S.today.xp+=n;
  if(S.streak.last!==d){
    S.streak.n = (S.streak.last===yesterday()) ? S.streak.n+1 : 1;
    S.streak.last=d;
    if(S.streak.n>1) toast('🔥 Racha: '+S.streak.n+' días');
  }
  const after=levelOf(S.xp);
  if(!quiet) toast('✦ +'+n+' XP');
  if(after>before) setTimeout(()=>toast('🏛️ Nivel '+(after+1)+': '+LEVELS[after][1]),500);
  save(); renderHeader();
}

/* dominio: cards → box 0..3 ; preguntas → level 0..3 */
function cardBox(id){ return (S.cards[id]&&S.cards[id].b)||0; }
function qLevel(id){ return (S.qs[id]&&S.qs[id].l)||0; }
function masteryCards(ids){ let t=0,g=0; ids.forEach(sid=>{ subj(sid).cards.forEach(c=>{t+=3; g+=cardBox(c.id);}); }); return t? g/t : 0; }
function masteryQs(ids){ let t=0,g=0; ids.forEach(sid=>{ subj(sid).preguntas.forEach(p=>{t+=3; g+=qLevel(p.id);}); }); return t? g/t : 0; }
const pct=x=>Math.round(x*100)+'%';

/* ---------------- banco de tests ---------------- */
const TESTS={};
DATA.forEach(s=>{
  const arr=[];
  (s.mcqs||[]).forEach(m=>arr.push(Object.assign({sid:s.id},m)));
  s.preguntas.filter(p=>p.tipo==='test'&&p.opciones).forEach(p=>arr.push({id:p.id,sid:s.id,tema:p.tema,enunciado:p.enunciado,opciones:p.opciones.map(o=>o.replace(/^[a-e]\)\s*/i,'')),correcta:p.correcta,explicacion:p.explicacion||'',real:true}));
  TESTS[s.id]=arr;
});
function masteryTest(ids){ let t=0,g=0; ids.forEach(sid=>{ TESTS[sid].forEach(m=>{t+=3; const st=S.mcq[m.id]; g+=(st&&st.l)||0;}); }); return t? g/t : 0; }
function failCount(ids){ let n=0; ids.forEach(sid=>TESTS[sid].forEach(m=>{ const st=S.mcq[m.id]; if(st&&st.f>0&&(st.l||0)<3) n++; })); return n; }

/* ---------------- header / tema ---------------- */
function applyTheme(){ document.documentElement.setAttribute('data-theme', isDark()?'dark':'light'); }
function renderHeader(){
  $('#streakv').textContent=(S.streak.last===today()||S.streak.last===yesterday())?S.streak.n:0;
  $('#xpv').textContent=S.xp;
}

/* ---------------- navegación ---------------- */
let cur='inicio';
function show(s){
  cur=s;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.s===s));

function tpool(mode){
  let p=[];
  S.prefs.testScope.forEach(sid=>{ p=p.concat(TESTS[sid]); });
  if(mode==='fallos') p=p.filter(m=>{ const st=S.mcq[m.id]; return st&&st.f>0&&(st.l||0)<3; });
  return p;
}
function wOf(m){ const st=S.mcq[m.id]; if(!st) return 8; return [10,5,2,1][st.l||0]*(1+Math.min(st.f||0,2)); }
function samplePool(p,n){
  const out=[]; let items=p.slice();
  for(let k=0;k<n&&items.length;k++){
    const W=items.map(wOf); let sum=W.reduce((x,y)=>x+y,0), r=Math.random()*sum, pick=items.length-1;
    for(let i=0;i<items.length;i++){ r-=W[i]; if(r<=0){pick=i;break;} }
    out.push(items[pick]); items.splice(pick,1);
  }
  return out;
}
function startTest(mode){
  const p=tpool(mode);
  if(!p.length){ toast(mode==='fallos'?'🎉 No tienes fallos pendientes':'No hay preguntas en esta selección'); return; }
  TQ={mode, queue: samplePool(p, mode==='t20'?Math.min(20,p.length):Math.min(8,p.length)), idx:0, ok:0, ko:0, fallos:[], answered:false, cur:null, n:0, perm:null};

  </div>

    <div class="qbadges">
      <span class="ftag" style="--c:${c}"><span class="dot" style="background:${c};width:9px;height:9px;border-radius:50%;display:inline-block"></span> ${esc(s.nombreCorto)}</span>
      ${m.real?`<span class="badge realq">📜 pregunta real de examen</span>`:''}
      ${m.tema?`<span class="badge">${esc(m.tema)}</span>`:''}
      <span class="badge" title="Tu nivel en esta pregunta">${'●'.repeat(lv)||'○'}${'○'.repeat(Math.max(0,3-lv))}</span>
    </div>

    <div class="opts">${perm.map((oi,vi)=>`<button class="opt" data-vi="${vi}" onclick="answerMcq(${vi})">${vi+1}. ${esc(m.opciones[oi])}</button>`).join('')}</div>
    <div class="expl" id="texpl"></div>

  </div>
