'tercer hombre'; la semejanza entre Idea y cosas exige otra Idea, regreso al infinito.","x":"Si hombre e Idea de Hombre se parecen, necesitan un tercer término que funde su semejanza, y así indefinidamente."},{"b":"Aporías de la participación: la Idea una no puede estar toda entera, ni por partes, en muchas cosas."},{"b":"¿De qué hay Ideas? Problema de las Ideas de cosas viles (barro, pelo) o de negaciones."},{"b":"El propio Platón autocritica la teoría en el Parménides y la revisa mediante la dialéctica de los géneros supremos."}]},{"id":"tc1-p10","tipo":"desarrollo","enunciado":"La lógica en el estoicismo","variantes":["La Lógica en el estoicismo","La lógica en el Estoicismo"],"apariciones":["2022 Feb-1","2022 Sep","2024 Feb-1","2025 Feb-2","2025 Sep"],"frecuencia":5,"tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","bullets":[{"b":"La lógica es una de las tres partes de la filosofía, junto a física y ética; estudia el logos.","x":"En el helenismo el saber se instrumentaliza: la lógica sirve, en último término, a la ética, al ideal de vida del sabio."},{"b":"Comprende retórica y dialéctica; la dialéctica incluye la teoría del conocimiento y la lógica formal."},{"b":"Teoría del conocimiento: la representación comprensiva (phantasía katalēptikē) más el asentimiento (synkatáthesis) dan la aprehensión verdadera.","x":"La representación comprensiva se impone con evidencia irresistible y garantiza proceder del objeto real: es el criterio estoico de verdad."},{"b":"Doctrina de los lektá (significados, 'expresables'): incorporales que median entre el signo y la cosa.","x":"Frente al corporeísmo general estoico, los significados no son cuerpos: son lo que entendemos cuando comprendemos un enunciado."},{"b":"Crean la lógica proposicional: inferencias entre enunciados completos (axiómata), frente a la silogística aristotélica de términos."},{"b":"Cinco argumentos indemostrables como esquemas básicos válidos: modus ponens, modus tollens, silogismos disyuntivos, etc."}]},{"id":"tc1-p11","tipo":"desarrollo","enunciado":"La teoría kantiana de las categorías","variantes":[],"apariciones":["2020 Feb-2","2022 Sep","2024 Feb-2","2025 Feb-1","2026 Feb-1"],"frecuencia":5,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Categorías: conceptos puros del entendimiento, formas a priori con que pensamos y unificamos lo dado en la intuición.","x":"Se estudian en la Analítica trascendental. Sin ellas lo sensible sería un caos sin objetos: 'las intuiciones sin conceptos son ciegas'."},{"b":"Deducción metafísica: las doce categorías se obtienen de las doce formas posibles del juicio de la lógica.","x":"Si juzgar es la operación propia del entendimiento, cada forma de juicio revela un concepto puro correspondiente."},{"b":"Cuatro grupos de tres: cantidad, cualidad, relación (substancia, causalidad, comunidad) y modalidad."},{"b":"Deducción trascendental: legitima aplicar categorías a fenómenos; la unidad de apercepción ('yo pienso') las fundamenta.","x":"Todo objeto de experiencia debe someterse a las condiciones de unidad de la conciencia; por eso las categorías valen objetivamente."},{"b":"Esquematismo: el tiempo, forma común a sensibilidad y entendimiento, media para aplicar cada categoría a los fenómenos."},{"b":"Límite: solo valen dentro de la experiencia posible; aplicadas a cosas en sí producen ilusión dialéctica."},{"b":"Frente a Aristóteles, no son géneros del ser; frente a Hume, la causalidad recobra necesidad como condición a priori."}]},{"id":"tc1-p12","tipo":"desarrollo","enunciado":"La doctrina aristotélica de la abstracción","variantes":["La teoría aristotélica de la abstracción","Abstracción y concepto en Aristóteles"],"apariciones":["2022 Feb-1","2023 Feb-1","2024 Feb-2","2024 Sep"],"frecuencia":4,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"Punto de partida empirista: todo conocimiento comienza en los sentidos; no hay Ideas innatas ni reminiscencia.","x":"Contra Platón: el alma es al nacer como una tablilla en la que nada está escrito; lo inteligible se extrae de lo sensible."},{"b":"Grados del conocer: sensación, imaginación (phantasma), memoria y experiencia; de lo particular hacia lo universal."},{"b":"Abstracción: el entendimiento extrae la forma universal de las imágenes sensibles, prescindiendo de la materia individual.","x":"La esencia está realmente en la cosa individual; la mente la separa (abs-trahere) de las condiciones materiales que la individualizan."},{"b":"Entendimiento agente: ilumina el phantasma y actualiza lo inteligible en potencia; el entendimiento paciente recibe el concepto.","x":"Como la luz hace visibles los colores, el intelecto agente hace inteligible en acto lo que en la imagen sensible es inteligible solo en potencia."},{"b":"El universal no existe separado (contra Platón): existe en las cosas y solo es universal en la mente."},{"b":"Resultado: el concepto y la definición de la esencia, base del juicio y de la ciencia demostrativa."}]},{"id":"tc1-p13","tipo":"desarrollo","enunciado":"El realismo moderado en la controversia medieval de los universales","variantes":["El realismo moderado en la Edad Media","La controversia medieval de los universales: el realismo moderado","El realismo moderado en el problema medieval de los universales"],"apariciones":["2020 Feb-1","2022 Feb-1","2023 Feb-2","2026 Feb-1"],"frecuencia":4,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Tesis: los universales tienen fundamento real en las cosas, pero solo existen como universales en la mente.","x":"Vía media entre el realismo extremo (universales subsistentes) y el nominalismo (universales como meros nombres)."},{"b":"Solución de inspiración aristotélica: la esencia existe individualizada en cada cosa y se universaliza por abstracción."},{"b":"Abelardo prepara la vía: el universal no es una res sino un sermo con significado fundado en el 'status' común.","x":"Contra su maestro Guillermo de Champeaux: no hay esencia idéntica en todos los individuos, pero el nombre universal no es arbitrario, se apoya en su condición común."},{"b":"Tomás de Aquino, formulación clásica: triple estado del universal, ante rem (mente divina), in re (en los individuos), post rem (concepto abstraído).","x":"Integra platonismo cristiano (ejemplares divinos) y aristotelismo (formas inmanentes, abstracción): es la síntesis escolástica madura."},{"b":"Es un concepto 'cum fundamento in re': la predicación universal es verdadera de los individuos reales."},{"b":"Garantiza la ciencia y evita tanto la duplicación platónica del mundo como el vaciamiento nominalista del concepto."}]},{"id":"tc1-p14","tipo":"desarrollo","enunciado":"El fundamento del conocimiento en Descartes","variantes":["Descartes y el fundamento del conocimiento"],"apariciones":["2022 Feb-2","2023 Feb-2","2025 Feb-2","2026 Feb-2"],"frecuencia":4,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"Proyecto: fundamentar todo el saber sobre una certeza absoluta, al modo matemático; contra el escepticismo.","x":"Descartes busca un punto arquimédico inconmovible del que deducir ordenadamente el edificio entero de la ciencia."},{"b":"Instrumento: la duda metódica, universal e hiperbólica; se rechaza cuanto admita la mínima incertidumbre."},{"b":"Tres niveles de duda: engaños de los sentidos, indistinción sueño/vigilia, hipótesis del genio maligno."},{"b":"Primera certeza: 'cogito, ergo sum'; dudar es pensar, y pensar exige existir; verdad indudable e inmediata.","x":"Ni el engañador más poderoso puede hacer que yo no exista mientras pienso: la duda misma se convierte en prueba."},{"b":"El cogito da el criterio de verdad: es verdadero cuanto se percibe con igual claridad y distinción."},{"b":"Dios veraz, demostrado desde la idea innata de infinito, garantiza la validez del criterio y del mundo exterior.","x":"Sin la veracidad divina, la certeza quedaría encerrada en el instante del cogito; Dios funda la ciencia estable y la realidad extramental."},{"b":"Resultado: el fundamento se traslada al sujeto pensante; giro moderno hacia la filosofía de la conciencia."}]},{"id":"tc1-p15","tipo":"desarrollo","enunciado":"La crítica de Aristóteles a Platón","variantes":["La crítica aristotélica a Platón","Aspectos de la crítica de Aristóteles a Platón"],"apariciones":["2022 Feb-2","2023 Feb-2","2026 Feb-1"],"frecuencia":3,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"Blanco central: la separación (chorismós); la esencia no puede existir fuera de aquello de lo que es esencia.","x":"Es contradictorio que la substancia de una cosa exista separada de la cosa misma: la forma es inmanente al individuo."},{"b":"Las Ideas duplican inútilmente el mundo sensible sin explicarlo: son 'un doblarlo todo'."},{"b":"'Participación' e 'imitación' son metáforas poéticas vacías, sin auténtico valor explicativo."},{"b":"Argumento del tercer hombre: la semejanza entre individuo e Idea exige un tercer término, regreso al infinito."},{"b":"Las Ideas, inmóviles y eternas, no pueden explicar el movimiento, la generación ni la corrupción sensibles.","x":"Aristóteles explicará el devenir con sus propios principios: materia y forma, potencia y acto, las cuatro causas."},{"b":"Alternativa aristotélica: el universal existe en las cosas como forma y se conoce por abstracción, no por reminiscencia."}]},{"id":"tc1-p16","tipo":"desarrollo","enunciado":"El realismo extremo en la controversia medieval de los universales","variantes":["El realismo extremo en la controversia de los universales","La controversia medieval de los universales: el realismo extremo"],"apariciones":["2024 Feb-1","2024 Sep","2025 Feb-1"],"frecuencia":3,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Tesis: los universales son cosas (res) que existen realmente antes e independientemente de los individuos: universalia ante rem.","x":"Cuanto más universal, más real: los géneros y especies poseen mayor entidad que los individuos que los ejemplifican."},{"b":"Herencia platónico-agustiniana: las esencias subsisten como ejemplares, señaladamente en la mente divina."},{"b":"Representantes: Escoto Eriúgena, Anselmo de Canterbury, Guillermo de Champeaux."},{"b":"Champeaux: la misma esencia está toda entera e idéntica en cada individuo; estos solo difieren por accidentes."},{"b":"Crítica de Abelardo: si la esencia fuese idéntica en todos, la misma cosa recibiría predicados contrarios (Sócrates y Platón, aquí y allí).","x":"Ante la objeción, Champeaux se retractó hacia la tesis más débil de la mera indiferencia entre individuos."},{"b":"Servía a la teología (pecado original, Trinidad como esencia común) pero rozaba el panteísmo; por eso fue abandonado."}]},{"id":"tc1-p17","tipo":"desarrollo","enunciado":"La primera verdad en la metafísica de Descartes (el cogito)","variantes":["La primera verdad en la Metafísica de Descartes","El primer conocimiento verdadero en Descartes"],"apariciones":["2020 Feb-1","2024 Feb-2","2026 Feb-1"],"frecuencia":3,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"Tras la duda universal, emerge la primera verdad: 'pienso, luego existo' (cogito, ergo sum).","x":"Aparece en el Discurso del método y en la Segunda Meditación como el primer principio de la filosofía buscada."},{"b":"Es absolutamente indudable: incluso el genio maligno, para engañarme, necesita que yo exista mientras pienso."},{"b":"No es un silogismo sino una intuición inmediata: evidencia directa de la razón, no deducción desde premisas.","x":"Si fuera un razonamiento necesitaría la premisa 'todo lo que piensa existe', más dudosa que la propia certeza inmediata del yo."},{"b":"Descubre la naturaleza del yo: res cogitans, substancia pensante, distinta e independiente del cuerpo."},{"b":"Su forma de evidencia (claridad y distinción) se erige en criterio general de toda verdad."},{"b":"Función arquitectónica: es el cimiento desde el cual se reconstruye el saber (Dios, mundo, ciencia)."}]},{"id":"tc1-p18","tipo":"desarrollo","enunciado":"El método de la ciencia en Descartes (razón y método)","variantes":["El método de la ciencia en Descartes","Razón y método en Descartes"],"apariciones":["2020 Feb-2","2022 Sep","2025 Feb-1"],"frecuencia":3,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"La razón es única e igual en todos; por eso hay una sola ciencia y debe haber un solo método.","x":"Frente a la dispersión escolástica de saberes, Descartes concibe la sabiduría universal como una única razón aplicada a objetos diversos (mathesis universalis)."},{"b":"Modelo: las matemáticas, únicas ciencias que han alcanzado certeza mediante cadenas de razones evidentes."},{"b":"Dos operaciones básicas de la mente: intuición (captación inmediata y evidente) y deducción (encadenamiento de intuiciones)."},{"b":"Regla 1, evidencia: no admitir como verdadero sino lo que se presente claro y distinto."},{"b":"Regla 2, análisis: dividir cada dificultad en cuantas partes simples sea posible."},{"b":"Regla 3, síntesis: ascender con orden de lo más simple a lo más complejo; Regla 4, enumeración: revisiones completas que aseguren no omitir nada."},{"b":"El método sustituye a la silogística escolástica, que solo expone lo sabido y no descubre verdades nuevas."}]},{"id":"tc1-p19","tipo":"desarrollo","enunciado":"Los juicios sintéticos a priori en Kant","variantes":["La doctrina kantiana de los juicios sintéticos a priori"],"apariciones":["2022 Feb-1","2023 Feb-1","2026 Feb-2"],"frecuencia":3,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Juicios analíticos: el predicado está contenido en el sujeto; a priori, necesarios, pero no amplían el conocimiento.","x":"Ejemplo: 'todos los cuerpos son extensos'. Solo explicitan lo ya pensado en el concepto; su verdad se funda en el principio de no contradicción."},{"b":"Juicios sintéticos a posteriori: amplían el conocimiento, pero son contingentes, sin universalidad ni necesidad."},{"b":"Juicios sintéticos a priori: amplían el conocimiento y son universales y necesarios; en ellos se funda la ciencia.","x":"Combinan las ventajas de ambos tipos: extienden el saber (síntesis) con validez estricta (a priori), independiente de la experiencia."},{"b":"Ejemplos kantianos: '7+5=12', 'la recta es la distancia más corta entre dos puntos', 'todo cambio tiene una causa'."},{"b":"Pregunta central de la Crítica: ¿cómo son posibles los juicios sintéticos a priori?"},{"b":"Respuesta: por las formas a priori del sujeto; espacio y tiempo (matemática), categorías (física pura); imposibles en la metafísica trascendente."}]},{"id":"tc1-p20","tipo":"desarrollo","enunciado":"¿Qué es, en Platón, una 'Idea'? (la doctrina platónica de las Ideas)","variantes":["La doctrina platónica de las Ideas"],"apariciones":["2020 Feb-2","2022 Feb-1"],"frecuencia":2,"tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","bullets":[{"b":"La Idea es la esencia universal y objetiva de las cosas: lo que algo verdaderamente es.","x":"El eîdos responde a la pregunta socrática '¿qué es X?': lo justo en sí, lo bello en sí, más allá de casos particulares."},{"b":"Caracteres: única, eterna, inmutable, inteligible, existente en sí y separada del mundo sensible."},{"b":"No es un contenido mental ni un concepto: es una realidad subsistente, el verdadero ser."},{"b":"Origen doble: las definiciones universales de Sócrates y el ser inmutable de Parménides frente al flujo de Heráclito.","x":"Platón salva la ciencia situando lo estable exigido por el saber fuera del mundo sensible en devenir."},{"b":"Las Ideas se jerarquizan y culminan en la Idea del Bien, fundamento del ser y del conocer (símil del Sol)."},{"b":"Correlación ontológico-epistemológica: solo de las Ideas hay ciencia (episteme); de lo sensible, opinión (doxa)."}]},{"id":"tc1-p21","tipo":"desarrollo","enunciado":"Principios y causas del ente en Aristóteles","variantes":[],"apariciones":["2025 Feb-2","2026 Feb-2"],"frecuencia":2,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"La filosofía primera estudia el ente en cuanto ente y sus principios y causas primeras.","x":"Conocer científicamente es, para Aristóteles, conocer por causas: saber por qué algo es y no puede ser de otra manera."},{"b":"La substancia, sentido primero del ser, es compuesto hilemórfico: materia (indeterminada) y forma (esencia determinante)."},{"b":"Acto y potencia explican el devenir: el cambio es el paso de la potencia al acto.","x":"Así se responde a Parménides: el ser en potencia permite que algo llegue a ser sin surgir de la nada."},{"b":"Cuatro causas: material (de qué), formal (qué es), eficiente (por qué agente), final (para qué)."},{"b":"La serie causal culmina en el Primer Motor inmóvil: acto puro que mueve como causa final."},{"b":"Estos principios fundan la ciencia: demostración necesaria de las propiedades desde la esencia y sus causas."}]},{"id":"tc1-p22","tipo":"desarrollo","enunciado":"La teoría de las categorías en el Estoicismo","variantes":["Las categorías en el estoicismo"],"apariciones":["2020 Feb-1","2026 Feb-1"],"frecuencia":2,"tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","bullets":[{"b":"Frente a las diez categorías aristotélicas, los estoicos las reducen a cuatro.","x":"La simplificación responde a su ontología corporeísta y nominalista: no hay géneros del ser separados ni esencias universales reales."},{"b":"Son: substrato (hypokeímenon), cualidad (poión), modo de ser (pōs échon) y modo de ser relativo (prós ti pōs échon)."},{"b":"No clasifican géneros distintos del ser: son aspectos progresivamente determinados del mismo cuerpo individual."},{"b":"Estructura anidada: cada categoría incluye y determina la anterior, del sustrato indeterminado a la relación.","x":"A diferencia de la tabla aristotélica, coordinada, la estoica es una serie de determinaciones crecientes del individuo concreto."},{"b":"Corporeísmo: solo los cuerpos existen y actúan; las categorías describen lo real individual, no esencias."},{"b":"Nominalismo estoico: lo universal es solo concepto (ennóēma), sin realidad propia; anticipa debates medievales."}]},{"id":"tc1-p23","tipo":"desarrollo","enunciado":"El concepto de 'razón' en la metafísica de Descartes","variantes":["El concepto de 'razón' de Descartes"],"apariciones":["2023 Feb-1","2023 Sep"],"frecuencia":2,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"La razón o 'buen sentido' es única e igual en todos los hombres; solo difiere su uso.","x":"Así comienza el Discurso del método: la diversidad de opiniones no prueba desigualdad de razón, sino diferencia de método."},{"b":"Es la facultad de distinguir lo verdadero de lo falso: la 'luz natural'."},{"b":"Opera de dos modos: intuición de naturalezas simples y deducción que encadena evidencias."},{"b":"Es autónoma: no depende de los sentidos, la tradición ni la autoridad; fuente de conocimiento a priori.","x":"Este es el núcleo del racionalismo: la razón basta, por sí sola y bien conducida, para alcanzar la verdad."},{"b":"Contiene ideas innatas (pensamiento, Dios, extensión, verdades matemáticas) sobre las que se funda la ciencia."},{"b":"De su unidad se sigue la unidad del saber: todas las ciencias son la misma razón aplicada a objetos distintos."}]},{"id":"tc1-p24","tipo":"desarrollo","enunciado":"Las ideas innatas en el racionalismo de Descartes (el innatismo)","variantes":["El innatismo de Descartes"],"apariciones":["2022 Feb-1","2024 Sep"],"frecuencia":2,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"Tres clases de ideas: adventicias (venidas de fuera), facticias (construidas por mí) e innatas (nacidas con la mente).","x":"Las adventicias y facticias son dudosas o arbitrarias; solo las innatas ofrecen la evidencia requerida por la ciencia."},{"b":"Las innatas no proceden de la experiencia: la razón las contiene en sí, como disposiciones naturales."},{"b":"Ejemplos: el yo pensante, Dios (lo infinito y perfecto), la extensión, las verdades matemáticas y lógicas."},{"b":"La idea de infinito no puede proceder de un yo finito: prueba de Dios, 'marca del artífice' en la criatura.","x":"Es el argumento de la Tercera Meditación: la causa de una idea debe tener tanta realidad como lo representado en ella."},{"b":"Sobre las ideas innatas claras y distintas se levanta deductivamente el edificio del saber: núcleo del racionalismo."},{"b":"Blanco de la crítica empirista: Locke negará todo innatismo; la mente como 'papel en blanco'."}]},{"id":"tc1-p25","tipo":"desarrollo","enunciado":"Duda y certeza en Descartes","variantes":[],"apariciones":["2024 Feb-1","2025 Sep"],"frecuencia":2,"tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","bullets":[{"b":"La duda cartesiana es metódica y provisional, no escéptica: es un instrumento para hallar lo indudable.","x":"El escéptico duda para instalarse en la duda; Descartes duda para superarla y fundar la certeza."},{"b":"Es universal e hiperbólica: basta la mínima posibilidad de error para suspender el asentimiento."},{"b":"Tres momentos: falacias de los sentidos, indistinción entre sueño y vigilia, hipótesis del genio maligno.","x":"El genio maligno extiende la duda incluso a las matemáticas: un poder engañador podría falsear hasta las evidencias más simples."},{"b":"En el límite de la duda surge la certeza primera: 'cogito, ergo sum'; dudar es pensar y pensar es existir."},{"b":"Del cogito se extrae el criterio de certeza: es verdadero todo lo percibido con claridad y distinción."},{"b":"La veracidad de Dios, demostrada después, elimina el genio maligno y estabiliza la certeza de la ciencia."}]},{"id":"tc1-p26","tipo":"desarrollo","enunciado":"Hume y la crítica del Yo substancial","variantes":[],"apariciones":["2020 Feb-1","2023 Sep"],"frecuencia":2,"tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","bullets":[{"b":"Aplicación del principio de copia: no existe impresión constante e invariable de la que derive la idea de 'yo'.","x":"Si el yo fuera una substancia idéntica y continua, debería haber una impresión igualmente idéntica y continua; no la hay."},{"b":"La introspección solo encuentra percepciones particulares y sucesivas: calor o frío, amor u odio, dolor o placer."},{"b":"El yo es 'un haz o colección de percepciones' en flujo y movimiento perpetuos."},{"b":"La mente es como un teatro sin escenario: solo hay percepciones que se suceden, sin soporte substancial."},{"b":"La identidad personal es una ficción de la imaginación: memoria, semejanza y causalidad enlazan las percepciones.","x":"Atribuimos identidad a lo que solo es sucesión relacionada, igual que hacemos con las cosas: es una propensión natural, no un conocimiento."},{"b":"Culmina la disolución empirista de la substancia: tras la material (Berkeley), cae la espiritual cartesiana."}]},{"id":"tc1-p27","tipo":"desarrollo","enunciado":"El problema de la 'cientificidad' de la metafísica en Kant","variantes":[],"apariciones":["2022 Feb-2","2024 Feb-2"],"frecuencia":2,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Pregunta crítica: ¿puede la metafísica ser ciencia, como lo son la matemática y la física?","x":"Mientras las ciencias avanzan con paso seguro, la metafísica es un 'campo de batalla' de disputas interminables; Kant investiga por qué."},{"b":"Condición de toda ciencia: juicios sintéticos a priori aplicables a la experiencia posible."},{"b":"Los objetos metafísicos (alma, mundo como totalidad, Dios) trascienden toda experiencia: ninguna intuición los llena.","x":"Las categorías sin intuición sensible quedan vacías: pensar esos objetos es posible; conocerlos, no."},{"b":"La Dialéctica trascendental documenta el fracaso: paralogismos, antinomias y refutación de las pruebas de Dios."},{"b":"Conclusión: la metafísica dogmática es imposible como ciencia, pero subsiste como disposición natural inevitable de la razón."},{"b":"Queda un uso legítimo: la crítica del conocimiento, el uso regulativo de las Ideas y su valor práctico-moral.","x":"Kant 'suprime el saber para dejar sitio a la fe': Dios, libertad e inmortalidad reaparecen como postulados de la razón práctica."}]},{"id":"tc1-p28","tipo":"desarrollo","enunciado":"La teoría kantiana de los juicios cognoscitivos","variantes":[],"apariciones":["2024 Feb-1","2025 Sep"],"frecuencia":2,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"El conocimiento se expresa en juicios: síntesis de conceptos con pretensión de validez objetiva.","x":"Por eso la pregunta por el conocimiento científico se convierte en la pregunta por la clase de juicios que lo componen."},{"b":"División por el origen: a priori (universales y necesarios, independientes de la experiencia) y a posteriori (empíricos, contingentes)."},{"b":"División por el contenido: analíticos (el predicado está en el sujeto, explicativos) y sintéticos (añaden algo, extensivos)."},{"b":"Los analíticos a priori no amplían el saber; los sintéticos a posteriori lo amplían sin necesidad."},{"b":"La ciencia se funda en los juicios sintéticos a priori: ampliativos y a la vez universales y necesarios."},{"b":"El problema crítico: cómo son posibles; la Estética responde por la matemática, la Analítica por la física pura."}]},{"id":"tc1-p29","tipo":"desarrollo","enunciado":"La relación entre las Ideas y el mundo sensible en Platón","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","bullets":[{"b":"Dualismo ontológico: mundo inteligible de las Ideas (verdadero ser) frente a mundo sensible (devenir, copia)."},{"b":"Formas de relación: participación (méthexis), imitación (mímesis) y presencia (parusía) de las Ideas en las cosas.","x":"Las cosas son bellas por participar de la Belleza o por imitarla como copias de un modelo; Platón usa ambas metáforas."},{"b":"En el Timeo, el Demiurgo ordena el mundo tomando las Ideas como modelos eternos sobre la materia."},{"b":"Símil de la línea: grados de realidad y conocimiento correlativos; eikasía, pístis (doxa), diánoia, nóesis (episteme).","x":"A imágenes y cosas sensibles corresponde opinión; a entes matemáticos e Ideas, ciencia: el conocer copia la estructura del ser."},{"b":"El mundo sensible, intermedio entre ser y no-ser, solo admite opinión, nunca ciencia estricta."},{"b":"La relación es problemática (chorismós): el Parménides expone las aporías de la participación (tercer hombre)."}]},{"id":"tc1-p30","tipo":"desarrollo","enunciado":"El conocimiento a priori en Platón","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","bullets":[{"b":"El conocimiento verdadero no procede de los sentidos: es anterior e independiente de toda experiencia.","x":"Lo sensible, mudable e imperfecto, no puede fundar el saber universal y necesario que exige la ciencia."},{"b":"Su fundamento es la reminiscencia: el alma recuerda las Ideas contempladas antes de nacer."},{"b":"La percepción es solo ocasión que despierta el recuerdo (Fedón: las cosas iguales evocan lo Igual en sí)."},{"b":"Objetos del a priori: las Ideas y las verdades matemáticas, necesarias e inmutables."},{"b":"Su método es la dialéctica: ascenso puramente racional hasta el principio anhipotético, sin apoyo sensible.","x":"A diferencia de la diánoia matemática, que parte de hipótesis y usa figuras, la nóesis dialéctica se mueve solo entre Ideas."},{"b":"Platón inaugura la tradición racionalista e innatista que reaparecerá en Agustín, Descartes y Leibniz."}]},{"id":"tc1-p31","tipo":"desarrollo","enunciado":"La Lógica en Aristóteles","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","bullets":[{"b":"La lógica es el Órganon: instrumento previo de toda ciencia; estudia las formas válidas del pensar.","x":"No es una ciencia más sino la herramienta común: analiza el discurso demostrativo con independencia de su contenido."},{"b":"Elementos: concepto o término (tratado en Categorías), juicio o proposición (De interpretatione), razonamiento (Analíticos)."},{"b":"Centro: el silogismo; de dos premisas con un término medio se sigue necesariamente la conclusión.","x":"Ejemplo canónico: todo hombre es mortal, Sócrates es hombre, luego Sócrates es mortal. La necesidad es formal: depende de la estructura."},{"b":"La ciencia es silogismo demostrativo: parte de premisas verdaderas, primeras, inmediatas y causales (Analíticos segundos)."},{"b":"Los primeros principios (no contradicción, tercero excluido) no se demuestran: se captan por inducción y noûs.","x":"Toda demostración acabaría en regreso infinito si no hubiera principios evidentes captados intelectualmente a partir de la experiencia."},{"b":"Es lógica de términos y clases; los estoicos la complementarán con la lógica de proposiciones."}]},{"id":"tc1-p32","tipo":"desarrollo","enunciado":"La teoría del juicio en el Estoicismo","variantes":[],"apariciones":["2020 Feb-2"],"frecuencia":1,"tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","bullets":[{"b":"El juicio es el asentimiento (synkatáthesis) que la razón otorga a una representación (phantasía).","x":"Conocer no es solo recibir representaciones sino aprobarlas: el juicio añade el acto voluntario del asentimiento."},{"b":"Criterio de verdad: la representación comprensiva (phantasía katalēptikē), que se impone con evidencia y garantiza su origen real."},{"b":"El asentimiento es libre y voluntario: el error consiste en asentir a representaciones no comprensivas.","x":"De ahí la dimensión moral del conocimiento estoico: el sabio disciplina su asentimiento y no opina jamás."},{"b":"El contenido del juicio es un lektón completo: el axíoma o proposición, portador de verdad o falsedad."},{"b":"La ciencia es un sistema de aprehensiones (katálēpsis) firmes e inconmovibles ante la razón: propia del sabio."},{"b":"Frente a ellos, el escepticismo académico niega que exista representación comprensiva y recomienda suspender el juicio (epoché)."}]},{"id":"tc1-p33","tipo":"desarrollo","enunciado":"La doctrina de la 'iluminación' en San Agustín","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","bullets":[{"b":"Problema: cómo una mente mudable y finita conoce verdades eternas, necesarias e inmutables (matemáticas, morales).","x":"Ni los sentidos ni la mente cambiante pueden ser su origen: las verdades eternas superan a su poseedor."},{"b":"Solución: Dios ilumina la mente humana; vemos las verdades eternas en la luz divina, como el ojo ve en la luz del sol."},{"b":"Transformación cristiana del platonismo: las Ideas son ejemplares eternos en la mente de Dios.","x":"Agustín acoge la teoría de las Ideas pero les niega subsistencia autónoma: son los pensamientos creadores divinos."},{"b":"Sustituye la reminiscencia platónica: no hay preexistencia del alma; hay iluminación presente del Maestro interior."},{"b":"Camino de interiorización: 'no salgas fuera, vuelve a ti; en el interior del hombre habita la verdad'."},{"b":"Marco de fe y razón unidas: 'cree para entender, entiende para creer'; conocer es ascender hacia Dios."}]},{"id":"tc1-p34","tipo":"desarrollo","enunciado":"Adaptaciones del platonismo y el aristotelismo en la teología medieval","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","bullets":[{"b":"La teología medieval piensa la fe con los instrumentos conceptuales griegos, adaptados al dogma cristiano.","x":"La filosofía griega proporciona el vocabulario y las estructuras; la revelación impone correcciones decisivas en su contenido."},{"b":"Vía platónico-agustiniana (Patrística, alta Edad Media): las Ideas pasan a ser ejemplares en la mente divina; iluminación en lugar de reminiscencia."},{"b":"El neoplatonismo aporta el esquema de emanación y retorno, reinterpretado como creación y salvación (Eriúgena, Anselmo)."},{"b":"Siglo XIII: recepción de Aristóteles vía árabes (Avicena, Averroes); Tomás adapta hilemorfismo, acto/potencia y motor inmóvil.","x":"El motor inmóvil se convierte en Dios creador y providente; las cinco vías tomistas reelaboran argumentos aristotélicos."},{"b":"Correcciones cristianas obligadas: creación desde la nada, mundo no eterno, providencia, alma individual inmortal."},{"b":"El aristotelismo radical (averroísmo latino: eternidad del mundo, entendimiento único) es condenado en 1277."},{"b":"Resultado: dos grandes síntesis rivales, agustinismo franciscano y aristotelismo dominico, que estructuran la escolástica."}]},{"id":"tc1-p35","tipo":"desarrollo","enunciado":"El problema de los Universales en la Edad Media (planteamiento general y soluciones)","variantes":[],"apariciones":["2023 Sep"],"frecuencia":1,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Origen: la Isagoge de Porfirio, transmitida y comentada por Boecio, plantea el estatuto de géneros y especies.","x":"Porfirio formula las preguntas y las deja sin responder; Boecio las lega a la Edad Media como problema abierto."},{"b":"Tres preguntas: ¿subsisten o son solo conceptos?; si subsisten, ¿corpóreos o incorpóreos?; ¿separados o en lo sensible?"},{"b":"Trasfondo: la herencia platónico-aristotélica según la cual la ciencia versa sobre esencias universales y necesarias."},{"b":"Realismo extremo (Eriúgena, Anselmo, Champeaux): los universales son cosas reales anteriores a los individuos (ante rem)."},{"b":"Realismo moderado (Abelardo, Tomás de Aquino): universal fundado en las cosas (in re), universalizado por abstracción (post rem)."},{"b":"Nominalismo (Roscelino, Ockham): solo existen individuos; el universal es nombre o signo mental."},{"b":"Alcance: en juego están el valor de la ciencia y dogmas teológicos; el triunfo nominalista final anuncia la modernidad.","x":"Si no hay esencias universales reales, la ciencia de lo universal pierde su objeto clásico y el saber se reorienta hacia lo empírico-singular."}]},{"id":"tc1-p36","tipo":"desarrollo","enunciado":"Variedades del realismo en la controversia de los universales","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","bullets":[{"b":"Todo realismo sostiene que los universales tienen realidad extramental: no son meros nombres o conceptos vacíos."},{"b":"Realismo extremo: el universal es cosa subsistente, anterior a los individuos (ante rem); herencia platónico-agustiniana.","x":"Representantes: Escoto Eriúgena, Anselmo, Guillermo de Champeaux. Cuanto más universal, más real."},{"b":"Champeaux: la esencia idéntica está toda entera en cada individuo; los individuos difieren solo por accidentes."},{"b":"Crítica de Abelardo al realismo extremo: la esencia común idéntica cargaría con predicados contrarios simultáneos."},{"b":"Realismo moderado: el universal existe en las cosas como forma individualizada; como universal, solo en la mente (post rem).","x":"Es la posición aristotélica asumida por Tomás de Aquino: abstracción con fundamento real, triple estado del universal."},{"b":"Diferencia clave entre variedades: subsistencia separada del universal frente a fundamento real más abstracción intelectual."}]},{"id":"tc1-p37","tipo":"desarrollo","enunciado":"La crítica del empirismo al racionalismo","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","bullets":[{"b":"Contra el innatismo cartesiano, Locke: la mente es 'papel en blanco'; todo procede de la experiencia (sensación y reflexión).","x":"Si hubiera ideas innatas serían universalmente conocidas, y no lo son (niños, pueblos sin tales nociones): la génesis del conocimiento es empírica."},{"b":"Hume radicaliza con el principio de copia: toda idea deriva de una impresión; sin impresión, término vacío."},{"b":"Crítica de la substancia: Locke la reduce a 'un no sé qué' supuesto; Berkeley niega la material; Hume, también la espiritual (yo)."},{"b":"Crítica de la causalidad: no hay conexión necesaria conocible a priori, solo conjunción constante y hábito."},{"b":"Resultado: la razón no puede conocer a priori el mundo; las tesis metafísicas racionalistas (Dios, alma, mundo) quedan injustificadas."},{"b":"Desemboca en el escepticismo mitigado de Hume y prepara la síntesis crítica de Kant.","x":"Kant reconocerá que Hume lo despertó del 'sueño dogmático': ni todo viene de la experiencia (racionalismo refutado) ni el a priori es eliminable."}]},{"id":"tc1-p38","tipo":"desarrollo","enunciado":"La Analítica transcendental en Kant","variantes":[],"apariciones":["2022 Feb-2"],"frecuencia":1,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Parte de la Lógica trascendental que estudia el entendimiento y sus conceptos puros: las categorías.","x":"Es la 'lógica de la verdad': establece las condiciones a priori bajo las cuales el pensar se refiere legítimamente a objetos."},{"b":"Analítica de los conceptos: deducción metafísica (tabla de categorías desde las formas del juicio) y deducción trascendental.","x":"La deducción trascendental legitima la validez objetiva de las categorías: sin ellas no habría experiencia unificada de objetos."},{"b":"Fundamento supremo: la unidad trascendental de apercepción, el 'yo pienso' que acompaña toda representación."},{"b":"Analítica de los principios: el esquematismo (mediación temporal) y los principios puros del entendimiento.","x":"Axiomas de la intuición, anticipaciones de la percepción, analogías de la experiencia (substancia, causalidad, comunidad) y postulados del pensar empírico."},{"b":"El entendimiento es espontaneidad que unifica lo dado por la sensibilidad: 'intuiciones sin conceptos son ciegas'."},{"b":"Fundamenta la física pura (substancia, causalidad como leyes a priori) y concluye distinguiendo fenómeno y noúmeno."}]},{"id":"tc1-p39","tipo":"desarrollo","enunciado":"La Lógica transcendental en Kant","variantes":[],"apariciones":["2023 Feb-2"],"frecuencia":1,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Estudia el origen, alcance y validez objetiva de los conocimientos a priori del entendimiento y la razón."},{"b":"A diferencia de la lógica formal, no prescinde de todo contenido: atiende a la referencia a priori a objetos.","x":"La lógica general abstrae de la relación con el objeto; la trascendental examina cómo conceptos puros pueden referirse a priori a objetos."},{"b":"Se divide en Analítica trascendental (lógica de la verdad) y Dialéctica trascendental (lógica de la ilusión)."},{"b":"La Analítica expone categorías y principios del entendimiento como condiciones de posibilidad de la experiencia."},{"b":"La Dialéctica critica a la razón cuando traspasa la experiencia: Ideas de alma, mundo y Dios."},{"b":"Complementa la Estética trascendental: sensibilidad y entendimiento son las dos fuentes cooperantes del conocimiento.","x":"Del primer tronco vienen las intuiciones, del segundo los conceptos; solo su unión produce conocimiento objetivo."}]},{"id":"tc1-p40","tipo":"desarrollo","enunciado":"La relación sujeto/objeto en Kant","variantes":[],"apariciones":["2025 Feb-2"],"frecuencia":1,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"Giro copernicano: no es el conocimiento el que se rige por los objetos; los objetos se rigen por nuestro conocimiento.","x":"Como Copérnico invirtió la relación sol-tierra, Kant invierte la relación sujeto-objeto para explicar el a priori de la ciencia."},{"b":"El objeto de conocimiento es en parte construido: la materia la da la sensación; la forma la pone el sujeto."},{"b":"El sujeto es trascendental: estructura universal y necesaria (espacio, tiempo, categorías, apercepción), no el yo psicológico individual."},{"b":"Conocemos fenómenos, no cosas en sí: el objeto solo es objeto dentro de las condiciones de la experiencia."},{"b":"Idealismo trascendental compatible con realismo empírico: los fenómenos son plenamente objetivos para todo sujeto.","x":"La objetividad no desaparece: se redefine como validez universal fundada en estructuras idénticas en todos los sujetos."},{"b":"Supera racionalismo y empirismo: 'los conceptos sin intuiciones son vacíos, las intuiciones sin conceptos son ciegas'."}]},{"id":"tc1-p41","tipo":"desarrollo","enunciado":"El fundamento del conocimiento en Kant","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 8: El planteamiento trascendental de Kant","bullets":[{"b":"El fundamento último del conocimiento no está en el objeto sino en el sujeto trascendental y sus formas a priori.","x":"Es la primera teoría idealista del conocimiento: las condiciones del saber son estructuras del sujeto racional humano."},{"b":"Revolución copernicana: los objetos deben conformarse a nuestras estructuras cognoscitivas, no a la inversa."},{"b":"Dos fuentes cooperantes: sensibilidad (intuiciones bajo espacio y tiempo) y entendimiento (conceptos, categorías)."},{"b":"Fundamento supremo: la unidad trascendental de apercepción, el 'yo pienso' que unifica toda representación."},{"b":"El conocimiento legítimo consiste en juicios sintéticos a priori aplicados a la experiencia posible."},{"b":"Límite constitutivo del fundamento: solo conocemos fenómenos; la cosa en sí resulta incognoscible.","x":"El mismo fundamento que hace posible la ciencia prohíbe la metafísica trascendente: fundamentación y limitación van unidas."}]}],"cards":[{"id":"tc1-c01","tema":"Tema 1: Platón","front":"¿Qué es una Idea platónica?","back":"Esencia universal, eterna, inmutable e inteligible, que existe en sí, separada de lo sensible. Es el verdadero ser y el único objeto de ciencia (episteme)."},{"id":"tc1-c02","tema":"Tema 1: Platón","front":"Anámnesis (reminiscencia)","back":"Conocer es recordar: el alma contempló las Ideas antes de encarnarse. Pruebas: esclavo del Menón, argumento de lo Igual en el Fedón."},{"id":"tc1-c03","tema":"Tema 1: Platón","front":"Episteme vs. doxa","back":"Episteme: ciencia, saber necesario sobre las Ideas. Doxa: opinión, creencia mudable sobre el mundo sensible intermedio entre ser y no-ser."},{"id":"tc1-c04","tema":"Tema 1: Platón","front":"Símil de la línea: cuatro grados","back":"Eikasía (imágenes), pístis (cosas sensibles) = doxa; diánoia (matemáticas), nóesis (Ideas, dialéctica) = episteme. Grados de conocimiento correlativos a grados de ser."},{"id":"tc1-c05","tema":"Tema 1: Platón","front":"Chorismós","back":"La 'separación' entre mundo inteligible y sensible: dificultad central de la teoría de las Ideas. ¿Cómo relacionar dos órdenes heterogéneos de realidad?"},{"id":"tc1-c06","tema":"Tema 1: Platón","front":"Argumento del 'tercer hombre'","back":"Objeción del Parménides: la semejanza entre los hombres y la Idea de Hombre exige una tercera Idea que la funde, y así al infinito."},{"id":"tc1-c07","tema":"Tema 1: Platón","front":"Méthexis y mímesis","back":"Los dos modos de relación cosas-Ideas: participación (las cosas participan de la Idea) e imitación (las cosas copian la Idea como modelo)."},{"id":"tc1-c08","tema":"Tema 1: Platón","front":"Paradoja de Menón","back":"No se puede buscar ni lo que se sabe (ya se tiene) ni lo que se ignora (no se reconocería). Platón la resuelve con la reminiscencia."},{"id":"tc1-c09","tema":"Tema 1: Platón","front":"Idea del Bien","back":"Cúspide del mundo inteligible: como el sol, da ser y cognoscibilidad a las demás Ideas. Fundamento último ontológico y epistemológico (República)."},{"id":"tc1-c10","tema":"Tema 1: Platón","front":"Dialéctica platónica","back":"Método supremo de conocimiento: ascenso racional de Idea en Idea hasta el principio anhipotético (el Bien), sin apoyarse en lo sensible."},{"id":"tc1-c11","tema":"Tema 2: Aristóteles","front":"Categorías aristotélicas: definición y número","back":"Géneros supremos del ser, modos generales de ser y predicarse: diez. Substancia más nueve accidentes (cantidad, cualidad, relación, lugar, tiempo, posición, posesión, acción, pasión)."},{"id":"tc1-c12","tema":"Tema 2: Aristóteles","front":"Substancia primera vs. substancia segunda","back":"Primera: el individuo concreto, que existe en sí (este hombre). Segunda: especies y géneros que se predican de él (hombre, animal)."},{"id":"tc1-c13","tema":"Tema 2: Aristóteles","front":"'El ser se dice de muchas maneras'","back":"Tesis antiunivocista: hay una pluralidad de sentidos del ser (las categorías), unificados por referencia a la substancia (pros hen)."},{"id":"tc1-c14","tema":"Tema 2: Aristóteles","front":"Abstracción","back":"Operación por la que el entendimiento extrae la forma universal de las imágenes sensibles (phantasmata), prescindiendo de la materia individual. Origen empírico del concepto."},{"id":"tc1-c15","tema":"Tema 2: Aristóteles","front":"Entendimiento agente y paciente","back":"El agente ilumina el phantasma y actualiza lo inteligible en potencia; el paciente recibe la forma y se hace todas las cosas."},{"id":"tc1-c16","tema":"Tema 2: Aristóteles","front":"Hilemorfismo","back":"La substancia sensible es compuesto de materia (sustrato indeterminado) y forma (esencia que determina). La forma es inmanente, no separada."},{"id":"tc1-c17","tema":"Tema 2: Aristóteles","front":"Acto y potencia","back":"Principios que explican el cambio: devenir es paso de potencia (capacidad de ser) a acto (realización). Respuesta al inmovilismo de Parménides."},{"id":"tc1-c18","tema":"Tema 2: Aristóteles","front":"Las cuatro causas","back":"Material (de qué), formal (qué es), eficiente (agente que produce) y final (para qué). Conocer científicamente es conocer por causas."},{"id":"tc1-c19","tema":"Tema 2: Aristóteles","front":"Silogismo demostrativo (ciencia)","back":"Razonamiento desde premisas verdaderas, primeras e inmediatas que concluye necesariamente. La ciencia demuestra propiedades desde esencias y causas (Analíticos segundos)."},{"id":"tc1-c20","tema":"Tema 2: Aristóteles","front":"¿Cómo se conocen los primeros principios?","back":"No se demuestran (habría regreso infinito): se captan por inducción desde la experiencia y por intuición intelectual (noûs)."},{"id":"tc1-c21","tema":"Tema 2: Aristóteles","front":"Núcleo de la crítica de Aristóteles a Platón","back":"La esencia no existe separada de la cosa: las Ideas duplican el mundo sin explicarlo; participación e imitación son metáforas vacías; tercer hombre."},{"id":"tc1-c22","tema":"Tema 3: Helenismo","front":"Phantasía katalēptikē","back":"Representación comprensiva estoica: se impone con evidencia irresistible y garantiza proceder del objeto real. Es el criterio de verdad del estoicismo."},{"id":"tc1-c23","tema":"Tema 3: Helenismo","front":"Synkatáthesis","back":"Asentimiento: acto voluntario por el que la razón aprueba una representación. El error es asentir a representaciones no comprensivas."},{"id":"tc1-c24","tema":"Tema 3: Helenismo","front":"Lektón","back":"Lo 'expresable' o significado: entidad incorporal que media entre el signo lingüístico y la cosa. El lektón completo es la proposición (axíoma)."},{"id":"tc1-c25","tema":"Tema 3: Helenismo","front":"Las cuatro categorías estoicas","back":"Substrato, cualidad, modo de ser y modo de ser relativo. Determinaciones anidadas del cuerpo individual, no géneros del ser separados."},{"id":"tc1-c26","tema":"Tema 3: Helenismo","front":"Lógica estoica vs. lógica aristotélica","back":"Estoica: lógica de proposiciones (inferencias entre enunciados, cinco indemostrables). Aristotélica: lógica de términos y clases (silogística)."},{"id":"tc1-c27","tema":"Tema 3: Helenismo","front":"Las tres partes de la filosofía estoica","back":"Lógica, física y ética. La lógica (retórica y dialéctica) es instrumental: el saber se subordina al ideal de vida del sabio."},{"id":"tc1-c28","tema":"Tema 3: Helenismo","front":"Epoché escéptica","back":"Suspensión del juicio: al no haber representación que garantice la verdad, el escéptico no asiente a nada y alcanza la ataraxia."},{"id":"tc1-c29","tema":"Tema 3: Helenismo","front":"Instrumentalización helenística del conocimiento","back":"En estoicismo, epicureísmo y escepticismo el conocer deja de ser fin en sí: sirve a la ética, a la vida feliz e imperturbable."},{"id":"tc1-c30","tema":"Tema 4: Edad Media","front":"'Credo ut intelligam'","back":"Lema agustiniano-anselmiano: creo para entender. La fe orienta y precede a la razón; entender es profundizar lo creído."},{"id":"tc1-c31","tema":"Tema 4: Edad Media","front":"Iluminación agustiniana","back":"Dios ilumina la mente para que conozca las verdades eternas e inmutables, que superan a la mente mudable. Sustituye a la reminiscencia platónica."},{"id":"tc1-c32","tema":"Tema 4: Edad Media","front":"¿Dónde sitúa Agustín las Ideas platónicas?","back":"En la mente de Dios: son los ejemplares eternos según los cuales Dios crea. Adaptación cristiana del platonismo."},{"id":"tc1-c33","tema":"Tema 4: Edad Media","front":"Razón y fe en Tomás de Aquino","back":"Distintas pero armónicas: hay preámbulos demostrables (existencia de Dios) y misterios sobrenaturales. No cabe contradicción real: ambas proceden de Dios."},{"id":"tc1-c34","tema":"Tema 4: Edad Media","front":"Doble verdad (averroísmo latino)","back":"Tesis atribuida a Siger de Brabante: lo verdadero en filosofía puede contradecir la teología. Condenada por Tempier en 1277."},{"id":"tc1-c35","tema":"Tema 4: Edad Media","front":"Las cuatro etapas de la relación razón/fe","back":"1) Identificación agustiniana; 2) armonía y distinción tomista; 3) doble verdad averroísta; 4) separación ockhamista, que emancipa la razón."},{"id":"tc1-c36","tema":"Tema 5: Universales","front":"Origen del problema de los universales","back":"La Isagoge de Porfirio, comentada por Boecio: ¿géneros y especies subsisten o son solo conceptos?; ¿corpóreos?; ¿separados o en lo sensible?"},{"id":"tc1-c37","tema":"Tema 5: Universales","front":"Universalia ante rem / in re / post rem","back":"Ante rem: universal anterior a las cosas (realismo extremo; en Dios). In re: forma en los individuos. Post rem: concepto abstraído (realismo moderado)."},{"id":"tc1-c38","tema":"Tema 5: Universales","front":"Realismo extremo: tesis y autores","back":"Los universales son cosas subsistentes anteriores a los individuos. Escoto Eriúgena, Anselmo, Guillermo de Champeaux. Herencia platónico-agustiniana."},{"id":"tc1-c39","tema":"Tema 5: Universales","front":"Crítica de Abelardo a Champeaux","back":"Si la esencia fuese idéntica y entera en todos los individuos, la misma cosa recibiría predicados contrarios a la vez. El universal es 'sermo' con fundamento en el status común."},{"id":"tc1-c40","tema":"Tema 5: Universales","front":"Roscelino","back":"Nominalismo temprano: el universal es 'flatus vocis', mero soplo de voz. Solo existen individuos; los nombres generales no designan esencias."},{"id":"tc1-c41","tema":"Tema 5: Universales","front":"Navaja de Ockham","back":"Principio de economía: no multiplicar los entes sin necesidad. Elimina esencias universales, especies inteligibles y entidades explicativas superfluas."},{"id":"tc1-c42","tema":"Tema 5: Universales","front":"Suppositio (Ockham)","back":"Función del término en la proposición de 'estar en lugar de' los individuos que significa. El universal es signo mental que suple por muchos."},{"id":"tc1-c43","tema":"Tema 5: Universales","front":"Conocimiento intuitivo y abstractivo en Ockham","back":"Intuitivo: captación directa del individuo existente, base de toda evidencia. Abstractivo: conceptos generales elaborados después, sin garantizar existencia."},{"id":"tc1-c44","tema":"Tema 5: Universales","front":"Consecuencias del nominalismo de Ockham","back":"Separación de fe y razón, crisis de la metafísica esencialista y de la escolástica, giro hacia lo singular y empírico: antesala de la modernidad."},{"id":"tc1-c45","tema":"Tema 6: Racionalismo","front":"Tesis central del racionalismo","back":"El fundamento del conocimiento es la razón, fuente de verdades a priori independientes de la experiencia sensible. Modelo: la certeza matemática."},{"id":"tc1-c46","tema":"Tema 6: Racionalismo","front":"Duda metódica: tres niveles","back":"1) Engaños de los sentidos; 2) indistinción sueño/vigilia; 3) genio maligno, que alcanza incluso a las matemáticas. Universal, hiperbólica y provisional."},{"id":"tc1-c47","tema":"Tema 6: Racionalismo","front":"Cogito, ergo sum","back":"Primera verdad indudable: dudar es pensar y pensar exige existir. No es silogismo sino intuición inmediata. Descubre el yo como res cogitans."},{"id":"tc1-c48","tema":"Tema 6: Racionalismo","front":"Criterio cartesiano de verdad","back":"Claridad y distinción: es verdadero todo lo que se percibe tan clara y distintamente como el cogito. Garantizado por la veracidad divina."},{"id":"tc1-c49","tema":"Tema 6: Racionalismo","front":"Las tres clases de ideas en Descartes","back":"Adventicias (vienen de fuera), facticias (las construye la mente) e innatas (nacen con la razón: yo, Dios, extensión, verdades matemáticas)."},{"id":"tc1-c50","tema":"Tema 6: Racionalismo","front":"Intuición y deducción","back":"Las dos operaciones de la razón cartesiana: captación inmediata y evidente de naturalezas simples, y encadenamiento ordenado de intuiciones."},{"id":"tc1-c51","tema":"Tema 6: Racionalismo","front":"Las cuatro reglas del método cartesiano","back":"Evidencia (solo lo claro y distinto), análisis (dividir), síntesis (orden de simple a complejo) y enumeración (revisiones completas)."},{"id":"tc1-c52","tema":"Tema 6: Racionalismo","front":"Papel de Dios en el sistema cartesiano","back":"Demostrado desde la idea innata de infinito, su veracidad descarta el genio maligno y garantiza el criterio de verdad y el mundo exterior."},{"id":"tc1-c53","tema":"Tema 6: Racionalismo","front":"Mathesis universalis","back":"Ideal cartesiano de ciencia universal del orden y la medida: una sola razón, un solo método de tipo matemático para todo el saber."},{"id":"tc1-c54","tema":"Tema 7: Empirismo","front":"Tesis central del empirismo","back":"Todo conocimiento procede de la experiencia sensible; no hay ideas innatas. La experiencia es origen y límite del saber (Locke, Berkeley, Hume)."},{"id":"tc1-c55","tema":"Tema 7: Empirismo","front":"Tabula rasa (Locke)","back":"La mente al nacer es papel en blanco: todos los contenidos provienen de la experiencia, externa (sensación) o interna (reflexión)."},{"id":"tc1-c56","tema":"Tema 7: Empirismo","front":"Impresiones e ideas (Hume)","back":"Impresiones: percepciones vivaces actuales (sensaciones, pasiones). Ideas: sus copias débiles en el pensar. Toda idea legítima deriva de impresiones (principio de copia)."},{"id":"tc1-c57","tema":"Tema 7: Empirismo","front":"Relaciones de ideas vs. cuestiones de hecho","back":"Relaciones de ideas: necesarias, a priori (matemáticas), no informan del mundo. Cuestiones de hecho: contingentes, a posteriori, fundadas en la causalidad."},{"id":"tc1-c58","tema":"Tema 7: Empirismo","front":"Conocimiento intuitivo y demostrativo en Hume","back":"Intuitivo: relaciones captadas de inmediato (semejanza, grados). Demostrativo: cadenas de intuiciones, solo en cantidad y número (matemáticas)."},{"id":"tc1-c59","tema":"Tema 7: Empirismo","front":"Análisis humeano de la causalidad","back":"Solo observamos contigüidad, sucesión y conjunción constante; la 'conexión necesaria' no tiene impresión: nace del hábito y se proyecta sobre los objetos."},{"id":"tc1-c60","tema":"Tema 7: Empirismo","front":"Creencia (belief) en Hume","back":"Idea vivaz asociada a una impresión presente: sostiene las inferencias causales y la expectativa de futuro. Base psicológica, no racional, de la vida cognoscitiva."},{"id":"tc1-c61","tema":"Tema 7: Empirismo","front":"El yo según Hume","back":"No hay impresión del yo: es un haz de percepciones en flujo perpetuo. La identidad personal es ficción de la imaginación (memoria, causalidad)."},{"id":"tc1-c62","tema":"Tema 7: Empirismo","front":"Asociación de ideas (Hume)","back":"Tres leyes que enlazan ideas: semejanza, contigüidad espacio-temporal y causa-efecto. Son la 'atracción' que ordena la vida mental."},{"id":"tc1-c63","tema":"Tema 7: Empirismo","front":"Esse est percipi (Berkeley)","back":"Ser es ser percibido: no existe substancia material; solo existen ideas y los espíritus que las perciben. Inmaterialismo empirista."},{"id":"tc1-c64","tema":"Tema 8: Kant","front":"Giro copernicano","back":"Inversión kantiana: los objetos se rigen por nuestras estructuras cognoscitivas, no a la inversa. Explica la posibilidad de juicios sintéticos a priori."},{"id":"tc1-c65","tema":"Tema 8: Kant","front":"'Trascendental' en Kant","back":"Conocimiento que no versa sobre objetos sino sobre nuestro modo a priori de conocerlos: sus condiciones de posibilidad."},{"id":"tc1-c66","tema":"Tema 8: Kant","front":"Juicio sintético a priori","back":"Juicio que amplía el conocimiento (sintético) y es universal y necesario (a priori). Funda la ciencia. Ejemplos: 7+5=12; todo cambio tiene causa."},{"id":"tc1-c67","tema":"Tema 8: Kant","front":"Espacio y tiempo en Kant","back":"Formas puras a priori de la sensibilidad (Estética trascendental): espacio, sentido externo; tiempo, sentido interno. Fundan la matemática; solo valen para fenómenos."},{"id":"tc1-c68","tema":"Tema 8: Kant","front":"Fenómeno vs. noúmeno (cosa en sí)","back":"Fenómeno: lo que aparece bajo las formas a priori del sujeto; único objeto de conocimiento. Noúmeno: la cosa en sí, pensable pero incognoscible."},{"id":"tc1-c69","tema":"Tema 8: Kant","front":"Las categorías kantianas","back":"Doce conceptos puros del entendimiento, derivados de las formas del juicio, en cuatro grupos: cantidad, cualidad, relación y modalidad. Solo valen en la experiencia."},{"id":"tc1-c70","tema":"Tema 8: Kant","front":"Deducción trascendental de las categorías","back":"Justifica su validez objetiva: sin categorías no habría experiencia unificada de objetos. Fundamento: la unidad trascendental de apercepción ('yo pienso')."},{"id":"tc1-c71","tema":"Tema 8: Kant","front":"Esquematismo trascendental","back":"Mediación entre categorías e intuiciones mediante esquemas: determinaciones a priori del tiempo producidas por la imaginación trascendental."},{"id":"tc1-c72","tema":"Tema 8: Kant","front":"Las tres Ideas de la razón","back":"Alma, mundo y Dios: conceptos de lo incondicionado, sin objeto en la experiencia. Sin uso constitutivo; solo uso regulativo que orienta la investigación."},{"id":"tc1-c73","tema":"Tema 8: Kant","front":"Paralogismos y antinomias","back":"Paralogismos: falsas inferencias sobre el alma substancial. Antinomias: contradicciones cosmológicas (tesis/antítesis igualmente demostrables). Ambos, ilusiones de la Dialéctica."},{"id":"tc1-c74","tema":"Tema 8: Kant","front":"Crítica kantiana a las pruebas de Dios","back":"Refuta las pruebas ontológica, cosmológica y físico-teológica. Clave: la existencia no es un predicado real; no cabe teología racional teórica."},{"id":"tc1-c75","tema":"Tema 8: Kant","front":"¿Es la metafísica ciencia según Kant?","back":"No: sus objetos exceden toda experiencia posible y carece de juicios sintéticos a priori verificables. Subsiste como disposición natural y como crítica."},{"id":"tc1-c76","tema":"Tema 8: Kant","front":"Estructura de la Crítica de la razón pura","back":"Estética trascendental (sensibilidad: espacio y tiempo); Lógica trascendental: Analítica (entendimiento: categorías, principios) y Dialéctica (razón: Ideas, ilusión)."},{"id":"tc1-c77","tema":"Tema 8: Kant","front":"'Intuiciones sin conceptos, conceptos sin intuiciones'","back":"'Los pensamientos sin contenido son vacíos; las intuiciones sin conceptos, ciegas': sensibilidad y entendimiento deben cooperar; síntesis de empirismo y racionalismo."}]},{"id":"antigua1","nombre":"Historia de la Filosofía Antigua I","nombreCorto":"Fil. Antigua","formatoExamen":"Examen de desarrollo con 2 preguntas, 120 minutos, sin ningún material permitido. Parte 1: elegir 1 cuestión entre 3 propuestas del temario (puede incluir comentario de texto). Parte 2: 'pregunta autoformulada', un tema libre del programa preparado de antemano por el estudiante. Cada parte puntúa de 1 a 5 (total 10); hay que responder equilibradamente a ambas y no pueden pertenecer al mismo bloque del temario. La PEC (ensayo de ~10 págs.) es opcional y solo puede sumar hasta 1 punto si el examen está aprobado.","temas":["Tema I: El nacimiento de la filosofía en Grecia. Viaje al inicio de Occidente (Mileto: Tales, Anaximandro, Anaxímenes; Pitágoras y el pitagorismo; Heráclito; Escuela de Elea: Jenófanes, Parménides, Zenón; pluralistas: Empédocles y Anaxágoras; atomistas: Demócrito y Leucipo)","Tema II: Período socrático: la sofística, Sócrates y la herencia socrática (escuelas socráticas menores: Elis-Eretria, Megara, cínicos, Cirene)","Tema III: Platón: hacia la salvación del alma. Filosofía y dialéctica (vida y diálogos; camino de la ciencia; el Ser y el mundo de las Ideas; teología y el Bien; autocrítica en Parménides, Sofista y Político; Demiurgo y Timeo; ética y política)","Tema IV: Aristóteles: del concepto a la acción. Filosofía y hermenéutica (Corpus y transmisión; lógica; filosofía primera; física y astronomía; biología; antropología: alma y noûs; teología; política; poética; retórica). NOTA: las Éticas no entran en el programa"],"preguntas":[{"id":"fa1-p01","tipo":"desarrollo","enunciado":"Un tema libre para escoger de entre los contenidos del programa de la asignatura ('pregunta autoformulada'), teniendo en cuenta las indicaciones del equipo docente en la plataforma (aLF/Ágora)","variantes":[],"apariciones":["2022 Feb-1","2022 Feb-2","2022 Sep","2023 Feb-1","2023 Feb-2","2023 Sep","2024 Feb-1","2024 Feb-2","2024 Sep","2025 Feb-1","2025 Feb-2","2025 Sep","2026 Feb-1","2026 Feb-2"],"frecuencia":14,"tema":"Todos los bloques (a elección del estudiante)","bullets":[{"b":"Prepara de antemano un tema cerrado del programa, con guion memorizado y extensión calculada para unos 55-60 minutos.","x":"Es la mitad fija del examen: aparece en todas las convocatorias. No se permite ningún material, así que el desarrollo debe estar íntegramente memorizado y ensayado por escrito con tiempo cronometrado."},{"b":"Regla clave: no puede pertenecer al mismo bloque que la pregunta elegida en la parte 1; prepara temas de dos bloques distintos.","x":"Como no sabes qué tres opciones saldrán en la parte 1, lo seguro es llevar dos autoformuladas de bloques diferentes (p. ej., una de presocráticos y otra de Aristóteles) y decidir en el momento."},{"b":"Elige un título preciso y filosófico que plantee un problema, no una etiqueta vaga (p. ej., 'El ser en Parménides y su herencia').","x":"El equipo docente valora abordar la historia de la filosofía de manera filosófica y no meramente filológica: el título debe anunciar un problema, sus interlocutores y una tesis."},{"b":"Estructura recomendada: planteamiento del problema, contexto e interlocutores agonísticos, desarrollo con conceptos griegos precisos, conclusión crítica.","x":"Usar con propiedad los términos griegos (arché, lógos, ousía, eîdos...) y señalar con quién dialoga o disiente cada filósofo es criterio explícito de evaluación."},{"b":"Para profundizar se recomienda apoyarse en un libro de Oñate: 'El nacimiento de la filosofía en Grecia' o 'Para leer la Metafísica'.","x":"La guía indica expresamente que la autoformulada puede prepararse ampliando con uno de esos dos libros, aplicables a Platón, a Aristóteles y a su estudio comparado."},{"b":"Escribe con claridad, coherencia y corrección ortográfica y sintáctica: también se califica la expresión escrita."}]},{"id":"fa1-p02","tipo":"desarrollo","enunciado":"Platón: Ética y política","variantes":["Platón: Política","Platón: Ética"],"apariciones":["2022 Feb-1","2022 Feb-2","2023 Feb-1","2024 Feb-1","2024 Feb-2","2024 Sep","2026 Feb-2"],"frecuencia":7,"tema":"Tema III: Platón","bullets":[{"b":"Ética intelectualista heredada de Sócrates: la virtud es conocimiento del Bien; el mal nace de la ignorancia; salvación del alma.","x":"Nadie obra mal a sabiendas. La vida buena exige el cuidado del alma (epiméleia tês psychês) y su purificación mediante el saber, en clave órfico-pitagórica: el cuerpo como cárcel del alma."},{"b":"Alma tripartita (Fedro, República IV): racional, irascible, concupiscible; símil del carro alado; cada parte tiene su virtud.","x":"A la parte racional corresponde la prudencia o sabiduría (phrónesis/sophía), a la irascible el valor (andreía), a la concupiscible la templanza (sophrosýne)."},{"b":"La justicia (dikaiosýne) es armonía: cada parte del alma y cada clase de la ciudad hace lo suyo propio.","x":"Es la tesis central de la República: la justicia no es convención ni interés del fuerte (contra Trasímaco), sino el orden interno que hace feliz al justo."},{"b":"Paralelismo alma-ciudad: tres clases (gobernantes-filósofos, guardianes, productores); la educación (paideía) selecciona y forma a los mejores.","x":"La ciudad es el alma 'en grandes letras'. La educación culmina en la dialéctica y el conocimiento del Bien; para los guardianes, comunidad de bienes y de familia, e igualdad de las mujeres."},{"b":"Tesis del filósofo-rey: no cesarán los males hasta que los filósofos gobiernen o los gobernantes filosofen (República V).","x":"Solo quien conoce la Idea del Bien puede ordenar la ciudad según ese modelo. Los tres intentos fracasados en Siracusa (Carta VII) muestran el empeño práctico-político de Platón."},{"b":"Degeneración de los regímenes (República VIII-IX): aristocracia, timocracia, oligarquía, democracia, tiranía; el tirano, alma más esclava e infeliz.","x":"Cada régimen corresponde a un tipo de alma dominante. La crítica a la democracia refleja la condena de Sócrates por la Atenas restaurada."},{"b":"Evolución final: en el Político, la ciencia regia; en las Leyes, el 'segundo mejor' Estado, gobierno de la ley, no de hombres."}]},{"id":"fa1-p03","tipo":"desarrollo","enunciado":"La Escuela de Elea: Jenófanes, Parménides, Zenón y Meliso","variantes":["Escuela de Elea: Jenófanes, Parménides y Zenón"],"apariciones":["2022 Sep","2023 Feb-1","2024 Sep","2025 Feb-1","2026 Feb-2"],"frecuencia":5,"tema":"Tema I: Presocráticos","bullets":[{"b":"Jenófanes de Colofón: crítica racional del antropomorfismo de Homero y Hesíodo; un dios supremo, no antropomórfico, que todo lo mueve con su mente.","x":"Si los bueyes pudieran pintar, pintarían dioses con forma de buey. Jaeger lo lee como 'teología' racional de los primeros filósofos: purificación de lo divino, no ateísmo."},{"b":"Parménides: poema 'Sobre la naturaleza'; la diosa revela dos vías: la de la verdad (alétheia) y la de la opinión (dóxa).","x":"El proemio (viaje del koûros hacia la luz) conserva forma religiosa-iniciática, pero el contenido es pura argumentación deductiva: primer gran texto de la ontología occidental."},{"b":"Tesis central: 'el ser es y no puede no ser; el no-ser no es'; pensar y ser son lo mismo (noeîn-eînai).","x":"Solo puede pensarse y decirse lo que es; el no-ser es impensable e indecible. Con ello el lógos se independiza de los sentidos y funda el principio de no contradicción avant la lettre."},{"b":"Signos (sémata) del ser: ingénito, imperecedero, uno, continuo, homogéneo, inmóvil, completo y limitado como esfera perfecta.","x":"Del 'es' se deducen sus caracteres: no puede nacer (¿de qué no-ser?), ni perecer, ni moverse ni dividirse. El límite (péras) es aquí perfección, no defecto."},{"b":"Consecuencia: el devenir y la pluralidad sensibles quedan como dóxa; todos los físicos posteriores deben responder a Parménides.","x":"Pluralistas y atomistas aceptan que nada nace del no-ser, pero salvan los fenómenos multiplicando los principios eternos. Platón lo llamará 'padre' y cometerá contra él su 'parricidio' en el Sofista."},{"b":"Zenón de Elea: defensa indirecta del maestro; aporías contra el movimiento y la pluralidad (Aquiles, dicotomía, flecha, estadio).","x":"Método de reducción al absurdo: si hay pluralidad y movimiento se siguen consecuencias contradictorias. Aristóteles lo considera inventor de la dialéctica."},{"b":"Meliso de Samos: reformula el ser parmenídeo como ilimitado (ápeiron), eterno en el tiempo e incorpóreo.","x":"Frente a la esfera limitada de Parménides, Meliso sostiene que el ser no puede tener límites, pues limitaría con el no-ser. Aristóteles lo critica con dureza."}]},{"id":"fa1-p04","tipo":"desarrollo","enunciado":"Los filósofos pluralistas: Empédocles y Anaxágoras. Demócrito y Leucipo","variantes":[],"apariciones":["2022 Feb-1","2023 Feb-2","2024 Feb-2","2025 Feb-2"],"frecuencia":4,"tema":"Tema I: Presocráticos","bullets":[{"b":"Contexto común: responden a Parménides; nada nace del no-ser ni perece, pero varios principios eternos se mezclan y separan.","x":"Aceptan la prohibición eleática (ningún surgir absoluto) y salvan a la vez los fenómenos: el 'nacimiento' es mezcla y la 'muerte' separación de elementos eternos."},{"b":"Empédocles de Agrigento: cuatro raíces (fuego, aire, agua, tierra) combinadas por Amor (Philía) y separadas por Odio (Neîkos).","x":"El cosmos es un ciclo eterno entre el Esfero (unidad total bajo el Amor) y la dispersión bajo el Odio. Escribió 'Sobre la naturaleza' y las 'Purificaciones', de tono órfico."},{"b":"En Empédocles conviven física y religión: transmigración del alma (daímon caído) y purificación; teoría de la percepción por efluvios.","x":"Lo semejante conoce lo semejante. Su figura de mago-médico-poeta muestra que el primer pensamiento griego no separa ciencia y salvación."},{"b":"Anaxágoras de Clazómenas: 'en todo hay parte de todo'; infinitas semillas (spérmata) u homeomerías; nada surge de la nada.","x":"Cada cosa se denomina por lo que predomina en ella. Llevó la filosofía a Atenas y fue procesado por impiedad al afirmar que el sol es una piedra incandescente."},{"b":"El Noûs anaxagóreo: inteligencia infinita, pura y separada que inicia el remolino cósmico y ordena la mezcla originaria.","x":"Primera causa inteligente de la filosofía griega. Pero Sócrates, en el Fedón, y Aristóteles le reprochan usar el Noûs solo como mecanismo, sin explicación teleológica: 'deus ex machina'."},{"b":"Atomismo de Leucipo y Demócrito: átomos (ser) infinitos, indivisibles, eternos, que se mueven en el vacío (no-ser que 'es').","x":"Audacia ontológica: conceden realidad al vacío para hacer posible el movimiento. Los átomos difieren solo por figura, orden y posición; los mundos son infinitos."},{"b":"Demócrito: mecanicismo y necesidad (anánke); cualidades sensibles por convención; conocimiento 'oscuro' (sentidos) frente a 'legítimo' (razón); ética de la eutimía.","x":"'Por convención el color, por convención lo dulce...; en realidad, átomos y vacío'. Su ética del buen ánimo y la mesura anticipa los ideales helenísticos de serenidad."}]},{"id":"fa1-p05","tipo":"desarrollo","enunciado":"Aristóteles: Física","variantes":["Aristóteles: Física y biología"],"apariciones":["2022 Feb-1","2023 Feb-2","2024 Feb-1","2026 Feb-1"],"frecuencia":4,"tema":"Tema IV: Aristóteles","bullets":[{"b":"La física es 'filosofía segunda': ciencia teórica del ser en movimiento; la physis es principio interno de movimiento y reposo.","x":"Frente al artefacto, cuyo principio de cambio es externo (el artesano), el ser natural lleva en sí mismo su principio de movimiento. La física estudia el ente móvil en cuanto tal."},{"b":"Solución al problema eleático del cambio: distinción entre acto (enérgeia) y potencia (dýnamis); el ser se dice de muchas maneras.","x":"El cambio no es paso del no-ser al ser (imposible según Parménides), sino de ser-en-potencia a ser-en-acto. Así se salva la realidad del devenir sin violar el principio de no contradicción."},{"b":"Definición de movimiento: 'acto de lo que está en potencia en cuanto que está en potencia' (Física III).","x":"El movimiento es un acto imperfecto o inacabado: la actualización misma de la potencia mientras dura el proceso. Definición célebre por su rigor y su dificultad."},{"b":"Hilemorfismo: todo ser natural es compuesto de materia (hýle) y forma (morphé/eîdos); el cambio requiere además la privación (stéresis).","x":"En el cambio sustancial la materia prima permanece como sustrato; en el accidental permanece la sustancia. Tres principios del devenir: sustrato, forma y privación."},{"b":"Las cuatro causas: material, formal, eficiente y final; la naturaleza obra teleológicamente, 'no hace nada en vano'.","x":"Conocer científicamente es conocer por causas. La causa final es la principal en la naturaleza: crítica al mecanicismo de Empédocles y Demócrito."},{"b":"Análisis del continuo: lugar (límite del cuerpo envolvente), tiempo ('número del movimiento según lo anterior y lo posterior'), rechazo del vacío y del infinito en acto.","x":"Contra los atomistas niega el vacío; el infinito existe solo en potencia (divisibilidad, sucesión numérica). Con el continuo responde a las aporías de Zenón."},{"b":"Física celeste: cosmos finito, eterno, geocéntrico; el éter y el movimiento circular de los cielos remiten al Primer Motor inmóvil.","x":"La cadena de motores movidos no puede ser infinita: la física desemboca (Física VIII) en un primer principio inmóvil, puente hacia la filosofía primera."}]},{"id":"fa1-p06","tipo":"desarrollo","enunciado":"Sócrates y los sofistas. El método socrático. Las doctrinas de Sócrates","variantes":["Sócrates: método, fuentes, doctrinas socráticas"],"apariciones":["2023 Feb-2","2025 Feb-2","2026 Feb-2"],"frecuencia":3,"tema":"Tema II: Período socrático","bullets":[{"b":"Problema de las fuentes: Sócrates no escribió; lo conocemos por Platón, Jenofonte, Aristófanes (caricatura en 'Las Nubes') y Aristóteles.","x":"La 'cuestión socrática' obliga a contrastar testimonios: el Sócrates platónico de los primeros diálogos (Apología) se considera el más fiable filosóficamente; Aristófanes lo confunde interesadamente con los sofistas."},{"b":"Frente a los sofistas: no cobra, no enseña doctrinas, dialoga en busca de definiciones universales y verdad, no de persuasión.","x":"Comparte con ellos el giro antropológico (el hombre y la polis, no la physis), pero rechaza el relativismo: si la justicia es solo convención, la vida moral y política se disuelve."},{"b":"Método: ironía ('solo sé que no sé nada'), refutación (élenchos) que purga el falso saber, y mayéutica que 'da a luz' la verdad.","x":"Como su madre partera, Sócrates no transmite contenidos: mediante preguntas hace que el interlocutor descubra y examine sus propias creencias. La dialéctica es examen público del lógos."},{"b":"Aristóteles le atribuye dos aportes: los razonamientos inductivos y la definición universal en el ámbito moral (Metafísica XIII).","x":"Preguntas del tipo '¿qué es la virtud?', '¿qué es la justicia?' buscan la esencia (tí esti), germen de la teoría platónica de las Ideas."},{"b":"Intelectualismo moral: la virtud es conocimiento y puede enseñarse; nadie obra mal a sabiendas; el vicio es ignorancia.","x":"De ahí la unidad de las virtudes y la paradoja socrática: es peor cometer injusticia que padecerla. La tarea central es el cuidado del alma (epiméleia tês psychês)."},{"b":"'Una vida sin examen no merece ser vivida': misión divina avalada por el oráculo de Delfos y el daimon interior.","x":"El daimonion es una voz que solo disuade. La obediencia a esta vocación filosófica está por encima del miedo a la muerte, como muestra la Apología."},{"b":"Juicio y muerte (399 a.C.): acusado por Ánito, Meleto y Licón de impiedad y corromper a los jóvenes; fidelidad a las leyes (Critón) y muerte ejemplar (Fedón).","x":"Su condena por la democracia restaurada convierte a Sócrates en el 'hombre más justo de Atenas' y en el acontecimiento fundador de la filosofía platónica."}]},{"id":"fa1-p07","tipo":"desarrollo","enunciado":"Aristóteles: Biología y antropología","variantes":[],"apariciones":["2022 Sep","2023 Feb-1","2024 Sep"],"frecuencia":3,"tema":"Tema IV: Aristóteles","bullets":[{"b":"La biología ocupa gran parte del Corpus (Historia de los animales, Partes, Generación): observación empírica y clasificación de los vivientes.","x":"Aristóteles, hijo de médico, funda la zoología. 'En todas las cosas naturales hay algo maravilloso': dignifica el estudio de los animales frente al desprecio platónico de lo sensible."},{"b":"La vida se explica por el alma (psyché): forma, acto y 'entelécheia primera de un cuerpo natural que tiene la vida en potencia'.","x":"De Anima aplica el hilemorfismo al viviente: el alma no es una sustancia separada (contra el dualismo platónico) sino el principio de organización y actividad del cuerpo; alma y cuerpo son uno como la cera y su figura."},{"b":"Escala de almas: vegetativa (nutrición, reproducción), sensitiva (sensación, deseo, movimiento) e intelectiva; cada nivel integra el anterior.","x":"Plantas, animales y hombre forman una jerarquía continua de funciones vitales (scala naturae). El hombre posee las tres dimensiones."},{"b":"Teoría del conocimiento sensible: la sensación recibe la forma sin la materia; sentido común, imaginación (phantasía) y memoria median hacia el pensar.","x":"Como la cera recibe la figura del sello sin el hierro. 'Nada hay en el intelecto que no haya estado antes en los sentidos': empirismo moderado frente a la anámnesis platónica."},{"b":"El noûs: distinción entre intelecto paciente y agente; el agente es 'separado, impasible, inmortal y eterno' (De Anima III, 5).","x":"El intelecto agente actualiza los inteligibles como la luz los colores. Pasaje de enorme disputa hermenéutica: ¿es lo divino en el hombre, una función del alma o un principio trascendente? Base de las querellas entre comentaristas griegos, árabes y latinos."},{"b":"Antropología: el hombre es el animal que tiene lógos, racional y político; la contemplación (theoría) es su actividad más alta y divina."}]},{"id":"fa1-p08","tipo":"desarrollo","enunciado":"Aristóteles: Política","variantes":[],"apariciones":["2023 Sep","2025 Feb-2","2025 Sep"],"frecuencia":3,"tema":"Tema IV: Aristóteles","bullets":[{"b":"Tesis central: el hombre es por naturaleza animal político (zôon politikón); quien vive fuera de la polis es 'bestia o dios'.","x":"El lógos, que distingue lo justo de lo injusto y lo conveniente de lo dañino, hace al hombre comunitario por esencia, más que cualquier animal gregario. La política no es artificio ni contrato: es naturaleza."},{"b":"Génesis natural de la polis: familia, aldea, ciudad; la polis es anterior por naturaleza al individuo y autosuficiente (autárkeia).","x":"Surge para vivir, pero existe para vivir bien (eû zên). El todo es anterior a la parte: fuera de la comunidad el individuo no realiza su fin."},{"b":"Crítica al comunismo de la República platónica: defensa de la propiedad privada de uso común y de la familia (Política II).","x":"La excesiva unidad destruye la polis, que es por naturaleza una pluralidad; lo común de todos es lo menos cuidado. Método aristotélico: partir de las constituciones reales (recopiló 158)."},{"b":"Clasificación de constituciones: rectas (monarquía, aristocracia, politeia) y desviadas (tiranía, oligarquía, democracia); criterio: gobernar para el bien común.","x":"Cruza el número de gobernantes (uno, pocos, muchos) con el fin (común o particular). La 'democracia' aristotélica es la desviación que gobierna para el interés exclusivo de los pobres."},{"b":"Régimen preferi
