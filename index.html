ble en la práctica: la politeia, mezcla de oligarquía y democracia sustentada en una amplia clase media.","x":"La clase media asegura estabilidad y virtud del término medio; los extremos de riqueza y pobreza engendran facción (stásis) y revoluciones, que Aristóteles analiza en Política V."},{"b":"Ciudadano es quien participa en las funciones judicial y deliberativa; la política, ciencia práctica y arquitectónica; educación pública conforme al régimen."}]},{"id":"fa1-p09","tipo":"desarrollo","enunciado":"Escuela de Mileto: Tales, Anaximandro, Anaxímenes","variantes":[],"apariciones":["2024 Feb-1","2026 Feb-1"],"frecuencia":2,"tema":"Tema I: Presocráticos","bullets":[{"b":"Mileto, Jonia, s. VI a.C.: ciudad comercial y abierta donde nace la filosofía como pregunta racional por la physis y su arché.","x":"Frente a las cosmogonías míticas (Homero, Hesíodo), los milesios buscan un principio natural, único y permanente de todas las cosas, ofreciendo razones públicas y discutibles: crítica y lógos frente a autoridad dogmática."},{"b":"Arché: principio del que todo procede, del que todo está constituido y al que todo retorna; origen, sustrato y gobierno de lo real.","x":"El término lo consagra Aristóteles al reconstruir a sus predecesores como 'físicos' que buscaron causas materiales; hay que leer esa reconstrucción con cautela hermenéutica."},{"b":"Tales: el agua como arché; 'todo está lleno de dioses'; predijo el eclipse de 585 a.C.; primero de los Siete Sabios.","x":"El agua, condición de toda vida, explica la unidad de lo real. Su saber matemático y astronómico (y la anécdota del pozo, o la de los molinos de aceite) lo convierten en figura inaugural del sabio."},{"b":"Anaximandro: el ápeiron, lo indeterminado e ilimitado, inmortal e indestructible, como arché; primer fragmento conservado de la filosofía.","x":"Ningún elemento determinado puede ser principio de sus contrarios. El fragmento dice que las cosas 'se pagan mutuamente pena y retribución por su injusticia según el orden del tiempo': el devenir pensado como justicia cósmica."},{"b":"Audacia cosmológica de Anaximandro: la tierra en equilibrio en el centro sin apoyo; mundos innumerables; origen de los vivientes desde lo húmedo.","x":"Explicación por simetría y razón suficiente, sin soporte mítico: hito del pensamiento racional. Se le atribuye también el primer mapa."},{"b":"Anaxímenes: el aire como arché; la condensación y rarefacción explican cuantitativamente las transformaciones cualitativas.","x":"El aire, divino e ilimitado como el ápeiron pero determinado como el agua de Tales, se hace fuego al rarificarse y viento, nube, agua, tierra y piedra al condensarse. Analogía alma-aliento: 'como nuestra alma, que es aire, nos mantiene unidos, así el soplo envuelve el cosmos'."},{"b":"Rasgos comunes: monismo dinámico e hilozoísmo; la physis es viva y divina; ciencia y teología racional aún no separadas.","x":"Jaeger subraya que estos 'físicos' son también teólogos: lo divino se desplaza del Olimpo antropomórfico al principio inmortal que todo lo gobierna."}]},{"id":"fa1-p10","tipo":"desarrollo","enunciado":"La Filosofía en la Magna Grecia: Pitágoras","variantes":[],"apariciones":["2023 Sep","2025 Sep"],"frecuencia":2,"tema":"Tema I: Presocráticos","bullets":[{"b":"Pitágoras de Samos emigra a Crotona (Magna Grecia): funda una comunidad a la vez religiosa, filosófica, científica y política.","x":"El pitagorismo es un modo de vida (bíos) con reglas, secreto y jerarquía: acusmáticos (oyentes de máximas) y matemáticos (iniciados en la doctrina). Su influencia política provocó revueltas y la dispersión de la escuela."},{"b":"Doctrina del alma: inmortal, de origen divino, encarcelada en el cuerpo (sôma-sêma); transmigración (metempsícosis) y purificación (kátharsis).","x":"De raíz órfica. La novedad pitagórica es que la purificación suprema se logra mediante el saber: la filosofía como forma de salvación, herencia decisiva para Platón (Fedón)."},{"b":"El número como arché: las cosas 'son' números o imitan a los números; proporción, medida y armonía constituyen lo real.","x":"El descubrimiento de las razones numéricas de los intervalos musicales (octava 2:1, quinta 3:2, cuarta 4:3) revela que la estructura de lo real es matemática: primera matematización de la naturaleza."},{"b":"Dualidad de principios: límite (péras) e ilimitado (ápeiron), impar y par; tabla pitagórica de los diez pares de opuestos.","x":"El cosmos surge de la armonización de opuestos. La tetraktýs (1+2+3+4=10), figura sagrada por la que juraban, condensa la generación del número y del cosmos."},{"b":"Cosmología: primeros en llamar 'kósmos' (orden bello) al universo; armonía de las esferas; en Filolao, la tierra gira en torno al Fuego central.","x":"Los astros producen al moverse una música inaudible por habitual. El sistema no geocéntrico de Filolao anticipa audazmente el descentramiento de la tierra."},{"b":"Crisis de los inconmensurables: el descubrimiento de magnitudes irracionales (diagonal del cuadrado, √2) quiebra el dogma de que todo es número entero o razón.","x":"La leyenda atribuye a Hipaso su divulgación y castigo. La crisis obliga a repensar la relación entre aritmética y geometría."},{"b":"Herencia inmensa: matematización del saber, inmortalidad del alma y vida teorética pasan a Platón (Ideas-números, Timeo) y a la ciencia occidental."}]},{"id":"fa1-p11","tipo":"desarrollo","enunciado":"La sofística: causas, caracteres, méritos y representantes","variantes":["La sofística"],"apariciones":["2022 Feb-2","2025 Feb-1"],"frecuencia":2,"tema":"Tema II: Período socrático","bullets":[{"b":"Causas: democracia ateniense tras las Guerras Médicas; la palabra pública decide en asamblea y tribunales; demanda de educación política.","x":"El éxito cívico exige dominar la retórica. Se suma el escepticismo ante las cosmologías contradictorias de los físicos y el conocimiento de otras culturas, que relativiza las costumbres propias."},{"b":"Caracteres: maestros itinerantes que cobran por enseñar la areté política; giro antropológico: del cosmos al hombre, la ciudad y el lenguaje.","x":"Profesionales de la paideía, hacen de la educación una técnica transmisible. La 'ilustración griega': examen crítico de tradición, religión y ley."},{"b":"Tesis de fondo: relativismo y convencionalismo; oposición nómos (ley, convención) / physis (naturaleza); escepticismo sobre la verdad única.","x":"Las leyes y valores no son por naturaleza sino por acuerdo humano, y varían según ciudades: puede enseñarse a defender ambos lados de una causa (discursos dobles)."},{"b":"Protágoras de Abdera: 'el hombre es la medida de todas las cosas' (homo mensura); agnosticismo sobre los dioses.","x":"Cada cosa es para cada cual como le aparece: relativismo que Platón discute en el Teeteto. Sobre los dioses, no puede saberse si existen: la vida es breve y el asunto oscuro."},{"b":"Gorgias de Leontinos: tres tesis del 'Sobre el no-ser' (nada es; si algo fuera, sería incognoscible; si se conociera, sería incomunicable); la retórica como poder del lógos.","x":"Antítesis nihilista de Parménides. En el 'Encomio de Helena' el discurso es 'gran soberano' que persuade y arrastra como un fármaco: descubrimiento del poder autónomo del lenguaje."},{"b":"Otros representantes: Trasímaco (la justicia, lo que conviene al más fuerte), Hipias (polimatía, physis contra nómos), Pródico (sinonimia), Calicles y Antifonte.","x":"En República I y en el Gorgias, Platón dramatiza las tesis del derecho del más fuerte como consecuencia extrema del convencionalismo sofístico."},{"b":"Méritos y crítica: fundan la centralidad del lenguaje, la gramática, la retórica y la educación humanista; Platón les reprocha vender apariencia de saber.","x":"La condena platónica ('cazadores de jóvenes ricos', mercaderes de alimentos del alma) fijó el sentido peyorativo de 'sofista'; la investigación actual (y Hegel, Grote) los rehabilita como ilustrados griegos."}]},{"id":"fa1-p12","tipo":"desarrollo","enunciado":"Platón: el Ser. El mundo de las Ideas","variantes":[],"apariciones":["2023 Sep","2025 Sep"],"frecuencia":2,"tema":"Tema III: Platón","bullets":[{"b":"Dos ámbitos de realidad: mundo inteligible de las Ideas (eterno, inmutable, en sí) y mundo sensible (devenir, copias); síntesis de Parménides y Heráclito.","x":"Al ser pleno de las Ideas corresponde la ciencia (epistéme); al devenir sensible, la opinión (dóxa). Platón salva así la posibilidad del conocimiento universal exigida por las definiciones socráticas."},{"b":"La Idea (eîdos) es esencia, unidad de lo múltiple, modelo (parádeigma), causa y fundamento ontológico de las cosas sensibles.","x":"No es un concepto mental sino la realidad misma en su máximo grado: lo Bello en sí, lo Justo en sí. Las cosas son lo que son por relación a su Idea."},{"b":"Relación entre los dos mundos: participación (méthexis), imitación (mímesis) y presencia (parousía) de las Ideas en las cosas.","x":"El sensible 'aspira' a su modelo sin alcanzarlo nunca (los iguales del Fedón). La dificultad de pensar esta relación alimenta la autocrítica platónica."},{"b":"Jerarquía del mundo inteligible: la Idea del Bien, 'más allá de la esencia' (epékeina tês ousías), sol del mundo inteligible (República VI).","x":"Como el sol da luz, vida y visibilidad, el Bien da ser y cognoscibilidad a las Ideas: principio ontológico y epistemológico supremo, fundamento también de la ética y la política."},{"b":"Autocrítica en el Parménides: aporías de la participación y argumento del 'tercer hombre'; revisión, no abandono, de la teoría.","x":"Si lo grande y las cosas grandes exigen una nueva Idea que los reúna, se abre un regreso al infinito. Los diálogos tardíos responden repensando la comunidad de las Ideas."},{"b":"Sofista: 'parricidio' de Parménides; el no-ser 'es' como diferencia (lo otro); los géneros supremos (ser, movimiento, reposo, mismo, otro) se comunican.","x":"La dialéctica deviene ciencia de la combinación (symploké) de las Ideas, que hace posible el discurso verdadero y falso: respuesta al desafío sofístico."},{"b":"Timeo: el Demiurgo, mirando las Ideas, ordena la chóra informe y engendra el cosmos, 'imagen móvil de la eternidad'.","x":"El mundo sensible queda dignificado como obra bella de una razón artesana: cosmología 'verosímil' que corona la ontología platónica con su cumbre estética."}]},{"id":"fa1-p13","tipo":"desarrollo","enunciado":"Aristóteles: Filosofía primera","variantes":[],"apariciones":["2022 Feb-2","2024 Feb-2"],"frecuencia":2,"tema":"Tema IV: Aristóteles","bullets":[{"b":"La 'ciencia buscada': ciencia del ser en cuanto ser y de sus atributos; a la vez ciencia de los primeros principios y de la sustancia suprasensible.","x":"El título 'Metafísica' es editorial (Andrónico de Rodas). La doble caracterización, ontológica y teológica, genera el problema clásico de la 'ontoteología', hoy discutido por las lecturas inmanentistas y pluralistas (cf. Oñate)."},{"b":"'El ser se dice de muchas maneras', pero en referencia a una unidad: estructura pròs hén hacia la ousía (entidad, sustancia).","x":"Como 'sano' se dice del clima, del síntoma y del cuerpo por referencia a la salud, todas las categorías (cantidad, cualidad, relación...) se dicen ser por referencia a la sustancia. Vía media entre univocidad parmenídea y pura equivocidad."},{"b":"Otros sentidos del ser: por sí y por accidente; según acto y potencia; como verdadero y falso.","x":"La filosofía modal del ente (acto/potencia) es la clave que unifica física y metafísica; la verdad tiene en Aristóteles tres sentidos: en las cosas, en el juicio (adecuación) y en la captación de los indivisibles (contacto del noûs)."},{"b":"Principio de no contradicción: el más firme de todos, indemostrable pero defendible elencticamente contra quien lo niegue (Metafísica IV).","x":"Basta que el adversario diga algo con significado para refutarlo: quien lo niega en serio queda reducido al silencio de la planta."},{"b":"Investigación de la ousía (Metafísica VII-IX): crítica a las Ideas separadas de Platón; ni el universal ni el sustrato indeterminado son sustancia; la sustancia primera es el eîdos como esencia y causa del compuesto.","x":"El eîdos-alma, forma inmanente, es causa primera del ser de cada compuesto e universal 'por ser primero', no por abstracción: los problemas 'esencia-universal' y 'esencia-individuo' están en el corazón de la Metafísica."},{"b":"Teología (Metafísica XII): sustancia eterna e inmóvil; el Primer Motor, acto puro sin materia, mueve como fin, 'como lo amado'.","x":"Su vida es la mejor: pensamiento que se piensa a sí mismo (nóesis noéseos). De él 'penden el cielo y la naturaleza'."},{"b":"Discusión hermenéutica actual: ¿un solo dios trascendente o pluralidad de motores y unidad solo focal? Lectura teológica frente a lectura inmanente pluralista.","x":"La guía de la asignatura subraya la 'crítica y reformulación de la lectura teológica' y la unidad de los principios: los 14 lógoi de la Metafísica como llave hermenéutica del Corpus."}]},{"id":"fa1-p14","tipo":"desarrollo","enunciado":"Escuelas socráticas menores","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema II: Período socrático","bullets":[{"b":"Tras la muerte de Sócrates (399 a.C.), varios discípulos fundan escuelas que radicalizan, cada una, un solo aspecto del maestro.","x":"Se llaman 'menores' frente a la Academia platónica. Todas combinan el legado socrático con influencias eleáticas o sofísticas, y preparan las grandes éticas helenísticas."},{"b":"Escuela de Megara (Euclides): fusiona a Sócrates con Elea; el Bien es Uno, con muchos nombres; dialéctica erística y paradojas.","x":"Solo el Ser-Bien es real. Sus lógicos (Eubúlides: el Mentiroso, el montón; Diodoro Crono: argumento dominador) hacen aportes decisivos a la lógica, luego recogidos por los estoicos."},{"b":"Escuela cínica (Antístenes; Diógenes de Sinope): la virtud basta para la felicidad; autarquía, ascesis y desvergüenza (anaídeia) contra las convenciones.","x":"Vivir 'conforme a la naturaleza' y 'falsificar la moneda' de los valores: cosmopolitismo ('soy ciudadano del mundo'), pobreza voluntaria y libertad de palabra (parresía). Antístenes niega además la predicación y las Ideas platónicas."},{"b":"Escuela cirenaica (Aristipo de Cirene): hedonismo; el placer presente, corporal y en movimiento, es el fin; sabiduría como dominio del placer.","x":"'Poseo, no soy poseído'. Solo conocemos nuestras afecciones (subjetivismo). Evolución interna: Teodoro el ateo, Hegesias ('persuasor de la muerte'), Anníceris."},{"b":"Escuelas de Elis (Fedón) y de Eretria (Menedemo): continúan la dialéctica ética socrática; escasa documentación.","x":"Fedón, el interlocutor del diálogo platónico sobre la inmortalidad del alma, fundó la escuela de Elis, después trasladada a Eretria por Menedemo."},{"b":"Proyección helenística: del cinismo nace el estoicismo (Zenón, discípulo de Crates); el hedonismo cirenaico prepara a Epicuro; Megara alimenta la lógica estoica."}]},{"id":"fa1-p15","tipo":"desarrollo","enunciado":"Platón: Hacia el Absoluto (el camino de la ciencia)","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema III: Platón","bullets":[{"b":"Pregunta rectora: cómo asciende el alma desde la opinión (dóxa) hasta la ciencia (epistéme) del Ser y del Bien: el camino de la ciencia.","x":"Junto al camino del amor (Banquete) y al del ascetismo purificador (Fedón), la vía cognoscitiva de la República conduce 'hacia el Absoluto': los tres caminos convergen en el mismo ascenso del alma."},{"b":"Símil de la línea (República VI): dos grados de dóxa (eikasía, pístis) y dos de epistéme (diánoia, nóesis), según sus objetos.","x":"A imágenes y cosas sensibles corresponden conjetura y creencia; a los entes matemáticos, el pensamiento discursivo que usa hipótesis y figuras; a las Ideas, la inteligencia pura."},{"b":"La dialéctica, ciencia suprema: asciende de hipótesis en hipótesis hasta el principio no hipotético, la Idea del Bien, y desciende sin apoyo sensible.","x":"Solo el dialéctico da razón (lógon didónai) de lo que sabe. Las matemáticas son propedéutica necesaria pero insuficiente: 'sueñan con el ser' porque no interrogan sus hipótesis."},{"b":"Alegoría de la caverna (República VII): la educación como liberación y conversión (periagogé) del alma entera desde las sombras hacia el sol-Bien.","x":"Síntesis dramática de ontología, epistemología, paideía y política: el liberado debe volver a la caverna a gobernar, aun con riesgo de muerte, alusión transparente a Sócrates."},{"b":"Conocer es recordar (anámnesis): el alma inmortal contempló las Ideas; el esclavo del Menón y los argumentos del Fedón.","x":"La reminiscencia explica el aprendizaje como reactivación de un saber latente mediante el interrogatorio: versión ontológica de la mayéutica socrática y prueba de la inmortalidad del alma."},{"b":"Culminación: el Bien, 'más allá de la esencia', principio del ser y del conocer; el saber supremo es a la vez fundamento ético-político."}]},{"id":"fa1-p16","tipo":"desarrollo","enunciado":"Aristóteles: Astronomía (astrología) y teología","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema IV: Aristóteles","bullets":[{"b":"Cosmos aristotélico: finito, único, eterno y geocéntrico; dos regiones: sublunar (cuatro elementos, generación y corrupción) y supralunar (éter incorruptible).","x":"En el cielo solo hay movimiento circular, perfecto y eterno, del quinto elemento (éter). La física terrestre y la celeste obedecen así a principios distintos, unificados por la doctrina del movimiento."},{"b":"Astronomía de esferas homocéntricas: asume y corrige a Eudoxo y Calipo; unas 47-55 esferas movidas por motores inmóviles (Metafísica XII, 8).","x":"Cada movimiento celeste eterno exige un motor inmóvil propio: de ahí el debate sobre la pluralidad de motores frente a la unicidad del Primero."},{"b":"Argumento teológico: la cadena de movimientos eternos exige un Primer Motor inmóvil, eterno, sin materia ni potencia: acto puro.","x":"Física VIII y Metafísica XII: si todo motor movido depende de otro, debe haber un primero no movido; el movimiento y el tiempo son eternos, luego su principio también."},{"b":"El Primer Motor mueve sin moverse, como causa final: 'mueve como lo amado' (hos erómenon); el cielo lo imita con su rotación eterna.","x":"No es creador ni eficiente al modo del Demiurgo platónico: el mundo es eterno y tiende hacia dios como hacia su fin y bien supremo."},{"b":"Vida divina: pensamiento que se piensa a sí mismo (nóesis noéseos); actividad contemplativa perfecta, felicísima y continua.","x":"Dios no puede pensar nada inferior a sí; su vida es la que nosotros solo alcanzamos por momentos en la theoría. 'De tal principio penden el cielo y la naturaleza'."},{"b":"Problema hermenéutico: ¿teología trascendente (lectura ontoteológica) o divinidad inmanente y plural de los principios? Debate actual sobre Metafísica XII.","x":"La lectura teologizante (tradición medieval) es discutida hoy por interpretaciones inmanentistas y pluralistas como la de Teresa Oñate, atenta a la unidad focal y a los límites del ser-acción."}]}],"cards":[{"id":"fa1-c01","tema":"Tema I","front":"¿Qué significa 'arché'?","back":"Principio originario: aquello de lo que todo procede, de lo que está constituido y a lo que retorna; origen, sustrato y gobierno de lo real. Término consagrado por Aristóteles."},{"id":"fa1-c02","tema":"Tema I","front":"¿Qué es la 'physis'?","back":"La naturaleza como brotar y desplegarse de lo real desde sí mismo; objeto de la pregunta de los primeros filósofos jonios ('Sobre la naturaleza')."},{"id":"fa1-c03","tema":"Tema I","front":"Arché de Tales","back":"El agua: condición de toda vida y unidad de lo real. Además: 'todo está lleno de dioses'; predijo el eclipse de 585 a.C."},{"id":"fa1-c04","tema":"Tema I","front":"El 'ápeiron' de Anaximandro","back":"Lo indeterminado-ilimitado, inmortal e indestructible, arché de todo: ningún elemento determinado puede originar sus contrarios. Suyo es el primer fragmento conservado (la 'injusticia' de las cosas)."},{"id":"fa1-c05","tema":"Tema I","front":"Arché y mecanismo de cambio en Anaxímenes","back":"El aire: por rarefacción se hace fuego; por condensación, viento, nube, agua, tierra y piedra. Primera explicación cuantitativa de las diferencias cualitativas."},{"id":"fa1-c06","tema":"Tema I","front":"¿Qué es el hilozoísmo milesio?","back":"La materia-physis es viva y divina por sí misma: no hay distinción entre materia inerte y fuerza vital. Rasgo común de los monistas jonios."},{"id":"fa1-c07","tema":"Tema I","front":"Arché pitagórico","back":"El número: las cosas son números o los imitan. Armonía, medida y proporción constituyen el cosmos, como muestran las razones numéricas de los intervalos musicales."},{"id":"fa1-c08","tema":"Tema I","front":"Metempsícosis","back":"Transmigración del alma inmortal por sucesivos cuerpos (doctrina órfico-pitagórica). El cuerpo es cárcel (sôma-sêma); la filosofía purifica (kátharsis) y libera."},{"id":"fa1-c09","tema":"Tema I","front":"Acusmáticos y matemáticos","back":"Dos grados de la comunidad pitagórica: oyentes que reciben máximas sin demostración, e iniciados que conocen las doctrinas y demostraciones."},{"id":"fa1-c10","tema":"Tema I","front":"La 'tetraktýs'","back":"Figura sagrada pitagórica: 1+2+3+4=10; condensa la generación del número y del cosmos. Por ella juraban los miembros de la comunidad."},{"id":"fa1-c11","tema":"Tema I","front":"El lógos de Heráclito","back":"Ley-razón común que gobierna el devenir: unidad de los opuestos en tensión ('pólemos, padre de todas las cosas'). Símbolo: el fuego, siempre vivo, que se enciende y apaga según medida."},{"id":"fa1-c12","tema":"Tema I","front":"¿Por qué Heráclito es 'monismo dinámico'?","back":"Lo Uno es la armonía tensa de los contrarios en devenir constante ('todo fluye'; el río). La unidad no excluye sino que exige el conflicto y el cambio."},{"id":"fa1-c13","tema":"Tema I","front":"Crítica religiosa de Jenófanes","back":"Contra el antropomorfismo de Homero y Hesíodo: cada pueblo pinta dioses a su imagen. Hay un dios supremo, no antropomórfico, que todo lo mueve con su mente."},{"id":"fa1-c14","tema":"Tema I","front":"Las dos vías de Parménides","back":"Vía de la verdad (alétheia): 'el ser es y no puede no ser'. Vía de la opinión (dóxa): mundo del devenir según los mortales. El no-ser es impensable e indecible."},{"id":"fa1-c15","tema":"Tema I","front":"Sémata (signos) del ser parmenídeo","back":"Ingénito, imperecedero, uno, continuo, homogéneo, inmóvil, completo y limitado como esfera perfecta. Se deducen del solo 'es'."},{"id":"fa1-c16","tema":"Tema I","front":"'Lo mismo es pensar y ser'","back":"Identidad parmenídea de noeîn y eînai: solo lo que es puede pensarse y decirse. El lógos, no los sentidos, decide sobre la realidad."},{"id":"fa1-c17","tema":"Tema I","front":"Aporías de Zenón","back":"Argumentos contra movimiento y pluralidad por reducción al absurdo: dicotomía, Aquiles y la tortuga, flecha, estadio. Defienden a Parménides; Aristóteles lo llama inventor de la dialéctica."},{"id":"fa1-c18","tema":"Tema I","front":"Aportación de Meliso de Samos","back":"Reformula el ser parmenídeo: ilimitado (no podría limitar con el no-ser), eterno en el tiempo e incorpóreo."},{"id":"fa1-c19","tema":"Tema I","front":"Principios de Empédocles","back":"Cuatro raíces eternas (fuego, aire, agua, tierra) mezcladas por Amor (Philía) y separadas por Odio (Neîkos), en ciclo cósmico entre el Esfero y la dispersión."},{"id":"fa1-c20","tema":"Tema I","front":"Homeomerías y Noûs de Anaxágoras","back":"'En todo hay parte de todo': infinitas semillas cualitativas. El Noûs, inteligencia pura y separada, inicia el remolino y ordena la mezcla. Sócrates le reprocha no usarlo teleológicamente."},{"id":"fa1-c21","tema":"Tema I","front":"Ontología atomista (Leucipo y Demócrito)","back":"Átomos: ser lleno, indivisible, eterno, infinito en número; difieren por figura, orden y posición. El vacío: no-ser que 'es', condición del movimiento. Todo por necesidad (anánke)."},{"id":"fa1-c22","tema":"Tema I","front":"Los dos conocimientos según Demócrito","back":"Conocimiento 'oscuro' (sentidos: cualidades por convención) y 'legítimo' (razón: átomos y vacío). Su ética: eutimía, buen ánimo por la mesura."},{"id":"fa1-c23","tema":"Tema II","front":"¿Qué fue la sofística?","back":"Ilustración griega del s. V: maestros itinerantes que cobraban por enseñar la areté política y la retórica. Giro antropológico, relativismo, convencionalismo, centralidad del lenguaje."},{"id":"fa1-c24","tema":"Tema II","front":"'Homo mensura' de Protágoras","back":"'El hombre es la medida de todas las cosas': cada cosa es para cada cual como le aparece. Relativismo discutido por Platón en el Teeteto. Además, agnosticismo religioso."},{"id":"fa1-c25","tema":"Tema II","front":"Oposición nómos / physis","back":"Ley-convención frente a naturaleza: para muchos sofistas, leyes y valores son acuerdos humanos variables, no realidades naturales. Eje del debate moral y político del s. V."},{"id":"fa1-c26","tema":"Tema II","front":"Las tres tesis de Gorgias","back":"Nada es; si algo fuera, sería incognoscible; si se conociera, sería incomunicable ('Sobre el no-ser'). El lógos, 'gran soberano': la retórica como poder de persuasión."},{"id":"fa1-c27","tema":"Tema II","front":"La justicia según Trasímaco","back":"'Lo que conviene al más fuerte': las leyes las dicta el poder en su propio interés (República I). Extremo del convencionalismo sofístico."},{"id":"fa1-c28","tema":"Tema II","front":"Ironía socrática","back":"Fingida ignorancia ('solo sé que no sé nada') con la que Sócrates interroga y desmonta el falso saber del interlocutor: primer momento, negativo, del método."},{"id":"fa1-c29","tema":"Tema II","front":"Mayéutica","back":"'Arte de partear' almas: mediante preguntas, el interlocutor da a luz por sí mismo la verdad que lleva dentro. Momento positivo del método socrático, tras la refutación (élenchos)."},{"id":"fa1-c30","tema":"Tema II","front":"Intelectualismo moral socrático","back":"La virtud es conocimiento y el vicio ignorancia: nadie obra mal a sabiendas. Por eso la virtud puede enseñarse y es una; tarea central: el cuidado del alma."},{"id":"fa1-c31","tema":"Tema II","front":"¿Qué atribuye Aristóteles a Sócrates?","back":"Dos cosas: los razonamientos inductivos y la definición universal (tí esti) en el ámbito moral. Germen de la teoría platónica de las Ideas."},{"id":"fa1-c32","tema":"Tema II","front":"Fuentes para conocer a Sócrates","back":"No escribió nada. Fuentes: Platón (la principal), Jenofonte, Aristófanes (caricatura en 'Las Nubes') y Aristóteles. Es la 'cuestión socrática'."},{"id":"fa1-c33","tema":"Tema II","front":"El 'daimonion' de Sócrates","back":"Voz o señal divina interior que solo disuade, nunca ordena. Vinculada a su misión, avalada por el oráculo de Delfos; base de la acusación de impiedad."},{"id":"fa1-c34","tema":"Tema II","front":"Escuela cínica: fundador y tesis","back":"Antístenes (y Diógenes de Sinope): la virtud basta para la felicidad; autarquía, ascesis, cosmopolitismo y desprecio de las convenciones. Precedente del estoicismo."},{"id":"fa1-c35","tema":"Tema II","front":"Escuela cirenaica: fundador y tesis","back":"Aristipo de Cirene: hedonismo; el fin es el placer presente y corporal, dominado por la sabiduría ('poseo, no soy poseído'). Prepara el debate con Epicuro."},{"id":"fa1-c36","tema":"Tema II","front":"Escuela de Megara","back":"Euclides de Megara: fusión de Sócrates y Elea; el Bien es Uno con muchos nombres. Dialéctica erística y paradojas lógicas (Eubúlides, Diodoro Crono)."},{"id":"fa1-c37","tema":"Tema III","front":"¿Qué es una Idea (eîdos) platónica?","back":"Realidad eterna, inmutable, inteligible y separada: esencia y modelo (parádeigma) de las cosas sensibles, que son por participación en ella. No es un concepto mental."},{"id":"fa1-c38","tema":"Tema III","front":"Participación y mímesis","back":"Modos de relación entre sensible e inteligible: las cosas participan (méthexis) de las Ideas o las imitan (mímesis) como copias de su modelo. Su dificultad motiva la autocrítica del Parménides."},{"id":"fa1-c39","tema":"Tema III","front":"La Idea del Bien","back":"Sol del mundo inteligible: da ser y cognoscibilidad a las Ideas, estando 'más allá de la esencia' (epékeina tês ousías). Principio supremo ontológico, epistemológico y político (República VI)."},{"id":"fa1-c40","tema":"Tema III","front":"Los cuatro grados de la línea dividida","back":"Dóxa: eikasía (imágenes) y pístis (cosas sensibles). Epistéme: diánoia (matemáticas, por hipótesis) y nóesis (Ideas, dialéctica). República VI."},{"id":"fa1-c41","tema":"Tema III","front":"Sentido de la alegoría de la caverna","back":"La educación como liberación y conversión (periagogé) del alma desde las sombras (dóxa) hasta el sol-Bien; y el deber político del filósofo de volver a la caverna."},{"id":"fa1-c42","tema":"Tema III","front":"Anámnesis","back":"Conocer es recordar: el alma inmortal contempló las Ideas antes de encarnarse; el aprendizaje reactiva ese saber mediante preguntas (esclavo del Menón, Fedón)."},{"id":"fa1-c43","tema":"Tema III","front":"La dialéctica platónica","back":"Ciencia suprema: asciende sin apoyo sensible de hipótesis en hipótesis hasta el principio no hipotético (el Bien); en los diálogos tardíos, arte de la combinación y división de las Ideas."},{"id":"fa1-c44","tema":"Tema III","front":"Las tres partes del alma en Platón","back":"Racional (sabiduría), irascible (valor), concupiscible (templanza); la justicia es su armonía. Símil del carro alado (Fedro); paralelo con las tres clases de la ciudad."},{"id":"fa1-c45","tema":"Tema III","front":"Tesis del filósofo-rey","back":"No cesarán los males de las ciudades hasta que gobiernen los filósofos o filosofen los gobernantes: solo quien conoce el Bien puede ordenar la polis (República V)."},{"id":"fa1-c46","tema":"Tema III","front":"Degeneración de los regímenes (República VIII)","back":"Aristocracia → timocracia → oligarquía → democracia → tiranía. Cada régimen corresponde a un tipo de alma; el tirano es el alma más esclava e infeliz."},{"id":"fa1-c47","tema":"Tema III","front":"El Demiurgo del Timeo","back":"Artesano divino que, mirando las Ideas, ordena la chóra (receptáculo informe) y engendra el cosmos, bello y viviente. No crea de la nada: ordena."},{"id":"fa1-c48","tema":"Tema III","front":"'Imagen móvil de la eternidad'","back":"Definición platónica del tiempo en el Timeo: el Demiurgo crea el tiempo con el cielo como imitación móvil, según el número, de la eternidad inmóvil."},{"id":"fa1-c49","tema":"Tema III","front":"Argumento del 'tercer hombre'","back":"Aporía del Parménides: si las cosas grandes y la Idea de lo Grande se parecen, exigen una tercera Idea común, y así al infinito. Motiva la revisión de la teoría de las Ideas."},{"id":"fa1-c50","tema":"Tema III","front":"El 'parricidio de Parménides' (Sofista)","back":"Platón admite que el no-ser 'es' en cierto modo: como diferencia (lo otro). Así explica la falsedad del discurso y la comunicación de los géneros supremos."},{"id":"fa1-c51","tema":"Tema III","front":"La escala del amor (Banquete)","back":"Ascenso erótico enseñado por Diotima: de un cuerpo bello a todos, a las almas, las leyes, las ciencias, hasta lo Bello en sí. Eros, hijo de Poros y Penía, es filósofo."},{"id":"fa1-c52","tema":"Tema IV","front":"El Corpus aristotelicum y su transmisión","back":"Obras exotéricas (diálogos, perdidas) y acroamáticas o esotéricas (apuntes de escuela, conservadas). Editadas por Andrónico de Rodas (s. I a.C.), que acuñó 'Metafísica'."},{"id":"fa1-c53","tema":"Tema IV","front":"'El ser se dice de muchas maneras'","back":"Tesis antiparmenídea: el ser no es unívoco ni equívoco, sino análogo, dicho en referencia a uno (pròs hén): todas las categorías remiten a la ousía."},{"id":"fa1-c54","tema":"Tema IV","front":"¿Qué es la ousía?","back":"La entidad o sustancia: sentido primero del ser, sujeto último de predicación y esencia. Sustancia primera: el individuo concreto (Categorías); como eîdos-esencia, causa primera del compuesto (Metafísica VII)."},{"id":"fa1-c55","tema":"Tema IV","front":"Hilemorfismo","back":"Todo ser natural es compuesto de materia (hýle) y forma (eîdos/morphé). La forma es acto y esencia; la materia, potencia y sustrato del cambio."},{"id":"fa1-c56","tema":"Tema IV","front":"Acto y potencia","back":"Dýnamis: capacidad de ser o llegar a ser; enérgeia/entelécheia: realización actual. Con esta distinción Aristóteles piensa el cambio sin violar a Parménides. El acto es anterior a la potencia."},{"id":"fa1-c57","tema":"Tema IV","front":"Las cuatro causas","back":"Material (de qué), formal (qué es), eficiente (de dónde el movimiento) y final (para qué). Conocer científicamente es conocer por causas; en la naturaleza prima el fin."},{"id":"fa1-c58","tema":"Tema IV","front":"Definición aristotélica de movimiento","back":"'Acto de lo que está en potencia en cuanto que está en potencia' (Física III): actualización imperfecta e inacabada de la potencia mientras dura el proceso."},{"id":"fa1-c59","tema":"Tema IV","front":"Definición aristotélica de tiempo","back":"'Número del movimiento según lo anterior y lo posterior' (Física IV): el tiempo no es el movimiento, sino su aspecto numerable por el alma."},{"id":"fa1-c60","tema":"Tema IV","front":"El Primer Motor inmóvil","back":"Sustancia eterna, inmaterial, acto puro sin potencia; mueve sin moverse como causa final, 'como lo amado'. Su vida: pensamiento que se piensa (nóesis noéseos). Metafísica XII."},{"id":"fa1-c61","tema":"Tema IV","front":"El alma según Aristóteles","back":"'Entelécheia primera de un cuerpo natural organizado que tiene la vida en potencia': forma y acto del cuerpo, no sustancia separada. Contra el dualismo platónico."},{"id":"fa1-c62","tema":"Tema IV","front":"Los tres tipos de alma","back":"Vegetativa (nutrición, reproducción), sensitiva (sensación, deseo, movimiento) e intelectiva (pensar). Cada nivel superior integra las funciones del inferior."},{"id":"fa1-c63","tema":"Tema IV","front":"Intelecto agente y paciente","back":"El paciente recibe las formas inteligibles; el agente las actualiza 'como la luz'. El agente es 'separado, impasible, inmortal y eterno' (De Anima III,5): pasaje de máxima disputa hermenéutica."},{"id":"fa1-c64","tema":"Tema IV","front":"'Zôon politikón'","back":"El hombre es por naturaleza animal político: el lógos le permite deliberar sobre lo justo y lo conveniente. La polis es anterior por naturaleza al individuo y busca el vivir bien."},{"id":"fa1-c65","tema":"Tema IV","front":"Constituciones rectas y desviadas","back":"Rectas (buscan el bien común): monarquía, aristocracia, politeia. Desviadas (interés propio): tiranía, oligarquía, democracia. Régimen preferible en la práctica: politeia con amplia clase media."},{"id":"fa1-c66","tema":"Tema IV","front":"Los tres sentidos de la verdad en Aristóteles","back":"Verdad de las cosas (ser como verdadero), verdad del juicio (adecuación en la síntesis predicativa) y verdad de los indivisibles (contacto intuitivo del noûs, sin falsedad posible)."},{"id":"fa1-c67","tema":"Tema IV","front":"Principio de no contradicción","back":"'Es imposible que lo mismo se dé y no se dé a la vez en lo mismo y según lo mismo': el principio más firme, indemostrable pero defendible por refutación (Metafísica IV)."},{"id":"fa1-c68","tema":"Tema IV","front":"Mundo sublunar y supralunar","back":"Sublunar: cuatro elementos, generación y corrupción, movimientos rectilíneos. Supralunar: éter incorruptible, movimiento circular eterno de las esferas. Cosmos finito, único, eterno y geocéntrico."},{"id":"fa1-c69","tema":"Tema IV","front":"Filosofía primera frente a filosofía segunda","back":"Filosofía primera (metafísica): ciencia del ser en cuanto ser y de la sustancia inmóvil. Filosofía segunda (física): ciencia del ser en movimiento. La biología estudia el viviente."},{"id":"fa1-c70","tema":"Tema IV","front":"Crítica aristotélica a las Ideas platónicas","back":"Las Ideas separadas duplican inútilmente el mundo, no explican movimiento ni conocimiento de lo sensible (argumento del tercer hombre). La forma es inmanente: el universal no es sustancia."}]},{"id":"antropologia1","nombre":"Antropología Social I","nombreCorto":"Antropología","formatoExamen":"Examen presencial de desarrollo: 2 preguntas breves (2,5 puntos cada una) + 1 tema transversal (5 puntos). 120 minutos, sin material. Extensión máxima: 4 caras de folio en total. El tema puede ser también comentario de texto o análisis de un ejemplo etnográfico. PEC voluntaria: +1 punto.","temas":["Tema 1: Definición y objeto de la antropología (cultura, relativismo, deontología)","Tema 2: Método y teorías en antropología (etnografía, trabajo de campo)","Tema 3: La construcción sociocultural de las diferencias (raza, etnicidad, identidad/alteridad)","Tema 4: Lenguaje, comunicación y cognición","Tema 5: Antropología simbólica (religión, mito, ritual, arte)","Tema 6: Cultura urbana"],"preguntas":[{"id":"an1-p01","tipo":"desarrollo","enunciado":"¿Qué tipos de 'relativismo' diferencia M. Brown en su artículo sobre el alcance de éste en la antropología actual? Proporciona alguna definición para cada uno de ellos, comentando la diversa consideración que al autor le merecen las diferentes clases de relativismo.","variantes":["Siguiendo las distinciones de M. Brown, presenta, a partir de un ejemplo propio, la diferencia entre el relativismo cognitivo y el metodológico"],"apariciones":["2023 Feb-1","2024 Feb-1","2024 Sep","2025 Feb-2"],"frecuencia":4,"tema":"Tema 1: Definición y objeto de la antropología","bullets":[{"b":"Brown ('Relativismo 2.0') distingue tres relativismos: cognitivo (o epistemológico), moral (o ético) y metodológico.","x":"Su propósito es rescatar un relativismo moderado y útil frente a sus caricaturas: ni 'todo vale' ni existe un único patrón universal desde el que juzgar todas las culturas."},{"b":"Relativismo cognitivo: cada cultura tendría su propia racionalidad inconmensurable; Brown lo rechaza por insostenible.","x":"Si cada cultura tuviera una lógica radicalmente distinta, la traducción y la comparación serían imposibles; pero la práctica etnográfica demuestra que la comprensión intercultural funciona."},{"b":"Relativismo moral: los juicios éticos solo valen dentro de cada cultura; su versión fuerte impide condenar prácticas dañinas.","x":"Brown lo considera problemático frente a los derechos humanos: comprender la ablación o la violencia en su contexto no equivale a justificarlas. El antropólogo puede comprender sin aprobar."},{"b":"Relativismo metodológico: suspender temporalmente el juicio propio para entender cada práctica en su contexto; Brown lo defiende plenamente.","x":"Es una herramienta heurística del trabajo de campo, no una postura moral: primero comprender, después valorar. Constituye el núcleo sano y vigente del oficio antropológico."},{"b":"Ejemplo: analizar un sacrificio ritual suspendiendo el juicio (metodológico) sin sostener que su lógica sea intraducible (cognitivo).","x":"El etnógrafo describe qué significa el sacrificio para los participantes; ello no le obliga a afirmar que la racionalidad local sea incomparable con la ciencia, ni a aprobarlo moralmente."},{"b":"Conclusión: Brown propone un relativismo 'en dosis moderadas', antídoto del etnocentrismo y compatible con los derechos humanos."}]},{"id":"an1-p02","tipo":"desarrollo","enunciado":"TEMA: Explica los conceptos principales que hayas aprendido a lo largo del tema IV (Lenguaje, comunicación y cognición), señalando cuál es su relevancia para la comprensión de los procesos culturales. Utiliza las lecturas obligatorias sobre la comunicación no verbal, las categorías etnocientíficas y los relatos sobre globalidad y movilidad para mostrar tu apropiación productiva de las ideas de esos autores.","variantes":["TEMA: Aplica los conceptos principales que hayas aprendido a lo largo del tema IV ('Lenguaje, Comunicación y Cognición') a algún fenómeno cultural de tu entorno, especificando ("],"apariciones":["2023 Feb-2","2024 Feb-2","2025 Feb-2","2026 Feb-1"],"frecuencia":4,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Kottak: el lenguaje humano se distingue por productividad y desplazamiento; debate Sapir-Whorf (la lengua moldea el pensamiento) versus Chomsky (gramática universal innata).","x":"La versión fuerte del determinismo lingüístico está descartada; hoy se acepta una influencia mutua: la cultura también moldea la lengua, como muestra el vocabulario focal."},{"b":"Sociolingüística: el habla varía con clase y género; Labov (fonema /r/ en Nueva York) y Bourdieu (capital simbólico).","x":"Ninguna variante es lingüísticamente superior: su prestigio es social. La evaluación del habla reproduce la estratificación: hablar 'bien' funciona como capital en mercados simbólicos como escuela o empleo."},{"b":"Hall y Hall ('El sonido del silencio'): comunicación no verbal, proxémica y 'burbuja personal'; culturas de contexto alto y bajo.","x":"Gran parte de la comunicación es inconsciente y culturalmente pautada: distancias, gestos, silencios. Los malentendidos interculturales surgen de estas gramáticas invisibles del espacio y el tiempo."},{"b":"Díaz de Rada y Cruces (etnociencia): cada cultura ordena el mundo mediante clasificaciones; taxonomías (jerarquía de inclusión) y paradigmas (cruce de dimensiones).","x":"'El orden del sentido y el sentido del orden': las categorías nativas revelan la lógica cognitiva local; clasificar es una actividad universal con contenidos culturales variables."},{"b":"Pratt ('¿Por qué la Virgen de Zapopan fue a Los Ángeles?'): crítica de los grandes relatos de la globalización; movilidad vista desde abajo.","x":"Frente al mito del flujo homogéneo y sin fronteras, Pratt muestra movilidades concretas y desiguales: la Virgen viaja siguiendo a sus migrantes, que reconstruyen comunidad transnacional."},{"b":"Relevancia: lenguaje, cuerpo y clasificación organizan culturalmente la experiencia; analizar la comunicación es analizar la cultura en acción.","x":"Un buen cierre aplica estos conceptos a un fenómeno propio (por ejemplo, WhatsApp, jerga juvenil o un mercado) integrando a los cuatro autores citados."}]},{"id":"an1-p03","tipo":"desarrollo","enunciado":"Explica, siguiendo a Kottak, el concepto de estratificación social en el habla. Menciona investigaciones al respecto, como las de Labov en sociolingüística sobre la pronunciación neoyorquina del fonema 'r'. ¿A qué hace referencia el concepto de Bourdieu de 'capital simbólico'?","variantes":["Explica mediante ejemplos, siguiendo a Kottak, algunos de los hallazgos de los profesionales de la Sociolingüística (en particular, W. Labov y P. Bourdieu) sobre las relaciones entre el habla y la estratificación social"],"apariciones":["2022 Sep","2023 Feb-1","2025 Feb-2"],"frecuencia":3,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"La sociolingüística estudia la variación del habla en su contexto social: no hablamos igual según clase, situación o interlocutor."},{"b":"Labov (grandes almacenes de Nueva York): la pronunciación de la /r/ posvocálica aumenta con el estatus del establecimiento.","x":"Comparó Saks (alto), Macy's (medio) y S. Klein (bajo) preguntando por la 'fourth floor'. Los empleados de tiendas de más prestigio pronunciaban más la /r/, variante entonces prestigiosa."},{"b":"Ninguna variante lingüística es intrínsecamente mejor: su valor es social, atribuido por la posición de quienes la usan.","x":"Kottak insiste: el habla estándar no es superior gramaticalmente; se prestigia porque la usan los grupos dominantes. Juzgar el habla es juzgar socialmente al hablante."},{"b":"Los hablantes de estatus intermedio tienden a la hipercorrección, imitando y exagerando las formas de prestigio."},{"b":"Bourdieu: capital simbólico = prestigio y reconocimiento acumulados que otorgan poder; el habla legítima es capital lingüístico.","x":"Las prácticas lingüísticas valen en 'mercados simbólicos' (escuela, empleo, administración) donde domina la lengua legítima; los desposeídos de ella sufren violencia simbólica y aceptan como natural esa jerarquía."},{"b":"Conclusión: la estratificación del habla refleja y a la vez reproduce la estratificación social."}]},{"id":"an1-p04","tipo":"desarrollo","enunciado":"Explica, siguiendo a Kottak y por medio de ejemplos de tu entorno cotidiano, los conceptos de 'etnicidad', 'raza' y 'raza social'.","variantes":["¿En qué consiste según Kottak el fenómeno de la etnicidad? Menciona alguno de los ejemplos que ofrece en su texto"],"apariciones":["2022 Feb-1","2024 Feb-1","2025 Sep"],"frecuencia":3,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Etnicidad: identificación con un grupo étnico por origen, lengua, religión, historia o territorio compartidos, y exclusión de otros grupos.","x":"Se basa en similitudes percibidas entre los miembros y diferencias frente a los demás. Es situacional y flexible: se activa o se difumina según el contexto ('cambio de estatus')."},{"b":"La etnicidad es procesual y relacional, no una esencia: puede ser reivindicada, atribuida o impuesta (minorías, mayorías, discriminación).","x":"Ejemplos de Kottak: hispanos/latinos en EE.UU., afroamericanos; ejemplos cercanos: identidades gitana, vasca o catalana, activadas de forma distinta según la situación."},{"b":"Raza: carece de validez biológica; no existen razas humanas como subespecies discretas.","x":"La variación fenotípica es clinal (gradual) y hay más variación genética dentro de cada grupo que entre grupos. Rasgos como el color de piel responden a adaptación (selección) y no covarían en 'paquetes' raciales."},{"b":"Raza social: categoría racial construida culturalmente, asumida como natural; cada sociedad clasifica de forma distinta.","x":"Es una etnicidad a la que se atribuye erróneamente base biológica. Prueba de su arbitrariedad: la misma persona es clasificada de forma distinta en EE.UU., Brasil o Japón."},{"b":"Ejemplos de Kottak: hipodescendencia en EE.UU. (una gota de sangre), continuo fenotípico brasileño, burakumin en Japón.","x":"En EE.UU. el hijo de pareja mixta se adscribe automáticamente al grupo minoritario; en Brasil existen decenas de términos fenotípicos que pueden variar incluso entre hermanos; los burakumin son fenotípicamente indistinguibles pero segregados."},{"b":"Ejemplo cotidiano: llamar 'inmigrante' al vecino racializado nacido en España muestra cómo la raza social etniza y excluye."}]},{"id":"an1-p05","tipo":"desarrollo","enunciado":"Enumera y explica, siguiendo a Kottak, las dimensiones fundamentales del concepto de cultura.","variantes":["Enumera y explica, siguiendo a Kottak, las dimensiones fundamentales del concepto de cultura. A continuación, argumenta si la práctica conocida como 'botellón' se puede analizar o no a través de este concepto antropológico de cultura","Caracteriza, siguiendo a Kottak, las características fundamentales del concepto de cultura"],"apariciones":["2022 Feb-2","2023 Sep","2024 Feb-2"],"frecuencia":3,"tema":"Tema 1: Definición y objeto de la antropología","bullets":[{"b":"Punto de partida: definición de Tylor (1871): 'todo complejo que incluye conocimientos, creencias, arte, moral, derecho, costumbres... adquiridos como miembro de la sociedad'."},{"b":"La cultura es aprendida: se adquiere por enculturación, consciente e inconscientemente, no por herencia genética.","x":"Los humanos poseemos una capacidad biológica universal para aprender cualquier cultura; lo que varía es el contenido transmitido socialmente en cada grupo."},{"b":"Es simbólica: descansa en símbolos, signos arbitrarios y convencionales sin relación necesaria con aquello que representan.","x":"El lenguaje es el ejemplo máximo; también banderas, agua bendita o marcas. White y Geertz sitúan aquí la clave de lo humano."},{"b":"Es compartida: atributo de individuos como miembros de grupos, transmitida en sociedad; y todo lo abarca, incluida la vida cotidiana.","x":"No solo la 'alta cultura': para la antropología cuentan igualmente el fútbol, la comida o los memes. Además, se apropia de la naturaleza (necesidades biológicas moldeadas culturalmente)."},{"b":"Está pautada e integrada: sus elementos forman sistemas; si uno cambia, otros cambian; existen valores centrales que la articulan."},{"b":"Es adaptativa (y a veces maladaptativa) y está en todos los niveles: internacional, nacional y subculturas; los individuos la usan creativamente.","x":"Kottak distingue cultura ideal y real, y subraya la agencia: las personas no siguen las reglas mecánicamente, las manipulan y transforman (práctica)."},{"b":"Aplicación al botellón: práctica aprendida, compartida, simbólica y pautada de una subcultura juvenil; sí es analizable antropológicamente.","x":"Ritual de sociabilidad con reglas, espacios y significados propios (transgresión, pertenencia, edad); ejemplo de que la cultura abarca también prácticas informales y polémicas."}]},{"id":"an1-p06","tipo":"desarrollo","enunciado":"TEMA: Explica, siguiendo a los/as autores/as estudiados/as en los dos primeros temas de la asignatura (Kottak, Bohannan, Brown y Peacock) en qué consiste la especificidad metodológica de la antropología. ¿Cuál es su estrategia básica de producción de datos? ¿Qué técnicas incorpora? ¿Qué problemas éticos y metodológicos suscita?","variantes":["TEMA: Explica los conceptos fundamentales sobre el método y el trabajo de campo en antropología adquiridos en el conjunto de tus lecturas (Kottak, Keesing, Bohannan y Brown)","TEMA: Comenta el siguiente texto de J. L. Peacock ('Cada paso de la investigación antropológica implica dilemas... un recetario que exhibiera una fórmula fija para el trabajo de campo sería equívoco'), aplicando los conceptos fundamentales sobre el método y el trabajo de campo adquiridos en tus lecturas"],"apariciones":["2022 Feb-1","2022 Sep","2024 Feb-1"],"frecuencia":3,"tema":"Tema 2: Método y teorías en antropología","bullets":[{"b":"La especificidad antropológica es la etnografía: trabajo de campo prolongado y de primera mano, con observación participante como estrategia básica.","x":"El etnógrafo convive con el grupo, participa en su vida diaria y produce datos desde dentro, combinando implicación y distancia. Es a la vez método y género de escritura."},{"b":"Técnicas (Kottak): observación participante, entrevistas dirigidas y abiertas, genealogías, informantes clave, historias de vida, encuestas, estudios longitudinales.","x":"También la distinción emic (perspectiva del nativo) / etic (perspectiva del analista), cuya combinación caracteriza el conocimiento antropológico."},{"b":"Peacock: el método implica dilemas irresolubles —implicación/distanciamiento, subjetividad/objetividad, particularización/generalización, inducción/deducción—; no hay recetario fijo.","x":"La metáfora de 'la luz y el arpón': iluminar ampliamente el contexto y a la vez apresar significados concretos. El rigor está en gestionar reflexivamente los dilemas, no en eliminarlos."},{"b":"Bohannan ('Shakespeare en la selva'): al contar Hamlet a los tiv descubre que la interpretación depende del marco cultural.","x":"Los ancianos tiv reinterpretan la obra desde sus categorías (levirato, brujería, omens). Moraleja: no hay lecturas universales autoevidentes; la traducción cultural exige conocer las categorías nativas y vigilar el etnocentrismo."},{"b":"Brown: el relativismo metodológico —suspender el juicio para comprender— es la herramienta central; no implica relativismo moral absoluto."},{"b":"Keesing: las teorías de la cultura (adaptacionistas e ideacionales) orientan qué se observa y cómo se explica; método y teoría son inseparables."},{"b":"Ética (Kottak): consentimiento informado, no dañar a los sujetos, reciprocidad, anonimato; deontología ante comunidades vulnerables.","x":"El código de la AAA establece la responsabilidad primera hacia las personas estudiadas, por encima de los intereses de la investigación o de quien la financia."}]},{"id":"an1-p07","tipo":"desarrollo","enunciado":"TEMA: Aplica los conceptos principales que hayas aprendido a lo largo del tema V (Antropología Simbólica) a un caso etnográfico que te resulte familiar, especificando (a) de dónde surgen tales conceptos, (b) en qué sentido los utilizas y (c) cuál es su relevancia para la comprensión de ese fenómeno particular.","variantes":["TEMA: Desarrolla los tres conceptos que hayas aprendido que sean, a tu juicio, más fructíferos para el análisis de los fenómenos incluidos en el tema V, Antropología simbólica. Aplícalos productivamente a algún fenómeno que te sea familiar"],"apariciones":["2022 Feb-2","2023 Sep","2024 Sep"],"frecuencia":3,"tema":"Tema 5: Antropología simbólica","bullets":[{"b":"Conceptos base (Kottak, cap. Religión): religión como creencias y ritos sobre seres/poderes sobrenaturales (Wallace); animismo (Tylor), mana y tabú.","x":"La religión cumple funciones explicativas, emocionales (ansiedad-Malinowski), sociales (cohesión, control) y ecológicas (vacas sagradas-Harris)."},{"b":"Ritual: conducta formal, estereotipada, repetitiva y seria, ejecutada en lugares especiales; comunica y hace cosas (performativo).","x":"Van Gennep: ritos de paso con fases de separación, margen (liminalidad) y agregación. Turner añade la communitas: comunión igualitaria e intensa entre los liminares."},{"b":"Turner (ritual ndembu): símbolos dominantes con condensación, unificación de referentes y polarización de sentido (polo ideológico y polo sensorial).","x":"El árbol mudyi (savia lechosa) significa a la vez leche materna y matrilinaje: lo sensorial carga de emoción a la norma social."},{"b":"Finnegan: la música como práctica social situada; estudiarla revela cómo la gente crea, ejecuta y da sentido colectivamente ('senderos' musicales).","x":"Contra la visión de la música como obra abstracta, propone atender a la práctica amateur y cotidiana: bandas, coros, ensayos; el arte como acción social organizada."},{"b":"Folklore y patrimonio: metadiscursos modernos que seleccionan y sacralizan expresiones culturales como 'herencia' colectiva."},{"b":"Aplicación tipo (elige tu caso: Semana Santa, fiestas patronales, un festival, el fútbol): identifica símbolos dominantes, fases rituales, communitas y patrimonialización.","x":"Ejemplo: en unas fiestas patronales el santo condensa identidad local (polo ideológico) y emoción festiva (polo sensorial); la procesión es rito de paso anual; la declaración de Interés Turístico las patrimonializa."}]},{"id":"an1-p08","tipo":"desarrollo","enunciado":"Explica mediante ejemplos, siguiendo a Kottak, algunos de los hallazgos de los sociolingüistas (en particular, Lakoff y Tannen) sobre las diferencias de género en distintos niveles del habla.","variantes":["Explica mediante ejemplos, siguiendo a Kottak, algunos de los hallazgos de los sociolingüistas sobre las diferencias de género en distintos niveles del habla"],"apariciones":["2023 Feb-2","2026 Feb-2"],"frecuencia":2,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Hombres y mujeres difieren en fonología, entonación, léxico y estilo: diferencias culturales aprendidas, no biológicas."},{"b":"Ejemplos léxicos: las mujeres estadounidenses usan más términos de color (malva, turquesa); los hombres, más vocabulario deportivo y tacos.","x":"El vocabulario refleja la socialización diferencial y los ámbitos de experiencia asignados a cada género en una cultura dada."},{"b":"Lakoff: el 'habla femenina' usa atenuadores, preguntas coletilla y fórmulas de cortesía que reflejan menor poder social.","x":"Expresiones como '¿no te parece?' o 'quizá' comunican inseguridad aprendida; el problema no es el habla de las mujeres sino la jerarquía que la produce y la evalúa."},{"b":"Tannen: 'genderlects', estilos conversacionales distintos; mujeres orientadas al rapport (conexión), hombres al report (información y estatus).","x":"De ahí malentendidos recurrentes: ellas buscan empatía al contar un problema; ellos responden dando soluciones. Son estilos comunicativos culturales, no rasgos naturales."},{"b":"Las mujeres tienden más al habla estándar y de prestigio que los hombres de su misma clase.","x":"Kottak lo vincula con la menor seguridad de estatus: cuidar el habla es una forma de reclamar respetabilidad social."},{"b":"Conclusión: el habla expresa y reproduce la estratificación de género, igual que la de clase."}]},{"id":"an1-p09","tipo":"desarrollo","enunciado":"Gerd Baumann ha modelizado tres 'gramáticas de la identidad/alteridad'. Explica en qué consiste cada una de ellas y en qué medida se pueden aplicar al ámbito religioso de la cultura, según el propio autor.","variantes":["Gerd Baumann ha modelizado tres 'gramáticas de la identidad/alteridad'. Comenta los ejemplos que Baumann propone para el ámbito estético de la cultura, ilustrando de qué modo les son (o no) aplicables tales gramáticas"],"apariciones":["2023 Feb-2","2024 Feb-2"],"frecuencia":2,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Baumann: la identidad y la alteridad se construyen mediante tres 'gramáticas' o estructuras clasificatorias del nosotros/ellos.","x":"Son esquemas selectivos y reversibles ('selfing/othering'): no describen esencias sino operaciones discursivas que pueden combinarse en un mismo contexto."},{"b":"Gramática orientalista (Said): espejo invertido; 'lo que ellos son, nosotros no somos', con ambivalencia de rechazo y deseo.","x":"Oriente aparece como irracional y despótico pero también sensual y espiritual: negación especular que a la vez fascina ('lo malo nuestro es lo bueno suyo')."},{"b":"Gramática segmentaria (Evans-Pritchard): aliado o enemigo según el nivel de segmentación; la identidad depende del contexto.","x":"Como entre los nuer: aldeas rivales entre sí se unen frente a la tribu vecina, y todas frente al extranjero. Fusión y fisión contextuales."},{"b":"Gramática de englobamiento (Dumont): el otro es reconocido pero subsumido como caso subordinado de lo propio.","x":"'En el fondo sois como nosotros': la jerarquía engloba a su contrario, negando autonomía a la diferencia."},{"b":"Ámbito religioso: el ecumenismo suele englobar ('todos adoramos al mismo Dios'), las 'religiones del Libro' segmentan (unidas frente al secularismo), y el 'misticismo oriental' se orientaliza."},{"b":"Ámbito estético: el arte 'primitivo' o la world music se orientalizan (exotismo admirado) o se engloban en el canon occidental como formas 'menores'."}]},{"id":"an1-p10","tipo":"desarrollo","enunciado":"Explica brevemente en qué consiste la gramática segmentaria para identificarse y alterizar, siguiendo a Baumann y Evans-Pritchard. Aplícala a algún ejemplo del ámbito político.","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Origen: el modelo de linajes segmentarios de Evans-Pritchard entre los nuer (fisión y fusión según contexto)."},{"b":"Principio: quien es enemigo en un nivel bajo de segmentación es aliado en un nivel superior.","x":"Dos aldeas rivales se unen contra la sección vecina; dos secciones, contra otra tribu; todos los nuer, contra los dinka. La oposición estructura la solidaridad."},{"b":"La identidad resulta contextual y relativa: no hay 'otros' absolutos, sino niveles cambiantes de nosotros/ellos."},{"b":"Ejemplo político: partidos que rivalizan en unas autonómicas se coaligan en las generales; países de la UE compiten entre sí pero se unen frente a amenazas externas.","x":"También sirven las identidades territoriales anidadas: mi barrio contra el barrio vecino, mi ciudad contra la capital, mi país frente al extranjero."},{"b":"Límite señalado por Baumann: presupone niveles claros y solidaridad mecánica; en sociedades complejas se combina con las otras gramáticas."}]},{"id":"an1-p11","tipo":"desarrollo","enunciado":"Siguiendo a Gerd Baumann y Edward Said, explica en qué consiste una gramática orientalista para identificarse y alterizar. Aplícala a algún ejemplo del ámbito estético o artístico de tu propio entorno.","variantes":[],"apariciones":["2026 Feb-2"],"frecuencia":1,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Said (Orientalismo, 1978): Occidente construyó discursivamente un 'Oriente' que le sirve de espejo invertido para definirse.","x":"El orientalismo es un aparato de saber-poder ligado al colonialismo: literatura, pintura y ciencia produjeron un Oriente irracional, sensual y estancado frente a un Occidente racional y moderno."},{"b":"Baumann formaliza: gramática de la negación especular; 'lo que ellos son, nosotros no lo somos, y viceversa'."},{"b":"Es ambivalente: el otro condensa lo temido y lo deseado; se le desprecia y a la vez se le idealiza (exotismo, 'buen salvaje').","x":"Esta doble carga distingue el orientalismo del simple rechazo: lo que reprimimos en nosotros lo proyectamos y admiramos en ellos (espiritualidad, sensualidad, autenticidad)."},{"b":"Ejemplo estético: el flamenco exotizado como pasión 'primitiva'; la moda 'étnica' o boho; tatuajes 'tribales'; decoración 'zen'.","x":"Se consume la diferencia como autenticidad perdida: el mercado estético reproduce el binarismo nosotros-modernos / ellos-auténticos, aunque invierta la valoración."},{"b":"Conclusión: identificarse y alterizar son un mismo acto ('selfing/othering'); el retrato del otro es un autorretrato invertido."}]},{"id":"an1-p12","tipo":"desarrollo","enunciado":"Explica, siguiendo a Kottak, en qué consiste la etnografía como método, cuáles son sus principales técnicas y descríbelas brevemente.","variantes":[],"apariciones":["2026 Feb-1"],"frecuencia":1,"tema":"Tema 2: Método y teorías en antropología","bullets":[{"b":"Etnografía: estrategia de investigación de campo, de primera mano y prolongada, en sociedades o grupos concretos; marca distintiva de la antropología."},{"b":"Observación participante: convivir y tomar parte en la vida local mientras se observa y registra sistemáticamente.","x":"Permite acceder a lo que la gente hace, no solo a lo que dice que hace; exige gestionar la tensión entre implicación y distancia."},{"b":"Conversación y entrevistas: desde la charla informal al cuestionario; entrevistas dirigidas (con guion) y no dirigidas."},{"b":"Método genealógico: registro de parentesco, filiación y matrimonio, esqueleto organizativo de las sociedades no industriales."},{"b":"Informantes clave (consultores culturales) e historias de vida: expertos locales y retratos biográficos en profundidad que muestran la cultura vivida."},{"b":"Perspectivas emic y etic: punto de vista nativo versus categorías del analista; la etnografía combina ambas."},{"b":"Investigación longitudinal, en equipo y multisituada; encuestas como complemento cuantitativo en sociedades complejas."}]},{"id":"an1-p13","tipo":"desarrollo","enunciado":"Resume los argumentos centrales de Mary Louise Pratt en relación con el proceso de globalización y los relatos que construimos en torno al mismo.","variantes":[],"apariciones":["2022 Feb-1"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Pratt critica los grandes relatos celebratorios de la globalización: mundo sin fronteras, flujos, aldea global, movilidad total.","x":"Son mitos interesados que ocultan que la globalización también levanta muros, produce inmovilidad y desigualdad: no todos circulan igual ni con los mismos derechos."},{"b":"La globalización debe entenderse desde los relatos y experiencias concretas de movilidad 'desde abajo', no desde la abstracción del capital."},{"b":"Caso central: la Virgen de Zapopan 'viaja' a Los Ángeles siguiendo a sus fieles migrantes mexicanos.","x":"La religiosidad popular muestra la agencia de los migrantes: reconstruyen comunidad transnacional y obligan a lo sagrado a moverse con ellos. Lo local no desaparece: se desterritorializa y reterritorializa."},{"b":"Frente al héroe neoliberal hipermóvil, Pratt opone otras figuras: el migrante indocumentado, cuya movilidad es criminalizada.","x":"La misma frontera que el capital cruza libremente se vuelve letal para las personas; la movilidad es un recurso distribuido desigualmente."},{"b":"Conclusión: los relatos sobre la globalización son parte de ella; la antropología debe analizarlos críticamente y recoger los relatos alternativos."}]},{"id":"an1-p14","tipo":"desarrollo","enunciado":"¿En qué consiste la 'burbuja personal' según Edward y Mildred Hall? Aplica el concepto al análisis de alguna situación concreta que hayas vivido personalmente.","variantes":[],"apariciones":["2022 Feb-2"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"En 'El sonido del silencio', los Hall estudian la comunicación no verbal: gestos, miradas, silencios y manejo del espacio (proxémica)."},{"b":"Burbuja personal: espacio invisible y portátil que rodea a cada individuo y regula la distancia aceptable con otros.","x":"Funciona como un territorio móvil: su invasión produce incomodidad, retirada o agresividad, casi siempre de forma inconsciente."},{"b":"Su tamaño varía culturalmente: amplia entre norteamericanos y noreuropeos; reducida entre árabes, latinos o mediterráneos.","x":"De ahí los malentendidos interculturales: el que se acerca parece invasivo; el que retrocede, frío y distante. Cada cual sigue su norma cultural sin saberlo."},{"b":"También varía según relación, género, situación y densidad: distancias íntima, personal, social y pública."},{"b":"Ejemplo aplicable: en el metro lleno toleramos contacto suspendiendo la burbuja (evitando la mirada); en un ascensor vacío alguien que se pega resulta amenazante."}]},{"id":"an1-p15","tipo":"desarrollo","enunciado":"Explica mediante algún caso —que no sea el de los juegos olímpicos— la noción de 'taxonomía' como estructura clasificatoria.","variantes":[],"apariciones":["2022 Sep"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Concepto de la etnociencia (Díaz de Rada y Cruces): las culturas ordenan la experiencia mediante estructuras clasificatorias."},{"b":"Taxonomía: clasificación jerárquica por inclusión de clases; relación 'X es un tipo de Y' en niveles de contraste.","x":"Cada término contrasta con los de su nivel y se incluye en el nivel superior: los dominios se organizan como un árbol, del término más general a los más específicos."},{"b":"Ejemplo: 'bebidas' se divide en alcohólicas y no alcohólicas; las alcohólicas en vino, cerveza y licores; el vino en tinto, blanco y rosado.","x":"Otros casos válidos: etnobotánica popular (árbol/arbusto/hierba), tipos de música, la carta de un bar o la clasificación casera de la ropa."},{"b":"Las taxonomías populares (folk) no coinciden con las científicas: responden al interés práctico y simbólico del grupo."},{"b":"Relevancia: clasificar es universal, pero cada taxonomía revela 'el orden del sentido' propio de una cultura."}]},{"id":"an1-p16","tipo":"desarrollo","enunciado":"Explica mediante algún ejemplo la noción de 'paradigma' como estructura clasificatoria. Elabora como apoyo un pequeño gráfico ilustrativo.","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Paradigma: estructura clasificatoria donde las categorías resultan del cruce simultáneo de dos o más dimensiones de contraste.","x":"A diferencia de la taxonomía (jerarquía de inclusión), el paradigma es una matriz: cada casilla combina un valor de cada dimensión."},{"b":"Ejemplo clásico: términos de parentesco definidos por sexo × generación (padre/madre, hijo/hija, abuelo/abuela).","x":"Dimensión 1: sexo (masculino/femenino); dimensión 2: generación (+1, 0, -1). 'Madre' = femenino y generación +1. El gráfico es una tabla de doble entrada con esas casillas."},{"b":"Otro ejemplo: pronombres (persona × número) o el semáforo social edad × género (niño/niña, hombre/mujer, anciano/anciana)."},{"b":"Gráfico: dibujar una tabla con las dimensiones en filas y columnas y los términos en las celdas."},{"b":"Relevancia etnocientífica: taxonomías y paradigmas muestran cómo cada cultura organiza cognitivamente sus dominios de experiencia."}]},{"id":"an1-p17","tipo":"desarrollo","enunciado":"¿A qué 'cuatro ciudades' se refería García Canclini en su texto obligatorio en el tema VI? Razona tu respuesta.","variantes":[],"apariciones":["2023 Sep"],"frecuencia":1,"tema":"Tema 6: Cultura urbana","bullets":[{"b":"Canclini analiza Ciudad de México como superposición de cuatro ciudades, cuatro capas históricas que coexisten hoy.","x":"No son etapas sucesivas ya superadas sino estratos simultáneos: la megalópolis se caracteriza por esa heterogeneidad multitemporal."},{"b":"1) La ciudad histórico-territorial: el centro histórico, lo patrimonial y ceremonial, herencia prehispánica y colonial."},{"b":"2) La ciudad industrial: la expansión del siglo XX, fábricas, migración campo-ciudad y barrios obreros."},{"b":"3) La ciudad comunicacional o informacional: organizada por medios, redes y servicios; la urbe vivida a través de radio, televisión y tecnologías.","x":"En la megaciudad ya no se conoce el territorio por experiencia directa: los medios 'cuentan' la ciudad y median su sentido, tema que conecta con Martín Barbero."},{"b":"4) La ciudad globalizada: conectada a los circuitos transnacionales de finanzas, migración y consumo, con nuevas desigualdades.","x":"Sedes corporativas, franquicias y élites globales conviven con la informalidad: la globalización fragmenta y re-jerarquiza el espacio urbano."},{"b":"Razonamiento: las cuatro ciudades muestran la hibridación y la imposibilidad de una visión totalizadora; los imaginarios urbanos recomponen esa experiencia fragmentada."}]},{"id":"an1-p18","tipo":"desarrollo","enunciado":"Contrasta, siguiendo a Kottak, las posiciones de Chomsky y Sapir-Whorf en cuanto a las relaciones entre lenguaje, pensamiento y cultura.","variantes":[],"apariciones":["2024 Sep"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Chomsky: universalismo; todas las lenguas comparten una gramática universal, capacidad innata del cerebro humano.","x":"Los niños aprenden cualquier lengua con la misma facilidad porque poseen un dispositivo innato de adquisición; las diferencias entre lenguas son superficiales frente a la estructura común."},{"b":"Sapir-Whorf: particularismo; cada lengua canaliza el pensamiento; hablantes de lenguas distintas piensan de forma distinta.","x":"Ejemplos clásicos: el tratamiento del tiempo en hopi o los géneros gramaticales. La lengua no sería solo vehículo sino molde de la experiencia."},{"b":"Son posiciones opuestas: unidad psíquica y biología común (Chomsky) frente a relativismo lingüístico (Sapir-Whorf)."},{"b":"Evaluación actual (Kottak): la versión fuerte del determinismo whorfiano está descartada; se admite una influencia débil.","x":"Podemos pensar lo que nuestra lengua no codifica y las lenguas cambian; la relación es de influencia mutua, no de determinación."},{"b":"Inversión de la flecha: a menudo es la cultura la que moldea la lengua, como muestra el vocabulario focal (léxico elaborado en áreas de interés)."}]},{"id":"an1-p19","tipo":"desarrollo","enunciado":"Explica, siguiendo a Kottak, algunos de los hallazgos de los sociolingüistas sobre el vocabulario focal. Pon un ejemplo.","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 4: Lenguaje, comunicación y cognición","bullets":[{"b":"Vocabulario focal: conjunto léxico especializado y elaborado en torno a dominios de experiencia cruciales para un grupo.","x":"El léxico es el nivel de la lengua que más directamente refleja la cultura: donde hay interés y práctica intensa, proliferan las distinciones terminológicas."},{"b":"Ejemplos clásicos: términos para nieve entre los inuit (matizado hoy), el ganado entre los nuer, tipos de arroz o de camellos."},{"b":"Ejemplo cercano: esquiadores, baristas o gamers distinguen decenas de términos donde el profano ve una sola cosa.","x":"'Nieve polvo, costra, primavera' para el esquiador; 'ristretto, flat white' para el barista: subculturas con vocabularios focales propios."},{"b":"El vocabulario cambia con los intereses culturales: nuevas tecnologías generan léxico nuevo (tuitear, streaming)."},{"b":"Implicación teórica: apoya una lectura invertida y débil de Sapir-Whorf; aquí es la cultura la que moldea la lengua."}]},{"id":"an1-p20","tipo":"desarrollo","enunciado":"Explica, siguiendo a Turner, las características de los símbolos rituales. ¿Son dichos símbolos referenciales o de condensación? Pon un ejemplo del proceso que él denomina 'polarización de sentido' durante el transcurso del ritual.","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 5: Antropología simbólica","bullets":[{"b":"Turner estudia los símbolos del ritual ndembu (Zambia); el símbolo es la unidad mínima del ritual, 'molécula' de conducta ritual."},{"b":"Propiedades: condensación (muchos significados en un solo vehículo), unificación de referentes dispares y polarización de sentido."},{"b":"Son símbolos de condensación, no meramente referenciales: no solo denotan, sino que cargan emoción y mueven a la acción.","x":"Frente al signo referencial (que informa), el símbolo ritual condensa normas, deseos y afectos; por eso el ritual transforma a los participantes y no solo comunica."},{"b":"Polarización de sentido: cada símbolo dominante tiene un polo ideológico (normas, valores sociales) y un polo sensorial (fisiológico, emocional)."},{"b":"Ejemplo: el árbol mudyi ('árbol de la leche') en la iniciación femenina; su savia blanca evoca leche materna (polo sensorial) y matrilinaje y costumbre ndembu (polo ideológico).","x":"Durante el ritual ambos polos se intercambian cargas: lo obligatorio se vuelve deseable al impregnarse de emoción, y la emoción se ennoblece al unirse a la norma. Ahí reside la eficacia ritual."}]},{"id":"an1-p21","tipo":"desarrollo","enunciado":"TEMA: Explica los conceptos principales aprendidos en el tema III (La construcción social de las diferencias) y su relevancia para la comprensión de los procesos de identidad/alteridad. Usa el desarrollo del tema como pretexto para mostrar la productividad de tu lectura de los textos de Stuart Hall, Gerd Baumann y Lévi-Strauss.","variantes":[],"apariciones":["2023 Feb-1"],"frecuencia":1,"tema":"Tema 3: La construcción sociocultural de las diferencias","bullets":[{"b":"Idea eje: raza, etnicidad, nación o pueblo no son esencias sino construcciones socioculturales, procesos dinámicos de identidad/alteridad."},{"b":"Kottak: la raza carece de base biológica (variación clinal); las razas sociales se construyen culturalmente (hipodescendencia, Brasil, Japón); etnicidad situacional."},{"b":"Lévi-Strauss ('Raza e Historia'): crítica del evolucionismo y el etnocentrismo; la diversidad es motor del progreso humano; civilización = coalición de culturas.","x":"El bárbaro es quien cree en la barbarie: llamar 'salvaje' al diferente es el gesto etnocéntrico por excelencia. Ninguna cultura acumula progreso en solitario."},{"b":"Stuart Hall: la identidad se produce en la representación; los estereotipos fijan y naturalizan la diferencia ('el espectáculo del Otro').","x":"Los significados no están en las cosas sino en los sistemas de representación; el poder opera fijando significados: el cuerpo negro racializado en publicidad, deporte y medios."},{"b":"Baumann: tres gramáticas de identidad/alteridad (orientalización, segmentación, englobamiento) como estructuras discursivas del nosotros/ellos."},{"b":"Conclusión: la identidad es un hecho discursivo y relacional; se hace frente a un 'otro' y puede deshacerse y rehacerse.","x":"Cierre redondo: aplicar las tres lecturas a un caso actual (debates migratorios, nacionalismos, racismo cotidiano) mostrando su complementariedad."}]},{"id":"an1-p22","tipo":"desarrollo","enunciado":"TEMA: Caracteriza, siguiendo el conjunto de las lecturas realizadas, y en especial las de los temas I y II, cuál es la perspectiva disciplinar propia de la antropología, explicando las dimensiones del holismo, el relativismo y el comparativismo. Menciona autores, argumentos y casos que hayas aprendido a lo largo de la asignatura.","variantes":[],"apariciones":["2025 Feb-1"],"frecuencia":1,"tema":"Tema 1: Definición y objeto de la antropología","bullets":[{"b":"La antropología estudia la diversidad humana en su totalidad: 'espejo para la humanidad' (Kluckhohn/Kottak); su perspectiva es holista, relativista y comparativa."},{"b":"Holismo: aborda al ser humano como totalidad biológica, social, lingüística y cultural; de ahí los cuatro campos de la disciplina.","x":"Ningún fenómeno se entiende aislado: economía, parentesco, religión y política se interconectan. Ejemplo: las vacas sagradas indias enlazan ecología, economía y religión."},{"b":"Relativismo: comprender cada cultura en sus propios términos, suspendiendo el juicio etnocéntrico; en su versión metodológica (Brown), no moral absoluta.","x":"Casos: Bohannan y el Hamlet reinterpretado por los tiv; el debate del relativismo frente a los derechos humanos."},{"b":"Comparativismo: la comparación transcultural permite distinguir lo universal, lo generalizado y lo particular, y poner a prueba explicaciones.","x":"Kottak distingue universales (exogamia-tabú del incesto), generalidades (familia nuclear) y particularidades. Peacock subraya la tensión entre generalizar y particularizar."},{"b":"El método que sostiene todo ello es la etnografía con observación participante, combinando emic y etic."},{"b":"Cierre: esa triple perspectiva convierte la antropología en crítica del etnocentrismo y en ciencia reflexiva sobre la propia cultura."}]},{"id":"an1-p23","tipo":"desarrollo","enunciado":"TEMA: Aplica los conceptos principales aprendidos en el tema 6 (Antropología urbana) a algún fenómeno cultural que te resulte familiar, especificando cuál es la aportación de la antropología a la comprensión de ese fenómeno en particular.","variantes":[],"apariciones":["2025 Sep"],"frecuencia":1,"tema":"Tema 6: Cultura urbana","bullets":[{"b":"Conceptos base: etnografía en la ciudad (la ciudad como escenario) y de la ciudad (la ciudad como objeto); lo urbano como forma de vida."},{"b":"García Canclini: cuatro ciudades superpuestas (histórico-territorial, industrial, comunicacional, globalizada); imaginarios urbanos que recomponen la megaciudad fragmentada.","x":"En la megalópolis nadie experimenta el todo: los relatos, medios y trayectos de cada grupo construyen ciudades imaginadas distintas dentro de la misma urbe."},{"b":"Martín Barbero: 'la ciudad que median los miedos'; el miedo reorganiza la vida urbana y los medios median la experiencia de la ciudad.","x":"Inseguridad real y percibida empujan a privatizar el espacio (urbanizaciones cerradas, centros comerciales), vaciando la calle; la televisión sustituye a la plaza como lugar de encuentro."},{"b":"Procesos ligados: desurbanización del espacio público, ciudad informacional, hibridación cultural, nuevas formas de ser urbanos."},{"b":"Aplicación tipo: analizar un barrio gentrificado, un centro comercial o las fiestas de tu ciudad con esos conceptos.","x":"Ejemplo: la gentrificación enlaza la capa globalizada (turismo, plataformas) con imaginarios de miedo y distinción; la etnografía revela cómo lo viven vecinos y recién llegados."},{"b":"Aportación antropológica: mirada micro, etnográfica y comparativa que devuelve la voz y la agencia de los habitantes frente a visiones macro."}]},{"id":"an1-p24","tipo":"desarrollo","enunciado":"TEMA: Resume y comenta los principales argumentos de crítica al evolucionismo decimonónico presentes en las lecturas estudiadas. En particular, siguiendo a Lévi-Strauss: (1) las relaciones entre los conceptos de raza, historia y cultura, (2
