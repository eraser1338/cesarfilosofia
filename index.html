  window.scrollTo({top:0,behavior:'smooth'});
}
function answerMcq(vi){
  if(!TQ||TQ.answered||!TQ.cur) return;
  TQ.answered=true;
  const m=TQ.cur, oi=TQ.perm[vi], good=(oi===m.correcta);
  document.querySelectorAll('#testzone .opt').forEach(b=>b.disabled=true);
  const okVi=TQ.perm.indexOf(m.correcta);
  document.querySelector('#testzone .opt[data-vi="'+okVi+'"]').classList.add('ok');
  if(!good) document.querySelector('#testzone .opt[data-vi="'+vi+'"]').classList.add('ko');
  const st=S.mcq[m.id]||{l:0,n:0,f:0};
  if(good){ TQ.ok++; st.l=Math.min(3,(st.l||0)+1); }
  else{
    TQ.ko++; st.l=Math.max(0,(st.l||0)-1); st.f=(st.f||0)+1;
    if(!TQ.fallos.some(x=>x.id===m.id)) TQ.fallos.push(m);
    if(TQ.mode!=='t20'){ const pos=TQ.idx+4+Math.floor(Math.random()*3); TQ.queue.splice(Math.min(pos,TQ.queue.length),0,m); }
  }
  st.n=(st.n||0)+1; st.t=Date.now(); S.mcq[m.id]=st;
  TQ.n++;
  const ex=$('#texpl'); ex.innerHTML=(good?'✅ Correcta. ':'❌ ')+esc(m.explicacion||''); ex.classList.add('on');
  gainXP(good?3:1,true);
  $('#tnav').innerHTML=`<button class="btn primary" onclick="nextMcq()">${TQ.mode==='t20'&&TQ.idx+1>=TQ.queue.length?'Ver resultado':'Siguiente'} → &nbsp;<span class="small" style="opacity:.7">[espacio]</span></button>${TQ.mode!=='t20'?'<button class="btn" onclick="endTest()">Terminar</button>':''}`;
}
function nextMcq(){ if(!TQ||!TQ.answered) return; TQ.idx++; showMcq(); }
function endTest(){
  const z=$('#testzone');
  const tot=TQ.ok+TQ.ko;
  if(!tot){ renderTest(); return; }
  const nota=Math.round(TQ.ok/tot*100)/10;
  const apto=nota>=8;
  if(TQ.mode==='t20') gainXP(apto?15:8);
  z.innerHTML=`
  <div class="res card-ui">
    <div class="nota" style="color:${apto?'var(--good)':'var(--bad)'}">${String(nota).replace('.',',')}</div>
    <div class="apto">${apto?'✓ APTO':'✗ Aún no'} · ${TQ.ok} aciertos, ${TQ.ko} fallos</div>
    <div class="detail">${apto?'Los pocos fallos quedan fichados para el repaso.':'Cada fallo queda fichado: la app te lo repetirá hasta que caiga.'}</div>
    ${TQ.fallos.length?`<div class="reslist">${TQ.fallos.map(m=>`<div class="ko-item"><div class="en">${esc(m.enunciado)}</div><div class="ok-ans">✓ ${esc(m.opciones[m.correcta])}</div></div>`).join('')}</div>`:''}
    <div class="mrowb" style="justify-content:center; margin-top:16px">
      ${TQ.fallos.length?`<button class="btn" onclick="startTest('fallos')">🎯 Repasar fallos</button>`:''}
      <button class="btn primary" onclick="startTest('${TQ.mode==='fallos'?'fallos':'t20'}')">Otro test</button>
      <button class="btn" onclick="renderTest()">Menú</button>
    </div>
  </div>`;
  save();
}

/* ================= ajustes ================= */
function openCfg(){
  $('#modal').innerHTML=`<h3>Ajustes</h3>
  <p>Tu progreso ${memOnly?'<b>no puede guardarse en este visor</b>: guarda tu código al terminar y restáuralo al volver.':'se guarda automáticamente en este dispositivo/navegador.'} Ojo: si abres la app como archivo local (sobre todo en móvil), el navegador puede borrar ese guardado — usa el <b>código de progreso</b> como respaldo.</p>
  <p class="small" style="margin-top:10px"><b>Código de progreso</b> — cópialo y guárdalo donde quieras (notas, un chat contigo mismo…). Para recuperar, pégalo aquí y pulsa Restaurar.</p>
  <textarea id="pcode" style="width:100%; height:74px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--ink); font-size:.72rem; padding:8px; resize:vertical" placeholder="Pulsa 'Copiar mi código' o pega aquí uno guardado"></textarea>
  <div class="mrowb">
    <button class="btn primary" onclick="copyCode()">⧉ Copiar mi código</button>
    <button class="btn" onclick="restoreCode()">↻ Restaurar</button>
  </div>
  <div class="mrowb">
    <button class="btn" onclick="exportP()">⬇ Exportar fichero</button>
    <button class="btn" onclick="$('#impfile').click()">⬆ Importar fichero</button>
    <button class="btn" style="color:var(--bad)" onclick="resetP()">Reiniciar todo</button>
  </div>
  <input type="file" id="impfile" accept=".json" style="display:none" onchange="importP(this)">
  <div class="mrowb"><button class="btn" onclick="closeCfg()">Cerrar</button></div>`;
  $('#modalbg').classList.add('on');
}
function encState(){ return 'CF1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function copyCode(){
  const code=encState(); const ta=$('#pcode'); ta.value=code;
  ta.select(); ta.setSelectionRange(0,code.length);
  const done=()=>toast('Código copiado — guárdalo en tus notas');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(code).then(done).catch(()=>{ document.execCommand('copy'); done(); }); }
  else{ document.execCommand('copy'); done(); }
}
function restoreCode(){
  let v=($('#pcode').value||'').trim();
  if(!v){ toast('Pega primero un código'); return; }
  try{
    if(v.startsWith('CF1.')) v=v.slice(4);
    const st=JSON.parse(decodeURIComponent(escape(atob(v))));
    if(typeof st.xp!=='number') throw 0;
    S=Object.assign(freshState(),st); save(); toast('Progreso restaurado ✓'); closeCfg(); show('inicio');
  }catch(e){ toast('Código no válido'); }
}
function closeCfg(){ $('#modalbg').classList.remove('on'); }
function exportP(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='cesar-filosofo-progreso-'+today()+'.json'; a.click();
}
function importP(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ S=Object.assign(freshState(),JSON.parse(rd.result)); save(); toast('Progreso importado'); closeCfg(); show('inicio'); }catch(e){ toast('Fichero no válido'); } };
  rd.readAsText(f);
}
function resetP(){ if(confirm('¿Seguro? Se borra todo el progreso.')){ S=freshState(); save(); closeCfg(); show('inicio'); } }

/* ================= arranque ================= */
load(); applyTheme(); renderHeader();
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>show(t.dataset.s));
$('#go-mix').onclick=()=>{ S.prefs.scope=DATA.map(s=>s.id); save(); show('cards'); };
$('#go-testmix').onclick=()=>{ S.prefs.testScope=DATA.map(s=>s.id); save(); show('test'); };
$('#themebtn').onclick=()=>{
  const seq=['auto','light','dark']; const i=seq.indexOf(S.prefs.theme||'auto');
  S.prefs.theme=seq[(i+1)%3]; save(); applyTheme();
  toast('Tema: '+({auto:'automático',light:'claro',dark:'oscuro'})[S.prefs.theme]);
  show(cur);
};
$('#cfgbtn').onclick=openCfg;
$('#modalbg').onclick=e=>{ if(e.target.id==='modalbg') closeCfg(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if((S.prefs.theme||'auto')==='auto'){ applyTheme(); show(cur); } });
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(cur==='cards'){
    if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); flipCard(); }
    if(flipped){ if(e.key==='1')rateCard(0); if(e.key==='2')rateCard(1); if(e.key==='3')rateCard(2); }
  }
  if(cur==='test'&&TQ&&TQ.cur){
    if(!TQ.answered){ if(e.key==='1')answerMcq(0); if(e.key==='2')answerMcq(1); if(e.key==='3')answerMcq(2); }
    else if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); nextMcq(); }
  }
  if(cur==='sim'&&curQ){
    if(e.key==='r'||e.key==='R'){ const b=$('#revealbtn'); if(b&&b.style.display!=='none') revealA(); }
    const ans=$('#answer');
    if(ans&&ans.classList.contains('on')){ if(e.key==='1')rateQ(0); if(e.key==='2')rateQ(1); if(e.key==='3')rateQ(2); }
  }
});
show('inicio');

</script>
