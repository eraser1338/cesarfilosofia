acción): es la síntesis escolástica madura. (Ladrillo de: 'El realismo moderado en la controversia medieval de los universales')"},{"id":"tc1-u082","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p13","enunciado":"Que el universal sea concepto 'cum fundamento in re' significa:","opciones":["La predicación universal es verdadera de los individuos reales","El universal subsiste realmente fuera de toda mente","El fundamento del universal es la convención de los hablantes"],"correcta":0,"explicacion":"El concepto abstraído no es arbitrario: se apoya en la esencia realmente presente en las cosas. (Ladrillo de: 'El realismo moderado en la controversia medieval de los universales')"},{"id":"tc1-u083","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p13","enunciado":"¿Qué logra el realismo moderado frente a sus rivales?","opciones":["Garantiza la teología pero renuncia a la ciencia natural","Garantiza la ciencia sin duplicar el mundo ni vaciar el concepto","Reduce la ciencia al conocimiento de los individuos singulares"],"correcta":1,"explicacion":"Evita tanto la duplicación platónica del mundo (realismo extremo) como el vaciamiento nominalista del concepto. (Ladrillo de: 'El realismo moderado en la controversia medieval de los universales')"},{"id":"tc1-u084","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p14","enunciado":"¿Cuál es el proyecto cartesiano?","opciones":["Describir el origen empírico de todas nuestras ideas","Demostrar los artículos de la fe con la silogística escolástica","Fundamentar todo el saber sobre una certeza absoluta, al modo matemático"],"correcta":2,"explicacion":"Descartes busca, contra el escepticismo, un punto arquimédico inconmovible del que deducir ordenadamente el edificio entero de la ciencia. (Ladrillo de: 'El fundamento del conocimiento en Descartes')"},{"id":"tc1-u085","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p14+tc1-p25","enunciado":"¿Qué alcance tiene la duda metódica cartesiana?","opciones":["Universal e hiperbólica: la mínima incertidumbre basta para rechazar algo","Parcial y empírica: solo afecta a los datos de los sentidos","Definitiva y escéptica: no admite superación posible"],"correcta":0,"explicacion":"Se rechaza cuanto admita la menor posibilidad de error, para quedarse solo con lo absolutamente indudable. (Ladrillo de: 'El fundamento del conocimiento en Descartes' y 'Duda y certeza en Descartes')"},{"id":"tc1-u086","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p14+tc1-p25","enunciado":"¿Cuáles son los tres niveles de la duda metódica?","opciones":["Falacias lógicas, prejuicios de la infancia, precipitación del juicio","Engaños de los sentidos, indistinción sueño/vigilia, hipótesis del genio maligno","Error de los sentidos, autoridad de la tradición, apetitos del cuerpo"],"correcta":1,"explicacion":"El genio maligno extiende la duda incluso a las matemáticas: un poder engañador podría falsear hasta las evidencias más simples. (Ladrillo de: 'El fundamento del conocimiento en Descartes' y 'Duda y certeza en Descartes')"},{"id":"tc1-u087","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p14+tc1-p25+tc1-p17","enunciado":"¿Cuál es la primera verdad que resiste la duda cartesiana?","opciones":["'Dios existe': un ser perfecto no puede engañarme","'El mundo existe': todos los hombres lo perciben","'Pienso, luego existo': dudar es pensar, y pensar exige existir"],"correcta":2,"explicacion":"El cogito, ergo sum aparece en el Discurso del método y en la Segunda Meditación como primer principio: la duda misma se convierte en prueba. (Ladrillo de: 'El fundamento del conocimiento en Descartes', 'Duda y certeza en Descartes' y 'La primera verdad en la metafísica de Descartes (el cogito)')"},{"id":"tc1-u088","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p14+tc1-p25+tc1-p17","enunciado":"¿Qué criterio de verdad extrae Descartes del cogito?","opciones":["Es verdadero cuanto se percibe con claridad y distinción","Es verdadero cuanto la mayoría admite sin disputa","Es verdadero cuanto los sentidos confirman repetidamente"],"correcta":0,"explicacion":"La forma de evidencia del cogito se erige en criterio general: todo lo percibido tan clara y distintamente como él es verdadero. (Ladrillo de: 'El fundamento del conocimiento en Descartes', 'Duda y certeza en Descartes' y 'La primera verdad en la metafísica de Descartes (el cogito)')"},{"id":"tc1-u089","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p14+tc1-p25","enunciado":"¿Qué garantiza en Descartes la validez estable del criterio de verdad?","opciones":["La evidencia inmediata del mundo exterior sensible","La veracidad de Dios, demostrado desde la idea innata de infinito","La coherencia interna del sistema deductivo mismo"],"correcta":1,"explicacion":"Sin la veracidad divina, la certeza quedaría encerrada en el instante del cogito; Dios elimina el genio maligno y funda la ciencia estable y el mundo exterior. (Ladrillo de: 'El fundamento del conocimiento en Descartes' y 'Duda y certeza en Descartes')"},{"id":"tc1-u090","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p14","enunciado":"¿Qué giro filosófico consuma el fundamento cartesiano?","opciones":["Traslada el fundamento a la experiencia sensible: empirismo","Traslada el fundamento al lenguaje: filosofía del signo","Traslada el fundamento al sujeto pensante: filosofía de la conciencia"],"correcta":2,"explicacion":"Es el giro moderno hacia la subjetividad: la certeza del yo precede a la del mundo. (Ladrillo de: 'El fundamento del conocimiento en Descartes')"},{"id":"tc1-u091","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p15","enunciado":"¿Cuál es el blanco central de la crítica de Aristóteles a Platón?","opciones":["La separación (chorismós): la esencia no puede existir fuera de la cosa","La inmortalidad del alma y su destino tras la muerte","La jerarquía de las Ideas bajo la Idea del Bien"],"correcta":0,"explicacion":"Es contradictorio que la substancia de una cosa exista separada de la cosa misma: la forma es inmanente al individuo. (Ladrillo de: 'La crítica de Aristóteles a Platón')"},{"id":"tc1-u092","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p15","enunciado":"Según Aristóteles, las Ideas platónicas:","opciones":["Explican el mundo, pero solo en su aspecto matemático","Duplican inútilmente el mundo sensible sin explicarlo","Reducen el mundo sensible a pura apariencia ilusoria"],"correcta":1,"explicacion":"Postular Ideas es 'un doblarlo todo': se añade un segundo mundo sin ganar capacidad explicativa. (Ladrillo de: 'La crítica de Aristóteles a Platón')"},{"id":"tc1-u093","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p15","enunciado":"¿Qué juzga Aristóteles de 'participación' e 'imitación'?","opciones":["Son conceptos rigurosos que anticipan la causalidad formal","Explican bien lo sensible, pero no los entes matemáticos","Son metáforas poéticas vacías, sin auténtico valor explicativo"],"correcta":2,"explicacion":"Decir que las cosas 'participan' de las Ideas no explica nada: es hablar poéticamente. (Ladrillo de: 'La crítica de Aristóteles a Platón')"},{"id":"tc1-u094","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p15","enunciado":"¿Por qué las Ideas no explican el devenir, según Aristóteles?","opciones":["Siendo inmóviles y eternas, no dan razón del movimiento ni de la generación","Siendo múltiples, no dan razón de la unidad del cosmos","Porque el devenir es una ilusión de los sentidos"],"correcta":0,"explicacion":"Aristóteles explicará el devenir con sus propios principios: materia y forma, potencia y acto, las cuatro causas. (Ladrillo de: 'La crítica de Aristóteles a Platón')"},{"id":"tc1-u095","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p16+tc1-p36+tc1-p35","enunciado":"Tesis del realismo extremo sobre los universales:","opciones":["Existen en las cosas y se universalizan después por abstracción","Son cosas que existen realmente antes e independientemente de los individuos","Son signos mentales que suplen por muchos individuos"],"correcta":1,"explicacion":"Universalia ante rem: cuanto más universal, más real; los géneros y especies poseen mayor entidad que los individuos que los ejemplifican. (Ladrillo de: 'El realismo extremo en la controversia medieval de los universales', 'Variedades del realismo en la controversia de los universales' y 'El problema de los Universales en la Edad Media (planteamiento general y soluciones)')"},{"id":"tc1-u096","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p16","enunciado":"¿De qué herencia procede el realismo extremo medieval?","opciones":["Aristotélico-tomista: las formas son inmanentes a los individuos","Estoico-nominalista: lo universal es un mero concepto","Platónico-agustiniana: las esencias subsisten como ejemplares en la mente divina"],"correcta":2,"explicacion":"Las Ideas platónicas, cristianizadas por Agustín como ejemplares divinos, alimentan la tesis de los universales subsistentes. (Ladrillo de: 'El realismo extremo en la controversia medieval de los universales')"},{"id":"tc1-u097","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p16","enunciado":"Representantes del realismo extremo:","opciones":["Escoto Eriúgena, Anselmo de Canterbury y Guillermo de Champeaux","Roscelino, Pedro Abelardo y Guillermo de Ockham","Alberto Magno, Tomás de Aquino y Duns Escoto"],"correcta":0,"explicacion":"Los tres defienden, con matices, la realidad subsistente de los universales anterior a los individuos. (Ladrillo de: 'El realismo extremo en la controversia medieval de los universales')"},{"id":"tc1-u098","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p16+tc1-p36","enunciado":"¿Qué sostenía Guillermo de Champeaux sobre la esencia común?","opciones":["Cada individuo posee una esencia numéricamente distinta pero semejante","Está toda entera e idéntica en cada individuo; estos difieren solo por accidentes","Es solo un nombre impuesto por la convención de los hablantes"],"correcta":1,"explicacion":"Es la formulación más fuerte del realismo extremo, blanco directo de la crítica de Abelardo. (Ladrillo de: 'El realismo extremo en la controversia medieval de los universales' y 'Variedades del realismo en la controversia de los universales')"},{"id":"tc1-u099","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p16+tc1-p36","enunciado":"¿Cómo refutó Abelardo el realismo extremo de Champeaux?","opciones":["La esencia idéntica impediría toda predicación universal verdadera","La esencia común no podría ser conocida por abstracción","La esencia idéntica en todos cargaría con predicados contrarios simultáneos"],"correcta":2,"explicacion":"Si la misma esencia estuviera entera en Sócrates y en Platón, estaría a la vez aquí y allí, con propiedades contrarias; Champeaux se retractó hacia la tesis de la mera indiferencia. (Ladrillo de: 'El realismo extremo en la controversia medieval de los universales' y 'Variedades del realismo en la controversia de los universales')"},{"id":"tc1-u100","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p16","enunciado":"¿Por qué fue abandonado el realismo extremo?","opciones":["Aunque servía a dogmas como el pecado original o la Trinidad, rozaba el panteísmo","Porque negaba toda posibilidad de ciencia universal","Porque fue condenado junto al averroísmo latino en 1277"],"correcta":0,"explicacion":"Una esencia común subsistente en todo amenazaba con disolver los individuos en una única realidad, peligrosamente cercana al panteísmo. (Ladrillo de: 'El realismo extremo en la controversia medieval de los universales')"},{"id":"tc1-u101","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p17","enunciado":"¿Por qué el cogito resiste incluso a la hipótesis del genio maligno?","opciones":["Porque el genio maligno solo alcanza a los datos de los sentidos","Para engañarme, el engañador necesita que yo exista mientras pienso","Porque la veracidad divina lo impide desde el principio"],"correcta":1,"explicacion":"Ni el engañador más poderoso puede hacer que yo no exista mientras pienso: el engaño mismo confirma mi existencia. (Ladrillo de: 'La primera verdad en la metafísica de Descartes (el cogito)')"},{"id":"tc1-u102","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p17","enunciado":"¿Qué naturaleza lógica tiene el cogito según Descartes?","opciones":["Silogismo cuya premisa mayor es 'todo lo que piensa existe'","Hipótesis probable confirmada por la experiencia interna","Intuición inmediata de la razón, no un silogismo"],"correcta":2,"explicacion":"Si fuera un razonamiento necesitaría esa premisa general, más dudosa que la propia certeza inmediata del yo. (Ladrillo de: 'La primera verdad en la metafísica de Descartes (el cogito)')"},{"id":"tc1-u103","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p17","enunciado":"¿Qué descubre Descartes sobre la naturaleza del yo?","opciones":["Es res cogitans: substancia pensante, distinta e independiente del cuerpo","Es un haz de percepciones en flujo y movimiento perpetuos","Es la unidad de apercepción que acompaña toda representación"],"correcta":0,"explicacion":"Del cogito se sigue que soy una cosa que piensa, cuya esencia no depende del cuerpo ni de lo material. (Ladrillo de: 'La primera verdad en la metafísica de Descartes (el cogito)')"},{"id":"tc1-u104","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p17","enunciado":"¿Qué función arquitectónica cumple el cogito en el sistema cartesiano?","opciones":["Es la conclusión final que corona el sistema deductivo","Es el cimiento desde el cual se reconstruye el saber: Dios, mundo, ciencia","Es el límite que muestra lo incognoscible para la razón"],"correcta":1,"explicacion":"Sobre la primera verdad se apoya la demostración de Dios y, con ella, la recuperación del mundo y de la ciencia. (Ladrillo de: 'La primera verdad en la metafísica de Descartes (el cogito)')"},{"id":"tc1-u105","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p18+tc1-p23","enunciado":"¿Por qué debe haber un solo método según Descartes?","opciones":["Cada ciencia exige un método propio según su objeto","El método único lo dicta la tradición de las escuelas","La razón es única e igual en todos: hay una sola ciencia"],"correcta":2,"explicacion":"Frente a la dispersión escolástica de saberes, todas las ciencias son la misma razón aplicada a objetos diversos (mathesis universalis). (Ladrillo de: 'El método de la ciencia en Descartes (razón y método)' y 'El concepto de 'razón' en la metafísica de Descartes')"},{"id":"tc1-u106","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p18","enunciado":"¿Qué modelo de saber inspira el método cartesiano?","opciones":["Las matemáticas: las únicas ciencias con cadenas de razones evidentes","La física experimental: observación, hipótesis y medida","La silogística: definición, división y demostración"],"correcta":0,"explicacion":"Solo las matemáticas han alcanzado certeza; su proceder por evidencias encadenadas debe extenderse a todo el saber. (Ladrillo de: 'El método de la ciencia en Descartes (razón y método)')"},{"id":"tc1-u107","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p18+tc1-p23","enunciado":"¿Cuáles son las dos operaciones básicas de la mente según Descartes?","opciones":["Sensación (recepción de datos) y abstracción (extracción de formas)","Intuición (captación inmediata y evidente) y deducción (encadenamiento de intuiciones)","Análisis (división de dificultades) y enumeración (revisión completa)"],"correcta":1,"explicacion":"La intuición capta naturalezas simples con evidencia; la deducción encadena esas evidencias en cadenas de razones. (Ladrillo de: 'El método de la ciencia en Descartes (razón y método)' y 'El concepto de 'razón' en la metafísica de Descartes')"},{"id":"tc1-u108","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p18","enunciado":"Primera regla del método cartesiano (evidencia):","opciones":["Dividir cada dificultad en cuantas partes sea posible","Ascender con orden de lo más simple a lo más complejo","No admitir como verdadero sino lo que se presente claro y distinto"],"correcta":2,"explicacion":"La evidencia es la regla suprema: evitar la precipitación y la prevención, admitiendo solo lo indudable. (Ladrillo de: 'El método de la ciencia en Descartes (razón y método)')"},{"id":"tc1-u109","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p18","enunciado":"Segunda regla del método cartesiano (análisis):","opciones":["Dividir cada dificultad en cuantas partes simples sea posible","Componer ordenadamente lo complejo a partir de lo simple","Hacer revisiones completas para no omitir nada"],"correcta":0,"explicacion":"El análisis descompone los problemas hasta llegar a naturalezas simples captables por intuición. (Ladrillo de: 'El método de la ciencia en Descartes (razón y método)')"},{"id":"tc1-u110","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p18","enunciado":"Tercera y cuarta reglas del método cartesiano:","opciones":["Evidencia: solo lo claro y distinto; análisis: dividir las dificultades","Síntesis: orden de lo simple a lo complejo; enumeración: revisiones completas","Duda: rechazar lo incierto; cogito: afirmar la existencia del yo"],"correcta":1,"explicacion":"La síntesis reconstruye ordenadamente lo dividido y la enumeración asegura que nada se ha omitido. (Ladrillo de: 'El método de la ciencia en Descartes (razón y método)')"},{"id":"tc1-u111","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p18","enunciado":"¿Qué reprocha Descartes a la silogística escolástica?","opciones":["Sus conclusiones no se siguen necesariamente de las premisas","Se apoya en la experiencia sensible en vez de en la razón","Solo expone lo ya sabido: no sirve para descubrir verdades nuevas"],"correcta":2,"explicacion":"El método cartesiano la sustituye porque el silogismo explica lo conocido pero no amplía el saber. (Ladrillo de: 'El método de la ciencia en Descartes (razón y método)')"},{"id":"tc1-u112","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p19","enunciado":"¿Qué es un juicio analítico según Kant?","opciones":["El predicado está contenido en el sujeto: no amplía el conocimiento","El predicado añade algo nuevo al sujeto: amplía el conocimiento","El predicado se une al sujeto por medio de la experiencia"],"correcta":0,"explicacion":"Ejemplo: 'todos los cuerpos son extensos'; solo explicita lo ya pensado en el concepto y se funda en el principio de no contradicción. (Ladrillo de: 'Los juicios sintéticos a priori en Kant')"},{"id":"tc1-u113","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p19+tc1-p28","enunciado":"Los juicios sintéticos a posteriori, según Kant:","opciones":["Amplían el conocimiento con universalidad y necesidad estrictas","Amplían el conocimiento, pero son contingentes, sin universalidad ni necesidad","No amplían el conocimiento, aunque son necesarios"],"correcta":1,"explicacion":"Los analíticos a priori no amplían el saber; los sintéticos a posteriori lo amplían pero sin necesidad: ninguno de los dos basta para la ciencia. (Ladrillo de: 'Los juicios sintéticos a priori en Kant' y 'La teoría kantiana de los juicios cognoscitivos')"},{"id":"tc1-u114","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p19+tc1-p28","enunciado":"¿En qué juicios se funda la ciencia según Kant?","opciones":["Analíticos a priori: necesarios y fundados en la no contradicción","Sintéticos a posteriori: ampliativos y confirmados por la experiencia","Sintéticos a priori: amplían el saber y son universales y necesarios"],"correcta":2,"explicacion":"Combinan las ventajas de ambos tipos: extienden el conocimiento (síntesis) con validez estricta (a priori), independiente de la experiencia. (Ladrillo de: 'Los juicios sintéticos a priori en Kant' y 'La teoría kantiana de los juicios cognoscitivos')"},{"id":"tc1-u115","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p19","enunciado":"Ejemplo kantiano de juicio sintético a priori:","opciones":["'7+5=12' o 'todo cambio tiene una causa'","'Todos los cuerpos son extensos'","'Todos los cuerpos son pesados'"],"correcta":0,"explicacion":"También 'la recta es la distancia más corta entre dos puntos'; 'los cuerpos son extensos' es analítico y 'los cuerpos son pesados', sintético a posteriori. (Ladrillo de: 'Los juicios sintéticos a priori en Kant')"},{"id":"tc1-u116","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p19","enunciado":"¿Cuál es la pregunta central de la Crítica de la razón pura?","opciones":["¿Cómo son posibles las ideas innatas en la mente?","¿Cómo son posibles los juicios sintéticos a priori?","¿Cómo derivan todas nuestras ideas de impresiones?"],"correcta":1,"explicacion":"De su respuesta depende la posibilidad de la matemática y la física puras, y la imposibilidad de la metafísica como ciencia. (Ladrillo de: 'Los juicios sintéticos a priori en Kant')"},{"id":"tc1-u117","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p19+tc1-p28","enunciado":"¿Cómo responde Kant a la posibilidad de los juicios sintéticos a priori?","opciones":["Por la armonía preestablecida entre las ideas y las cosas","Por el hábito nacido de la conjunción constante de casos","Por las formas a priori del sujeto: espacio y tiempo (matemática), categorías (física pura)"],"correcta":2,"explicacion":"La Estética trascendental responde por la matemática y la Analítica por la física pura; en la metafísica trascendente resultan imposibles. (Ladrillo de: 'Los juicios sintéticos a priori en Kant' y 'La teoría kantiana de los juicios cognoscitivos')"},{"id":"tc1-u118","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p20","enunciado":"¿A qué pregunta responde la Idea platónica (eîdos)?","opciones":["A la pregunta socrática '¿qué es X?': lo justo en sí, lo bello en sí","A la pregunta jonia por el arché material del cosmos","A la pregunta escéptica por el criterio de la verdad"],"correcta":0,"explicacion":"La Idea es la esencia universal y objetiva de las cosas: lo que algo verdaderamente es, más allá de los casos particulares. (Ladrillo de: '¿Qué es, en Platón, una 'Idea'? (la doctrina platónica de las Ideas)')"},{"id":"tc1-u119","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p20","enunciado":"¿Es la Idea platónica un contenido mental?","opciones":["Sí: es un concepto abstraído por el entendimiento","No: es una realidad subsistente, el verdadero ser","Sí: es un pensamiento eterno en la mente de Dios"],"correcta":1,"explicacion":"La Idea no es un concepto ni un contenido de la mente: existe en sí, con más realidad que lo sensible. (Ladrillo de: '¿Qué es, en Platón, una 'Idea'? (la doctrina platónica de las Ideas)')"},{"id":"tc1-u120","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p20","enunciado":"¿Qué doble origen tiene la teoría platónica de las Ideas?","opciones":["La matemática pitagórica y el flujo universal de Heráclito","El atomismo de Demócrito y la retórica de los sofistas","Las definiciones universales de Sócrates y el ser inmutable de Parménides"],"correcta":2,"explicacion":"Platón salva la ciencia situando lo estable exigido por el saber (Parménides) fuera del mundo sensible en devenir (Heráclito), como respuesta a la búsqueda socrática de definiciones. (Ladrillo de: '¿Qué es, en Platón, una 'Idea'? (la doctrina platónica de las Ideas)')"},{"id":"tc1-u121","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p20","enunciado":"¿Cómo culmina la jerarquía de las Ideas en Platón?","opciones":["En la Idea del Bien, fundamento del ser y del conocer (símil del Sol)","En la Idea de lo Uno, más allá de toda determinación","En la Idea de Hombre, medida de todas las cosas"],"correcta":0,"explicacion":"Como el sol da vida y visibilidad, el Bien da ser y cognoscibilidad a las demás Ideas (República). (Ladrillo de: '¿Qué es, en Platón, una 'Idea'? (la doctrina platónica de las Ideas)')"},{"id":"tc1-u122","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p20+tc1-p29","enunciado":"Correlación platónica entre ser y conocer:","opciones":["De lo sensible hay ciencia; de las Ideas, solo creencia razonada","De las Ideas hay ciencia (episteme); de lo sensible, solo opinión (doxa)","Ciencia y opinión versan sobre lo mismo con métodos distintos"],"correcta":1,"explicacion":"El mundo sensible, intermedio entre ser y no-ser, nunca admite ciencia estricta: a cada grado de ser corresponde un grado de conocer. (Ladrillo de: '¿Qué es, en Platón, una 'Idea'? (la doctrina platónica de las Ideas)' y 'La relación entre las Ideas y el mundo sensible en Platón')"},{"id":"tc1-u123","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p21","enunciado":"¿Qué estudia la filosofía primera de Aristóteles?","opciones":["La substancia sensible y sus movimientos naturales","Los entes matemáticos y sus relaciones necesarias","El ente en cuanto ente y sus principios y causas primeras"],"correcta":2,"explicacion":"Conocer científicamente es conocer por causas: saber por qué algo es y no puede ser de otra manera. (Ladrillo de: 'Principios y causas del ente en Aristóteles')"},{"id":"tc1-u124","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p21","enunciado":"¿Cómo se compone la substancia sensible según Aristóteles?","opciones":["De materia (indeterminada) y forma (esencia determinante): hilemorfismo","De átomos y vacío en combinaciones necesarias","De cuerpo y alma como dos substancias completas"],"correcta":0,"explicacion":"La substancia, sentido primero del ser, es compuesto hilemórfico: la forma determina a la materia. (Ladrillo de: 'Principios y causas del ente en Aristóteles')"},{"id":"tc1-u125","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p21","enunciado":"¿Cómo explican acto y potencia el devenir?","opciones":["El cambio es la sucesión regular de percepciones","El cambio es el paso de la potencia al acto","El cambio es ilusorio: el ser es inmóvil y uno"],"correcta":1,"explicacion":"Así se responde a Parménides: el ser en potencia permite que algo llegue a ser sin surgir de la nada. (Ladrillo de: 'Principios y causas del ente en Aristóteles')"},{"id":"tc1-u126","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p21","enunciado":"Las cuatro causas aristotélicas son:","opciones":["Material, espiritual, próxima y remota","Primera, segunda, instrumental y ejemplar","Material, formal, eficiente y final"],"correcta":2,"explicacion":"Responden a: de qué está hecho algo, qué es, qué agente lo produce y para qué es. (Ladrillo de: 'Principios y causas del ente en Aristóteles')"},{"id":"tc1-u127","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p21","enunciado":"¿En qué culmina la serie causal según Aristóteles?","opciones":["En el Primer Motor inmóvil: acto puro que mueve como causa final","En el Demiurgo, que ordena el mundo según las Ideas","En un Dios creador que produce el mundo desde la nada"],"correcta":0,"explicacion":"El Primer Motor no empuja: atrae como fin, siendo acto puro sin mezcla de potencia. (Ladrillo de: 'Principios y causas del ente en Aristóteles')"},{"id":"tc1-u128","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p21","enunciado":"¿Qué fundan los principios y causas en el saber aristotélico?","opciones":["La opinión: creencia probable sobre lo contingente","La ciencia: demostración necesaria de las propiedades desde la esencia","La técnica: producción de artefactos según reglas"],"correcta":1,"explicacion":"La ciencia demuestra las propiedades de las cosas a partir de su esencia y sus causas. (Ladrillo de: 'Principios y causas del ente en Aristóteles')"},{"id":"tc1-u129","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p22","enunciado":"Frente a las diez categorías aristotélicas, los estoicos:","opciones":["Las amplían a doce","Las reducen a dos: substancia y accidente","Las reducen a cuatro"],"correcta":2,"explicacion":"La simplificación responde a su ontología corporeísta y nominalista: no hay géneros del ser separados ni esencias universales reales. (Ladrillo de: 'La teoría de las categorías en el Estoicismo')"},{"id":"tc1-u130","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p22","enunciado":"Las cuatro categorías estoicas son:","opciones":["Substrato, cualidad, modo de ser y modo de ser relativo","Substancia, cantidad, cualidad y relación","Cantidad, cualidad, relación y modalidad"],"correcta":0,"explicacion":"Hypokeímenon, poión, pōs échon y prós ti pōs échon: determinaciones del cuerpo individual. (Ladrillo de: 'La teoría de las categorías en el Estoicismo')"},{"id":"tc1-u131","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p22","enunciado":"Las categorías estoicas no clasifican géneros del ser, sino:","opciones":["Formas del juicio de la lógica proposicional","Aspectos progresivamente determinados del mismo cuerpo individual","Esencias comunes participadas por los individuos"],"correcta":1,"explicacion":"No hay géneros distintos del ser: cada categoría describe con mayor determinación el mismo individuo corpóreo. (Ladrillo de: 'La teoría de las categorías en el Estoicismo')"},{"id":"tc1-u132","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p22","enunciado":"¿Qué estructura tiene la tabla categorial estoica?","opciones":["Coordinada: categorías independientes y yuxtapuestas","Deductiva: cada categoría se demuestra desde la anterior","Anidada: cada categoría incluye y determina la anterior"],"correcta":2,"explicacion":"A diferencia de la tabla aristotélica, coordinada, la estoica es una serie de determinaciones crecientes, del sustrato indeterminado a la relación. (Ladrillo de: 'La teoría de las categorías en el Estoicismo')"},{"id":"tc1-u133","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p22","enunciado":"Tesis corporeísta del estoicismo:","opciones":["Solo los cuerpos existen y actúan; las categorías describen lo real individual","Solo las almas existen; los cuerpos son sus representaciones","Cuerpos e incorporales existen por igual y actúan entre sí"],"correcta":0,"explicacion":"Lo real es corpóreo e individual: por eso las categorías no describen esencias, sino aspectos del cuerpo concreto. (Ladrillo de: 'La teoría de las categorías en el Estoicismo')"},{"id":"tc1-u134","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p22","enunciado":"¿Qué es lo universal para los estoicos?","opciones":["Un lektón incorporal que subsiste eternamente","Un mero concepto (ennóēma) sin realidad propia","Una cualidad común realmente presente en los cuerpos"],"correcta":1,"explicacion":"Este nominalismo estoico anticipa los debates medievales sobre los universales. (Ladrillo de: 'La teoría de las categorías en el Estoicismo')"},{"id":"tc1-u135","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p23","enunciado":"¿Qué afirma Descartes del 'buen sentido' o razón?","opciones":["Varía según el temperamento y la educación de cada uno","Es mayor en los sabios que en el común de los hombres","Es único e igual en todos los hombres; solo difiere su uso"],"correcta":2,"explicacion":"Así comienza el Discurso del método: la diversidad de opiniones no prueba desigualdad de razón, sino diferencia de método. (Ladrillo de: 'El concepto de 'razón' en la metafísica de Descartes')"},{"id":"tc1-u136","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p23","enunciado":"¿Cómo define Descartes la razón?","opciones":["La facultad de distinguir lo verdadero de lo falso: la 'luz natural'","La facultad de asociar ideas por semejanza y contigüidad","La facultad de inferir lo incondicionado desde lo condicionado"],"correcta":0,"explicacion":"La luz natural de la razón basta, bien conducida, para alcanzar la verdad en las ciencias. (Ladrillo de: 'El concepto de 'razón' en la metafísica de Descartes')"},{"id":"tc1-u137","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p23","enunciado":"¿En qué sentido es autónoma la razón cartesiana?","opciones":["No depende de Dios ni de garantía externa alguna","No depende de los sentidos, la tradición ni la autoridad: conoce a priori","No depende de método alguno: basta su espontaneidad"],"correcta":1,"explicacion":"Este es el núcleo del racionalismo: la razón basta, por sí sola y bien conducida, para alcanzar la verdad. (Ladrillo de: 'El concepto de 'razón' en la metafísica de Descartes')"},{"id":"tc1-u138","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p23+tc1-p24","enunciado":"Ejemplos cartesianos de ideas innatas:","opciones":["El calor, el color, el sabor y las demás cualidades sensibles","La sirena, el hipogrifo y las demás ficciones compuestas","El yo pensante, Dios (lo infinito), la extensión y las verdades matemáticas"],"correcta":2,"explicacion":"Sobre estas ideas innatas, claras y distintas, se funda la ciencia; las cualidades sensibles son adventicias y las ficciones, facticias. (Ladrillo de: 'El concepto de 'razón' en la metafísica de Descartes' y 'Las ideas innatas en el racionalismo de Descartes (el innatismo)')"},{"id":"tc1-u139","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p24","enunciado":"¿Qué tres clases de ideas distingue Descartes?","opciones":["Adventicias (venidas de fuera), facticias (construidas) e innatas (nacidas con la mente)","Simples (de sensación), complejas (de reflexión) y abstractas (generales)","Claras, oscuras y confusas, según su grado de evidencia"],"correcta":0,"explicacion":"Las adventicias y facticias son dudosas o arbitrarias; solo las innatas ofrecen la evidencia requerida por la ciencia. (Ladrillo de: 'Las ideas innatas en el racionalismo de Descartes (el innatismo)')"},{"id":"tc1-u140","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p24","enunciado":"¿De dónde proceden las ideas innatas según Descartes?","opciones":["De la experiencia temprana, luego olvidada por la mente","No de la experiencia: la razón las contiene como disposiciones naturales","De la contemplación de las Ideas antes de nacer"],"correcta":1,"explicacion":"Nacen con la mente misma: son el patrimonio a priori de la razón. (Ladrillo de: 'Las ideas innatas en el racionalismo de Descartes (el innatismo)')"},{"id":"tc1-u141","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p24","enunciado":"¿Qué prueba la idea de infinito según Descartes?","opciones":["La inmortalidad del alma: lo infinito no puede corromperse","La existencia del mundo: lo infinito debe ser extenso","La existencia de Dios: un yo finito no puede ser su causa"],"correcta":2,"explicacion":"Es el argumento de la Tercera Meditación: la causa de una idea debe tener tanta realidad como lo representado en ella; es la 'marca del artífice' en la criatura. (Ladrillo de: 'Las ideas innatas en el racionalismo de Descartes (el innatismo)')"},{"id":"tc1-u142","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p24","enunciado":"¿Qué papel juegan las ideas innatas en el sistema cartesiano?","opciones":["Sobre ellas se levanta deductivamente el edificio del saber","Sirven solo de hipótesis provisionales y revisables","Ilustran los límites infranqueables del conocimiento"],"correcta":0,"explicacion":"Es el núcleo del racionalismo: de las ideas innatas claras y distintas se deduce ordenadamente la ciencia. (Ladrillo de: 'Las ideas innatas en el racionalismo de Descartes (el innatismo)')"},{"id":"tc1-u143","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p24+tc1-p37","enunciado":"¿Qué opone Locke al innatismo cartesiano?","opciones":["Las ideas innatas existen, pero solo como disposiciones","La mente es 'papel en blanco': todo procede de la experiencia (sensación y reflexión)","La experiencia confirma las ideas innatas sin crearlas"],"correcta":1,"explicacion":"Si hubiera ideas innatas serían universalmente conocidas, y no lo son (niños, pueblos sin tales nociones): la génesis del conocimiento es empírica. (Ladrillo de: 'Las ideas innatas en el racionalismo de Descartes (el innatismo)' y 'La crítica del empirismo al racionalismo')"},{"id":"tc1-u144","tema":"Tema 6: El racionalismo: la razón como fuente de conocimiento","fuente":"pregunta:tc1-p25","enunciado":"¿En qué se diferencia la duda cartesiana de la escéptica?","opciones":["Es definitiva: se instala en la suspensión del juicio","Es parcial: respeta las verdades de fe y del sentido común","Es metódica y provisional: un instrumento para hallar lo indudable"],"correcta":2,"explicacion":"El escéptico duda para instalarse en la duda; Descartes duda para superarla y fundar la certeza. (Ladrillo de: 'Duda y certeza en Descartes')"},{"id":"tc1-u145","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p26","enunciado":"¿Cómo aplica Hume el principio de copia al 'yo'?","opciones":["No hay impresión constante e invariable de la que derive esa idea","La impresión del yo aparece en cada acto de reflexión","La idea del yo es una relación de ideas demostrable"],"correcta":0,"explicacion":"Si el yo fuera una substancia idéntica y continua, debería haber una impresión igualmente idéntica y continua; no la hay. (Ladrillo de: 'Hume y la crítica del Yo substancial')"},{"id":"tc1-u146","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p26","enunciado":"¿Qué encuentra Hume cuando se observa a sí mismo (introspección)?","opciones":["El sentimiento continuo e idéntico de la propia existencia","Solo percepciones particulares y sucesivas: calor o frío, amor u odio, dolor o placer","Una substancia pensante simple, idéntica e inmaterial"],"correcta":1,"explicacion":"Jamás se capta un yo sin percepciones, ni algo distinto de las percepciones mismas. (Ladrillo de: 'Hume y la crítica del Yo substancial')"},{"id":"tc1-u147","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p26","enunciado":"¿Qué es el yo para Hume?","opciones":["Una res cogitans distinta e independiente del cuerpo","La unidad de apercepción que acompaña toda representación","Un haz o colección de percepciones en flujo y movimiento perpetuos"],"correcta":2,"explicacion":"No hay soporte substancial de las percepciones: solo su sucesión enlazada. (Ladrillo de: 'Hume y la crítica del Yo substancial')"},{"id":"tc1-u148","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p26","enunciado":"¿Con qué compara Hume la mente?","opciones":["Con un teatro sin escenario: percepciones que se suceden sin soporte","Con un espejo que refleja fielmente el mundo exterior","Con una tablilla en la que la experiencia va escribiendo"],"correcta":0,"explicacion":"La metáfora advierte que no hay escenario permanente: solo el desfile de las percepciones. (Ladrillo de: 'Hume y la crítica del Yo substancial')"},{"id":"tc1-u149","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p26","enunciado":"¿Qué es la identidad personal según Hume?","opciones":["Una certeza intuitiva e indudable de la razón","Una ficción de la imaginación: memoria, semejanza y causalidad enlazan percepciones","Una verdad demostrada por la continuidad de la substancia"],"correcta":1,"explicacion":"Atribuimos identidad a lo que solo es sucesión relacionada, igual que hacemos con las cosas: es una propensión natural, no un conocimiento. (Ladrillo de: 'Hume y la crítica del Yo substancial')"},{"id":"tc1-u150","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p26+tc1-p37","enunciado":"¿Cómo culmina la disolución empirista de la substancia?","opciones":["Berkeley niega la substancia espiritual; Hume, solo la material","Locke niega ambas; Berkeley y Hume las restauran después","Locke la reduce a 'un no sé qué'; Berkeley niega la material; Hume, la espiritual"],"correcta":2,"explicacion":"Tras la substancia material cae la espiritual cartesiana: la crítica del yo de Hume cierra el proceso. (Ladrillo de: 'Hume y la crítica del Yo substancial' y 'La crítica del empirismo al racionalismo')"},{"id":"tc1-u151","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p27","enunciado":"¿Qué pregunta crítica plantea Kant sobre la metafísica?","opciones":["¿Puede ser ciencia, como lo son la matemática y la física?","¿Puede ser útil para la vida moral del hombre?","¿Debe sustituir a la religión revelada como saber último?"],"correcta":0,"explicacion":"Mientras las ciencias avanzan con paso seguro, la metafísica es un 'campo de batalla' de disputas interminables; Kant investiga por qué. (Ladrillo de: 'El problema de la 'cientificidad' de la metafísica en Kant')"},{"id":"tc1-u152","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p27","enunciado":"¿Por qué los objetos metafísicos no son cognoscibles según Kant?","opciones":["Son contradictorios en sí mismos y, por tanto, impensables","Alma, mundo y Dios trascienden toda experiencia: ninguna intuición los llena","Son demasiado complejos para un entendimiento finito"],"correcta":1,"explicacion":"Las categorías sin intuición sensible quedan vacías: pensar esos objetos es posible; conocerlos, no. (Ladrillo de: 'El problema de la 'cientificidad' de la metafísica en Kant')"},{"id":"tc1-u153","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p27","enunciado":"¿Dónde documenta Kant el fracaso de la metafísica dogmática?","opciones":["En la Estética trascendental: espacio y tiempo como formas puras","En la Analítica trascendental: deducción de las categorías","En la Dialéctica trascendental: paralogismos, antinomias y crítica de las pruebas de Dios"],"correcta":2,"explicacion":"Cada disciplina de la metafísica especial fracasa: psicología (paralogismos), cosmología (antinomias) y teología racional (pruebas de Dios). (Ladrillo de: 'El problema de la 'cientificidad' de la metafísica en Kant')"},{"id":"tc1-u154","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p27","enunciado":"¿Qué concluye Kant sobre la metafísica dogmática?","opciones":["No es posible como ciencia, pero subsiste como disposición natural de la razón","Es una ciencia en marcha que progresa como la física","Debe abandonarse por completo, incluso como disposición"],"correcta":0,"explicacion":"La razón no puede dejar de plantearse esas preguntas, aunque no pueda responderlas teóricamente. (Ladrillo de: 'El problema de la 'cientificidad' de la metafísica en Kant')"},{"id":"tc1-u155","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p27","enunciado":"¿Qué uso legítimo queda para la metafísica según Kant?","opciones":["Demostración teórica de Dios, la libertad y la inmortalidad","Crítica del conocimiento, uso regulativo de las Ideas y valor práctico-moral","Conocimiento místico e inmediato de lo suprasensible"],"correcta":1,"explicacion":"Kant 'suprime el saber para dejar sitio a la fe': Dios, libertad e inmortalidad reaparecen como postulados de la razón práctica. (Ladrillo de: 'El problema de la 'cientificidad' de la metafísica en Kant')"},{"id":"tc1-u156","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p28","enunciado":"¿Por qué analiza Kant los juicios para estudiar el conocimiento?","opciones":["Los juicios son hábitos psicológicos de asociación de ideas","Los juicios son actos de asentimiento a representaciones","El conocimiento se expresa en juicios: síntesis de conceptos con validez objetiva"],"correcta":2,"explicacion":"Por eso la pregunta por el conocimiento científico se convierte en la pregunta por la clase de juicios que lo componen. (Ladrillo de: 'La teoría kantiana de los juicios cognoscitivos')"},{"id":"tc1-u157","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p28","enunciado":"División kantiana de los juicios por su origen:","opciones":["A priori (universales y necesarios) y a posteriori (empíricos, contingentes)","Analíticos (explicativos) y sintéticos (extensivos)","Intuitivos (inmediatos) y demostrativos (mediatos)"],"correcta":0,"explicacion":"Los a priori son independientes de la experiencia; los a posteriori dependen de ella. (Ladrillo de: 'La teoría kantiana de los juicios cognoscitivos')"},{"id":"tc1-u158","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p28","enunciado":"División kantiana de los juicios por su contenido:","opciones":["A priori (necesarios) y a posteriori (contingentes)","Analíticos (el predicado está en el sujeto) y sintéticos (añaden algo)","Verdaderos (conformes al objeto) y falsos (disconformes)"],"correcta":1,"explicacion":"Los analíticos son explicativos; los sintéticos, extensivos: amplían el conocimiento. (Ladrillo de: 'La teoría kantiana de los juicios cognoscitivos')"},{"id":"tc1-u159","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p29","enunciado":"Dualismo ontológico platónico:","opciones":["Substancia pensante frente a substancia extensa","Materia y forma como coprincipios del individuo","Mundo inteligible de las Ideas (verdadero ser) frente a mundo sensible (devenir, copia)"],"correcta":2,"explicacion":"El mundo sensible es copia del inteligible: dos órdenes de realidad de distinto rango ontológico. (Ladrillo de: 'La relación entre las Ideas y el mundo sensible en Platón')"},{"id":"tc1-u160","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p29","enunciado":"En el Timeo, ¿cómo se ordena el mundo sensible?","opciones":["El Demiurgo lo ordena tomando las Ideas como modelos eternos sobre la materia","Dios lo crea desde la nada según su libre voluntad","Surge por emanación necesaria desde el Uno"],"correcta":0,"explicacion":"El Demiurgo no crea: ordena una materia preexistente mirando a las Ideas como paradigmas. (Ladrillo de: 'La relación entre las Ideas y el mundo sensible en Platón')"},{"id":"tc1-u161","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p29","enunciado":"Los cuatro grados del símil de la línea son:","opciones":["Sensación, imaginación, memoria y experiencia","Eikasía, pístis, diánoia y nóesis","Impresión, idea, creencia y hábito"],"correcta":1,"explicacion":"A imágenes y cosas sensibles corresponde opinión (doxa); a entes matemáticos e Ideas, ciencia (episteme): el conocer copia la estructura del ser. (Ladrillo de: 'La relación entre las Ideas y el mundo sensible en Platón')"},{"id":"tc1-u162","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p30","enunciado":"¿Cuáles son los objetos del conocimiento a priori en Platón?","opciones":["Las cosas sensibles y sus imágenes reflejadas","Los primeros principios captados por inducción","Las Ideas y las verdades matemáticas, necesarias e inmutables"],"correcta":2,"explicacion":"Solo lo necesario e inmutable puede conocerse a priori, con independencia de la experiencia. (Ladrillo de: 'El conocimiento a priori en Platón')"},{"id":"tc1-u163","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p30","enunciado":"¿En qué se distingue la dialéctica platónica de la diánoia matemática?","opciones":["Asciende sin apoyo sensible hasta el principio anhipotético, solo entre Ideas","Parte de hipótesis y se sirve de figuras visibles","Desciende del principio a las conclusiones mediante silogismos"],"correcta":0,"explicacion":"A diferencia de la diánoia, que parte de hipótesis y usa figuras, la nóesis dialéctica se mueve puramente entre Ideas. (Ladrillo de: 'El conocimiento a priori en Platón')"},{"id":"tc1-u164","tema":"Tema 1: Platón: las Ideas y los diversos tipos de conocimiento","fuente":"pregunta:tc1-p30","enunciado":"¿Qué tradición inaugura el apriorismo platónico?","opciones":["La empirista: Locke, Berkeley, Hume","La racionalista e innatista: Agustín, Descartes, Leibniz","La nominalista: Roscelino, Ockham, Hobbes"],"correcta":1,"explicacion":"La confianza en un saber independiente de la experiencia reaparecerá en el racionalismo moderno. (Ladrillo de: 'El conocimiento a priori en Platón')"},{"id":"tc1-u165","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p31","enunciado":"¿Qué es la lógica para Aristóteles?","opciones":["Una de las tres partes de la filosofía, junto a física y ética","La ciencia suprema del ente en cuanto ente","El Órganon: instrumento previo de toda ciencia, que estudia las formas válidas del pensar"],"correcta":2,"explicacion":"No es una ciencia más sino la herramienta común: analiza el discurso demostrativo con independencia de su contenido. (Ladrillo de: 'La Lógica en Aristóteles')"},{"id":"tc1-u166","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p31","enunciado":"Elementos de la lógica aristotélica y sus tratados:","opciones":["Término (Categorías), proposición (De interpretatione), razonamiento (Analíticos)","Concepto (Tópicos), juicio (Retórica), silogismo (Categorías)","Signo, lektón y axíoma, según la dialéctica"],"correcta":0,"explicacion":"Del concepto se pasa al juicio y de este al razonamiento: es el orden de los tratados del Órganon. (Ladrillo de: 'La Lógica en Aristóteles')"},{"id":"tc1-u167","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p31","enunciado":"¿Qué es el silogismo aristotélico?","opciones":["De la conjunción repetida de casos se infiere una ley general","De dos premisas con un término medio se sigue necesariamente la conclusión","De un condicional y su antecedente se sigue el consecuente"],"correcta":1,"explicacion":"Ejemplo canónico: todo hombre es mortal, Sócrates es hombre, luego Sócrates es mortal; la necesidad es formal, depende de la estructura. (Ladrillo de: 'La Lógica en Aristóteles')"},{"id":"tc1-u168","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p31","enunciado":"¿Qué exige el silogismo científico o demostración?","opciones":["Premisas probables admitidas por la mayoría o por los sabios","Premisas hipotéticas confirmadas por sus consecuencias","Premisas verdaderas, primeras, inmediatas y causales"],"correcta":2,"explicacion":"Así lo establecen los Analíticos segundos: la ciencia es silogismo demostrativo desde principios causales. (Ladrillo de: 'La Lógica en Aristóteles')"},{"id":"tc1-u169","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p31","enunciado":"¿Cómo se conocen los primeros principios según Aristóteles?","opciones":["No se demuestran: se captan por inducción y noûs","Se demuestran a partir de principios aún más altos","Son innatos: el alma los trae de una existencia anterior"],"correcta":0,"explicacion":"Toda demostración acabaría en regreso infinito si no hubiera principios evidentes (no contradicción, tercero excluido) captados intelectualmente desde la experiencia. (Ladrillo de: 'La Lógica en Aristóteles')"},{"id":"tc1-u170","tema":"Tema 2: Aristóteles: conocimiento sensible y conocimiento intelectual","fuente":"pregunta:tc1-p31","enunciado":"La lógica aristotélica es de términos y clases; ¿quién la complementó?","opciones":["Los epicúreos, con la canónica de las sensaciones","Los estoicos, con la lógica de proposiciones","Los megáricos, con la teoría de la suposición"],"correcta":1,"explicacion":"La lógica proposicional estoica añade las inferencias entre enunciados completos a la silogística de términos. (Ladrillo de: 'La Lógica en Aristóteles')"},{"id":"tc1-u171","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p32","enunciado":"¿Qué es el juicio para los estoicos?","opciones":["La síntesis de un sujeto y un predicado en la proposición","La abstracción de la forma común de varias imágenes","El asentimiento (synkatáthesis) que la razón otorga a una representación"],"correcta":2,"explicacion":"Conocer no es solo recibir representaciones sino aprobarlas: el juicio añade el acto voluntario del asentimiento. (Ladrillo de: 'La teoría del juicio en el Estoicismo')"},{"id":"tc1-u172","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p32","enunciado":"¿En qué consiste el error según los estoicos?","opciones":["En asentir a representaciones no comprensivas","En recibir representaciones falsas de los sentidos","En suspender el juicio ante la evidencia"],"correcta":0,"explicacion":"El asentimiento es libre y voluntario: de ahí la dimensión moral del conocimiento estoico; el sabio disciplina su asentimiento y no opina jamás. (Ladrillo de: 'La teoría del juicio en el Estoicismo')"},{"id":"tc1-u173","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p32","enunciado":"¿Cuál es el contenido del juicio estoico?","opciones":["Una imagen mental copiada de la impresión sensible","Un lektón completo: el axíoma o proposición, portador de verdad o falsedad","Un concepto universal abstraído de los individuos"],"correcta":1,"explicacion":"Lo que se afirma o niega es el significado completo (axíoma), único portador de verdad o falsedad. (Ladrillo de: 'La teoría del juicio en el Estoicismo')"},{"id":"tc1-u174","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p32","enunciado":"¿Qué es la ciencia para los estoicos?","opciones":["Un conjunto de demostraciones desde primeros principios evidentes","Una opinión verdadera acompañada de explicación racional","Un sistema de aprehensiones firmes e inconmovibles ante la razón, propio del sabio"],"correcta":2,"explicacion":"La katálēpsis firme, que ningún argumento puede remover, distingue al sabio del que meramente opina. (Ladrillo de: 'La teoría del juicio en el Estoicismo')"},{"id":"tc1-u175","tema":"Tema 3: La instrumentalización del conocimiento en las filosofías helenísticas y romanas","fuente":"pregunta:tc1-p32","enunciado":"¿Qué opone el escepticismo académico al estoicismo?","opciones":["Niega que exista representación comprensiva y recomienda la epoché","Niega el asentimiento pero conserva el criterio de verdad","Acepta la representación comprensiva pero niega la ciencia"],"correcta":0,"explicacion":"Si ninguna representación garantiza su verdad, lo razonable es suspender el juicio (epoché). (Ladrillo de: 'La teoría del juicio en el Estoicismo')"},{"id":"tc1-u176","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p33","enunciado":"¿Qué problema resuelve la doctrina agustiniana de la iluminación?","opciones":["Cómo el alma recuerda lo contemplado antes de nacer","Cómo una mente mudable y finita conoce verdades eternas e inmutables","Cómo la fe puede demostrarse con argumentos racionales"],"correcta":1,"explicacion":"Ni los sentidos ni la mente cambiante pueden ser su origen: las verdades eternas (matemáticas, morales) superan a su poseedor. (Ladrillo de: 'La doctrina de la 'iluminación' en San Agustín')"},{"id":"tc1-u177","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p33","enunciado":"¿En qué consiste la iluminación según San Agustín?","opciones":["El entendimiento agente ilumina las imágenes sensibles","La razón natural se basta para alcanzar las verdades eternas","Dios ilumina la mente: vemos las verdades eternas en la luz divina"],"correcta":2,"explicacion":"Como el ojo ve en la luz del sol, la mente conoce las verdades inmutables en la luz de Dios. (Ladrillo de: 'La doctrina de la 'iluminación' en San Agustín')"},{"id":"tc1-u178","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p33+tc1-p34","enunciado":"¿Qué transformación cristiana sufren las Ideas platónicas?","opciones":["Pasan a ser ejemplares eternos en la mente de Dios","Pasan a ser formas inmanentes a las criaturas","Quedan reducidas a conceptos de la mente humana"],"correcta":0,"explicacion":"Agustín acoge la teoría de las Ideas pero les niega subsistencia autónoma: son los pensamientos creadores divinos; es la vía platónico-agustiniana de la teología medieval. (Ladrillo de: 'La doctrina de la 'iluminación' en San Agustín' y 'Adaptaciones del platonismo y el aristotelismo en la teología medieval')"},{"id":"tc1-u179","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p33","enunciado":"¿Qué doctrina platónica sustituye Agustín por la iluminación?","opciones":["La participación: las cosas dejan de depender de las Ideas","La reminiscencia: no hay preexistencia del alma, sino Maestro interior presente","La dialéctica: el ascenso racional cede ante la mística"],"correcta":1,"explicacion":"No hay recuerdo de una vida anterior: hay iluminación presente del Maestro interior. (Ladrillo de: 'La doctrina de la 'iluminación' en San Agustín')"},{"id":"tc1-u180","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p33","enunciado":"¿Qué camino propone Agustín hacia la verdad?","opciones":["Observación: la verdad se lee en el libro de la naturaleza","Abstracción: la verdad se extrae de los datos sensibles","Interiorización: 'no salgas fuera, vuelve a ti; en el interior del hombre habita la verdad'"],"correcta":2,"explicacion":"Conocer es ascender hacia Dios volviéndose hacia el propio interior. (Ladrillo de: 'La doctrina de la 'iluminación' en San Agustín')"},{"id":"tc1-u181","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p34","enunciado":"¿Qué esquema neoplatónico reinterpreta la teología medieval?","opciones":["Emanación y retorno, releídos como creación y salvación","Potencia y acto, releídos como pecado y gracia","Reminiscencia y olvido, releídos como caída y redención"],"correcta":0,"explicacion":"Así lo hacen autores como Escoto Eriúgena y Anselmo, dentro de la vía platónico-agustiniana. (Ladrillo de: 'Adaptaciones del platonismo y el aristotelismo en la teología medieval')"},{"id":"tc1-u182","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p34","enunciado":"¿Cómo se recibe Aristóteles en el Occidente latino del siglo XIII?","opciones":["A través de Bizancio: Focio y Miguel Pselo","A través de los árabes: Avicena y Averroes","Directamente: nunca dejó de leerse completo en latín"],"correcta":1,"explicacion":"Tomás adapta entonces el hilemorfismo, el acto/potencia y el motor inmóvil: las cinco vías reelaboran argumentos aristotélicos. (Ladrillo de: 'Adaptaciones del platonismo y el aristotelismo en la teología medieval')"},{"id":"tc1-u183","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p34","enunciado":"Correcciones cristianas obligadas al aristotelismo:","opciones":["Eternidad del mundo, entendimiento único, doble verdad","Emanación necesaria, alma del mundo, ciclos cósmicos","Creación desde la nada, mundo no eterno, providencia, alma individual inmortal"],"correcta":2,"explicacion":"La revelación impone estos ajustes al contenido de la filosofía griega adoptada. (Ladrillo de: 'Adaptaciones del platonismo y el aristotelismo en la teología medieval')"},{"id":"tc1-u184","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p34","enunciado":"¿Qué ocurrió con el aristotelismo radical (averroísmo latino)?","opciones":["Fue condenado en 1277 por tesis como la eternidad del mundo y el entendimiento único","Fue asumido por Tomás de Aquino en su síntesis teológica","Fue refutado por Ockham mediante el principio de economía"],"correcta":0,"explicacion":"Las tesis averroístas, contrarias al dogma, provocaron la condena del obispo de París en 1277. (Ladrillo de: 'Adaptaciones del platonismo y el aristotelismo en la teología medieval')"},{"id":"tc1-u185","tema":"Tema 4: Fe y razón como fuentes de conocimiento en la alta Edad Media","fuente":"pregunta:tc1-p34","enunciado":"¿Qué dos grandes síntesis rivales estructuran la escolástica?","opciones":["El nominalismo parisino y el realismo oxoniense","El agustinismo franciscano y el aristotelismo dominico","El tomismo jesuita y el escotismo benedictino"],"correcta":1,"explicacion":"La adaptación del platonismo y la del aristotelismo cristalizan en estas dos grandes corrientes. (Ladrillo de: 'Adaptaciones del platonismo y el aristotelismo en la teología medieval')"},{"id":"tc1-u186","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p35","enunciado":"¿Dónde se origina el problema medieval de los universales?","opciones":["En las Categorías de Aristóteles, comentadas por Averroes","En el Parménides de Platón, traducido por Eriúgena","En la Isagoge de Porfirio, transmitida y comentada por Boecio"],"correcta":2,"explicacion":"Porfirio formula las preguntas sobre géneros y especies y las deja sin responder; Boecio las lega a la Edad Media como problema abierto. (Ladrillo de: 'El problema de los Universales en la Edad Media (planteamiento general y soluciones)')"},{"id":"tc1-u187","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p35","enunciado":"Las tres preguntas de Porfirio sobre los géneros y especies:","opciones":["¿Subsisten o son conceptos? ¿Corpóreos o incorpóreos? ¿Separados o en lo sensible?","¿Son eternos o creados? ¿Divinos o humanos? ¿Uno o múltiples?","¿Se demuestran o se intuyen? ¿Son signos o cosas? ¿Innatos o adquiridos?"],"correcta":0,"explicacion":"De las respuestas a estas tres preguntas nacen el realismo extremo, el moderado y el nominalismo. (Ladrillo de: 'El problema de los Universales en la Edad Media (planteamiento general y soluciones)')"},{"id":"tc1-u188","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p35","enunciado":"¿Qué trasfondo hace grave el problema de los universales?","opciones":["El dogma: la Iglesia había definido la naturaleza de los universales","La herencia clásica: la ciencia versa sobre esencias universales y necesarias","La lógica nueva: el silogismo exigía términos singulares"],"correcta":1,"explicacion":"Según la tradición platónico-aristotélica, sin esencias universales la ciencia pierde su objeto propio. (Ladrillo de: 'El problema de los Universales en la Edad Media (planteamiento general y soluciones)')"},{"id":"tc1-u189","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p35","enunciado":"¿Qué está en juego en la controversia de los universales?","opciones":["Solo una cuestión gramatical sin consecuencias doctrinales","La autoridad de Platón frente a la de los Padres de la Iglesia","El valor de la ciencia y dogmas teológicos; el triunfo nominalista anuncia la modernidad"],"correcta":2,"explicacion":"Si no hay esencias universales reales, la ciencia de lo universal pierde su objeto clásico y el saber se reorienta hacia lo empírico-singular. (Ladrillo de: 'El problema de los Universales en la Edad Media (planteamiento general y soluciones)')"},{"id":"tc1-u190","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p36","enunciado":"¿Qué comparte toda forma de realismo sobre los universales?","opciones":["Que tienen realidad extramental: no son meros nombres o conceptos vacíos","Que subsisten separados, anteriores a los individuos","Que existen únicamente en la mente divina"],"correcta":0,"explicacion":"El realismo, extremo o moderado, se opone al nominalismo: lo universal tiene algún tipo de realidad fuera de la mente. (Ladrillo de: 'Variedades del realismo en la controversia de los universales')"},{"id":"tc1-u191","tema":"Tema 5: La controversia de los universales y la concepción del saber hasta el final de la Edad Media","fuente":"pregunta:tc1-p36","enunciado":"Diferencia clave entre realismo extremo y realismo moderado:","opciones":["Negación frente a afirmación de la realidad de los individuos","Subsistencia separada del universal frente a fundamento real más abstracción","Origen divino frente a origen humano del lenguaje universal"],"correcta":1,"explicacion":"El extremo hace subsistir al universal antes de las cosas; el moderado lo funda en las cosas y lo universaliza en la mente. (Ladrillo de: 'Variedades del realismo en la controversia de los universales')"},{"id":"tc1-u192","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p37","enunciado":"Resultado de la crítica empirista al racionalismo:","opciones":["La razón conoce a priori el mundo, pero solo en matemáticas","La experiencia termina confirmando las tesis metafísicas racionalistas","La razón no puede conocer a priori el mundo; las tesis metafísicas quedan injustificadas"],"correcta":2,"explicacion":"Las tesis racionalistas sobre Dios, el alma y el mundo carecen de justificación empírica o demostrativa. (Ladrillo de: 'La crítica del empirismo al racionalismo')"},{"id":"tc1-u193","tema":"Tema 7: El empirismo: la experiencia como origen del conocimiento","fuente":"pregunta:tc1-p37","enunciado":"¿En qué desemboca la crítica empirista de Hume?","opciones":["En un escepticismo mitigado que prepara la síntesis crítica de Kant","En un idealismo absoluto que niega el mundo exterior","En un dogmatismo renovado de la razón pura"],"correcta":0,"explicacion":"Kant reconocerá que Hume lo despertó del 'sueño dogmático': ni todo viene de la experiencia ni el a priori es eliminable. (Ladrillo de: 'La crítica del empirismo al racionalismo')"},{"id":"tc1-u194","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p38+tc1-p39","enunciado":"¿Qué estudia la Analítica trascendental?","opciones":["La razón y sus Ideas: la ilusión trascendental","El entendimiento y sus conceptos puros como condiciones de la experiencia","La sensibilidad y sus formas puras: espacio y tiempo"],"correcta":1,"explicacion":"Es la 'lógica de la verdad': expone categorías y principios del entendimiento como condiciones de posibilidad de la experiencia. (Ladrillo de: 'La Analítica transcendental en Kant' y 'La Lógica transcendental en Kant')"},{"id":"tc1-u195","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p38","enunciado":"¿Qué contiene la Analítica de los principios?","opciones":["La tabla de los juicios y la deducción metafísica","Los paralogismos y las antinomias de la razón","El esquematismo y los principios puros del entendimiento"],"correcta":2,"explicacion":"Los principios son los axiomas de la intuición, las anticipaciones de la percepción, las analogías de la experiencia y los postulados del pensar empírico. (Ladrillo de: 'La Analítica transcendental en Kant')"},{"id":"tc1-u196","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p38","enunciado":"¿Cómo caracteriza Kant al entendimiento frente a la sensibilidad?","opciones":["Espontaneidad que unifica lo dado: 'intuiciones sin conceptos son ciegas'","Receptividad pura que acoge lo dado en la intuición","Facultad de lo incondicionado más allá de la experiencia"],"correcta":0,"explicacion":"La sensibilidad recibe; el entendimiento unifica espontáneamente lo recibido mediante las categorías. (Ladrillo de: 'La Analítica transcendental en Kant')"},{"id":"tc1-u197","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p38","enunciado":"¿Qué fundamenta la Analítica trascendental y cómo concluye?","opciones":["La matemática pura; concluye refutando el idealismo","La física pura (substancia, causalidad a priori); concluye distinguiendo fenómeno y noúmeno","La metafísica especial; concluye con las tres Ideas de la razón"],"correcta":1,"explicacion":"Substancia y causalidad quedan legitimadas como leyes a priori de la naturaleza, válidas solo para fenómenos. (Ladrillo de: 'La Analítica transcendental en Kant')"},{"id":"tc1-u198","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p39","enunciado":"¿Qué estudia la Lógica trascendental de Kant?","opciones":["Las reglas formales del pensar, sin atención a objeto alguno","Las formas puras de la sensibilidad y su idealidad","Origen, alcance y validez objetiva de los conocimientos a priori del entendimiento y la razón"],"correcta":2,"explicacion":"Examina cómo el entendimiento y la razón pueden referirse a priori a objetos. (Ladrillo de: 'La Lógica transcendental en Kant')"},{"id":"tc1-u199","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p39","enunciado":"¿En qué se distingue la lógica trascendental de la lógica formal?","opciones":["No prescinde de todo contenido: atiende a la referencia a priori a objetos","Prescinde de todo contenido y estudia solo la forma del juicio","Estudia el contenido empírico de los conceptos científicos"],"correcta":0,"explicacion":"La lógica general abstrae de la relación con el objeto; la trascendental examina cómo conceptos puros pueden referirse a priori a objetos. (Ladrillo de: 'La Lógica transcendental en Kant')"},{"id":"tc1-u200","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p39","enunciado":"¿Cómo se divide la Lógica trascendental?","opciones":["En Estética (sensibilidad) y Analítica (entendimiento)","En Analítica (lógica de la verdad) y Dialéctica (lógica de la ilusión)","En deducción metafísica y deducción trascendental"],"correcta":1,"explicacion":"La Analítica estudia el uso legítimo del entendimiento; la Dialéctica, la ilusión de la razón. (Ladrillo de: 'La Lógica transcendental en Kant')"},{"id":"tc1-u201","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p39","enunciado":"Dentro de la Lógica trascendental, ¿a quién critica la Dialéctica?","opciones":["Al entendimiento cuando aplica categorías a los fenómenos","A la sensibilidad cuando confunde el espacio con el tiempo","A la razón cuando traspasa la experiencia: Ideas de alma, mundo y Dios"],"correcta":2,"explicacion":"El uso de las categorías dentro de la experiencia es legítimo; la ilusión nace al buscar lo incondicionado. (Ladrillo de: 'La Lógica transcendental en Kant')"},{"id":"tc1-u202","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p39+tc1-p41","enunciado":"¿Cuáles son las dos fuentes cooperantes del conocimiento en Kant?","opciones":["Sensibilidad (intuiciones bajo espacio y tiempo) y entendimiento (conceptos, categorías)","Razón e imaginación: las Ideas y los esquemas trascendentales","Percepción y memoria: impresiones presentes e ideas derivadas"],"correcta":0,"explicacion":"Del primer tronco vienen las intuiciones, del segundo los conceptos; solo su unión produce conocimiento objetivo. (Ladrillo de: 'La Lógica transcendental en Kant' y 'El fundamento del conocimiento en Kant')"},{"id":"tc1-u203","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p40+tc1-p41","enunciado":"¿En qué consiste el 'giro copernicano' de Kant?","opciones":["El conocimiento se rige por los objetos tal como son en sí","Los objetos se rigen por nuestro conocimiento, no el conocimiento por los objetos","El sujeto empírico crea la materia misma de la sensación"],"correcta":1,"explicacion":"Como Copérnico invirtió la relación sol-tierra, Kant invierte la relación sujeto-objeto para explicar el a priori de la ciencia. (Ladrillo de: 'La relación sujeto/objeto en Kant' y 'El fundamento del conocimiento en Kant')"},{"id":"tc1-u204","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p40","enunciado":"En Kant, el objeto de conocimiento es en parte construido:","opciones":["El sujeto pone la materia; la experiencia da la forma","Materia y forma proceden ambas de la cosa en sí","La sensación da la materia; el sujeto pone la forma"],"correcta":2,"explicacion":"Lo dado se ordena bajo las formas a priori (espacio, tiempo, categorías) que el sujeto aporta. (Ladrillo de: 'La relación sujeto/objeto en Kant')"},{"id":"tc1-u205","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p40","enunciado":"¿Qué es el sujeto trascendental kantiano?","opciones":["La estructura universal y necesaria del conocer, no el yo psicológico individual","El yo psicológico individual con sus vivencias particulares","El alma substancial demostrada por la psicología racional"],"correcta":0,"explicacion":"Espacio, tiempo, categorías y apercepción son estructuras idénticas en todo sujeto racional. (Ladrillo de: 'La relación sujeto/objeto en Kant')"},{"id":"tc1-u206","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p40+tc1-p41","enunciado":"¿Qué conocemos según Kant y cuál es el límite?","opciones":["Fenómenos y, mediante las Ideas, también las cosas en sí","Solo fenómenos: la cosa en sí resulta incognoscible","Las cosas en sí, pues los fenómenos son mera ilusión"],"correcta":1,"explicacion":"El objeto solo es objeto dentro de las condiciones de la experiencia: el mismo fundamento que hace posible la ciencia prohíbe la metafísica trascendente. (Ladrillo de: 'La relación sujeto/objeto en Kant' y 'El fundamento del conocimiento en Kant')"},{"id":"tc1-u207","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p40","enunciado":"El idealismo trascendental de Kant es compatible con:","opciones":["El idealismo empírico: cada sujeto construye su mundo privado","El realismo trascendental: conocemos las cosas en sí mismas","El realismo empírico: los fenómenos son plenamente objetivos para todo sujeto"],"correcta":2,"explicacion":"La objetividad no desaparece: se redefine como validez universal fundada en estructuras idénticas en todos los sujetos. (Ladrillo de: 'La relación sujeto/objeto en Kant')"},{"id":"tc1-u208","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p40","enunciado":"'Los conceptos sin intuiciones son vacíos; las intuiciones sin conceptos, ciegas' expresa:","opciones":["La superación de racionalismo y empirismo: sensibilidad y entendimiento cooperan","La primacía de la sensibilidad sobre el entendimiento","La reducción del conocimiento a las formas lógicas puras"],"correcta":0,"explicacion":"Ni la razón sola (racionalismo) ni la experiencia sola (empirismo): el conocimiento exige la cooperación de ambas fuentes. (Ladrillo de: 'La relación sujeto/objeto en Kant')"},{"id":"tc1-u209","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p41","enunciado":"¿Dónde sitúa Kant el fundamento último del conocimiento?","opciones":["En el objeto exterior que causa nuestras representaciones","En el sujeto trascendental y sus formas a priori, no en el objeto","En Dios, garante de la correspondencia entre ideas y cosas"],"correcta":1,"explicacion":"Es la primera teoría idealista del conocimiento: las condiciones del saber son estructuras del sujeto racional humano. (Ladrillo de: 'El fundamento del conocimiento en Kant')"},{"id":"tc1-u210","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p41+tc1-p38","enunciado":"¿Cuál es el fundamento supremo de la unidad del conocimiento en Kant?","opciones":["La substancia pensante descubierta mediante el cogito","El esquema trascendental producido por la imaginación","La unidad trascendental de apercepción: el 'yo pienso' que acompaña toda representación"],"correcta":2,"explicacion":"Toda representación debe poder ser acompañada por el 'yo pienso': esa unidad fundamenta la validez objetiva de las categorías. (Ladrillo de: 'El fundamento del conocimiento en Kant' y 'La Analítica transcendental en Kant')"},{"id":"tc1-u211","tema":"Tema 8: El planteamiento trascendental de Kant","fuente":"pregunta:tc1-p41+tc1-p27","enunciado":"¿En qué consiste el conocimiento legítimo según Kant?","opciones":["Juicios sintéticos a priori aplicados a la experiencia posible","Juicios analíticos fundados en la no contradicción","Ideas de la razón aplicadas a lo incondicionado"],"correcta":0,"explicacion":"Esa es también la condición de toda ciencia: por eso la metafísica, cuyos objetos exceden la experiencia, no la cumple. (Ladrillo de: 'El fundamento del conocimiento en Kant' y 'El problema de la 'cientificidad' de la metafísica en Kant')"}]},{"id":"antigua1","nombre":"Historia de la Filosofía Antigua I","nombreCorto":"Fil. Antigua","formatoExamen":"Examen de desarrollo con 2 preguntas, 120 minutos, sin ningún material permitido. Parte 1: elegir 1 cuestión entre 3 propuestas del temario (puede incluir comentario de texto). Parte 2: 'pregunta autoformulada', un tema libre del programa preparado de antemano por el estudiante. Cada parte puntúa de 1 a 5 (total 10); hay que responder equilibradamente a ambas y no pueden pertenecer al mismo bloque del temario. La PEC (ensayo de ~10 págs.) es opcional y solo puede sumar hasta 1 punto si el examen está aprobado.","temas":["Tema I: El nacimiento de la filosofía en Grecia. Viaje al inicio de Occidente (Mileto: Tales, Anaximandro, Anaxím
